# =====================================================================================
#  12_maintenance.cfg - calibration & maintenance (all macros also in Mainsail)
#  -----------------------------------------------------------------------------------
#  Contains (standard community names):
#   TUNE_PID                         : MANUAL PID tuning any time (hotend WITH fan)
#   CALIBRATE_MESH / LOAD_BED_MESH   : bed mesh (KAMP-aware, one 'r2' profile)
#   CALIBRATE_PA / PA_RESULT         : pressure advance line test (Orca style) + calculator
#   CALIBRATE_SHAPER / DUMP_RESONANCES: input shaper calibration (accelerometer)
#   SAVE_MESH_AT_TEMP / MESH_BY_INDEX / UNLOAD_MESH : bed mesh management
#   LEVEL_BED_SCREWS                 : bed screw alignment via probe (SCREWS_TILT_CALCULATE)
#   CALIBRATE_PROBE_OFFSET           : probe Z-offset calibration (paper method)
#   CALIBRATE_EXTRUDER               : extruder steps calibration (mark & measure)
#   TEST_RETRACTION                  : firmware retraction test (G10/G11)
#   LOAD_FILAMENT / UNLOAD_FILAMENT  : manual load/unload (heats if needed)
#   SELF_TEST                        : sound + sensor + probe test
# =====================================================================================

# -------------------------------------------------------------------------------------
# _RUN_PID_TUNE - PID calibration of ONE heater with announcements and sound
#   _RUN_PID_TUNE HEATER=extruder TARGET=215 FAN=1 AUTOSAVE=1
#   FAN=1: part fan on (hotend PID should match the printing situation!)
#   AUTOSAVE=1: SAVE_CONFIG after tuning (Klipper restarts once!)
# -------------------------------------------------------------------------------------
[gcode_macro _RUN_PID_TUNE]
gcode:
    {% set heater = params.HEATER|default('extruder') %}
    {% set target = params.TARGET|default(210)|float %}
    {% set autosave = params.AUTOSAVE|default(1)|int == 1 %}
    {% set fanpct = params.FAN|default(printer['save_variables'].variables.pid_fan_percent|default(100))|float %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pid_running VALUE=True
    _SOUND_LIB NAME=r2_pid
    NOTIFY TEXT="PID tuning {heater} at {target|round|int}C (takes a few minutes)" LEVEL=info
    {% if heater == 'extruder' and fanpct > 0 %}
        M99106 S{(fanpct * 2.55)|round|int}   # part fan like during a print (LCD %) -> realistic PID
    {% endif %}
    PID_CALIBRATE HEATER={heater} TARGET={target|round}
    {% if heater == 'extruder' %}M99106 S0{% endif %}
    NOTIFY TEXT="PID tuning done: {heater} @ {target|round|int}C" LEVEL=ok SOUND=r2_done
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pid_running VALUE=False
    {% if autosave %}
        NOTIFY TEXT="Saving config (Klipper restarts once)" LEVEL=info SOUND=r2_confirm
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="PID values calculated - run SAVE_CONFIG to store them permanently"
    {% endif %}

# -------------------------------------------------------------------------------------
# TUNE_PID - public wrapper (e.g. TUNE_PID HEATER=extruder TARGET=215)
# -------------------------------------------------------------------------------------
[gcode_macro TUNE_PID]
description: PID tune one heater (TUNE_PID HEATER=extruder TARGET=215 FAN=100 = fan %)
gcode:
    _RUN_PID_TUNE HEATER={params.HEATER|default('extruder')} TARGET={params.TARGET|default(210)} FAN={params.FAN|default(-1)} AUTOSAVE={params.AUTOSAVE|default(1)}

# -------------------------------------------------------------------------------------
# HOST_CHECK - Pi health report: throttle/undervoltage flags, CPU temp, load,
# RAM, disk. R75 answer to the .58 field log: 'Timer too close' MCU shutdowns
# are ALWAYS a host problem - undervoltage (CPU throttles down), overheating
# or an overloaded/dying SD card. vcgencmd records all of them; this makes
# the counters visible on the LCD/console (the r2-postproc watcher runs the
# actual diagnostics and reports back via RESPOND).
# R78 (.61 field log: 187MB swap after only 25 min uptime, load 0.5, Throttle
# NONE): the report now also NAMES the processes sitting in the swap (VmSwap
# per process), lists the systemd service states (klipper/moonraker/avahi/
# crowsnest/sonar/OctoEverywhere/pigpiod) and filters the ps measurement
# artifacts out of the top lists ('Top CPU: ps 100%' was the ps itself).
# -------------------------------------------------------------------------------------
[gcode_macro HOST_CHECK]
description: Pi health check (throttle/temp/load, RAM+swap eaters, services - R78)
gcode:
    SAVE_VARIABLE VARIABLE=host_nonce VALUE={printer['save_variables'].variables.host_nonce|default(0)|int + 1}
    M117 Host check...
    RESPOND MSG="Host check: reading the Pi's health counters (throttle/undervolt, temp, load, swap, RAM, disk)"
    RESPOND MSG="  + WHO eats the CPU/RAM/SWAP + which services run (.62) - 'Timer too close' shutdowns are always a host problem"
    RESPOND MSG="  the answer takes a few seconds (longer while the host is busy)"

# -------------------------------------------------------------------------------------
# SET_MESH_TRAVEL - mesh travel speed cap (R75). [bed_mesh] speed is often the
# fastest continuous motion of the whole print - on weak hosts exactly there
# the MCU starves ('Timer too close'). SPEED=0 turns the cap off.
# -------------------------------------------------------------------------------------
[gcode_macro SET_MESH_TRAVEL]
description: Cap the mesh travel speed (SET_MESH_TRAVEL SPEED=120, 0 = off)
gcode:
    {% set v = params.SPEED|default(-1)|float %}
    {% if v < 0 %}
        RESPOND MSG="Mesh travel cap: {printer['save_variables'].variables.mesh_travel|default(120)|float|round|int}mm/s (0 = uncapped) - SET_MESH_TRAVEL SPEED=80..250"
    {% else %}
        SAVE_VARIABLE VARIABLE=mesh_travel VALUE={v|round|int}
        RESPOND MSG="Mesh travel cap: {'uncapped' if v|round|int == 0 else '%dmm/s while meshing' % v|round|int}"
    {% endif %}

# -------------------------------------------------------------------------------------
# CALIBRATE_MESH - re-measure the bed mesh (KAMP-aware) and save as material profile
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_MESH]
description: Calibrate the bed mesh at temperature (KAMP-aware) and save as 'r2'
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    {% set mat = sv.material|default('PLA')|string|upper %}
    {% set profile = 'r2' %}
    # mesh temperature: the CURRENT bed override if ON, else the material preset.
    # Meshing at print temperature matters - a cold bed measures a different shape!
    {% set bt = sv.ov_bed|default(0)|float if sv.ov_bed_on|default(False) else 0 %}
    {% if bt <= 0 and mat in db %}{% set bt = db[mat].bed1|float %}{% endif %}
    {% if printer.heater_bed.target|float > bt %}{% set bt = printer.heater_bed.target|float %}{% endif %}
    {% if bt > 0 %}
        NOTIFY TEXT="Heating bed to {bt|round|int}C for mesh..." LEVEL=info SOUND=r2_heating
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bt|round}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 2}
    {% endif %}
    # meshing needs known positions - home whatever is missing FIRST
    # (probing unhomed = 'Must home axis first' error!)
    {% set ha = printer.toolhead.homed_axes|lower %}
    {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
        NOTIFY TEXT="Homing first..." LEVEL=info SOUND=r2_notice
        G28
    {% endif %}
    _CALIBRATE_MESH_PROFILE PROFILE={profile}
    {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z10 F600{% endif %}
    {% if bt > 0 %}
        RESPOND MSG="Mesh done at {bt|round|int}C - bed stays on (turn off in System if you like)"
    {% endif %}

# -------------------------------------------------------------------------------------
# LOAD_BED_MESH - load a saved mesh profile (default: the material's profile)
# -------------------------------------------------------------------------------------
[gcode_macro LOAD_BED_MESH]
description: Load a saved bed mesh profile (LOAD_BED_MESH PROFILE=mesh_pla)
gcode:
    # R106 (any-Klipper audit): printers without [bed_mesh] get a clear answer
    {% if 'bed_mesh' not in printer %}
        NOTIFY TEXT="No [bed_mesh] in this printer - nothing to load" LEVEL=error SOUND=r2_error
    {% else %}
    {% set profile = params.PROFILE|default('') %}
    {% if profile == '' %}{% set profile = 'r2' %}{% endif %}
    # friendly pre-check: bed_mesh.profiles knows saved AND session profiles -
    # without it Klipper throws a raw 'Unknown profile' error
    {% if profile in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD={profile}
        SAVE_VARIABLE VARIABLE=mesh_last_profile VALUE='"{profile}"'
        NOTIFY TEXT="Mesh {profile} loaded" LEVEL=ok SOUND=r2_confirm
    {% else %}
        NOTIFY TEXT="Mesh '{profile}' does not exist yet - calibrate first (Maintenance > Bed Mesh)" LEVEL=error SOUND=r2_error
        M117 Mesh {profile} missing!
    {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# DELETE_MESH - delete a saved mesh profile with 2-press confirmation (deleting
# cannot be undone). LCD: Maintenance > Bed Mesh > Delete mesh...
# -------------------------------------------------------------------------------------
[gcode_macro DELETE_MESH]
description: Delete a mesh profile (press 2x to confirm, SAVE_CONFIG restarts)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set profile = params.PROFILE|default('') %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Deleting meshes only when idle" LEVEL=warn SOUND=r2_notice
    {% elif profile == '' %}
        RESPOND MSG="Usage: DELETE_MESH PROFILE=<name> (e.g. mesh_pla)"
    {% elif profile not in printer.bed_mesh.profiles %}
        NOTIFY TEXT="Mesh profile '{profile}' not found" LEVEL=error SOUND=r2_error
    {% elif s.mesh_delete_armed == profile %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_delete_armed VALUE='""'
        BED_MESH_PROFILE REMOVE={profile}
        NOTIFY TEXT="Mesh '{profile}' deleted - saving config (Klipper restarts once)" LEVEL=warn SOUND=r2_confirm
        SAVE_CONFIG
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_delete_armed VALUE='"{profile}"'
        NOTIFY TEXT="Delete mesh '{profile}'? Press again to confirm" LEVEL=warn SOUND=r2_notice
        M117 Delete {profile}? 2x!
    {% endif %}

# -------------------------------------------------------------------------------------
# BED SCREWS, THE MAINSAIL WAY (R216, .136n): the old macro dumped the screw
# table into the console and left you alone. The new flow runs ON THE LCD:
# Start measures all screws (SCREWS_TILT_CALCULATE), then the display walks
# you through them one by one - current screw, direction and clock notation
# (01:20 = one full turn plus 20 minutes, exactly like Klipper/Mainsail).
# "Next screw" advances, "New round" re-measures after you turned them, and
# you loop until every screw reads ok. "Finish" takes over the result
# (or tells you which screw is still off). Screw positions, names and thread
# live in [screws_tilt_adjust] in printer.cfg -> ADJUST TO YOUR PRINTER!
#
# state (ONE save_variable, the opt_list pattern - a single small write
# per round instead of one per field):
#   bs_state = 'R<round>|I<idx>|N<n>|<name>:<base|ok|CW 00:20>|...'
#   - R = round number, I = the screw shown (1..N), N = screw count
#   - base = the reference screw (first one, Klipper's own convention),
#     ok = nominal (within 0.001mm), otherwise the direction + clock
# -------------------------------------------------------------------------------------
# RAM display state for the LCD list (button presses stay OFF the SD card,
# only the measured rounds write the persisted bs_state mirror)
[gcode_macro _BED_SCREWS_UI]
variable_head: 'not running'
variable_cur: 'Start below'
variable_running: 0
variable_round: 0
variable_idx: 0
variable_n: 0
variable_lines: ''
gcode:

[gcode_macro BED_SCREWS_START]
description: Bed screw calibration on the LCD (Mainsail flow) - start
gcode:
    {% if printer['gcode_macro _STATE'].mode not in ['idle','finished'] %}
        NOTIFY TEXT="Screw leveling only when idle" LEVEL=warn SOUND=r2_notice
    {% elif 'screws_tilt_adjust' not in printer.configfile.settings %}
        NOTIFY TEXT="No [screws_tilt_adjust] in printer.cfg - screw leveling unavailable" LEVEL=error SOUND=r2_error
    {% else %}
        NOTIFY TEXT="Screw leveling: probing all screws, round 1..." LEVEL=info SOUND=r2_leveling
        M117 Screws: probing...
        G28
        SCREWS_TILT_CALCULATE
        UPDATE_DELAYED_GCODE ID=_BS_EVAL DURATION=0.4
    {% endif %}

# re-measure after the user turned the screws: NO re-home (Klipper itself
# re-probes without one), the round counter just moves on
[gcode_macro BED_SCREWS_ROUND]
description: Bed screws - new round (re-measure all screws)
gcode:
    {% if printer['gcode_macro _BED_SCREWS_UI'].running|default(0)|int != 1 %}
        NOTIFY TEXT="Start the screw calibration first" LEVEL=warn SOUND=r2_notice
    {% else %}
        M117 Screws: probing again...
        SCREWS_TILT_CALCULATE
        UPDATE_DELAYED_GCODE ID=_BS_EVAL DURATION=0.4
    {% endif %}

# reads the probe results AFTER SCREWS_TILT_CALCULATE finished (the delayed
# fire guarantees a fresh template expansion - a same-macro read would see
# the PREVIOUS round, the whole template renders before any command runs)
[delayed_gcode _BS_EVAL]
gcode:
    {% set r = printer.screws_tilt_adjust.results
                     if 'screws_tilt_adjust' in printer.configfile.settings
                     else {} %}
    {% if not r %}
        M117 Screws: no result
        NOTIFY TEXT="Screw probing returned nothing - try again" LEVEL=error SOUND=r2_error
    {% else %}
        {% set st = printer.configfile.settings.screws_tilt_adjust %}
        {% set round = printer['gcode_macro _BED_SCREWS_UI'].round|default(0)|int + 1 %}
        {% set idx = printer['gcode_macro _BED_SCREWS_UI'].idx|default(0)|int %}
        {% set lines = [] %}
        {% set names = [] %}
        {% for i in range(1, 99) %}
            {% if 'screw%d' % i in r %}
                {% set _ = names.append(st.get('screw%d_name' % i, 'screw %d' % i)) %}
            {% endif %}
        {% endfor %}
        {% for i in range(names|length) %}
            {% set e = r['screw%d' % (i + 1)] %}
            {% if e.is_base %}
                {% set _ = lines.append(names[i] ~ ':base') %}
            {% elif e.adjust == '00:00' %}
                {% set _ = lines.append(names[i] ~ ':ok') %}
            {% else %}
                {% set _ = lines.append(names[i] ~ ':' ~ e.sign ~ ' ' ~ e.adjust) %}
            {% endif %}
        {% endfor %}
        {% set idx = 1 if idx < 1 or idx > names|length else idx %}
        {% set cline = lines[idx - 1] %}
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=running VALUE=1
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=round VALUE={ round }
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=idx VALUE={ idx }
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=n VALUE={ names|length }
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=lines VALUE='"{ lines|join('|') }"'
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=head VALUE='"Round { round } - screw { idx }/{ names|length }"'
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=cur VALUE='"{ idx }/{ names|length } { cline }"'
        SAVE_VARIABLE VARIABLE=bs_state VALUE='"R{ round }|I{ idx }|N{ names|length }|{ lines|join('|') }"'
        M117 Screws: { names|length } measured
        NOTIFY TEXT="Screws measured (round { round }): turn as shown, then Next / New round" LEVEL=info SOUND=r2_confirm
    {% endif %}

# step through the screws on the LCD
[gcode_macro BED_SCREWS_NEXT]
description: Bed screws - show the next screw
gcode:
    {% set ui = printer['gcode_macro _BED_SCREWS_UI'] %}
    {% if ui.running|default(0)|int != 1 %}
        M117 Screws: not running
    {% elif ui.idx|default(0)|int >= ui.n|default(0)|int %}
        M117 Round done - New round?
    {% else %}
        {% set idx = ui.idx|default(0)|int + 1 %}
        {% set lines = (ui.lines|default('') ~ '').split('|') %}
        {% set cline = lines[idx - 1] %}
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=idx VALUE={ idx }
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=head VALUE='"Round { ui.round|default(1)|int } - screw { idx }/{ ui.n|default(0)|int }"'
        SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=cur VALUE='"{ idx }/{ ui.n|default(0)|int } { cline }"'
        {% set e216 = cline.split(':', 1) %}
        M117 { idx }/{ ui.n|default(0)|int } { e216[0] }: { e216[1] }
    {% endif %}

# take over: everything nominal -> done (and the mesh hint), otherwise
# name the screw that is still off and keep the flow alive
[gcode_macro BED_SCREWS_DONE]
description: Bed screws - finish / take over
gcode:
    {% set bs = printer['save_variables'].variables.bs_state|default('') %}
    {% if bs == '' %}
        NOTIFY TEXT="Screw calibration is not running" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set lines = bs.split('|')[3:] %}
        {% set bad = [] %}
        {% for l in lines %}
            {% if not (l.endswith(':ok') or l.endswith(':base')) %}
                {% set _ = bad.append(l) %}
            {% endif %}
        {% endfor %}
        {% if bad %}
            NOTIFY TEXT="Not nominal yet: { bad|join(', ') } - New round after turning" LEVEL=warn SOUND=r2_notice
            M117 Not done: { bad[0].split(':')[0] }
        {% else %}
            SAVE_VARIABLE VARIABLE=bs_state VALUE='""'
            SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=running VALUE=0
            SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=idx VALUE=0
            SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=cur VALUE='"all nominal"'
            SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=head VALUE='"done"'
            NOTIFY TEXT="All screws nominal - bed level taken over. Mesh: Leveling > Bed mesh now" LEVEL=ok SOUND=r2_leveled
            M117 Screws: all nominal
        {% endif %}
    {% endif %}

[gcode_macro BED_SCREWS_CANCEL]
description: Bed screws - cancel
gcode:
    SAVE_VARIABLE VARIABLE=bs_state VALUE='""'
    SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=idx VALUE=0
    SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=head VALUE='"not running"'
    SET_GCODE_VARIABLE MACRO=_BED_SCREWS_UI VARIABLE=cur VALUE='"Start below"'
    M117 Screws: cancelled
    NOTIFY TEXT="Screw calibration cancelled" LEVEL=info SOUND=r2_notice

# kept as the console alias - it starts the same LCD flow
[gcode_macro LEVEL_BED_SCREWS]
description: Bed screw alignment via probe (LCD flow, Mainsail style)
gcode:
    BED_SCREWS_START

# -------------------------------------------------------------------------------------
# CALIBRATE_PROBE_OFFSET - probe offset via paper method (interactive via LCD knob)
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_PROBE_OFFSET]
description: Probe Z-offset calibration (paper method, interactive)
gcode:
    {% if printer['gcode_macro _STATE'].mode in ['idle','finished'] %}
        NOTIFY TEXT="Z-offset calibration: TESTZ/ACCEPT in LCD menu Maintenance" LEVEL=info SOUND=r2_notice
        G28
        PROBE_CALIBRATE
        RESPOND MSG=">>> Paper under the nozzle, then LCD: Maintenance > Probe offset: TESTZ Z=+/-, then ACCEPT"
    {% else %}
        NOTIFY TEXT="Only when idle" LEVEL=warn
    {% endif %}

# -------------------------------------------------------------------------------------
# EXTRUDER STEPS CALIBRATION: mark 120mm, extrude 100mm, measure the rest
#   CALIBRATE_EXTRUDER STEP=heat     -> heats, asks you to mark at 120mm
#   CALIBRATE_EXTRUDER STEP=extrude  -> extrudes 100mm
#   CALIBRATE_EXTRUDER STEP=result MEASURED=18.5 -> computes new rotation_distance
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_EXTRUDER]
description: Extruder calibration: STEP=heat|extrude|result MEASURED=<mm>
gcode:
    {% set step = params.STEP|default('')|string|lower %}
    {% if step == 'heat' %}
        {% if printer['gcode_macro _STATE'].mode in ['idle','finished'] %}
            {% set target = params.TEMP|default(210)|float %}
            NOTIFY TEXT="Extruder calibration: heating to {target|round|int}C" LEVEL=info
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target|round}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 2}
            M117 Mark filament at 120mm!
            RESPOND MSG=">>> Mark the filament 120mm above the sensor entry, then CALIBRATE_EXTRUDER STEP=extrude"
            _SOUND_LIB NAME=r2_question
        {% else %}
            NOTIFY TEXT="Only when idle" LEVEL=warn
        {% endif %}
    {% elif step == 'extrude' %}
        {% if printer['gcode_macro _STATE'].mode not in ['idle','finished'] %}
            NOTIFY TEXT="Only when idle" LEVEL=warn
        {% elif 'extruder' in printer and not printer.extruder.can_extrude|default(True) %}
            NOTIFY TEXT="Extruder too cold - run CALIBRATE_EXTRUDER STEP=heat first" LEVEL=warn SOUND=r2_notice
        {% else %}
            M117 Extruding 100mm...
            SAVE_GCODE_STATE NAME=EXTR_CAL
            M83
            G1 E100 F120
            RESTORE_GCODE_STATE NAME=EXTR_CAL
            M117 Measure mark -> sensor!
            RESPOND MSG=">>> Measure distance mark->sensor entry (should be 20mm) -> CALIBRATE_EXTRUDER STEP=result MEASURED=<mm>"
            _SOUND_LIB NAME=r2_question
        {% endif %}
    {% elif step == 'result' %}
        {% set measured = params.MEASURED|default(0)|float %}
        {% if printer['gcode_macro _STATE'].mode not in ['idle','finished'] %}
            NOTIFY TEXT="Only when idle" LEVEL=warn
        {% elif measured <= 0 %}
            NOTIFY TEXT="MEASURED=<mm> missing (must be > 0 and < 120)" LEVEL=warn
        {% elif measured >= 120 %}
            NOTIFY TEXT="MEASURED={measured|round(2)}mm invalid - must be < 120mm (120mm mark minus fed length)" LEVEL=error SOUND=r2_error
        {% else %}
            # commanded 100mm; actually fed = 120 - measured rest (> 0 guaranteed)
            {% set fed = 120 - measured %}
            {% set rd_old = printer.configfile.settings.extruder.rotation_distance|float %}
            {% set rd_new = rd_old * fed / 100 %}
            {% if rd_new > 0 %}
                SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={rd_new|round(4)}
                NOTIFY TEXT="Extruder: new {rd_new|round(3)} (old {rd_old|round(3)}) - SAVE_CONFIG stores it" LEVEL=ok SOUND=r2_done
            {% else %}
                NOTIFY TEXT="Extruder: invalid config rotation_distance ({rd_old})" LEVEL=error SOUND=r2_error
            {% endif %}
        {% endif %}
    {% else %}
        NOTIFY TEXT="CALIBRATE_EXTRUDER STEP=heat|extrude|result" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# CALIBRATE_STEPS - X/Y/Z steps_per_mm (rotation_distance) via measured distance.
#   Rebuilds the classic 3D-print calibration ladder step that the E3/R2D2
#   was missing: you command a known travel, measure it with calipers, enter
#   the MEASURED value, and the macro computes the new steps_per_mm and stores
#   it (SET_ROTATION_DISTANCE / SET_STEPPER_M92 equivalent), like the extruder
#   calibration does for the E axis.
#   CALIBRATE_STEPS AXIS=X|Y|Z DIST=<commanded mm> MEASURED=<measured mm>
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_STEPS]
description: Steps calibration for X/Y/Z: MEASURED travel -> new steps_per_mm
gcode:
    {% set axis = params.AXIS|default('')|string|upper %}
    {% set dist = params.DIST|default(0)|float %}
    {% set measured = params.MEASURED|default(0)|float %}
    {% if axis not in ['X','Y','Z'] %}
        NOTIFY TEXT="CALIBRATE_STEPS AXIS=X|Y|Z DIST=<mm> MEASURED=<mm>" LEVEL=warn SOUND=r2_notice
    {% elif printer['gcode_macro _STATE'].mode not in ['idle','finished'] %}
        NOTIFY TEXT="Only when idle (not printing)" LEVEL=warn SOUND=r2_notice
    {% elif dist <= 0 or measured <= 0 %}
        NOTIFY TEXT="DIST and MEASURED must both be > 0" LEVEL=warn SOUND=r2_notice
    {% else %}
        # commanded `dist`, actually travelled `measured`: scale the current
        # steps_per_mm by the ratio dist/measured. M92 sets it live, SAVE_CONFIG
        # writes it back to printer.cfg so it survives a restart.
        {% set cfg = printer.configfile.settings[{'X':'x','Y':'y','Z':'z'}[axis]] %}
        {% set spm = cfg.steps_per_mm|default(0)|float %}
        {% if spm <= 0 %}
            NOTIFY TEXT="No steps_per_mm in the { axis } stepper section - set it in printer.cfg first" LEVEL=error SOUND=r2_error
        {% else %}
            {% set spm_new = (spm * dist / measured)|round(6) %}
            M92 {axis} {spm_new}
            NOTIFY TEXT="{axis}: {dist}mm commanded, {measured}mm measured -> steps_per_mm {spm_new} (was {spm})" LEVEL=ok SOUND=r2_confirm
            RESPOND MSG=">>> {axis}: {dist}mm commanded, {measured}mm measured. New steps_per_mm = {spm_new}. Confirm, then SAVE_CONFIG to store it."
        {% endif %}
    {% endif %}


# -------------------------------------------------------------------------------------
# TEST_RETRACTION - show current firmware retract values + 3 test cycles (G10/G11)
# -------------------------------------------------------------------------------------
[gcode_macro TEST_RETRACTION]
description: Test firmware retraction (3x G10/G11)
gcode:
    {% if printer.extruder.temperature > 170 %}
        RESPOND MSG="Retract test: currently {printer.configfile.settings['firmware_retraction'].retract_length}mm @ {printer.configfile.settings['firmware_retraction'].retract_speed}mm/s"
        SAVE_GCODE_STATE NAME=RETRACT_TEST
        M83
        G4 P300
        {% for i in [1,2,3] %}
            G10
            G4 P400
            G11
            G4 P600
        {% endfor %}
        RESTORE_GCODE_STATE NAME=RETRACT_TEST
        NOTIFY TEXT="Retract test done - stringing? adjust SET_LIVE_RETRACTION" LEVEL=ok SOUND=r2_confirm
    {% else %}
        NOTIFY TEXT="Heat the hotend first (Maintenance > Load filament heats)" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# LOAD_FILAMENT / UNLOAD_FILAMENT - by hand (heats up if needed)
# -------------------------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Load filament (keeps print temp; idle: heats to 200C+ / preset)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set tgt = printer.extruder.target|float %}
    {% if tgt < 170 %}
        # idle/no target: at least 200C - hotter if the material preset says so
        {% set db = printer['gcode_macro _MATERIALS'].presets %}
        {% set mat = sv.material|default('PLA')|string|upper %}
        {% set pre = db[mat].hot1|float if mat in db else 200.0 %}
        {% if sv.ov_hotend_first_on|default(False) %}{% set pre = [pre, sv.ov_hotend_first|float]|max %}{% endif %}
        {% set tgt = [200, pre]|max %}
        NOTIFY TEXT="Heating for loading to {tgt|round|int}C..." LEVEL=info SOUND=r2_heating
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tgt|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tgt - 3}
    {% endif %}
    {% set llen = sv.load_length|default(60)|float %}
    SAVE_GCODE_STATE NAME=FIL_LOAD
    M83
    G1 E{llen|round(0)|int} F600
    RESTORE_GCODE_STATE NAME=FIL_LOAD
    NOTIFY TEXT="Filament loaded" LEVEL=ok SOUND=r2_confirm

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (keeps print temp; idle: heats to 200C+ / preset)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set tgt = printer.extruder.target|float %}
    {% if tgt < 170 %}
        # idle/no target: at least 200C - hotter if the material preset says so
        {% set db = printer['gcode_macro _MATERIALS'].presets %}
        {% set mat = sv.material|default('PLA')|string|upper %}
        {% set pre = db[mat].hot1|float if mat in db else 200.0 %}
        {% if sv.ov_hotend_first_on|default(False) %}{% set pre = [pre, sv.ov_hotend_first|float]|max %}{% endif %}
        {% set tgt = [200, pre]|max %}
        NOTIFY TEXT="Heating for unloading to {tgt|round|int}C..." LEVEL=info SOUND=r2_heating
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tgt|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tgt - 3}
    {% endif %}
    {% set ulen = printer['save_variables'].variables.unload_length|default(90)|float %}
    SAVE_GCODE_STATE NAME=FIL_UNLOAD
    M83
    G1 E-{ulen|round(0)|int} F1800
    RESTORE_GCODE_STATE NAME=FIL_UNLOAD
    NOTIFY TEXT="Filament unloaded" LEVEL=ok SOUND=r2_confirm

# -------------------------------------------------------------------------------------
# CALIBRATE_PA - pressure advance test line (manual, LCD/Mainsail):
#   1) CALIBRATE_PA             -> heats (current hotend preset), homes, draws 10
#                                  segments; segment i runs PA = START + i*STEP
#                                  (default 0.000 .. 0.135, 0.015 steps), each with
#                                  slow/fast speed changes - the cleanest transitions
#                                  (no bumps at the speed jump, no gaps) = best PA
#   2) PA_RESULT SEG=<1..10>    -> computes PA from your best segment, sets it live
#                                  AND stores it as the PA override for every print.
# Nozzle diameter + line width come from printer.cfg ([extruder] nozzle_diameter).
#
# R216 (.136n), user wish - two pattern shapes + frame + base:
#   PATTERN=LINES  the classic speed-change lines (default, as before)
#   PATTERN=ANGLE  the angle zigzag: per PA value ONE connected sawtooth of five
#                  LONG strokes with direction+speed changes at every joint -
#                  sequence exactly as specified: 45 deg stroke (leaning left),
#                  90 deg right turn, 90 deg left turn, a half stroke (the SLOW
#                  one - the speed change lands mid-zigzag), then a 45 deg
#                  stroke to the right. Long acceleration paths (~20-30mm per
#                  stroke) so the ramps fully develop - PA artifacts sit right
#                  at the joints. Angle mode stacks fewer, taller bands (about
#                  6 PA values on a 220er bed - pick START/STEP accordingly).
#   BASE=<n>       optional base plate under the pattern (default 3 layers,
#                  BASE=0 turns it off): solid plate + the frame walls, so the
#                  pattern prints on a consistent surface instead of raw bed.
#   The 2mm frame: ALWAYS around the pattern (2mm off its bounding box, two
#   loops) - it replaced the loose 6/9mm skirt. It anchors the pattern, keeps
#   the base edge straight and gives the eye a clean boundary to judge against.
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_PA]
description: Pressure advance calibration (Orca style): one long line per PA value
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        NOTIFY TEXT="PA calibration only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        # ---- parameters: explicit > LCD-saved > defaults -------------------------------------
        {% set target  = params.TEMP|default(sv.pa_cal_hotend|default(210))|float %}
        {% set bedt    = params.BED|default(sv.pa_cal_bed|default(60))|float %}
        {% set start   = params.START|default(sv.pa_cal_start|default(0))|float %}
        {% set step    = params.STEP|default(sv.pa_cal_step|default(0.005))|float %}
        {% set lines   = params.LINES|default(sv.pa_cal_lines|default(10))|int %}
        {% if lines <= 2 %}{% set lines = 10 %}RESPOND MSG="LINES must be > 2 - using 10"{% endif %}
        {% set length  = params.LINE_LEN|default(sv.pa_cal_len|default(100))|float %}
        {% set slowms  = params.SLOW|default(sv.pa_cal_slow|default(20))|float %}    # mm/s
        {% set fastms  = params.FAST|default(sv.pa_cal_fast|default(100))|float %}   # mm/s
        {% set accel   = params.ACCEL|default(sv.pa_cal_accel|default(3000))|int %}
        {% set lh      = params.LAYER|default(sv.pa_cal_layer|default((noz / 2)|round(3)))|float %}
        {% if lh <= 0.05 %}{% set lh = (noz / 2)|round(3) %}RESPOND MSG="LAYER must be > 0.05 - using the default"{% endif %}
        {% set spacing = params.SPACING|default(sv.pa_cal_spacing|default(0))|float %}
        # R216: pattern shape + base plate (see the header)
        {% set pattern = params.PATTERN|default(sv.pa_cal_pattern|default('LINES'))|string|upper %}
        {% if pattern not in ['LINES', 'ANGLE'] %}{% set pattern = 'LINES' %}{% endif %}
        {% set base = params.BASE|default(sv.pa_cal_base|default(3))|int %}
        {% if base < 0 or base > 10 %}{% set base = 3 %}{% endif %}
        # WIDTH must be a NUMBER (no expressions) - unparsable falls back to nozzle*1.15
        {% set w = params.WIDTH|default(0)|float %}
        {% if w < 0.2 or w > 1.5 %}
            {% if params.WIDTH is defined %}
                NOTIFY TEXT="PA cal: WIDTH must be a number (got '{params.WIDTH}') - using {(noz * 1.15)|round(2)} (nozzle x 1.15)" LEVEL=warn SOUND=r2_notice
            {% endif %}
            {% set w = (noz * 1.15)|round(3) %}
        {% endif %}
        {% if spacing <= 0 %}{% set spacing = [(w * 3), 2.5]|max|round(1) %}{% endif %}
        # ---- remember (PA_RESULT math + LCD) -------------------------------------------------
        SAVE_VARIABLE VARIABLE=pa_test_start VALUE={start}
        SAVE_VARIABLE VARIABLE=pa_test_step VALUE={step}
        SAVE_VARIABLE VARIABLE=pa_cal_hotend VALUE={target|round}
        SAVE_VARIABLE VARIABLE=pa_cal_bed VALUE={bedt|round}
        SAVE_VARIABLE VARIABLE=pa_cal_start VALUE={start}
        SAVE_VARIABLE VARIABLE=pa_cal_step VALUE={step}
        SAVE_VARIABLE VARIABLE=pa_cal_lines VALUE={lines}
        SAVE_VARIABLE VARIABLE=pa_cal_len VALUE={length|round}
        SAVE_VARIABLE VARIABLE=pa_cal_slow VALUE={slowms|round}
        SAVE_VARIABLE VARIABLE=pa_cal_fast VALUE={fastms|round}
        SAVE_VARIABLE VARIABLE=pa_cal_accel VALUE={accel}
        {% if spacing > 0 %}
            SAVE_VARIABLE VARIABLE=pa_cal_spacing VALUE={spacing}
        {% endif %}
        SAVE_VARIABLE VARIABLE=pa_cal_pattern VALUE='"{pattern}"'
        SAVE_VARIABLE VARIABLE=pa_cal_base VALUE={base}
        # ---- safe area ------------------------------------------------------------------------
        {% set xmin = 15 %}{% set xmax = [printer.toolhead.axis_maximum.x - 30, 200]|min|float %}
        {% set ymin = 25 %}{% set ymax = [printer.toolhead.axis_maximum.y - 40, 190]|min|float %}
        {% set length = [length, xmax - xmin]|min|round(1) %}
        {% set x0 = (xmin + ((xmax - xmin - length) / 2))|round(1) %}
        {% set y0 = (ymax - (lines - 1) * spacing)|round(1) %}
        {% if step <= 0 %}
            NOTIFY TEXT="PA cal: STEP must be above 0 (got {step})" LEVEL=error SOUND=r2_error
        {% elif lines < 3 or lines > 40 %}
            NOTIFY TEXT="PA cal: LINES must be 3..40 (got {lines})" LEVEL=error SOUND=r2_error
        {% elif lh < 0.04 or lh > 0.75 %}
            NOTIFY TEXT="PA cal: LAYER must be 0.04..0.75mm (got {lh})" LEVEL=error SOUND=r2_error
        {% elif length < 30 %}
            NOTIFY TEXT="PA cal: line length must be at least 30mm (got {length})" LEVEL=error SOUND=r2_error
        {% elif pattern == 'LINES' and (lines - 1) * spacing > (ymax - ymin) %}
            NOTIFY TEXT="PA cal: {lines} lines x {spacing}mm spacing do not fit the bed ({ymax - ymin}mm available)" LEVEL=error SOUND=r2_error
        {% else %}
            {% set emm = (w * lh / 2.405)|round(4) %}
            {% set acc_old = printer.toolhead.max_accel|default(4000)|int %}
            # ---- 1) heat (bed async) + home + saved mesh ---------------------------------------
            M99106 S0
            {% if bedt >= 40 %}
                NOTIFY TEXT="PA cal: heating bed to {bedt|round|int}C + hotend {target|round|int}C" LEVEL=info SOUND=r2_heating
                SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}
            {% else %}
                NOTIFY TEXT="PA cal: heating hotend to {target|round|int}C (bed stays off)" LEVEL=info SOUND=r2_heating
            {% endif %}
            M117 PA cal: homing
            G28
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target|round}
            {% if bedt >= 40 %}TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}{% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 3}
            # R54: MESH before the test (user rule - the lines sit ON the mesh)
            {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                _CALIBRATE_MESH_PROFILE PROFILE=r2
            {% else %}
                {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
                {% if printer.bed_mesh.profile_name|default('') == '' and 'r2' in profiles %}
                    LOAD_MESH_PROFILE PROFILE=r2
                    RESPOND MSG="PA cal: saved mesh 'r2' loaded (no probe -> no fresh mesh)"
                {% endif %}
            {% endif %}
            NOTIFY TEXT="PA cal: {lines} lines x {length|round(0)}mm, PA {start|round(3)}..{(start + (lines - 1) * step)|round(3)} step {step} | {slowms|round(0)}/{fastms|round(0)}mm/s accel {accel}" LEVEL=ok SOUND=r2_hot
            SAVE_GCODE_STATE NAME=PA_CAL
            G90
            M83
            SET_VELOCITY_LIMIT ACCEL={accel}
            # ---- R58: apply YOUR motion overrides so the calibration runs with
            #      exactly the parameters you print with (synced with Pre-Print
            #      and Live Tuning - one source of truth)
            {% if sv.ov_velocity_on|default(False) and sv.ov_velocity|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT VELOCITY={sv.ov_velocity|float|round}
            {% endif %}
            {% if sv.ov_min_cruise_on|default(False) and sv.ov_min_cruise|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={sv.ov_min_cruise|float}
            {% endif %}
            {% if sv.ov_square_corner_on|default(False) and sv.ov_square_corner|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={sv.ov_square_corner|float}
            {% endif %}
            {% set cfg_fr = printer.configfile.settings['firmware_retraction'] if 'firmware_retraction' in printer.configfile.settings else {} %}
            {% set fr = printer['firmware_retraction'] if 'firmware_retraction' in printer else None %}
            {% set base_rl = fr.retract_length|default(cfg_fr.get('retract_length', 0.75))|float if fr else cfg_fr.get('retract_length', 0.75)|float %}
            {% set base_rs = fr.retract_speed|default(cfg_fr.get('retract_speed', 35))|float if fr else cfg_fr.get('retract_speed', 35)|float %}
            {% set base_us = fr.unretract_speed|default(base_rs)|float if fr else cfg_fr.get('unretract_speed', base_rs)|float %}
            {% set rl = sv.ov_retract_len|default(base_rl)|float if sv.ov_retract_len_on|default(False) else base_rl %}
            {% set rs = sv.ov_retract_speed|default(base_rs)|float if sv.ov_retract_speed_on|default(False) else base_rs %}
            {% set us = sv.ov_unretract_speed|default(base_us)|float if sv.ov_unretract_speed_on|default(False) else base_us %}
            {% if fr and (sv.ov_retract_len_on|default(False) or sv.ov_retract_speed_on|default(False) or sv.ov_unretract_speed_on|default(False)) %}
                SET_RETRACTION RETRACT_LENGTH={rl|round(3)} RETRACT_SPEED={rs|round|int} UNRETRACT_SPEED={us|round|int}
            {% endif %}
            {% if sv.ov_flow_on|default(False) %}
                M221 S{sv.ov_flow|default(100)|float|round}
            {% endif %}

            # ---- 2) prime line at the front edge ------------------------------------------------
            M117 Prime line
            G0 X{xmin} Y10 F6000
            G0 Z{lh} F300
            G1 X{xmin + 80} E{(80 * emm)|round(2)} F{slowms * 60|int}
            G1 E-2 F2400
            # ---- R216: geometry of the chosen pattern -------------------------------------------
            # LINES: one horizontal line per PA value (as before), band = spacing
            # ANGLE: one connected 5-stroke sawtooth per PA value, band = 10*spacing
            #   (long acceleration paths - the strokes reach 25mm+ at default spacing)
            {% set bandh = spacing if pattern == 'LINES' else (spacing * 10) %}
            {% set q = (bandh / 1.5)|round(3) if pattern == 'ANGLE' else 0 %}
            {% if pattern == 'ANGLE' %}
                # stroke size limited by BOTH the height per band and the width:
                # the sawtooth needs 4.7*q horizontally, 1.5*q vertically
                {% set q = [q, ((xmax - xmin - 8) / 4.7)]|min|round(3) %}
                {% set bandh = (1.5 * q)|round(3) %}
                {% set swidth = (4.7 * q)|round(1) %}
                # fewer, taller bands than the line pattern - auto-reduce the
                # line count to what the bed holds and SAY so (the PA range shrinks)
                {% set fit = ((ymax - ymin - 4) / bandh)|round(0)|int %}
                {% if fit < 3 %}
                    NOTIFY TEXT="PA cal ANGLE: no room for 3 bands even - raise the bed or lower SPACING" LEVEL=error SOUND=r2_error
                {% endif %}
                {% if lines > fit %}
                    RESPOND MSG="PA cal ANGLE: {lines} bands do not fit - running {fit} (raise SPACING for LONGER strokes, lower it for MORE PA values)"
                    {% set lines = fit %}
                {% endif %}
                {% set ax0 = ((xmin + ((xmax - xmin - swidth) / 2)))|round(1) %}
                {% set ay0 = (ymax - (lines - 1) * bandh - bandh)|round(1) %}
                {% set px0 = ax0 %}{% set py0 = ay0 %}
                {% set px1 = (ax0 + swidth)|round(1) %}{% set py1 = (ay0 + (lines - 1) * bandh + bandh)|round(1) %}
            {% else %}
                {% set px0 = x0 %}{% set py0 = y0 %}
                {% set px1 = (x0 + length)|round(1) %}{% set py1 = ymax %}
            {% endif %}
            # pattern z: on top of the base plate when one is printed
            {% set zp = ((base + 1) * lh)|round(3) %}
            # ---- 3) the 2mm frame: ALWAYS around the pattern (user rule, R216) -----------------
            # two wall loops, 2mm off the pattern bounding box; with a base plate
            # they are the plate's perimeter and print on EVERY base layer
            {% set fx0 = (px0 - 2.0)|round(1) %}{% set fx1 = (px1 + 2.0)|round(1) %}
            {% set fy0 = (py0 - 2.0)|round(1) %}{% set fy1 = (py1 + 2.0)|round(1) %}
            M117 Frame + base
            G1 E2 F2400
            {% for lay in range(base + 1) %}
                {% set zl = ((lay + 1) * lh)|round(3) %}
                {% if lay > 0 %}
                    G1 E-{rl} F{rs * 60|int}
                    G0 Z{(zl + 0.4)|round(2)} F600
                    G0 X{fx0} Y{fy0} F9000
                    G0 Z{zl} F600
                    G1 E{rl} F{(rs / 2)|round(1) * 60|int}
                {% else %}
                    G0 X{fx0} Y{fy0} F9000
                    G0 Z{zl} F600
                {% endif %}
                {% for m in [0, w] %}
                    {% set gx0 = (fx0 - m)|round(1) %}{% set gx1 = (fx1 + m)|round(1) %}
                    {% set gy0 = (fy0 - m)|round(1) %}{% set gy1 = (fy1 + m)|round(1) %}
                    {% if m > 0 %}
                        G0 X{gx0} Y{gy0} F6000
                    {% endif %}
                    G1 X{gx1} Y{gy0} E{((gx1 - gx0) * emm)|round(2)} F{slowms * 60|int}
                    G1 X{gx1} Y{gy1} E{((gy1 - gy0) * emm)|round(2)} F{slowms * 60|int}
                    G1 X{gx0} Y{gy1} E{((gx1 - gx0) * emm)|round(2)} F{slowms * 60|int}
                    G1 X{gx0} Y{gy0} E{((gy1 - gy0) * emm)|round(2)} F{slowms * 60|int}
                {% endfor %}
                {% if lay < base %}
                    # base layer: boustrophedon hatch inside the frame (alternating
                    # direction so the strokes chain - no travels, no strings)
                    {% set hsp = (w * 0.92)|round(3) %}
                    {% set hx0 = (fx0 + w)|round(1) %}{% set hx1 = (fx1 - w)|round(1) %}
                    {% set hy0 = (fy0 + w)|round(1) %}{% set hy1 = (fy1 - w)|round(1) %}
                    {% set ncols = ((hx1 - hx0) / hsp)|round(0)|int %}
                    {% for c in range(ncols) %}
                        {% set xx = (hx0 + c * hsp)|round(2) %}
                        {% if c % 2 == 0 %}
                            G0 X{xx} Y{hy0} F9000
                            G1 X{xx} Y{hy1} E{((hy1 - hy0) * emm)|round(2)} F{slowms * 60|int}
                        {% else %}
                            G0 X{xx} Y{hy1} F9000
                            G1 X{xx} Y{hy0} E{((hy1 - hy0) * emm)|round(2)} F{slowms * 60|int}
                        {% endif %}
                    {% endfor %}
                {% endif %}
            {% endfor %}
            # ---- 4) the pattern --------------------------------------------------------------------
            # LINES: ONE long line per PA value, stacked in Y, every line drawn
            #   LEFT -> RIGHT, slow/fast/slow thirds. Between the lines: retract +
            #   z-hop so the nozzle does not drag through the printed lines.
            # ANGLE: one connected sawtooth per PA value - sequence exactly
            #   45 deg stroke (up-right) -> 90 deg RIGHT turn (down-right) ->
            #   90 deg LEFT turn (up-right) -> HALF stroke (the SLOW one) ->
            #   45 deg RIGHT turn (horizontal, closing to the right). PA artifacts
            #   sit at the joints - the cleanest joints win.
            M117 PA pattern: {pattern}
            {% if base > 0 %}
                G1 E-{rl} F{rs * 60|int}
                G0 Z{(zp + 0.4)|round(2)} F600
                G0 X{px0} Y{py0 if pattern == 'LINES' else ay0} F9000
                G0 Z{zp} F600
                G1 E{rl} F{(rs / 2)|round(1) * 60|int}
            {% else %}
                G0 X{px0} Y{py0 if pattern == 'LINES' else ay0} F9000
                G0 Z{zp} F600
            {% endif %}
            {% for i in range(lines) %}
                {% set pa = start + i * step %}
                SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)}
                M117 PA line {i + 1}/{lines}: {pa|round(3)}
                RESPOND MSG="PA line {i + 1}/{lines}: PA {pa|round(3)}"
                {% if i > 0 %}
                    # travel to the next line/band start: retract + hop over the printed pattern
                    G1 E-{rl} F{rs * 60|int}
                    G0 Z{(zp + 0.4)|round(2)} F600
                    {% if pattern == 'LINES' %}
                        G0 X{px0} Y{(py0 + i * spacing)|round(1)} F9000
                    {% else %}
                        G0 X{ax0} Y{(ay0 + i * bandh)|round(1)} F9000
                    {% endif %}
                    G0 Z{zp} F600
                    G1 E{rl} F{(rs / 2)|round(1) * 60|int}
                {% endif %}
                {% if pattern == 'LINES' %}
                    G1 X{(px0 + length * 0.25)|round(1)} E{(length * 0.25 * emm)|round(2)} F{slowms * 60|int}
                    G1 X{(px0 + length * 0.75)|round(1)} E{(length * 0.5 * emm)|round(2)} F{fastms * 60|int}
                    G1 X{(px0 + length)|round(1)} E{(length * 0.25 * emm)|round(2)} F{slowms * 60|int}
                {% else %}
                    {% set sy = (ay0 + i * bandh)|round(2) %}
                    # stroke 1: 45 deg up-right (long, fast)
                    G1 X{(ax0 + q)|round(2)} Y{(sy + q)|round(2)} E{((q * 1.4142) * emm)|round(2)} F{fastms * 60|int}
                    # stroke 2: 90 deg RIGHT turn - 45 deg down-right (long, fast)
                    G1 X{(ax0 + 2 * q)|round(2)} Y{sy|round(2)} E{((q * 1.4142) * emm)|round(2)} F{fastms * 60|int}
                    # stroke 3: 90 deg LEFT turn - 45 deg up-right (long, fast)
                    G1 X{(ax0 + 3 * q)|round(2)} Y{(sy + q)|round(2)} E{((q * 1.4142) * emm)|round(2)} F{fastms * 60|int}
                    # stroke 4: HALF stroke, SLOW - the speed change mid-sawtooth
                    G1 X{(ax0 + 3.5 * q)|round(2)} Y{(sy + 1.5 * q)|round(2)} E{((q * 0.5 * 1.4142) * emm)|round(2)} F{slowms * 60|int}
                    # stroke 5: 45 deg RIGHT turn - horizontal, closing to the right
                    G1 X{(ax0 + 4.7 * q)|round(2)} Y{(sy + 1.5 * q)|round(2)} E{((1.2 * q) * emm)|round(2)} F{fastms * 60|int}
                {% endif %}
            {% endfor %}
            # ---- 5) done: restore PA + accel, park, evaluate ------------------------------------
            {% set restore = st.pa_value|default(0)|float if st.pa_value|default(0)|float > 0 else cfg_e.get('pressure_advance', 0)|float %}
            SET_PRESSURE_ADVANCE ADVANCE={restore|round(4)}
            SET_VELOCITY_LIMIT ACCEL={acc_old}
            G1 E-2 F2400
            G0 Z{lh + 8} F600
            G0 X{xmin} Y{ymax|round(0)} F6000
            RESTORE_GCODE_STATE NAME=PA_CAL
            M117 Best line? PA Cal
            NOTIFY TEXT="PA test done: cleanest speed transitions wins -> PA Cal > 'Best line'" LEVEL=ok SOUND=r2_question
            _CAL_END
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# PA_RESULT - the PA calculator: enter ONLY the result and get PA computed + saved.
#   PA_RESULT SEG=7    -> PA = start + (7-1) * step   (start/step from the last test)
#   PA_RESULT VALUE=0.048 -> skip the math, set this PA directly
# Both set PA live AND save it as the override used by every print.
# -------------------------------------------------------------------------------------
[gcode_macro PA_RESULT]
description: PA calculator: best segment (SEG=) or direct PA value (VALUE=)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set start = sv.pa_test_start|default(0)|float %}
    {% set step = sv.pa_test_step|default(0.015)|float %}
    {% set pa = params.VALUE|default(-1)|float %}
    {% if pa >= 0 %}
        SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)}
        SAVE_VARIABLE VARIABLE=ov_pa VALUE={pa|round(4)}
        SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_value VALUE={pa|round(4)}
        NOTIFY TEXT="PA = {pa|round(3)} - set live + saved as overwrite for every print" LEVEL=ok SOUND=r2_done
        M117 PA {pa|round(3)} saved
    {% else %}
        {% set seg = params.SEG|default(0)|int %}
        {% if seg < 1 %}
            NOTIFY TEXT="PA calculator: PA_RESULT SEG=<best line> or VALUE=<PA>" LEVEL=warn SOUND=r2_notice
        {% else %}
            {% set pa = start + (seg - 1) * step %}
            SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)}
            SAVE_VARIABLE VARIABLE=ov_pa VALUE={pa|round(4)}
            SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_value VALUE={pa|round(4)}
            NOTIFY TEXT="Line {seg} -> PA = {pa|round(3)} - set live + saved as overwrite for every print" LEVEL=ok SOUND=r2_done
            M117 PA {pa|round(3)} saved
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# COLD_PULL v2 (R77, user request) - a REAL cold-pull wizard, Maintenance only
# (a cold pull is a CLEANING function - it has no business in Pre-Print or in
# a paused print's filament menu; those copies were removed).
#   COLD_PULL [MATERIAL=PLA] [CYCLES=1]   full wizard: heat -> flush -> cool with
#                                         warning beeps -> PULL NOW (+ extruder
#                                         assist that yanks the filament out) ->
#                                         repeat up to CYCLES times
#   COLD_PULL STEP=finish                 verify: heat, extrude, judge the flow
#   SET_COLD_PULL_MATERIAL MATERIAL=PLA|PETG|ABS|TPU   preset hot/pull temperatures
# Everything is adjustable (LCD: Maintenance > Filament > Cold pull):
#   hot temp, pull temp, beep interval (s), assist length (mm), assist speed
#   (mm/s), cycles. Material presets: PLA 230/90, PETG 250/115, ABS 260/130,
#   TPU 235/100 (hot = softens debris INTO the filament, pull = tacky-solid).
# -------------------------------------------------------------------------------------

# -------------------------------------------------------------------------------------
# CALIBRATE_PA_SMOOTH (R54) - smooth-time line test using YOUR current PA.
#   1) CALIBRATE_PA + PA_RESULT first (best PA line)
#   2) CALIBRATE_PA_SMOOTH  -> lines with smooth 0.004..0.020 (step 0.001),
#      same geometry (lines/spacing/length/speeds/temps) as the PA test
#   3) PA_SMOOTH_RESULT SEG=<best line> -> smooth = start + (seg-1)*step,
#      applied live + saved as overwrite (PA stays as is)
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_PA_SMOOTH]
description: Pressure advance SMOOTH TIME calibration (uses the current PA)
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Smooth cal only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set target  = params.TEMP|default(sv.pa_cal_hotend|default(210))|float %}
        {% set bedt    = params.BED|default(sv.pa_cal_bed|default(60))|float %}
        # R58: user range 0.02..0.2 in 0.01 steps (19 lines) - PA prefilled with
        # the CURRENT pressure advance, editable via params.PA or the LCD menu
        {% set start   = params.START|default(sv.smooth_test_start|default(0.02))|float %}
        {% set step    = params.STEP|default(sv.smooth_test_step|default(0.01))|float %}
        {% set lines   = params.LINES|default(sv.pa_cal_lines|default(19))|int %}
        {% if lines <= 2 %}{% set lines = 19 %}RESPOND MSG="LINES must be > 2 - using 19"{% endif %}
        {% set pa      = params.PA|default(sv.ov_pa|default(printer.extruder.pressure_advance|default(cfg_e.get('pressure_advance', 0.05)))|float)|float %}
        {% set length  = params.LINE_LEN|default(sv.pa_cal_len|default(100))|float %}
        {% set slowms  = params.SLOW|default(sv.pa_cal_slow|default(20))|float %}
        {% set fastms  = params.FAST|default(sv.pa_cal_fast|default(100))|float %}
        {% set accel   = params.ACCEL|default(sv.pa_cal_accel|default(3000))|int %}
        {% set lh      = params.LAYER|default(sv.pa_cal_layer|default((noz / 2)|round(3)))|float %}
        {% if lh <= 0.05 %}{% set lh = (noz / 2)|round(3) %}RESPOND MSG="LAYER must be > 0.05 - using the default"{% endif %}
        {% set spacing = params.SPACING|default(sv.pa_cal_spacing|default(0))|float %}
        {% set w = (noz * 1.15)|round(3) %}
        {% if spacing <= 0 %}{% set spacing = [(w * 3), 2.5]|max|round(1) %}{% endif %}
        SAVE_VARIABLE VARIABLE=smooth_test_start VALUE={start}
        SAVE_VARIABLE VARIABLE=smooth_test_step VALUE={step}
        SAVE_VARIABLE VARIABLE=pa_cal_lines VALUE={lines}
        {% set xmin = 15 %}{% set xmax = [printer.toolhead.axis_maximum.x - 30, 200]|min|float %}
        {% set ymin = 25 %}{% set ymax = [printer.toolhead.axis_maximum.y - 40, 190]|min|float %}
        {% set length = [length, xmax - xmin]|min|round(1) %}
        {% set x0 = (xmin + ((xmax - xmin - length) / 2))|round(1) %}
        {% set y0 = (ymax - (lines - 1) * spacing)|round(1) %}
        {% set emm = (w * lh / 2.405)|round(4) %}
        {% if start < 0.02 or start > 0.2 %}
            NOTIFY TEXT="Smooth cal: START must be 0.02..0.2 (got {start})" LEVEL=error SOUND=r2_error
        {% elif step <= 0 or step > 0.05 %}
            NOTIFY TEXT="Smooth cal: STEP must be 0.001..0.05 (got {step})" LEVEL=error SOUND=r2_error
        {% elif lines < 3 or lines > 19 or (start + (lines - 1) * step) > 0.201 %}
            # R133: parenthesize BEFORE rounding - 'x / step|round(0)' rounded
            # the DIVISOR and divided by zero whenever this message rendered
            NOTIFY TEXT="Smooth cal: LINES must fit 0.02..0.2 (max {((0.2 - start) / step)|round(0)|int + 1} lines)" LEVEL=error SOUND=r2_error
        {% elif (lines - 1) * spacing > (ymax - ymin) %}
            NOTIFY TEXT="Smooth cal: {lines} lines x {spacing}mm do not fit" LEVEL=error SOUND=r2_error
        {% else %}
            M99106 S0
            {% if bedt >= 40 %}SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}{% endif %}
            NOTIFY TEXT="Smooth cal: {lines} lines, smooth {start}..{(start + (lines - 1) * step)|round(3)} step {step} at PA {pa|round(3)}" LEVEL=info SOUND=r2_heating
            M117 Smooth cal: homing
            G28
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target|round}
            {% if bedt >= 40 %}TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}{% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 3}
            {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                _CALIBRATE_MESH_PROFILE PROFILE=r2
            {% endif %}
            SAVE_GCODE_STATE NAME=SM_CAL
            G90
            M83
            SET_VELOCITY_LIMIT ACCEL={accel}
            # ---- R58: apply YOUR motion overrides so the calibration runs with
            #      exactly the parameters you print with (synced with Pre-Print
            #      and Live Tuning - one source of truth)
            {% if sv.ov_velocity_on|default(False) and sv.ov_velocity|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT VELOCITY={sv.ov_velocity|float|round}
            {% endif %}
            {% if sv.ov_min_cruise_on|default(False) and sv.ov_min_cruise|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={sv.ov_min_cruise|float}
            {% endif %}
            {% if sv.ov_square_corner_on|default(False) and sv.ov_square_corner|default(0)|float > 0 %}
                SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={sv.ov_square_corner|float}
            {% endif %}
            {% if sv.ov_retract_len_on|default(False) or sv.ov_retract_speed_on|default(False) or sv.ov_unretract_speed_on|default(False) %}
                SET_RETRACTION RETRACT_LENGTH={sv.ov_retract_len|default(0.75)|float|round(3)} RETRACT_SPEED={sv.ov_retract_speed|default(35)|float|round|int} UNRETRACT_SPEED={sv.ov_unretract_speed|default(35)|float|round|int}
            {% endif %}
            {% if sv.ov_flow_on|default(False) %}
                M221 S{sv.ov_flow|default(100)|float|round}
            {% endif %}

            M117 Prime line
            G0 X{xmin} Y10 F6000
            G0 Z{lh} F300
            G1 X{xmin + 80} E{(80 * emm)|round(2)} F{slowms * 60|int}
            G1 E-2 F2400
            G1 E2 F2400
            {% for n in range(lines) %}
                {% set stn = start + n * step %}
                SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)} SMOOTH_TIME={stn|round(4)}
                G0 X{x0} Y{(y0 + n * spacing)|round(1)} F6000
                G1 X{x0 + length} E{(length * emm)|round(2)} F{fastms * 60|int}
                G1 E-2 F2400
            {% endfor %}
            SET_PRESSURE_ADVANCE ADVANCE={pa|round(4)} SMOOTH_TIME={sv.ov_pa_smooth|default(0.04)|float}
            RESTORE_GCODE_STATE NAME=SM_CAL
            _SOUND_LIB NAME=r2_done
            M117 Smooth cal done - pick line
            NOTIFY TEXT="Smooth test done - line n = smooth {start} + (n-1) x {step}. Pick the best line: PA cal > 'Best sm. ln'" LEVEL=ok
        {% endif %}
    {% endif %}

[gcode_macro PA_SMOOTH_RESULT]
description: Smooth-time calculator: best line (SEG=) or direct value (VALUE=)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set start = sv.smooth_test_start|default(0.004)|float %}
    {% set step = sv.smooth_test_step|default(0.001)|float %}
    {% set stm = params.VALUE|default(-1)|float %}
    {% if stm < 0 %}
        {% set seg = params.SEG|default(0)|int %}
        {% if seg < 1 %}
            NOTIFY TEXT="Smooth calculator: PA_SMOOTH_RESULT SEG=<best line> or VALUE=<smooth>" LEVEL=warn SOUND=r2_notice
        {% else %}
            {% set stm = start + (seg - 1) * step %}
        {% endif %}
    {% endif %}
    {% if stm >= 0.004 and stm <= 0.02 %}
        SET_PRESSURE_ADVANCE SMOOTH_TIME={stm|round(4)}
        SAVE_VARIABLE VARIABLE=ov_pa_smooth VALUE={stm|round(4)}
        SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=True
        NOTIFY TEXT="PA smooth = {stm|round(3)} - set live + saved as overwrite" LEVEL=ok SOUND=r2_done
        M117 Smooth {stm|round(3)} saved
    {% elif stm >= 0 %}
        NOTIFY TEXT="Smooth time must be 0.004..0.02 (got {stm})" LEVEL=warn SOUND=r2_notice
    {% endif %}
[gcode_macro COLD_PULL]
description: Cold pull wizard (heat, flush, cool with beeps, assisted pull, verify)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set step = params.STEP|default('run')|string|lower %}
    {% if step == 'finish' and s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Cold pull finish only when idle" LEVEL=warn SOUND=r2_notice
    {% elif step == 'finish' %}
        # ---- phase: filament pulled - verify the flow ----------------------------------
        {% if printer.extruder.temperature < 180 %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM=196
        {% endif %}
        NOTIFY TEXT="Cold pull: extruding to verify the flow..." LEVEL=info
        SAVE_GCODE_STATE NAME=COLD_PULL_V
        M83
        G1 E20 F150
        RESTORE_GCODE_STATE NAME=COLD_PULL_V
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
        M117 Nozzle clean!
        NOTIFY TEXT="Cold pull done - flow ok? Print a test. Still bad: repeat or change nozzle" LEVEL=ok SOUND=r2_done
    {% elif s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Cold pull only when idle (Maintenance > Filament)" LEVEL=warn SOUND=r2_notice
    {% else %}
        # ---- parameters (console > save_vars > defaults) --------------------------------
        {% set mat = params.MATERIAL|default(sv.cold_pull_mat|default('PLA'))|string|upper %}
        {% set db = {'PLA': (230, 90), 'PETG': (250, 115), 'ABS': (260, 130), 'TPU': (235, 100)} %}
        {% if mat not in db %}
            NOTIFY TEXT="Cold pull material must be PLA, PETG, ABS or TPU (got {mat})" LEVEL=warn SOUND=r2_notice
        {% elif 'filament_switch_sensor filament_sensor' in printer and printer['filament_switch_sensor filament_sensor'].filament_detected|default(False) == false %}
            NOTIFY TEXT="Cold pull: no filament detected - load filament first (it pulls the dirt out)" LEVEL=error SOUND=r2_error
        {% else %}
            {% set hot  = params.HOT|default(sv.cold_pull_hot|default(db[mat][0]))|float %}
            {% set pull = params.PULL|default(sv.cold_pull_pull|default(db[mat][1]))|float %}
            {% set cycles = [params.CYCLES|default(sv.cold_pull_cycles|default(1))|int, 3]|min %}
            {% set rlen = params.RLEN|default(sv.cold_pull_rlen|default(60))|float %}
            {% set rspd = params.RSPD|default(sv.cold_pull_rspd|default(25))|float %}
            {% set beep = params.BEEP|default(sv.cold_pull_beep|default(10))|float %}
            {% if pull >= hot %}{% set pull = hot - 120 %}{% endif %}
            SAVE_VARIABLE VARIABLE=cold_pull_mat VALUE='"{mat}"'
            SAVE_VARIABLE VARIABLE=cold_pull_hot VALUE={hot|round}
            SAVE_VARIABLE VARIABLE=cold_pull_pull VALUE={pull|round}
            SAVE_VARIABLE VARIABLE=cold_pull_cycles VALUE={cycles}
            SAVE_VARIABLE VARIABLE=cold_pull_rlen VALUE={rlen|round}
            SAVE_VARIABLE VARIABLE=cold_pull_rspd VALUE={rspd|round}
            SAVE_VARIABLE VARIABLE=cold_pull_beep VALUE={beep|round}
            RESPOND MSG="Cold pull wizard: {mat}, {cycles} cycle(s), hot {hot|round|int}C -> pull {pull|round|int}C, assist {rlen|round|int}mm@{rspd|round|int}mm/s"
            RESPOND MSG="  the filament STAYS IN while cooling - beeps + LCD show the progress, PULL only at the alarm"
            {% for i in range(cycles) %}
                {% if cycles > 1 %}
                    RESPOND MSG="Cold pull cycle {i + 1}/{cycles}"
                    M117 Cold pull {i + 1}/{cycles}
                {% endif %}
                NOTIFY TEXT="Cold pull: heating to {hot|round|int}C ..." LEVEL=info SOUND=r2_heating
                SET_HEATER_TEMPERATURE HEATER=extruder TARGET={hot|round}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hot - 3}
                # flush + mold: push molten filament (and debris) through, then suck it
                # back a little - the filament takes the shape of the nozzle interior
                M117 Flushing + molding
                SAVE_GCODE_STATE NAME=COLD_PULL_E
                M83
                G1 E25 F150
                G4 P500
                G1 E-10 F120
                RESTORE_GCODE_STATE NAME=COLD_PULL_E
                # cool down with the part fan; the beeper loop pings every BEEP seconds
                # and the LCD counts the temperature down - pull ONLY at the alarm!
                M117 Cooling {pull|round|int}C - WAIT
                M99106 S255
                {% if beep > 0 %}
                    _COLD_PULL_BEEP
                {% endif %}
                TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={pull + 2}
                UPDATE_DELAYED_GCODE ID=_COLD_PULL_BEEP DURATION=0
                M99106 S0
                # PULL NOW: alarm + extruder assist yanks the (tacky) filament out
                _SOUND_LIB NAME=r2_alarm
                M117 PULL NOW!
                RESPOND MSG=">>> PULL NOW - the extruder assists: {rlen|round|int}mm at {rspd|round|int}mm/s" LEVEL=error SOUND=r2_alarm
                SAVE_GCODE_STATE NAME=COLD_PULL_P
                M83
                G1 E-{rlen|round} F{rspd * 60|round}
                RESTORE_GCODE_STATE NAME=COLD_PULL_P
                G4 P1000
                {% if cycles > 1 and i < cycles - 1 %}
                    RESPOND MSG="cycle {i + 1} done - inspect the tip (dirt on it = it worked). Re-inserting for the next cycle..."
                    _SOUND_LIB NAME=r2_start
                    G4 P6000
                {% endif %}
            {% endfor %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
            M117 Cold pull done
            NOTIFY TEXT="Cold pull: {cycles} cycle(s) done - inspect the filament tip (it should carry the nozzle dirt)" LEVEL=ok SOUND=r2_done
            RESPOND MSG="  verify: Maintenance > Filament > Cold pull > 'Pulled -> verify' (or COLD_PULL STEP=finish)"
        {% endif %}
    {% endif %}

[gcode_macro SET_COLD_PULL_MATERIAL]
description: Cold pull: material preset (PLA 230/90, PETG 250/115, ABS 260/130, TPU 235/100)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set db = {'PLA': (230, 90), 'PETG': (250, 115), 'ABS': (260, 130), 'TPU': (235, 100)} %}
    {% set mat = params.MATERIAL|default('')|string|upper %}
    {% if mat in db %}
        SAVE_VARIABLE VARIABLE=cold_pull_mat VALUE='"{mat}"'
        SAVE_VARIABLE VARIABLE=cold_pull_hot VALUE={db[mat][0]}
        SAVE_VARIABLE VARIABLE=cold_pull_pull VALUE={db[mat][1]}
        NOTIFY TEXT="Cold pull preset {mat}: hot {db[mat][0]}C, pull {db[mat][1]}C" LEVEL=ok SOUND=r2_click
    {% else %}
        RESPOND MSG="SET_COLD_PULL_MATERIAL MATERIAL=PLA|PETG|ABS|TPU (got {mat})"
    {% endif %}

[delayed_gcode _COLD_PULL_BEEP]
# R77: pings every cold_pull_beep seconds while the nozzle cools down - and
# shows the live temperature on the LCD so the right pull moment is obvious.
# Self-terminating once the pull temperature is reached (or the target changed).
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set pull = sv.cold_pull_pull|default(90)|float %}
    {% if printer.extruder.target|float > 0 and printer.extruder.temperature|float > pull + 1.5 %}
        _SOUND_LIB NAME=r2_click
        M117 Cooling {printer.extruder.temperature|round(0)|int} -> {pull|round(0)|int}C
        UPDATE_DELAYED_GCODE ID=_COLD_PULL_BEEP DURATION={sv.cold_pull_beep|default(10)|float}
    {% else %}
        M117 Pull temp reached!
    {% endif %}

# -------------------------------------------------------------------------------------
# BELT-DRIVE GEOMETRY CALIBRATION (R2-2026-11-26.13 - audit P1-02, rebuilt)
#   CALIBRATE_BELT [MODE=TEST]                 safe motion diagnostic (default)
#   CALIBRATE_BELT MODE=COMPUTE X=<dev> Y=<dev> [REF=100]
#                                               linear stretch scale, stored
#   CALIBRATE_BELT MODE=STATUS                 report scale + bed limits
#   CALIBRATE_BELT MODE=RESET                  scale back to 1.0 (no correction)
#
# Design notes (audit P1-02 + ChatGPT review):
#   * NO HOMING_VECTOR - that command is undefined in Klipper. We use the
#     standard G28 homing (with a homed_axes prerequisite check) like every
#     other calibration macro here.
#   * NO hardcoded bed coordinates (the old Y=-200 / X=200 were unsafe and
#     outside many builds). All limits come from the centralized hardware
#     profile [gcode_macro _R2_CONFIG] (r2_hardware.cfg, written by setup.sh)
#     with Ender-3 reference defaults - exactly the hardware-abstraction the
#     ChatGPT review asked for.
#   * Compensation model: belt stretch is POSITION-PROPORTIONAL (linear in the
#     distance from the belt anchor). The correct model is a per-axis SCALE
#     factor, NOT a constant SET_GCODE_OFFSET (which would shift the whole bed
#     and cannot represent a position-dependent error). The macro stores the
#     measured scale in save_variables.belt_comp_x/y (declared) and reports it;
#     applying it to physical motion is the motion-layer's job, not a gcode
#     offset's.
#   * belt_comp_x / belt_comp_y are declared in [save_variables] so
#     SET_GCODE_VARIABLE can target them persistently (ChatGPT: missing state variable).
#   * STATUS: this macro STORES + REPORTS the linear scale factor; it does NOT
#     apply it to motion. A correct belt-stretch correction needs a position-
#     proportional (per-axis scale) transform in the motion layer - a gcode
#     offset cannot represent a position-dependent error. Until the motion
#     layer exposes belt-scale support, this is a diagnostic/calibration store
#     (measure -> COMPUTE -> STATUS), not an automatic motion correction.
# LCD: Maintenance > (belt calibration is a console/Mainsail command)
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_BELT]
description: Belt-drive geometry calibration - safe motion test + linear stretch scale (audit P1-02)
gcode:
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    # Centralized machine limits (hardware profile) - never hardcode bed coords.
    {% set x0 = rc.bed_min_x|default(0)|float if rc else 0.0 %}
    {% set x1 = rc.bed_max_x|default(220)|float if rc else 220.0 %}
    {% set y0 = rc.bed_min_y|default(-3)|float if rc else 0.0 %}
    {% set y1 = rc.bed_max_y|default(217)|float if rc else 220.0 %}
    {% set mode = params.MODE|default('TEST')|upper %}

    {% if mode == 'STATUS' %}
        {% set st = printer['gcode_macro _STATE'] %}
        RESPOND MSG="Belt calibration: X scale {st.belt_comp_x|default(1.0)|float} | Y scale {st.belt_comp_y|default(1.0)|float}"
        RESPOND MSG="Bed limits: X {x0}..{x1} | Y {y0}..{y1} (profile: {'r2_hardware.cfg' if rc else 'defaults'})"

    {% elif mode == 'RESET' %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=belt_comp_x VALUE=1.0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=belt_comp_y VALUE=1.0
        RESPOND MSG="Belt compensation reset to 1.0 (no correction)"

    {% elif mode == 'COMPUTE' %}
        # User-measured deviation of a test distance. Belt stretch grows with
        # distance -> a SCALE factor, not a constant offset.
        #   X=<dev_mm>  deviation along X (e.g. +0.4 if a 100 mm test measures 100.4)
        #   Y=<dev_mm>  deviation along Y
        #   REF=<mm>    reference distance the deviation was measured over
        {% set dev_x = params.X|default(0)|float %}
        {% set dev_y = params.Y|default(0)|float %}
        {% set ref = params.REF|default(100)|float %}
        {% if ref <= 0 %}
            RESPOND MSG="REF must be > 0 (reference distance in mm) - nothing done"
        {% else %}
            {% set kx = (ref + dev_x) / ref %}
            {% set ky = (ref + dev_y) / ref %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=belt_comp_x VALUE={kx}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=belt_comp_y VALUE={ky}
            RESPOND MSG="Belt scale stored: X={kx} Y={ky} (dev X={dev_x} Y={dev_y} over REF={ref} mm)"
            RESPOND MSG="NOTE: belt stretch is position-proportional - this is the linear correction. A constant SET_GCODE_OFFSET would shift the whole bed and is the wrong model."
        {% endif %}

    {% else %}
        # MODE=TEST - safe motion diagnostic
        # Homing prerequisite: belt test moves need known positions.
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha %}
            NOTIFY TEXT="Belt test: homing X/Y first..." LEVEL=info SOUND=r2_notice
            G28
        {% endif %}
        # Safe test rectangle clamped INSIDE the bed with a margin - the old
        # hardcoded Y=-200 / X=200 could leave the build volume.
        {% set m = params.MARGIN|default(10, true)|float %}
        {% set cx = (x0 + x1) / 2 %}
        {% set cy = (y0 + y1) / 2 %}
        {% set tx0 = x0 + m %}
        {% set tx1 = x1 - m %}
        {% set ty0 = y0 + m %}
        {% set ty1 = y1 - m %}
        {% if tx0 >= tx1 %}{% set tx0 = cx %}{% set tx1 = cx %}{% endif %}
        {% if ty0 >= ty1 %}{% set ty0 = cy %}{% set ty1 = cy %}{% endif %}
        RESPOND MSG="Belt TEST rect: X {tx0}..{tx1} | Y {ty0}..{ty1} (bed X {x0}..{x1} Y {y0}..{y1}, margin {m})"
        NOTIFY TEXT="Belt motion test - watch the head path" LEVEL=info SOUND=r2_notice
        G1 X{tx0} Y{ty0} F3000
        RESPOND MSG="-> corner A ({tx0}, {ty0})"
        G1 X{tx1} Y{ty0} F3000
        RESPOND MSG="-> corner B ({tx1}, {ty0})"
        G1 X{tx1} Y{ty1} F3000
        RESPOND MSG="-> corner C ({tx1}, {ty1})"
        G1 X{tx0} Y{ty1} F3000
        RESPOND MSG="-> corner D ({tx0}, {ty1})"
        G1 X{tx0} Y{ty0} F3000
        RESPOND MSG="-> back to A (closed loop)"
        G28
        RESPOND MSG="Belt TEST done - head homed. Watch for belt slip/tension along the path."
    {% endif %}

# -------------------------------------------------------------------------------------
# INPUT SHAPER / RESONANCE CALIBRATION (needs an accelerometer, see ISHAPER.md)
#   CALIBRATE_SHAPER AXIS=X|Y|BOTH [FREQ_START] [FREQ_END] [MAX_SMOOTHING] [AUTOSAVE=1]
#   DUMP_RESONANCES [AXIS=X|Y|BOTH]  - raw data files for the Mainsail graphs
# LCD: Maintenance > Vibration Cal.
# -------------------------------------------------------------------------------------
[gcode_macro CALIBRATE_SHAPER]
description: Input shaper calibration via accelerometer (LCD: Vibration Cal.)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Shaper calibration only when idle" LEVEL=warn SOUND=r2_notice
    {% elif 'resonance_tester' not in printer.configfile.settings %}
        NOTIFY TEXT="No [resonance_tester] in printer.cfg - accelerometer required (see ISHAPER.md)" LEVEL=error SOUND=r2_error
    {% else %}
        {% set axis  = params.AXIS|default('BOTH')|string|upper %}
        {% set fs    = params.FREQ_START|default(sv.ishaper_freq_start|default(0))|float %}
        {% set fe    = params.FREQ_END|default(sv.ishaper_freq_end|default(0))|float %}
        {% set sms   = params.MAX_SMOOTHING|default(sv.ishaper_max_smoothing|default(0))|float %}
        {% set asv   = params.AUTOSAVE|default(sv.ishaper_auto_save|default(True))|int == 1 %}
        SAVE_VARIABLE VARIABLE=ishaper_freq_start VALUE={fs}
        SAVE_VARIABLE VARIABLE=ishaper_freq_end VALUE={fe}
        SAVE_VARIABLE VARIABLE=ishaper_max_smoothing VALUE={sms}
        {% if axis not in ['X','Y','BOTH'] %}
            NOTIFY TEXT="AXIS must be X, Y or BOTH (got {axis})" LEVEL=error SOUND=r2_error
        {% elif fe > 0 and fs > 0 and fe <= fs %}
            NOTIFY TEXT="Freq end ({fe}) must be above start ({fs})" LEVEL=error SOUND=r2_error
        {% else %}
            {% set ha = printer.toolhead.homed_axes|lower %}
            {% if 'x' not in ha or 'y' not in ha %}G28{% endif %}
            TURN_OFF_HEATERS
            M99106 S0
            _SOUND_LIB NAME=r2_leveling
            {% set ns_opt = namespace(p='') %}
            {% if fs > 0 %}{% set ns_opt.p = ns_opt.p ~ ' FREQ_START=' ~ fs|round|int %}{% endif %}
            {% if fe > 0 %}{% set ns_opt.p = ns_opt.p ~ ' FREQ_END=' ~ fe|round|int %}{% endif %}
            {% if sms > 0 %}{% set ns_opt.p = ns_opt.p ~ ' MAX_SMOOTHING=' ~ sms %}{% endif %}
            M117 Shaper cal: {axis}...
            NOTIFY TEXT="Shaper calibration {axis} running (takes 1-2 min per axis) - watch the console" LEVEL=info
            {% if axis in ['X','BOTH'] %}
                SHAPER_CALIBRATE AXIS=X{ns_opt.p}
            {% endif %}
            {% if axis in ['Y','BOTH'] %}
                SHAPER_CALIBRATE AXIS=Y{ns_opt.p}
            {% endif %}
            # report + save in a FRESH context (templates render before execution!)
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ishaper_autosave VALUE={asv}
            UPDATE_DELAYED_GCODE ID=_SHAPER_REPORT DURATION=2
        {% endif %}
    {% endif %}

[delayed_gcode _SHAPER_REPORT]
gcode:
    {% set ish = printer.input_shaper if 'input_shaper' in printer else {} %}
    RESPOND MSG="Input shaper now: X {ish.shaper_type_x|default('?')} @ {ish.shaper_freq_x|default(0)|round(1)}Hz | Y {ish.shaper_type_y|default('?')} @ {ish.shaper_freq_y|default(0)|round(1)}Hz"
    M117 X {ish.shaper_type_x|default('?')} {ish.shaper_freq_x|default(0)|round(1)} | Y {ish.shaper_type_y|default('?')} {ish.shaper_freq_y|default(0)|round(1)}
    {% if printer['gcode_macro _STATE'].ishaper_autosave|default(False) %}
        NOTIFY TEXT="Saving shaper values (Klipper restarts once)" LEVEL=info SOUND=r2_confirm
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="Shaper values NOT saved - System > Save config to keep them"
    {% endif %}
    _SOUND_LIB NAME=r2_done

[gcode_macro DUMP_RESONANCES]
description: Write raw resonance data for the Mainsail/spectrogram graphs
gcode:
    {% if 'resonance_tester' not in printer.configfile.settings %}
        NOTIFY TEXT="No [resonance_tester] in printer.cfg - accelerometer required (see ISHAPER.md)" LEVEL=error SOUND=r2_error
    {% else %}
        {% set axis = params.AXIS|default('BOTH')|string|upper %}
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha %}G28{% endif %}
        M99106 S0
        {% if axis in ['X','BOTH'] %}
            M117 Resonances: X
            TEST_RESONANCES AXIS=X OUTPUT=raw_data NAME=r2
        {% endif %}
        {% if axis in ['Y','BOTH'] %}
            M117 Resonances: Y
            TEST_RESONANCES AXIS=Y OUTPUT=raw_data NAME=r2
        {% endif %}
        NOTIFY TEXT="Raw data written to ~/printer_data/compressor/ (r2-*.csv) - graphs: Calibration & Shaping in Mainsail/Compass" LEVEL=ok SOUND=r2_confirm
    {% endif %}

# -------------------------------------------------------------------------------------
# BED MESH MANAGEMENT - save with the temperature as name, load from a list,
# unload so the next print re-levels itself. LCD: Maintenance > Bed Mesh.
# -------------------------------------------------------------------------------------
[gcode_macro SAVE_MESH_AT_TEMP]
description: Save the current mesh with the bed temperature as profile name
gcode:
    # R106 (any-Klipper audit): clear answer without [bed_mesh]
    {% if 'bed_mesh' not in printer %}
        NOTIFY TEXT="No [bed_mesh] in this printer - nothing to save" LEVEL=error SOUND=r2_error
    {% else %}
    {% set sv = printer['save_variables'].variables %}
    {% set bt = printer.heater_bed.target|float if printer.heater_bed.target|float > 0 else printer.heater_bed.temperature|float %}
    {% set name = bt|round(0)|int|string %}
    {% if printer.bed_mesh.profile_name|default('') == '' %}
        NOTIFY TEXT="No mesh active to save - calibrate first" LEVEL=error SOUND=r2_error
    {% elif name|float < 30 %}
        NOTIFY TEXT="Bed temperature too low ({name}C) - profile name would be pointless" LEVEL=warn SOUND=r2_notice
    {% else %}
        BED_MESH_PROFILE SAVE={name}
        SAVE_VARIABLE VARIABLE=mesh_last_profile VALUE='"{name}"'
        {% if sv.mesh_auto_save|default(False) %}
            NOTIFY TEXT="Mesh '{name}' (={bt|round(0)|int}C) saved - saving config (Klipper restarts once)" LEVEL=ok SOUND=r2_leveled
            SAVE_CONFIG
        {% else %}
            NOTIFY TEXT="Mesh '{name}' (={bt|round(0)|int}C) saved (session). Permanent: 'Save after print' ON or System > Save config" LEVEL=ok SOUND=r2_leveled
        {% endif %}
    {% endif %}
    {% endif %}

[gcode_macro MESH_BY_INDEX]
description: Load mesh number n from the profile list (LCD slots, 0-based)
gcode:
    {% set idx = params.INDEX|default(-1)|int %}
    {% set ps = printer.bed_mesh.profiles|list if 'bed_mesh' in printer else [] %}
    {% if idx < 0 or idx >= ps|length %}
        NOTIFY TEXT="No mesh in this slot - pick one with a name" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set name = ps[idx] %}
        LOAD_BED_MESH PROFILE={name}
        SAVE_VARIABLE VARIABLE=mesh_always VALUE=False
        M117 Mesh {name} active (AUTO)
        RESPOND MSG="Mesh '{name}' loaded + active for the following prints (Re-mesh switched to AUTO)"
    {% endif %}

[gcode_macro _MESH_DEL_SLOT]
description: Delete mesh number n from the profile list (2-press, LCD slots)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% set ps = printer.bed_mesh.profiles|list if 'bed_mesh' in printer else [] %}
    {% if idx < 0 or idx >= ps|length %}
        NOTIFY TEXT="No mesh in this slot" LEVEL=warn SOUND=r2_notice
    {% else %}
        DELETE_MESH PROFILE={ps[idx]}
    {% endif %}

[gcode_macro UNLOAD_MESH]
description: Clear the mesh - the next print re-levels (auto meshing) itself
gcode:
    BED_MESH_CLEAR
    SAVE_VARIABLE VARIABLE=mesh_always VALUE=True
    NOTIFY TEXT="Mesh cleared - the next print levels itself again (Re-mesh ON)" LEVEL=ok SOUND=r2_confirm
    M117 Mesh cleared

# -------------------------------------------------------------------------------------
# _CAL_END - finish a calibration like a print end: heaters + bed OFF, fan cooldown,
# motors off, finish sound (used by CALIBRATE_PA).
# -------------------------------------------------------------------------------------
[gcode_macro _CAL_END]
description: End a calibration like a print (heaters off, cooldown, idle)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    TURN_OFF_HEATERS
    M99106 S255
    UPDATE_DELAYED_GCODE ID=_END_FAN_OFF DURATION=15
    {% if s.mode not in ['printing','paused','filament','starting'] %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"finished"'
    {% endif %}
    _SOUND_LIB NAME=r2_done
    M117 Calibration done
    RESPOND MSG="Calibration finished: heaters off, cooling down"
    {% if printer['save_variables'].variables.motors_off_at_end|default(True) %}
        UPDATE_DELAYED_GCODE ID=_END_MOTORS DURATION=60
    {% endif %}

# -------------------------------------------------------------------------------------
# _SAVE_AFTER_CAL - delayed SAVE_CONFIG after interactive calibrations
# (probe offset ACCEPT / extruder steps): runs once when the printer is idle.
# -------------------------------------------------------------------------------------
[delayed_gcode _SAVE_AFTER_CAL]
gcode:
    {% if printer['gcode_macro _STATE'].mode in ['idle','finished'] %}
        RESPOND MSG="Saving calibration (Klipper restarts once)"
        SAVE_CONFIG
    {% endif %}

# -------------------------------------------------------------------------------------
# SELF_TEST - sound, filament sensor, endstops & probe quick test
# -------------------------------------------------------------------------------------
[gcode_macro SELF_TEST]
description: Self test: sounds, sensor, probe
gcode:
    NOTIFY TEXT="R2-D2 self test..." LEVEL=info SOUND=r2_alarm
    G4 P800
    _SOUND_LIB NAME=r2_happy
    RESPOND MSG="Filament sensor: {('DETECTED' if printer['filament_switch_sensor filament_sensor'].filament_detected else 'EMPTY') if 'filament_switch_sensor filament_sensor' in printer else 'not installed'} | enabled={printer['filament_switch_sensor filament_sensor'].enabled if 'filament_switch_sensor filament_sensor' in printer else '-'}"
    {% if printer['gcode_macro _STATE'].mode in ['idle','finished'] %}
        RESPOND MSG="Probe test: homing + probing once..."
        # full homing - 'G28 Z' alone fails with "Must home X and Y axes first"
        # (Z probing positions the head via [safe_z_home] first)
        G28
        RESPOND MSG="Probe ok -> Z: {printer.gcode_move.gcode_position.z|round(2)}mm"
    {% endif %}
    NOTIFY TEXT="Self test done" LEVEL=ok SOUND=r2_confirm

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V12_MAINT]
description: Version sentinel of 12_maintenance.cfg (internal)
gcode:

# ======================================================================================
#  FLOW CALIBRATION (R41) - calculator like PA cal: print a single-wall cube,
#  measure the wall, enter it -> suggested flow %. LCD: Maintenance > Flow Cal.
# =====================================================================================
[gcode_macro FLOW_CAL]
description: Flow calibration calculator (FLOW_CAL MEASURE=0.46 TARGET=0.4)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% set target = params.TARGET|default(sv.flow_cal_target|default(noz))|float %}
    {% set meas = params.MEASURE|default(sv.flow_cal_meas|default(0))|float %}
    {% if meas < 0.1 or meas > 2.0 %}
        RESPOND MSG="Flow cal: print a SINGLE-WALL cube, measure the wall width, then Maintenance > Flow Cal > Measure"
        RESPOND MSG="Flow cal: target wall width = {target}mm"
        M117 Flow cal: measure wall!
    {% else %}
        {% set cur = sv.ov_flow|default(100)|float if sv.ov_flow_on|default(False) else 100.0 %}
        {% set new = (cur * target / meas)|round(1) %}
        {% if new < 50 or new > 150 %}
            RESPOND MSG="Flow cal: {new}% implausible (wall {meas}mm) - check the measurement"
            M117 Flow cal: {new}% implausible
        {% else %}
            SAVE_VARIABLE VARIABLE=flow_cal_meas VALUE={meas}
            SAVE_VARIABLE VARIABLE=flow_cal_result VALUE={new}
            RESPOND MSG="Flow cal: wall {meas}mm -> target {target}mm: flow {cur}% -> {new}% (LCD: Apply)"
            M117 Flow: {cur}% -> {new}% ({meas}mm)
        {% endif %}
    {% endif %}

[gcode_macro FLOW_CAL_APPLY]
description: Apply the calculated flow as overwrite (ON)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if sv.flow_cal_result|default(0)|float > 0 %}
        SET_OVERRIDE_VALUE NAME=flow VALUE={sv.flow_cal_result|float|round}
        RESPOND MSG="Flow overwrite ON: {sv.flow_cal_result|float|round}%"
    {% else %}
        RESPOND MSG="Flow cal: no result yet - measure the cube wall first"
    {% endif %}

# ======================================================================================
#  TEMPERATURE TOWER - GENERATED (R61): a standalone tower, no sliced file needed
#  (user macro, system-integrated: mesh first, prime, your motion values). Every block
#  holds its temperature; best block -> Temp Tower > 'Best block' sets the temp override.
#  TEMP_TOWER_GEN START=220 STEP=-5 BLOCK=10 BLOCKS=5 SIZE=30 LAYER=0.2 FAN=100
# ======================================================================================
[gcode_macro TEMP_TOWER_GEN]
description: Temperature tower (generated): one temperature per block, mesh + prime included
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Temp tower only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set start = params.START|default(sv.ttg_start|default(220))|float %}
        {% set step  = params.STEP|default(sv.ttg_step|default(-5))|float %}
        {% set bh    = params.BLOCK|default(sv.ttg_bh|default(10))|float %}
        {% if bh <= 0.5 %}{% set bh = 10 %}RESPOND MSG="TEMP_TOWER_GEN needs BLOCK > 0.5 - using the default"{% endif %}
        {% set nb    = params.BLOCKS|default(sv.ttg_nb|default(5))|int %}
        {% set size  = params.SIZE|default(sv.ttg_size|default(30))|float %}
        {% set lh    = params.LAYER|default(sv.ttg_layer|default(0.2))|float %}
        {% if lh <= 0.05 %}{% set lh = 0.2 %}RESPOND MSG="TEMP_TOWER_GEN needs LAYER > 0.05 - using the default"{% endif %}
        {% set fan   = params.FAN|default(sv.ttg_fan|default(100))|float %}
        {% set spd   = params.SPEED|default(sv.ttg_speed|default(50))|float %}
        {% set bedt  = params.BED|default(sv.ttg_bed|default(60))|float %}
        {% set acc   = params.ACCEL|default(sv.pa_cal_accel|default(3000))|int %}
        {% set w     = params.WIDTH|default((noz * 1.15)|round(3))|float %}
        {% if w <= 0.2 %}{% set w = (noz * 1.15)|round(3) %}RESPOND MSG="WIDTH must be > 0.2 - using the default"{% endif %}
        {% set cx = params.CENTER_X|default(110)|float %}{% set cy = params.CENTER_Y|default(110)|float %}
        SAVE_VARIABLE VARIABLE=ttg_start VALUE={start|round}
        SAVE_VARIABLE VARIABLE=ttg_step VALUE={step|round}
        SAVE_VARIABLE VARIABLE=ttg_bh VALUE={bh|round}
        SAVE_VARIABLE VARIABLE=ttg_nb VALUE={nb}
        SAVE_VARIABLE VARIABLE=ttg_size VALUE={size|round}
        SAVE_VARIABLE VARIABLE=ttg_layer VALUE={lh|round(2)}
        SAVE_VARIABLE VARIABLE=ttg_fan VALUE={fan|round}
        {% set tlast = start + (nb - 1) * step %}
        {% set tmin = [start, tlast]|min %}{% set tmax = [start, tlast]|max %}
        {% if nb < 2 or nb > 12 %}
            NOTIFY TEXT="Temp tower: BLOCKS must be 2..12 (got {nb})" LEVEL=error SOUND=r2_error
        {% elif step == 0 %}
            NOTIFY TEXT="Temp tower: STEP must not be 0" LEVEL=error SOUND=r2_error
        {% elif tmin < 170 or tmax > 280 %}
            NOTIFY TEXT="Temp tower: temperatures must stay 170..280C (got {tmin}..{tmax})" LEVEL=error SOUND=r2_error
        {% elif bh / lh < 2 %}
            NOTIFY TEXT="Temp tower: BLOCK height needs at least 2 layers (got {bh}/{lh})" LEVEL=error SOUND=r2_error
        {% else %}
            {% set lpb = (bh / lh)|int %}
            {% set emm = (w * lh / 2.405)|round(4) %}
            {% set acc_old = printer.toolhead.max_accel|default(4000)|int %}
            {% set x0 = (cx - size / 2)|round(2) %}{% set x1 = (cx + size / 2)|round(2) %}
            {% set y0 = (cy - size / 2)|round(2) %}{% set y1 = (cy + size / 2)|round(2) %}
            M99106 S0
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}
            M117 Temp tower: homing
            G28
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={start|round}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={start - 3}
            {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                _CALIBRATE_MESH_PROFILE PROFILE=r2
            {% else %}
                {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
                {% if printer.bed_mesh.profile_name|default('') == '' and 'r2' in profiles %}
                    LOAD_MESH_PROFILE PROFILE=r2
                    RESPOND MSG="Temp tower: saved mesh 'r2' loaded (no probe -> no fresh mesh)"
                {% endif %}
            {% endif %}
            NOTIFY TEXT="Temp tower: {nb} blocks x {bh|round|int}mm, {start|round|int}C .. {tlast|round|int}C step {step|round|int} | fan {fan|round|int}%" LEVEL=ok SOUND=r2_hot
            SAVE_GCODE_STATE NAME=TTOwer
            G90
            M83
            SET_VELOCITY_LIMIT ACCEL={acc}
            M99106 S{(fan * 2.55)|round|int}
            # prime line
            M117 Prime line
            G0 X15 Y10 F6000
            G0 Z{lh|round(2)} F300
            G1 X75 E{(60 * emm)|round(2)} F{spd * 60|int}
            G1 E-2 F2400
            G0 X{x0} Y{y0} F9000
            {% set cl = namespace(v=0) %}
            {% for b in range(nb) %}
            {% set btemp = start + b * step %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={btemp|round}
            RESPOND MSG="Temp tower block {b + 1}/{nb}: {btemp|round|int}C"
            M117 Block {b + 1}/{nb}: {btemp|round|int}C
            {% for l in range(lpb) %}
            {% set cl.v = cl.v + 1 %}
            G1 Z{(cl.v * lh)|round(2)} F1200
            G1 X{x1} Y{y0} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x1} Y{y1} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x0} Y{y1} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x0} Y{y0} E{(size * emm)|round(3)} F{spd * 60|int}
            {% endfor %}
            {% endfor %}
            G1 E-2 F2400
            G0 Z{(nb * bh + 10)|round(1)} F3000
            G0 X{[10, printer.toolhead.axis_minimum.x + 2]|max|round(0)|int} Y{[190, printer.toolhead.axis_maximum.y - 4]|min|round(0)|int} F6000
            M99106 S0
            RESTORE_GCODE_STATE NAME=TTOwer
            M117 Best block? Temp Tower
            NOTIFY TEXT="Temp tower done: pick the best block -> Temp Tower > 'Best block'" LEVEL=ok SOUND=r2_question
            _CAL_END
        {% endif %}
    {% endif %}

[gcode_macro TEMP_TOWER_RESULT]
description: Temp tower calculator: BLOCK=n -> temperature = start + (n-1)*step -> temp override ON
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set b = params.BLOCK|default(0)|int %}
    {% set nb = sv.ttg_nb|default(0)|int %}
    {% if b < 1 or b > nb %}
        RESPOND MSG="Temp tower: BLOCK must be 1..{nb} (got {b})"
    {% else %}
        {% set tt = (sv.ttg_start|default(220)|float + (b - 1) * sv.ttg_step|default(-5)|float)|round %}
        SET_OVERRIDE_VALUE NAME=hotend_first VALUE={tt}
        SET_OVERRIDE_VALUE NAME=hotend_after VALUE={tt}
        RESPOND MSG="Temp tower: block {b} = {tt}C -> hotend override ON (L1+L2)"
        M117 Best: {tt}C
    {% endif %}

# ======================================================================================
#  FLOW TEST CUBE (R61) - the single-wall flow cube as a GENERATED print (user macro,
#  system-integrated): E is computed from FLOW% directly (independent of M221), so you
#  can test ANY flow% without touching the global flow override. Print, measure the
#  wall, then Flow Cal > Measure does the math (calculator stays).
#  FLOW_TEST SIZE=30 HEIGHT=10 LAYER=0.2 FLOW=100 SPEED=60 EXTRUDER=200 BED=60
# ======================================================================================
[gcode_macro FLOW_TEST]
description: Flow test cube (generated): 4-wall cube, FLOW% baked into E - measure, then Flow Cal
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Flow cube only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set size  = params.SIZE|default(sv.flow_t_size|default(30))|float %}
        {% if size <= 1.0 %}{% set size = 30 %}RESPOND MSG="FLOW_TEST needs SIZE > 1.0 - using the default"{% endif %}
        {% set height = params.HEIGHT|default(sv.flow_t_height|default(10))|float %}
        {% if height <= 0.5 %}{% set height = 10 %}RESPOND MSG="FLOW_TEST needs HEIGHT > 0.5 - using the default"{% endif %}
        {% set lh     = params.LAYER|default(sv.flow_t_layer|default(0.2))|float %}
        {% if lh <= 0.05 %}{% set lh = 0.2 %}RESPOND MSG="FLOW_TEST needs LAYER > 0.05 - using the default"{% endif %}
        {% set flow   = params.FLOW|default(sv.flow_t_flow|default(100))|float %}
        {% set spd    = params.SPEED|default(sv.flow_t_speed|default(60))|float %}
        {% set target = params.EXTRUDER|default(sv.flow_t_hotend|default(210))|float %}
        {% set bedt   = params.BED|default(sv.flow_t_bed|default(60))|float %}
        {% set acc    = params.ACCEL|default(sv.pa_cal_accel|default(3000))|int %}
        {% set w      = params.WIDTH|default((noz * 1.15)|round(3))|float %}
        {% if w <= 0.2 %}{% set w = (noz * 1.15)|round(3) %}RESPOND MSG="WIDTH must be > 0.2 - using the default"{% endif %}
        {% set cx = params.CENTER_X|default(110)|float %}{% set cy = params.CENTER_Y|default(110)|float %}
        {% set nl = (height / lh)|int %}
        SAVE_VARIABLE VARIABLE=flow_t_size VALUE={size|round}
        SAVE_VARIABLE VARIABLE=flow_t_height VALUE={height|round}
        SAVE_VARIABLE VARIABLE=flow_t_layer VALUE={lh|round(2)}
        SAVE_VARIABLE VARIABLE=flow_t_flow VALUE={flow|round}
        SAVE_VARIABLE VARIABLE=flow_t_speed VALUE={spd|round}
        SAVE_VARIABLE VARIABLE=flow_t_hotend VALUE={target|round}
        SAVE_VARIABLE VARIABLE=flow_t_bed VALUE={bedt|round}
        {% if size < 10 or size > 120 %}
            NOTIFY TEXT="Flow cube: SIZE must be 10..120mm (got {size})" LEVEL=error SOUND=r2_error
        {% elif lh < 0.04 or lh > 0.75 %}
            NOTIFY TEXT="Flow cube: LAYER must be 0.04..0.75mm (got {lh})" LEVEL=error SOUND=r2_error
        {% elif nl < 1 or nl > 400 %}
            NOTIFY TEXT="Flow cube: HEIGHT/LAYER must give 1..400 layers (got {nl})" LEVEL=error SOUND=r2_error
        {% elif flow < 50 or flow > 300 %}
            NOTIFY TEXT="Flow cube: FLOW must be 50..300% (got {flow})" LEVEL=error SOUND=r2_error
        {% else %}
            {% set emm = (w * lh / 2.405 * flow / 100.0)|round(4) %}
            {% set acc_old = printer.toolhead.max_accel|default(4000)|int %}
            {% set xmin = 15 %}{% set xmax = [printer.toolhead.axis_maximum.x - 15, 220]|min|float %}
            {% set ymin = 25 %}{% set ymax = [printer.toolhead.axis_maximum.y - 15, 200]|min|float %}
            {% set x0 = (cx - size / 2)|round(2) %}{% set x1 = (cx + size / 2)|round(2) %}
            {% set y0 = (cy - size / 2)|round(2) %}{% set y1 = (cy + size / 2)|round(2) %}
            M99106 S0
            {% if bedt >= 40 %}SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}{% endif %}
            M117 Flow cube: homing
            G28
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target|round}
            {% if bedt >= 40 %}TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}{% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 3}
            {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                _CALIBRATE_MESH_PROFILE PROFILE=r2
            {% else %}
                {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
                {% if printer.bed_mesh.profile_name|default('') == '' and 'r2' in profiles %}
                    LOAD_MESH_PROFILE PROFILE=r2
                    RESPOND MSG="Flow cube: saved mesh 'r2' loaded (no probe -> no fresh mesh)"
                {% endif %}
            {% endif %}
            NOTIFY TEXT="Flow cube: {size|round|int}mm x {nl} layers x {lh}mm, FLOW {flow|round|int}% (E-based), {spd|round|int}mm/s" LEVEL=ok SOUND=r2_hot
            SAVE_GCODE_STATE NAME=FLOWCAL
            G90
            M83
            SET_VELOCITY_LIMIT ACCEL={acc}
            {% if sv.ov_retract_len_on|default(False) or sv.ov_retract_speed_on|default(False) or sv.ov_unretract_speed_on|default(False) %}
                SET_RETRACTION RETRACT_LENGTH={sv.ov_retract_len|default(0.75)|float|round(3)} RETRACT_SPEED={sv.ov_retract_speed|default(35)|float|round|int} UNRETRACT_SPEED={sv.ov_unretract_speed|default(35)|float|round|int}
            {% endif %}
            # prime line at the front edge (the cube itself starts in mid-air Z=lh)
            M117 Prime line
            G0 X{xmin} Y10 F6000
            G0 Z{lh|round(2)} F300
            G1 X{xmin + 60} E{(60 * emm)|round(2)} F{spd * 60|int}
            G1 E-2 F2400
            # the cube: one closed 4-side contour per layer, no travels at all
            G0 X{x0} Y{y0} F9000
            {% for layer in range(nl) %}
            {% set z = ((layer + 1) * lh)|round(2) %}
            G1 Z{z} F1200
            {% if layer % 10 == 0 %}M117 Flow cube: layer {layer + 1}/{nl}{% endif %}
            G1 X{x1} Y{y0} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x1} Y{y1} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x0} Y{y1} E{(size * emm)|round(3)} F{spd * 60|int}
            G1 X{x0} Y{y0} E{(size * emm)|round(3)} F{spd * 60|int}
            {% endfor %}
            G1 E-2 F2400
            G0 Z{(height + 10)|round(1)} F3000
            G0 X10 Y{ymax|round} F6000
            RESTORE_GCODE_STATE NAME=FLOWCAL
            M117 Measure the wall!
            NOTIFY TEXT="Flow cube done (FLOW {flow|round|int}%): measure the wall -> Flow Cal > Measure" LEVEL=ok SOUND=r2_question
            _CAL_END
        {% endif %}
    {% endif %}

# ======================================================================================
#  TEMPERATURE TOWER (R41) - band control per layer. Works for LAYER_MARK files AND
#  legacy files (both layer counters feed the hook). Calculator prints the band plan.
#  TEMP_TOWER_START START=200 END=230 STEP=5 BAND=10  /  TEMP_TOWER_STOP
# =====================================================================================
[gcode_macro TEMP_TOWER_START]
description: Temperature tower: change hotend temp every BAND layers (START..END in STEP)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set s = printer['gcode_macro _STATE'] %}
    {% set start = params.START|default(200)|float %}
    {% set end   = params.END|default(230)|float %}
    {% set step  = params.STEP|default(5)|float %}
    {% set band  = params.BAND|default(10)|int %}
    {% if step <= 0 or band <= 0 or (step > 0 and end <= start) %}
        RESPOND MSG="Temp tower: need START<END, STEP>0, BAND>0"; M117 Tower: bad params
    {% else %}
        {% set bands = (((end - start) / step)|round(2) / 1)|int + 1 %}
        SAVE_VARIABLE VARIABLE=tt_start VALUE={start}
        SAVE_VARIABLE VARIABLE=tt_end VALUE={end}
        SAVE_VARIABLE VARIABLE=tt_step VALUE={step}
        SAVE_VARIABLE VARIABLE=tt_band VALUE={band}
        SAVE_VARIABLE VARIABLE=tt_active VALUE=True
        RESPOND MSG="Temp tower ACTIVE: {bands} bands x {band} layers: {start|int}C .. {end|int}C in {step|int}C steps"
        RESPOND MSG="Temp tower: stop with TEMP_TOWER_STOP (or it holds the last temp at the end)"
        M117 Tower: {start|int}-{end|int}C/{step|int}
        {% if s.mode in ['printing','paused'] %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={start|round}
            RESPOND MSG="Temp tower: layer 1 -> {start|round|int}C"
        {% endif %}
    {% endif %}

[gcode_macro TEMP_TOWER_STOP]
description: Stop the temperature tower control (keeps the current temp)
gcode:
    SAVE_VARIABLE VARIABLE=tt_active VALUE=False
    RESPOND MSG="Temp tower stopped - pick your best band and set the material preset"
    M117 Tower stopped

# ======================================================================================
#  IRONING CALIBRATION CARD (R41) - 3 patches, each ironed with its own flow%/speed.
#  Compare the shine, then set the winner in Pre-Print > Ironing. PA-cal style gcode.
# =====================================================================================
# ======================================================================================
#  RETRACT TOWER (R61) - two masts, the retract length rises block by block (user macro,
#  system-integrated). Manual G1 E- retracts (slicer-style, not firmware G10) so the
#  tower tests exactly the length your SLICER would use. Best block -> Retract Tower >
#  'Best block' sets the retract override.
#  RETRACT_TOWER START=0.5 STEP=0.5 BLOCK=5 BLOCKS=6 DIST=40 TOWER=10
# ======================================================================================
[gcode_macro RETRACT_TOWER]
description: Retract tower (generated): two masts, retract length rises per block
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Retract tower only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set rstart = params.START|default(sv.rt_start|default(0.5))|float %}
        {% set rstep  = params.STEP|default(sv.rt_step|default(0.5))|float %}
        {% set bh     = params.BLOCK|default(sv.rt_bh|default(5))|float %}
        {% if bh <= 0.5 %}{% set bh = 5 %}RESPOND MSG="RETRACT_TOWER needs BLOCK > 0.5 - using the default"{% endif %}
        {% set nb     = params.BLOCKS|default(sv.rt_nb|default(6))|int %}
        {% set dist   = params.DIST|default(sv.rt_dist|default(40))|float %}
        {% set tsz    = params.TOWER|default(sv.rt_tower|default(10))|float %}
        {% set rs     = params.RETRACT_SPEED|default(sv.rt_rspeed|default(40))|float %}
        {% set lh     = params.LAYER|default(sv.rt_layer|default(0.2))|float %}
        {% if lh <= 0.05 %}{% set lh = 0.2 %}RESPOND MSG="RETRACT_TOWER needs LAYER > 0.05 - using the default"{% endif %}
        {% set spd    = params.SPEED|default(sv.rt_speed|default(50))|float %}
        {% set tspd   = params.TRAVEL_SPEED|default(sv.rt_tspeed|default(150))|float %}
        {% set target = params.EXTRUDER|default(sv.rt_hotend|default(210))|float %}
        {% set bedt   = params.BED|default(sv.rt_bed|default(60))|float %}
        {% set acc    = params.ACCEL|default(sv.pa_cal_accel|default(3000))|int %}
        {% set w      = params.WIDTH|default((noz * 1.15)|round(3))|float %}
        {% if w <= 0.2 %}{% set w = (noz * 1.15)|round(3) %}RESPOND MSG="WIDTH must be > 0.2 - using the default"{% endif %}
        {% set cx = params.CENTER_X|default(110)|float %}{% set cy = params.CENTER_Y|default(110)|float %}
        {% set rmax = rstart + (nb - 1) * rstep %}
        {% if nb < 2 or nb > 15 %}
            NOTIFY TEXT="Retract tower: BLOCKS must be 2..15 (got {nb})" LEVEL=error SOUND=r2_error
        {% elif rstart < 0 or rstep < 0 or rmax > 10 %}
            NOTIFY TEXT="Retract tower: retract range must stay 0..10mm (got {rstart}..{rmax})" LEVEL=error SOUND=r2_error
        {% elif bh / lh < 2 %}
            NOTIFY TEXT="Retract tower: BLOCK height needs at least 2 layers (got {bh}/{lh})" LEVEL=error SOUND=r2_error
        {% else %}
            SAVE_VARIABLE VARIABLE=rt_start VALUE={rstart|round(2)}
            SAVE_VARIABLE VARIABLE=rt_step VALUE={rstep|round(2)}
            SAVE_VARIABLE VARIABLE=rt_bh VALUE={bh|round}
            SAVE_VARIABLE VARIABLE=rt_nb VALUE={nb}
            SAVE_VARIABLE VARIABLE=rt_dist VALUE={dist|round}
            SAVE_VARIABLE VARIABLE=rt_tower VALUE={tsz|round}
            SAVE_VARIABLE VARIABLE=rt_rspeed VALUE={rs|round}
            SAVE_VARIABLE VARIABLE=rt_hotend VALUE={target|round}
            SAVE_VARIABLE VARIABLE=rt_bed VALUE={bedt|round}
            {% set lpb = (bh / lh)|int %}
            {% set emm = (w * lh / 2.405)|round(4) %}
            {% set acc_old = printer.toolhead.max_accel|default(4000)|int %}
            {% set ht = tsz / 2 %}{% set hd = dist / 2 %}
            {% set t1x0 = (cx - hd - ht)|round(2) %}{% set t1x1 = (cx - hd + ht)|round(2) %}
            {% set t2x0 = (cx + hd - ht)|round(2) %}{% set t2x1 = (cx + hd + ht)|round(2) %}
            {% set y0 = (cy - ht)|round(2) %}{% set y1 = (cy + ht)|round(2) %}
            M99106 S0
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}
            M117 Retract tower: homing
            G28
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target|round}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 3}
            {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                _CALIBRATE_MESH_PROFILE PROFILE=r2
            {% else %}
                {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
                {% if printer.bed_mesh.profile_name|default('') == '' and 'r2' in profiles %}
                    LOAD_MESH_PROFILE PROFILE=r2
                    RESPOND MSG="Retract tower: saved mesh 'r2' loaded (no probe -> no fresh mesh)"
                {% endif %}
            {% endif %}
            NOTIFY TEXT="Retract tower: {nb} blocks x {bh|round|int}mm, retract {rstart}..{rmax|round(2)}mm step {rstep} | masts {dist|round|int}mm apart" LEVEL=ok SOUND=r2_hot
            SAVE_GCODE_STATE NAME=RTCAL
            G90
            M83
            SET_VELOCITY_LIMIT ACCEL={acc}
            # prime line
            M117 Prime line
            G0 X15 Y10 F6000
            G0 Z{lh|round(2)} F300
            G1 X75 E{(60 * emm)|round(2)} F{spd * 60|int}
            G1 E-2 F2400
            G0 X{t1x0} Y{y0} F9000
            {% set cl = namespace(v=0) %}
            {% for b in range(nb) %}
            {% set cr = rstart + b * rstep %}
            RESPOND MSG="Retract block {b + 1}/{nb}: {cr|round(2)}mm"
            M117 Block {b + 1}/{nb}: R{cr|round(2)}
            {% for l in range(lpb) %}
            {% set cl.v = cl.v + 1 %}
            # mast 1 (left)
            G1 Z{(cl.v * lh)|round(2)} F1200
            G1 X{t1x1} Y{y0} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t1x1} Y{y1} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t1x0} Y{y1} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t1x0} Y{y0} E{(tsz * emm)|round(3)} F{spd * 60|int}
            # retract + travel to mast 2
            G1 E-{cr|round(2)} F{rs * 60|int}
            G0 X{t2x0} Y{y0} F{tspd * 60|int}
            G1 E{cr|round(2)} F{rs * 60|int}
            # mast 2 (right)
            G1 X{t2x1} Y{y0} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t2x1} Y{y1} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t2x0} Y{y1} E{(tsz * emm)|round(3)} F{spd * 60|int}
            G1 X{t2x0} Y{y0} E{(tsz * emm)|round(3)} F{spd * 60|int}
            # back to mast 1 for the next layer
            G1 E-{cr|round(2)} F{rs * 60|int}
            G0 Z{(cl.v * lh + 0.4)|round(2)} F600
            G0 X{t1x0} Y{y0} F{tspd * 60|int}
            G1 E{cr|round(2)} F{rs * 60|int}
            {% endfor %}
            {% endfor %}
            G1 E-2 F2400
            G0 Z{(nb * bh + 10)|round(1)} F3000
            G0 X{[10, printer.toolhead.axis_minimum.x + 2]|max|round(0)|int} Y{[190, printer.toolhead.axis_maximum.y - 4]|min|round(0)|int} F6000
            RESTORE_GCODE_STATE NAME=RTCAL
            M117 Best block? Retract
            NOTIFY TEXT="Retract tower done: cleanest masts/stringing wins -> Retract Tower > 'Best block'" LEVEL=ok SOUND=r2_question
            _CAL_END
        {% endif %}
    {% endif %}

[gcode_macro RETRACT_TOWER_RESULT]
description: Retract tower calculator: BLOCK=n -> retract = start + (n-1)*step -> retract override ON
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set b = params.BLOCK|default(0)|int %}
    {% set nb = sv.rt_nb|default(0)|int %}
    {% if b < 1 or b > nb %}
        RESPOND MSG="Retract tower: BLOCK must be 1..{nb} (got {b})"
    {% else %}
        {% set rl = (sv.rt_start|default(0.5)|float + (b - 1) * sv.rt_step|default(0.5)|float)|round(2) %}
        SET_OVERRIDE_VALUE NAME=retract_len VALUE={rl}
        RESPOND MSG="Retract tower: block {b} = {rl}mm -> retract override ON"
        M117 Best: R{rl}mm
    {% endif %}

[gcode_macro IRONING_CAL]
description: Ironing cards (R61): CARDS cards x (flow%, speed), START_LAYER base layers first
gcode:
    {% set st = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set noz = cfg_e.get('nozzle_diameter', 0.4)|float %}
    {% if st.mode not in ['idle','finished'] %}
        RESPOND MSG="Ironing cal only when idle"; M117 Idle only
    {% else %}
        {% set temp  = params.TEMP|default(sv.iron_cal_temp|default(200))|float %}
        {% set bedt  = params.BED|default(60)|float %}
        {% set cards = params.CARDS|default(sv.iron_cal_cards|default(3))|int %}
        {% set sl    = params.START_LAYER|default(sv.iron_cal_sl|default(1))|int %}
        {% set lh    = params.LAYER|default(sv.iron_cal_layer|default(0.2))|float %}
        {% if lh <= 0.05 %}{% set lh = 0.2 %}RESPOND MSG="IRONING_CAL needs LAYER > 0.05 - using the default"{% endif %}
        {% set len   = params.LEN|default(40)|float %}
        {% set wid   = params.WID|default(24)|float %}
        {% if wid <= 1.0 %}{% set wid = 24 %}RESPOND MSG="IRONING_CAL needs WID > 1.0 - using the default"{% endif %}
        {% set w     = params.WIDTH|default((noz * 1.15)|round(3))|float %}
        {% if w <= 0.2 %}{% set w = (noz * 1.15)|round(3) %}RESPOND MSG="IRONING_CAL needs WIDTH > 0.2 - using the default"{% endif %}
        {% set acc   = params.ACCEL|default(3000)|int %}
        {% set pspd  = params.PSPEED|default(50)|float %}
        {% set Fs = [params.F1|default(sv.iron_cal_f1|default(10))|float, params.F2|default(sv.iron_cal_f2|default(15))|float,
                     params.F3|default(sv.iron_cal_f3|default(20))|float, params.F4|default(25)|float,
                     params.F5|default(30)|float, params.F6|default(35)|float] %}
        {% set Ss = [params.S1|default(sv.iron_cal_s1|default(20))|float, params.S2|default(sv.iron_cal_s2|default(30))|float,
                     params.S3|default(sv.iron_cal_s3|default(40))|float, params.S4|default(50)|float,
                     params.S5|default(60)|float, params.S6|default(70)|float] %}
        # Invalidate the previous snapshot before attempting a new run.
        SAVE_VARIABLE VARIABLE=iron_result_valid VALUE=False
        SAVE_VARIABLE VARIABLE=iron_cal_temp VALUE={temp|round}
        SAVE_VARIABLE VARIABLE=iron_cal_cards VALUE={cards}
        SAVE_VARIABLE VARIABLE=iron_cal_sl VALUE={sl}
        SAVE_VARIABLE VARIABLE=iron_cal_layer VALUE={lh|round(2)}
        {% if cards < 1 or cards > 6 %}
            RESPOND MSG="Ironing cal: CARDS must be 1..6 (got {cards})"; M117 Cards 1..6
        {% elif sl < 1 or sl > 30 %}
            RESPOND MSG="Ironing cal: START_LAYER must be 1..30 (got {sl})"; M117 StartL 1..30
        {% else %}
            # sizes adapt to the card count: everything must fit X 15..205
            {% set gap = 8 %}
            {% set clen = [(205 - 10 - gap * (cards - 1)) / cards, len]|min|round(1) %}
            {% if clen < 12 %}
                RESPOND MSG="Ironing cal: {cards} cards do not fit the bed (each would be {clen}mm)"; M117 Too many cards
            {% else %}
                {% set area = 2.405 %}
                {% set eperm = (w * lh / area)|round(4) %}
                {% set nl = (wid / w)|int %}
                M117 Ironing cal: heating...
                SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedt|round}
                SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp|round}
                {% set ha = printer.toolhead.homed_axes|lower %}
                {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}G28{% endif %}
                TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedt - 2}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}
                # R54: mesh before the test (the cards sit ON the mesh)
                {% if 'probe' in printer.configfile.settings and 'gcode_macro _CALIBRATE_MESH_PROFILE' in printer %}
                    _CALIBRATE_MESH_PROFILE PROFILE=r2
                {% else %}
                    {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
                    {% if printer.bed_mesh.profile_name|default('') == '' and 'r2' in profiles %}
                        LOAD_MESH_PROFILE PROFILE=r2
                        RESPOND MSG="Ironing cal: saved mesh 'r2' loaded"
                    {% endif %}
                {% endif %}
                NOTIFY TEXT="Ironing cal: {cards} cards x {clen}mm, {sl} base layer(s) then ironing | F {Fs[0]}..{Fs[cards - 1]}% S {Ss[0]}..{Ss[cards - 1]}mm/s" LEVEL=ok SOUND=r2_hot
                SAVE_GCODE_STATE NAME=IRONCAL
                G90
                M83
                SET_VELOCITY_LIMIT ACCEL={acc}
                G0 Z5 F600
                M117 Prime line
                G0 X15 Y10 F6000
                G0 Z{lh|round(2)} F300
                G1 X75 E{(60 * eperm)|round(2)} F{pspd * 60|int}
                G1 E-2 F2400
                {% for c in range(cards) %}
                {% set fx = Fs[c] %}{% set sx = Ss[c] %}
                {% set x0 = (10 + c * (clen + gap))|round(1) %}
                M117 Card {c + 1}/{cards}: F{fx|int}% S{sx|int}
                RESPOND MSG="Ironing card {c + 1}/{cards}: flow {fx|int}% speed {sx|int}mm/s (after {sl} base layer(s))"
                # ---- base layers (solid patch, NO ironing) ----
                {% for lay in range(sl) %}
                G0 X{x0} Y10 F6000
                G0 Z{((lay + 1) * lh)|round(2)} F300
                {% for j in range(nl) %}
                G1 X{x0 + clen} E{(clen * eperm)|round(3)} F{pspd * 60|int}
                G0 Y{10 + (j + 1) * w|round(2)} F6000
                G0 X{x0} F9000
                {% endfor %}
                {% endfor %}
                # ---- ironing pass on top (flow fx% of a full line, speed sx, half spacing) ----
                G0 Z{((sl + 1) * lh)|round(2)} F300
                G0 X{x0} Y10 F6000
                {% for j in range((nl / 2)|int + 1) %}
                G1 X{x0 + clen} E{(clen * eperm * fx / 100)|round(3)} F{sx * 60|int}
                G0 Y{10 + (j + 1) * w / 2|round(2)} F6000
                G0 X{x0} F9000
                {% endfor %}
                G0 Z5 F600
                {% endfor %}
                G0 X10 Y{[printer.toolhead.axis_maximum.y - 5, 200]|min|round} F6000
                RESTORE_GCODE_STATE NAME=IRONCAL
                M117 Ironing cal: pick!
                RESPOND MSG="Ironing cal done: {cards} cards (F{Fs[0]}%/{Ss[0]}mm/s .. F{Fs[cards - 1]}%/{Ss[cards - 1]}mm/s), {sl} base layer(s)"
                # Publish after the generated command sequence; this does not
                # prove physical completion or survive every storage failure.
                {% for c in range(cards) %}
                SAVE_VARIABLE VARIABLE=iron_result_f{(c + 1)|lower} VALUE={Fs[c]}
                SAVE_VARIABLE VARIABLE=iron_result_s{(c + 1)|lower} VALUE={Ss[c]}
                {% endfor %}
                SAVE_VARIABLE VARIABLE=iron_result_cards VALUE={cards}
                SAVE_VARIABLE VARIABLE=iron_result_valid VALUE=True
                RESPOND MSG="Pick the best card -> Ironing Cal > Best card (shows values - does not apply overrides)"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro IRONING_RESULT]
description: Show the selected completed ironing card; no automatic overrides
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set c = params.CARD|default(0)|int %}
    {% set cards = sv.iron_result_cards|default(0)|int %}
    {% if not sv.iron_result_valid|default(False) %}
        RESPOND MSG="Ironing cal: no completed card snapshot - run calibration before selecting a card"
    {% elif c < 1 or c > cards or c > 6 %}
        RESPOND MSG="Ironing cal: CARD must be 1..{cards} (got {c})"
    {% elif ('iron_result_f' ~ c) not in sv or ('iron_result_s' ~ c) not in sv %}
        RESPOND MSG="Ironing cal: card snapshot incomplete - no overrides applied"
    {% else %}
        {% set flow = sv['iron_result_f' ~ c]|float %}
        {% set speed = sv['iron_result_s' ~ c]|float %}
        RESPOND MSG="Ironing card {c}: flow {flow}% of full line, speed {speed}mm/s - no overrides applied"
        RESPOND MSG="Set slicer values separately - feature speed override is relative to file speed, not mm/s"
        M117 Iron F{flow|round|int} S{speed|round|int}
    {% endif %}

# =====================================================================================
#  NOZZLE WIPE (R53) - heat + fast zigzag on the front-left silicone pad
#  User rules (.37): heat the nozzle BEFORE wiping; pad area X0..13 / Y0..13
#  (at the axis-minimum corner); descend to max 4 mm; 1-2 fast passes; then
#  park the nozzle HIGH again (waiting states never hover low over the bed).
#  _NOZZLE_WIPE = internal (no guards - called from every purge chain),
#  CLEAN_NOZZLE = the public LCD/maintenance entry with the printing guard.
# =====================================================================================
[gcode_macro _NOZZLE_WIPE]
description: Heat + zigzag wipe on the front-left pad, ends parked HIGH (R53, internal)
gcode:
    {% set passes = params.PASSES|default(2)|int %}
    {% set temp = params.TEMP|default(180)|float %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% set lift = [15, zmax - 5]|min|float %}
    # R104: the wipe pad anchor is configurable ([r2_postproc] wipe_x/wipe_y in
    # printer.cfg) for machines whose pad sits elsewhere; default = the axis
    # minimum corner (unchanged). Clamped so the 13x13 pad stays on the axes.
    {% set rc_w = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set x0 = [[rc_w.wipe_x|default(xmin)|float if rc_w else xmin, xmax - 13]|min, xmin]|max|round(1) %}
    {% set y0 = [[rc_w.wipe_y|default(ymin)|float if rc_w else ymin, ymax - 13]|min, ymin]|max|round(1) %}
    {% set x1 = x0 + 13 %}{% set y1 = y0 + 13 %}
    {% set step = 13.0 / 4 %}
    {% set old_target = printer.extruder.target|float %}
    # ---- 1) heat first - wiping a cold nozzle just smears the residue ---------------
    {% if printer.extruder.temperature|float < temp - 5 %}
        NOTIFY TEXT="Nozzle wipe: heating to {temp|round|int}C first..." LEVEL=info SOUND=r2_heating
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}
        G4 P2000
    {% endif %}
    _PROBE_STOW
    {% if 'xyz' not in printer.toolhead.homed_axes|lower %}
        G28
    {% endif %}
    G90
    # R167 (.125 field log): the wipe was slow again - it inherited whatever
    # accel/speed-factor was left over (a print's M204 S1500, a live M220).
    # The zigzag now sets its OWN crisp values (8 m/s2 + 100% feed) and
    # restores the machine accel afterwards - the file's first M204 takes
    # over from there anyway.
    M99220 S100
    _ACCEL_SET VALUE=8000
    # ---- 2) over the pad, down to max 4 mm, FAST zigzag (X0<->13, Y 0->13) -----------
    G0 Z{lift|round(1)} F600
    G0 X{x0|round(1)} Y{y0|round(1)} F8000
    G1 Z4 F1200
    {% for p in range(passes) %}
        G1 X{x1|round(1)} Y{(y0 + step)|round(1)} F7000
        G1 X{x0|round(1)} Y{(y0 + 2 * step)|round(1)} F7000
        G1 X{x1|round(1)} Y{(y0 + 3 * step)|round(1)} F7000
        G1 X{x0|round(1)} Y{y1|round(1)} F7000
    {% endfor %}
    # ---- 3) park HIGH again (every waiting state keeps the nozzle up) ----------------
    G0 Z{lift|round(1)} F600
    _ACCEL_SET VALUE={printer.configfile.settings.printer.max_accel|default(3000)|float}
    {% if old_target <= 40 %}
        # called cold (idle maintenance): do not leave a hot nozzle behind
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
description: Clean the nozzle: heat + zigzag wipe on the front-left pad (PASSES=2)
gcode:
    {% set passes = params.PASSES|default(2)|int %}
    {% set temp = params.TEMP|default(180)|float %}
    {% if printer.print_stats.state in ['printing','paused'] %}
        NOTIFY TEXT="Not while printing" LEVEL=warn SOUND=r2_notice
    {% elif passes < 1 or passes > 5 %}
        NOTIFY TEXT="PASSES must be 1-5" LEVEL=warn SOUND=r2_notice
    {% else %}
        _NOZZLE_WIPE PASSES={passes} TEMP={temp|round(1)}
        NOTIFY TEXT="Nozzle clean - parked high" LEVEL=ok SOUND=r2_confirm
    {% endif %}
# =====================================================================================
#  R62 PLOTTER START - the header macro of every converted plot file (*.png/.jpg/
#  .svg/.pdf.gcode). Homes, optionally heats (filament mode), and flags the file
#  type so the movement-file probe stays OUT. Live tuning (speed/accel/babystepping
#  = pen pressure) works while plotting.
# =====================================================================================
[gcode_macro _PLOT_START]
description: Plot file start: home + optional heat, then the pen rules (R62, internal)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set extrude = params.EXTRUDE|default(0)|int == 1 %}
    # identify the file (no 'unknown', no movement-probe infrastructure on top)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"plot"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=plot_extrude VALUE={extrude}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE={extrude}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    M117 Plot: homing
    G28
    G90
    {% if extrude %}
        # drawing WITH filament: heat to the layer-1 temperature first
        {% set db = printer['gcode_macro _MATERIALS'].presets %}
        {% set mat = sv.material|default('PLA')|string|upper %}
        {% set ht = sv.ov_hotend_first|default(0)|float if sv.ov_hotend_first_on|default(False) else (db[mat].hot1|default(215)|float if mat in db else 215) %}
        {% set bt = sv.ov_bed|default(0)|float if sv.ov_bed_on|default(False) else (db[mat].bed1|default(60)|float if mat in db else 60) %}
        {% set filz = sv.plot_fil_z|default(0.2)|float %}
        # R149 field report: FILAMENT mode heated the extruder only - the bed
        # stayed cold and nothing adhered ('just hairs'). Bed heats now too
        # (material preset, Pre-Print bed override wins) + a purge line runs
        # before the drawing so filament actually flows.
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bt|round}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ht|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 2}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 3}
        _APPLY_OVERRIDES_CORE
        M117 Plot: purge
        _PURGE_SMART LAYER_HEIGHT={filz}
    {% else %}
        # pure pen plot: no purge, no mesh, fan off - the pen does the drawing
        M107
    {% endif %}
    # R64 start overrides from Tools > Plotter > Start (live-tunable later)
    {% set ov_spd = sv.plot_ov_speed|default(100)|int %}
    {% if ov_spd != 100 %}
        M220 S{ov_spd}
        RESPOND MSG="[i] Plot start override: speed {ov_spd}%"
    {% endif %}
    {% set ov_z = sv.plot_ov_z|default(0)|float %}
    {% set ov_x = sv.plot_ov_x|default(0)|float %}
    {% set ov_y = sv.plot_ov_y|default(0)|float %}
    {% if ov_z != 0 or ov_x != 0 or ov_y != 0 %}
        SET_GCODE_OFFSET Z_ADJUST={ov_z} X_ADJUST={ov_x} Y_ADJUST={ov_y}
        RESPOND MSG="[i] Plot start offset: Z{ov_z} X{ov_x} Y{ov_y}"
    {% endif %}
    RESPOND MSG="[i] Plot start: {'FILAMENT mode (heated, extruder on)' if extrude else 'PEN mode (no heat beyond preheat, no purge)'}"
    RESPOND MSG="    live tuning while plotting: speed %, accel, and babystepping Z = pen pressure"

# =====================================================================================
#  R222 (.136t): _PLOT_END - the plot file's own end hook. Plot files park
#  themselves (pen up + head aside - written by the generator), but they run
#  NO PRINT_END: no layers, no print stats choreography, no rate question.
#  What the .136s end-print audit found missing: FILAMENT mode kept extruder
#  AND bed at temperature after the drawing (the file just ended), PEN mode
#  kept the 182C selection preheat burning, and a plot speed override (M220)
#  survived into whatever ran next (plots have no layer 2 to release it).
#  The generator writes _PLOT_END after the park move; the state watcher's
#  complete-branch is the backstop for OLD plot files without the hook.
#  Mode/sound are NOT touched here - the watcher's complete feedback
#  handles those for every file that ends without PRINT_END.
[gcode_macro _PLOT_END]
description: Plot file end: heaters off, speed back to 100 (internal)
gcode:
    # heaters off whenever anything is still targeted - FILAMENT's print
    # temps or PEN's leftover selection preheat (a pen needs no heat)
    {% if printer.extruder.target|default(0)|float > 0 %}
        M99104 S0
    {% endif %}
    {% if printer.heater_bed.target|default(0)|float > 0 %}
        M99140 S0
    {% endif %}
    M220 S100
    RESPOND MSG="Plot done: heaters off, speed 100%"

# =====================================================================================
#  R62 PLT_FRAME - drive the pen around the configured plot bed frame once.
#  Verifies the plot limits (Tools > Plotter > Corners) with a real pen line.
# =====================================================================================
[gcode_macro PLT_FRAME]
description: Plotter: drive the pen around the configured bed frame (verify the limits)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="PLT_FRAME only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set x0 = sv.plot_bed_min_x|default(5)|float %}
        {% set y0 = sv.plot_bed_min_y|default(5)|float %}
        {% set x1 = sv.plot_bed_max_x|default(239)|float %}
        {% set y1 = sv.plot_bed_max_y|default(233)|float %}
        {% set ox = sv.plot_off_x|default(0)|float %}
        {% set oy = sv.plot_off_y|default(0)|float %}
        {% set zu = sv.plot_z_up|default(3)|float %}
        {% set zd = (sv.plot_z_down|default(0)|float + sv.plot_off_z|default(0)|float) %}
        M117 Plot frame test
        G28
        G90
        G0 Z{zu|round(1)} F600
        G0 X{x0 + ox|round(1)} Y{y0 + oy|round(1)} F6000
        G1 Z{zd|round(1)} F600
        G1 X{x1 + ox|round(1)} Y{y0 + oy|round(1)} F2400
        G1 X{x1 + ox|round(1)} Y{y1 + oy|round(1)} F2400
        G1 X{x0 + ox|round(1)} Y{y1 + oy|round(1)} F2400
        G1 X{x0 + ox|round(1)} Y{y0 + oy|round(1)} F2400
        G0 Z{zu|round(1)} F600
        G0 X{x0 + ox|round(1)} Y{[y1 - 43, y0 + oy + 5]|max|round(1)} F6000
        M117 Frame done
        RESPOND MSG="PLT_FRAME: frame X{x0|round|int}..X{x1|round|int} Y{y0|round|int}..Y{y1|round|int} drawn (+pen offset {ox|round(1)}/{oy|round(1)})"
        RESPOND MSG="  does the frame match your bed? adjust Tools > Plotter > Corners"
    {% endif %}

# =====================================================================================
#  R64 RESONANCE DIAGRAM - reads the CSVs Klipper wrote (CALIBRATE_SHAPER /
#  DUMP_RESONANCES) and turns them into a printable plate (or a pen-plot file):
#  the PSD curve, all 5 shaper curves and the SHAPER TABLE with the winner
#  boxed. PRINT = normal start procedure (mesh + purge line + babystepping).
#  After reading the paper: pick the shaper in Vibration Cal > Apply (or
#  SHAPER_RESULT) - the frequency comes from the table, no math for you.
# =====================================================================================
[gcode_macro RESONANCE_DIAGRAM]
description: Resonances CSV -> printed/plotter diagram with the shaper table (R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Resonance diagram only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set axis = params.AXIS|default('BOTH')|string|upper %}
        {% set mode = params.MODE|default('PRINT')|string|upper %}
        {% if axis not in ['X','Y','BOTH'] or mode not in ['PRINT','PLOT'] %}
            NOTIFY TEXT="AXIS must be X/Y/BOTH, MODE PRINT or PLOT" LEVEL=error SOUND=r2_error
        {% else %}
            SAVE_VARIABLE VARIABLE=reso_axis VALUE="\"{axis}\""
            SAVE_VARIABLE VARIABLE=reso_mode VALUE="\"{mode|lower}\""
            {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
            SAVE_VARIABLE VARIABLE=reso_nonce VALUE={printer['save_variables'].variables.reso_nonce|default(0)|int + 1}
            M117 Diagram: {axis} {mode}...
            RESPOND MSG="Resonance diagram {axis} ({mode}) - the watcher builds the file, ready in a few seconds (beep)"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SHAPER_RESULT - the shaper CALCULATOR (as easy as PA_RESULT):
#   SHAPER_RESULT                       -> shows the last table (console)
#   SHAPER_RESULT AXIS=X TYPE=MZV       -> applies MZV at the table frequency
#   SHAPER_RESULT AXIS=Y TYPE=EI FREQ=58-> manual frequency for fine tuning
# Applies SET_INPUT_SHAPER live AND saves the boot override - no restart needed.
# -------------------------------------------------------------------------------------
[gcode_macro SHAPER_RESULT]
description: Shaper calculator: apply the shaper you picked off the diagram (R64)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set axis = params.AXIS|default('')|string|upper %}
    {% set type = params.TYPE|default('')|string|lower %}
    {% set freq = params.FREQ|default(-1)|float %}
    {% if axis == '' and type == '' %}
        RESPOND MSG="Shaper table from the last RESONANCE_DIAGRAM:"
        {% for ax in ['x','y'] %}
            {% set row = [] %}
            {% for t in ['zv','mzv','ei','2hump_ei','3hump_ei'] %}
                {% set f = sv['shaper_rec_' ~ ax ~ '_' ~ t]|default(0)|float %}
                {% if f > 0 %}
                    {% set row = row.append(t ~ ' ' ~ f|round(1)) %}
                {% endif %}
            {% endfor %}
            RESPOND MSG="  {ax|upper}: {row|join(' | ') if row|length else 'no table yet - run RESONANCE_DIAGRAM'} (best: {sv['shaper_best_' ~ ax]|default('?')})"
        {% endfor %}
        RESPOND MSG="Apply: SHAPER_RESULT AXIS=X TYPE=MZV  (freq from the table) - or TYPE=MZV FREQ=60 for manual"
    {% elif axis not in ['X','Y'] or type not in ['zv','mzv','ei','2hump_ei','3hump_ei'] %}
        NOTIFY TEXT="AXIS must be X/Y, TYPE zv/mzv/ei/2hump_ei/3hump_ei (got {axis}/{type})" LEVEL=error SOUND=r2_error
    {% else %}
        {% set axlow = axis|lower %}
        {% if freq < 0 %}
            {% set freq = sv['shaper_rec_' ~ axlow ~ '_' ~ type]|default(0)|float %}
        {% endif %}
        {% if freq < 5 %}
            NOTIFY TEXT="No stored freq for {type} {axis} - run RESONANCE_DIAGRAM first, or pass FREQ=" LEVEL=error SOUND=r2_error
        {% else %}
            SET_INPUT_SHAPER SHAPER_TYPE_{axis}={type} SHAPER_FREQ_{axis}={freq|round(1)}
            SAVE_VARIABLE VARIABLE=ishaper_ov_type_{axlow|lower} VALUE="\"{type}\""
            SAVE_VARIABLE VARIABLE=ishaper_ov_freq_{axlow|lower} VALUE={freq|round(1)}
            SAVE_VARIABLE VARIABLE=ishaper_ov_on_{axlow|lower} VALUE=True
            NOTIFY TEXT="{axis} shaper: {type} @ {freq|round(1)}Hz - live + saved for every boot" LEVEL=ok SOUND=r2_done
            M117 {axis} {type} {freq|round(1)}Hz
        {% endif %}
    {% endif %}

# =====================================================================================
#  R251 (.142g, open point E2): MANUAL INPUT SHAPER - reachable from the LCD.
#  Why this exists: CALIBRATE_SHAPER needs [resonance_tester] + an
#  accelerometer. A user without one is not out of options - a shaper can be
#  set by hand (the resonance diagram / the printer's own table), and this
#  macro is the one place that does it: it applies the value LIVE and stores it
#  as a boot override (ishaper_ov_*), so a restart keeps it. Until R251 these
#  variables had no menu row at all: the feature existed and the user could not
#  reach it.
#    SHAPER_MANUAL                      -> what runs now + what is stored
#    SHAPER_MANUAL AXIS=X TYPE=MZV      -> apply + store (freq from the stored
#                                          value or the one Klipper runs now)
#    SHAPER_MANUAL AXIS=X FREQ=52.4     -> just the frequency
#    SHAPER_MANUAL AXIS=X TYPE=CONFIG   -> back to printer.cfg (override off)
# =====================================================================================
[gcode_macro SHAPER_MANUAL]
description: Manual input shaper (type/freq per axis), live + stored as boot override - no accelerometer needed
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set ax = params.AXIS|default('')|string|upper %}
    {% set ty = params.TYPE|default('')|string|lower %}
    {% set fq = params.FREQ|default(-1)|float %}
    {% set types = ['zv','mzv','ei','2hump_ei','3hump_ei'] %}
    {% if 'input_shaper' not in printer %}
        NOTIFY TEXT="Manual shaper override needs [input_shaper] in printer.cfg - without it the printer runs unshaped (nothing to set)" LEVEL=error SOUND=r2_error
        M117 Shaper: n/a
    {% elif ax not in ['X','Y'] %}
        {% for a in ['x','y'] %}
            {% set run = printer.input_shaper['shaper_type_' ~ a]|default('-') %}
            {% set runf = printer.input_shaper['shaper_freq_' ~ a]|default(0)|float %}
            {% set ov = sv['ishaper_ov_on_' ~ a]|default(False) %}
            RESPOND MSG="{a|upper}: runs {run} @ {runf|round(1)}Hz | manual override {'ON (' ~ sv['ishaper_ov_type_' ~ a]|default('?') ~ ' @ ' ~ sv['ishaper_ov_freq_' ~ a]|default(0)|float|round(1) ~ 'Hz, survives restarts)' if ov else 'off (printer.cfg rules)'}"
        {% endfor %}
        RESPOND MSG="Set by hand: SHAPER_MANUAL AXIS=X TYPE=MZV FREQ=52 -- or use the LCD: Maintenance > Vibration Cal. > Manual. Calibrating with an accelerometer is NOT required for this."
    {% else %}
        {% set a = ax|lower %}
        {% if ty == 'config' or params.ON|default(-1)|int == 0 %}
            # back to the printer.cfg section - type, freq AND damping, so a
            # restore never silently drops the configured damping ratio
            {% set cfg = printer.configfile.settings['input_shaper']|default({}) %}
            {% set cty = cfg['shaper_type_' ~ a]|default('mzv')|string %}
            {% set cfq = cfg['shaper_freq_' ~ a]|default(0)|float %}
            {% if cfq < 5 %}
                NOTIFY TEXT="printer.cfg has no shaper_freq_{a} - nothing to restore to. Apply a value instead (SHAPER_MANUAL AXIS={ax} TYPE=MZV FREQ=50)." LEVEL=warn SOUND=r2_notice
            {% else %}
                SET_INPUT_SHAPER SHAPER_TYPE_{ax}={cty} SHAPER_FREQ_{ax}={cfq|round(1)}{(' DAMPING_RATIO_' ~ ax ~ '=' ~ cfg['damping_ratio_' ~ a]|float) if cfg['damping_ratio_' ~ a] is defined else ''}
                SAVE_VARIABLE VARIABLE=ishaper_ov_on_{a|lower} VALUE=False
                NOTIFY TEXT="{ax} shaper back to printer.cfg: {cty} @ {cfq|round(1)}Hz (manual override off)" LEVEL=ok SOUND=r2_done
                M117 {ax} cfg {cty} {cfq|round(1)}
            {% endif %}
        {% else %}
            {% if ty != '' and ty not in types %}
                NOTIFY TEXT="TYPE must be {'/'.join(types)} or CONFIG (got {ty})" LEVEL=error SOUND=r2_error
            {% else %}
                {% set nty = ty if ty in types else (sv['ishaper_ov_type_' ~ a]|default(printer.input_shaper['shaper_type_' ~ a]|default('mzv'))|string) %}
                {% set nfq = fq if fq >= 5 else (sv['ishaper_ov_freq_' ~ a]|default(0)|float or printer.input_shaper['shaper_freq_' ~ a]|default(0)|float) %}
                {% if nfq < 5 or nfq > 200 %}
                    NOTIFY TEXT="Frequency must be 5..200 Hz (got {fq}) - take it from the resonance diagram or the shaper table" LEVEL=error SOUND=r2_error
                {% else %}
                    SET_INPUT_SHAPER SHAPER_TYPE_{ax}={nty} SHAPER_FREQ_{ax}={nfq|round(1)}
                    SAVE_VARIABLE VARIABLE=ishaper_ov_type_{a|lower} VALUE="\"{nty}\""
                    SAVE_VARIABLE VARIABLE=ishaper_ov_freq_{a|lower} VALUE={nfq|round(1)}
                    SAVE_VARIABLE VARIABLE=ishaper_ov_on_{a|lower} VALUE=True
                    NOTIFY TEXT="{ax} shaper: {nty} @ {nfq|round(1)}Hz - live now AND stored (every restart re-applies it)" LEVEL=ok SOUND=r2_done
                    M117 {ax} {nty} {nfq|round(1)}Hz
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

# =====================================================================================
#  R64 BRIDGE TEST - two tall towers diagonally across the bed (NOT the full
#  diagonal) + one additional SHORT span at 10..50% of the long bridge, hanging
#  clearly BELOW the long one on its own lower tower. File via the watcher,
#  normal start procedure (mesh, purge line, temperatures), babystepping works,
#  every bridge/tower is an exclude_object. Bridge speed/fan/flow are LIVE
#  tunable (Live Tuning > Features > BRIDGE).
# =====================================================================================
[gcode_macro BRIDGE_TEST]
description: Bridging test file: long diagonal bridge + short one below (R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="Bridge test only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=bridge_nonce VALUE={printer['save_variables'].variables.bridge_nonce|default(0)|int + 1}
        M117 Bridge test: creating...
        RESPOND MSG="Bridging test - the watcher builds the file, ready in a few seconds (beep)"
    {% endif %}

# =====================================================================================
#  R64 PLOTTER TEXT + STATUS - draw a text file (or the SHOW_STATUS report) on
#  paper, one page, auto-scaled. PLOT_TEXT FILE=name.txt (file in the gcodes
#  folder, uploaded via Mainsail); PLOT_STATUS needs no file at all.
# =====================================================================================
[gcode_macro PLOT_TEXT]
description: Plotter: draw a text file from the gcodes folder on paper (R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set fn = params.FILE|default('')|string %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'plottext' %}
        _GEN_ARM KEY=plottext WHAT='the text plot'
    {% elif s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="PLOT_TEXT only when idle" LEVEL=warn SOUND=r2_notice
    {% elif not fn or '/' in fn or fn == ' ' or '"' in fn or '\\' in fn %}
        NOTIFY TEXT="PLOT_TEXT FILE=name.txt (upload the file to the gcodes folder first)" LEVEL=warn SOUND=r2_notice
    {% else %}
        SAVE_VARIABLE VARIABLE=plot_text_file VALUE="\"{fn}\""
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=plottext{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=plot_text_nonce VALUE={printer['save_variables'].variables.plot_text_nonce|default(0)|int + 1}
        M117 Text plot: creating...
        RESPOND MSG="Text plot {fn} - the watcher converts it, ready in a few seconds (beep)"
    {% endif %}

[gcode_macro PLOT_CAL]
description: Plotter: calibration test plot - offset, dot raster, line quality (R122)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="PLOT_CAL only when idle - mount pen or filament first" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=plot_cal_nonce VALUE={printer['save_variables'].variables.plot_cal_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_start
        M117 PlotCal: creating..
        RESPOND MSG="Plot cal test: border + corner ticks (OFFSET - paper/XY shift), 63 dots on a 10mm grid (dot placement + bleed), H/V/45deg lines + 0.5mm pairs + circles (line quality)"
        RESPOND MSG="  pen Z / speed / mode come from the Plotter menu - the file appears in a few seconds (beep), start it like any plot"
    {% endif %}

[gcode_macro _PLOT_NAME_SET_CHAR]
description: Plot text file editor: set the character at POS (internal, R64)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set cs  = printer['gcode_macro _LABELS'].charset ~ ('%c' % 35) %}
    {% set pos = params.POS|default(sv.plot_name_pos|default(1))|int %}
    {% set idx = params.CH|default(0)|int %}
    {% set mx  = 16 %}
    {% if pos < 1 or pos > mx %}
        RESPOND MSG="File name: position must be 1..{mx}"
    {% else %}
        {% set txt = sv.plot_name_buf|default('')|string %}
        {% set ch = cs[idx] if idx >= 0 and idx < cs|length else ' ' %}
        {% if txt|length < pos - 1 %}
            {% set txt = txt ~ (' ' * (pos - 1 - txt|length)) %}
        {% endif %}
        {% set new = txt[:pos - 1] ~ ch ~ txt[pos:] %}
        SAVE_VARIABLE VARIABLE=plot_name_buf VALUE="\"{new}\""
        {% set nx = [pos + 1, mx]|min %}
        SAVE_VARIABLE VARIABLE=plot_name_pos VALUE={nx}
        M117 {(new ~ '|' ~ (' ' * (mx - new|length)))[:mx]}@{nx}
    {% endif %}

[gcode_macro PLOT_NAME_DEL_CHAR]
description: Plot text file editor: delete the character at the position (R64)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set pos = sv.plot_name_pos|default(1)|int %}
    {% set txt = sv.plot_name_buf|default('')|string %}
    {% if pos >= 1 and pos <= txt|length %}
        {% set new = txt[:pos - 1] ~ txt[pos:] %}
        SAVE_VARIABLE VARIABLE=plot_name_buf VALUE="\"{new}\""
        M117 {(new ~ '|' ~ (' ' * (16 - new|length)))[:16]}@{pos}
    {% endif %}

[gcode_macro PLOT_STATUS]
description: Plotter: draw the SHOW_STATUS report on paper, one page (R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'plotstat' %}
        _GEN_ARM KEY=plotstat WHAT='the status plot'
    {% elif s.mode not in ['idle','finished'] %}
        NOTIFY TEXT="PLOT_STATUS only when idle" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=plotstat{% endif %}
        SAVE_VARIABLE VARIABLE=plot_status_nonce VALUE={printer['save_variables'].variables.plot_status_nonce|default(0)|int + 1}
        M117 Status plot: creating...
        RESPOND MSG="Status plot - the watcher builds R2_Status.gcode, ready in a few seconds (beep)"
    {% endif %}

# =====================================================================================
#  R64 PLOTTER LIVE TUNING - while a plot file runs (file_type == 'plot'):
#  pen speed %, pen pressure (= babystepping Z, same as always) and a fine
#  X/Y shift of the whole drawing. The start overrides below are applied by
#  _PLOT_START at every plot start (Tools > Plotter > Start).
# =====================================================================================
[gcode_macro SET_PLOT_SPEED]
description: Plot live: pen speed in percent (M220, R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.file_type|default('') != 'plot' %}
        RESPOND MSG="[plot] SET_PLOT_SPEED only during a plot job"
    {% else %}
        {% set pct = params.PCT|default(100)|float %}
        M220 S{pct|round|int}
        SAVE_VARIABLE VARIABLE=plot_ov_speed VALUE={pct|round|int}
        RESPOND MSG="[plot] pen speed {pct|round|int}% (also saved as the start default)"
        M117 Plot speed {pct|round|int}%
    {% endif %}

[gcode_macro SET_PLOT_PENZ]
description: Plot live: pen pressure fine tune (Z babystep, R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.file_type|default('') != 'plot' %}
        RESPOND MSG="[plot] SET_PLOT_PENZ only during a plot job"
    {% else %}
        {% set dz = params.DZ|default(0)|float %}
        SET_GCODE_OFFSET Z_ADJUST={dz}
        SAVE_VARIABLE VARIABLE=plot_ov_z VALUE={(sv.plot_ov_z|default(0)|float + dz)|round(3)}
        {% set tot = (sv.plot_ov_z|default(0)|float + dz)|round(3) %}
        RESPOND MSG="[plot] pen Z {'+' if dz > 0 else ''}{dz}mm (total offset {tot}mm)"
    {% endif %}

[gcode_macro SET_PLOT_SHIFT]
description: Plot live: shift the whole drawing X/Y (R64)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.file_type|default('') != 'plot' %}
        RESPOND MSG="[plot] SET_PLOT_SHIFT only during a plot job"
    {% else %}
        {% set dx = params.X|default(0)|float %}
        {% set dy = params.Y|default(0)|float %}
        SET_GCODE_OFFSET X_ADJUST={dx} Y_ADJUST={dy}
        SAVE_VARIABLE VARIABLE=plot_ov_x VALUE={(sv.plot_ov_x|default(0)|float + dx)|round(2)}
        SAVE_VARIABLE VARIABLE=plot_ov_y VALUE={(sv.plot_ov_y|default(0)|float + dy)|round(2)}
        {% set tx = (sv.plot_ov_x|default(0)|float + dx)|round(2) %}
        {% set ty = (sv.plot_ov_y|default(0)|float + dy)|round(2) %}
        RESPOND MSG="[plot] shifted X{'+' if dx > 0 else ''}{dx} Y{'+' if dy > 0 else ''}{dy}mm (now {tx}/{ty}mm)"
    {% endif %}

[gcode_macro PLOT_TUNE_RESET]
description: Plot: reset the speed/Z/XY start overrides to neutral (R64)
gcode:
    SAVE_VARIABLE VARIABLE=plot_ov_speed VALUE=100
    SAVE_VARIABLE VARIABLE=plot_ov_z VALUE=0
    SAVE_VARIABLE VARIABLE=plot_ov_x VALUE=0
    SAVE_VARIABLE VARIABLE=plot_ov_y VALUE=0
    RESPOND MSG="[plot] start overrides reset: speed 100%, Z/X/Y 0 - apply at the next plot start"
    M117 Plot overrides 0
  M117 Plot overrides 0
