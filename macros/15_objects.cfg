# =====================================================================================
#  15_objects.cfg - Skip single objects (exclude_object) safely from the LCD
#  -----------------------------------------------------------------------------------
#  Requires (already part of this package, see printer.cfg.example + INSTALL.md):
#    - [exclude_object] in printer.cfg
#    - moonraker: [file_manager] enable_object_processing: True
#    - slicer: objects labeled (Orca: "Label objects" / Cura: our post-processing
#      script) - otherwise Klipper knows no object names and this menu stays empty.
#
#  IMPORTANT: excluding an object is IRREVERSIBLE - Klipper cannot bring a
#  skipped object back mid-print. Therefore the same 2-press protection as
#  CANCEL_PRINT: first press arms (LCD shows "SKIP?"), second press on the SAME
#  object executes. RESUME / print end disarms. Skipping the LAST remaining
#  object is refused (that would silently end the print - use CANCEL_PRINT).
#
#  Macros (LCD "Live Tuning > Objects" = Mainsail/console parity):
#    SKIP_OBJECT NAME=<object>     skip with 2-press confirmation
#    SKIP_CURRENT_OBJECT           skip the object currently being printed
#    SKIP_DISARM                   disarm a pending skip
#    SHOW_OBJECTS                  list objects + skipped ones (console)
#
#  Console/Mainsail users can always use Klipper's native EXCLUDE_OBJECT
#  NAME=... for an instant skip without confirmation.
# =====================================================================================

[gcode_macro SKIP_OBJECT]
description: Skip (exclude) one object of the running print - press 2x to confirm
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set eo = printer['exclude_object'] if 'exclude_object' in printer else None %}
    {% set name = params.NAME|default('') %}
    {% if eo is none %}
        NOTIFY TEXT="[exclude_object] not configured - see printer.cfg.example" LEVEL=error SOUND=r2_error
    {% elif s.mode not in ['printing','paused','filament'] %}
        NOTIFY TEXT="Skipping objects only works during a print" LEVEL=warn SOUND=r2_notice
    {% elif name == '' %}
        RESPOND MSG="Usage: SKIP_OBJECT NAME=<object> (names: SHOW_OBJECTS)"
        M117 SHOW_OBJECTS -> names
    {% else %}
        {% set names = eo.objects|map(attribute='name')|list %}
        {% if name not in names %}
            # not an active object anymore (or never was)
            {% if name in eo.excluded_objects %}
                NOTIFY TEXT="Object '{name}' is already skipped" LEVEL=warn SOUND=r2_notice
            {% else %}
                NOTIFY TEXT="Unknown object '{name}' - see SHOW_OBJECTS for names" LEVEL=error SOUND=r2_error
            {% endif %}
        {% elif names|length == 1 %}
            # blocking this is the whole point: it would silently end the print
            NOTIFY TEXT="'{name}' is the LAST object - use CANCEL_PRINT (2x) instead" LEVEL=error SOUND=r2_error
            M117 Last obj! -> CANCEL
        {% elif s.skip_armed_name == name %}
            # ---------- second press on the same object: REALLY skip ------------------------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_name VALUE='""'
            EXCLUDE_OBJECT NAME="{name}"
            G4 P600
            NOTIFY TEXT="Object '{name}' SKIPPED ({eo.objects|length - 1} remaining)" LEVEL=warn SOUND=r2_confirm
            M117 Skipped {name}
        {% else %}
            # ---------- first press: arm and ask again --------------------------------------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_name VALUE='"{name}"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_time VALUE={printer.print_stats.total_duration|round(3)}
            NOTIFY TEXT="Skip '{name}'? Press SKIP again to confirm" LEVEL=warn SOUND=r2_notice
            M117 Skip {name}? 2x!
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SKIP_CURRENT_OBJECT - skips the object the toolhead is working on right now
# -------------------------------------------------------------------------------------
[gcode_macro SKIP_CURRENT_OBJECT]
description: Skip the object currently being printed (2x confirmation)
gcode:
    {% if 'exclude_object' in printer and printer['exclude_object'].current_object %}
        SKIP_OBJECT NAME="{printer['exclude_object'].current_object}"
    {% else %}
        NOTIFY TEXT="No object is being printed right now" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# SKIP_DISARM - cancel a pending skip (also happens automatically on RESUME / print end)
# -------------------------------------------------------------------------------------
[gcode_macro SKIP_DISARM]
description: Disarm a pending object skip
gcode:
    {% if printer['gcode_macro _STATE'].skip_armed_name != '' %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_name VALUE='""'
        NOTIFY TEXT="Pending skip disarmed" LEVEL=info SOUND=r2_confirm
    {% else %}
        RESPOND MSG="No skip is armed"
    {% endif %}

# -------------------------------------------------------------------------------------
# SHOW_OBJECTS - full object report for console/Mainsail (LCD shows short status line)
# -------------------------------------------------------------------------------------
[gcode_macro SHOW_OBJECTS]
description: List all objects of the current print (active + skipped)
gcode:
    {% if 'exclude_object' in printer %}
        {% set eo = printer['exclude_object'] %}
        RESPOND MSG="================ OBJECTS ================"
        RESPOND MSG="Active: {eo.objects|length} | Skipped: {eo.excluded_objects|length} | Current: {eo.current_object|default('-')}"
        {% for o in eo.objects %}
            RESPOND MSG="  [keep] {o.name}  (center X{o.center[0]|round} Y{o.center[1]|round}){% if o.name == eo.current_object %}  <== printing now{% endif %}"
        {% endfor %}
        {% for n in eo.excluded_objects %}
            RESPOND MSG="  [SKIP] {n}"
        {% endfor %}
        RESPOND MSG="Skip: SKIP_OBJECT NAME=<object> (2x) | SKIP_CURRENT_OBJECT"
        M117 {eo.objects|length} on / {eo.excluded_objects|length} skip
    {% else %}
        RESPOND MSG="[exclude_object] not configured"
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V15_OBJECTS]
description: Version sentinel of 15_objects.cfg (internal)
gcode:
