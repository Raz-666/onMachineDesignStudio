# =====================================================================================
#  17_generator.cfg - R86/R89/R90 PART GENERATORS (Tools menu: Cable ties,
#  Angles+Flat, Lithophane, Gaskets, Frames)
#  -----------------------------------------------------------------------------------
#  Prints cable ties (R89: CLASSIC small pawl head + LOOP ball-loop, 2-12mm
#  wide, 50-300mm long), angle plates / flat connectors (auto hole layout,
#  optional countersink + stiffening rib), LITHOPHANES from any .png/.jpg in
#  the gcodes folder (standing print, auto image optimization, N brightness
#  levels, optional ironing) and GASKET rings (OD/ID/height, flat face or
#  groove with two sealing lips) and PICTURE FRAMES / display cases (R90:
#  presets or custom photo size, RECT with corner radius or OVAL, snap-in
#  backplate or side slot, hidden hang keyhole, easel stand, ironed front,
#  auto split kit when the bed is too small).
#  The actual file is generated by tools/r2_postproc.py (the r2-postproc watcher)
#  - this file only manages the SETTINGS in save_variables and bumps the nonce
#  (cable_tie_nonce / angle_nonce / litho_nonce / seal_nonce / litho_del_nonce).
#  Generation runs niced in the background (lithophanes in their own thread -
#  they are big) and beeps when the file is selected (ready to start like any
#  other file).
#
#  LCD:    Tools > Cable ties / Angles+Flat / Lithophane / Gaskets
#  Console/Mainsail:
#     GEN_CABLE_TIES COUNT=6 LENGTH=120 WIDTH=8 LAYERS=3 VARIANT=CLASSIC|LOOP
#     GEN_ANGLES COUNT=2 ANGLE=90 LEG_A=60 LEG_B=60 WIDTH=25 LAYERS=6 HOLES=2
#               HOLE_D=4 CS=1 STIFFENER=1 FLAT=0
#     GEN_SEAL OD=40 ID=20 HEIGHT=1.2 PROFILE=FLAT|NUT IRONING=0
#     LITHO_CREATE INDEX=0   (image slots, Tools > Lithophane)
#  (every parameter optional - the LCD settings are the defaults)
# =====================================================================================

[gcode_macro _GENERATORS]
description: Part generator limits (cable ties + angle plates, internal)
variable_max_ties: 24
variable_max_plates: 12
gcode:

# -------------------------------------------------------------------------------------
# CABLE_TIE_INFO - show every setting (LCD 'Info' + console)
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# _GEN_OUT_SET - what happens after a generator built its file (R109):
#   OUT=QUEUE   (default) the file goes straight into the 'print queue': fresh
#               files get SELECTED, files derived from a selected source
#               (range excerpt, texture) REPLACE that selection - the start
#               dialog then asks AS SLICED / AS LEGACY as usual.
#   OUT=PREVIEW the file only appears in the file list (check it in the 3D
#               viewer first, start it by hand when you like it).
# Sticky (save variable gen_out, LCD: Tools > After gen) - every generator's
# OUT= parameter overrides it for THAT run.
# -------------------------------------------------------------------------------------
[gcode_macro _GEN_OUT_SET]
description: Set what generators do with a finished file (OUT=QUEUE or OUT=PREVIEW)
gcode:
    {% set v = params.OUT|default('')|string|upper %}
    {% if v in ('QUEUE', 'SELECT', '1') %}
        SAVE_VARIABLE VARIABLE=gen_out VALUE=1
        RESPOND MSG="Generators: QUEUE - finished files are selected (derived files replace their source selection)"
        M117 After gen: queue
    {% elif v in ('PREVIEW', 'ONLY', '0') %}
        SAVE_VARIABLE VARIABLE=gen_out VALUE=0
        RESPOND MSG="Generators: PREVIEW ONLY - finished files just appear in the file list"
        M117 After gen: preview
    {% else %}
        RESPOND MSG="_GEN_OUT_SET OUT=QUEUE (select/replace) or OUT=PREVIEW (file list only) - current: {'QUEUE' if printer['save_variables'].variables.gen_out|default(1)|int == 1 else 'PREVIEW'}"
    {% endif %}

# -------------------------------------------------------------------------------------
# R160 (.120): 2-PRESS GENERATION CONFIRM - every LCD 'Create' row arms on
# the first press ("press again"), the second press within 10s starts the
# build. A waiting start dialog is cancelled SILENTLY (the generation takes
# over - no sad tone on top of the start chirp), and the r2_gen chirp says
# "the generation is running". Console/Mainsail calls stay single-shot:
# an explicitly typed command IS the confirmation.
# -------------------------------------------------------------------------------------
[gcode_macro _GEN_ARM]
description: Generators: arm the 2-press confirm for KEY (internal)
gcode:
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='"{params.KEY|default('')}"'
    UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=10
    M117 Again = start!
    RESPOND MSG="[Gen] Press AGAIN to start {params.WHAT|default('the generation')} - the second press builds the file (window: 10s)"
    _UI_SOUND NAME=r2_click

[delayed_gcode _GEN_ARM_CLEAR]
# Generators: disarm the 2-press confirm (10s passed, internal).
# NOTE: [delayed_gcode] takes ONLY gcode/initial_duration - a description
# line HALTS Klipper at boot (.120 field log - never again, see validator)
gcode:
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'

[gcode_macro _GEN_GO]
description: Generators: the armed second press - dialog cancel + start sound (internal)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
    UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
    # a WAITING start dialog steps aside QUIETLY (r2_sad would irritate right
    # over the start chirp - the quiet flag keeps the poller's cancel silent)
    {% if s.mode == 'waiting' %}
        SAVE_VARIABLE VARIABLE=start_quiet_cancel VALUE=1
        SAVE_VARIABLE VARIABLE=start_decision VALUE='"cancel"'
        RESPOND MSG="[Gen] Start dialog closed - the generation takes over (nothing prints unasked)"
    {% endif %}
    # R188 (.134): ONE unified start sound for every create/fix press -
    # r2_start says 'work begins', r2_gen stays the queued-job-builds chirp
    _UI_SOUND NAME=r2_start

# -------------------------------------------------------------------------------------
# GEN_FILE_DEL_SLOT - delete generator output slot INDEX from gen_files
# (2-press: the first press arms, the second deletes). Only ever deletes a
# generator output (Vnn_/00_ names) inside the gcodes folder - never
# anything the user sliced.
# -------------------------------------------------------------------------------------
[gcode_macro GEN_FILE_DEL_SLOT]
description: Gen files: delete output slot INDEX (press twice to confirm)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% set files = printer['gcode_macro _SDM'].gen_files|default([]) %}
    {% if idx < 0 or idx >= files|length %}
        NOTIFY TEXT="No file in this slot" LEVEL=warn SOUND=r2_notice
        M117 Gen files: empty slot
    {% else %}
        {% set fn = files[idx]|string %}
        {% if s.gen_del_arm|default('') == fn %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_del_arm VALUE='""'
            SAVE_VARIABLE VARIABLE=gen_del_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=gen_del_nonce VALUE={sv.gen_del_nonce|default(0)|int + 1}
            _UI_SOUND NAME=r2_confirm
            M117 File deleting..
            RESPOND MSG="Deleting generated file {fn} - only generated files (V-number or legacy names) ever get deleted"
        {% else %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_del_arm VALUE='"{fn}"'
            NOTIFY TEXT="Press again to DELETE {fn}" LEVEL=warn SOUND=r2_notice
            M117 Again = delete
        {% endif %}
    {% endif %}

[gcode_macro CABLE_TIE_INFO]
description: Cable ties: show the current settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set var = sv.tie_variant|default('CLASSIC')|string|upper %}
    RESPOND MSG="Info: Cable ties: {sv.tie_count|default(6)|int}x, length {sv.tie_length|default(120)|round(0)|int}mm, width {sv.tie_width|default(8)|round(1)}mm, {sv.tie_layers|default(3)|int} strap layers @ {sv.tie_layer_h|default(0.2)|round(2)}mm, closure {var}{', adjustable + reusable (beads)' if var == 'LOOP' else ' (one-way pawl, cut to remove)'}, brim {'on' if sv.tie_brim|default(True) else 'off'}, version V{'%02d' % sv.gen_version|default(1)|int} |   the closure auto-scales with the width: head size, slot clearance, tooth pitch / bead spacing all derive from {sv.tie_width|default(8)|round(1)}mm - nothing to tune |   tips: PETG/TPU bends best (PLA only gentle curves) - under 3.6mm width a 0.4 nozzle prints crisper"

# -------------------------------------------------------------------------------------
# CABLE_TIE_GENERATE - validate + bump the nonce (the watcher builds the file)
# -------------------------------------------------------------------------------------
[gcode_macro CABLE_TIE_GENERATE]
description: Cable ties: create the printable tie file (bumps cable_tie_nonce)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set cnt = sv.tie_count|default(6)|int %}
    {% set ln  = sv.tie_length|default(120)|float %}
    {% set wd  = sv.tie_width|default(8)|float %}
    {% set ly  = sv.tie_layers|default(3)|int %}
    {% set var = sv.tie_variant|default('CLASSIC')|string|upper %}
    {% if var not in ('CLASSIC', 'LOOP') %}{% set var = 'CLASSIC' %}{% endif %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'ties' %}
        _GEN_ARM KEY=ties WHAT='cable ties'
    {% elif cnt < 1 or cnt > printer['gcode_macro _GENERATORS'].max_ties %}
        NOTIFY TEXT="Cable ties: count must be 1..{printer['gcode_macro _GENERATORS'].max_ties}" LEVEL=warn SOUND=r2_notice
        M117 Ties: bad count
    {% elif ln < 50 or ln > 300 %}
        NOTIFY TEXT="Cable ties: length must be 50..300mm" LEVEL=warn SOUND=r2_notice
        M117 Ties: bad length
    {% elif wd < 2 or wd > 12 %}
        NOTIFY TEXT="Cable ties: width must be 2..12mm" LEVEL=warn SOUND=r2_notice
        M117 Ties: bad width
    {% elif ly < 3 or ly > 6 %}
        NOTIFY TEXT="Cable ties: strap layers must be 3..6" LEVEL=warn SOUND=r2_notice
        M117 Ties: bad layers
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=ties{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=cable_tie_nonce VALUE={sv.cable_tie_nonce|default(0)|int + 1}
        M117 Ties creating..
        RESPOND MSG="Cable ties: creating the file for {cnt} tie(s), {'%.0f'|format(ln)}mm long, variant {var} (head auto-scales)"
        RESPOND MSG="  ready in a few seconds - it beeps and appears in the file list, start it like any file"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_CABLE_TIES - console/Mainsail entry point (sets the variables, then generates)
#   GEN_CABLE_TIES COUNT=6 LENGTH=120 WIDTH=8 LAYERS=3 VARIANT=CLASSIC LAYER_H=0.2 BRIM=1
#   VARIANT: CLASSIC = normal one-way pawl (cut to remove) | LOOP = ball-loop,
#            adjustable at every bead, lifts back out (reusable)
# -------------------------------------------------------------------------------------
[gcode_macro GEN_CABLE_TIES]
description: Generate cable ties: GEN_CABLE_TIES COUNT=6 LENGTH=120 WIDTH=8 LAYERS=3 VARIANT=CLASSIC|LOOP
gcode:
    {% set var = params.VARIANT|default('')|string|upper %}
    {% if var not in ('', 'CLASSIC', 'LOOP') %}
        NOTIFY TEXT="GEN_CABLE_TIES: VARIANT must be CLASSIC or LOOP" LEVEL=error SOUND=r2_error
        M117 GEN_TIES: bad variant
    {% else %}
        {% if params.COUNT is defined %}
            SAVE_VARIABLE VARIABLE=tie_count  VALUE={params.COUNT|int}
        {% endif %}
        _PACE
        {% if params.LENGTH is defined %}
            SAVE_VARIABLE VARIABLE=tie_length VALUE={params.LENGTH|float}
        {% endif %}
        _PACE
        {% if params.WIDTH is defined %}
            SAVE_VARIABLE VARIABLE=tie_width  VALUE={params.WIDTH|float}
        {% endif %}
        _PACE
        {% if params.LAYERS is defined %}
            SAVE_VARIABLE VARIABLE=tie_layers VALUE={params.LAYERS|int}
        {% endif %}
        _PACE
        {% if params.VARIANT is defined %}
            SAVE_VARIABLE VARIABLE=tie_variant VALUE="\"{var}\""
        {% endif %}
        _PACE
        {% if params.LAYER_H is defined %}
            SAVE_VARIABLE VARIABLE=tie_layer_h VALUE={params.LAYER_H|float}
        {% endif %}
        _PACE
        {% if params.BRIM is defined   %}SAVE_VARIABLE VARIABLE=tie_brim   VALUE={params.BRIM|int == 1}{% endif %}
        RESPOND MSG="GEN_CABLE_TIES: {params.COUNT|default(printer['save_variables'].variables.tie_count|default(6))|int} tie(s) queued - creating..."
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        CABLE_TIE_GENERATE
    {% endif %}

# -------------------------------------------------------------------------------------
# ANGLE_INFO - show every setting
# -------------------------------------------------------------------------------------
[gcode_macro ANGLE_INFO]
description: Angle plates: show the current settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set stf = sv.angle_stiffener|default(1)|int %}
    {% set flat = sv.angle_flat|default(False) %}
    {% if flat %}
    RESPOND MSG="Info: Flat connectors: {sv.angle_count|default(2)|int}x, length {sv.angle_leg_a|default(60)|round(0)|int}+{sv.angle_leg_b|default(60)|round(0)|int}mm, width {sv.angle_width|default(25)|round(0)|int}mm, {sv.angle_layers|default(6)|int} layers @ {sv.angle_layer_h|default(0.2)|round(2)}mm - the same generator in strip mode (no bend, straight connectors)"
    {% else %}
    RESPOND MSG="Info: Angle plates: {sv.angle_count|default(2)|int}x, {sv.angle_deg|default(90)|round(0)|int} deg, legs {sv.angle_leg_a|default(60)|round(0)|int}/{sv.angle_leg_b|default(60)|round(0)|int}mm, width {sv.angle_width|default(25)|round(0)|int}mm, {sv.angle_layers|default(6)|int} layers @ {sv.angle_layer_h|default(0.2)|round(2)}mm | holes {sv.angle_holes|default(2)|int} x {sv.angle_hole_d|default(4)|round(1)}mm per leg, countersink {'ON (countersunk screws)' if sv.angle_countersink|default(True) else 'off (normal holes)'}, stiffener {['none', 'gusset rib', 'stepped rib'][stf] if stf in (0,1,2) else stf} | walls {sv.angle_walls|default(2)|int} loop(s) (wall thickness = walls x line width, auto-reduced on narrow legs), infill {sv.angle_infill|default(100)|round(0)|int}%, ironing {'ON (slow smoothing pass over the top face)' if sv.angle_ironing|default(False) else 'off'} | holes auto-arrange on the leg - the diameter is clamped to the leg width and the count auto-reduces if the leg is too short - the result message lists every adjustment"
    {% endif %}

# =====================================================================================
# R216 (.136n): SIMPLE GEOMETRY - triangles, squares/rectangles, regular polygons,
# cylinders (round or segment count), with height, wall count (1 wall = SPIRAL/VASE),
# wall thickness and infill. LCD: Generator > Geometry. Console: GEN_SHAPE SHAPE=CYLINDER ...
# =====================================================================================

[gcode_macro SHAPE_INFO]
description: Geometry: current settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set kind = sv.shape_kind|default('CYLINDER') %}
    {% set vase = sv.shape_walls|default(2)|int == 1 %}
    RESPOND MSG="Info: Geometry: { kind } {% if kind in ['POLY', 'CYLINDER'] and sv.shape_corners|default(0)|int > 0 %}({ sv.shape_corners|default(0)|int } { 'corners' if kind == 'POLY' else 'segments' }) {% endif %}{ sv.shape_size_x|default(40)|round(0)|int } x { sv.shape_size_y|default(40)|round(0)|int }mm, { sv.shape_height|default(20)|round(0)|int }mm tall | walls { sv.shape_walls|default(2)|int } loop(s) = { (sv.shape_walls|default(2)|int * 0.65)|round(2) }mm{% if sv.shape_wall_thick|default(0)|float > 0 %} (thickness { sv.shape_wall_thick|default(0)|round(1) }mm wins over the count){% endif %}, infill { sv.shape_infill|default(20)|round(0)|int }%, base { sv.shape_base|default(3)|int } layer(s), LH { sv.shape_layer_h|default(0.2)|round(2) }mm{% if vase %} - VASE/SPIRAL: one continuous wall, no top, infill off{% endif %} | round = 48 segments, corners 0 = round"

[gcode_macro SHAPE_GENERATE]
description: Geometry: create the shape file (bumps shape_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set kind = sv.shape_kind|default('CYLINDER')|string|upper %}
    {% set sx = sv.shape_size_x|default(40)|float %}
    {% set sy = sv.shape_size_y|default(40)|float %}
    {% set hh = sv.shape_height|default(20)|float %}
    {% set walls = sv.shape_walls|default(2)|int %}
    {% set wt = sv.shape_wall_thick|default(0)|float %}
    {% set inf = sv.shape_infill|default(20)|float %}
    {% set crn = sv.shape_corners|default(0)|int %}
    {% set bas = sv.shape_base|default(3)|int %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'shapes' %}
        _GEN_ARM KEY=shapes WHAT='geometry'
    {% elif kind not in ['TRIANGLE', 'SQUARE', 'POLY', 'CYLINDER'] %}
        NOTIFY TEXT="Geometry: shape must be TRIANGLE, SQUARE, POLY or CYLINDER" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad kind
    {% elif sx < 8 or sx > 200 or sy < 8 or sy > 200 %}
        NOTIFY TEXT="Geometry: X/Y must be 8..200mm (got { sx|round(0)|int }/{ sy|round(0)|int })" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad size
    {% elif hh < 2 or hh > 180 %}
        NOTIFY TEXT="Geometry: height must be 2..180mm (got { hh|round(0)|int })" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad height
    {% elif walls < 1 or walls > 8 %}
        NOTIFY TEXT="Geometry: walls must be 1..8 loops (1 = vase) - got { walls }" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad walls
    {% elif wt < 0 or wt > 8 %}
        NOTIFY TEXT="Geometry: wall thickness must be 0..8mm (0 = use the loop count)" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad thickness
    {% elif inf < 0 or inf > 100 %}
        NOTIFY TEXT="Geometry: infill must be 0..100% (got { inf|round(0)|int })" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad infill
    {% elif crn < 0 or crn > 64 or (kind == 'POLY' and crn < 3) %}
        NOTIFY TEXT="Geometry: corners 0..64 (POLY needs 3..12, CYLINDER 0 = round)" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad corners
    {% elif bas < 0 or bas > 12 %}
        NOTIFY TEXT="Geometry: base layers must be 0..12" LEVEL=warn SOUND=r2_notice
        M117 Shape: bad base
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=shapes{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=shape_nonce VALUE={sv.shape_nonce|default(0)|int + 1}
        M117 { 'Vase creating..' if walls == 1 else 'Shape creating..' }
        RESPOND MSG="Geometry: creating the { kind } file, { sx|round(0)|int }x{ sy|round(0)|int }x{ hh|round(0)|int }mm{% if walls == 1 %} (spiral vase){% endif %}"
        RESPOND MSG="  ready in a few seconds - it beeps and appears in the file list, start it like any file"
    {% endif %}

# GEN_SHAPE - console/Mainsail entry point (sets the variables, then generates)
#   GEN_SHAPE SHAPE=CYLINDER X=40 Y=40 HEIGHT=20 CORNERS=0 WALLS=2 WALL_THICK=0
#             INFILL=20 BASE=3 LAYER_H=0.2
[gcode_macro GEN_SHAPE]
description: Generate a geometric body: GEN_SHAPE SHAPE=CYLINDER X=40 Y=40 HEIGHT=20 CORNERS=0 WALLS=2 INFILL=20 BASE=3
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if params.SHAPE is defined %}SAVE_VARIABLE VARIABLE=shape_kind VALUE='"{ params.SHAPE|string|upper }"'{% endif %}
    {% if params.X is defined %}SAVE_VARIABLE VARIABLE=shape_size_x VALUE={ params.X|float|round(1) }{% endif %}
    {% if params.Y is defined %}SAVE_VARIABLE VARIABLE=shape_size_y VALUE={ params.Y|float|round(1) }{% endif %}
    {% if params.CORNERS is defined %}SAVE_VARIABLE VARIABLE=shape_corners VALUE={ params.CORNERS|int }{% endif %}
    {% if params.HEIGHT is defined %}SAVE_VARIABLE VARIABLE=shape_height VALUE={ params.HEIGHT|float|round(1) }{% endif %}
    {% if params.WALLS is defined %}SAVE_VARIABLE VARIABLE=shape_walls VALUE={ params.WALLS|int }{% endif %}
    {% if params.WALL_THICK is defined %}SAVE_VARIABLE VARIABLE=shape_wall_thick VALUE={ params.WALL_THICK|float|round(2) }{% endif %}
    {% if params.INFILL is defined %}SAVE_VARIABLE VARIABLE=shape_infill VALUE={ params.INFILL|float|round(1) }{% endif %}
    {% if params.BASE is defined %}SAVE_VARIABLE VARIABLE=shape_base VALUE={ params.BASE|int }{% endif %}
    {% if params.LAYER_H is defined %}SAVE_VARIABLE VARIABLE=shape_layer_h VALUE={ params.LAYER_H|float|round(2) }{% endif %}
    SHAPE_INFO
    SHAPE_GENERATE

[gcode_macro ANGLE_GENERATE]
description: Angle plates: create the printable plate file (bumps angle_nonce)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set cnt = sv.angle_count|default(2)|int %}
    {% set deg = sv.angle_deg|default(90)|float %}
    {% set la  = sv.angle_leg_a|default(60)|float %}
    {% set lb  = sv.angle_leg_b|default(60)|float %}
    {% set wd  = sv.angle_width|default(25)|float %}
    {% set ly  = sv.angle_layers|default(6)|int %}
    {% set hd  = sv.angle_hole_d|default(4)|float %}
    {% set flat = sv.angle_flat|default(False) %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'angles' %}
        _GEN_ARM KEY=angles WHAT='angle plates'
    {% elif cnt < 1 or cnt > printer['gcode_macro _GENERATORS'].max_plates %}
        NOTIFY TEXT="Angle plates: count must be 1..{printer['gcode_macro _GENERATORS'].max_plates}" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad count
    {% elif not flat and (deg < 30 or deg > 170) %}
        NOTIFY TEXT="Angle plates: angle must be 30..170 deg (or use FLAT mode)" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad angle
    {% elif la < 20 or la > 150 or lb < 20 or lb > 150 %}
        NOTIFY TEXT="Angle plates: leg lengths must be 20..150mm" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad legs
    {% elif wd < 8 or wd > 60 %}
        NOTIFY TEXT="Angle plates: width must be 8..60mm" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad width
    {% elif ly < 4 or ly > 12 %}
        NOTIFY TEXT="Angle plates: plate layers must be 4..12" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad layers
    {% elif hd < 2 or hd > 10 %}
        NOTIFY TEXT="Angle plates: hole diameter must be 2..10mm (it is also auto-clamped to the leg width)" LEVEL=warn SOUND=r2_notice
        M117 Angle: bad hole
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=angles{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=angle_nonce VALUE={sv.angle_nonce|default(0)|int + 1}
        M117 {'Flat creating..' if flat else 'Angle creating..'}
        RESPOND MSG="Angle: creating the file for {cnt} plate(s), {deg|round(0)|int ~ ' deg' if not flat else 'flat connector'}, legs {'%.0f'|format(la)}/{'%.0f'|format(lb)}mm, holes auto-arranged"
        RESPOND MSG="  ready in a few seconds - it beeps and appears in the file list, start it like any file"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_ANGLES - console/Mainsail entry point (sets the variables, then generates)
#   GEN_ANGLES COUNT=2 ANGLE=90 LEG_A=60 LEG_B=60 WIDTH=25 LAYERS=6 HOLES=2 HOLE_D=4
#              CS=1 STIFFENER=1 FLAT=0 LAYER_H=0.2
#   FLAT=1 switches to the FLAT CONNECTOR mode: both halves share the SAME hole
#   pattern (a second Winkel side would mirror it - here both boards get the same).
#   STIFFENER: 0 = none | 1 = corner gusset rib | 2 = stepped (stronger, taller)
# -------------------------------------------------------------------------------------
[gcode_macro GEN_ANGLES]
description: Generate angle plates / flat connectors: GEN_ANGLES ANGLE=90 LEG_A=60 LEG_B=60 WIDTH=25 HOLES=2 HOLE_D=4 CS=1 STIFFENER=1 WALLS=2 INFILL=100 IRONING=0 FLAT=0
gcode:
    {% set stf = params.STIFFENER|default(-1)|int %}
    {% if stf < -1 or stf > 2 %}
        NOTIFY TEXT="GEN_ANGLES: STIFFENER must be 0 (none), 1 (rib) or 2 (stepped)" LEVEL=error SOUND=r2_error
        M117 GEN_ANGLE: bad stiffener
    {% else %}
        {% if params.COUNT is defined %}
            SAVE_VARIABLE VARIABLE=angle_count  VALUE={params.COUNT|int}
        {% endif %}
        _PACE
        {% if params.ANGLE is defined %}
            SAVE_VARIABLE VARIABLE=angle_deg   VALUE={params.ANGLE|float}
        {% endif %}
        _PACE
        {% if params.LEG_A is defined %}
            SAVE_VARIABLE VARIABLE=angle_leg_a VALUE={params.LEG_A|float}
        {% endif %}
        _PACE
        {% if params.LEG_B is defined %}
            SAVE_VARIABLE VARIABLE=angle_leg_b VALUE={params.LEG_B|float}
        {% endif %}
        _PACE
        {% if params.WIDTH is defined %}
            SAVE_VARIABLE VARIABLE=angle_width VALUE={params.WIDTH|float}
        {% endif %}
        _PACE
        {% if params.LAYERS is defined %}
            SAVE_VARIABLE VARIABLE=angle_layers VALUE={params.LAYERS|int}
        {% endif %}
        _PACE
        {% if params.HOLES is defined %}
            SAVE_VARIABLE VARIABLE=angle_holes VALUE={params.HOLES|int}
        {% endif %}
        _PACE
        {% if params.HOLE_D is defined %}
            SAVE_VARIABLE VARIABLE=angle_hole_d VALUE={params.HOLE_D|float}
        {% endif %}
        _PACE
        {% if params.CS is defined %}
            SAVE_VARIABLE VARIABLE=angle_countersink VALUE={params.CS|int == 1}
        {% endif %}
        _PACE
        {% if params.STIFFENER is defined %}
            SAVE_VARIABLE VARIABLE=angle_stiffener VALUE={params.STIFFENER|int}
        {% endif %}
        _PACE
        {% if params.WALLS is defined %}
            SAVE_VARIABLE VARIABLE=angle_walls VALUE={params.WALLS|int}
        {% endif %}
        _PACE
        {% if params.INFILL is defined %}
            SAVE_VARIABLE VARIABLE=angle_infill VALUE={params.INFILL|float}
        {% endif %}
        _PACE
        {% if params.IRONING is defined %}
            SAVE_VARIABLE VARIABLE=angle_ironing VALUE={params.IRONING|int == 1}
        {% endif %}
        _PACE
        {% if params.FLAT is defined %}
            SAVE_VARIABLE VARIABLE=angle_flat   VALUE={params.FLAT|int == 1}
        {% endif %}
        _PACE
        {% if params.LAYER_H is defined %}SAVE_VARIABLE VARIABLE=angle_layer_h VALUE={params.LAYER_H|float}{% endif %}
        RESPOND MSG="GEN_ANGLES: {params.COUNT|default(printer['save_variables'].variables.angle_count|default(2))|int} plate(s) queued - creating..."
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        ANGLE_GENERATE
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing/outdated copies
# -------------------------------------------------------------------------------------
[gcode_macro _V18_GEN]
description: Version sentinel of 17_generator.cfg (internal)
gcode:

# =====================================================================================
#  R89: LITHOPHANE + GASKET GENERATORS (Tools > Lithophane / Gaskets)
#  The lithophane browser lists the gcodes folder's images (pushed by the
#  watcher into litho_files, newest first, 10 slots). Slot press = generate.
#  Delete = 2-press confirm (arm + press again); only the IMAGE is deleted,
#  its plotter .gcode stays.
# =====================================================================================

# -------------------------------------------------------------------------------------
# LITHO_INFO - show the settings + how many images are ready
# -------------------------------------------------------------------------------------
[gcode_macro LITHO_INFO]
description: Lithophane: show the settings + ready images
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set n = printer['gcode_macro _SDM'].litho_files|default([])|length %}
    RESPOND MSG="Info: Lithophane: { 'FLAT' if sv.litho_orient|default('STANDING') == 'FLAT' else 'STANDING' } {sv.litho_height|default(100)|round(0)|int}mm, layer {sv.litho_layer_h|default(0.12)|round(2)}mm, levels {sv.litho_levels|default(0)|int ~ (' (continuous)' if sv.litho_levels|default(0)|int == 0 else '')}, frame {'on' if sv.litho_frame|default(True) else 'off'}, brim {sv.litho_brim|default(6)|int} loop(s), ironing {'on' if sv.litho_ironing|default(False) else 'off'}{ ', colors %d x %dL' % (sv.litho_colors|default(1)|int, sv.litho_col_layers|default(3)|int) if sv.litho_colors|default(1)|int > 1 else '' } |   images ready: {n} (upload .png/.jpg into the gcodes folder - the list refreshes on its own) |   auto-optimize runs on every image: contrast stretch, smoothing, mirror - white/natural PLA glows best"

# -------------------------------------------------------------------------------------
# LITHO_CREATE - generate from image slot INDEX (0-9)
# -------------------------------------------------------------------------------------
[gcode_macro LITHO_CREATE]
description: Lithophane: create from image slot INDEX (0-9, bumps litho_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% set files = printer['gcode_macro _SDM'].litho_files|default([]) %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    # (per-slot key: arming slot 3 must not fire slot 5)
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'litho' ~ idx %}
        _GEN_ARM KEY=litho{idx} WHAT='the lithophane from slot {idx + 1}'
    {% elif idx < 0 or idx >= files|length %}
        NOTIFY TEXT="No image in this slot - upload a .png/.jpg into the gcodes folder" LEVEL=warn SOUND=r2_notice
        M117 Litho: empty slot
    {% else %}
        {% set fn = files[idx]|string %}
        SAVE_VARIABLE VARIABLE=litho_file VALUE='"{fn}"'
        _PACE
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=litho{idx}{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=litho_nonce VALUE={sv.litho_nonce|default(0)|int + 1}
        M117 Litho creating..
        RESPOND MSG="Litho: creating from {fn} - {sv.litho_height|default(100)|round(0)|int}mm, { 'FLAT (back on the bed)' if sv.litho_orient|default('STANDING') == 'FLAT' else 'STANDING (on edge)' }{ ', %d color band(s)' % sv.litho_colors|default(1)|int if sv.litho_colors|default(1)|int > 1 else '' }, dark = thick"
        RESPOND MSG="  big images take a minute (own background thread) - it beeps and appears in the file list"
    {% endif %}

# -------------------------------------------------------------------------------------
# LITHO_DEL_SLOT - delete image slot INDEX (2-press: arm, then press again)
# -------------------------------------------------------------------------------------
[gcode_macro LITHO_DEL_SLOT]
description: Lithophane: delete image slot INDEX (press twice to confirm)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% set files = printer['gcode_macro _SDM'].litho_files|default([]) %}
    {% if idx < 0 or idx >= files|length %}
        NOTIFY TEXT="No image in this slot" LEVEL=warn SOUND=r2_notice
        M117 Litho: empty slot
    {% else %}
        {% set fn = files[idx]|string %}
        {% if s.litho_del_arm|default('') == fn %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=litho_del_arm VALUE='""'
            SAVE_VARIABLE VARIABLE=litho_del_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=litho_del_nonce VALUE={sv.litho_del_nonce|default(0)|int + 1}
            _UI_SOUND NAME=r2_confirm
            M117 Image deleting..
            RESPOND MSG="Deleting image {fn} - its plotter .gcode (if any) stays in the file list"
        {% else %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=litho_del_arm VALUE='"{fn}"'
            _UI_SOUND NAME=r2_notice
            M117 Again = delete
            RESPOND MSG="[i] Delete {fn}: press the slot AGAIN to confirm (only the image goes away)"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SEAL_INFO / SEAL_GENERATE / GEN_SEAL - gasket rings
# -------------------------------------------------------------------------------------
[gcode_macro SEAL_INFO]
description: Gaskets: show the current settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set prof = sv.seal_profile|default('FLAT')|string|upper %}
    RESPOND MSG="Info: Gasket: OD {sv.seal_od|default(40)|round(1)}mm, ID {sv.seal_id|default(20)|round(1)}mm, height {sv.seal_height|default(1.2)|round(2)}mm, face {prof ~ (' (two sealing lips)' if prof in ('NUT','GROOVE') else '')}, ironing {'on' if sv.seal_ironing|default(False) else 'off'}, layer {sv.seal_layer_h|default(0.2)|round(2)}mm |   NUT mills a groove into the face: two raised lips = higher contact pressure = seals better on uneven flanges |   tips: TPU seals best (slow + dry), PETG works - the file already prints at 15mm/s"

[gcode_macro SEAL_GENERATE]
description: Gaskets: create the seal ring file (bumps seal_nonce)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set od  = sv.seal_od|default(40)|float %}
    {% set idd = sv.seal_id|default(20)|float %}
    {% set h   = sv.seal_height|default(1.2)|float %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'seal' %}
        _GEN_ARM KEY=seal WHAT='the gasket'
    {% elif od < 12 or od > 200 %}
        NOTIFY TEXT="Gasket: OD must be 12..200mm" LEVEL=warn SOUND=r2_notice
        M117 Seal: bad OD
    {% elif idd < 6 or idd > 190 %}
        NOTIFY TEXT="Gasket: ID must be 6..190mm" LEVEL=warn SOUND=r2_notice
        M117 Seal: bad ID
    {% elif idd > od - 2.4 %}
        NOTIFY TEXT="Gasket: ring band too narrow - ID must be at least 2.4mm below OD" LEVEL=warn SOUND=r2_notice
        M117 Seal: band narrow
    {% elif h < 0.4 or h > 6 %}
        NOTIFY TEXT="Gasket: height must be 0.4..6mm" LEVEL=warn SOUND=r2_notice
        M117 Seal: bad height
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=seal{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=seal_nonce VALUE={sv.seal_nonce|default(0)|int + 1}
        M117 Seal creating..
        RESPOND MSG="Gasket: creating OD {od|round(1)}/ID {idd|round(1)}mm - one continuous spiral per band, no seam"
        RESPOND MSG="  ready in a few seconds - it beeps and appears in the file list"
    {% endif %}

[gcode_macro GEN_SEAL]
description: Generate a gasket: GEN_SEAL OD=40 ID=20 HEIGHT=1.2 PROFILE=FLAT|NUT IRONING=0
gcode:
    {% set prof = params.PROFILE|default('')|string|upper %}
    {% if prof not in ('', 'FLAT', 'NUT', 'GROOVE') %}
        NOTIFY TEXT="GEN_SEAL: PROFILE must be FLAT or NUT" LEVEL=error SOUND=r2_error
        M117 GEN_SEAL: bad profile
    {% else %}
        {% if params.OD is defined %}SAVE_VARIABLE VARIABLE=seal_od VALUE={params.OD|float}{% endif %}{% if params.ID is defined %}SAVE_VARIABLE VARIABLE=seal_id VALUE={params.ID|float}{% endif %}
        _PACE
        {% if params.HEIGHT is defined %}SAVE_VARIABLE VARIABLE=seal_height VALUE={params.HEIGHT|float}{% endif %}
        {% if params.PROFILE is defined %}SAVE_VARIABLE VARIABLE=seal_profile VALUE="\"{prof}\""{% endif %}
        {% if params.IRONING is defined %}SAVE_VARIABLE VARIABLE=seal_ironing VALUE={params.IRONING|int == 1}{% endif %}
        {% if params.LAYER_H is defined %}SAVE_VARIABLE VARIABLE=seal_layer_h VALUE={params.LAYER_H|float}{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SEAL_GENERATE
    {% endif %}

# -------------------------------------------------------------------------------------
# FRAME_INFO / FRAME_GENERATE / GEN_FRAME - picture frames and display cases (R90)
# -------------------------------------------------------------------------------------
[gcode_macro FRAME_INFO]
description: Frames: show the current settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set pre = sv.frame_preset|default('')|string %}
    {% set shape = sv.frame_shape|default('RECT')|string|upper %}
    {% set clos = sv.frame_closure|default('BACK')|string|upper %}
    {% set hang = sv.frame_hang|default('TOP')|string|upper %}
    {% set size = pre ~ ' photo' if pre else 'custom ' ~ sv.frame_w|default(102)|round(0)|string ~ 'x' ~ sv.frame_h|default(152)|round(0)|string ~ 'mm' %}
    RESPOND MSG="Info: Frame: {size}{(', ' ~ shape) if shape == 'OVAL' else ''} |   border {sv.frame_border|default(12)|round(1)}mm, depth {sv.frame_depth|default(8)|round(1)}mm, corner r{sv.frame_corner|default(6)|round(1)}mm, closure {clos}, hang {hang}, stand {'on' if sv.frame_stand|default(False) else 'off'}, ironing {'on' if sv.frame_ironing|default(True) else 'off'}, infill {sv.frame_infill|default(60)|round(0)}% |   BACK = photo + backplate from behind (snap-in plate - press it in, the 4 wall nubs click over it) - SIDE = photo + plate slide in through the left wall"

[gcode_macro FRAME_GENERATE]
description: Frames: create the frame file (bumps frame_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set pre = sv.frame_preset|default('')|string %}
    {% set w = sv.frame_w|default(102)|float %}
    {% set h = sv.frame_h|default(152)|float %}
    {% set d = sv.frame_depth|default(8)|float %}
    {% set fw = sv.frame_border|default(12)|float %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'frame' %}
        _GEN_ARM KEY=frame WHAT='the frame'
    {% elif pre == '' and (w < 40 or w > 230 or h < 40 or h > 230) %}
        NOTIFY TEXT="Frame: custom photo must be 40..230mm each side" LEVEL=warn SOUND=r2_notice
        M117 Frame: bad size
    {% elif d < 3 or d > 60 %}
        NOTIFY TEXT="Frame: depth must be 3..60mm (under 15 = photo frame, 15+ = display case)" LEVEL=warn SOUND=r2_notice
        M117 Frame: bad depth
    {% elif fw < 4 or fw > 30 %}
        NOTIFY TEXT="Frame: border must be 4..30mm" LEVEL=warn SOUND=r2_notice
        M117 Frame: bad border
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=frame{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=frame_nonce VALUE={sv.frame_nonce|default(0)|int + 1}
        M117 Frame creating..
        RESPOND MSG="Frame: creating {pre if pre else (w|round(0)|string ~ 'x' ~ h|round(0)|string)} - front prints UP with the ironing pass"
        RESPOND MSG="  bed-fit is checked while generating: too big becomes a 4-strip glue kit, errors beep and show here"
    {% endif %}

[gcode_macro GEN_FRAME]
description: Generate a frame: GEN_FRAME PRESET=10x15 DEPTH=8 BORDER=12 SHAPE=RECT CLOSURE=BACK FRONT=IRON DISC=NONE DISC_T=1 DISC_SIDE=FRONT CABLE=0
gcode:
    {% set shape = params.SHAPE|default('')|string|upper %}
    {% set clos = params.CLOSURE|default('')|string|upper %}
    {% set hang = params.HANG|default('')|string|upper %}
    {% set front = params.FRONT|default('')|string|upper %}
    {% set disc = params.DISC|default('')|string|upper %}
    {% set dside = params.DISC_SIDE|default('')|string|upper %}
    {% set sdir = params.S_DIR|default('')|string|upper %}
    {% if shape not in ('', 'RECT', 'OVAL') %}
        NOTIFY TEXT="GEN_FRAME: SHAPE must be RECT or OVAL" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad shape
    {% elif clos not in ('', 'BACK', 'SIDE') %}
        NOTIFY TEXT="GEN_FRAME: CLOSURE must be BACK or SIDE" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad closure
    {% elif hang not in ('', 'TOP', 'BOTTOM', 'LEFT', 'RIGHT', 'OFF') %}
        NOTIFY TEXT="GEN_FRAME: HANG must be TOP, BOTTOM, LEFT, RIGHT or OFF" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad hang
    {% elif front not in ('', 'IRON', 'FLIP', 'LINES', 'WAVES', 'HEX') %}
        NOTIFY TEXT="GEN_FRAME: FRONT must be IRON, FLIP, LINES, WAVES or HEX" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad front
    {% elif disc not in ('', 'NONE', 'GLASS', 'PLEXI', 'FOIL', 'LITHO') %}
        NOTIFY TEXT="GEN_FRAME: DISC must be NONE, GLASS, PLEXI, FOIL or LITHO" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad disc
    {% elif dside not in ('', 'FRONT', 'BACK') %}
        NOTIFY TEXT="GEN_FRAME: DISC_SIDE must be FRONT or BACK" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad disc side
    {% elif sdir not in ('', 'IN', 'OUT') %}
        NOTIFY TEXT="GEN_FRAME: S_DIR must be IN or OUT" LEVEL=error SOUND=r2_error
        M117 GEN_FRAME: bad structure dir
    {% else %}
        {% if params.PRESET is defined %}SAVE_VARIABLE VARIABLE=frame_preset VALUE="\"{params.PRESET|default('')|string}\""{% endif %}
        {% if params.W is defined %}SAVE_VARIABLE VARIABLE=frame_w VALUE={params.W|float}{% endif %}
        {% if params.H is defined %}SAVE_VARIABLE VARIABLE=frame_h VALUE={params.H|float}{% endif %}
        _PACE
        {% if params.DEPTH is defined %}SAVE_VARIABLE VARIABLE=frame_depth VALUE={params.DEPTH|float}{% endif %}
        {% if params.BORDER is defined %}SAVE_VARIABLE VARIABLE=frame_border VALUE={params.BORDER|float}{% endif %}
        {% if params.CORNER is defined %}SAVE_VARIABLE VARIABLE=frame_corner VALUE={params.CORNER|float}{% endif %}
        {% if params.SHAPE is defined %}SAVE_VARIABLE VARIABLE=frame_shape VALUE="\"{shape}\""{% endif %}
        {% if params.CLOSURE is defined %}SAVE_VARIABLE VARIABLE=frame_closure VALUE="\"{clos}\""{% endif %}
        {% if params.HANG is defined %}SAVE_VARIABLE VARIABLE=frame_hang VALUE="\"{hang}\""{% endif %}
        _PACE
        {% if params.STAND is defined %}SAVE_VARIABLE VARIABLE=frame_stand VALUE={params.STAND|int == 1}{% endif %}
        {% if params.IRONING is defined %}SAVE_VARIABLE VARIABLE=frame_ironing VALUE={params.IRONING|int == 1}{% endif %}
        {% if params.INFILL is defined %}SAVE_VARIABLE VARIABLE=frame_infill VALUE={params.INFILL|float}{% endif %}
        {% if params.TOP_L is defined %}SAVE_VARIABLE VARIABLE=frame_top_l VALUE={params.TOP_L|int}{% endif %}
        {% if params.BOT_L is defined %}SAVE_VARIABLE VARIABLE=frame_bot_l VALUE={params.BOT_L|int}{% endif %}
        {% if params.FRONT is defined %}SAVE_VARIABLE VARIABLE=frame_front VALUE="\"{front}\""{% endif %}
        {% if params.CABLE is defined %}SAVE_VARIABLE VARIABLE=frame_cable VALUE={params.CABLE|int == 1}{% endif %}
        _PACE
        {% if params.DISC is defined %}SAVE_VARIABLE VARIABLE=frame_disc VALUE="\"{disc}\""{% endif %}
        {% if params.DISC_T is defined %}SAVE_VARIABLE VARIABLE=frame_disc_t VALUE={params.DISC_T|float}{% endif %}
        {% if params.DISC_SIDE is defined %}SAVE_VARIABLE VARIABLE=frame_disc_side VALUE="\"{dside}\""{% endif %}
        {% if params.S_DEEP is defined %}SAVE_VARIABLE VARIABLE=frame_s_deep VALUE={params.S_DEEP|float}{% endif %}
        {% if params.S_SPACE is defined %}SAVE_VARIABLE VARIABLE=frame_s_space VALUE={params.S_SPACE|float}{% endif %}
        _PACE
        {% if params.S_ANGLE is defined %}SAVE_VARIABLE VARIABLE=frame_s_angle VALUE={params.S_ANGLE|float}{% endif %}
        {% if params.S_AMP is defined %}SAVE_VARIABLE VARIABLE=frame_s_amp VALUE={params.S_AMP|float}{% endif %}
        {% if params.S_SIZE is defined %}SAVE_VARIABLE VARIABLE=frame_s_size VALUE={params.S_SIZE|float}{% endif %}
        {% if params.S_DIR is defined %}SAVE_VARIABLE VARIABLE=frame_s_dir VALUE="\"{sdir}\""{% endif %}
        {% if params.WALLS is defined %}
            {% if params.WALLS|int < 1 or params.WALLS|int > 4 %}
                NOTIFY TEXT="GEN_FRAME: WALLS must be 1..4" LEVEL=error SOUND=r2_error
                M117 GEN_FRAME: bad walls
            {% else %}SAVE_VARIABLE VARIABLE=frame_walls VALUE={params.WALLS|int}{% endif %}
        {% endif %}
        _PACE
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        FRAME_GENERATE
    {% endif %}



# =====================================================================================
#  R106 (field log .82, wish f): FRAME USER PRESETS - store / load / delete the
#  COMPLETE frame configuration (all 26 frame_* variables incl. walls).
#  LCD: Generator > Frame > Settings > Presets.  Console: FRAME_SAVE_PRESET /
#  FRAME_LOAD_PRESET N / FRAME_DELETE_PRESET N / FRAME_PRESETS_INFO
#  (same 8-slot + naked-dict pattern as the material defaults, R70)
# =====================================================================================
[gcode_macro FRAME_SAVE_PRESET]
description: Store the current frame settings as a user preset (R174 engine, unlimited)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set nm = sv.frame_preset|default('')|string %}
    {% if nm == '' %}{% set nm = 'frame' %}{% endif %}
    _GEN_PRESET ACTION=save GEN=frame NAME={nm}

[gcode_macro FRAME_LOAD_PRESET]
description: Load frame user preset N (slot on the current page, R174)
gcode:
    _GEN_PRESET ACTION=load GEN=frame SLOT={[params.N|default(1)|int - 1, 0]|max}

[gcode_macro FRAME_DELETE_PRESET]
description: Delete frame user preset N (slot on the current page, R174)
gcode:
    _GEN_PRESET ACTION=delete GEN=frame SLOT={[params.N|default(1)|int - 1, 0]|max}

[gcode_macro FRAME_PRESETS_INFO]
description: List all frame user presets (console)
gcode:
    _GEN_PRESET ACTION=info GEN=frame

# =====================================================================================
#  R91: TEXTURE TOOL - fuzzy skin / bumps on an EXISTING g-code file
#  (separate script r2_texture.py, lazy import in the watcher; writes a NEW
#  _TX_V01 file - never an overwrite, never auto-started)
# =====================================================================================
[gcode_macro TEXTURE_APPLY]
description: Texture a file (R175 seamless library): TEXTURE_APPLY FILE=f.gcode MODE=BUMPS PATTERN=BRICKS SIZE=10 ZSIZE=4 DEPTH=0.3 DIR=OUT SEED=91 (MODE=FUZZY THICK=0.3 DENSITY=100) (PRESET=ORCA/LAYERS/SUBTLE/GRIP fuzzy or R224 ROPE/BASKET/CHESS bumps)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set mode = params.MODE|default(sv.texture_mode|default('')|string)|string|upper %}
    {% if params.PRESET is defined and params.PRESET|string|upper
          in ('ORCA', 'LAYERS', 'SUBTLE', 'GRIP') %}
        {% set mode = 'FUZZY' %}
    {% elif params.PRESET is defined and params.PRESET|string|upper
          in ('ROPE', 'BASKET', 'CHESS') %}
        {% set mode = 'BUMPS' %}
    {% endif %}
    {% set pat = params.PATTERN|default(sv.texture_pattern|default('')|string)|string|upper %}
    {% set dir = params.DIR|default(sv.texture_dir|default('')|string)|string|upper %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'texture' %}
        _GEN_ARM KEY=texture WHAT='the texture'
    {% elif mode not in ('', 'OFF', 'FUZZY', 'BUMPS') %}
        NOTIFY TEXT="TEXTURE: MODE must be FUZZY or BUMPS" LEVEL=error SOUND=r2_error
        M117 TEXTURE: bad mode
    {% elif mode == 'OFF' and params.PRESET is not defined %}
        NOTIFY TEXT="TEXTURE: pick a mode first (Pre-Print > Texture > Mode)" LEVEL=warn SOUND=r2_notice
        M117 TEXTURE: pick mode
    {% elif pat not in ('', 'RIDGES', 'WAVES', 'GRID', 'HATCH', 'CHECKER', 'HEX', 'HONEYCOMB', 'BASKET', 'ROPE', 'PLANKS', 'BRICKS', 'SANDSTONE', 'CONCRETE', 'CLAY', 'CREPE', 'FABRIC', 'PLUSH', 'HILBERT', 'SCRATCH', 'GLITCH', 'MAP') %}
        NOTIFY TEXT="TEXTURE: unknown pattern {pat} - the library has 27 (Ridges, Waves, Grid, Hatch, Checker, Hex, Honeycomb, Basket, Rope, Planks, Bricks, Sandstone, Concrete, Clay, Crepe, Fabric, Plush, Hilbert, Scratch, Glitch, Knit, Fluted, Bark, Scales, Facets, Macrame, Map)" LEVEL=error SOUND=r2_error
        M117 TEXTURE: bad pattern
    {% elif dir not in ('', 'IN', 'OUT') %}
        NOTIFY TEXT="TEXTURE: DIR must be IN or OUT" LEVEL=error SOUND=r2_error
        M117 TEXTURE: bad dir
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="TEXTURE: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 TEXTURE: bad file
    {% elif params.PRESET is defined and params.PRESET|string|upper
              not in ('', 'ORCA', 'LAYERS', 'SUBTLE', 'GRIP',
                      'ROPE', 'BASKET', 'CHESS') %}
        NOTIFY TEXT="TEXTURE: PRESET must be ORCA, LAYERS, SUBTLE, GRIP, ROPE, BASKET or CHESS" LEVEL=error SOUND=r2_error
        M117 TEXTURE: bad preset
    {% elif pat == 'MAP' and params.MAP is not defined
              and sv.texture_map|default('')|string == ''
              and sv.img_pick_file|default('')|string == '' %}
        # R237 (.136ah field report 'cannot load images as MAP'): fail HERE,
        # not in the watcher queue - MAP without any image (no MAP= param,
        # no stored texture_map, no browser pick) used to die as a generic
        # background error. Since R237 a root image click picks too
        # (13_system.cfg), so a pick exists as soon as one image was clicked.
        NOTIFY TEXT="TEXTURE: MAP needs an image - click one in the SD browser first (it lands in the main folder)" LEVEL=error SOUND=r2_error
        M117 TEXTURE: MAP no img
    {% else %}
        {% set presets95 = {
            'ORCA':   (0.30, 100.0, 'Orca default (0.3mm thickness, dense)'),
            'LAYERS': (0.25, 100.0, 'hide layer lines (Orca 0.2-0.3mm / dense)'),
            'SUBTLE': (0.15, 60.0,  'subtle matte (Orca 0.1-0.2mm / sparse)'),
            'GRIP':   (0.50, 100.0, 'aggressive grip (Orca 0.5-0.8mm / dense)')} %}
        {% set pre95 = params.PRESET|default('')|string|upper %}
        {% if pre95 in ('ROPE', 'BASKET', 'CHESS') %}
            {% set b95 = {
                'ROPE':   ('ROPE',    14.0, 10.0, 0.50, 'twisted 3-strand rope'),
                'BASKET': ('BASKET',  10.0, 10.0, 0.35, 'interlaced basket weave'),
                'CHESS':  ('CHECKER', 12.0, 12.0, 0.40, 'soft chessboard')}[pre95] %}
            SAVE_VARIABLE VARIABLE=texture_mode VALUE="\"BUMPS\""
            _PACE
            SAVE_VARIABLE VARIABLE=texture_pattern VALUE="\"{b95[0]}\""
            _PACE
            SAVE_VARIABLE VARIABLE=texture_scale VALUE={b95[1]}
            _PACE
            SAVE_VARIABLE VARIABLE=texture_zsize VALUE={b95[2]}
            _PACE
            SAVE_VARIABLE VARIABLE=texture_amp VALUE={b95[3]}
            {% set mode = 'BUMPS' %}
            RESPOND MSG="Texture preset {pre95}: pattern {b95[0]}, size {b95[1]}mm, zsize {b95[2]}mm, depth {b95[3]}mm - {b95[4]}"
        {% elif pre95 != '' %}
            {% set p95 = presets95[pre95] %}
            SAVE_VARIABLE VARIABLE=texture_mode VALUE="\"FUZZY\""
            _PACE
            SAVE_VARIABLE VARIABLE=texture_fuzzy_thick VALUE={p95[0]}
            _PACE
            SAVE_VARIABLE VARIABLE=texture_fuzzy_density VALUE={p95[1]}
            {% set mode = 'FUZZY' %}
            RESPOND MSG="Texture preset {pre95}: thick {p95[0]}mm, density {p95[1]|round|int}% - {p95[2]}"
        {% endif %}
        {% if params.FILE is defined and params.FILE|string %}
            SAVE_VARIABLE VARIABLE=texture_file VALUE="\"{params.FILE|string}\""
        {% endif %}
        {% if mode %}SAVE_VARIABLE VARIABLE=texture_mode VALUE="\"{mode}\""{% endif %}
        _PACE
        {% if params.THICK is defined %}SAVE_VARIABLE VARIABLE=texture_fuzzy_thick VALUE={params.THICK|float}{% endif %}
        {% if params.DENSITY is defined %}SAVE_VARIABLE VARIABLE=texture_fuzzy_density VALUE={params.DENSITY|float}{% endif %}
        {% if params.PATTERN is defined %}SAVE_VARIABLE VARIABLE=texture_pattern VALUE="\"{pat}\""{% endif %}
        _PACE
        {% if params.SIZE is defined %}SAVE_VARIABLE VARIABLE=texture_scale VALUE={params.SIZE|float}{% endif %}
        {% if params.SCALE is defined %}SAVE_VARIABLE VARIABLE=texture_scale VALUE={params.SCALE|float}{% endif %}
        {% if params.DEPTH is defined %}SAVE_VARIABLE VARIABLE=texture_amp VALUE={params.DEPTH|float}{% endif %}
        {% if params.AMP is defined %}SAVE_VARIABLE VARIABLE=texture_amp VALUE={params.AMP|float}{% endif %}
        {% if params.ZSIZE is defined %}SAVE_VARIABLE VARIABLE=texture_zsize VALUE={params.ZSIZE|float}{% endif %}
        {% if params.SEED is defined %}SAVE_VARIABLE VARIABLE=texture_seed VALUE={params.SEED|int}{% endif %}
        {% if params.MAP is defined %}SAVE_VARIABLE VARIABLE=texture_map VALUE="\"{params.MAP|string}\""{% endif %}
        {% if params.MAPMODE is defined %}SAVE_VARIABLE VARIABLE=texture_map_mode VALUE="\"{params.MAPMODE|string|upper}\""{% endif %}
        {% if params.MAPPOS is defined %}SAVE_VARIABLE VARIABLE=texture_map_pos VALUE="\"{params.MAPPOS|string|upper}\""{% endif %}
        {% if params.DIR is defined %}SAVE_VARIABLE VARIABLE=texture_dir VALUE="\"{dir}\""{% endif %}
        {% if pat == 'MAP' and params.MAP is not defined and sv.texture_map|default('')|string == '' %}
            {% set _picked = sv.img_pick_file|default('')|string %}
            {% if _picked != '' %}
                SAVE_VARIABLE VARIABLE=texture_map VALUE="\"{_picked}\""
                RESPOND MSG="Texture MAP: using the picked image {_picked}"
            {% endif %}
        {% endif %}
        # R189 (.134 field report 'texture tool never builds a file'):
        # jinja's default() only fires on UNDEFINED - an EMPTY _PREVIEW.name
        # (push skipped while busy / not arrived yet) never fell through to
        # preview_file, and the push carries the BARE basename (a file from
        # Texture/ ... was searched in the gcodes root = 'not found').
        # preview_file is set synchronously at selection WITH its subfolder
        # path - it is the primary source now, _PREVIEW.name only a fallback.
        {% set tf = params.FILE|default('')|string %}
        {% if tf == '' %}
            {% set tf = sv.preview_file|default('')|string %}
        {% endif %}
        {% if tf == '' %}
            {% set tf = printer['gcode_macro _PREVIEW'].name|default('')|string %}
        {% endif %}
        {% if not tf %}
            NOTIFY TEXT="TEXTURE: no file selected - pick one in the file list first" LEVEL=error SOUND=r2_error
            M117 TEXTURE: no file
        {% else %}
            SAVE_VARIABLE VARIABLE=texture_file VALUE="\"{tf}\""
            _PACE
            {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=texture{% endif %}
            {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
            SAVE_VARIABLE VARIABLE=texture_nonce VALUE={sv.texture_nonce|default(0) + 1}
            RESPOND MSG="Texture request queued: {tf} ({mode}) - runs in the background, beeps when done"
        {% endif %}
    {% endif %}


# =====================================================================================
#  R174 (.130): USER PRESETS for every generator - ONE engine, NO limits
#  One dict per generator (<gen>_user_presets, a REAL dict - SAVE_VARIABLE
#  evaluates the naked literal), keys are preset names -> full settings.
#  LCD: '<gen> > Presets' (Save / Page / 8 slots with Load+Delete each).
#  Console: _GEN_PRESET ACTION=save|load|delete|page|info GEN=<gen> [SLOT=] [NAME=]
#  R174b note: values survive as real dicts (Klipper literal_evals the naked
#  value) - the old R106 frame slots stored STRINGs and the load silently
#  fell back to defaults. The frame wrappers below keep the old commands.
# =====================================================================================

# -------------------------------------------------------------------------------------
# R176 (.130 wish list): SCALE X/Y with flow recalculation. The engine rescales
# E per move ((L'/L) x (w'/w) - layer height untouched), centers the result on
# the bed and flattens arcs. The 100% flow baseline is the NEW file.
# -------------------------------------------------------------------------------------
[gcode_macro SCALE_APPLY]
description: Scale a file in X/Y (R176): SCALE_APPLY X=120 Y=100 TOP_X=60 TOP_Y=60 (percent, 25..300, TOP_* 0=off) - taper option, flow is recomputed, output lands in the scale folder
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set px176 = params.X|default(sv.scale_x|default(100)|float)|float %}
    {% set py176 = params.Y|default(sv.scale_y|default(100)|float)|float %}
    # R216 taper: TOP_X/TOP_Y scale at the TOP of the object (0 = off)
    {% set ptx176 = params.TOP_X|default(sv.scale_top_x|default(0)|float)|float %}
    {% set pty176 = params.TOP_Y|default(sv.scale_top_y|default(0)|float)|float %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'scale' %}
        _GEN_ARM KEY=scale WHAT='the X/Y scale'
    {% elif not (25 <= px176 <= 300) or not (25 <= py176 <= 300) %}
        NOTIFY TEXT="SCALE: X and Y must be 25..300%% (got {px176}/{py176})" LEVEL=error SOUND=r2_error
        M117 SCALE: out of range
    {% elif (ptx176 != 0 and not (25 <= ptx176 <= 300)) or (pty176 != 0 and not (25 <= pty176 <= 300)) %}
        NOTIFY TEXT="SCALE: TOP_X/TOP_Y must be 0 (off) or 25..300%% (got {ptx176}/{pty176})" LEVEL=error SOUND=r2_error
        M117 SCALE: top out of range
    {% elif px176|round|int == 100 and py176|round|int == 100 and (ptx176|round|int == 0 or ptx176|round|int == 100) and (pty176|round|int == 0 or pty176|round|int == 100) %}
        NOTIFY TEXT="SCALE: 100%%/100%% with no taper changes nothing - pick at least one axis or a top factor" LEVEL=warn SOUND=r2_notice
        M117 SCALE: nothing to do
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="SCALE: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 SCALE: bad file
    {% else %}
        {% set fn176 = params.FILE|default(sv.preview_file|default('')|string)|string %}
        {% if fn176 == '' %}
            NOTIFY TEXT="SCALE: no file selected - pick one first (Pre-Print > File)" LEVEL=warn SOUND=r2_notice
            M117 SCALE: no file
        {% else %}
            SAVE_VARIABLE VARIABLE=scale_x VALUE={px176|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=scale_y VALUE={py176|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=scale_top_x VALUE={ptx176|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=scale_top_y VALUE={pty176|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=scale_file VALUE="\"{fn176}\""
            _PACE
            {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=scale{% endif %}
            SAVE_VARIABLE VARIABLE=scale_nonce VALUE={sv.scale_nonce|default(0)|int + 1}
            {% set tap216 = (ptx176|round|int > 0 and ptx176|round|int != px176|round|int) or (pty176|round|int > 0 and pty176|round|int != py176|round|int) %}
            RESPOND MSG="Scale queued: {fn176} at X {px176|round|int}%% / Y {py176|round|int}%%{% if tap216 %}, tapering to {ptx176|round(0)|int}%%/{pty176|round(0)|int}%% at the top{% endif %} - E is recomputed per move, the result lands in the scale folder"
            M117 Scaling {px176|round|int}/{py176|round|int}%%
        {% endif %}
    {% endif %}


[gcode_macro TWIST_APPLY]
description: Twist a file around Z (R216): TWIST_APPLY DEG=90 (0 at the bottom -> DEG at the top, -720..720, sign = direction) - E stays verbatim, output lands in the twist folder
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set td216 = params.DEG|default(sv.twist_deg|default(0)|float)|float %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'twist' %}
        _GEN_ARM KEY=twist WHAT='the twist'
    {% elif not (-720 <= td216 <= 720) %}
        NOTIFY TEXT="TWIST: DEG must be -720..720 (got {td216})" LEVEL=error SOUND=r2_error
        M117 TWIST: out of range
    {% elif td216|round(1)|float == 0 %}
        NOTIFY TEXT="TWIST: 0 deg changes nothing - pick an angle (sign = direction)" LEVEL=warn SOUND=r2_notice
        M117 TWIST: nothing to do
    {% elif (td216|abs|round(2))|float < 0.5 %}
        NOTIFY TEXT="TWIST: |DEG| below 0.5 would sliver the walls - pick 0.5..720" LEVEL=warn SOUND=r2_notice
        M117 TWIST: too small
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="TWIST: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 TWIST: bad file
    {% else %}
        {% set fn216 = params.FILE|default(sv.preview_file|default('')|string)|string %}
        {% if fn216 == '' %}
            NOTIFY TEXT="TWIST: no file selected - pick one first (Pre-Print > File)" LEVEL=warn SOUND=r2_notice
            M117 TWIST: no file
        {% else %}
            SAVE_VARIABLE VARIABLE=twist_deg VALUE={td216|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=twist_file VALUE="\"{fn216}\""
            _PACE
            {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=twist{% endif %}
            SAVE_VARIABLE VARIABLE=twist_nonce VALUE={sv.twist_nonce|default(0)|int + 1}
            RESPOND MSG="Twist queued: {fn216} - {td216|round(1)} deg around the Z axis (0 at the bottom -> {td216|round(1)} at the top, sign = direction), E stays verbatim, the result lands in the twist folder"
            M117 Twisting {td216|round(0)|int}deg
        {% endif %}
    {% endif %}


[gcode_macro MIRROR_APPLY]
description: Mirror a file on X or Y (R224): MIRROR_APPLY AXIS=X - the object stays EXACTLY at its place (flipped around its own center), E verbatim, output lands in the mirror folder
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set ax224 = params.AXIS|default(sv.mirror_axis|default('x')|string)|string|lower %}
    {% set ax224 = ax224[:1] %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'mirror' %}
        _GEN_ARM KEY=mirror WHAT='the mirror'
    {% elif ax224 not in ('x', 'y') %}
        NOTIFY TEXT="MIRROR: AXIS must be X or Y (got {ax224})" LEVEL=error SOUND=r2_error
        M117 MIRROR: bad axis
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="MIRROR: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 MIRROR: bad file
    {% elif params.OBJ is defined and params.OBJ|string and '/' in params.OBJ|string %}
        NOTIFY TEXT="MIRROR: OBJ must be a plain object name (no path)" LEVEL=error SOUND=r2_error
        M117 MIRROR: bad object
    {% else %}
        {% set fn224 = params.FILE|default(sv.preview_file|default('')|string)|string %}
        {% if fn224 == '' %}
            NOTIFY TEXT="MIRROR: no file selected - pick one first (Pre-Print > File)" LEVEL=warn SOUND=r2_notice
            M117 MIRROR: no file
        {% else %}
            {% set ob224 = params.OBJ|default(sv.mirror_obj|default('')|string)|string %}
            SAVE_VARIABLE VARIABLE=mirror_axis VALUE="\"{ax224}\""
            _PACE
            SAVE_VARIABLE VARIABLE=mirror_file VALUE="\"{fn224}\""
            _PACE
            SAVE_VARIABLE VARIABLE=mirror_obj VALUE="\"{ob224}\""
            _PACE
            {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=mirror{% endif %}
            SAVE_VARIABLE VARIABLE=mirror_nonce VALUE={sv.mirror_nonce|default(0)|int + 1}
            RESPOND MSG="Mirror queued: {fn224} - flip on the {ax224|upper} axis around its own center (the object stays at its place, E verbatim), the result lands in the mirror folder{% if ob224 %} - ONLY object {ob224} (multi-object file, print-by-object){% endif %}"
            M117 Mirroring {ax224|upper}{% if ob224 %} ({ob224}){% endif %}
        {% endif %}
    {% endif %}


[gcode_macro CAKE_APPLY]
description: Cut a print with a plane (R177): CAKE_APPLY YAW=15 PITCH=-10 ROLL=5 Z=8 PART=BOTH REORIENT=1 - both halves become standalone files in the cake folder
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set yw177 = params.YAW|default(sv.cake_yaw|default(0)|float)|float %}
    {% set pt177 = params.PITCH|default(sv.cake_pitch|default(0)|float)|float %}
    {% set rl177 = params.ROLL|default(sv.cake_roll|default(0)|float)|float %}
    {% set zo177 = params.Z|default(sv.cake_zoff|default(5)|float)|float %}
    {% set pa177 = params.PART|default(sv.cake_part|default('BOTH')|string)|string|upper %}
    {% set re177 = params.REORIENT|default(sv.cake_reorient|default(0))|int %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONF|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'cake' %}
        _GEN_ARM KEY=cake WHAT='the cake cut'
    {% elif not (-180 <= yw177 <= 180) or not (-90 <= pt177 <= 90) or not (-90 <= rl177 <= 90) %}
        NOTIFY TEXT="CAKE: yaw -180..180, pitch/roll -90..90 (got {yw177}/{pt177}/{rl177})" LEVEL=error SOUND=r2_error
        M117 CAKE: angle out of range
    {% elif pa177 not in ('UPPER', 'LOWER', 'BOTH') %}
        NOTIFY TEXT="CAKE: PART must be UPPER, LOWER or BOTH (got {pa177})" LEVEL=error SOUND=r2_error
        M117 CAKE: bad part
    {% elif (yw177|round(1))|float == 0 and (pt177|round(1))|float == 0 and (rl177|round(1))|float == 0 and (zo177|round(2))|float == 0 %}
        NOTIFY TEXT="CAKE: a plane at z=0 with no tilt cuts nothing" LEVEL=warn SOUND=r2_notice
        M117 CAKE: nothing to do
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="CAKE: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 CAKE: bad file
    {% else %}
        {% set fn177 = params.FILE|default(sv.preview_file|default('')|string)|string %}
        {% if fn177 == '' %}
            NOTIFY TEXT="CAKE: no file selected - pick one first (Pre-Print > File)" LEVEL=warn SOUND=r2_notice
            M117 CAKE: no file
        {% else %}
            SAVE_VARIABLE VARIABLE=cake_yaw VALUE={yw177|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=cake_pitch VALUE={pt177|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=cake_roll VALUE={rl177|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=cake_zoff VALUE={zo177|round(2)}
            _PACE
            SAVE_VARIABLE VARIABLE=cake_part VALUE="\"{pa177}\""
            _PACE
            SAVE_VARIABLE VARIABLE=cake_reorient VALUE={re177}
            _PACE
            SAVE_VARIABLE VARIABLE=cake_file VALUE="\"{fn177}\""
            _PACE
            {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=cake{% endif %}
            SAVE_VARIABLE VARIABLE=cake_nonce VALUE={sv.cake_nonce|default(0)|int + 1}
            RESPOND MSG="Cake queued: {fn177} - plane yaw {yw177|round(1)} / pitch {pt177|round(1)} / roll {rl177|round(1)} at z {zo177|round(2)}, {pa177}{% if re177 %}, cut face flat on the bed{% endif %} - the halves land in the cake folder"
            M117 Cutting {pa177|lower}
        {% endif %}
    {% endif %}


[gcode_macro STRINGART_APPLY]
description: String art (R178/R216): STRINGART_APPLY PATTERN=0|1 (0=SPIRAL, 1=PHOTO) SHAPE=0|1 (0=ROUND, 1=RECT) W=102 H=152 DIAMETER=180 ANCHORS=300 LINES=1700 RING_H=2.4 ARC=2.0 [FILE=image.png] - anchor ring + strands, lands in the StringArt folder
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set pat = params.PATTERN|default(sv.stringart_pattern|default(0)|int)|int %}
    {% set dia = params.DIAMETER|default(sv.stringart_diameter|default(180)|float)|float %}
    {% set anc = params.ANCHORS|default(sv.stringart_anchors|default(300)|int)|int %}
    {% set lin = params.LINES|default(sv.stringart_lines|default(1700)|int)|int %}
    {% set shp = params.SHAPE|default(sv.stringart_shape|default(0)|int)|int %}
    {% set fw = params.W|default(sv.stringart_w|default(102)|float)|float %}
    {% set fh = params.H|default(sv.stringart_h|default(152)|float)|float %}
    {% set rh = params.RING_H|default(sv.stringart_ringh|default(2.4)|float)|float %}
    {% set arc = params.ARC|default(sv.stringart_arc|default(2.0)|float)|float %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'stringart' %}
        _GEN_ARM KEY=stringart WHAT='the string art'
    {% elif not (60 <= dia <= 400) or not (24 <= anc <= 720) or not (50 <= lin <= 4000) %}
        NOTIFY TEXT="ARTISTICSTRINGS: diameter 60..400, anchors 24..720, strands 50..4000 (got {dia|round}/{anc}/{lin})" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: out of range
    {% elif pat != 0 and pat != 1 %}
        NOTIFY TEXT="ARTISTICSTRINGS: PATTERN must be 0 (SPIRAL) or 1 (PHOTO), got {pat}" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad pattern
    {% elif shp != 0 and shp != 1 %}
        NOTIFY TEXT="ARTISTICSTRINGS: SHAPE must be 0 (ROUND) or 1 (RECT), got {shp}" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad shape
    {% elif shp == 1 and not (60 <= fw <= 400 and 60 <= fh <= 400) %}
        NOTIFY TEXT="ARTISTICSTRINGS: frame W/H must be 60..400mm each side (got {fw|round}x{fh|round})" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad size
    {% elif not (1.2 <= rh <= 6.0) %}
        NOTIFY TEXT="ARTISTICSTRINGS: RING_H must be 1.2..6.0mm (got {rh})" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad ring height
    {% elif not (0 <= arc <= 4.0) %}
        NOTIFY TEXT="ARTISTICSTRINGS: ARC must be 0..4.0mm (got {arc})" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad bow height
    {% elif params.FILE is defined and params.FILE|string and '/' in params.FILE|string %}
        NOTIFY TEXT="ARTISTICSTRINGS: FILE must be a plain name inside the gcodes folder" LEVEL=error SOUND=r2_error
        M117 ArtisticStrings: bad file
    {% else %}
        {% set fn = params.FILE|default(sv.stringart_src|default('')|string)|string %}
        {% if pat == 1 and fn == '' %}
            NOTIFY TEXT="ARTISTICSTRINGS: PHOTO needs an image first - pick one (String art > Img: row)" LEVEL=warn SOUND=r2_notice
            M117 ArtisticStrings: no image
        {% else %}
            SAVE_VARIABLE VARIABLE=stringart_pattern VALUE={pat}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_diameter VALUE={dia|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_anchors VALUE={anc}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_lines VALUE={lin}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_shape VALUE={shp}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_w VALUE={fw|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_h VALUE={fh|round|int}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_ringh VALUE={rh}
            _PACE
            SAVE_VARIABLE VARIABLE=stringart_arc VALUE={arc}
            _PACE
            {% if fn != '' %}
                SAVE_VARIABLE VARIABLE=stringart_src VALUE="\"{fn}\""
                _PACE
            {% endif %}
            SAVE_VARIABLE VARIABLE=stringart_nonce VALUE={sv.stringart_nonce|default(0)|int + 1}
            RESPOND MSG="ArtisticStrings queued: { 'PHOTO from ' ~ fn if pat == 1 else 'SPIRAL' }, { (fw|round|int ~ 'x' ~ fh|round|int ~ 'mm RECT frame') if shp == 1 else (dia|round|int ~ 'mm ROUND ring') }, ring {rh}mm tall, strands as {arc}mm bows, {anc} anchors, {lin} strands - starts 15deg apart, pull direction alternating"
            M117 ArtisticStrings queued
        {% endif %}
    {% endif %}

[gcode_macro STRINGART_IMG]
description: ArtisticStrings (legacy): cycle through the root images (the lithophane list, newest first) - the PHOTO pattern uses it
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set files = printer['gcode_macro _SDM'].litho_files|default([]) %}
    {% if files|length == 0 %}
        NOTIFY TEXT="ARTISTICSTRINGS: no images yet - upload or pick a .png/.jpg in the SD browser first" LEVEL=warn SOUND=r2_notice
        M117 ArtisticStrings: no image
    {% else %}
        {% set i = sv.stringart_src_idx|default(-1)|int + 1 %}
        {% if i >= files|length %}
            {% set i = 0 %}
        {% endif %}
        {% set fn = files[i]|string %}
        SAVE_VARIABLE VARIABLE=stringart_src_idx VALUE={i}
        _PACE
        SAVE_VARIABLE VARIABLE=stringart_src VALUE="\"{fn}\""
        RESPOND MSG="ArtisticStrings image {i + 1}/{files|length}: {fn} - the PHOTO pattern weaves it (SPIRAL ignores it)"
        M117 Img: {fn|string|truncate(14, True)}
    {% endif %}

# =====================================================================================
#  R246 (.142) - the pattern picker class fix.
#  Field report: paging through the texture PATTERNS / presets only showed the new
#  page after leaving and re-entering the menu. Cause (klipper menu.py): item lists
#  are filtered by update_items() ONLY when a container is pushed/popped - enable
#  templates are NEVER re-evaluated while the menu is open. Name templates ARE
#  re-rendered every frame. The old 27 slots each carried 'enable: page == N' ->
#  frozen until raus+rein. The 27 became 8 rows whose NAMES slice the list live
#  (same technique as the SD browser slots). This macro keeps the page math, the
#  save and the 27 info texts in ONE place.
# =====================================================================================
[gcode_macro _TX_PATTERN]
description: Texture pattern picker for the LCD slots (R246) - page math + save + info in one place
variable_tx_names: ['Ridges', 'Waves', 'Grid', 'Hatch', 'Checker', 'Hex', 'Honeycomb', 'Basket', 'Rope', 'Planks', 'Bricks', 'Sandstone', 'Concrete', 'Clay', 'Crepe', 'Fabric', 'Plush', 'Hilbert', 'Scratch', 'Glitch', 'Knit', 'Fluted', 'Bark', 'Scales', 'Facets', 'Macrame', 'Map']
variable_tx_codes: ['RIDGES', 'WAVES', 'GRID', 'HATCH', 'CHECKER', 'HEX', 'HONEYCOMB', 'BASKET', 'ROPE', 'PLANKS', 'BRICKS', 'SANDSTONE', 'CONCRETE', 'CLAY', 'CREPE', 'FABRIC', 'PLUSH', 'HILBERT', 'SCRATCH', 'GLITCH', 'KNIT', 'FLUTED', 'BARK', 'SCALES', 'FACETS', 'MACRAME', 'MAP']
variable_tx_descs: ['Pattern Ridges: vertical flutes around the object - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Waves: diagonal waves around and up - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Grid: crosshatch egg-crate - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Hatch: hard diagonal hatching - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Checker: soft checkerboard - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Hex: organic 3-fold honeycomb-ish - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Honeycomb: true hex cells - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Basket: woven over/under - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Rope: twisted strands - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Planks: boards with staggered joints - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Bricks: running-bond courses - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Sandstone: fine grain noise - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Concrete: coarse noise + pores - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Clay: soft thumb dents - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Crepe: crumpled paper - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Fabric: pleats, sharp valleys - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Plush: dense velvet grain - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Hilbert: zig-zag space-filling bands - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Scratch: scratches around the wall - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Glitch: seeded per-band melt steps - seamless around + in Z (Size around / Z size below are GUIDELINES, the object geometry snaps them to whole repeats)', 'Pattern Knit: nested V-loops in staggered columns (knitted sleeve) - auto-tilt 3 deg breaks the layer lines', 'Pattern Fluted: vertical half-round flutes - runs UP the object, kills Z-banding on cylinders', 'Pattern Bark: vertical ridged cracks - turns tubes and cylinders into tree trunks', 'Pattern Scales: staggered domed shingles - reptile look, grippy', 'Pattern Facets: diamond low-poly relief crosses - modern, futuristically clean', 'Pattern Macrame: two twisted cord families crossing into a net - the knots read as knotted cords', 'Pattern Map: a picture wrapped around - background detected (Otsu) = NO displacement there, Tile = endless mirrored wrap, Once = one aspect-true wrap (position below)']
gcode:
    {% set p = printer['gcode_macro _TX_PATTERN'] %}
    {% set idx = printer['save_variables'].variables.texture_pat_page|default(0)|int * 8 + params.SLOT|default(0)|int %}
    {% if idx < p.tx_codes|length %}
        {% set code = p.tx_codes[idx] %}
        SAVE_VARIABLE VARIABLE=texture_pattern VALUE="\"{ code }\""
        RESPOND MSG="{ p.tx_descs[idx] }"
    {% else %}
        RESPOND MSG="Pattern slot empty - this page has fewer patterns"
    {% endif %}

[gcode_macro _IMG_PAGE]
description: Image list paging - shared by the Lithophane/ColorPicture/ArtisticStrings pickers (10 per page, up to 60 images)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set total = printer['gcode_macro _SDM'].litho_total|default(0)|int %}
    {% set maxp = ((total - 1) // 10) if total > 0 else 0 %}
    {% set delta = params.DELTA|default(0)|int %}
    {% set pg = [[sv.litho_page|default(0)|int + delta, 0]|max, maxp]|min %}
    SAVE_VARIABLE VARIABLE=litho_page VALUE={pg}
    RESPOND MSG="Images: page {pg + 1} of {maxp + 1} ({total} total) - the watcher refreshes the list in a moment"
    M117 Images: page {pg + 1}/{maxp + 1}

[gcode_macro STRINGART_PICK]
description: ArtisticStrings: pick the root image from the paged image list (the PHOTO pattern weaves it)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set files = printer['gcode_macro _SDM'].litho_files|default([]) %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% if idx < 0 or idx >= files|length %}
        NOTIFY TEXT="No image in this slot - page with the arrows or upload a .png/.jpg into the gcodes folder" LEVEL=warn SOUND=r2_notice
        M117 ArtisticStrings: empty slot
    {% else %}
        {% set fn = files[idx]|string %}
        # R232 (.136ac field wish): remember the image's aspect from the
        # header dims the watcher pushed - the W/H inputs stay locked to
        # it (change X, Y follows - and back). litho_dims is the visible
        # picker page, idx addresses the same slice as files.
        {% set dim = (printer['gcode_macro _SDM'].litho_dims|default([]))[idx]|default('')|string %}
        {% set dparts = dim.split('x') %}
        {% set ar = (dparts[0]|int) / (dparts[1]|int) if dparts|length == 2 and dparts[1]|int > 0 else 0.0 %}
        SAVE_VARIABLE VARIABLE=stringart_src_idx VALUE={idx}
        SAVE_VARIABLE VARIABLE=stringart_src VALUE="\"{fn}\""
        # R234 (.136ae field log): the whole VALUE must be ONE jinja
        # expression. The old line carried `if dim != '' else '""'` as
        # literal text AFTER the quotes - klipper rejected every photo
        # pick with 'Malformed command' and stringart_imgwh never saved.
        {% if dim != '' %}
            SAVE_VARIABLE VARIABLE=stringart_imgwh VALUE="\"{dim}\""
        {% else %}
            SAVE_VARIABLE VARIABLE=stringart_imgwh VALUE='""'
        {% endif %}
        SAVE_VARIABLE VARIABLE=stringart_ar VALUE={ar|round(4)}
        {% if ar > 0 and sv.stringart_shape|default(0)|int == 1 and sv.stringart_arl|default(1)|int == 1 %}
            {% set nw = sv.stringart_w|default(102)|float %}
            {% set nh = (nw / ar)|round(0)|int %}
            {% if nh < 60 %}{% set nh = 60 %}{% endif %}
            {% if nh > 400 %}{% set nh = 400 %}{% endif %}
            SAVE_VARIABLE VARIABLE=stringart_h VALUE={nh}
            RESPOND MSG="ArtisticStrings image: {fn} ({dim}px) - H follows the photo aspect now: {nw|round(0)|int}x{nh}mm (AR Lock row frees it). Generate in ArtisticStrings > Generate"
        {% else %}
            RESPOND MSG="ArtisticStrings image: {fn} - the PHOTO pattern weaves it (SPIRAL ignores it). Generate in ArtisticStrings > Generate"
        {% endif %}
        M117 Img: {fn|truncate(14, True)}
    {% endif %}

