        'litho': ['litho_height', 'litho_layer_h', 'litho_contrast', 'litho_levels', 'litho_colors', 'litho_colmode', 'litho_col_layers', 'litho_border', 'litho_corner', 'litho_brim', 'litho_ironing', 'litho_frame', 'litho_handle', 'litho_stamp', 'litho_stamp_base', 'litho_stamp_tol', 'litho_orient', 'litho_mirror_x', 'litho_mirror_y', 'litho_contour'],
        'label': ['label_mode', 'label_shape', 'label_l', 'label_h', 'label_size', 'label_font', 'label_lines', 'label_max_chars', 'label_spacing', 'label_layer_h', 'label_first_h', 'label_base_layers', 'label_border_walls', 'label_border_gap', 'label_corner', 'label_hole_d', 'label_hole_side', 'label_brim', 'label_ironing', 'label_mirror_x', 'label_mirror_y', 'label_handle', 'label_height', 'label_pos', 'label_gap', 'label_color2'],
        'plot': ['plot_mode', 'plot_colors', 'plot_spacing', 'plot_dot_gap', 'plot_speed', 'plot_size', 'plot_scale_x', 'plot_scale_y', 'plot_off_x', 'plot_off_y', 'plot_off_z', 'plot_extrude', 'plot_fil_z', 'plot_invert', 'plot_autocontrast'],
        'tie': ['tie_count', 'tie_length', 'tie_width', 'tie_layers', 'tie_variant'],
        'angle': ['angle_deg', 'angle_width', 'angle_leg_a', 'angle_leg_b', 'angle_holes', 'angle_hole_d', 'angle_countersink', 'angle_flat', 'angle_stiffener', 'angle_walls', 'angle_infill', 'angle_ironing', 'angle_layers', 'angle_layer_h', 'angle_count'],
        'seal': ['seal_id', 'seal_od', 'seal_height', 'seal_profile', 'seal_layer_h', 'seal_ironing'],
        'frame': ['frame_preset', 'frame_w', 'frame_h', 'frame_depth', 'frame_border', 'frame_corner', 'frame_walls', 'frame_shape', 'frame_closure', 'frame_hang', 'frame_stand', 'frame_ironing', 'frame_infill', 'frame_top_l', 'frame_bot_l', 'frame_front', 'frame_cable', 'frame_disc', 'frame_disc_t', 'frame_disc_side', 'frame_s_deep', 'frame_s_space', 'frame_s_angle', 'frame_s_amp', 'frame_s_size', 'frame_s_dir'],
        'bricks': ['brick_mode', 'brick_count', 'brick_colors', 'bricks_layer_h', 'brick_brim'],
        'brickkit': ['brickkit_mode', 'brickkit_index', 'brickkit_detail', 'brickkit_colors'],
        'figures': ['figures_mode', 'figures_count', 'figures_scale', 'figures_colors', 'figures_colormode', 'figures_brim'],
        'colorpic': ['colorpic_bands', 'colorpic_bandh', 'colorpic_width', 'colorpic_colors', 'colorpic_contrast', 'colorpic_swap', 'colorpic_ironing', 'colorpic_layer_h', 'colorpic_brim'],
        'stringart': ['stringart_pattern', 'stringart_diameter', 'stringart_anchors', 'stringart_lines'],
    } %}
    {% if gen not in gens %}
        NOTIFY TEXT="Preset engine: unknown generator '{gen}'" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set keys = gens[gen] %}
        # R214 (.136m, field wish): a READ-ONLY library of ready looks.
        # Names describe the APPEARANCE, not the pattern keyword (the
        # field rule: 'Rattan-Optik' says more than 'BASKET scale 6').
        # Every entry carries the FULL key set, so Load really fills the
        # settings (the old frame field log: a preset applied, the
        # dimensions did not move - old presets simply lacked keys).
        # Library entries list with the user presets, load like them,
        # refuse Delete, and a user save under a library name numbers
        # itself (never overwrites).
        # R214: the library lives as a VARIABLE of this macro (config
        # literal) - the LCD menu reads the same object, one truth
        {% set libg = {} %}
        {% if gen == 'texture' %}
            {% set _libv = printer['gcode_macro _GEN_PRESET'].texture_lib|default({}) %}
            {% if _libv is mapping %}{% set libg = _libv %}{% endif %}
        {% endif %}
        {% set all = {} %}
        {% for k, v in libg.items() %}{% set _ = all.update({k: v}) %}{% endfor %}
        # R232 FIELD FIX: a corrupt/legacy preset store (a plain string in
        # variables.cfg) used to kill the WHOLE engine silently - dict() on
        # a string raises, the macro died as a console-only error and
        # 'saving does not work'. Guard like the library, say it once.
        {% set _rawp = sv[gen ~ '_user_presets']|default({}) %}
        {% set usr = _rawp if _rawp is mapping else {} %}
        {% if _rawp is not mapping %}
            RESPOND MSG="[!] {gen} preset store was corrupt (wrong type saved) - starting fresh, your next save works"
        {% else %}
            # R232 FIELD HEAL: a pre-fix DELETE copied the whole library into
            # the user shelf (texture only - the one generator with a lib).
            # Identical library copies get stripped AND persisted on the
            # next touch; your own presets (even named like a look) survive.
            {% set ns5 = namespace(healed={}, n=0) %}
            {% for k, v in usr.items() %}
                {% if k in libg and libg[k] == v %}
                    {% set ns5.n = ns5.n + 1 %}
                {% else %}
                    {% set _ = ns5.healed.update({k: v}) %}
                {% endif %}
            {% endfor %}
            {% if ns5.n %}
                {% set usr = ns5.healed %}
                SAVE_VARIABLE VARIABLE={gen|lower}_user_presets VALUE="{ usr|string|replace(' ', '') }"
                RESPOND MSG="[OK] {gen} presets healed: {ns5.n} library copies left your shelf (an old delete copied them in)"
            {% endif %}
            {% for k, v in usr.items() %}{% set _ = all.update({k: v}) %}{% endfor %}
        {% endif %}
        {% if act == 'save' %}
            {% set base = params.NAME|default('preset')|string|replace(' ', '') %}
            # R213 (field wish): TEXTURE presets number themselves from the
            # start - grid01, grid02, wave01... (the old GRID, GRID_2 scheme
            # hid how many exist). Every other generator keeps the classic
            # scheme: the bare name first, then _2, _3... never overwrite.
            {% set ns = namespace(nm='') %}
            {% if gen|lower == 'texture' %}
                {% for i in range(1, 200) %}
                    {% if ns.nm == '' %}
                        {% set cand = base ~ '%02d' % i %}
                        {% if cand not in all %}{% set ns.nm = cand %}{% endif %}
                    {% endif %}
                {% endfor %}
                {% if ns.nm == '' %}{% set ns.nm = base ~ '199' %}{% endif %}
            {% else %}
                {% if base not in all %}
                    {% set ns.nm = base %}
                {% else %}
                    {% for i in range(2, 200) %}
                        {% if ns.nm == '' %}
                            {% set cand = base ~ '_' ~ i %}
                            {% if cand not in all %}{% set ns.nm = cand %}{% endif %}
                        {% endif %}
                    {% endfor %}
                    {% if ns.nm == '' %}{% set ns.nm = base ~ '_199' %}{% endif %}
                {% endif %}
            {% endif %}
            {% set ns2 = namespace(snap={}) %}
            {% for k in keys %}
                {% if k in sv %}{% set _ = ns2.snap.update({k: sv[k]}) %}{% endif %}
            {% endfor %}
            {% set _ = all.update({ns.nm: ns2.snap}) %}
            # R214: only YOUR presets persist - the library lives in the
            # macro code, never in variables (a save must not copy 44
            # looks into save_variables)
            {% set _ = usr.update({ns.nm: ns2.snap}) %}
            # R188 (.134 field report 'save does nothing'): Klipper parses
            # extended commands with POSIX shlex - a NAKED dict literal
            # loses every single quote, literal_eval fails and the save
            # dies as a console-only error. Wrapped in double quotes
            # the single quotes survive (same rule as _sv_line/_opt_compact)
            SAVE_VARIABLE VARIABLE={gen|lower}_user_presets VALUE="{ usr|string|replace(' ', '') }"
            RESPOND MSG="[OK] {gen} preset '{ns.nm}' SAVED ({ns2.snap|length} values) - Load / Delete in the generator's Presets menu"
            M117 Saved: {ns.nm}
            _UI_SOUND NAME=r2_confirm
        {% elif act == 'load' or act == 'delete' %}
            # R214: SRC picks the shelf - 'user' pages browse YOUR presets,
            # 'lib' pages browse the read-only library. Separate page
            # counters, so flipping one never moves the other.
            {% set src214 = params.SRC|default('user')|string|lower %}
            {% set ks = (libg|sort) if src214 == 'lib' else (usr|sort) %}
            {% set pg = (sv[gen ~ '_lib_page']|default(0)|int) if src214 == 'lib' else (sv[gen ~ '_preset_page']|default(0)|int) %}
            {% set nm = ks[pg * 8 + params.SLOT|default(0)|int]|default('') %}
            {% if nm == '' %}
                NOTIFY TEXT="{gen} preset slot is empty" LEVEL=warn SOUND=r2_notice
            {% elif act == 'load' %}
                {% set d = all[nm] %}
                {% for k in keys %}
                    {% if k in d %}
                        {% set v = d[k] %}
                        {% if v is string %}
                            SAVE_VARIABLE VARIABLE={k|lower} VALUE="'{v}'"
                        {% else %}
                            SAVE_VARIABLE VARIABLE={k|lower} VALUE={v}
                        {% endif %}
                        {% if loop.index % 4 == 0 %}_PACE{% endif %}
                    {% endif %}
                {% endfor %}
                # R214: the load SPEAKS what it loaded - the field rule
                # 'loading a preset must show me what it is' (frame log:
                # dimensions seemed unchanged). Headline keys first, then
                # the honest note about keys the preset does not carry
                # (older saves know fewer settings - kept as-is, named).
                {% set heads = {
                    'texture': ['texture_mode', 'texture_pattern', 'texture_scale', 'texture_zsize', 'texture_amp', 'texture_dir'],
                    'frame': ['frame_w', 'frame_h', 'frame_front', 'frame_walls', 'frame_border', 'frame_shape'],
                    'label': ['label_l', 'label_h', 'label_font', 'label_base_layers', 'label_shape', 'label_mode'],
                    'litho': ['litho_height', 'litho_orient', 'litho_border', 'litho_frame', 'litho_ironing'],
                    'plot': ['plot_mode', 'plot_size', 'plot_spacing', 'plot_colors'],
                    'tie': ['tie_count', 'tie_length', 'tie_width', 'tie_variant'],
                    'angle': ['angle_deg', 'angle_leg_a', 'angle_leg_b', 'angle_walls'],
                    'seal': ['seal_id', 'seal_od', 'seal_height', 'seal_profile'],
                    'bricks': ['brick_mode', 'brick_count', 'brick_colors'],
                    'brickkit': ['brickkit_mode', 'brickkit_index', 'brickkit_detail'],
                    'figures': ['figures_mode', 'figures_count', 'figures_scale'],
                    'colorpic': ['colorpic_bands', 'colorpic_width', 'colorpic_colors'],
                    'stringart': ['stringart_pattern', 'stringart_diameter', 'stringart_lines'],
                } %}
                {% set hk = heads[gen] if gen in heads else keys[:5] %}
                {% set ns4 = namespace(parts=[]) %}
                {% for k in hk %}
                    {% if k in d %}
                        {% set ns4.parts = ns4.parts + [k|replace(gen|lower ~ '_', '') ~ '=' ~ d[k]] %}
                    {% endif %}
                {% endfor %}
                {% set miss = keys|reject('in', d)|list|length %}
                {% set src214 = 'library' if nm in libg else 'user' %}
                {% set note214 = (' - NOTE: ' ~ miss ~ ' setting(s) not in this preset (older save - kept as-is)') if miss else '' %}
                RESPOND MSG="[OK] {gen} preset '{nm}' ({src214}) loaded: {ns4.parts|join(', ')} - review the settings, then Generate{note214}"
                M117 Loaded: {nm}
                _UI_SOUND NAME=r2_confirm
            {% elif nm in libg %}
                NOTIFY TEXT="{gen} preset '{nm}' is a LIBRARY look - read-only (save your own under a different name)" LEVEL=warn SOUND=r2_notice
            {% else %}
                # R232 FIELD FIX: rebuild from the USER shelf only. The old
                # loop iterated 'all' (library + user) - deleting ANY texture
                # preset copied all 44 library looks into texture_user_presets:
                # the shelf never shrank, saves numbered against the junk and
                # 'presets stopped working'. The library stays in the macro
                # code, a delete never touches it (same rule as save).
                {% set ns3 = namespace(neu={}) %}
                {% for k, v in usr|dictsort %}
                    {% if k != nm %}{% set _ = ns3.neu.update({k: v}) %}{% endif %}
                {% endfor %}
                SAVE_VARIABLE VARIABLE={gen|lower}_user_presets VALUE="{ ns3.neu|string|replace(' ', '') }"
                RESPOND MSG="{gen} preset '{nm}' deleted - the other presets are untouched"
                M117 Deleted: {nm}
                _UI_SOUND NAME=r2_click
            {% endif %}
        {% elif act == 'page' %}
            {% set src214 = params.SRC|default('user')|string|lower %}
            {% set src214 = 'lib' if src214 == 'lib' and libg else 'user' %}
            {% set cnt214 = (libg|length) if src214 == 'lib' else (usr|length if usr is mapping else 0) %}
            {% set var214 = (gen|lower ~ '_lib_page') if src214 == 'lib' else (gen|lower ~ '_preset_page') %}
            {% set pg = sv[var214]|default(0)|int + params.DELTA|default(1)|int %}
            {% set maxp = ((cnt214 - 1) // 8) if cnt214 else 0 %}
            {% set pg = [[pg, 0]|max, maxp]|min %}
            SAVE_VARIABLE VARIABLE={var214|lower} VALUE={pg}
            RESPOND MSG="{gen} presets ({src214}): page {pg + 1} of {maxp + 1} ({cnt214} entries)"
        {% elif act == 'info' %}
            RESPOND MSG="Info: {gen} presets: {usr|length if usr is mapping else 0} your own + {libg|length} library looks = {all|length} total - names: {all|sort|join(', ') if all|length else '- none yet -'} (Save / Load / Delete in the generator's Presets menu - library entries refuse Delete)"
        {% else %}
            NOTIFY TEXT="Preset engine: ACTION=save|load|delete|page|info" LEVEL=warn
        {% endif %}
    {% endif %}


# =====================================================================================
#  R223 (.136u) - the generator queue escape hatch.
#  Field log .136s: a wedged photo build held the single worker forever -
#  'already running or queued' refused every retry, gen_busy=1 showed
#  'Wait: generating' on every print start and nothing could end it from
#  the LCD. The watcher now runs every build in its own thread (stuck =
#  dropped + reported after 20 min) and THIS macro is the manual way
#  out: it bumps gen_clear_nonce, the watcher drops the whole queue,
#  frees the keys and pulls gen_busy down. Settings are untouched -
#  only the pending job is lost.
#  LCD: System > Gen jobs > Clear queue (double press).
#  Console/Mainsail: _GEN_QUEUE_CLEAR CONFIRM=1
# =====================================================================================
[gcode_macro _GEN_QUEUE_CLEAR]
description: Drop queued/stuck generator jobs (press twice / CONFIRM=1)
gcode:
    {% if params.CONFIRM|default(0)|int == 1 %}
        {% set sv = printer['save_variables'].variables %}
        SAVE_VARIABLE VARIABLE=gen_clear_nonce VALUE={sv.gen_clear_nonce|default(0)|int + 1}
        M117 Gen queue: clearing
    {% else %}
        RESPOND MSG="[Gen] Press CLEAR again to drop every QUEUED generator job. R224: a running or stuck build keeps Wait:generating until it ends (a Pi restart ends it instantly) - your settings stay"
        M117 Gen: clear?
        _UI_SOUND NAME=r2_click
    {% endif %}

# =====================================================================================
#  R238 (.136ai field wish): the queue KILL channel. The old menu could only
#  clear the WAITING list - the RUNNING job always ran to its end. Now:
#  SKIP ends the running job (the next one starts), STOP ends it AND clears
#  the queue. The watcher raises the cancel inside the generator hot loops
#  (_job_tick - a safe point), the partial output file is deleted. A job
#  parked in the busy/RAM wait is dropped without ever starting.
#  LCD: main menu > Gen queue > Skip job / Stop: job + queue (double press).
#  Console/Mainsail: _GEN_QUEUE_SKIP / _GEN_QUEUE_STOP CONFIRM=1
# =====================================================================================
[gcode_macro _GEN_QUEUE_SKIP]
description: Cancel the RUNNING generator job - the next one starts (R238)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if sv.gen_busy|default(0)|int %}
        SAVE_VARIABLE VARIABLE=genq_kill_mode VALUE="\"SKIP\""
        SAVE_VARIABLE VARIABLE=genq_kill_nonce VALUE={sv.genq_kill_nonce|default(0)|int + 1}
        RESPOND MSG="[Gen] Skipping the running job - it stops at the next safe point, the partial output is deleted, the next job starts"
        M117 Skipping job
    {% else %}
        RESPOND MSG="[Gen] Nothing is building right now - Skip needs a RUNNING job (Clear queue drops the waiting ones)"
        M117 Nothing running
        _UI_SOUND NAME=r2_click
    {% endif %}

[gcode_macro _GEN_QUEUE_STOP]
description: Cancel the running job AND clear the whole queue (R238, press twice / CONFIRM=1)
gcode:
    {% if params.CONFIRM|default(0)|int == 1 %}
        {% set sv = printer['save_variables'].variables %}
        SAVE_VARIABLE VARIABLE=genq_kill_mode VALUE="\"STOP\""
        SAVE_VARIABLE VARIABLE=genq_kill_nonce VALUE={sv.genq_kill_nonce|default(0)|int + 1}
        RESPOND MSG="[Gen] Stopping the running job AND clearing the queue - the partial output is deleted"
        M117 Gen: stopping
    {% else %}
        # R240: arm the 2-press confirm (the row passes CONFIRM=1 - the first
        # press lands HERE, the second executes. The .136ai row called the
        # macro without CONFIRM: double-click never worked from the LCD).
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='"qstop"'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=10
        RESPOND MSG="[Gen] Press STOP again to end the RUNNING job AND clear every waiting one (Skip ends only the running job)"
        M117 Gen: stop?
        _UI_SOUND NAME=r2_click
    {% endif %}
