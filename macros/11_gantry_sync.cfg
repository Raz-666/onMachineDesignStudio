# =====================================================================================
#  11_gantry_sync.cfg - Dual-Z synchronization ("straighten the gantry")
#  -----------------------------------------------------------------------------------
#  YOUR SETUP: both Z motors are wired in PARALLEL to one driver. Electrically they
#  are always in sync - but if one side mechanically binds (crash, debris, seized
#  linear rail) ONLY that side loses steps and the gantry sits crooked. The classic
#  fix for that:
#
#   1. make sure positions are known (full G28 only when an axis is unhomed -
#      Z probing needs X/Y positioned first via [safe_z_home]!)
#   2. drive Z almost to the top (at normal precision)
#   3. REDUCE the Z driver current (SET_TMC_CURRENT)
#   4. lie to Klipper (SET_KINEMATIC_POSITION) and command 10mm further up than
#      physically possible -> both motors push against the top stop; whichever side
#      reaches it first gently loses steps (skipping at low current) until the second
#      side also rests at the top => both sides level again
#   5. drive down a bit, restore current, re-home Z (probe)
#
#  IMPORTANT (please read once):
#   - STAY AND WATCH the first time! Emergency = power switch. This procedure is
#     well established, but your gantry is your gantry.
#   - requires a clean mechanical top stop that BOTH sides hit at the same height.
# =====================================================================================
[gcode_macro SYNC_GANTRY]
description: Sync dual-Z by gently bumping the top stop (low current)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set quiet = params.QUIET|default(0)|int == 1 %}
    # R106 (user request): this bump method is for motors wired to ONE driver
    # (a single Klipper stepper_z). With SEPARATE Z steppers (stepper_z1...) the
    # right tool is Z_TILT_ADJUST - refuse there instead of mangling one side.
    {% if 'stepper_z1' in printer.configfile.settings %}
        NOTIFY TEXT="SYNC_GANTRY is for ONE Z driver (parallel-wired motors) - this printer has separate Z steppers: use Z_TILT (Maintenance > Z Tilt or the console)" LEVEL=warn SOUND=r2_notice
    {% elif s.mode not in ['idle','finished','starting'] and params.FORCE|default(0)|int != 1 %}
        NOTIFY TEXT="Gantry sync only when idle (mode {s.mode})" LEVEL=warn SOUND=r2_notice
    {% else %}
        # SET_KINEMATIC_POSITION comes from [force_move] AND is only registered when
        # 'enable_force_move: True' is set there (verified in Klipper source)! Without
        # it the bump would silently do NOTHING (the up-move becomes a zero move).
        # force_move has no get_status() -> reliable check = configfile.settings:
        {% set fmsec = printer.configfile.settings['force_move']|default({}) %}
        {% if fmsec.enable_force_move|default(False)|string|lower not in ['true','1'] %}
            NOTIFY TEXT="SYNC_GANTRY needs [force_move] with 'enable_force_move: True' in printer.cfg - nothing was moved (without it the bump would be a silent NO-OP!)" LEVEL=error SOUND=r2_error
        {% else %}
        {% set zmax = printer.toolhead.axis_maximum.z %}
        # restore run_current from printer.cfg. We NEVER pass HOLDCURRENT: without
        # that parameter Klipper keeps the hold state EXACTLY as configured there
        # (commented out = hold follows run = effectively disabled). Reading the
        # hold value from configfile.settings is UNRELIABLE (default-read artifacts).
        # compat (R106, 'any Klipper printer' audit): non-TMC drivers have no
        # run_current and SET_TMC_CURRENT would fail - refuse clearly instead
        {% if 'tmc2209 stepper_z' not in printer.configfile.settings %}
            NOTIFY TEXT="SYNC_GANTRY needs a TMC driver on Z (SET_TMC_CURRENT) - this printer has none: level Z mechanically instead" LEVEL=error SOUND=r2_error
        {% else %}
        {% set old_current = printer.configfile.settings['tmc2209 stepper_z'].run_current|float %}
        {% set sync_current = sv.gantry_sync_current|default(0.35)|float %}
        {% if not quiet %}
            NOTIFY TEXT="Gantry sync: bumping top stop (current {sync_current}A)" LEVEL=info LED=homing SOUND=r2_leveling
        {% endif %}
        # ---- 1) positions must be known ------------------------------------------------------
        # Z probing moves the head to the [safe_z_home] XY spot first -> X and Y must
        # be homed as well ("Must home X and Y axes first"). So: full G28 whenever
        # ANY axis is unhomed; nothing at all when everything is already homed.
        # Manual homing before SYNC_GANTRY is never needed.
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
            RESPOND MSG="Gantry sync: homing first (some axes are not homed yet)"
            G28
        {% endif %}
        # ---- 2) drive up at full precision ------------------------------------------------
        G1 Z{zmax - 5} F300
        G4 P300
        # ---- 3) reduce driver current (skipping becomes harmless) ---------------------------
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={sync_current}
        # ---- 4) lie about the position: "we are 10mm lower" -> then command 10mm up ----------
        SET_KINEMATIC_POSITION Z={zmax - 15}
        G1 Z{zmax - 5} F120            # both sides push up, the early one skips
        G4 P500
        # ---- 5) relieve, restore current, re-home ---------------------------------------------
        G1 Z{zmax - 15} F300
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={old_current}
        RESPOND MSG="Z driver restored to printer.cfg: run {old_current}A, hold untouched (as configured)"
        G28 Z
        {% if not quiet %}
            NOTIFY TEXT="Gantry synced & re-homed" LEVEL=ok SOUND=r2_leveled
        {% else %}
            RESPOND MSG="Gantry sync done"
        {% endif %}
        {% endif %}
        {% endif %}
    {% endif %}

# =====================================================================================
#  R106 (user request): Z_TILT - the multi-stepper counterpart of SYNC_GANTRY.
#  From 2 SEPARATE Z steppers (stepper_z1/z2/z3 on their own drivers) the bump
#  method is wrong - Klipper's [z_tilt] probes the configured points and levels
#  each stepper individually. This macro wraps Z_TILT_ADJUST with the R2 guard
#  discipline (idle check, homing, notifications) and the two retry parameters
#  (RETRIES + RETRY_TOLERANCE are native Z_TILT_ADJUST options): the gantry is
#  re-probed up to RETRIES times until the spread stays under RETRY_TOLERANCE.
#  Settings: LCD Maintenance > Z Tilt (or SAVE_VARIABLE zt_retries / zt_tolerance).
# =====================================================================================
[gcode_macro Z_TILT]
description: Level 2+ Z steppers via Z_TILT_ADJUST: Z_TILT RETRIES=2 RETRY_TOLERANCE=0.05 QUIET=1
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set quiet = params.QUIET|default(0)|int == 1 %}
    {% if 'stepper_z1' not in printer.configfile.settings %}
        NOTIFY TEXT="Z_TILT needs 2+ separate Z steppers - this printer has ONE (or parallel-wired motors on one driver): use SYNC_GANTRY instead" LEVEL=warn SOUND=r2_notice
    {% elif 'z_tilt' not in printer.configfile.settings %}
        NOTIFY TEXT="Z_TILT needs a [z_tilt] section in printer.cfg: z_positions = one X,Y pair per Z stepper, e.g. z_positions: 45,45 / 225,45 - nothing was moved" LEVEL=error SOUND=r2_error
    {% elif s.mode not in ['idle','finished','starting'] and params.FORCE|default(0)|int != 1 %}
        NOTIFY TEXT="Z tilt only when idle (mode {s.mode})" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set retries = [[params.RETRIES|default(sv.zt_retries|default(2))|int, 0]|max, 5]|min %}
        {% set tol = [[params.RETRY_TOLERANCE|default(sv.zt_tolerance|default(0.05))|float, 0.005]|max, 0.2]|min %}
        {% if not quiet %}
            NOTIFY TEXT="Z tilt: probing the [z_tilt] points (retries {retries}, tolerance {tol}mm)" LEVEL=info LED=leveling SOUND=r2_leveling
        {% endif %}
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
            RESPOND MSG="Z tilt: homing first (some axes are not homed yet)"
            G28
        {% endif %}
        _LED_QUIET ON=1
        Z_TILT_ADJUST RETRIES={retries} RETRY_TOLERANCE={tol}
        _LED_QUIET ON=0
        {% if not quiet %}
            NOTIFY TEXT="Z tilt done - gantry level" LEVEL=ok SOUND=r2_leveled
        {% else %}
            RESPOND MSG="Z tilt done"
        {% endif %}
    {% endif %}

[gcode_macro Z_TILT_INFO]
description: List the [z_tilt] probe points + the retry settings (console)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if 'stepper_z1' not in printer.configfile.settings %}
        RESPOND MSG="Z tilt: this printer has ONE Z stepper (or parallel-wired motors) - SYNC_GANTRY is the right tool here"
    {% elif 'z_tilt' not in printer.configfile.settings %}
        RESPOND MSG="Z tilt: NO [z_tilt] section in printer.cfg - add z_positions (one X,Y per Z stepper) to use Z_TILT"
    {% else %}
        {% set zt = printer.configfile.settings['z_tilt'] %}
        {% set pts = zt.z_positions|default([]) %}
        RESPOND MSG="Z tilt: {pts|length} probe point(s) configured:"
        {% for p in pts %}
            RESPOND MSG="  point {loop.index}: X{p[0]|float|round(1)} Y{p[1]|float|round(1)}"
        {% endfor %}
        RESPOND MSG="horizontal move Z: {zt.horizontal_move_z|default(5)|float|round(1)}mm | retries {sv.zt_retries|default(2)|int} | tolerance {sv.zt_tolerance|default(0.05)}mm (Maintenance > Z Tilt)"
        RESPOND MSG="run: Z_TILT (or Maintenance > Z Tilt > Run now) - home + probe + level each Z stepper"
    {% endif %}

# ---- switches: automatically after boot / before every print --------------------------
[gcode_macro TOGGLE_GANTRY_SYNC_BOOT]
description: Gantry sync after Klipper boot ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.gantry_sync_boot|default(False) %}
    SAVE_VARIABLE VARIABLE=gantry_sync_boot VALUE={on}
    NOTIFY TEXT="Gantry sync after boot: {'ON' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

[gcode_macro TOGGLE_GANTRY_SYNC_PRINT]
description: Gantry sync before every print ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.gantry_sync_print|default(False) %}
    SAVE_VARIABLE VARIABLE=gantry_sync_print VALUE={on}
    NOTIFY TEXT="Gantry sync before print: {'ON (adds ~1min)' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

[gcode_macro TOGGLE_Z_TILT_BOOT]
description: Z tilt after Klipper boot ON/OFF (2+ Z steppers)
gcode:
    {% set on = not printer['save_variables'].variables.zt_boot|default(False) %}
    SAVE_VARIABLE VARIABLE=zt_boot VALUE={on}
    NOTIFY TEXT="Z tilt after boot: {'ON' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

[gcode_macro TOGGLE_Z_TILT_PRINT]
description: Z tilt before every print ON/OFF (2+ Z steppers)
gcode:
    {% set on = not printer['save_variables'].variables.zt_print|default(False) %}
    SAVE_VARIABLE VARIABLE=zt_print VALUE={on}
    NOTIFY TEXT="Z tilt before print: {'ON (adds ~1min)' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

