# =====================================================================================
#  11_gantry_sync.cfg - Dual-Z synchronization ("straighten the gantry")
#  -----------------------------------------------------------------------------------
#  YOUR SETUP: both Z motors are wired in PARALLEL to one driver. Electrically they
#  are always in sync - but if one side mechanically binds (crash, debris, seized
#  linear rail) ONLY that side loses steps and the gantry sits crooked. The classic
#  fix for that:
#
#   1. make sure positions are known (full G28 only when an axis is unhomed -
#      Z probing needs X/Y positioned first via [safe_z_home]!)
#   2. drive Z almost to the top (at normal precision)
#   3. REDUCE the Z driver current (SET_TMC_CURRENT)
#   4. lie to Klipper (SET_KINEMATIC_POSITION) and command 10mm further up than
#      physically possible -> both motors push against the top stop; whichever side
#      reaches it first gently loses steps (skipping at low current) until the second
#      side also rests at the top => both sides level again
#   5. drive down a bit, restore current, re-home Z (probe)
#
#  IMPORTANT (please read once):
#   - STAY AND WATCH the first time! Emergency = power switch. This procedure is
#     well established, but your gantry is your gantry.
#   - requires a clean mechanical top stop that BOTH sides hit at the same height.
# =====================================================================================
[gcode_macro SYNC_GANTRY]
description: Sync dual-Z by gently bumping the top stop (low current)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set quiet = params.QUIET|default(0)|int == 1 %}
    {% if s.mode in ['idle','finished','starting'] or params.FORCE|default(0)|int == 1 %}
        # SET_KINEMATIC_POSITION comes from [force_move] AND is only registered when
        # 'enable_force_move: True' is set there (verified in Klipper source)! Without
        # it the bump would silently do NOTHING (the up-move becomes a zero move).
        # force_move has no get_status() -> reliable check = configfile.settings:
        {% set fmsec = printer.configfile.settings['force_move']|default({}) %}
        {% if fmsec.enable_force_move|default(False)|string|lower not in ['true','1'] %}
            NOTIFY TEXT="SYNC_GANTRY needs [force_move] with 'enable_force_move: True' in printer.cfg - nothing was moved (without it the bump would be a silent NO-OP!)" LEVEL=error SOUND=r2_error
        {% else %}
        {% set zmax = printer.toolhead.axis_maximum.z %}
        # restore run_current from printer.cfg. We NEVER pass HOLDCURRENT: without
        # that parameter Klipper keeps the hold state EXACTLY as configured there
        # (commented out = hold follows run = effectively disabled). Reading the
        # hold value from configfile.settings is UNRELIABLE (default-read artifacts).
        {% set old_current = printer.configfile.settings['tmc2209 stepper_z'].run_current|float %}
        {% set sync_current = sv.gantry_sync_current|default(0.35)|float %}
        {% if not quiet %}
            NOTIFY TEXT="Gantry sync: bumping top stop (current {sync_current}A)" LEVEL=info LED=homing SOUND=r2_leveling
        {% endif %}
        # ---- 1) positions must be known ------------------------------------------------------
        # Z probing moves the head to the [safe_z_home] XY spot first -> X and Y must
        # be homed as well ("Must home X and Y axes first"). So: full G28 whenever
        # ANY axis is unhomed; nothing at all when everything is already homed.
        # Manual homing before SYNC_GANTRY is never needed.
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
            RESPOND MSG="Gantry sync: homing first (some axes are not homed yet)"
            G28
        {% endif %}
        # ---- 2) drive up at full precision ------------------------------------------------
        G1 Z{zmax - 5} F300
        G4 P300
        # ---- 3) reduce driver current (skipping becomes harmless) ---------------------------
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={sync_current}
        # ---- 4) lie about the position: "we are 10mm lower" -> then command 10mm up ----------
        SET_KINEMATIC_POSITION Z={zmax - 15}
        G1 Z{zmax - 5} F120            # both sides push up, the early one skips
        G4 P500
        # ---- 5) relieve, restore current, re-home ---------------------------------------------
        G1 Z{zmax - 15} F300
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={old_current}
        RESPOND MSG="Z driver restored to printer.cfg: run {old_current}A, hold untouched (as configured)"
        G28 Z
        {% if not quiet %}
            NOTIFY TEXT="Gantry synced & re-homed" LEVEL=ok SOUND=r2_leveled
        {% else %}
            RESPOND MSG="Gantry sync done"
        {% endif %}
        {% endif %}
    {% else %}
        NOTIFY TEXT="Gantry sync only when idle (mode {s.mode})" LEVEL=warn SOUND=r2_notice
    {% endif %}

# ---- switches: automatically after boot / before every print --------------------------
[gcode_macro TOGGLE_GANTRY_SYNC_BOOT]
description: Gantry sync after Klipper boot ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.gantry_sync_boot|default(False) %}
    SAVE_VARIABLE VARIABLE=gantry_sync_boot VALUE={on}
    NOTIFY TEXT="Gantry sync after boot: {'ON' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

[gcode_macro TOGGLE_GANTRY_SYNC_PRINT]
description: Gantry sync before every print ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.gantry_sync_print|default(False) %}
    SAVE_VARIABLE VARIABLE=gantry_sync_print VALUE={on}
    NOTIFY TEXT="Gantry sync before print: {'ON (adds ~1min)' if on else 'OFF'}" LEVEL=ok SOUND=r2_confirm

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V11_GANTRY]
description: Version sentinel of 11_gantry_sync.cfg (internal)
gcode:
