# =====================================================================================
#  08_print_start_stop.cfg - PRINT_START / PRINT_END (the heart of the system)
#  -----------------------------------------------------------------------------------
#  PRINT_START is called as the FIRST line of the slicer start gcode (see slicer/):
#  PRINT_START MATERIAL=.. BED=.. BED_AFTER=.. HOTEND_FIRST=.. HOTEND_AFTER=..
#                LAYER_HEIGHT=.. OUTER_WALL_SPEED=.. SUPPORT_SPEED=.. IRONING_SPEED=..
#                TOTAL_LAYERS=..
#  All parameters optional - missing ones fall back to the material preset or file.
#
#  Sequence: [confirmation dialog] -> home -> optional gantry sync -> heat bed ->
#            bed mesh decision -> PID decision -> heat hotend -> PA/retract/accel/flow
#            -> adaptive prime line -> happy R2 -> print.
# =====================================================================================
[gcode_macro PRINT_START]
description: Print start: stores file values, asks for changes, meshes & heats
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    # ---- guard: no double start ------------------------------------------------------
    # R47: a STALE mode (left over from an interrupted dialog / crashed start, with
    # no print actually running) is HEALED instead of refusing forever - that
    # refusal cascade was the "everything broken after a legacy dialog" field bug.
    {% set stale = s.mode in ['printing','starting','waiting'] and printer.print_stats.state not in ['printing','paused'] %}
    {% set pending = s.start_pending != '' and printer.print_stats.state in ['printing','paused'] %}
    {% if s.mode in ['printing','starting','waiting'] and not stale and not pending %}
        NOTIFY TEXT="PRINT_START already running (mode {s.mode})" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% if stale %}
            RESPOND MSG="[i] Healing stale mode '{s.mode}' (no print active) - starting fresh"
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        {% endif %}
        # ---- store file values from slicer parameters -----------------------------------
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_material VALUE='"{params.MATERIAL|default('PLA')|string|upper}"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={params.BED|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed_after VALUE={params.BED_AFTER|default(params.BED|default(0))|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={params.HOTEND_FIRST|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_after VALUE={params.HOTEND_AFTER|default(params.HOTEND_FIRST|default(0))|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_layer_height VALUE={params.LAYER_HEIGHT|default(0.2)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_outer_wall_speed VALUE={params.OUTER_WALL_SPEED|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_support_speed VALUE={params.SUPPORT_SPEED|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_ironing_speed VALUE={params.IRONING_SPEED|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"marked"'
        RESPOND MSG="[i] File type: MARKED (R2 post-processing found in this file)"
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE={params.TOTAL_LAYERS|default(0)|int}
        # ---- reset live values to neutral (100% / off) ------------------------------------
        _LIVE_RESET
        # R167: armed pre-print retraction overrides apply at the START now -
        # generated files retract via G10/G11 and never send a SET_RETRACTION
        # the interceptor could redirect (the override used to do nothing)
        _APPLY_OV_RETRACT
        _SYNC_OV_ACCEL
        M107                          # part fan off
        CLEAR_PAUSE                   # defuse stale pause states
        {% if pending %}
            # ---------------- R50: decision already made at the universal intercept --------
            #      execute it NOW with this file's own parameters (they only exist
            #      here) - no second dialog, no second pause.
            {% set ap = 0 if s.start_pending == 'as_sliced' else 1 %}
            {% set lg = 1 if s.start_pending == 'as_legacy' else 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
            RESPOND MSG="[i] Start decision already made: _RUN_PRINT_START APPLY={ap} LEGACY={lg}"
            _RUN_PRINT_START APPLY={ap} LEGACY={lg}
        {% elif sv.start_confirm|default(True) %}
            # ---------------- DIALOG: pause and wait for the decision -----------------------
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"waiting"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=True
            PAUSE_BASE                 # pauses the gcode file processing
            SET_LED_STATE STATE=waiting
            _SOUND_LIB NAME=r2_question
            M117 Change or print?
            RESPOND MSG="=== BEFORE PRINT: {printer.print_stats.filename|default('print')} ==="
            RESPOND MSG="File: material {params.MATERIAL|default('?')} | bed {params.BED|default('?')}C | hotend {params.HOTEND_FIRST|default('?')}/{params.HOTEND_AFTER|default('?')}C"
            RESPOND MSG=">>> LCD: menu 'Start Print?'  |  Mainsail: PRINT_AS_SLICED / PRINT_WITH_OVERRIDES / CANCEL_PENDING_PRINT"
            RESPOND MSG=">>> Change settings first: LCD menu 'Pre-Print' or SET_MATERIAL / SET_OVERRIDE_VALUE macros"
            UPDATE_DELAYED_GCODE ID=_START_CONFIRM_WAITER DURATION=2
        {% else %}
            # ---------------- no dialog: go immediately --------------------------------------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
            _RUN_PRINT_START APPLY=0
        {% endif %}
    {% endif %}

# =====================================================================================
#  _RUN_PRINT_START - the actual start sequence (internal)
#  APPLY=1 -> apply pre-print overrides/material selection
#  APPLY=0 -> file 1:1 (overrides bypassed)
# =====================================================================================
[gcode_macro _RUN_PRINT_START]
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set apply = params.APPLY|default(0)|int == 1 %}
    {% set leg = params.LEGACY|default(0)|int == 1 %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"starting"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_stuck VALUE=0
    # keep the override bypass consistent even if called directly:
    # APPLY=0 ('as sliced') -> run the file 1:1, APPLY=1 -> overrides active
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE={not apply}
    # R79: feature overrides for types THIS file does not contain are parked for
    # this print (field log .62: enabled features that can never apply confuse
    # - the LCD shows them as SKIP). Stored per print, your switches stay as
    # they are for the next file that really has those features.
    # R80 FIELD FIX (.63 log): (a) the TYPES names carry dashes (WALL-OUTER) -
    # comparing dash-free codes against them parked features that WERE in the
    # file ('enabled but no effect'); (b) the list must go out WITHOUT spaces -
    # Klipper splits commands on whitespace, VALUE=['A', 'B'] was 'Malformed
    # command' and killed EVERY print start right after the decision.
    {% set ft79 = s.file_types|default('')|string|replace('-','')|upper %}
    {% set absent79 = [] %}
    {% if ft79 != '' %}
        {% for c79 in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom'] %}
            {% if sv['ovf_' ~ c79 ~ '_on']|default(False) and c79|upper not in ft79 %}
                {% if absent79.append(c79|upper) %}{% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if absent79 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=absent_features VALUE="['{absent79|join("','")}']"
        RESPOND MSG="[i] Not in this file (overrides parked for this print): { absent79|join(', ')|lower }"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=absent_features VALUE=[]
    {% endif %}
    # R84: Marlin-VOLUMETRIC files count E in mm3 - Klipper expects mm and
    # would print them heavily under-extruded. Loud warning, the user decides.
    {% if printer['gcode_macro _STATE'].file_volumetric|default(False) %}
        NOTIFY TEXT="VOLUMETRIC Marlin file: Klipper counts E in mm, not mm3 - this print under-extrudes! Re-slice for Klipper or convert the file" LEVEL=warn SOUND=r2_alarm
        M117 VOLUMETRIC file!
        RESPOND MSG="[!] This file was sliced Marlin-volumetric (E in mm3) - Klipper interprets E in mm."
        RESPOND MSG="    Expect heavy under-extrusion. Re-slice it for Klipper (or divide every E value by 2.405)."
    {% endif %}
    # R56 FIX (field log .39): 'AS LEGACY' on a MARKED file keeps its LAYER_MARK
    # markers ALIVE - they are the most precise layer signal and switch fan +
    # speed + L2 temps at the SAME instant. The .38 merge let every takeover run
    # with legacy_mode=True -> markers dead -> the 8s Z-tracker counted layers ->
    # fan (file's own M106, instant) and speed release (watcher tick, seconds
    # late) fell apart. legacy_mode now ONLY for files without markers; the flag
    # is set FRESH at every start so it can never leak into the next print.
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_mode VALUE={leg and s.file_type != 'marked'}

    # ---------- 1) effective material ---------------------------------------------------
    # 'with_overrides': your selected material | 'as sliced': material from the file
    {% set mat = (sv.material|default('PLA')|string|upper) %}
    {% if not apply and s.file_material != '' and s.file_material in db %}
        {% set mat = s.file_material %}
    {% endif %}
    {% if mat not in db %}{% set mat = 'PLA' %}{% endif %}
    {% set w = db[mat] %}
    RESPOND MSG="Material: {mat}"

    # ---------- 2) target temps: override > file > material preset -----------------------
    # priority: LCD override (ON) > file value > material preset
    # preset: bed1/hot1 = LAYER 1, bed2/hot2 = from LAYER 2
    {% set bed    = sv.ov_bed|default(0)|float         if (apply and sv.ov_bed_on|default(False))         else (s.file_bed|float if s.file_bed > 0 else w.bed1) %}
    {% set bed_af = sv.ov_bed_after|default(0)|float   if (apply and sv.ov_bed_after_on|default(False))   else (s.file_bed_after|float if s.file_bed_after > 0 else w.bed2) %}
    {% set h1     = sv.ov_hotend_first|default(0)|float if (apply and sv.ov_hotend_first_on|default(False)) else (s.file_hotend_first|float if s.file_hotend_first > 0 else w.hot1) %}
    {% set hsp    = sv.ov_hotend_after|default(0)|float if (apply and sv.ov_hotend_after_on|default(False)) else (s.file_hotend_after|float if s.file_hotend_after > 0 else w.hot2) %}
    # write effective values back (used by menus/messages)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed_after VALUE={bed_af}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={h1}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_after VALUE={hsp}
    NOTIFY TEXT="Starting {mat}: bed {bed|round|int}C hotend {h1|round|int}->{hsp|round|int}C" LEVEL=info SOUND=r2_start

    # ---------- 3) homing -----------------------------------------------------------------
    SET_LED_STATE STATE=homing
    _SOUND_LIB NAME=r2_notice
    M117 Homing...
    # with sync enabled: sync FIRST (it homes Z itself, ends Z-homed, needs no full
    # homing) -> then only X/Y must be homed (no double Z homing). Else: full G28.
    {% if sv.gantry_sync_print|default(False) and 'stepper_z1' not in printer.configfile.settings %}
        SYNC_GANTRY QUIET=1
        G28 X Y
    {% elif sv.zt_print|default(False) and 'stepper_z1' in printer.configfile.settings
              and 'z_tilt' in printer.configfile.settings %}
        Z_TILT QUIET=1
    {% else %}
        G28
    {% endif %}
    NOTIFY TEXT="Homing done" LEVEL=ok

    # ---------- 3b) park HIGH + aside during heating ---------------------------------------
    # The nozzle must NOT sit on the bed during the heat-soak: heat creep melts the
    # filament inside -> clog + ooze blob on the tip which then drags through the
    # prime line and wrecks the first layer. Wait high, come back for meshing.
    {% set zpark = [printer.toolhead.axis_maximum.z - 5, 40]|min|float %}
    G90
    {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z{zpark|round(0)} F600{% endif %}
    G0 X15 Y{[printer.toolhead.axis_maximum.y - 7, 228]|min|round(0)} F6000

    # ---------- 5) heat bed (meshes are probed AT bed temperature!) ------------------------
    NOTIFY TEXT="Heating bed to {bed|round|int}C..." LEVEL=info LED=heating SOUND=r2_heating
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed|round}
    # ---------- 5b) optional KAMP Smart Park ------------------------------------------------
    {% if sv.kamp_smart_park|default(False) and 'gcode_macro SMART_PARK' in printer %}
        SMART_PARK
        RESPOND MSG="KAMP Smart Park: head is waiting near the print area"
    {% endif %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 2}
    NOTIFY TEXT="Bed ready ({bed|round|int}C)" LEVEL=ok SOUND=r2_hot

    # ---------- 6) BED MESH DECISION --------------------------------------------------------
    # ONE mesh profile 'r2' for everything - no per-material meshes anymore.
    # LCD 'Re-mesh every print' (default ON) -> always calibrate (KAMP-adaptive when
    # the file has object data). Else: load the saved r2 mesh, only calibrate if
    # there is none yet.
    {% set profile = 'r2' %}
    {% set profiles = printer.bed_mesh.profiles|default({}) if 'bed_mesh' in printer else {} %}
    {% set mmode = sv.mesh_mode|default('ON' if sv.mesh_always|default(True) else 'AUTO')|string|upper %}
    {% if mmode == 'OFF' %}
        NOTIFY TEXT="Mesh OFF - whatever is loaded stays (no re-leveling)" LEVEL=info
    {% elif mmode == 'ON' %}
        _CALIBRATE_MESH_PROFILE PROFILE={profile}
    {% elif printer.bed_mesh.profile_name|default('') != '' %}
        # a mesh was loaded explicitly (LCD list / MESH_BY_INDEX) - it stays active
        NOTIFY TEXT="Mesh {printer.bed_mesh.profile_name} active - no re-leveling (UNLOAD_MESH to re-level)" LEVEL=ok
    {% elif profile in profiles %}
        LOAD_MESH_PROFILE PROFILE={profile}
        NOTIFY TEXT="Mesh {profile} loaded (saved)" LEVEL=ok
    {% else %}
        _CALIBRATE_MESH_PROFILE PROFILE={profile}
    {% endif %}
    # nozzle HIGH during the hotend heat-up (never just above the bed while waiting)
    G90
    {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z10 F600{% endif %}


    # ---------- 8) heat hotend to first-layer temperature --------------------------------------
    NOTIFY TEXT="Heating hotend to {h1|round|int}C..." LEVEL=info LED=heating SOUND=r2_heating
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={h1|round}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={h1 - 2}
    NOTIFY TEXT="Hotend ready ({h1|round|int}C)" LEVEL=ok SOUND=r2_hot

    # ---------- 9) set PA / retract / acceleration / flow ----------------------------------------
    # defaults = what printer.cfg configures (single source of truth, no preset values)
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set cfg_fr = printer.configfile.settings['firmware_retraction'] if 'firmware_retraction' in printer.configfile.settings else {} %}
    # every override key has its OWN switch (length / speeds separately!)
    {% set pa  = sv.ov_pa|default(0)|float            if (apply and sv.ov_pa_on|default(False))            else cfg_e.get('pressure_advance', 0.0)|float %}
    {% set rl  = sv.ov_retract_len|default(0)|float   if (apply and sv.ov_retract_len_on|default(False))   else cfg_fr.get('retract_length', 0.0)|float %}
    {% set rs  = sv.ov_retract_speed|default(0)|float if (apply and sv.ov_retract_speed_on|default(False)) else cfg_fr.get('retract_speed', 20.0)|float %}
    {% set ru  = sv.ov_unretract_speed|default(0)|float if (apply and sv.ov_unretract_speed_on|default(False)) else rs %}
    {% set acc = sv.ov_accel|default(0)|float         if (apply and sv.ov_accel_on|default(False) and sv.ov_accel|default(0)|float > 0)      else 0 %}
    {% set vel = sv.ov_velocity|default(0)|float      if (apply and sv.ov_velocity_on|default(False) and sv.ov_velocity|default(0)|float > 0)   else 0 %}
    {% set mcr = sv.ov_min_cruise|default(0)|float    if (apply and sv.ov_min_cruise_on|default(False) and sv.ov_min_cruise|default(0)|float > 0) else 0 %}
    {% set scv = sv.ov_square_corner|default(0)|float if (apply and sv.ov_square_corner_on|default(False) and sv.ov_square_corner|default(0)|float > 0) else 0 %}
    {% set fl  = sv.ov_flow|default(100)|float        if (apply and sv.ov_flow_on|default(False))          else 100 %}
    SET_PRESSURE_ADVANCE ADVANCE={pa}{% if apply and sv.ov_pa_smooth_on|default(False) %} SMOOTH_TIME={sv.ov_pa_smooth|default(0.04)|float}{% endif %}
    SET_RETRACTION RETRACT_LENGTH={rl} RETRACT_SPEED={rs} UNRETRACT_SPEED={ru}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_len VALUE={rl}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_spd VALUE={rs}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_unret VALUE={ru}
    {% if acc > 0 or vel > 0 or mcr > 0 or scv > 0 %}
        SET_VELOCITY_LIMIT{% if acc > 0 %} ACCEL={acc|round}{% endif %}{% if vel > 0 %} VELOCITY={vel|round}{% endif %}{% if mcr > 0 %} MINIMUM_CRUISE_RATIO={mcr}{% endif %}{% if scv > 0 %} SQUARE_CORNER_VELOCITY={scv}{% endif %}
        RESPOND MSG="Machine limits -> Klipper:{% if acc > 0 %} accel {acc|round}{% endif %}{% if vel > 0 %} | max velocity {vel|round}{% endif %}{% if mcr > 0 %} | cruise ratio {mcr|round(3)}{% endif %}{% if scv > 0 %} | corner {scv}{% endif %} (global caps - travels included)"
    {% else %}
        RESPOND MSG="Machine limits: no overwrite active - Klipper [printer] and the file rule"
    {% endif %}
    M221 S{fl|round}
    {% if apply and sv.ov_fan_on|default(False) %}
        # R54: fan overwrite = scale from the start (file's M106 S0 stays 0)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_scale VALUE={(sv.ov_fan|default(100)|float / 100)|round(3)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_value VALUE={pa}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_global VALUE={acc}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE={fl|round}
    RESPOND MSG="PA {pa} | retract {rl}mm@{rs}mm/s | accel {acc} | flow {fl|round}%"

    # ---------- 10) translate pre-print overrides into live factors ------------------------------

    # ---------- 11) purge/prime - KAMP compatible --------------------------------------------------
    _PURGE_SMART LAYER_HEIGHT={printer['gcode_macro _STATE'].file_layer_height}
    # nozzle up to 10mm - it descends only when the print file really starts
    G0 Z10 F600

    # ---------- 12) go! -----------------------------------------------------------------------------
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=current_type VALUE='""'
    # first layer slower (default 75%, LCD Pre-Print - back to 100% at layer 2)
    # R45: NOT in AS SLICED mode (apply=0) - a 1:1 print must stay truly 1:1
    {% if apply and sv.first_layer_speed|default(75)|float > 0 %}
        M220 S{sv.first_layer_speed|default(75)|float|round}
        RESPOND MSG="First layer speed {sv.first_layer_speed|default(75)|float|round|int}% (100% again from layer 2)"
    {% endif %}
    SET_LED_STATE STATE=printing
    _SOUND_LIB NAME=r2_printing
    M117 {mat} {h1|round|int}C layer 1
    RESPOND MSG="=== PRINT RUNNING: {printer.print_stats.filename|default('?')} ==="
    # ---------- 13) release the held file -------------------------------------------------------------
    {% if printer['gcode_macro _STATE'].file_held %}
        RESTORE_GCODE_STATE NAME=PAUSE_STATE
        # R58 FIX (field log .41): RESTORE_GCODE_STATE also brings back the FAN
        # and the SPEED FACTER from the pause moment -> the first layer ran with
        # fan 100% and without the layer-1 brake. Reset the fan + re-assert the
        # brake (overrides only), THEN flag 'printing' BEFORE M24 - the former
        # 'paused' window let raw file commands bypass EVERY override (the file's
        # own SET_PRESSURE_ADVANCE 0.2 overwrote YOUR PA for seconds!).
        M99106 S0
        {% if not printer['gcode_macro _STATE'].ignore_overrides
              and printer['save_variables'].variables.first_layer_speed|default(75)|float > 0
              and printer['gcode_macro _STATE'].layer|int < 2 %}
            M220 S{printer['save_variables'].variables.first_layer_speed|default(75)|float|round}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
        M24
        CLEAR_PAUSE
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
    {% endif %}

# =====================================================================================
#  _PRIME_LINE - purge/prime line, placed SAFELY BESIDE the objects.
#  If the slicer provides object data (exclude_object) the line is drawn next to the
#  print area (left, else right) - important with multiple objects so nothing gets
#  bumped. Without object data: fixed spot at the front left.
# =====================================================================================
# -------------------------------------------------------------------------------------
#  _APPLY_OVERRIDES_CORE - apply PA / retraction / acceleration / flow overrides
#  (used by legacy prep + legacy home: overrides are valid from the purge line on)
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# _FILE_INFO - file parameters from the R2 post-processor (tools/r2_postproc.py).
# The watcher on the Pi injects this call + LAYER_MARK lines into EVERY gcode
# file that lands in the gcodes folder (upload, USB copy - no slicer script
# needed). It runs before the first file command, so Pre-Print > File (G-code)
# shows the REAL slicer values (line widths, flow ratio, PA, layers) even for
# foreign files - and the watcher keeps them (file_info_seen).
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
#  R61 LAYER RANGE - print ONLY layers START..END of the loaded file. The watcher
#  (post-processor service) creates a marked excerpt '<name>_L23-56.gcode': layer START
#  becomes the FIRST layer and starts mid-air at its real Z. Start it via the normal
#  start dialog (AS LEGACY = mesh + purge + your overrides).
#  LCD: Pre-Print > Range/Stop. Console: SET_LAYER_RANGE START=23 END=56
# -------------------------------------------------------------------------------------
[gcode_macro _PREVIEW]
description: Selected-file preview card, in-memory (pushed by the watcher, internal)
# R75: the preview_* values used to be save_variables - every selection pushed
# ~21 of them = ~21 variables.cfg rewrites right when homing started. On the
# field host (Pi Zero) that is disk I/O exactly when Klippy must feed moves
# (field log .58: 'Timer too close' MCU shutdowns). Now they live in memory:
# the watcher sends ONE _PREVIEW_SET command - zero disk writes. After a
# Klipper restart the card is empty ('?') until the next selection - which is
# exactly the R74 rule: never show the PREVIOUS file's values.
variable_name: ''
variable_type: '?'
variable_material: '?'
variable_layer_height: 0
variable_total_layers: 0
variable_line_width: 0
variable_line_width_first: 0
variable_line_width_wall: 0
variable_flow_ratio: 0
variable_pa: 0
variable_nozzle: 0
variable_wall_loops: 0
variable_hotend: 0
variable_bed: 0
variable_fan: 0
variable_speed_outer: 0
variable_speed_first: 0
variable_speed_travel: 0
variable_ironing_speed: 0
variable_types: ''
variable_by_object: 0
variable_plot: 0
variable_pens: 0
variable_slicer: '?'
variable_firmware: '?'
variable_volumetric: 0
variable_retract_style: ''     # R89: fw / fixed / slicer / '' (gates the RetFix offer)
variable_retract_status: ''     # R112: fixed | fw | fix (SHOULD!) | can (optional)
variable_retract_max: 0.0       # R112: longest explicit slicer retract (mm)
gcode:

[gcode_macro _PREVIEW_SET]
description: Watcher pushes the selected file's parameters here (in-memory, internal)
gcode:
    # R75: called by the r2-postproc watcher the moment a file is selected
    # (LCD print button, Mainsail, M23/M24). SET_GCODE_VARIABLE only touches
    # memory - unlike SAVE_VARIABLE it never rewrites variables.cfg, so this
    # can run while the machine homes/meshes without stalling the host.
    # Values come in as strings; |float(0) never raises on junk (a malformed
    # push must never become 'Internal error on command' = printer shutdown).
    {% set p = params %}
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=name VALUE='"{p.NAME|default("")}"'
    # R112: always reset the verdict first - STALE (v4-tagged) files do not
    # carry RETRACT_STATUS yet, the guarded sets below only run when present
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=retract_status VALUE='""'
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=retract_max VALUE=0.0
    # R160 (.120): temps too - generated files carry no M104/M140 of their
    # own (PRINT_START heats), so without this reset the PREVIOUS file's
    # numbers lingered on the card (the R74 'never the previous file's
    # values' rule, temps edition). _PREVIEW_TEMPS re-fills the real ones.
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=hotend VALUE=0
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=bed VALUE=0
    SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=fan VALUE=0
    {% if p.TYPE is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=type VALUE='"{p.TYPE}"'
    {% endif %}
    {% if p.MATERIAL is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=material VALUE='"{p.MATERIAL}"'
    {% endif %}
    {% if p.LAYER_HEIGHT is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=layer_height VALUE={p.LAYER_HEIGHT|float(0)}
    {% endif %}
    {% if p.TOTAL_LAYERS is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=total_layers VALUE={p.TOTAL_LAYERS|int(0)}
    {% endif %}
    {% if p.LINE_WIDTH is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=line_width VALUE={p.LINE_WIDTH|float(0)}
    {% endif %}
    {% if p.LINE_WIDTH_FIRST is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=line_width_first VALUE={p.LINE_WIDTH_FIRST|float(0)}
    {% endif %}
    {% if p.LINE_WIDTH_WALL is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=line_width_wall VALUE={p.LINE_WIDTH_WALL|float(0)}
    {% endif %}
    {% if p.FLOW_RATIO is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=flow_ratio VALUE={p.FLOW_RATIO|float(0)}
    {% endif %}
    {% if p.PA is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=pa VALUE={p.PA|float(0)}
    {% endif %}
    {% if p.NOZZLE is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=nozzle VALUE={p.NOZZLE|float(0)}
    {% endif %}
    {% if p.SLICER is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=slicer VALUE='"{p.SLICER|replace("_", " ")}"'
    {% endif %}
    {% if p.FW is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=firmware VALUE='"{p.FW}"'
    {% endif %}
    {% if p.VOLUMETRIC is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=volumetric VALUE={p.VOLUMETRIC|int == 1}
    {% endif %}
    {% if p.RETRACT is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=retract_style VALUE='"{p.RETRACT}"'
    {% endif %}
    {% if p.RETRACT_STATUS is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=retract_status VALUE='"{p.RETRACT_STATUS}"'
    {% endif %}
    {% if p.RETRACT_MAX|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=retract_max VALUE={p.RETRACT_MAX|float}
    {% endif %}
    {% if p.WALL_LOOPS is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=wall_loops VALUE={p.WALL_LOOPS|int(0)}
    {% endif %}
    {% if p.HOTEND is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=hotend VALUE={p.HOTEND|float(0)}
    {% endif %}
    {% if p.BED is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=bed VALUE={p.BED|float(0)}
    {% endif %}
    {% if p.FAN is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=fan VALUE={p.FAN|float(0)}
    {% endif %}
    {% if p.SPEED_OUTER is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=speed_outer VALUE={p.SPEED_OUTER|float(0)}
    {% endif %}
    {% if p.SPEED_FIRST is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=speed_first VALUE={p.SPEED_FIRST|float(0)}
    {% endif %}
    {% if p.SPEED_TRAVEL is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=speed_travel VALUE={p.SPEED_TRAVEL|float(0)}
    {% endif %}
    {% if p.IRONING_SPEED is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=ironing_speed VALUE={p.IRONING_SPEED|float(0)}
    {% endif %}
    {% if p.TYPES is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=types VALUE='"{p.TYPES}"'
    {% endif %}
    {% if p.BY_OBJECT is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=by_object VALUE={p.BY_OBJECT|int(0)}
    {% endif %}
    {% if p.PLOT is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=plot VALUE={p.PLOT|int(0)}
    {% endif %}
    {% if p.PENS is defined %}
        SET_GCODE_VARIABLE MACRO=_PREVIEW VARIABLE=pens VALUE={p.PENS|int(0)}
    {% endif %}

[gcode_macro FILE_AS_PRESET]
description: Take the previewed file parameters as Pre-Print values (temps/fan/PA) - with beep
gcode:
    {% set pv = printer['gcode_macro _PREVIEW'] %}
    {% if pv.name|default('') == '' %}
        NOTIFY TEXT="No file preview yet - select a file first (appears within ~5s)" LEVEL=warn SOUND=r2_notice
    {% else %}
        # temperatures: L1 + L2 from the file (click again is not needed - beep confirms)
        {% if pv.bed|default(0)|float > 0 %}
            SET_OVERRIDE_VALUE NAME=bed VALUE={pv.bed|float}
            SET_OVERRIDE_VALUE NAME=bed_after VALUE={pv.bed|float}
        {% endif %}
        {% if pv.hotend|default(0)|float > 0 %}
            SET_OVERRIDE_VALUE NAME=hotend_first VALUE={pv.hotend|float}
            SET_OVERRIDE_VALUE NAME=hotend_after VALUE={pv.hotend|float}
        {% endif %}
        {% if pv.fan|default(0)|float > 0 %}
            SET_OVERRIDE_VALUE NAME=fan VALUE={pv.fan|float}
        {% endif %}
        {% if pv.pa|default(0)|float > 0 %}
            SET_OVERRIDE_VALUE NAME=pa VALUE={pv.pa|float}
        {% endif %}
        {% if pv.flow_ratio|default(0)|float > 0 and (pv.flow_ratio|float - 1)|abs > 0.001 %}
            SET_OVERRIDE_VALUE NAME=flow VALUE={(pv.flow_ratio|float * 100)|round(1)}
        {% endif %}
        RESPOND MSG="[file->Pre-Print] {pv.name}: bed {pv.bed|default(0)|float|round(0)}C, hotend {pv.hotend|default(0)|float|round(0)}C, fan {pv.fan|default(0)|float|round(0)}%, PA {pv.pa|default(0)|float}"
        RESPOND MSG="  preview stays until you take it - selecting another file does NOT overwrite your settings"
        M117 File -> Pre-Print ok
        _SOUND_LIB NAME=r2_confirm
    {% endif %}

[gcode_macro SET_LAYER_RANGE]
description: Create a layer-range excerpt (floor/top shape+fill, centered floor/top hole, brim, proper PRINT_END)
gcode:
    # R143 (audit F6): refuse while a print runs - the watcher builds the
    # excerpt from the source file on disk (make_range parses it inline,
    # no load during printing/heating; the start window stays smooth).
    {% if printer['gcode_macro _STATE'].mode in ['printing','paused','filament'] %}
        NOTIFY TEXT="Layer range only when idle - the excerpt is built from the source file on disk" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set start = params.START|default(0)|int %}
        {% set end = params.END|default(0)|int %}
        {% set flo = params.FLOOR|default(0)|int %}
        {% set tp = params.TOP|default(0)|int %}
        {% set br = params.BRIM|default(0)|int %}
        {% set fsh = params.FLOOR_SHAPE|default(printer['save_variables'].variables.range_floor_shape|default(0))|int %}
        {% set ffl = params.FLOOR_FILL|default(printer['save_variables'].variables.range_floor_fill|default(0))|int %}
        {% set tsh = params.TOP_SHAPE|default(printer['save_variables'].variables.range_top_shape|default(0))|int %}
        {% set tfl = params.TOP_FILL|default(printer['save_variables'].variables.range_top_fill|default(1))|int %}
        {% set fho = params.FLOOR_HOLE|default(printer['save_variables'].variables.range_floor_hole|default(0))|float %}
        {% set tho = params.TOP_HOLE|default(printer['save_variables'].variables.range_top_hole|default(0))|float %}
        {% set src = params.FILE|default(printer.print_stats.filename|default(''))|string %}
        {% set tl = printer['gcode_macro _STATE'].total_layers|default(0)|int %}
        # R74: the END layer can no longer exceed the file - the LCD input is
        # capped, and this clamp catches console calls + stale previews
        {% if tl > 0 and end > tl %}
            {% set end = tl %}
            RESPOND MSG="Layer range: END capped to {tl} - the file has {tl} layers"
        {% endif %}
        {% if tl > 0 and start > tl - 1 %}
            {% set start = tl - 1 %}
            RESPOND MSG="Layer range: START capped to {tl - 1} - the file has {tl} layers"
        {% endif %}
        {% if start < 2 or end <= start %}
            RESPOND MSG="Layer range: START must be 2+ and END above START (got {start}..{end})"
            M117 Range: invalid
        {% elif src == '' %}
            RESPOND MSG="Layer range: no file loaded - select the file first, then Range > Create"
            M117 Range: no file
        {% else %}
            # R85: 11 disk writes in one click - paced (Pi Zero burst protection)
            SAVE_VARIABLE VARIABLE=range_start VALUE={start}
            _PACE
            SAVE_VARIABLE VARIABLE=range_end VALUE={end}
            _PACE
            SAVE_VARIABLE VARIABLE=range_floor VALUE={flo}
            _PACE
            SAVE_VARIABLE VARIABLE=range_top VALUE={tp}
            _PACE
            SAVE_VARIABLE VARIABLE=range_brim VALUE={br}
            _PACE
            SAVE_VARIABLE VARIABLE=range_floor_shape VALUE={fsh}
            _PACE
            SAVE_VARIABLE VARIABLE=range_floor_fill VALUE={ffl}
            _PACE
            SAVE_VARIABLE VARIABLE=range_top_shape VALUE={tsh}
            _PACE
            SAVE_VARIABLE VARIABLE=range_top_fill VALUE={tfl}
            _PACE
            SAVE_VARIABLE VARIABLE=range_floor_hole VALUE={fho|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=range_top_hole VALUE={tho|round(1)}
            _PACE
            SAVE_VARIABLE VARIABLE=range_src VALUE='"{src}"'
            _PACE
            {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
            SAVE_VARIABLE VARIABLE=range_nonce VALUE={printer['save_variables'].variables.range_nonce|default(0)|int + 1}
            RESPOND MSG="Layer range {start}..{end} of {src}: excerpt is being created"
            RESPOND MSG="  layer {start} prints as the FIRST layer at Z0.2 on the bed (meshed, purge, your Pre-Print settings)"
            {% if flo > 0 %}RESPOND MSG="  + {flo} floor layer(s): {('true outline' if fsh == 1 else 'footprint')}, {('SOLID' if ffl == 1 else 'grid')} fill, zero gap to the model"{% endif %}
            {% if tp > 0 %}RESPOND MSG="  + {tp} top layer(s): {('true outline' if tsh == 1 else 'footprint')}, {('SOLID' if tfl == 1 else 'grid')} fill"{% endif %}
            {% if fho > 0 %}RESPOND MSG="  + floor hole {fho|round(1)}mm centered, thick boss ring (cable feed / E14 ~15mm / E27 ~28mm thread - body: measure + 0.3)"{% endif %}
            {% if tho > 0 %}RESPOND MSG="  + top hole {tho|round(1)}mm centered, BRIDGE-FIRST: layer 1 anchors the edge (no sagging), layers 2+ open the hole"{% endif %}
            {% if br > 0 %}RESPOND MSG="  + brim ({br} loops)"{% endif %}
            RESPOND MSG="  the excerpt ends with a proper PRINT_END (park + cool down - the nozzle never stays on the print)"
            RESPOND MSG="  ready in a few seconds - then start it like any file (AS LEGACY)"
            M117 Range {start}-{end} creating
            _UI_SOUND NAME=r2_confirm
        {% endif %}
    {% endif %}

# R84: Bowden-era rescue. Old files carry long explicit retracts (e.g. 5mm)
# baked into the G-code; the direct extruder wants ~0.8mm. RETRACT_FIX rewrites
# clean retract pairs of the NEXT UPLOADED file into G10/G11 (firmware
# retraction) - the CURRENT retraction (Pre-Print > Retraction + live tuning)
# then applies, even mid-print. Already-processed files must be re-uploaded.
[gcode_macro RETRACT_FIX]
description: Old-file rescue - rewrite the retracts of the NEXT upload to G10/G11 (your retraction applies)
gcode:
    {% set on = params.STATE|default(1)|int == 1 %}
    _SOUND_LIB NAME=r2_click
    _PACE
    SAVE_VARIABLE VARIABLE=retract_rewrite VALUE={on}
    {% if on %}
        RESPOND MSG="[i] Retract fix ON: re-upload the old file now - its retracts become G10/G11"
        RESPOND MSG="    so YOUR current retraction applies (Pre-Print > Retraction, live-tunable during the print)"
        M117 RetFix ON
    {% else %}
        RESPOND MSG="[i] Retract fix OFF: new uploads keep their own retraction values"
        M117 RetFix OFF
    {% endif %}

# R85: fix the SELECTED file in place - NO re-upload. The watcher rewrites
# the file directly (retract pairs -> G10/G11, or Marlin-volumetric E -> mm),
# keeps the R2 markers and beeps when done. The start dialog is released
# first (the file is about to change on disk).
[gcode_macro FIX_FILE]
description: Fix the selected file in place - retract pairs -> G10/G11 or volumetric E -> mm
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set what = params.WHAT|default('')|string|upper %}
    {% set fn = params.FILE|default('')|string %}
    {% if fn == '' %}{% set fn = sv.preview_file|default('')|string %}{% endif %}
    {% if fn == '' %}{% set fn = printer.print_stats.filename|default('')|string %}{% endif %}
    {% if what not in ['RETRACT', 'VOL', 'FLOWCAP', 'TRAVELACC', 'TRAVEL', 'SEGMENTS'] %}
        RESPOND MSG="FIX_FILE WHAT=RETRACT (retract pairs -> G10/G11) / VOL (volumetric E -> mm) / FLOWCAP CAP=12 (mm3/s) / TRAVEL SPEED=200 ACCEL=8000 / TRAVELACC ACCEL=8000 (accel only) / SEGMENTS (micro moves merged - MCU safe)"
        RESPOND MSG="  fixes the SELECTED file in place - no re-upload. LCD: Pre-Print > File"
    {% elif s.mode in ['printing','paused'] %}
        NOTIFY TEXT="File fix blocked during a print - end the print first" LEVEL=warn SOUND=r2_notice
        M117 Fix: printing
    {% elif fn == '' %}
        NOTIFY TEXT="No file selected - pick the file in the file list first" LEVEL=warn SOUND=r2_notice
        M117 Fix: no file
    {% else %}
        {% if s.mode == 'waiting' %}
            # the file is held in the start dialog - release it (it changes NOW)
            # R132 field log .92: release the dialog on our OWN clean path.
            # The old way (decision='cancel' + the poller) died when the
            # poller hit an error mid-branch -> mode stuck 'waiting' with a
            # dead poller -> AS LEGACY / AS SLICED did nothing at all.
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
            _WAIT_IDLE_RESTORE
            CANCEL_PRINT_BASE
            SET_LED_STATE STATE=idle
            RESPOND MSG="File fix: start dialog released - {fn} is being fixed now"
            RESPOND MSG="  it comes back on its own when the fix is done - you only confirm (R132)"
        {% endif %}
        _SOUND_LIB NAME=r2_confirm
        _PACE
        {% if what == 'RETRACT' %}
            SAVE_VARIABLE VARIABLE=retract_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=retract_fix_nonce VALUE={sv.retract_fix_nonce|default(0)|int + 1}
            RESPOND MSG="Retract fix started: {fn} - clean pairs become G10/G11, YOUR retraction applies"
            M117 RetFix: working
        {% elif what == 'FLOWCAP' %}
            # R111: volumetric rate cap - hotend protection, F values rewritten
            {% set cap = params.CAP|default(sv.flowcap_limit|default(12.0))|float %}
            {% if not (0.5 <= cap <= 50) %}
                RESPOND MSG="Flow cap must be 0.5..50 mm3/s (a hotend does ~8-15, the file info shows MAXRATE)"
            {% else %}
                SAVE_VARIABLE VARIABLE=flowcap_limit VALUE={cap}
                _PACE
                SAVE_VARIABLE VARIABLE=flowcap_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
                _PACE
                SAVE_VARIABLE VARIABLE=flowcap_fix_nonce VALUE={sv.flowcap_fix_nonce|default(0)|int + 1}
                RESPOND MSG="Flow cap started: {fn} - moves over {cap} mm3/s get a lower F (travels/retracts untouched)"
                M117 FlowCap: working
            {% endif %}
        {% elif what == 'TRAVEL' %}
            # R121: direct travel control - SPEED (mm/s, 0 = keep the file's)
            # + ACCEL (mm/s2, 0 = keep the file's) + live markers so
            # Live > Features > Travel works on this file afterwards
            {% set spd = params.SPEED|default(sv.travel_speed|default(0))|float %}
            {% set acc = params.ACCEL|default(sv.travelaccel_value|default(0))|int %}
            {% if not (0 <= spd <= 300) or (spd > 0 and spd < 20) %}
                RESPOND MSG="Travel speed must be 0 (= keep the file's) or 20..300 mm/s"
            {% elif not (acc == 0 or 100 <= acc <= 100000) %}
                RESPOND MSG="Travel accel must be 0 (= keep the file's) or 100..100000 mm/s2"
            {% else %}
                SAVE_VARIABLE VARIABLE=travel_speed VALUE={spd}
                _PACE
                SAVE_VARIABLE VARIABLE=travelaccel_value VALUE={acc}
                _PACE
                SAVE_VARIABLE VARIABLE=travelacc_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
                _PACE
                SAVE_VARIABLE VARIABLE=travelacc_fix_nonce VALUE={sv.travelacc_fix_nonce|default(0)|int + 1}
                RESPOND MSG="Travel fix started: {fn} - travels at {spd|round(0)|int if spd > 0 else 'file'} mm/s, accel {acc if acc > 0 else 'file'}{', live % ready (Live > Features > Travel)' if spd > 0 else ''}"
                M117 TravFix: working
            {% endif %}
        {% elif what == 'TRAVELACC' %}
            # R111: separate travel acceleration - M204 wraps around travel blocks
            {% set acc = params.ACCEL|default(sv.travelaccel_value|default(8000))|int %}
            {% if not (100 <= acc <= 100000) %}
                RESPOND MSG="Travel accel must be 100..100000 mm/s2"
            {% else %}
                SAVE_VARIABLE VARIABLE=travelaccel_value VALUE={acc}
                _PACE
                SAVE_VARIABLE VARIABLE=travelacc_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
                _PACE
                SAVE_VARIABLE VARIABLE=travelacc_fix_nonce VALUE={sv.travelacc_fix_nonce|default(0)|int + 1}
                RESPOND MSG="Travel accel started: {fn} - travels run at {acc} mm/s2, print accels untouched"
                M117 TravAcc: working
            {% endif %}
        {% elif what == 'SEGMENTS' %}
            # R133 (field log .94, MCU 'Timer too close'): heal a micro-
            # segment flood - <0.1mm hops merge, old .93/scaled files too
            SAVE_VARIABLE VARIABLE=segments_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=segments_fix_nonce VALUE={sv.segments_fix_nonce|default(0)|int + 1}
            RESPOND MSG="Segment fix started: {fn} - micro moves merge until the file is MCU-safe ('Timer too close' protection)"
            M117 SegFix: working
        {% else %}
            SAVE_VARIABLE VARIABLE=vol_fix_file VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=fix_reselect VALUE='"{fn}"'
            _PACE
            SAVE_VARIABLE VARIABLE=vol_fix_nonce VALUE={sv.vol_fix_nonce|default(0)|int + 1}
            RESPOND MSG="Volumetric conversion started: {fn} - E mm3 becomes mm (Klipper-ready)"
            M117 VolFix: working
        {% endif %}
    {% endif %}

[gcode_macro _FILE_INFO]
description: File parameters - injected by the R2 post-processor (internal)
gcode:
    {% if params.MATERIAL is defined %}
        {% set m = params.MATERIAL|string|upper %}
        {% if m in ['PLA','PETG','ABS','ASA','TPU'] %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_material VALUE='"{m}"'
        {% endif %}
    {% endif %}
    {% if params.SLICER is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_slicer VALUE='"{params.SLICER|replace("_", " ")}"'
    {% endif %}
    {% if params.FW is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_firmware VALUE='"{params.FW}"'
    {% endif %}
    {% if params.VOLUMETRIC is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_volumetric VALUE={params.VOLUMETRIC|int == 1}
    {% endif %}
    {% if params.RETRACT is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_style VALUE='"{params.RETRACT}"'
    {% endif %}
    {% if params.RETRACT_STATUS is defined %}
        # R112: the unambiguous verdict - fixed | fw | fix (should!) | can (optional)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_status VALUE='"{params.RETRACT_STATUS}"'
    {% endif %}
    {% if params.RETRACT_MAX|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_max VALUE={params.RETRACT_MAX|float}
    {% endif %}
    {% if params.LAYER_HEIGHT|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_layer_height VALUE={params.LAYER_HEIGHT|float}
    {% endif %}
    {% if params.TOTAL_LAYERS|default(0)|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE={params.TOTAL_LAYERS|int}
    {% endif %}
    {% if params.LINE_WIDTH|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width VALUE={params.LINE_WIDTH|float}
    {% endif %}
    {% if params.LINE_WIDTH_FIRST|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width_first VALUE={params.LINE_WIDTH_FIRST|float}
    {% endif %}
    {% if params.LINE_WIDTH_WALL|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width_wall VALUE={params.LINE_WIDTH_WALL|float}
    {% endif %}
    {% if params.FLOW_RATIO|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_flow_ratio VALUE={params.FLOW_RATIO|float}
    {% endif %}
    {% if params.PA|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_pa VALUE={params.PA|float}
    {% endif %}
    {% if params.BY_OBJECT is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_by_object VALUE={params.BY_OBJECT|default(0)|int == 1}
    {% endif %}
    {% for key, var in [('SPEED_OUTER','file_speed_outer'), ('SPEED_INNER','file_speed_inner'),
                        ('SPEED_SPARSE','file_speed_sparse'), ('SPEED_TOP','file_speed_top'),
                        ('SPEED_FIRST','file_speed_first'), ('SPEED_TRAVEL','file_speed_travel'),
                        ('SPEED_SUPPORT','file_speed_support'), ('SPEED_IRONING','file_speed_ironing'),
                        ('SPEED_SOLID','file_speed_solid'), ('SPEED_GAPS','file_speed_gaps'),
                        ('SPEED_BRIDGE','file_speed_bridge'), ('SPEED_SKIRT','file_speed_skirt'),
                        ('SPEED_SUPPINT','file_speed_suppint'), ('SPEED_SMALL','file_speed_small'),
                        ('ACCEL_DEFAULT','file_accel_default'), ('ACCEL_OUTER','file_accel_outer'),
                        ('ACCEL_INNER','file_accel_inner'), ('ACCEL_SPARSE','file_accel_sparse'),
                        ('ACCEL_TOP','file_accel_top'), ('ACCEL_SMALL','file_accel_small'),
                        ('ACCEL_SOLID','file_accel_solid'), ('ACCEL_FIRST','file_accel_first'),
                        ('ACCEL_TRAVEL','file_accel_travel'),
                        ('LW_INNER','file_lw_inner'), ('LW_SPARSE','file_lw_sparse'),
                        ('LW_SOLID','file_lw_solid'), ('LW_TOP','file_lw_top'), ('LW_SMALL','file_lw_small'),
                        ('FIL_DIA','file_fil_dia'), ('TIME_SLOW','file_time_slow'), ('SLOW_MIN','file_slow_min'),
                        ('FAN_MIN','file_fan_min'), ('FAN_MAX','file_fan_max'),
                        ('IRONING_SPACING','file_ironing_spacing'),
                        ('FS_WALL_OUTER','file_feat_spd_wallouter'), ('FS_WALL_INNER','file_feat_spd_wallinner'),
                        ('FS_INFILL_SPARSE','file_feat_spd_infillsparse'), ('FS_INFILL_SOLID','file_feat_spd_infillsolid'),
                        ('FS_SURFACE_TOP','file_feat_spd_surfacetop'), ('FS_SURFACE_BOTTOM','file_feat_spd_surfacebottom'),
                        ('FS_BRIDGE','file_feat_spd_bridge'), ('FS_GAPS','file_feat_spd_gaps'),
                        ('FS_SUPPORT','file_feat_spd_support'), ('FS_IRONING','file_feat_spd_ironing'),
                        ('FS_SKIRT','file_feat_spd_skirt'), ('FS_BRIM','file_feat_spd_brim'),
                        ('FS_OVERHANG_PERIM','file_feat_spd_overhangperim'), ('FS_INTERNAL_BRIDGE','file_feat_spd_internalbridge'), ('FS_PRIME_TOWER','file_feat_spd_primetower'), ('FS_CUSTOM','file_feat_spd_custom'),
                        ('FA_WALL_OUTER','file_feat_acc_wallouter'), ('FA_WALL_INNER','file_feat_acc_wallinner'),
                        ('FA_INFILL_SPARSE','file_feat_acc_infillsparse'), ('FA_INFILL_SOLID','file_feat_acc_infillsolid'),
                        ('FA_SURFACE_TOP','file_feat_acc_surfacetop'), ('FA_SURFACE_BOTTOM','file_feat_acc_surfacebottom'),
                        ('FA_BRIDGE','file_feat_acc_bridge'), ('FA_GAPS','file_feat_acc_gaps'),
                        ('FA_SUPPORT','file_feat_acc_support'), ('FA_IRONING','file_feat_acc_ironing'),
                        ('FA_SKIRT','file_feat_acc_skirt'), ('FA_BRIM','file_feat_acc_brim'),
                        ('FA_OVERHANG_PERIM','file_feat_acc_overhangperim'), ('FA_INTERNAL_BRIDGE','file_feat_acc_internalbridge'), ('FA_PRIME_TOWER','file_feat_acc_primetower'), ('FA_CUSTOM','file_feat_acc_custom'),] %}
        {% if params[key]|default(0)|float > 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE={var|lower} VALUE={params[key]|float}
        {% endif %}
    {% endfor %}
    {% if params.TYPES is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_types VALUE='"{params.TYPES}"'
    {% endif %}
    {% if params.NOZZLE|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_nozzle VALUE={params.NOZZLE|float}
    {% endif %}
    {% if params.WALL_LOOPS|default(0)|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_wall_loops VALUE={params.WALL_LOOPS|int}
    {% endif %}
    {% if params.IRONING_FLOW|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_ironing_flow VALUE={params.IRONING_FLOW|float}
    {% endif %}
    {% if params.RETRACT_STATUS|default('') in ['fix', 'can'] %}
        RESPOND MSG="File retraction: {params.RETRACT_STATUS|upper} - explicit slicer retracts up to {params.RETRACT_MAX|default('?')} mm{' - FIX! they override your tuned ~0.8 mm direct-drive retraction' if params.RETRACT_STATUS == 'fix' else ' - RetFix optional (firmware retraction would rule them live)'}"
    {% elif params.RETRACT_STATUS|default('') in ['fixed', 'fw'] %}
        RESPOND MSG="File retraction: {'already FIXED (G10/G11 - your retraction rules)' if params.RETRACT_STATUS == 'fixed' else 'slicer-native G10/G11 - your retraction rules, nothing to do'}"
    {% endif %}
    {% if params.DERIVED is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_derived VALUE={params.DERIVED|int == 1}
    {% endif %}
    {% if params.CONF|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_conf VALUE={params.CONF|float}
    {% endif %}
    {% if params.COVER|default(0)|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_cover VALUE={params.COVER|int}
    {% endif %}
    {% if params.MAXRATE|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_maxrate VALUE={params.MAXRATE|float}
    {% endif %}
    {% if params.TRAVEL|default(0)|float > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_travel VALUE={params.TRAVEL|float}
    {% endif %}
    {% if params.SEAM is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_seam VALUE='"{params.SEAM}"'
    {% endif %}
    {% if params.SEAMN|default(0)|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_seamn VALUE={params.SEAMN|int}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_info_seen VALUE=True
    RESPOND MSG="File info: {params.TOTAL_LAYERS|default('?')} layers | lh {params.LAYER_HEIGHT|default('?')} | width {params.LINE_WIDTH|default('?')} (first {params.LINE_WIDTH_FIRST|default('-')}, wall {params.LINE_WIDTH_WALL|default('-')}) | flow ratio {params.FLOW_RATIO|default('?')} | PA {params.PA|default('-')} | by object {'YES' if params.BY_OBJECT|default(0)|int == 1 else 'no'}"
    {% if params.MAXRATE|default(0)|float > 0 %}
        RESPOND MSG="File flow: max {params.MAXRATE|float} mm3/s{' - hotend limit is ~8-15' if params.MAXRATE|float < 20 else ''}{' | seam at ' ~ params.SEAM ~ ' (' ~ params.SEAMN ~ ' starts)' if params.SEAMN|default(0)|int > 0 else ''}"
    {% endif %}
    {% if params.TRAVEL|default(0)|float > 0 %}
        RESPOND MSG="File travels: {params.TRAVEL|float|round(0)|int} mm/s - want them faster/slower? Pre-Print > File > Travel, the fix rewrites them (live % on top: Live > Features > Travel)"
    {% endif %}
    {% if params.DERIVED|default(0)|int == 1 %}
        RESPOND MSG="File features: DERIVED by geometry ({(params.CONF|default(0.7)|float * 100)|round(0)|int}% confidence, {params.COVER|default(0)|int}% of moves covered) - no TYPE: tags in this file, the R2 classifier guessed walls/infill/surfaces. An explicit tag always wins."
    {% endif %}

[gcode_macro _APPLY_OVERRIDES_CORE]
description: Apply PA/retract/accel/flow overwrites (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set cfg_fr = printer.configfile.settings['firmware_retraction'] if 'firmware_retraction' in printer.configfile.settings else {} %}
    {% set pa  = sv.ov_pa|default(0)|float            if sv.ov_pa_on|default(False)            else cfg_e.get('pressure_advance', 0)|float %}
    {% set rl  = sv.ov_retract_len|default(0)|float   if sv.ov_retract_len_on|default(False)   else cfg_fr.get('retract_length', 0.75)|float %}
    {% set rs  = sv.ov_retract_speed|default(0)|float if sv.ov_retract_speed_on|default(False) else cfg_fr.get('retract_speed', 35)|float %}
    {% set ru  = sv.ov_unretract_speed|default(0)|float if sv.ov_unretract_speed_on|default(False) else rs %}
    {% set acc = sv.ov_accel|default(0)|float         if (sv.ov_accel_on|default(False) and sv.ov_accel|default(0)|float > 0)      else 0 %}
    {% set vel = sv.ov_velocity|default(0)|float      if (sv.ov_velocity_on|default(False) and sv.ov_velocity|default(0)|float > 0)   else 0 %}
    {% set mcr = sv.ov_min_cruise|default(0)|float    if (sv.ov_min_cruise_on|default(False) and sv.ov_min_cruise|default(0)|float > 0) else 0 %}
    {% set scv = sv.ov_square_corner|default(0)|float if (sv.ov_square_corner_on|default(False) and sv.ov_square_corner|default(0)|float > 0) else 0 %}
    {% set fl  = sv.ov_flow|default(100)|float        if sv.ov_flow_on|default(False)          else 100 %}
    SET_PRESSURE_ADVANCE ADVANCE={pa}{% if sv.ov_pa_smooth_on|default(False) %} SMOOTH_TIME={sv.ov_pa_smooth|default(0.04)|float}{% endif %}
    SET_RETRACTION RETRACT_LENGTH={rl} RETRACT_SPEED={rs} UNRETRACT_SPEED={ru}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_len VALUE={rl}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_spd VALUE={rs}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_unret VALUE={ru}
    {% if acc > 0 or vel > 0 or mcr > 0 or scv > 0 %}
        SET_VELOCITY_LIMIT{% if acc > 0 %} ACCEL={acc|round}{% endif %}{% if vel > 0 %} VELOCITY={vel|round}{% endif %}{% if mcr > 0 %} MINIMUM_CRUISE_RATIO={mcr}{% endif %}{% if scv > 0 %} SQUARE_CORNER_VELOCITY={scv}{% endif %}
        RESPOND MSG="Machine limits -> Klipper:{% if acc > 0 %} accel {acc|round}{% endif %}{% if vel > 0 %} | max velocity {vel|round}{% endif %}{% if mcr > 0 %} | cruise ratio {mcr|round(3)}{% endif %}{% if scv > 0 %} | corner {scv}{% endif %} (global caps - travels included)"
    {% else %}
        RESPOND MSG="Machine limits: no overwrite active - Klipper [printer] and the file rule"
    {% endif %}
    M221 S{fl|round}
    {% if sv.ov_fan_on|default(False) %}
        # R54: fan overwrite = scale from the start (file's M106 S0 stays 0)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_scale VALUE={(sv.ov_fan|default(100)|float / 100)|round(3)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_value VALUE={pa}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE={fl|round}
    RESPOND MSG="Overwrites active from now: PA {pa} | retract {rl}mm@{rs}mm/s | accel {acc} | flow {fl|round|int}%"

# -------------------------------------------------------------------------------------
#  _LEGACY_HOME - legacy file with 'level old files' OFF: still make sure the axes
#  are homed (a file without G28 would crash with 'Must home axis first') + apply
#  the overrides. Pause once, home, continue.
# -------------------------------------------------------------------------------------
[gcode_macro _LEGACY_HOME]
description: Legacy file: home + overwrites even without full prep (phase 1, internal)
gcode:
    {% set fn = printer.print_stats.filename|default('') %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_file VALUE='"{fn}"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
    {% if printer.extruder.target|float >= 200 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=170
        RESPOND MSG="[i] Hotend -> 170C standby while homing (anti-ooze) - re-heats for the purge"
    {% endif %}
    PAUSE REASON="legacy start (homing)"
    UPDATE_DELAYED_GCODE ID=_LEGACY_HOME2 DURATION=1.5

[delayed_gcode _LEGACY_HOME2]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode != 'paused' or printer.print_stats.state != 'paused' %}
        RESPOND MSG="Legacy home: file did not hold the pause - continuing without homing"
    {% else %}
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
            RESPOND MSG="Legacy home: homing first (the file has not homed yet)"
            G28
        {% endif %}
        G90
        {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z10 F600{% endif %}
        # ---- purge ALWAYS (user rule): hotend to the LAYER-1 temperature first.
        #      Chain identical to _LEGACY_PREP2: L1 override > file target > preset
        {% set sv = printer['save_variables'].variables %}
        {% set db = printer['gcode_macro _MATERIALS'].presets %}
        {% set mat = sv.material|default('PLA')|string|upper %}
        {% set ht = printer.extruder.target|float %}
        {% if sv.ov_hotend_first_on|default(False) %}
            {% set ht = sv.ov_hotend_first|float %}
        {% elif s.file_hotend_first|float > 0 %}
            # R49: the file's own pre-decision target (M104/M109 capture)
            {% set ht = s.file_hotend_first|float %}
        {% elif ht < 170 %}
            {% set ht = db[mat].hot1|float if mat in db else 210 %}
        {% endif %}
        RESPOND MSG="Heating hotend to {ht|round|int}C for purge (layer-1 temp)..."
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ht|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 1}
        G4 P3000
        # ---- PA / retraction / flow overrides are valid FROM the purge line on
        _APPLY_OVERRIDES_CORE
        {% if sv.first_layer_speed|default(75)|float > 0 %}
            M220 S{sv.first_layer_speed|default(75)|float|round}
            RESPOND MSG="First layer speed {sv.first_layer_speed|default(75)|float|round|int}% (100% again from layer 2)"
        {% endif %}
        _PRIME_LINE
        G0 Z10 F600
        # R54: gapless resume (no return dance - see _LEGACY_PREP2)
        RESTORE_GCODE_STATE NAME=PAUSE_STATE
        # R58 FIX (field log .41): RESTORE_GCODE_STATE also brings back the FAN
        # and the SPEED FACTER from the pause moment -> the first layer ran with
        # fan 100% and without the layer-1 brake. Reset the fan + re-assert the
        # brake (overrides only), THEN flag 'printing' BEFORE M24 - the former
        # 'paused' window let raw file commands bypass EVERY override (the file's
        # own SET_PRESSURE_ADVANCE 0.2 overwrote YOUR PA for seconds!).
        M99106 S0
        {% if not printer['gcode_macro _STATE'].ignore_overrides
              and printer['save_variables'].variables.first_layer_speed|default(75)|float > 0
              and printer['gcode_macro _STATE'].layer|int < 2 %}
            M220 S{printer['save_variables'].variables.first_layer_speed|default(75)|float|round}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
        M24
        CLEAR_PAUSE
        RESPOND MSG="Legacy home done - homed, purged, printing continues"
    {% endif %}

[gcode_macro _LEGACY_DIALOG]
description: Legacy file detected: pause + ask AS SLICED or AS LEGACY (R45, internal)
gcode:
    # pause the FILE only (no parking - nothing is hot yet, like PRINT_START's hold).
    # The start dialog appears (LCD 'Start Print?' + Mainsail) and the
    # _START_CONFIRM_WAITER handles the decision - AS SLICED and AS LEGACY both
    # have a legacy branch there. start_confirm OFF = old automatic takeover.
    # R47 FIX: this MUST schedule the WAITER itself (like PRINT_START does) and
    # clear a stale decision - without it the dialog was a DEAD END: the decision
    # was saved but NOBODY executed it (menu entries "did nothing", mode stuck in
    # 'waiting', Live Tuning stayed hidden, the next PRINT_START was refused).
    SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"waiting"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
    PAUSE_BASE
    SET_LED_STATE STATE=waiting
    RESPOND MSG="[i] File type: LEGACY (no PRINT_START marker in this file)"
    RESPOND MSG="Start Print? -> AS SLICED (file rules 1:1) or AS LEGACY (level+purge+overwrites)"
    NOTIFY TEXT="LEGACY file! AS SLICED or AS LEGACY?" LEVEL=info LED=waiting SOUND=r2_question
    UPDATE_DELAYED_GCODE ID=_START_CONFIRM_WAITER DURATION=2

# -------------------------------------------------------------------------------------
#  _LEGACY_PREP - for OLD gcode files without PRINT_START (called by _STATE_WATCHER):
#  pause right at the start -> heat bed to print temp -> mesh (material profile)
#  -> prime line if the hotend is already hot -> resume. Runs ONCE per file.
#  Toggle in LCD: Pre-Print > Bed Mesh > 'Level old files'.
# -------------------------------------------------------------------------------------
[gcode_macro _LEGACY_PREP]
description: Auto level+purge a legacy print at its start (phase 1: pause, internal)
gcode:
    {% set fn = printer.print_stats.filename|default('') %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_file VALUE='"{fn}"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
    # R70 FIELD FIX (log .53, 11:24): 'Extrude below minimum temp' x5 - a foreign
    # file queues its own prime lines right after a non-blocking M104; the PAUSE
    # below cannot stop commands that are already queued. But THIS macro runs in
    # the same gcode dispatch -> while we wait here nothing else executes. If a
    # real hotend target is already set, reach it BEFORE the pause so the file's
    # own start gcode can never extrude cold.
    {% set mint = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if printer.extruder.target|float >= 40 %}
        {% set gtmp = [printer.extruder.target|float, mint + 5]|max %}
        # R72: never wait to exactly min_extrude_temp (170 default) - the heater
        # oscillates around the target and every E-move below the line is a HARD
        # gcode error (kills the whole chain + print). min_extrude_temp + 5.
        NOTIFY TEXT="Cold-extrude guard: waiting for the hotend ({gtmp|round|int}C = min_extrude_temp {mint|round|int} + 5) before the takeover pause" LEVEL=info LED=heating SOUND=r2_heating
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={gtmp|round}
    {% endif %}
    # anti-ooze (R49, field log): the file can heat the hotend to FULL print temp
    # before the decision - drop it to standby while bed + mesh run. The prep
    # re-heats to the layer-1 temperature right before the purge line.
    {% if printer.extruder.target|float >= 200 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=170
        RESPOND MSG="[i] Hotend -> 170C standby during bed + mesh (anti-ooze) - re-heats for the purge"
    {% endif %}
    NOTIFY TEXT="Old file: pausing for leveling + purge" LEVEL=info LED=leveling SOUND=r2_leveling
    PAUSE REASON="legacy start (leveling)"
    # IMPORTANT: this macro's template was rendered BEFORE it runs - checking whether
    # the pause took effect must happen in a FRESH context -> phase 2, 1.5s later
    UPDATE_DELAYED_GCODE ID=_LEGACY_PREP2 DURATION=1.5

# -------------------------------------------------------------------------------------
# _LEGACY_PREP2 - phase 2 (fresh render): verify the pause took effect, then
# home -> bed temp -> mesh -> prime line -> resume. Any hard error in phase 1 used to
# kill the whole chain (cold-extrude in the park!) - that is why this is split up.
# -------------------------------------------------------------------------------------
[delayed_gcode _LEGACY_PREP2]
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    {% set mat = sv.material|default('PLA')|string|upper %}
    {% set profile = 'r2' %}
    {% if s.mode != 'paused' or printer.print_stats.state != 'paused' %}
        RESPOND MSG="Legacy prep: file did not hold the pause - continuing WITHOUT auto-leveling"
        RESPOND MSG="(live tuning stays active - level manually via Maintenance if needed)"
    {% else %}
        # ---- mesh + park need known positions: home whatever is missing --------------------
        {% set ha = printer.toolhead.homed_axes|lower %}
        {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
            # gantry sync BEFORE homing (both Z motors hit the top stop evenly)
            {% if sv.gantry_sync_print|default(False) and 'gcode_macro SYNC_GANTRY' in printer %}
                SYNC_GANTRY QUIET=1 FORCE=1
            {% endif %}
            RESPOND MSG="Legacy prep: homing first (the file has not homed yet)"
            G28
        {% endif %}
        # park high while the bed heats (nozzle clog/ooze protection, see PRINT_START)
        {% set zpark = [printer.toolhead.axis_maximum.z - 5, 40]|min|float %}
        G90
        {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z{zpark|round(0)} F600{% endif %}
        G0 X15 Y{[printer.toolhead.axis_maximum.y - 7, 228]|min|round(0)} F6000
        # ---- bed to print temperature: LAYER-1 override wins, then file, then preset -------
        {% set bt = printer.heater_bed.target|float %}
        {% if sv.ov_bed_on|default(False) %}
            {% set bt = sv.ov_bed|float %}
        {% elif bt <= 0 and mat in db %}{% set bt = db[mat].bed1|float %}{% endif %}
        {% if bt > 0 %}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bt|round}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 2}
        {% endif %}
        # ---- mesh (adaptive when object data exists, else full bed) --------------------------
        _CALIBRATE_MESH_PROFILE PROFILE={profile}
        # nozzle HIGH while the hotend heats (never just above the bed while waiting)
        G90
        {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z10 F600{% endif %}
        # ---- heat hotend for the purge line: the LAYER-1 override temperature applies
        #      to purge/prime AND layer 1 - the 'from layer 2' values only from layer 2 on
        {% set ht = printer.extruder.target|float %}
        {% if sv.ov_hotend_first_on|default(False) %}
            {% set ht = sv.ov_hotend_first|float %}
        {% elif s.file_hotend_first|float > 0 %}
            # R49: the file's own pre-decision target (M104/M109 capture) - the
            # standby above may have lowered the live target in between
            {% set ht = s.file_hotend_first|float %}
        {% elif ht < 170 %}
            {% set ht = db[mat].hot1|float if mat in db else 210 %}
        {% endif %}
        NOTIFY TEXT="Heating hotend to {ht|round|int}C for purge (layer-1 temp)..." LEVEL=info LED=heating SOUND=r2_heating
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ht|round}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 1}
        G4 P3000
        # ---- PA / retraction / accel / flow overrides are valid FROM the purge line on ----
        _APPLY_OVERRIDES_CORE
        # first layer slower (default 75%, LCD Pre-Print - back to 100% at layer 2)
        {% if sv.first_layer_speed|default(75)|float > 0 %}
            M220 S{sv.first_layer_speed|default(75)|float|round}
            RESPOND MSG="First layer speed {sv.first_layer_speed|default(75)|float|round|int}% (100% again from layer 2)"
        {% endif %}
        _PRIME_LINE
        # nozzle up again - the file does its own Z move when it really starts
        G0 Z10 F600
        # R54: GAPLESS resume - purge -> print without the park/return dance
        # (waiting after the purge only oozes the nozzle)
        RESTORE_GCODE_STATE NAME=PAUSE_STATE
        # R58 FIX (field log .41): RESTORE_GCODE_STATE also brings back the FAN
        # and the SPEED FACTER from the pause moment -> the first layer ran with
        # fan 100% and without the layer-1 brake. Reset the fan + re-assert the
        # brake (overrides only), THEN flag 'printing' BEFORE M24 - the former
        # 'paused' window let raw file commands bypass EVERY override (the file's
        # own SET_PRESSURE_ADVANCE 0.2 overwrote YOUR PA for seconds!).
        M99106 S0
        {% if not printer['gcode_macro _STATE'].ignore_overrides
              and printer['save_variables'].variables.first_layer_speed|default(75)|float > 0
              and printer['gcode_macro _STATE'].layer|int < 2 %}
            M220 S{printer['save_variables'].variables.first_layer_speed|default(75)|float|round}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
        M24
        CLEAR_PAUSE
        NOTIFY TEXT="Old file prepared - printing continues" LEVEL=ok SOUND=r2_confirm
    {% endif %}

# -------------------------------------------------------------------------------------
# _OBJECT_PREP - sequential print ('print by object'): after the layer-1 temps were
# set at the next object's start, WAIT until they are reached, then continue.
# (called by _STATE_WATCHER via _OBJECT_PREP after the safety pause)
# -------------------------------------------------------------------------------------
[delayed_gcode _OBJECT_PREP]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode == 'paused' %}
        {% set bt = printer.heater_bed.target|float %}
        {% set ht = printer.extruder.target|float %}
        M117 Next object: heating...
        {% if bt > 0 %}TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 2}{% endif %}
        {% if ht >= 170 %}TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 3}{% endif %}
        RESUME
        RESPOND MSG="Layer-1 temperatures reached - the next object starts"
    {% endif %}

# -------------------------------------------------------------------------------------
# START_PRINT - compatibility shim: OLD mod files call START_PRINT (our macro is
# PRINT_START). The print is already prepared at that point -> friendly no-op.
# =====================================================================================
#  R51 UNIVERSAL PRINT INTERCEPT - every file is caught, whatever it is
#  -----------------------------------------------------------------------------------
#  Entry points: SDCARD_PRINT_FILE (Mainsail/Fluidd print button + moonraker API)
#  and M24 (LCD file list / console). The file is loaded and HELD at position 0 -
#  not a single command runs before the decision (R51 field fix: Klipper's
#  SDCARD_PRINT_FILE starts immediately and ignores/clears pause flags, so a
#  pre-pause could never hold it; M25 stops the reader while we hold the gcode
#  mutex). The decision rides along as 'start_pending' until the file identifies
#  itself:
#    PRINT_START            -> R2-marked file (sliced with the PP script)
#    START_PRINT            -> old mod file (its own start macro)
#    M104/M109/M140/M190    -> foreign sliced file (heats itself)
#    nothing at all         -> pure MOVEMENT file (_START_NET_PROBE catches it)
#  The old chains (watcher, PRINT_START/START_PRINT hooks) stay as fallbacks.
# =====================================================================================
[gcode_macro _SELECT_FILE]
description: Swap the held/selected file for a freshly GENERATED one (R79, internal)
gcode:
    # R79 (field log .62): after generating a range/label the OLD selection
    # stayed in the start dialog - confirming it printed the SOURCE file, not
    # the generated excerpt ('if I do that, simply the original is printed').
    # The generators now call this: the pending selection is RELEASED (never
    # deleted) and the generated file takes its place - the start dialog then
    # asks AS SLICED / AS LEGACY for the GENERATED file.
    {% set s = printer['gcode_macro _STATE'] %}
    {% set fn = params.FILE|default('')|string %}
    {% if fn == '' %}
        RESPOND MSG="_SELECT_FILE: no FILE= given"
    {% elif s.mode == 'waiting' %}
        # a start dialog holds ANOTHER file (the generator source). Cancel it
        # exactly like the waiter's cancel branch (synchronous - no race with
        # the 2s poller), then select the generated file in its place.
        SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='""'
        CANCEL_PRINT_BASE
        # R115: no TURN_OFF_HEATERS here anymore - it killed the preheat of the
        # dialog EVERY time a generator took over (.87 field log: 'the temps
        # cool down while I set up'). The SDCARD_PRINT_FILE right below calls
        # _PREHEAT_SELECTED again anyway.
        RESPOND MSG="[OK] Generated file takes over: {fn} (old selection released, nothing deleted)"
        SDCARD_PRINT_FILE FILENAME="{fn}"
    {% elif s.mode in ['idle','finished'] %}
        RESPOND MSG="[OK] Generated file selected: {fn} - choose AS LEGACY (your settings) or AS SLICED (1:1)"
        SDCARD_PRINT_FILE FILENAME="{fn}"
    {% else %}
        # printing/paused: never swap under a running print - just point at it
        RESPOND MSG="[i] Generated file ready: {fn} - start it from the file list after this print"
        M117 New file ready
    {% endif %}

[gcode_macro _PREHEAT_SELECTED]
description: Preheat to standby levels the moment a file is selected (R62, internal)
gcode:
    # R62 (field request): the moment a file is selected for printing, start
    # preheating to SAFE standby levels (nozzle 182C since R106 - hot enough to
    # SWAP FILAMENT while the start dialog waits (the extruder needs >=180C),
    # still below serious ooze; bed 60C). While you make your Pre-Print settings
    # and the dialog asks AS SLICED / AS LEGACY, the heaters are already moving.
    # The start sequence then only heats the last few degrees. Values editable:
    # Pre-Print > Preheat. Turned off -> nothing happens here.
    {% set sv = printer['save_variables'].variables %}
    {% if sv.preheat_on|default(True) %}
        {% set ph = sv.preheat_hotend|default(182)|float %}
        {% set pb = sv.preheat_bed|default(60)|float %}
        {% if pb > 0 and printer.heater_bed.target|float < pb %}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={pb|round}
        {% endif %}
        {% if ph > 0 and printer.extruder.target|float < ph %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ph|round}
            RESPOND MSG="[i] Preheating: nozzle {ph|round|int}C / bed {pb|round|int}C while you set up (filament-swap level: change filament now if you want)"
        {% endif %}
    {% endif %}

[gcode_macro _FILE_INFO_RESET]
description: Clear ALL file-parameter state - no leftovers from the previous print/selection (internal)
gcode:
    # R74 field fix (.57 log: 'always the same file info, as if stored as a
    # preset'): the file_* values used to survive until the next file RAN its
    # own _FILE_INFO line - the start dialog / Pre-Print / Live menus showed
    # the PREVIOUS file's layer height, speeds, ... Now everything resets the
    # moment a file is SELECTED; the watcher pushes THIS file's values right
    # after (see _PREVIEW_TEMPS + the watcher's _FILE_INFO replay).
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"unknown"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_material VALUE='"?"'
    # R115: a fan hold from the PREVIOUS file must not silently rule this one
    # (after every selection the Hold menu shows 0 = file values again)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_hold VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed_after VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_after VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_fan VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_layer_height VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_outer_wall_speed VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_support_speed VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_ironing_speed VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_info_seen VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width_first VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_line_width_wall VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_flow_ratio VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_by_object VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_pa VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_len VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_style VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_speed VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_types VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=absent_features VALUE=[]
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_nozzle VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_wall_loops VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_ironing_flow VALUE=0.0
    # R111: geometry classifier + CFG replay state
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_status VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_max VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_derived VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_conf VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_cover VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_maxrate VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_travel VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_seam VALUE='"-"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_seamn VALUE=0
    {% for var in ['file_speed_outer','file_speed_inner','file_speed_sparse','file_speed_top',
                   'file_speed_first','file_speed_travel','file_speed_support','file_speed_ironing',
                   'file_speed_solid','file_speed_gaps','file_speed_bridge','file_speed_skirt',
                   'file_speed_suppint','file_speed_small','file_accel_default','file_accel_outer',
                   'file_accel_inner','file_accel_sparse','file_accel_top','file_accel_small',
                   'file_accel_solid','file_accel_first','file_accel_travel',
                   'file_lw_inner','file_lw_sparse','file_lw_solid','file_lw_top','file_lw_small',
                   'file_fil_dia','file_time_slow','file_slow_min','file_fan_min','file_fan_max',
                   'file_ironing_spacing',
                   'file_feat_spd_wallouter','file_feat_spd_wallinner','file_feat_spd_infillsparse',
                   'file_feat_spd_infillsolid','file_feat_spd_surfacetop','file_feat_spd_surfacebottom',
                   'file_feat_spd_bridge','file_feat_spd_gaps','file_feat_spd_support',
                   'file_feat_spd_ironing','file_feat_spd_skirt','file_feat_spd_brim',
                   'file_feat_spd_overhangperim', 'file_feat_spd_internalbridge', 'file_feat_spd_primetower', 'file_feat_spd_custom',
                   'file_feat_acc_wallouter','file_feat_acc_wallinner','file_feat_acc_infillsparse',
                   'file_feat_acc_infillsolid','file_feat_acc_surfacetop','file_feat_acc_surfacebottom',
                   'file_feat_acc_bridge','file_feat_acc_gaps','file_feat_acc_support',
                   'file_feat_acc_ironing','file_feat_acc_skirt','file_feat_acc_brim',
                   'file_feat_acc_overhangperim', 'file_feat_acc_internalbridge', 'file_feat_acc_primetower', 'file_feat_acc_custom',] %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE={var|lower} VALUE=0.0
    {% endfor %}

[gcode_macro _PREVIEW_TEMPS]
description: File preview temps from the watcher push (internal, display only)
gcode:
    # R74: the watcher peeks the selected file's heater/fan commands and
    # pushes them here - the start dialog title and the file menus show the
    # REAL file temps at selection time (a _FILE_INFO line carries no temps).
    # NEVER touches a running print's values (paused-at-M600 etc.).
    {% if printer['gcode_macro _STATE'].mode not in ['idle','waiting','finished'] %}
        RESPOND MSG="Preview temps skipped - a print is active (mode {printer['gcode_macro _STATE'].mode})"
    {% else %}
        {% if params.HOTEND|default(0)|float > 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={params.HOTEND|float}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_after VALUE={params.HOTEND|float}
        {% endif %}
        {% if params.BED|default(0)|float > 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={params.BED|float}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed_after VALUE={params.BED|float}
        {% endif %}
        {% if params.FAN|default(0)|float > 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_fan VALUE={params.FAN|float}
        {% endif %}
    {% endif %}

[gcode_macro _UNIVERSAL_START_INTERCEPT]
description: Catch EVERY print start: hold the file + ask how to proceed (R50, internal)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fn = printer.print_stats.filename|default('') %}
    # fresh per-file state (nothing from the previous print may leak)
    # R74: ALL file_* parameters reset in one place (the old list missed
    # widths/flow/PA/speeds/accels/features - 'the same file info as a preset')
    _FILE_INFO_RESET
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=infra_done VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_marks VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_flow VALUE=100.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_accel VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_speed VALUE=100.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
    SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
    # safety baseline BEFORE anything is decided: home if needed + head up. A pure
    # movement file must never run against unhomed axes - and homing is always
    # safe (nothing is hot, nothing has been decided yet).
    {% if 'xyz' not in printer.toolhead.homed_axes|lower %}
        RESPOND MSG="[i] Print start: homing first (safe baseline before the decision)"
        G28
        G90
        {% if printer.gcode_move.gcode_position.z|float < 5 %}
            G0 Z10 F600
        {% endif %}
    {% endif %}
    # called ONLY when the dialog is wanted - the wrappers already hold the file
    # (SDCARD_PRINT_FILE: M25 at position 0 | M24 path: file loaded, not started)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"waiting"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
    SET_LED_STATE STATE=waiting
    RESPOND MSG="[i] File caught: {fn} - nothing runs before your decision"
    RESPOND MSG="Start Print? -> AS SLICED (file rules 1:1) or LEGACY (your overwrites + mesh + purge)"
    NOTIFY TEXT="Start? AS SLICED or LEGACY?" LEVEL=info LED=waiting SOUND=r2_question
    UPDATE_DELAYED_GCODE ID=_START_CONFIRM_WAITER DURATION=2

[gcode_macro _WAIT_IDLE_RESTORE]
description: Restore the configured idle_timeout after the start dialog (internal, R115/R132)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # R132 field log .92: idle_timeout_saved STARTS at 0 after every restart -
    # default(3600) never fires on a DEFINED 0 -> 'SET_IDLE_TIMEOUT TIMEOUT=0'
    # error -> the calling branch aborted -> wedged dialog. Robust chain +
    # hard floor, and remember the value for the next call.
    {% set t = s.idle_timeout_saved|default(0)|float %}
    {% if t <= 0 %}
        {% set t = printer.idle_timeout.idle_timeout|default(0)|float %}
    {% endif %}
    {% if t <= 0 %}
        {% set cfgsec = printer.configfile.settings['idle_timeout']|default({}) %}
        {% set t = cfgsec.timeout|default(0)|float %}
    {% endif %}
    {% if t <= 0 %}
        {% set t = 3600 %}
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={t|round|int}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=idle_timeout_saved VALUE={t|round(1)}

[gcode_macro SDCARD_PRINT_FILE]
description: Print button: load the file, hold it at position 0, ask first (R51)
rename_existing: BASE_SDCARD_PRINT_FILE
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set fn = params.FILENAME|default('') %}
    {% set lf = fn|lower %}
    {% set plot_src = lf.endswith('.png') or lf.endswith('.jpg') or lf.endswith('.jpeg') or lf.endswith('.svg') or lf.endswith('.pdf') or lf.endswith('.txt') %}
    {% if s.mode == 'waiting' %}
        # dialog already active - never start a second file behind its back
        RESPOND MSG="Start dialog active - decide first: AS SLICED / AS LEGACY / CANCEL"
    {% elif fn != '' and plot_src %}
        # R134: a PLOT SOURCE was selected in the file list (image / text /
        # pdf / svg) - plot mode! Not a print: no BASE start (the file is no
        # g-code), no auto-conversion either. The watcher generates
        # Vnn_Plot_*.g-code on demand like every other generator; gen_out
        # (Maintenance) decides selected-for-start vs preview only (3D view).
        # Pens, size, draw/stipple, pen vs FILAMENT mode: Tools > Plotter.
        {% if s.mode in ['idle','finished'] %}
            RESPOND MSG="Plot: {fn} selected - generating pen-plotter g-code (settings: Tools > Plotter)"
            M117 Plot: generating
            SAVE_VARIABLE VARIABLE=plot_src VALUE='"{fn|replace('"', '')}"'
            SAVE_VARIABLE VARIABLE=plot_nonce VALUE={printer['save_variables'].variables.plot_nonce|default(0)|int + 1}
        {% else %}
            # busy (printing/paused/homing...): never BASE-start an image
            RESPOND MSG="Plot: printer busy ({s.mode}) - select {fn} again when idle"
            M117 Plot: busy
        {% endif %}
    {% elif fn != '' and s.mode in ['idle','finished'] and printer['save_variables'].variables.start_confirm|default(True) %}
        # R51: load + HOLD at position 0 - the file cannot run a single command
        # before the decision. Klipper's SDCARD_PRINT_FILE starts (and even
        # clears pause flags) no matter what - so we set the guard mode FIRST
        # (the watcher must not misread the brief start flicker), then M25 stops
        # the reader synchronously: our macro holds the gcode mutex, so the
        # work handler sees must_pause_work before dispatching anything.
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"waiting"'
        _PREHEAT_SELECTED
        # R62: ask the watcher for this file's parameters - Pre-Print > File shows
        # layer height, nozzle, line width, temps... BEFORE the print starts
        SAVE_VARIABLE VARIABLE=preview_file VALUE='"{fn}"'
        SAVE_VARIABLE VARIABLE=preview_nonce VALUE={printer['save_variables'].variables.preview_nonce|default(0)|int + 1}
        BASE_SDCARD_PRINT_FILE FILENAME="{fn}"
        M25
        _UNIVERSAL_START_INTERCEPT
    {% else %}
        BASE_SDCARD_PRINT_FILE FILENAME="{fn}"
    {% endif %}

[gcode_macro M24]
description: Start/resume SD print - fresh starts ask first (R51)
rename_existing: M9924
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set fresh = printer.print_stats.state in ['standby','complete','cancelled']
                  and printer.print_stats.filename != ''
                  and s.mode in ['idle','finished'] %}
    {% if s.mode == 'waiting' %}
        RESPOND MSG="Start dialog active - decide first: AS SLICED / AS LEGACY / CANCEL"
    {% elif fresh and printer['save_variables'].variables.start_confirm|default(True) %}
        # LCD file list / console: file loaded (M23) but not started - ask first.
        # The decision then starts it via M24 (mode is 'printing' by then).
        # R74: push this file's parameters too (the SDCARD_PRINT_FILE path has
        # done this since R62 - an M23/M24 start never refreshed the preview)
        SAVE_VARIABLE VARIABLE=preview_file VALUE='"{printer.print_stats.filename|default("")}"'
        SAVE_VARIABLE VARIABLE=preview_nonce VALUE={printer['save_variables'].variables.preview_nonce|default(0)|int + 1}
        _PREHEAT_SELECTED
        _UNIVERSAL_START_INTERCEPT
    {% else %}
        M9924
    {% endif %}

# =====================================================================================
#  _START_NET_PROBE - after the decision the file gets a few seconds to identify
#  itself. Still nothing at all (no heaters, no start macro) = pure MOVEMENT file
#  -> it gets the full infrastructure: home + heat + purge (R50).
# =====================================================================================
[delayed_gcode _START_NET_PROBE]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if printer.print_stats.state == 'printing' and s.mode == 'printing' and s.legacy_armed %}
        # R72: a heater command ARMED the takeover (M190/M109/M140) and no
        # START_PRINT has arrived yet. One grace tick (4s - a hot file's
        # START_PRINT follows its M109 within seconds), then take over HERE:
        # our PAUSE/do_pause waits for the currently running (usually M109)
        # line to finish, so the pause always lands HOT - never at the standby.
        {% if s.probe_stage == 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=1
            UPDATE_DELAYED_GCODE ID=_START_NET_PROBE DURATION=4
            RESPOND MSG="[i] AS LEGACY armed - waiting for the file's START_PRINT (grace 4s)"
        {% else %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
            {% set svl = printer['save_variables'].variables %}
            {% if svl.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
                RESPOND MSG="[i] AS LEGACY takeover now (no START_PRINT came - the file heated itself)"
                _LEGACY_PREP
            {% elif 'gcode_macro _LEGACY_HOME' in printer %}
                RESPOND MSG="[i] AS LEGACY takeover now: home + purge (no START_PRINT came)"
                _LEGACY_HOME
            {% endif %}
        {% endif %}
    {% elif printer.print_stats.state == 'printing' and s.start_pending != '' and s.file_type == 'unknown' %}
        {% if s.has_heaters %}
            # foreign sliced file: it heats itself (its M-commands are redirected
            # live when AS LEGACY was chosen) - nothing more to do here.
            # NOTE: start_pending STAYS - an old mod file's START_PRINT call may
            # still come minutes from now and needs the decision.
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
            RESPOND MSG="[i] File identified: own heater commands - 1:1 / live overwrites"
        {% elif s.probe_stage == 1 %}
            # nothing yet - a slow G28 may still be running. Second look in 7s.
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=2
            UPDATE_DELAYED_GCODE ID=_START_NET_PROBE DURATION=7
        {% else %}
            # ---------------- pure MOVEMENT file: no heaters, no start macro --------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"movement"'
            _MOVEMENT_START APPLY={0 if s.start_pending == 'as_sliced' else 1}
        {% endif %}
    {% endif %}

# =====================================================================================
#  _MOVEMENT_START - infrastructure for pure movement files (no heating, no start
#  gcode at all): home + heat (overwrites > material preset) + mesh + purge line,
#  then the file rules. AS SLICED = material preset temps (the file has none).
# =====================================================================================
[gcode_macro _MOVEMENT_START]
description: Pure movement file: home + heat + purge infrastructure (R50, internal)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    {% set mat = sv.material|default('PLA')|string|upper %}
    {% set apply = params.APPLY|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    # temps: AS LEGACY -> your overwrites, AS SLICED (file has none) -> preset
    {% set bt = 0 %}{% set ht = 0 %}
    {% if apply %}
        {% if sv.ov_bed_on|default(False) %}{% set bt = sv.ov_bed|float %}{% endif %}
        {% if sv.ov_hotend_first_on|default(False) %}{% set ht = sv.ov_hotend_first|float %}{% endif %}
    {% endif %}
    {% if bt <= 0 %}{% set bt = db[mat].bed1|float if mat in db else 60 %}{% endif %}
    {% if ht <= 0 %}{% set ht = db[mat].hot1|float if mat in db else 210 %}{% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={bt}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={ht}
    PAUSE_BASE
    NOTIFY TEXT="Movement file: home + heat + purge infrastructure" LEVEL=info LED=leveling SOUND=r2_leveling
    {% if 'xyz' not in printer.toolhead.homed_axes|lower %}
        {% if sv.gantry_sync_print|default(False) and 'gcode_macro SYNC_GANTRY' in printer
              and 'stepper_z1' not in printer.configfile.settings %}
            SYNC_GANTRY QUIET=1 FORCE=1
        {% endif %}
        G28
        {% if sv.zt_print|default(False) and 'stepper_z1' in printer.configfile.settings
              and 'z_tilt' in printer.configfile.settings %}
            Z_TILT QUIET=1
        {% endif %}
    {% endif %}
    G90
    {% set zpark = [printer.toolhead.axis_maximum.z - 5, 40]|min|float %}
    {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z{zpark|round(0)} F600{% endif %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bt|round}
    NOTIFY TEXT="Heating bed to {bt|round|int}C..." LEVEL=info LED=heating
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 2}
    _CALIBRATE_MESH_PROFILE PROFILE=r2
    G90
    {% if 'z' in printer.toolhead.homed_axes|lower %}G0 Z10 F600{% endif %}
    NOTIFY TEXT="Heating hotend to {ht|round|int}C for purge..." LEVEL=info LED=heating SOUND=r2_heating
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ht|round}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 1}
    G4 P3000
    {% if apply %}
        _APPLY_OVERRIDES_CORE
        {% if sv.first_layer_speed|default(75)|float > 0 %}
            M220 S{sv.first_layer_speed|default(75)|float|round}
        {% endif %}
    {% endif %}
    _PRIME_LINE
    G90
    G0 Z10 F600
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=infra_done VALUE=True
    RESTORE_GCODE_STATE NAME=PAUSE_STATE
    # R58: clean start state (fan off) + printing flag BEFORE M24 (see PREP2)
    M99106 S0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    M24
    CLEAR_PAUSE
    SET_LED_STATE STATE=printing
    RESPOND MSG="=== MOVEMENT file: homed, {bt|round|int}C/{ht|round|int}C, purged - the file rules from here ==="

# =====================================================================================
#  _LEGACY_AS_SLICED - legacy file printed AS SLICED: the file rules 1:1, but the
#  old START_PRINT macro used to do home + heat + purge as infrastructure (R48
#  field fix) - without it these files crash on their first move/extrusion.
#  Works from the dialog (file held) AND from the file's own START_PRINT call
#  while it is already flowing (PAUSE_BASE is a no-op when already paused).
# =====================================================================================
[gcode_macro _LEGACY_AS_SLICED]
description: Legacy file AS SLICED: home + file temps + purge, then the file rules (R48/R50)
gcode:
    {% set s   = printer['gcode_macro _STATE'] %}
    {% set svl = printer['save_variables'].variables %}
    {% set fn  = printer.print_stats.filename|default('') %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    PAUSE_BASE
    {% set ha = printer.toolhead.homed_axes|lower %}
    {% if 'x' not in ha or 'y' not in ha or 'z' not in ha %}
        {% if svl.gantry_sync_print|default(False) and 'gcode_macro SYNC_GANTRY' in printer
              and 'stepper_z1' not in printer.configfile.settings %}
            SYNC_GANTRY QUIET=1 FORCE=1
        {% endif %}
        RESPOND MSG="AS SLICED: homing first (the old START_PRINT would have)"
        G28
        {% if svl.zt_print|default(False) and 'stepper_z1' in printer.configfile.settings
              and 'z_tilt' in printer.configfile.settings %}
            Z_TILT QUIET=1
        {% endif %}
    {% endif %}
    {% set bt = printer.heater_bed.target|float %}
    {% set ht = printer.extruder.target|float %}
    {% if bt >= 40 %}
        NOTIFY TEXT="AS SLICED: waiting for bed {bt|round|int}C (file value)" LEVEL=info LED=heating
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bt - 2}
    {% endif %}
    {% if ht >= 170 %}
        NOTIFY TEXT="AS SLICED: waiting for hotend {ht|round|int}C (file value)" LEVEL=info LED=heating SOUND=r2_heating
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ht - 1}
        G4 P3000
    {% endif %}
    _PRIME_LINE
    G90
    G0 Z10 F600
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_file VALUE='"{fn}"'
    RESTORE_GCODE_STATE NAME=PAUSE_STATE
    # R58: clean start state (fan off) + printing flag BEFORE M24 (see PREP2)
    M99106 S0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    M24
    CLEAR_PAUSE
    SET_LED_STATE STATE=printing
    _SOUND_LIB NAME=r2_printing
    RESPOND MSG="=== LEGACY file AS SLICED: homed, file temps, purged - the file rules ==="

[gcode_macro START_PRINT]
description: OLD mod files call this: real legacy start (marked files: no-op)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fn = printer.print_stats.filename|default('') %}
    {% if s.file_type == 'marked' %}
        # marked file: PRINT_START (R2) already prepared everything
        RESPOND MSG="START_PRINT ignored - this file was prepared by PRINT_START (R2)"
    {% elif printer.print_stats.state not in ['printing','paused'] %}
        RESPOND MSG="START_PRINT outside a print: nothing to prepare (new files start with PRINT_START)"
    {% elif s.legacy_armed %}
        # ------------------------------------------------------------------
        # R72 FIELD FIX (log .55): a heater command ARMED the takeover - this file
        # heats + primes ITSELF, its M109 just finished right before us. Taking
        # over HERE is always HOT; the old first-heater takeover paused the file
        # cold at the 170C standby and died in 'Extrude below minimum temp'.
        # ------------------------------------------------------------------
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
        {% if sv.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
            RESPOND MSG="[i] START_PRINT: file is hot - AS LEGACY takeover (level + purge + overwrites)"
            _LEGACY_PREP
        {% elif 'gcode_macro _LEGACY_HOME' in printer %}
            RESPOND MSG="[i] START_PRINT: file is hot - AS LEGACY takeover (home + purge + overwrites)"
            _LEGACY_HOME
        {% endif %}
    {% elif fn != '' and s.legacy_file == fn %}
        # already prepared for THIS file (dialog answer or auto-prep ran)
        RESPOND MSG="START_PRINT: this file is already prepared - printing continues"
    {% else %}
        # ------------------------------------------------------------------
        # R48 FIELD FIX: an OLD MOD file calls START_PRINT as its own start
        # command - the old macro did the WHOLE start (home, heat+wait, mesh,
        # purge). Treating it as a no-op made these files CRASH: their first
        # Z move hit unhomed axes ("Must home axis first") and their prime
        # extruded cold ("Extrude below minimum temp"). HONOR the call:
        # legacy start - ask (start_confirm ON) or auto-prep like the old days.
        # ------------------------------------------------------------------
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        RESPOND MSG="[i] START_PRINT (old macro name): legacy start - home/heat/purge via R2"
        {% if s.start_pending == 'as_sliced' %}
            # R50: the decision was already made at the universal intercept
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
            RESPOND MSG="[i] AS SLICED decided: home + file temps + purge, then the file rules"
            _LEGACY_AS_SLICED
        {% elif s.start_pending != '' %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
            RESPOND MSG="[i] AS LEGACY decided: system takeover (level + purge + overwrites)"
            {% if sv.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
                _LEGACY_PREP
            {% elif 'gcode_macro _LEGACY_HOME' in printer %}
                _LEGACY_HOME
            {% endif %}
        {% elif sv.start_confirm|default(True) %}
            _LEGACY_DIALOG
        {% else %}
            {% if sv.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
                _LEGACY_PREP
            {% elif 'gcode_macro _LEGACY_HOME' in printer %}
                _LEGACY_HOME
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _PROBE_STOW]
description: Hook - stow/dock the probe before the purge line (EDIT for dockable probes!)
gcode:
    # BLTouch / CR-Touch / inductive probes: Klipper stows the pin itself after
    # probing - there is nothing to do here.
    # Klicky / Euclid (dockable probe): uncomment your dock macro so the probe is
    # never hanging beside the nozzle while the purge line runs:
    # DOCK_PROBE

# =====================================================================================
#  _PRIME_LINE - purge/prime line, PROBE-SAFE (R45):
#   - drawn along X, STARTING at the RIGHT end, moving toward x=0
#   - any Y move only ever INCREASES Y (nothing sweeps backwards over the bed edge)
#   - the probe offset ([probe] x_offset/y_offset) is respected: nozzle AND probe
#     stay inside the bed for the whole line (margin 5mm) - a side-mounted probe
#     can no longer slam into the bed frame at the line start.
# =====================================================================================
[gcode_macro _PRIME_LINE]
description: Purge/prime line: nozzle wipe + X only, right -> toward x=0, probe-aware
gcode:
    {% set lh = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set flush = params.FLUSH|default(6)|float %}      # mm filament pressed out BEFORE the line
    # R53: heat + zigzag wipe on the silicone pad FIRST (every purge path cleans
    # the nozzle) - the caller has already heated to purge temperature, so this
    # only wipes + parks high, then the line is drawn with a clean tip.
    _NOZZLE_WIPE
    _PROBE_STOW
    # ---- probe-safe window: nozzle AND probe stay on the REAL bed (margin 5mm).
    #      R92: the axis limits are lifted on this machine (meshing rides beyond
    #      the plate) - [gcode_macro _R2_CONFIG] in printer.cfg is the truth
    #      (R104.2: a raw [r2_postproc] section HALTS Klipper - unknown section!),
    #      Ender-3 fallback
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set bx0 = rc.bed_min_x|default(0)|float if rc else 0.0 %}{% set bx1 = rc.bed_max_x|default(220)|float if rc else 220.0 %}
    {% set by0 = rc.bed_min_y|default(-3)|float if rc else -3.0 %}{% set by1 = rc.bed_max_y|default(217)|float if rc else 217.0 %}
    {% set probe_da = 'probe' in printer.configfile.settings %}
    {% set px = printer.configfile.settings.probe.x_offset|default(0)|float if probe_da else 0.0 %}
    {% set py = printer.configfile.settings.probe.y_offset|default(0)|float if probe_da else 0.0 %}
    {% set xmin = [bx0, bx0 - px]|max|float + 5 %}
    {% set xmax = [bx1, bx1 - px]|min|float - 5 %}
    {% set ymin = [by0, by0 - py]|max|float + 5 %}
    {% set ymax = [by1, by1 - py]|min|float - 5 %}
    # default: front edge, START at the RIGHT end, up to 110mm toward x=0
    {% set xs = [xmax, xmin + 110]|min %}{% set xe = xmin %}{% set y = ymin + 3 %}
    {% if 'exclude_object' in printer and printer['exclude_object'].objects|length > 0 %}
        {% set ns = namespace(minx=9999, miny=9999, maxx=-9999, maxy=-9999) %}
        {% for o in printer['exclude_object'].objects %}
            {% for pt in o.polygon %}
                {% if pt[0] < ns.minx %}{% set ns.minx = pt[0] %}{% endif %}
                {% if pt[0] > ns.maxx %}{% set ns.maxx = pt[0] %}{% endif %}
                {% if pt[1] < ns.miny %}{% set ns.miny = pt[1] %}{% endif %}
                {% if pt[1] > ns.maxy %}{% set ns.maxy = pt[1] %}{% endif %}
            {% endfor %}
        {% endfor %}
        # R49 placement: pick the option with the LONGEST line - field log .32:
        # only ~56mm fit beside the objects ("purge line barely visible"), while
        # the FRONT strip below the objects had the full 110mm. Options: front
        # strip (10mm below the objects), left of them, right of them.
        # Always drawn from the RIGHT end toward x=0 - the probe never leads off.
        {% set len_l = 0 %}{% set len_r = 0 %}{% set len_f = 0 %}
        {% if ns.minx - 30 >= xmin %}{% set len_l = (ns.minx - 10) - [xmin, ns.minx - 120]|max %}{% endif %}
        {% if ns.maxx + 30 <= xmax %}{% set len_r = [xmax, ns.maxx + 120]|min - (ns.maxx + 10) %}{% endif %}
        {% set y_f = ns.miny - 10 %}
        {% if y_f >= ymin + 2 %}{% set len_f = [xmax - xmin, 110]|min %}{% endif %}
        {% if len_f >= [len_l, len_r]|max %}
            {% set xs = [xmin + 110, xmax]|min %}{% set xe = xmin %}{% set y = y_f %}
            {% set place = 'front below objects' %}
        {% elif len_l >= len_r and len_l > 0 %}
            {% set xs = ns.minx - 10 %}{% set xe = [xmin, ns.minx - 120]|max %}
            {% if ns.miny > ymin %}{% set y = [ns.miny, ymax]|min %}{% endif %}
            {% set place = 'left of objects' %}
        {% elif len_r > 0 %}
            {% set xe = ns.maxx + 10 %}{% set xs = [xmax, ns.maxx + 120]|min %}
            {% if ns.miny > ymin %}{% set y = [ns.miny, ymax]|min %}{% endif %}
            {% set place = 'right of objects' %}
        {% endif %}
        RESPOND MSG="Prime line X{xe|round}-{xs|round} Y{y|round} {place} ({(xs - xe)|round(0)}mm, objects X{ns.minx|round}..{ns.maxx|round} Y{ns.miny|round}..{ns.maxy|round}, probe offset {px|round(0)}/{py|round(0)})"
    {% else %}
        RESPOND MSG="Prime line X{xe|round}-{xs|round} Y{y|round} (front edge, probe offset {px|round(0)}/{py|round(0)})"
    {% endif %}
    NOTIFY TEXT="Prime line: {flush}mm flush + fat line (right -> x0)..." LEVEL=info
    SAVE_GCODE_STATE NAME=PRIME_S
    G90
    M83
    G0 X{xs|round(1)} Y{y|round(1)} F6000
    G0 Z{lh|round(2)} F300
    G4 P200
    # 1) FLUSH: refill the molten pocket (the ooze loss from heating) - lands at the
    #    line start, presses debris/dirt out of the nozzle -> clean tip for the line
    G1 E{flush} F150
    G4 P400
    # 2) the FAT line (1.2mm wide): toward x=0 - with the clamped window the probe
    #    can never leave the bed, no matter how far it is offset sideways
    G1 X{xe|round(1)} E{((xs - xe) * lh * 1.2 / 2.405)|round(2)} F1200
    # 3) DE-OOZE handover (field log .73): -2.5mm alone could not kill the
    #    flush overpressure - 2-3mm kept dripping until the print began and
    #    spoiled the first layer. Retract DEEPER, then push back SLOWLY to a
    #    net -0.5mm: the travel to the object stays dry and the file's own
    #    first extrusion invisibly fills the missing 0.5mm (RESTORE_GCODE_STATE
    #    also resets the E bookkeeping - the file never sees our moves).
    G1 E-3.5 F2400
    G1 E3.0 F300
    RESTORE_GCODE_STATE NAME=PRIME_S   # back up (Z), modes/E mapping clean

# =====================================================================================
#  PRINT_END - called by the slicer end gcode (just: "PRINT_END")
# =====================================================================================
[gcode_macro _CAPTURE_PRINT_SETTINGS]
description: Sync LIVE-tuned values back into the pre-print overrides (R62, internal)
gcode:
    # R62 (field request): after a successful print the settings that ACTUALLY
    # ran (including live tuning during the print) stay visible in Pre-Print -
    # so "Save as Default" stores exactly what the print used. Only values that
    # were live-changed are written back (PA / flow / accel / velocity).
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set cfg_e = printer.configfile.settings['extruder'] if 'extruder' in printer.configfile.settings else {} %}
    {% set cfg_p = cfg_e.get('pressure_advance', 0.0)|float %}
    {% set pa = s.pa_value|default(0)|float %}
    {% if pa > 0 and (pa - cfg_p)|abs > 0.001 %}
        SAVE_VARIABLE VARIABLE=ov_pa VALUE={pa}
        SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
        RESPOND MSG="[capture] PA live-tuned to {pa|round(4)} -> stored in Pre-Print"
    {% endif %}
    {% set fl = s.flow|default(100)|float %}
    {% if (fl - 100)|abs > 0.5 %}
        SAVE_VARIABLE VARIABLE=ov_flow VALUE={fl}
        SAVE_VARIABLE VARIABLE=ov_flow_on VALUE=True
        RESPOND MSG="[capture] flow {fl|round(0)}% -> stored in Pre-Print"
    {% endif %}
    {% set ac = s.a_global|default(0)|float %}
    {% if ac > 0 and (ac - sv.ov_accel|default(0)|float)|abs > 1 %}
        SAVE_VARIABLE VARIABLE=ov_accel VALUE={ac}
        SAVE_VARIABLE VARIABLE=ov_accel_on VALUE=True
        RESPOND MSG="[capture] accel {ac|round(0)} mm/s2 -> stored in Pre-Print"
    {% endif %}
    RESPOND MSG="[capture] print settings kept in Pre-Print - SAVE_DEFAULT_PRESET stores them as a preset"

[gcode_macro PRINT_END]
description: Print end: fanfare, stats, cool-down, pending PID tuning
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set ps = printer.print_stats %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"finished"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"unknown"'
    # R62: keep the settings this print actually used in Pre-Print (live tuning included)
    _CAPTURE_PRINT_SETTINGS
    # R109: and remember them for THIS file - the 'post' profile (the manual
    # 'pre' profile is never touched). Applied automatically on the next select.
    _FILE_PROFILE_AUTOSAVE
    # R111 safety: never leave a feature PA or a shaper-off active after a print
    {% if s.pa_feat_active|default(False) %}
        {% set rpa = sv.ov_pa|default(0)|float if sv.ov_pa_on|default(False) else printer.extruder.pressure_advance|default(0)|float %}
        {% if rpa > 0 %}SET_PRESSURE_ADVANCE_BASE ADVANCE={rpa|round(4)}{% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
    {% endif %}
    {% if s.shaper_off_active|default(False) and 'input_shaper' in printer %}
        SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
    {% endif %}
    # ---- stats ------------------------------------------------------------------------------
    {% set d = ps.print_duration|float %}
    {% set h = (d / 3600)|int %}{% set m = ((d % 3600) / 60)|int %}
    RESPOND MSG="=== PRINT DONE: {ps.filename|default('?')} ==="
    RESPOND MSG="Duration: {h}h {m}min | filament: {(ps.filament_used / 1000.0)|round(2)} m | layers: {s.layer}"
    # ---- celebration --------------------------------------------------------------------------
    SET_LED_STATE STATE=finished
    # celebration for led_finish_time seconds (default 10), then back to idle
    # breathing (R46: the twinkle used to run FOREVER - nothing returned to idle)
    UPDATE_DELAYED_GCODE ID=_LED_TO_IDLE DURATION={sv.led_finish_time|default(10)|float}
    _SOUND_LIB NAME=r2_done
    M117 Done: {h}h{m}m {ps.filament_used|round(0)}mm
    # ---- part fan cool-down ---------------------------------------------------------------------
    {% if sv.cooldown_fan_time|default(30)|float > 0 %}
        M99106 S255
        UPDATE_DELAYED_GCODE ID=_END_FAN_OFF DURATION={sv.cooldown_fan_time|default(30)|float}
    {% endif %}
    # ---- heaters off -------------------------------------------------------------------------------
    {% if sv.heaters_off_at_end|default(True) %}
        M99104 S0
        M99140 S0
        RESPOND MSG="Heaters off"
    {% endif %}
    # ---- R160b (.120 field log): ALL state cleanup BEFORE the presentation
    #      move - a move that gets refused (e.g. 'not homed' after a wedged
    #      start) must never leave the mode stuck ('finished' forever = LEDs
    #      twinkling, motors-on timers dead, the next generation blocked).
    # ---- restore idle timeout (a pause may have set it to 'infinite') ----
    _RESTORE_IDLE_TIMEOUT
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
    # ---- full state cleanup (R46): NOTHING of this print may bother the next -------------
    # (cancels arming, flags, pause bookkeeping, live tuning; deliberately KEPT:
    #  your pre-print settings, material selection and the loaded bed mesh)
    _PRINT_CLEANUP
    # ---- present the part (bed forward, head aside, lift a bit) ---------------------------------------
    # R104: position clamped to the axes (a fixed Y228 would crash on beds < 232mm)
    #      and optionally from [gcode_macro _R2_CONFIG] variable_present_x/y
    #      (defaults 10/228 = the reference machine, so nothing changes here)
    # R160b: only with homed axes - otherwise the move ERRORS in the console
    #      (the field log's 'something with homing' after the print) and
    #      aborts whatever comes after it.
    {% set rc_e = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set pres_x = rc_e.present_x|default(10)|float if rc_e else 10.0 %}
    {% set pres_y = rc_e.present_y|default(228)|float if rc_e else 228.0 %}
    {% set ha160 = printer.toolhead.homed_axes|default('') %}
    {% if 'x' in ha160 and 'y' in ha160 and 'z' in ha160 %}
        SAVE_GCODE_STATE NAME=END_S
        G90
        G0 Z{[printer.gcode_move.gcode_position.z + 15, printer.toolhead.axis_maximum.z - 2]|min|round(1)} F600
        G0 X{[[pres_x, printer.toolhead.axis_maximum.x - 4]|min, printer.toolhead.axis_minimum.x + 2]|max|round(0)|int} Y{[[pres_y, printer.toolhead.axis_maximum.y - 4]|min, printer.toolhead.axis_minimum.y + 2]|max|round(0)|int} F6000
        RESTORE_GCODE_STATE NAME=END_S
    {% else %}
        RESPOND MSG="[i] Presentation move skipped - axes not homed (a start failed earlier?)"
    {% endif %}
    # ---- disable motors later --------------------------------------------------------------------------
    {% if sv.motors_off_at_end|default(True) %}
        UPDATE_DELAYED_GCODE ID=_END_MOTORS DURATION=60
    {% endif %}
    # ---- persist a mesh that was measured during this print --------------------------------
    # (PID's SAVE_CONFIG would persist it too - avoid a double restart)
    {% if s.mesh_saved_pending %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_saved_pending VALUE=False
        {% if sv.mesh_auto_save|default(False) %}
            RESPOND MSG="Mesh auto-save ON: persisting the mesh (Klipper restarts once)"
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Mesh stays loaded for this SESSION (not saved - no restart). Keep it permanent: Pre-Print > Bed Mesh > 'Save after print' or System > Save config"
        {% endif %}
    {% endif %}

[delayed_gcode _END_FAN_OFF]
gcode:
    # R46 guard: a NEW print may already be running when this fires - then its
    # part fan must NOT be switched off (mode is only 'idle' between prints)
    {% if printer['gcode_macro _STATE'].mode == 'idle' %}
        M99106 S0
        RESPOND MSG="Part fan off"
    {% endif %}

[delayed_gcode _END_MOTORS]
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'idle' %}
        M84
        RESPOND MSG="Motors off"
    {% endif %}

# =====================================================================================
#  _SYSTEM_BOOT - greeting after Klipper boot (R2 wakes up)
# =====================================================================================
[delayed_gcode _SYSTEM_BOOT]
initial_duration: 12
gcode:
    SET_LED_STATE STATE=boot
    _SOUND_LIB NAME=r2_start
    M117 R2-D2 ready!
    UPDATE_DELAYED_GCODE ID=_BOOT_IDLE DURATION=6
    {% if printer['save_variables'].variables.gantry_sync_boot|default(False) %}
        UPDATE_DELAYED_GCODE ID=_BOOT_ZSYNC DURATION=10
    {% endif %}
    {% if printer['save_variables'].variables.zt_boot|default(False) %}
        UPDATE_DELAYED_GCODE ID=_BOOT_ZTILT DURATION=10
    {% endif %}

[delayed_gcode _BOOT_IDLE]
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'idle' %}
        SET_LED_STATE STATE=idle
    {% endif %}

[delayed_gcode _BOOT_ZSYNC]
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'idle' and 'stepper_z1' not in printer.configfile.settings %}
        SYNC_GANTRY QUIET=1
    {% endif %}

[delayed_gcode _BOOT_ZTILT]
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'idle' and 'stepper_z1' in printer.configfile.settings
          and 'z_tilt' in printer.configfile.settings %}
        Z_TILT QUIET=1
        RESPOND MSG="Z tilt after boot: done"
    {% endif %}

