# =====================================================================================
#  04_notify.cfg - Central feedback system (LCD + Mainsail + LEDs + sound)
#  -----------------------------------------------------------------------------------
#  Every important event goes through NOTIFY and is sent to ALL channels at once:
#    - the 12864 LCD (M117 - ASCII English only, the display cannot show umlauts)
#    - the Mainsail console (RESPOND)
#    - optional LED state (LED=...) and sound (SOUND=...)
#
#  Example:
#    NOTIFY TEXT="Heating bed to 60C" LEVEL=info LED=heating SOUND=r2_heating
# =====================================================================================
[gcode_macro NOTIFY]
description: Central notification: LCD + Mainsail + optional LED & sound
gcode:
    {% set text  = params.TEXT|default('...') %}
    {% set level = params.LEVEL|default('info') %}
    {% set led   = params.LED|default('') %}
    {% set sound = params.SOUND|default('') %}
    # ---- prefix per level (ASCII only, LCD safe) -------------------------------------
    {% if level == 'ok' %}       {% set pre = '[OK] '   %}
    {% elif level == 'warn' %}   {% set pre = '[!]  '   %}
    {% elif level == 'error' %}  {% set pre = '[X]  '   %}
    {% else %}                   {% set pre = '[i]  '   %}
    {% endif %}
    # ---- 1) Mainsail / console ---------------------------------------------------------
    RESPOND MSG="{pre}{text}"
    # ---- 2) LCD (only ~20 chars visible - keep short, ASCII only!) ----------------------
    M117 {pre}{'%s' % (text|truncate(22, true, ''))}
    # ---- 3) LED state (optional) ---------------------------------------------------------
    {% if led != '' %}SET_LED_STATE STATE={led}{% endif %}
    # ---- 4) sound (optional) ----------------------------------------------------------------
    {% if sound != '' %}_SOUND_LIB NAME={sound}{% endif %}

# -------------------------------------------------------------------------------------
# SHOW_STATUS - full status report: all important settings at a glance
# -------------------------------------------------------------------------------------
[gcode_macro SHOW_STATUS]
description: Show all current settings and states (console)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    RESPOND MSG="================ PRINTER STATUS ================"
    {% if 'gcode_macro _R2_VERSION' in printer %}
        RESPOND MSG="R2-D2 macro system: {printer['gcode_macro _R2_VERSION'].version}"
    {% else %}
        RESPOND MSG="R2-D2 macro system: OLD/MIXED VERSION - 01_state.cfg is outdated, upload the current package!"
    {% endif %}
    RESPOND MSG="Mode: {s.mode} | Layer: {s.layer} | Feature: {s.current_type}"
    RESPOND MSG="Material: {sv.material|default('PLA')} | File material: {s.file_material}"
    RESPOND MSG="File temps: bed {s.file_bed}/{s.file_bed_after}C  hotend {s.file_hotend_first}/{s.file_hotend_after}C"
    RESPOND MSG="File: {('MARKED' if s.file_type == 'marked' else 'LEGACY' if s.file_type == 'legacy' else '?')} | layer {s.file_layer_height}x{s.total_layers if s.total_layers > 0 else '?'} | width {s.file_line_width if s.file_line_width > 0 else '?'} (first {s.file_line_width_first if s.file_line_width_first > 0 else '-'}, wall {s.file_line_width_wall if s.file_line_width_wall > 0 else '-'}) | flow ratio {s.file_flow_ratio if s.file_flow_ratio > 0 else '?'} | PA {s.file_pa} | retract {s.file_retract_len}@{s.file_retract_speed ~ (' (firmware G10/G11)' if s.file_retract_style == 'fw' else ' (FIXED -> G10/G11)' if s.file_retract_style == 'fixed' else ' (slicer moves - Pre-Print > File: RetFix!)' if s.file_retract_style == 'slicer' else '')} | by object {'YES' if s.file_by_object else 'no'} (values of THIS file - overwrite them in Pre-Print)"
    # R213: ANY feature override counts - incl. the numbered C1..C9 slots.
    # The old explicit 16-code chain missed them and lied 'NONE'.
    {% set ovf_any213 = namespace(f=False) %}
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% if sv['ovf_' ~ c ~ '_on']|default(False) %}{% set ovf_any213.f = True %}{% endif %}
    {% endfor %}
    RESPOND MSG="Overwrites ON: {% if sv.ov_bed_on|default(False) and sv.ov_bed|default(0)|float > 0 %}Bed({sv.ov_bed|round|int}C) {% endif %}{% if sv.ov_bed_after_on|default(False) and sv.ov_bed_after|default(0)|float > 0 %}BedAfter({sv.ov_bed_after|round|int}C) {% endif %}{% if sv.ov_hotend_first_on|default(False) and sv.ov_hotend_first|default(0)|float > 0 %}HotendFirst({sv.ov_hotend_first|round|int}C) {% endif %}{% if sv.ov_hotend_after_on|default(False) and sv.ov_hotend_after|default(0)|float > 0 %}HotendAfter({sv.ov_hotend_after|round|int}C) {% endif %}{% if sv.ov_retract_len_on|default(False) and sv.ov_retract_len|default(0)|float > 0 %}RetractLen({sv.ov_retract_len}mm) {% endif %}{% if sv.ov_retract_speed_on|default(False) %}RetractSpd({sv.ov_retract_speed}) {% endif %}{% if sv.ov_unretract_speed_on|default(False) %}UnretractSpd({sv.ov_unretract_speed}) {% endif %}{% if sv.ov_pa_on|default(False) %}PA({sv.ov_pa}) {% endif %}{% if sv.ov_pa_smooth_on|default(False) %}PASmooth({sv.ov_pa_smooth}) {% endif %}{% if sv.ov_accel_on|default(False) %}Accel({sv.ov_accel}) {% endif %}{% if sv.ov_flow_on|default(False) %}Flow({sv.ov_flow|round|int}%) {% endif %}{% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}{% if sv['ovf_' ~ c ~ '_on']|default(False) %}{c|upper}({sv['ovf_' ~ c ~ '_spd']|default(100)|round|int}%) {% endif %}{% endfor %}{% if sv.ov_ironing_flow_on|default(False) %}IronFlow({sv.ov_ironing_flow|round|int}%) {% endif %}{% if sv.ov_fan_on|default(False) %}FanL2({sv.ov_fan|round|int}%) {% endif %}{% if not (sv.ov_bed_on|default(False) or sv.ov_bed_after_on|default(False) or sv.ov_hotend_first_on|default(False) or sv.ov_hotend_after_on|default(False) or sv.ov_retract_len_on|default(False) or sv.ov_retract_speed_on|default(False) or sv.ov_unretract_speed_on|default(False) or sv.ov_pa_on|default(False) or sv.ov_pa_smooth_on|default(False) or sv.ov_accel_on|default(False) or sv.ov_flow_on|default(False) or sv.ov_fan_on|default(False) or sv.ov_ironing_flow_on|default(False) or ovf_any213.f) %}NONE (file printed 1:1){% endif %}"
    RESPOND MSG="Klipper NOW (what really runs): PA {printer.extruder.pressure_advance|default(0)|float|round(4)} | smooth {printer.extruder.smooth_time|default(s.pa_smooth|default(0.04))|float|round(3)} | flow {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}% | speed {(printer.gcode_move.speed_factor|default(1)*100)|round|int}% | accel {printer.toolhead.max_accel|default(0)|int} - these are the LIVE values, LCD Live Tuning shows the same"
    RESPOND MSG="Mesh: {sv.mesh_last_profile|default('?')} (mode {sv.mesh_mode|default('ON' if sv.mesh_always|default(True) else 'AUTO')|string|upper}, adaptive {'on' if sv.mesh_adaptive|default(True) else 'off'})"
    RESPOND MSG="Nozzle LED: {sv.nozzle_mode|default('auto')|string|upper} | bright {(sv.nozzle_bright|default(1.0)|float*100)|round|int}% | color ({sv.nozzle_r|default(0.9)|float|round(2)},{sv.nozzle_g|default(0.9)|float|round(2)},{sv.nozzle_b|default(0.85)|float|round(2)}) - set: NOZZLE_LED MODE=on/off/auto BRIGHT=0-1 R= G= B= (LCD: Quick Macros > Nozzle LED)"
    M117 Status -> see console

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V04_NOTIFY]
description: Version sentinel of 04_notify.cfg (internal)
gcode:
