# =====================================================================================
#  03_leds.cfg - R2-D2 style Neopixel effects (library: klipper-led_effect)
#  -----------------------------------------------------------------------------------
#  REQUIREMENT: klipper-led_effect (julianschill) installed. The [neopixel] section
#  itself lives in printer.cfg (see printer.cfg.example):
#     [neopixel printer_leds]  pin: PA8   chain_cnt: 5
#     -> index 1-4 = frame LEDs, index 5 = nozzle LED (print lighting)
#
#  POWER RULE: every color is capped at 0.5 (= 50% brightness) to protect the
#  board's neopixel port (~1A max). Keep new effects <= 0.5 per channel, too!
#
#  Usage (normally done automatically by SET_LED_STATE):
#     SET_LED_EFFECT EFFECT=r2_printing   -> start effect
#     STOP_LED_EFFECTS                    -> all off
#
#  NOZZLE LED (index 5) - its own switch, independent of the frame effects:
#  OPTIONAL SPLIT (R86.2, for the BTT EBB42 toolhead board): move the nozzle
#  LEDs to their own [neopixel nozzle_led] chain on the EBB (pin PD3) and set
#  save variable nozzle_split=1 (SET_NOZZLE_SPLIT STATE=1):
#     1. printer.cfg: [neopixel printer_leds] chain_count 4 (frame only)
#                     [neopixel nozzle_led]  pin: EBB:PD3  chain_count N
#     2. uncomment [led_effect r2_nozzle_on_split] below
#     3. SET_NOZZLE_SPLIT STATE=1  (persisted; 0 = old single-chain behaviour)
#  Max LEDs on the EBB42 RGB port: ~15 at full white (5V/1A budget) - the
#  system's 0.5 brightness cap gives plenty of headroom beyond that.
#     NOZZLE_LED MODE=on|off|auto         -> AUTO: work light while printing
#                                            (default) | ON: always on, your color
#                                            (works even with LEDs master OFF)
#     NOZZLE_LED BRIGHT=0..1              -> live dimming
#     NOZZLE_LED R=.. G=.. B=..           -> live color (0..1 per channel)
#     LCD: 'Quick Macros > Nozzle LED' (mode, brightness, R/G/B, presets)
# =====================================================================================

# ----- boot: blue glow with white sweep -----------------------------------------------
[led_effect r2_boot]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    linearfade 1.2 0 top (0,0.2,0.5),(0.2,0.4,0.5),(0.5,0.5,0.5),(0.2,0.4,0.5),(0,0.2,0.5)

# ----- idle: calm blue "breathing" (printer ready) -------------------------------------
[led_effect r2_idle]
autostart: true
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    breathing 5 0 screen (0,0,0.3)

# ----- waiting for start decision: questioning blue/white blink -------------------------
[led_effect r2_waiting]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    blink 1 0.6 top (0,0.2,0.5),(0.5,0.5,0.5)

# ----- heating: warm red/orange rotate ----------------------------------------------------
[led_effect r2_heating]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    linearfade 2.5 0 top (0.5,0.1,0.0),(0.5,0.35,0.0),(0.5,0.1,0.0)

# ----- homing: fast cyan sweep --------------------------------------------------------------
[led_effect r2_homing]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    cylon 0.8 0 screen (0,0.4,0.5)

# ----- bed mesh / leveling: magenta scanner (R2's scanner eye!) ------------------------------
[led_effect r2_leveling]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    cylon 0.6 0 screen (0.5,0.0,0.4)

# ----- PID tuning: fast blue/white gradient ---------------------------------------------------
[led_effect r2_pid]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    gradient 2 1 screen (0,0,0.4),(0.45,0.45,0.45),(0,0,0.4)

# ----- printing: slow blue/cyan band -----------------------------------------------------------
[led_effect r2_printing]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    gradient 12 1.5 screen (0,0.1,0.4),(0,0.35,0.5),(0,0.1,0.4)

# ----- nozzle work light (index 5) ---------------------------------------------------------------
# AUTO mode uses this effect (light while printing). Manual ON/OFF/dim/color
# (menu 'Quick Macros > Nozzle LED') bypasses it via SET_LED - see NOZZLE_LED.
[led_effect r2_nozzle_on]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (5)
layers:
    static 1 0 top (0.45,0.45,0.42)

# ----- nozzle work light on the SPLIT chain (EBB42) - uncomment together
# with [neopixel nozzle_led] in printer.cfg + SET_NOZZLE_SPLIT STATE=1 ------
#[led_effect r2_nozzle_on_split]
#autostart: false
#frame_rate: 24
#leds:
#    neopixel:nozzle_led
#layers:
#    static 1 0 top (0.45,0.45,0.42)

# ----- paused: yellow warning breathing ------------------------------------------------------------
[led_effect r2_paused]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    breathing 2.5 0 screen (0.5,0.35,0.0)

# ----- filament change: quick blue/white chase --------------------------------------------------------
[led_effect r2_filament]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    chase 0.6 3 screen (0.4,0.5,0.5),(0,0.1,0.4)

# ----- alarm (filament out / error): red strobe ----------------------------------------------------------
[led_effect r2_alarm]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    strobe 2 1.5 screen (0.5,0.0,0.0)

# ----- finished: green with white sparkles -----------------------------------------------------------------
[led_effect r2_finished]
autostart: false
frame_rate: 24
leds:
    neopixel:printer_leds (1-4)
layers:
    twinkle 20 0.3 screen (0,0.4,0.1),(0.5,0.5,0.5)

# =====================================================================================
#  SET_LED_STATE - central switch: sets the matching effect + nozzle light
#  States: boot idle waiting heating homing leveling pid printing paused filament alarm finished off
# =====================================================================================
[gcode_macro SET_LED_STATE]
description: Set LED state (e.g. SET_LED_STATE STATE=printing)
gcode:
    {% set st = params.STATE|default('idle') %}
    {% set sv = printer['save_variables'].variables %}
    {% set has_eff = 'led_effect r2_idle' in printer %}
    {% set split = sv.nozzle_split|default(0)|int == 1 and 'led_effect r2_nozzle_on_split' in printer %}
    # only if LEDs are on AND the led_effect library is really installed
    {% if sv.leds_on|default(True) and has_eff %}
        STOP_LED_EFFECTS
        {% if st == 'boot' %}          SET_LED_EFFECT EFFECT=r2_boot
        {% elif st == 'idle' %}        SET_LED_EFFECT EFFECT=r2_idle
        {% elif st == 'waiting' %}     SET_LED_EFFECT EFFECT=r2_waiting
        {% elif st == 'heating' %}     SET_LED_EFFECT EFFECT=r2_heating
        {% elif st == 'homing' %}      SET_LED_EFFECT EFFECT=r2_homing
        {% elif st == 'leveling' %}    SET_LED_EFFECT EFFECT=r2_leveling
        {% elif st == 'pid' %}         SET_LED_EFFECT EFFECT=r2_pid
        {% elif st == 'printing' %}    SET_LED_EFFECT EFFECT=r2_printing
        {% elif st == 'paused' %}      SET_LED_EFFECT EFFECT=r2_paused
        {% elif st == 'filament' %}    SET_LED_EFFECT EFFECT=r2_filament
        {% elif st == 'alarm' %}       SET_LED_EFFECT EFFECT=r2_alarm
        {% elif st == 'finished' %}    SET_LED_EFFECT EFFECT=r2_finished
        {% endif %}
        # ---- nozzle work light (R46): its OWN switch, independent of the frame
        #      AUTO = light while printing (default) | ON = always, your color
        #      | OFF = never. Applied AFTER the frame effects so nothing overwrites it.
        {% set nm = sv.nozzle_mode|default('auto')|string|lower %}
        {% if nm == 'on' %}
            _NOZZLE_SET ON=1
        {% elif nm == 'off' %}
            _NOZZLE_SET ON=0
        {% elif st in ['printing','filament'] %}
            SET_LED_EFFECT EFFECT=r2_nozzle_on{% if split %}_split{% endif %}
        {% else %}
            _NOZZLE_SET ON=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=last_led VALUE='"{st}"'
    {% elif 'neopixel printer_leds' in printer %}
        # frame LEDs are OFF (master switch) - but the nozzle work light is a TOOL
        # light with its OWN switch (R46): ON keeps burning even with the frame dark
        {% if sv.nozzle_mode|default('auto')|string|lower == 'on' %}
            {% if has_eff %}SET_LED_EFFECT EFFECT=r2_nozzle_on{% if split %}_split{% endif %} STOP=1{% endif %}
            _NOZZLE_SET ON=1
        {% else %}
            _NOZZLE_SET ON=0
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# _NOZZLE_SET - write the manual nozzle light (LED 5): ON=1 -> your color/brightness,
# ON=0 -> dark. POWER RULE: color * brightness, every channel hard-capped at 0.5
# (the board's neopixel port must never see more - see header of this file).
# -------------------------------------------------------------------------------------
[gcode_macro _NOZZLE_SET]
description: Apply the nozzle LED (index 5 / split chain) - manual color or dark (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set split = sv.nozzle_split|default(0)|int == 1 and 'neopixel nozzle_led' in printer %}
    {% if split %}
        {% if params.ON|default(0)|int == 1 %}
            {% set br = sv.nozzle_bright|default(1.0)|float %}
            {% set r = [[sv.nozzle_r|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set g = [[sv.nozzle_g|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set b = [[sv.nozzle_b|default(0.85)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            SET_LED LED=nozzle_led RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% else %}
            SET_LED LED=nozzle_led RED=0 GREEN=0 BLUE=0
        {% endif %}
    {% elif 'neopixel printer_leds' in printer %}
        {% if params.ON|default(0)|int == 1 %}
            {% set br = sv.nozzle_bright|default(1.0)|float %}
            {% set r = [[sv.nozzle_r|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set g = [[sv.nozzle_g|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set b = [[sv.nozzle_b|default(0.85)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            SET_LED LED=printer_leds INDEX=5 RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% else %}
            SET_LED LED=printer_leds INDEX=5 RED=0 GREEN=0 BLUE=0
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SET_NOZZLE_SPLIT - R86.2: nozzle LEDs on their own chain (EBB42, pin PD3)?
# STATE=1 = split ([neopixel nozzle_led] + r2_nozzle_on_split uncommented),
# STATE=0 = one chain of 5 on the mainboard (default, unchanged behaviour).
# Persisted - survives restarts. Only switch this on when the EBB + chain
# really exist, otherwise SET_LED errors on the missing [neopixel] section.
# -------------------------------------------------------------------------------------
[gcode_macro SET_NOZZLE_SPLIT]
description: Nozzle LEDs on their own EBB chain (1) or on the main chain (0)
gcode:
    {% set on = params.STATE|default(-1)|int %}
    {% if on not in (0, 1) %}
        RESPOND MSG="SET_NOZZLE_SPLIT STATE=1 (own [neopixel nozzle_led] chain on the EBB) or STATE=0 (LED 5 on the main chain)"
    {% else %}
        SAVE_VARIABLE VARIABLE=nozzle_split VALUE={on}
        RESPOND MSG="Nozzle LED split {'ON - nozzle LEDs on [neopixel nozzle_led] (EBB42 PD3). Frame LEDs stay on printer_leds 1-4' if on == 1 else 'OFF - nozzle = LED 5 of printer_leds (single chain)'}"
        M117 Nozzle split {on}
        SET_LED_STATE STATE={printer['gcode_macro _STATE'].last_led|default('idle')}
    {% endif %}

# -------------------------------------------------------------------------------------
# NOZZLE_LED - the public switch (LCD 'Quick Macros > Nozzle LED' + Mainsail):
#   NOZZLE_LED                  -> status report
#   NOZZLE_LED MODE=on|off|auto -> AUTO: work light while printing (default)
#                                  ON: always on with YOUR color, even with the
#                                      frame LEDs switched off (tool light)
#   NOZZLE_LED BRIGHT=0..1      -> live dimming
#   NOZZLE_LED R=.. G=.. B=..   -> live color (0..1 each channel)
# Changes apply IMMEDIATELY (the current LED state is re-applied on the spot).
# -------------------------------------------------------------------------------------
[gcode_macro NOZZLE_LED]
description: Nozzle LED: ON/OFF/AUTO + live dimming + live color
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set mode = params.MODE|default('')|string|lower %}
    {% set br  = params.BRIGHT|default(-1)|float %}
    {% set pr  = params.R|default(-1)|float %}
    {% set pg  = params.G|default(-1)|float %}
    {% set pb  = params.B|default(-1)|float %}
    {% set changed = false %}
    {% if mode in ['on','off','auto'] %}
        SAVE_VARIABLE VARIABLE=nozzle_mode VALUE='"{mode}"'
        {% set changed = true %}
    {% elif mode != '' %}
        RESPOND MSG="[!] NOZZLE_LED: MODE must be ON, OFF or AUTO"
    {% endif %}
    {% if br >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_bright VALUE={[[br,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pr >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_r VALUE={[[pr,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pg >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_g VALUE={[[pg,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pb >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_b VALUE={[[pb,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    # effective values for the report (what was passed wins over what is stored)
    {% set em  = mode if mode in ['on','off','auto'] else sv.nozzle_mode|default('auto')|string|lower %}
    {% set ebr = br if br >= 0 else sv.nozzle_bright|default(1.0)|float %}
    {% set er  = pr if pr >= 0 else sv.nozzle_r|default(0.9)|float %}
    {% set eg  = pg if pg >= 0 else sv.nozzle_g|default(0.9)|float %}
    {% set eb  = pb if pb >= 0 else sv.nozzle_b|default(0.85)|float %}
    {% if changed %}
        # live: re-apply the CURRENT LED state with the new nozzle settings
        {% set cur = printer['gcode_macro _STATE'].last_led|default('')|string %}
        {% if cur == '' %}{% set cur = 'idle' %}{% endif %}
        SET_LED_STATE STATE={cur}
        RESPOND MSG="[OK] Nozzle LED: {em|upper} | bright {(ebr*100)|round|int}% | color ({er|round(2)},{eg|round(2)},{eb|round(2)}) -> applied"
    {% else %}
        RESPOND MSG="Nozzle LED: {em|upper} | bright {(ebr*100)|round|int}% | color ({er|round(2)},{eg|round(2)},{eb|round(2)}) - set: MODE=on/off/auto BRIGHT=0-1 R= G= B="
        M117 Nozzle LED: {em|upper}
    {% endif %}

# -------------------------------------------------------------------------------------
# _LED_TO_IDLE - after a finished print the 'finished' celebration runs for
# led_finish_time seconds (default 10, Pre-Print independent: SAVE_VARIABLE
# VARIABLE=led_finish_time VALUE=...), then the LEDs return to idle breathing.
# R46: the twinkle used to run FOREVER because nothing ever switched back.
# Guards: a NEW print (mode != idle) or any other LED state cancels the return.
# -------------------------------------------------------------------------------------
[delayed_gcode _LED_TO_IDLE]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode == 'idle' and s.last_led == 'finished' %}
        SET_LED_STATE STATE=idle
        RESPOND MSG="[i] LED: finished celebration over - back to idle"
    {% endif %}

[gcode_macro TOGGLE_LEDS]
description: LEDs ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.leds_on|default(True) %}
    SAVE_VARIABLE VARIABLE=leds_on VALUE={on}
    {% if on %}SET_LED_STATE STATE=idle{% else %}STOP_LED_EFFECTS{% endif %}
    {% if not on and printer['save_variables'].variables.nozzle_mode|default('auto') == 'on' %}
        RESPOND MSG="[i] Frame LEDs off - the nozzle work light stays on (its own switch: Quick Macros > Nozzle LED)"
    {% endif %}
    M117 LEDs: {'ON' if on else 'OFF'}

[gcode_macro TEST_LEDS]
description: Play all R2 LED effects one by one
gcode:
    M117 R2-D2 LED demo...
    {% for st in ['boot','idle','waiting','heating','homing','leveling','pid','printing','paused','filament','alarm','finished'] %}
        M117 LED: {st}
        RESPOND MSG="-> LED state: {st}"
        SET_LED_STATE STATE={st}
        G4 P2500
    {% endfor %}
    SET_LED_STATE STATE=idle
    M117 LED demo done

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V03_LEDS]
description: Version sentinel of 03_leds.cfg (internal)
gcode:
