# =====================================================================================
#  03_leds.cfg - R2-D2 style Neopixel effects (library: klipper-led_effect)
#  -----------------------------------------------------------------------------------
#  REQUIREMENT: klipper-led_effect (julianschill) installed. The [neopixel] section
#  itself lives in printer.cfg (see printer.cfg.example):
#     [neopixel printer_leds]  pin: PA8   chain_cnt: 5
#     -> index 1-4 = frame LEDs, index 5 = nozzle LED (print lighting)
#
#  POWER RULE: every color is capped at 0.5 (= 50% brightness) to protect the
#  board's neopixel port (~1A max). Keep new effects <= 0.5 per channel, too!
#
#  Usage (normally done automatically by SET_LED_STATE):
#     SET_LED_EFFECT EFFECT=r2_printing   -> start effect
#     STOP_LED_EFFECTS                    -> all off
#
#  NOZZLE LED - its own switch, independent of the frame effects:
#  OPTIONAL SPLIT (R86.2, for the BTT EBB42 toolhead board): move the nozzle
#  LEDs to their own [neopixel nozzle_led] chain on the EBB (pin PD3) and set
#  led_nozzle_split=1 (SET_NOZZLE_SPLIT STATE=1). The setup LED wizard does
#  all of it for you; by hand:
#     1. printer.cfg: [neopixel printer_leds] chain_count 4 (frame only)
#                     [neopixel nozzle_led]  pin: EBB:PD3  chain_count N
#     2. uncomment [led_effect r2_nozzle_on_split] below
#     3. SET_NOZZLE_SPLIT STATE=1  (persisted; 0 = old single-chain behaviour)
#  Max LEDs on the EBB42 RGB port: ~15 at full white (5V/1A budget) - the
#  system's 0.5 brightness cap gives plenty of headroom beyond that.
#
#  LED AREAS (R108) - one chain, three jobs. The split lives in the HARDWARE
#  PROFILE (r2_hardware.cfg = the second variables file, setup-generated; it
#  survives deleting variables.cfg!). Variables of [gcode_macro _R2_CONFIG]:
#     variable_led_status_n        LEDs 1..n  = STATUS (these animated effects)
#     variable_led_bed_n           LEDs n+1.. = BED work light (steady white,
#                                 own switch + brightness, System > LED Setup)
#     nozzle                       last LED of the chain (n+m+1) - or its own
#                                 chain when led_nozzle_split=1 (EBB42)
#     variable_led_section/type    section name + neopixel|dotstar (other
#                                 SET_LED-compatible chains work the same way)
#  The [led_effect] ranges above are STATIC Klipper config: setup.sh / the LCD
#  (via tools/r2_persist.sh) regenerate them to match, one FIRMWARE_RESTART
#  applies. LCD: System > LED Setup. Wizard: bash setup.sh (also in update.sh).
#     NOZZLE_LED MODE=on|off|auto         -> AUTO: work light while printing
#                                            (default) | ON: always on, your color
#                                            (works even with LEDs master OFF)
#     NOZZLE_LED BRIGHT=0..1              -> live dimming
#     NOZZLE_LED R=.. G=.. B=..           -> live color (0..1 per channel)
#     LCD: 'Quick Macros > Nozzle LED' (mode, brightness, R/G/B, presets)
# =====================================================================================

# ----- boot: blue glow with white sweep -----------------------------------------------
# R216 field fix (.136n): the .136n field log shut down at the string
# art print - klippy's reactor blocked for 4.1 s inside
# ledFrameHandler._getFrames with 1108 failed Neopixel updates behind
# it. The five remaining 12 fps effects (boot/paused/filament/alarm/
# finished) drop to 6 fps like the R166 round did for the long-runners:
# half the frame traffic, no visible loss (a 2 Hz strobe stays a strobe).
[led_effect r2_boot]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    linearfade 1.2 0 top (0,0.2,0.5),(0.2,0.4,0.5),(0.5,0.5,0.5),(0.2,0.4,0.5),(0,0.2,0.5)

# ----- idle: calm blue "breathing" (printer ready) -------------------------------------
[led_effect r2_idle]
autostart: true
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    breathing 5 0 screen (0,0,0.3)

# ----- waiting for start decision: questioning blue/white blink -------------------------
[led_effect r2_waiting]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    blink 1 0.6 top (0,0.2,0.5),(0.5,0.5,0.5)

# ----- heating: warm red/orange rotate ----------------------------------------------------
[led_effect r2_heating]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    linearfade 2.5 0 top (0.5,0.1,0.0),(0.5,0.35,0.0),(0.5,0.1,0.0)

# ----- homing: fast cyan sweep --------------------------------------------------------------
[led_effect r2_homing]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    cylon 0.8 0 screen (0,0.4,0.5)

# ----- bed mesh / leveling: magenta scanner (R2's scanner eye!) ------------------------------
[led_effect r2_leveling]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    cylon 0.6 0 screen (0.5,0.0,0.4)

# ----- PID tuning: fast blue/white gradient ---------------------------------------------------
[led_effect r2_pid]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    gradient 2 1 screen (0,0,0.4),(0.45,0.45,0.45),(0,0,0.4)

# ----- printing: slow blue breathing + nozzle light (R163 static -> R166 motion) ------
# BUDGET, not beauty, sets the rate: every LED frame is one serial message,
# and the .122 field log died with 75/100 queued messages being LED data at
# 24 fps. 5 fps = 5 msg/s = ~1% of the 450 msg/s budget - a 3 s host stall
# (worse than any GC pause ever measured on the Pi Zero 2) queues only 15
# messages instead of 72. The slow 4 s breathing is clearly alive but calm,
# and klipper still sends nothing while a frame repeats the same color.
# r164_serial_budget.py guards this: r2_printing frame_rate must stay <= 5.
[led_effect r2_printing]
autostart: false
frame_rate: 5
leds:
    neopixel:printer_leds (1-4)
layers:
    breathing 4 0 screen (0,0.2,0.45)

# ----- nozzle work light (index 5) ---------------------------------------------------------------
# AUTO mode uses this effect (light while printing). Manual ON/OFF/dim/color
# (menu 'Quick Macros > Nozzle LED') bypasses it via SET_LED - see NOZZLE_LED.
[led_effect r2_nozzle_on]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (5)
layers:
    static 1 0 top (0.45,0.45,0.42)

# ----- nozzle work light on the SPLIT chain (EBB42) - uncomment together
# with [neopixel nozzle_led] in printer.cfg + SET_NOZZLE_SPLIT STATE=1 ------
#[led_effect r2_nozzle_on_split]
#autostart: false
#frame_rate: 6
#leds:
#    neopixel:nozzle_led
#layers:
#    static 1 0 top (0.45,0.45,0.42)

# ----- paused: yellow warning breathing ------------------------------------------------------------
[led_effect r2_paused]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    breathing 2.5 0 screen (0.5,0.35,0.0)

# ----- filament change: quick blue/white chase --------------------------------------------------------
[led_effect r2_filament]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    chase 0.6 3 screen (0.4,0.5,0.5),(0,0.1,0.4)

# ----- alarm (filament out / error): red strobe ----------------------------------------------------------
[led_effect r2_alarm]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    strobe 2 1.5 screen (0.5,0.0,0.0)

# ----- finished: green with white sparkles -----------------------------------------------------------------
[led_effect r2_finished]
autostart: false
frame_rate: 6
leds:
    neopixel:printer_leds (1-4)
layers:
    twinkle 20 0.3 screen (0,0.4,0.1),(0.5,0.5,0.5)

# =====================================================================================
#  SET_LED_STATE - central switch: sets the matching effect + nozzle light
#  States: boot idle waiting heating homing leveling pid printing paused filament alarm finished off
# =====================================================================================
[gcode_macro SET_LED_STATE]
description: Set LED state (e.g. SET_LED_STATE STATE=printing)
gcode:
    {% set st = params.STATE|default('idle') %}
    {% set sv = printer['save_variables'].variables %}
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set lsec = rc.led_section|default('printer_leds')|string %}
    {% set ltype = rc.led_type|default('neopixel')|string %}
    {% set sn = rc.led_status_n|default(4)|int %}
    {% set bn = rc.led_bed_n|default(0)|int %}
    {% set has_eff = 'led_effect r2_idle' in printer %}
    {% set split = (rc.led_nozzle_split|default(sv.nozzle_split|default(0))|int == 1) and 'led_effect r2_nozzle_on_split' in printer %}
    # only if LEDs are on AND the led_effect library is really installed
    {% if sv.leds_on|default(True) and has_eff %}
        STOP_LED_EFFECTS
        {% if st == 'boot' %}          SET_LED_EFFECT EFFECT=r2_boot
        {% elif st == 'idle' %}        SET_LED_EFFECT EFFECT=r2_idle
        {% elif st == 'waiting' %}     SET_LED_EFFECT EFFECT=r2_waiting
        {% elif st == 'heating' %}     SET_LED_EFFECT EFFECT=r2_heating
        {% elif st == 'homing' %}      SET_LED_EFFECT EFFECT=r2_homing
        {% elif st == 'leveling' %}    SET_LED_EFFECT EFFECT=r2_leveling
        {% elif st == 'pid' %}         SET_LED_EFFECT EFFECT=r2_pid
        {% elif st == 'printing' %}    SET_LED_EFFECT EFFECT=r2_printing
        {% elif st == 'paused' %}      SET_LED_EFFECT EFFECT=r2_paused
        {% elif st == 'filament' %}    SET_LED_EFFECT EFFECT=r2_filament
        {% elif st == 'alarm' %}       SET_LED_EFFECT EFFECT=r2_alarm
        {% elif st == 'finished' %}    SET_LED_EFFECT EFFECT=r2_finished
        {% endif %}
        # ---- nozzle work light (R46): its OWN switch, independent of the frame
        #      AUTO = light while printing (default) | ON = always, your color
        #      | OFF = never. Applied AFTER the frame effects so nothing overwrites it.
        {% set nm = sv.nozzle_mode|default('auto')|string|lower %}
        {% if nm == 'on' %}
            _NOZZLE_SET ON=1
        {% elif nm == 'off' %}
            _NOZZLE_SET ON=0
        {% elif st in ['printing','filament'] %}
            SET_LED_EFFECT EFFECT=r2_nozzle_on{% if split %}_split{% endif %}
        {% else %}
            _NOZZLE_SET ON=0
        {% endif %}
        # ---- bed work light (R108): steady white, own switch, re-applied after
        #      every state change so no effect can leave it dark
        {% if bn > 0 and rc.led_bed_on|default(1)|int == 1 %}
            _BEDLIGHT_SET ON=1
        {% elif bn > 0 %}
            _BEDLIGHT_SET ON=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=last_led VALUE='"{st}"'
    {% elif (ltype ~ ' ' ~ lsec) in printer %}
        # frame LEDs are OFF (master switch) - but the nozzle work light is a TOOL
        # light with its OWN switch (R46): ON keeps burning even with the frame dark
        {% if sv.nozzle_mode|default('auto')|string|lower == 'on' %}
            {% if has_eff %}SET_LED_EFFECT EFFECT=r2_nozzle_on{% if split %}_split{% endif %} STOP=1{% endif %}
            _NOZZLE_SET ON=1
        {% else %}
            _NOZZLE_SET ON=0
        {% endif %}
        {% if bn > 0 %}_BEDLIGHT_SET ON=0{% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# _NOZZLE_SET - write the manual nozzle light (LED 5): ON=1 -> your color/brightness,
# ON=0 -> dark. POWER RULE: color * brightness, every channel hard-capped at 0.5
# (the board's neopixel port must never see more - see header of this file).
# -------------------------------------------------------------------------------------
[gcode_macro _NOZZLE_SET]
description: Apply the nozzle LED (last main LED / split chain) - manual color or dark (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set lsec = rc.led_section|default('printer_leds')|string %}
    {% set ltype = rc.led_type|default('neopixel')|string %}
    {% set sn = rc.led_status_n|default(4)|int %}
    {% set bn = rc.led_bed_n|default(0)|int %}
    {% set split = (rc.led_nozzle_split|default(sv.nozzle_split|default(0))|int == 1)
                   and ((ltype ~ ' ' ~ (rc.led_nozzle_section|default('nozzle_led')|string)) in printer) %}
    {% if split %}
        {% if params.ON|default(0)|int == 1 %}
            {% set br = sv.nozzle_bright|default(1.0)|float %}
            {% set r = [[sv.nozzle_r|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set g = [[sv.nozzle_g|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set b = [[sv.nozzle_b|default(0.85)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            SET_LED LED={rc.led_nozzle_section|default('nozzle_led')} RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% else %}
            SET_LED LED={rc.led_nozzle_section|default('nozzle_led')} RED=0 GREEN=0 BLUE=0
        {% endif %}
    {% elif (ltype ~ ' ' ~ lsec) in printer %}
        {% if params.ON|default(0)|int == 1 %}
            {% set br = sv.nozzle_bright|default(1.0)|float %}
            {% set r = [[sv.nozzle_r|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set g = [[sv.nozzle_g|default(0.9)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            {% set b = [[sv.nozzle_b|default(0.85)|float * br * 0.5, 0.5]|min, 0.0]|max %}
            SET_LED LED={lsec} INDEX={sn + bn + 1} RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% else %}
            SET_LED LED={lsec} INDEX={sn + bn + 1} RED=0 GREEN=0 BLUE=0
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SET_NOZZLE_SPLIT - R86.2: nozzle LEDs on their own chain (EBB42, pin PD3)?
# STATE=1 = split ([neopixel nozzle_led] + r2_nozzle_on_split uncommented),
# STATE=0 = one chain of 5 on the mainboard (default, unchanged behaviour).
# Persisted - survives restarts. Only switch this on when the EBB + chain
# really exist, otherwise SET_LED errors on the missing [neopixel] section.
# -------------------------------------------------------------------------------------
[gcode_macro SET_NOZZLE_SPLIT]
description: Nozzle LEDs on their own EBB chain (1) or on the main chain (0)
gcode:
    {% set on = params.STATE|default(-1)|int %}
    {% if on not in (0, 1) %}
        RESPOND MSG="SET_NOZZLE_SPLIT STATE=1 (own [neopixel nozzle_led] chain on the EBB) or STATE=0 (LED 5 on the main chain)"
    {% else %}
        SAVE_VARIABLE VARIABLE=nozzle_split VALUE={on}
        {% if 'gcode_macro _R2_CONFIG' in printer %}
            SET_GCODE_VARIABLE MACRO=_R2_CONFIG VARIABLE=led_nozzle_split VALUE={on}
            {% if 'gcode_shell_command R2_PERSIST' in printer.configfile.settings %}
                RUN_SHELL_COMMAND CMD=R2_PERSIST PARAMS="led_nozzle_split {on}"
            {% endif %}
        {% endif %}
        RESPOND MSG="Nozzle LED split {'ON - nozzle LEDs on their own chain (needs the section + the split effect active - the LED wizard sets both)' if on == 1 else 'OFF - nozzle = last LED of the main chain'}"
        M117 Nozzle split {on}
        SET_LED_STATE STATE={printer['gcode_macro _STATE'].last_led|default('idle')}
    {% endif %}

# -------------------------------------------------------------------------------------
# _BEDLIGHT_SET - write the bed work-light LEDs (steady white, R108). Own switch
# + brightness (hardware profile), re-applied by SET_LED_STATE after every state
# change. POWER RULE: hard-capped at 0.5 per channel like everything here.
# -------------------------------------------------------------------------------------
[gcode_macro _BEDLIGHT_SET]
description: Apply the bed work-light LEDs (internal)
gcode:
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set lsec = rc.led_section|default('printer_leds')|string %}
    {% set ltype = rc.led_type|default('neopixel')|string %}
    {% set sn = rc.led_status_n|default(4)|int %}
    {% set bn = rc.led_bed_n|default(0)|int %}
    {% if bn > 0 and (ltype ~ ' ' ~ lsec) in printer %}
        {% if params.ON|default(-1)|int == 1 %}
            {% if params.BRIGHT|default(-1)|float >= 0 %}
                {% set br = [[params.BRIGHT|float, 0.5]|min, 0.0]|max %}
            {% else %}
                {% set br = [[rc.led_bed_bright|default(0.4)|float, 0.5]|min, 0.0]|max %}
            {% endif %}
            {% for i in range(sn + 1, sn + bn + 1) %}
        SET_LED LED={lsec} INDEX={i} RED={br|round(3)} GREEN={br|round(3)} BLUE={br|round(3)}
            {% endfor %}
        {% else %}
            {% for i in range(sn + 1, sn + bn + 1) %}
        SET_LED LED={lsec} INDEX={i} RED=0 GREEN=0 BLUE=0
            {% endfor %}
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SET_BED_LIGHT - public switch (LCD System > LED Setup):
#   SET_BED_LIGHT STATE=1|0 | TOGGLE=1 | BRIGHT=0..0.5
# Lives in the HARDWARE PROFILE (r2_hardware.cfg) - it survives deleting
# variables.cfg. Persisted via R2_PERSIST when the shell-command extension
# is installed (setup.sh checks + writes the section).
# -------------------------------------------------------------------------------------
[gcode_macro SET_BED_LIGHT]
description: Bed work light: on/off + brightness (hardware profile)
gcode:
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% if not rc %}
        RESPOND MSG="Bed light needs the hardware profile (r2_hardware.cfg) - run setup.sh"
    {% else %}
        {% set bn = rc.led_bed_n|default(0)|int %}
        {% if bn < 1 %}
            RESPOND MSG="No bed work-light LEDs configured (System > LED Setup > Bed LEDs = 0)"
        {% else %}
            {% set new_on = params.STATE|default(-1)|int %}
            {% if params.TOGGLE|default(0)|int == 1 %}
                {% set new_on = 0 if rc.led_bed_on|default(1)|int == 1 else 1 %}
            {% endif %}
            {% set new_br = params.BRIGHT|default(-1)|float %}
            {% if new_br >= 0 %}
                {% set new_br = [[new_br, 0.5]|min, 0.0]|max|round(2) %}
                SET_GCODE_VARIABLE MACRO=_R2_CONFIG VARIABLE=led_bed_bright VALUE={new_br}
                {% if 'gcode_shell_command R2_PERSIST' in printer.configfile.settings %}
                    RUN_SHELL_COMMAND CMD=R2_PERSIST PARAMS="led_bed_bright {new_br}"
                {% endif %}
                RESPOND MSG="Bed light brightness {new_br} (0-0.5 power cap)"
            {% else %}
                {% set new_br = rc.led_bed_bright|default(0.4)|float %}
            {% endif %}
            {% if new_on in (0, 1) %}
                SET_GCODE_VARIABLE MACRO=_R2_CONFIG VARIABLE=led_bed_on VALUE={new_on}
                {% if 'gcode_shell_command R2_PERSIST' in printer.configfile.settings %}
                    RUN_SHELL_COMMAND CMD=R2_PERSIST PARAMS="led_bed_on {new_on}"
                {% endif %}
            {% else %}
                {% set new_on = rc.led_bed_on|default(1)|int %}
            {% endif %}
            _BEDLIGHT_SET ON={new_on}
            RESPOND MSG="Bed work light: {'ON' if new_on == 1 else 'OFF'} | bright {new_br} | LEDs {rc.led_status_n|default(4)|int + 1}-{rc.led_status_n|default(4)|int + bn}"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SET_LED_LAYOUT - the area split (LCD System > LED Setup):
#   SET_LED_LAYOUT STATUS=<n> BED=<n>   (one or both)
# Counts are HARD-CLAMPED to the real chain_count from the config section
# (rule: geometry values never exceed the machine). The animated [led_effect]
# ranges are static Klipper config - r2_persist.sh regenerates them, one
# FIRMWARE_RESTART applies. Everything else (bed light, nozzle index) is
# live immediately.
# -------------------------------------------------------------------------------------
[gcode_macro SET_LED_LAYOUT]
description: Set the LED area split (STATUS= animated, BED= work light)
gcode:
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% if not rc %}
        RESPOND MSG="LED layout needs the hardware profile (r2_hardware.cfg) - run setup.sh first"
    {% else %}
        {% set sv = printer['save_variables'].variables %}
        {% set lsec = rc.led_section|default('printer_leds')|string %}
        {% set ltype = rc.led_type|default('neopixel')|string %}
        {% set sn = rc.led_status_n|default(4)|int %}
        {% set bn = rc.led_bed_n|default(0)|int %}
        {% set split = rc.led_nozzle_split|default(sv.nozzle_split|default(0))|int == 1 %}
        {% set lkey = ltype ~ ' ' ~ lsec %}
        {% set chain = printer.configfile.settings[lkey].chain_count|default(0)|int if lkey in printer.configfile.settings else 0 %}
        {% set new_sn = params.STATUS|default(-1)|int %}
        {% set new_bn = params.BED|default(-1)|int %}
        {% if new_sn < 0 and new_bn < 0 %}
            RESPOND MSG="Usage: SET_LED_LAYOUT STATUS=<n> BED=<n> (status first, bed work light after them)"
            RESPOND MSG="current: status 1-{sn} | bed {sn + 1}-{sn + bn} | nozzle {'own chain' if split else 'LED ' ~ (sn + bn + 1)} | chain {chain if chain > 0 else '?'}"
        {% else %}
            {% if new_sn < 0 %}{% set new_sn = sn %}{% endif %}
            {% if new_bn < 0 %}{% set new_bn = bn %}{% endif %}
            {% set new_sn = [new_sn, 0]|max %}
            {% set new_bn = [new_bn, 0]|max %}
            {% set clamped = false %}
            {% if chain > 0 %}
                # nozzle keeps its LED unless it lives on the split chain
                {% set room = chain - (0 if split else 1) %}
                {% if new_sn > room %}{% set new_sn = room %}{% set clamped = true %}{% endif %}
                {% if new_sn + new_bn > room %}{% set new_bn = [room - new_sn, 0]|max %}{% set clamped = true %}{% endif %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_R2_CONFIG VARIABLE=led_status_n VALUE={new_sn}
            SET_GCODE_VARIABLE MACRO=_R2_CONFIG VARIABLE=led_bed_n VALUE={new_bn}
            {% if 'gcode_shell_command R2_PERSIST' in printer.configfile.settings %}
                RUN_SHELL_COMMAND CMD=R2_PERSIST PARAMS="led_status_n {new_sn}"
                RUN_SHELL_COMMAND CMD=R2_PERSIST PARAMS="led_bed_n {new_bn}"
            {% endif %}
            {% if clamped %}
                RESPOND MSG="LED layout clamped to the {chain}-LED chain: status 1-{new_sn} | bed {new_sn + 1}-{new_sn + new_bn}"
            {% else %}
                RESPOND MSG="LED layout: status 1-{new_sn} | bed {new_sn + 1}-{new_sn + new_bn} | nozzle {'own chain' if split else 'LED ' ~ (new_sn + new_bn + 1)}"
            {% endif %}
            RESPOND MSG="FIRMWARE_RESTART applies the animated-effect ranges (bed light + nozzle index are live right away)"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# LED_INFO - the full picture (console): chain + pin from the REAL config
# section, areas, switches, split state. Read-only, changes nothing.
# -------------------------------------------------------------------------------------
[gcode_macro LED_INFO]
description: Report the LED setup (chain, areas, switches)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% set lsec = rc.led_section|default('printer_leds')|string %}
    {% set ltype = rc.led_type|default('neopixel')|string %}
    {% set sn = rc.led_status_n|default(4)|int %}
    {% set bn = rc.led_bed_n|default(0)|int %}
    {% set split = (rc.led_nozzle_split|default(sv.nozzle_split|default(0))|int == 1) and ('led_effect r2_nozzle_on_split' in printer) %}
    {% set lkey = ltype ~ ' ' ~ lsec %}
    {% if lkey not in printer.configfile.settings %}
        RESPOND MSG="LED: no [{ltype} {lsec}] section in this klipper - run setup.sh (LED wizard)"
    {% else %}
        {% set sec = printer.configfile.settings[lkey] %}
        {% set pin = sec.pin|default(sec.data_pin|default('?'))|string %}
        {% set chain = sec.chain_count|default('?')|string %}
        RESPOND MSG="LED main chain: [{ltype} {lsec}] pin {pin} | {chain} LEDs"
        {% set bl112 = 'no bed light LEDs on the main chain' if bn == 0 else ((sn + 1) ~ '-' ~ (sn + bn) ~ ' bed light (' ~ ('on' if rc.led_bed_on|default(1)|int == 1 else 'off') ~ ', bright ' ~ rc.led_bed_bright|default(0.4) ~ ')') %}
        RESPOND MSG="  areas: 1-{sn} status (animated) | {bl112} | nozzle {'own chain ' ~ rc.led_nozzle_section|default('nozzle_led') if split else 'LED ' ~ (sn + bn + 1)}"
        RESPOND MSG="  master {'on' if sv.leds_on|default(True) else 'off'} | nozzle mode {sv.nozzle_mode|default('auto')} | LCD: System > LED Setup"
        {% if chain|float > 0 and sn + bn + (0 if split else 1) != chain|float %}
            RESPOND MSG="  [i] layout uses {sn + bn + (0 if split else 1)} of {chain} LEDs - {chain|float - sn - bn - (0 if split else 1)|int} unused (adjust via System > LED Setup)"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# NOZZLE_LED - the public switch (LCD 'Quick Macros > Nozzle LED' + Mainsail):
#   NOZZLE_LED                  -> status report
#   NOZZLE_LED MODE=on|off|auto -> AUTO: work light while printing (default)
#                                  ON: always on with YOUR color, even with the
#                                      frame LEDs switched off (tool light)
#   NOZZLE_LED BRIGHT=0..1      -> live dimming
#   NOZZLE_LED R=.. G=.. B=..   -> live color (0..1 each channel)
# Changes apply IMMEDIATELY (the current LED state is re-applied on the spot).
# -------------------------------------------------------------------------------------
[gcode_macro NOZZLE_LED]
description: Nozzle LED: ON/OFF/AUTO + live dimming + live color
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set mode = params.MODE|default('')|string|lower %}
    {% set br  = params.BRIGHT|default(-1)|float %}
    {% set pr  = params.R|default(-1)|float %}
    {% set pg  = params.G|default(-1)|float %}
    {% set pb  = params.B|default(-1)|float %}
    {% set changed = false %}
    {% if mode in ['on','off','auto'] %}
        SAVE_VARIABLE VARIABLE=nozzle_mode VALUE='"{mode}"'
        {% set changed = true %}
    {% elif mode != '' %}
        RESPOND MSG="[!] NOZZLE_LED: MODE must be ON, OFF or AUTO"
    {% endif %}
    {% if br >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_bright VALUE={[[br,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pr >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_r VALUE={[[pr,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pg >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_g VALUE={[[pg,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    {% if pb >= 0 %}
        SAVE_VARIABLE VARIABLE=nozzle_b VALUE={[[pb,1.0]|min,0.0]|max|round(2)}
        {% set changed = true %}
    {% endif %}
    # effective values for the report (what was passed wins over what is stored)
    {% set em  = mode if mode in ['on','off','auto'] else sv.nozzle_mode|default('auto')|string|lower %}
    {% set ebr = br if br >= 0 else sv.nozzle_bright|default(1.0)|float %}
    {% set er  = pr if pr >= 0 else sv.nozzle_r|default(0.9)|float %}
    {% set eg  = pg if pg >= 0 else sv.nozzle_g|default(0.9)|float %}
    {% set eb  = pb if pb >= 0 else sv.nozzle_b|default(0.85)|float %}
    {% if changed %}
        # live: re-apply the CURRENT LED state with the new nozzle settings
        {% set cur = printer['gcode_macro _STATE'].last_led|default('')|string %}
        {% if cur == '' %}{% set cur = 'idle' %}{% endif %}
        SET_LED_STATE STATE={cur}
        RESPOND MSG="[OK] Nozzle LED: {em|upper} | bright {(ebr*100)|round|int}% | color ({er|round(2)},{eg|round(2)},{eb|round(2)}) -> applied"
    {% else %}
        RESPOND MSG="Nozzle LED: {em|upper} | bright {(ebr*100)|round|int}% | color ({er|round(2)},{eg|round(2)},{eb|round(2)}) - set: MODE=on/off/auto BRIGHT=0-1 R= G= B="
        M117 Nozzle LED: {em|upper}
    {% endif %}

# -------------------------------------------------------------------------------------
# _LED_TO_IDLE - after a finished print the 'finished' celebration runs for
# led_finish_time seconds (default 10, Pre-Print independent: SAVE_VARIABLE
# VARIABLE=led_finish_time VALUE=...), then the LEDs return to idle breathing.
# R46: the twinkle used to run FOREVER because nothing ever switched back.
# Guards: a NEW print (mode != idle) or any other LED state cancels the return.
# -------------------------------------------------------------------------------------
[delayed_gcode _LED_TO_IDLE]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # R160b (.120 field): 'finished' too - PRINT_END sets mode='finished'
    # first and 'idle' at its very end; when it aborted in between (e.g. a
    # refused move) the twinkle ran FOREVER (field log: 'the printer keeps
    # blinking eagerly'). Any state other than a live print may return.
    {% if s.mode in ('idle', 'finished') and s.last_led == 'finished' %}
        SET_LED_STATE STATE=idle
        RESPOND MSG="[i] LED: finished celebration over - back to idle"
    {% endif %}

[gcode_macro TOGGLE_LEDS]
description: LEDs ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.leds_on|default(True) %}
    SAVE_VARIABLE VARIABLE=leds_on VALUE={on}
    {% if on %}SET_LED_STATE STATE=idle{% else %}STOP_LED_EFFECTS{% endif %}
    {% if not on and printer['save_variables'].variables.nozzle_mode|default('auto') == 'on' %}
        RESPOND MSG="[i] Frame LEDs off - the nozzle work light stays on (its own switch: Quick Macros > Nozzle LED)"
    {% endif %}
    M117 LEDs: {'ON' if on else 'OFF'}

[gcode_macro TEST_LEDS]
description: Play all R2 LED effects one by one
gcode:
    M117 R2-D2 LED demo...
    {% for st in ['boot','idle','waiting','heating','homing','leveling','pid','printing','paused','filament','alarm','finished'] %}
        M117 LED: {st}
        RESPOND MSG="-> LED state: {st}"
        SET_LED_STATE STATE={st}
        G4 P2500
    {% endfor %}
    SET_LED_STATE STATE=idle
    M117 LED demo done

