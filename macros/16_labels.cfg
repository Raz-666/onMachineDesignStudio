# =====================================================================================
#  16_labels.cfg - R63 LABEL GENERATOR (LCD 'Labels' menu + GEN_LABELS console macro)
#  -----------------------------------------------------------------------------------
#  Prints label plates: solid base (color 1) -> M600 filament change -> text on top
#  (color 2). Hole per golden ratio (never collides with the text), text auto-fit,
#  purge tower, optional ironing/brim, exclude_object per label. The actual file is
#  generated by tools/r2_postproc.py (the r2-postproc watcher) - this file only
#  manages the SETTINGS in save_variables and bumps label_gen_nonce.
#
#  LCD:   Tools > Labels > Text (char editor) / Settings / Job (Add, Create)
#  Console/Mainsail:
#     GEN_LABELS TEXT="WERKSTATT|VASE" W=60 H=30 FONT=SMOOTH HOLE_SIDE=LEFT ...
#     FONT: SMOOTH | MONO | COND | NARROW | CAPS  (COND/NARROW/CAPS = small-text
#     fonts, R82; CAPS prints everything as capitals)
#     (every parameter optional - the LCD settings are the defaults)
# =====================================================================================

[gcode_macro _LABELS]
description: Label generator state (charset + limits, internal)
# R65 HOTFIX: '#' must NOT appear in this string - Klipper cuts EVERY config
# line at '#' (comment strip), which truncated the string here and halted
# the printer (.47/.48). The '#' character is still available: the editor
# appends it at runtime (index 92 == '%c' % 35) - see _LABEL_SET_CHAR.
# R69: no ';' either - Klipper cuts every COMMAND line at the first ';' too,
# so a ';' could never be saved (the save failed with 'Malformed command').
# R74: '~' is reserved as the LINE separator inside a queue entry - it is not
# in the charset, so the LCD editor can never type it by accident.
variable_charset: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ÄÖÜäöüß-.,:!?+*/()[]=%&@°'<>_"
variable_max_text: 24
variable_max_labels: 24
gcode:

# -------------------------------------------------------------------------------------
# _LABEL_SET_CHAR POS=1..N CH=<charset index> - put a character into the edit
# buffer of the CURRENT line (R74: label_edit_line picks label_l1..label_l3,
# the character limit follows the label size - LABEL_FIT_CALC sets it)
# -------------------------------------------------------------------------------------
[gcode_macro _LABEL_SET_CHAR]
description: Label text editor: set the character at POS (internal)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set cs  = printer['gcode_macro _LABELS'].charset ~ ('%c' % 35) %}
    {% set ln  = [sv.label_edit_line|default(1)|int, 5]|min %}
    {% set hardmax = printer['gcode_macro _LABELS'].max_text %}
    {% set mx  = [sv.label_max_chars|default(12)|int, hardmax]|min %}
    {% set pos = params.POS|default(sv.label_pos|default(1))|int %}
    {% set idx = params.CH|default(0)|int %}
    {% if pos < 1 or pos > mx %}
        RESPOND MSG="Label text: position must be 1..{mx} (this label size fits {mx} characters - enlarge W for more)"
        M117 Max {mx} chars!
    {% else %}
        {% set txt = sv['label_l%d' % ln]|default('')|string %}
        {% set ch = cs[idx] if idx >= 0 and idx < cs|length else ' ' %}
        {% if txt|length < pos - 1 %}
            {% set txt = txt ~ (' ' * (pos - 1 - txt|length)) %}
        {% endif %}
        {% set new = txt[:pos - 1] ~ ch ~ txt[pos:] %}
        SAVE_VARIABLE VARIABLE=label_l{ln|lower} VALUE="\"{new}\""
        {% set nx = [pos + 1, mx]|min %}
        SAVE_VARIABLE VARIABLE=label_pos VALUE={nx}
        M117 L{ln} {(new ~ '|' ~ (' ' * (mx - new|length)))[:mx]}@{nx}
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_DEL_CHAR - delete the character at the current position (current line)
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_DEL_CHAR]
description: Label text editor: delete the character at the position
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set ln  = [sv.label_edit_line|default(1)|int, 5]|min %}
    {% set pos = sv.label_pos|default(1)|int %}
    {% set txt = sv['label_l%d' % ln]|default('')|string %}
    {% if pos >= 1 and pos <= txt|length %}
        {% set new = txt[:pos - 1] ~ txt[pos:] %}
        SAVE_VARIABLE VARIABLE=label_l{ln|lower} VALUE="\"{new}\""
        M117 L{ln} {new[:16]}@{pos}
    {% else %}
        _SOUND_LIB NAME=r2_click
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_CLEAR_TEXT / LABEL_SHOW_TEXT / LABEL_SELECT_LINE / LABEL_FIT_CALC (R74)
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_CLEAR_TEXT]
description: Label text editor: clear the CURRENT line
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set ln = [sv.label_edit_line|default(1)|int, 5]|min %}
    SAVE_VARIABLE VARIABLE=label_l{ln|lower} VALUE='""'
    SAVE_VARIABLE VARIABLE=label_pos VALUE=1
    M117 L{ln} cleared

[gcode_macro LABEL_SHOW_TEXT]
description: Label text editor: show all text lines (LCD + console)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set l1 = sv.label_l1|default('')|string %}
    {% set l2 = sv.label_l2|default('')|string %}
    {% set l3 = sv.label_l3|default('')|string %}
    {% set l4 = sv.label_l4|default('')|string %}
    {% set l5 = sv.label_l5|default('')|string %}
    # R75 (field log .58): a stale label_pos from a previous session showed
    # 'position 7 of max 12' on an EMPTY line - clamp the cursor to the text
    # so typing never pads 6 invisible spaces in front of the first letter.
    {% set ln = [sv.label_edit_line|default(1)|int, 5]|min %}
    {% set cur = sv['label_l%d' % ln]|default('')|string %}
    {% set pos = sv.label_pos|default(1)|int %}
    {% if pos < 1 or pos > cur|length + 1 %}
        SAVE_VARIABLE VARIABLE=label_pos VALUE={[cur|length + 1, 1]|max}
        {% set pos = [cur|length + 1, 1]|max %}
    {% endif %}
    M117 {l1[:12]}/{l2[:6] if l2 else '-'}
    RESPOND MSG="Label lines: L1 '{l1}' | L2 '{l2}' | L3 '{l3}' | L4 '{l4}' | L5 '{l5}' - editing L{sv.label_edit_line|default(1)|int}, position {pos} of max {sv.label_max_chars|default(12)|int}"

[gcode_macro LABEL_SELECT_LINE]
description: Labels: switch the text editor to line 1..5
gcode:
    {% set ln = params.L|default(1)|int %}
    {% if ln < 1 or ln > 5 %}
        RESPOND MSG="Label line: L must be 1..5"
    {% else %}
        SAVE_VARIABLE VARIABLE=label_edit_line VALUE={ln}
        SAVE_VARIABLE VARIABLE=label_pos VALUE=1
        M117 Edit line {ln}
        RESPOND MSG="Label editor: now on line {ln} (Lines setting sends 1..{printer['save_variables'].variables.label_lines|default(1)|int} lines per label)"
    {% endif %}

[gcode_macro LABEL_FIT_CALC]
description: Labels: font estimate for the CURRENT text on the current label size
gcode:
    # R80: no more 'max N characters' limits - the generator AUTO-FITS the font
    # (94% fill) and grows the label if the letters would get unreadable. This
    # LCD pre-check estimates the cap height for the text you typed so far
    # (only filled lines count; a hole eats ~8mm of width).
    {% set sv = printer['save_variables'].variables %}
    {% set w = sv.label_w|default(50)|float %}
    {% set h = sv.label_h|default(15)|float %}
    {% set size = sv.label_size|default(0)|float %}
    {% set spc = sv.label_spacing|default(0)|float %}
    {% set spc = [spc, 2.0]|min %}
    {% set l1 = sv.label_l1|default('')|string %}
    {% set l2 = sv.label_l2|default('')|string %}
    {% set l3 = sv.label_l3|default('')|string %}
    {% set l4 = sv.label_l4|default('')|string %}
    {% set l5 = sv.label_l5|default('')|string %}
    {% set used = [] %}
    {% for l in [l1, l2, l3, l4, l5] %}
        {% if l|length > 0 %}
            {% if used.append(l) %}{% endif %}
        {% endif %}
    {% endfor %}
    {% set n = used|length %}
    {% set chars = (used|map('length')|list|max) if n > 0 else 4 %}
    {% set hole = 8.0 if sv.label_hole_side|default(0)|int in (1, 2) else 0.0 %}
    {% set uw = [w - 3.0 - hole - spc * (chars - 1), 4.0]|max %}
    {% set uh = [h - 3.0, 4.0]|max %}
    {% set est = [(uw * 0.94) / (chars * 0.8), (uh * 0.94) / (n * 1.3 if n > 0 else 1)]|min %}
    {% set est = [est, 25.0]|min %}
    {% set mx = [([w * 0.45, 24]|min)|int, 8]|max %}
    SAVE_VARIABLE VARIABLE=label_max_chars VALUE={mx}
    {% if n > 0 %}
        RESPOND MSG="Label fit (rough): ~{'%.1f' % est}mm caps for your {n} line(s) on a {w|round(0)|int}x{h|round(0)|int}mm label {('(size %.1fmm fixed)' % size) if size > 0 else '(size auto: font fills the label)'}"
        RESPOND MSG="  exact numbers follow in ~2s: final label size incl. growth, real cap height, stroke, chars/line, minimum size for a fixed font"
        SAVE_VARIABLE VARIABLE=label_fit_nonce VALUE={printer['save_variables'].variables.label_fit_nonce|default(0)|int + 1}
    {% else %}
        RESPOND MSG="Label fit: type a text first (Tools > Labels > Text) - the font then auto-fits the label; the label grows if the text would get tiny"
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_ADD - append the CURRENT LINES (1..label_lines, joined with '~') to the queue
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_ADD]
description: Labels: add the current text lines to the job queue
gcode:
    {% set sv   = printer['save_variables'].variables %}
    {% set mx   = printer['gcode_macro _LABELS'].max_labels %}
    {% set nl   = [sv.label_lines|default(1)|int, 5]|min %}
    {% set t1 = sv.label_l1|default('')|string|trim %}
    {% set t2 = sv.label_l2|default('')|string|trim if nl >= 2 else '' %}
    {% set t3 = sv.label_l3|default('')|string|trim if nl >= 3 else '' %}
    {% set t4 = sv.label_l4|default('')|string|trim if nl >= 4 else '' %}
    {% set t5 = sv.label_l5|default('')|string|trim if nl >= 5 else '' %}
    {% set txt = t1 ~ ('' if t2 == '' else '~' ~ t2) ~ ('' if t3 == '' else '~' ~ t3)
                   ~ ('' if t4 == '' else '~' ~ t4) ~ ('' if t5 == '' else '~' ~ t5) %}
    {% set list = sv.label_texts|default('')|string %}
    {% set cur  = list.split('|')|select('ne', '')|list if list != '' else [] %}
    {% if txt == '' %}
        NOTIFY TEXT="Type a text first (Tools > Labels > Text)" LEVEL=warn SOUND=r2_notice
        M117 No text!
    {% elif cur|length >= mx %}
        NOTIFY TEXT="Label queue full ({mx}) - delete one first" LEVEL=warn SOUND=r2_notice
        M117 Queue full
    {% else %}
        {% set new = (list ~ '|' ~ txt) if list != '' else txt %}
        SAVE_VARIABLE VARIABLE=label_texts VALUE="\"{new}\""
        _SOUND_LIB NAME=r2_confirm
        M117 Added {cur|length + 1}/{mx}: {t1[:10]}
        RESPOND MSG="Label queue: {cur|length + 1}/{mx} - added '{txt}' ({new})"
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_DEL_LAST / LABEL_CLEAR_ALL - queue management
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_DEL_LAST]
description: Labels: remove the last label from the job queue
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set lst = (sv.label_texts|default('')|string).split('|')|select('ne', '')|list %}
    {% if lst|length == 0 %}
        _SOUND_LIB NAME=r2_click
        M117 Queue empty
    {% else %}
        {% set new = lst[:-1]|join('|') %}
        SAVE_VARIABLE VARIABLE=label_texts VALUE="\"{new}\""
        _SOUND_LIB NAME=r2_confirm
        M117 Queue: {lst|length - 1} left
        RESPOND MSG="Label queue: removed '{lst[-1]}' - {lst|length - 1} left"
    {% endif %}

[gcode_macro LABEL_CLEAR_ALL]
description: Labels: clear the whole job queue (press 2x)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if params.CONFIRM|default(0)|int == 1 %}
        SAVE_VARIABLE VARIABLE=label_texts VALUE='""'
        _SOUND_LIB NAME=r2_sad
        M117 Queue cleared
        RESPOND MSG="Label queue cleared"
    {% else %}
        NOTIFY TEXT="Press LABEL_CLEAR_ALL again to really clear the queue" LEVEL=warn SOUND=r2_question
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_INFO - queue + fit (fit is updated by the watcher after every Create)
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_INFO]
description: Labels: show the job queue and the bed-fit info
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set lst = (sv.label_texts|default('')|string).split('|')|select('ne', '')|list %}
    {% if lst|length == 0 %}
        M117 No labels yet
        RESPOND MSG="Label queue is empty - Tools > Labels > Text, then Job > Add label"
    {% else %}
        M117 {lst|length} label(s) queued
        RESPOND MSG="Label queue ({lst|length}): {lst|join(' | ')}"
        RESPOND MSG="Label size {sv.label_w|default(60)|round(0)|int}x{sv.label_h|default(30)|round(0)|int}mm, font {sv.label_font|default('SMOOTH')}, size {sv.label_size|default(0)|round(1) if sv.label_size|default(0) > 0 else 'auto'}, spacing +{sv.label_spacing|default(0)|round(1)}mm, {sv.label_lines|default(1)|int} line(s), max {sv.label_max_chars|default(12)|int} chars/line, fit: {sv.label_fit|default('?')}"
    {% endif %}

# -------------------------------------------------------------------------------------
# LABEL_GENERATE - validate + bump the nonce (the watcher builds the file)
# -------------------------------------------------------------------------------------
[gcode_macro LABEL_GENERATE]
description: Labels: create the printable label file (bumps label_gen_nonce)
gcode:
    {% set sv  = printer['save_variables'].variables %}
    {% set lst = (sv.label_texts|default('')|string).split('|')|select('ne', '')|list %}
    {% if lst|length == 0 %}
        NOTIFY TEXT="No label in the queue - Text > type, then Job > Add label" LEVEL=warn SOUND=r2_notice
        M117 Labels: empty
    {% else %}
        SAVE_VARIABLE VARIABLE=label_gen_nonce VALUE={sv.label_gen_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_confirm
        M117 Labels creating..
        RESPOND MSG="Labels: creating the file for {lst|length} label(s) ({lst|join(' | ')})"
        RESPOND MSG="  base {sv.label_w|default(60)|round(0)|int}x{sv.label_h|default(30)|round(0)|int}mm, {sv.label_base_layers|default(4)|int}+{sv.label_text_layers|default(2)|int} layers, font {sv.label_font|default('SMOOTH')}, size {sv.label_size|default(0)|round(1) if sv.label_size|default(0) > 0 else 'auto'}, spacing +{sv.label_spacing|default(0)|round(1)}mm, up to {sv.label_lines|default(1)|int} line(s) per label, stroke {sv.label_stroke|default(0)|round(1)}mm{'' if sv.label_stroke|default(0) > 0 else ' (auto)'}"
        RESPOND MSG="  ready in a few seconds - it beeps and appears in the file list, start it like any file"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_LABELS - console/Mainsail entry point (sets the variables, then generates)
#   GEN_LABELS TEXT="A|B|C" W=60 H=30 FONT=SMOOTH BASE_LAYERS=4 TEXT_LAYERS=2
#              LAYER_H=0.2 FIRST_H=0.28 IRONING=1 HOLE=LEFT HOLE_D=5 BRIM=1
#              GAP=6 COLOR2=1 STROKE=2 SIZE=8 SPACING=1 LINES=2 MODE=GROW
#   MODE: GROW = the label grows until the text fits (default) - FIXED = the
#   label stays W/H and the font scales into it (R99)
#   TEXT is required; everything else is optional (LCD settings stay the defaults).
#   HOLE: NONE|LEFT|RIGHT|TOP|BOTTOM
#   R74: '~' splits ONE label into up to 3 lines ("TOP~BOTTOM"), SIZE = cap
#   height in mm (0 = auto), SPACING = extra mm between characters,
#   LINES = lines per label for the LCD editor flow.
# -------------------------------------------------------------------------------------
[gcode_macro GEN_LABELS]
description: Generate label plates: GEN_LABELS TEXT="A|B" W=60 H=30 FONT=SMOOTH|MONO|COND|NARROW|CAPS STROKE=2 HOLE=LEFT ...
gcode:
    {% set texts = params.TEXT|default('')|string %}
    {% if texts == '' or texts.split('|')|select('ne', '')|list|length == 0 %}
        RESPOND MSG="GEN_LABELS needs TEXT: GEN_LABELS TEXT=\"NAME 1|NAME 2\" W=60 H=30 (others optional)"
        M117 GEN_LABELS: no text
    {% elif '"' in texts or '\\' in texts or (params.FONT is defined and ('"' in (params.FONT|string) or '\\' in (params.FONT|string))) %}
        NOTIFY TEXT="GEN_LABELS: quotes and backslashes are not allowed in TEXT or FONT" LEVEL=error SOUND=r2_error
        M117 GEN_LABELS: bad character
    {% else %}
        {% set sides = {'NONE': 0, 'LEFT': 1, 'RIGHT': 2, 'TOP': 3, 'BOTTOM': 4} %}
        {% set hs = params.HOLE|default('')|string|upper %}
        {% set hs = sides[hs] if hs in sides else printer['save_variables'].variables.label_hole_side|default(0)|int %}
        SAVE_VARIABLE VARIABLE=label_texts VALUE="\"{texts}\""
        {% if params.W is defined %}SAVE_VARIABLE VARIABLE=label_w VALUE={params.W|float}{% endif %}
        {% if params.H is defined %}SAVE_VARIABLE VARIABLE=label_h VALUE={params.H|float}{% endif %}
        {% if params.FONT is defined %}SAVE_VARIABLE VARIABLE=label_font VALUE="\"{params.FONT|string|upper}\""{% endif %}
        {% if params.BASE_LAYERS is defined %}SAVE_VARIABLE VARIABLE=label_base_layers VALUE={params.BASE_LAYERS|int}{% endif %}
        {% if params.STROKE is defined %}SAVE_VARIABLE VARIABLE=label_stroke VALUE={params.STROKE|float|round(1)}{% endif %}
        {% if params.SIZE is defined %}SAVE_VARIABLE VARIABLE=label_size VALUE={params.SIZE|float}{% endif %}
        {% if params.SPACING is defined %}SAVE_VARIABLE VARIABLE=label_spacing VALUE={params.SPACING|float}{% endif %}
        {% if params.LINES is defined %}SAVE_VARIABLE VARIABLE=label_lines VALUE={[params.LINES|int, 5]|min}{% endif %}
        {% if params.TEXT_LAYERS is defined %}SAVE_VARIABLE VARIABLE=label_text_layers VALUE={params.TEXT_LAYERS|int}{% endif %}
        {% if params.LAYER_H is defined %}SAVE_VARIABLE VARIABLE=label_layer_h VALUE={params.LAYER_H|float}{% endif %}
        {% if params.FIRST_H is defined %}SAVE_VARIABLE VARIABLE=label_first_h VALUE={params.FIRST_H|float}{% endif %}
        {% if params.IRONING is defined %}SAVE_VARIABLE VARIABLE=label_ironing VALUE={params.IRONING|int == 1}{% endif %}
        {% if params.HOLE is defined or params.HOLE_D is defined %}
            SAVE_VARIABLE VARIABLE=label_hole_side VALUE={hs}
        {% endif %}
        {% if params.HOLE_D is defined %}SAVE_VARIABLE VARIABLE=label_hole_d VALUE={params.HOLE_D|float}{% endif %}
        {% if params.BRIM is defined %}SAVE_VARIABLE VARIABLE=label_brim VALUE={params.BRIM|int == 1}{% endif %}
        {% if params.GAP is defined %}SAVE_VARIABLE VARIABLE=label_gap VALUE={params.GAP|float}{% endif %}
        {% if params.COLOR2 is defined %}SAVE_VARIABLE VARIABLE=label_color2 VALUE={params.COLOR2|int == 1}{% endif %}
        {% if params.MODE is defined %}SAVE_VARIABLE VARIABLE=label_mode VALUE={1 if params.MODE|string|upper in ('FIXED','FIX','1') else 0}{% endif %}
        RESPOND MSG="GEN_LABELS: {texts.split('|')|select('ne', '')|list|length} label(s) queued - creating..."
        LABEL_GENERATE
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing/outdated copies
# -------------------------------------------------------------------------------------
[gcode_macro _V17_LABELS]
description: Version sentinel of 16_labels.cfg (internal)
gcode:
