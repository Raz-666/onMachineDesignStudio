# ======================================================================================
#  R121: BRICKS - stud-and-tube building blocks (generic naming on purpose:
#  bricks/plates/tiles, smooth studs, no logos, no brand names anywhere).
#  The generator (make_bricks in r2_postproc.py) prints every part with the
#  EXACT system geometry: pitch 8.0, brick 9.6, plate 3.2, stud O4.8 x 1.8
#  hollow, body n*8-0.2 (that minus 0.2 is what makes them CLAMP), wall 1.5,
#  underside tubes O6.31. One file = one color; every brick is its own
#  EXCLUDE_OBJECT (a failed part can be skipped and reprinted later).
#
#  Queue like the labels: Catalog pick + Count -> BRICK_ADD -> Create bumps
#  bricks_nonce, the watcher builds the file (beeps + selects).
#  NOTE: loop state uses namespace() - plain {% set %} inside {% for %} does
#  NOT survive the loop in jinja2.
# ======================================================================================

# -------------------------------------------------------------------------------------
# _BRICKS - shared state: the catalog list (kept in sync with r2_postproc's
# BRICK_CATALOG by the test battery) + the queue cap.
# -------------------------------------------------------------------------------------
[gcode_macro _BRICKS]
description: Bricks module state (internal)
variable_max_parts: 120
variable_catalog: ['B1x1','B1x2','B1x3','B1x4','B1x6','B1x8','B2x2','B2x3','B2x4','B2x6','B2x8','B4x4','B4x6','B4x8','B6x6','B6x8','B8x8','P1x2','P1x4','P1x6','P1x8','P1x1','P1x3','P2x2','P2x3','P2x4','P2x6','P2x8','P4x4','P4x6','P4x8','P6x6','P6x8','P8x8','T1x1','T1x2','T1x3','T1x4','T1x6','T1x8','T2x2','T2x3','T2x4','T2x6','T2x8']
gcode:

# -------------------------------------------------------------------------------------
# BRICK_ADD - add COUNT x CODE to the job queue (same code merges; the total
# part count is capped at 120 = one full plate).
# Queue format: 'CODE:COUNT|CODE:COUNT' (merged, one entry per code).
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_ADD]
description: Bricks: add CODE=B2x4 COUNT=2 to the queue (same code merges)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    {% set code = params.CODE|default('')|string|trim|upper|replace('X', 'x') %}
    {% set count = params.COUNT|default(sv.brick_count|default(1))|int %}
    {% set cur = sv.brick_jobs|default('')|string %}
    {% set parts = cur.split('|')|select('ne', '')|list if cur != '' else [] %}
    {% set ns = namespace(tot=0) %}
    {% for p in parts %}
        {% set ns.tot = ns.tot + (p.rsplit(':', 1)[1]|int if ':' in p else 0) %}
    {% endfor %}
    {% if code not in bm.catalog %}
        RESPOND MSG="BRICK_ADD: unknown code {code} - catalog: {bm.catalog|join(' ')}"
        M117 Bad brick
    {% elif not (1 <= count <= 99) %}
        RESPOND MSG="BRICK_ADD: COUNT must be 1..99"
        M117 Bad count
    {% elif ns.tot + count > bm.max_parts %}
        NOTIFY TEXT="Queue full: {ns.tot} part(s) queued, {bm.max_parts} max - create or clear first" LEVEL=warn SOUND=r2_notice
        M117 Queue full
    {% else %}
        {% set ns2 = namespace(new=parts, found=false) %}
        {% for i in range(ns2.new|length) %}
            {% if ns2.new[i].rsplit(':', 1)[0] == code %}
                {% set ns2.found = true %}
                {% set ns2.new = ns2.new[:i] + [code ~ ':' ~ (ns2.new[i].rsplit(':', 1)[1]|int + count)] + ns2.new[i+1:] %}
            {% endif %}
        {% endfor %}
        {% if not ns2.found %}
            {% set ns2.new = ns2.new + [code ~ ':' ~ count] %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{ ns2.new|join('|') }\""
        _PACE
        M117 +{count} {code}
        RESPOND MSG="Bricks: +{count} x {code} - queue now {ns.tot + count} part(s): { ns2.new|join('|') }"
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_DEL_LAST - remove the last queue entry
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_DEL_LAST]
description: Bricks: remove the last queue entry
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cur = sv.brick_jobs|default('')|string %}
    {% set parts = cur.split('|')|select('ne', '')|list if cur != '' else [] %}
    {% if parts|length == 0 %}
        M117 Queue empty
        RESPOND MSG="Bricks: the queue is empty"
    {% else %}
        {% set gone = parts[-1] %}
        {% set parts = parts[:-1] %}
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{ parts|join('|') }\""
        _PACE
        M117 -{gone}
        RESPOND MSG="Bricks: removed {gone} - { parts|join('|') if parts|length else 'queue empty' }"
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_CLEAR - empty the queue (2-press: CONFIRM=1)
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_CLEAR]
description: Bricks: clear the whole queue (press twice: CONFIRM=1)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if params.CONFIRM|default(0)|int != 1 %}
        RESPOND MSG="Bricks: really clear the queue? Press AGAIN with CONFIRM=1"
        M117 Again = clear
    {% else %}
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE='""'
        _PACE
        M117 Queue cleared
        RESPOND MSG="Bricks: queue cleared"
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_SHOW / BRICK_INFO - queue listing + geometry summary
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_SHOW]
description: Bricks: list the job queue
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cur = sv.brick_jobs|default('')|string %}
    {% if cur == '' %}
        RESPOND MSG="Bricks queue: empty - pick parts in Tools > Bricks > Catalog"
    {% else %}
        RESPOND MSG="Bricks queue: {cur}"
    {% endif %}

[gcode_macro BRICK_INFO]
description: Bricks: queue + geometry + how the parts print
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    BRICK_SHOW
    RESPOND MSG="Bricks: exact system geometry - pitch 8.0mm, brick 9.6, plate 3.2, stud O4.8x1.8 hollow, body n*8-0.2 (clamps!), wall 1.5, tube O6.31"
    RESPOND MSG="  layer {sv.bricks_layer_h|default(0.2)|float|round(2)}mm - layer 1 prints solid with a brim, the underside tubes open from layer 2"
    RESPOND MSG="  one file = one color, every part its own object (exclude + reprint a failed part) - max {bm.max_parts} parts per plate"
    RESPOND MSG="  catalog: {bm.catalog|length} codes - {bm.catalog|join(' ')}"

# -------------------------------------------------------------------------------------
# BRICK_CREATE - validate + bump the nonce (the watcher builds the file)
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_CREATE]
description: Bricks: create the file from the queue (bumps bricks_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cur = sv.brick_jobs|default('')|string %}
    {% if cur == '' %}
        NOTIFY TEXT="Queue is empty - pick parts in Tools > Bricks > Catalog first" LEVEL=warn SOUND=r2_notice
        M117 Bricks: empty
    {% else %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        _PACE
        SAVE_VARIABLE VARIABLE=bricks_nonce VALUE={sv.bricks_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_confirm
        M117 Bricks creating..
        RESPOND MSG="Bricks: creating from the queue ({cur}) - layer {sv.bricks_layer_h|default(0.2)|float|round(2)}mm, one color"
        RESPOND MSG="  a full plate takes a minute (own background thread) - it beeps and appears in the file list"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_BRICKS - console/Mainsail entry point: sets the queue, then creates.
#   GEN_BRICKS CODES='B2x4:3|P2x2:2|T1x2:1'
# -------------------------------------------------------------------------------------
[gcode_macro GEN_BRICKS]
description: Bricks: GEN_BRICKS CODES=B2x4:3|P2x2:2 (sets the queue, then creates)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    {% set raw = params.CODES|default('')|string|upper|replace('X', 'x') %}
    {% if raw == '' or '"' in raw or '\\' in raw %}
        RESPOND MSG="GEN_BRICKS needs CODES: GEN_BRICKS CODES=\"B2x4:3|P2x2:2\" (code:count, | separated)"
        M117 GEN_BRICKS: no codes
    {% else %}
        {% set ns = namespace(ok=true, tot=0) %}
        {% for seg in raw.split('|') %}
            {% if ':' in seg %}
                {% set c = seg.rsplit(':', 1)[0] %}
                {% set n = seg.rsplit(':', 1)[1]|int %}
                {% if c not in bm.catalog or not (1 <= n <= 99) %}
                    {% set ns.ok = false %}
                {% endif %}
                {% if 1 <= n <= 99 %}
                    {% set ns.tot = ns.tot + n %}
                {% endif %}
            {% else %}
                {% set ns.ok = false %}
            {% endif %}
        {% endfor %}
        {% if not ns.ok %}
            RESPOND MSG="GEN_BRICKS: every segment must be CODE:COUNT (1..99) - catalog: {bm.catalog|join(' ')}"
            M117 Bad codes
        {% elif ns.tot > bm.max_parts %}
            RESPOND MSG="GEN_BRICKS: {ns.tot} parts is over the {bm.max_parts} per plate - split the job"
            M117 Too many
        {% else %}
            SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{raw}\""
            _PACE
            BRICK_CREATE
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_BRICKKIT - console/Mainsail entry point: a sliced print file becomes a
#   stylized kit.   GEN_BRICKKIT SRC=box.gcode DETAIL=AUTO MODE=BY_LAYER COLORS=3
#   SRC=LAST (or empty) + INDEX=0..4 pick the newest sliced jobs; the LCD GO
#   button calls this without params (the saved variables win).
# -------------------------------------------------------------------------------------
[gcode_macro GEN_BRICKKIT]
description: Bricks: GEN_BRICKKIT SRC=box.gcode (sliced file -> building kit)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set src = params.SRC|default(sv.brickkit_src|default('')|string)|string %}
    {% set idx = params.INDEX|default(sv.brickkit_index|default(0)|int)|int %}
    {% set det = params.DETAIL|default(sv.brickkit_detail|default('AUTO')|string)|string|upper %}
    {% set mode = params.MODE|default(sv.brickkit_mode|default('BY_LAYER')|string)|string|upper %}
    {% set col = params.COLORS|default(sv.brickkit_colors|default(3)|int)|int %}
    {% if src and ('"' in src or '\\' in src or '..' in src or '/' in src or ':' in src) %}
        RESPOND MSG="GEN_BRICKKIT SRC: plain file name in the gcodes folder (or LAST) - no paths"
        M117 Bad source
    {% elif not (0 <= idx <= 4) %}
        RESPOND MSG="GEN_BRICKKIT INDEX must be 0..4 (0 = newest job, got {idx})"
        M117 Bad index
    {% elif det not in ('AUTO', 'MICRO', 'SMALL', 'BIG') %}
        RESPOND MSG="GEN_BRICKKIT DETAIL: AUTO, MICRO, SMALL or BIG (got {det})"
        M117 Bad detail
    {% elif mode not in ('BY_LAYER', 'BY_OBJECT') %}
        RESPOND MSG="GEN_BRICKKIT MODE: BY_LAYER or BY_OBJECT (got {mode})"
        M117 Bad mode
    {% elif not (1 <= col <= 8) %}
        RESPOND MSG="GEN_BRICKKIT COLORS must be 1..8 (got {col})"
        M117 Bad colors
    {% else %}
        {% set disp = src if src else 'LAST (newest job)' %}
        SAVE_VARIABLE VARIABLE=brickkit_src VALUE="\"{src}\""
        SAVE_VARIABLE VARIABLE=brickkit_index VALUE={idx}
        SAVE_VARIABLE VARIABLE=brickkit_detail VALUE="\"{det}\""
        SAVE_VARIABLE VARIABLE=brickkit_mode VALUE="\"{mode}\""
        SAVE_VARIABLE VARIABLE=brickkit_colors VALUE={col}
        _PACE
        SAVE_VARIABLE VARIABLE=brickkit_nonce VALUE={sv.brickkit_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_confirm
        M117 Kit creating..
        RESPOND MSG="Brick kit from {disp} - {det}, {mode}, {col} color(s)"
        RESPOND MSG="  support/brim/skirt stay out, closed bodies fill, hollow bodies become ring walls - built in a background thread, it beeps and appears in the file list (plates A, B, C...)"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_FIGURES - console/Mainsail entry point: stylized system figures.
#   GEN_FIGURES SCALE=100 COUNT=2   (100% = original size, mates with bricks)
# -------------------------------------------------------------------------------------
[gcode_macro GEN_FIGURES]
description: Bricks: GEN_FIGURES SCALE=100 COUNT=2 (system figures, original size or scaled)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set sc = params.SCALE|default(sv.figures_scale|default(100)|int)|int %}
    {% set ct = params.COUNT|default(sv.figures_count|default(1)|int)|int %}
    {% if not (25 <= sc <= 300) %}
        RESPOND MSG="GEN_FIGURES SCALE must be 25..300 percent - 100 = original size, mates with the bricks (got {sc})"
        M117 Bad scale
    {% elif not (1 <= ct <= 24) %}
        RESPOND MSG="GEN_FIGURES COUNT must be 1..24 figures (got {ct})"
        M117 Bad count
    {% else %}
        SAVE_VARIABLE VARIABLE=figures_scale VALUE={sc}
        SAVE_VARIABLE VARIABLE=figures_count VALUE={ct}
        _PACE
        SAVE_VARIABLE VARIABLE=figures_nonce VALUE={sv.figures_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_confirm
        M117 Figures creating..
        RESPOND MSG="Figures: {ct} figure(s) at {sc}% - 5 parts each (legs, torso, 2 arms, head), one color, assembly without glue"
        RESPOND MSG="  arms swing, the head turns - only 100% grips studs and takes hats - built in a background thread, it beeps and appears in the file list"
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing/outdated copies
# -------------------------------------------------------------------------------------
[gcode_macro _V19_BRICKS]
description: Version sentinel of 19_bricks.cfg (internal)
gcode:
    RESPOND MSG="19_bricks.cfg V1 (R121: building bricks)"
