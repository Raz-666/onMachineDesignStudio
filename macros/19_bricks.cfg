# ======================================================================================
#  R121: BRICKS - stud-and-tube building blocks (generic naming on purpose:
#  bricks/plates/tiles, smooth studs, no logos, no brand names anywhere).
#  The generator (make_bricks in r2_postproc.py) prints every part with the
#  EXACT system geometry: pitch 8.0, brick 9.6, plate 3.2, stud O4.8 x 1.8
#  hollow, body n*8-0.2 (that minus 0.2 is what makes them CLAMP), wall 1.5,
#  underside tubes O6.31. One file = one color; every brick is its own
#  EXCLUDE_OBJECT (a failed part can be skipped and reprinted later).
#
#  Queue like the labels: Catalog pick + Count -> BRICK_ADD -> Create bumps
#  bricks_nonce, the watcher builds the file (beeps + selects).
#  NOTE: loop state uses namespace() - plain {% set %} inside {% for %} does
#  NOT survive the loop in jinja2.
# ======================================================================================

# -------------------------------------------------------------------------------------
# _BRICKS - shared state: the catalog list (kept in sync with r2_postproc's
# BRICK_CATALOG by the test battery) + the queue cap.
# -------------------------------------------------------------------------------------
[gcode_macro _BRICKS]
description: Bricks module state (internal)
variable_max_parts: 120
variable_catalog: ['B1x1','P1x1','T1x1','B1x2','P1x2','T1x2','B1x3','P1x3','T1x3','B1x4','P1x4','T1x4','B1x6','P1x6','T1x6','B1x8','P1x8','T1x8','B2x2','P2x2','T2x2','B2x3','P2x3','T2x3','B2x4','P2x4','T2x4','B2x6','P2x6','T2x6','B2x8','P2x8','T2x8','B4x4','P4x4','T4x4','B4x6','P4x6','T4x6','B4x8','P4x8','T4x8','B6x6','P6x6','T6x6','B6x8','P6x8','T6x8','B8x8','P8x8','T8x8','J1x2','R1x1','RP1x1','RT1x1','C1x1','S1x2','S1x3','S1x4','S2x2','S2x3','S2x4','S2x6','I1x2','I1x3','I2x2','I2x3','A1x3','A1x4','A1x5','A1x6','H1x2','H1x3','H1x4','H1x6','H1x8']
gcode:

# -------------------------------------------------------------------------------------
# BRICK_ADD - add COUNT x CODE to the job queue (same code merges; the total
# part count is capped at 120 = one full plate).
# Queue format: 'CODE:COUNT|CODE:COUNT' (merged, one entry per code).
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_ADD]
description: Bricks: add CODE=B2x4 COUNT=2 to the queue (same code merges)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    {% set code = params.CODE|default('')|string|trim|upper|replace('X', 'x') %}
    {% set count = params.COUNT|default(sv.brick_count|default(1))|int %}
    # R232: heal LEGACY queue formats on read - a brick_jobs saved as a
    # list or with quote chars baked in survived every delete: DEL wrote
    # the same junk back and the display never changed
    {% set cur = sv.brick_jobs|default('')|string|replace('[', '')|replace(']', '')|replace("'", '')|replace('"', '')|replace(', ', '|') %}
    {% set parts = cur.split('|')|select('ne', '')|list %}
    {% set ns = namespace(tot=0) %}
    {% for p in parts %}
        {% set ns.tot = ns.tot + (p.rsplit(':', 1)[1]|int if ':' in p else 0) %}
    {% endfor %}
    {% if code not in bm.catalog %}
        RESPOND MSG="BRICK_ADD: unknown code {code} - catalog: {bm.catalog|join(' ')}"
        M117 Bad brick
    {% elif not (1 <= count <= 99) %}
        RESPOND MSG="BRICK_ADD: COUNT must be 1..99"
        M117 Bad count
    {% elif ns.tot + count > bm.max_parts %}
        NOTIFY TEXT="Queue full: {ns.tot} part(s) queued, {bm.max_parts} max - create or clear first" LEVEL=warn SOUND=r2_notice
        M117 Queue full
    {% else %}
        {% set ns2 = namespace(new=parts, found=false) %}
        {% for i in range(ns2.new|length) %}
            {% if ns2.new[i].rsplit(':', 1)[0] == code %}
                {% set ns2.found = true %}
                {% set ns2.new = ns2.new[:i] + [code ~ ':' ~ (ns2.new[i].rsplit(':', 1)[1]|int + count)] + ns2.new[i+1:] %}
            {% endif %}
        {% endfor %}
        {% if not ns2.found %}
            {% set ns2.new = ns2.new + [code ~ ':' ~ count] %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{ ns2.new|join('|') }\""
        _PACE
        M117 +{count} {code}
        RESPOND MSG="Bricks: +{count} x {code} - queue now {ns.tot + count} part(s): { ns2.new|join('|') }"
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_DEL_LAST - remove the last queue entry
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_DEL_LAST]
description: Bricks: remove the last queue entry
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R232: healed read (see BRICK_ADD) - one press visibly shrinks
    # the queue no matter what legacy format was stored
    {% set cur = sv.brick_jobs|default('')|string|replace('[', '')|replace(']', '')|replace("'", '')|replace('"', '')|replace(', ', '|') %}
    {% set parts = cur.split('|')|select('ne', '')|list %}
    {% if parts|length == 0 %}
        M117 Queue empty
        RESPOND MSG="Bricks: the queue is empty"
    {% else %}
        {% set gone = parts[-1] %}
        {% set parts = parts[:-1] %}
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{ parts|join('|') }\""
        _PACE
        M117 -{gone} ({parts|length} left)
        RESPOND MSG="Bricks: removed {gone} - { parts|join('|') if parts|length else 'queue empty' }"
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_CLEAR - empty the queue (2-press: CONFIRM=1)
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_CLEAR]
description: Bricks: clear the whole queue (press twice)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R232 FIELD FIX: the old 2-press asked for 'CONFIRM=1' - but the LCD
    # item never passed it, so NO amount of pressing ever cleared anything
    # (only Mainsail could). House pattern now: first press arms, second
    # press (or CONFIRM=1 from the console) clears.
    {% if (params.CONFIRM is defined and params.CONFIRM|int == 1) or printer['gcode_macro _STATE'].bq_armed|default(False) %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=bq_armed VALUE=False
        SAVE_VARIABLE VARIABLE=brick_jobs VALUE='""'
        _PACE
        M117 Queue cleared
        RESPOND MSG="Bricks: queue cleared"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=bq_armed VALUE=True
        RESPOND MSG="Bricks: really clear the queue? Press AGAIN"
        M117 Again = clear
    {% endif %}

# -------------------------------------------------------------------------------------
# BRICK_SHOW / BRICK_INFO - queue listing + geometry summary
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_SHOW]
description: Bricks: list the job queue
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cur = sv.brick_jobs|default('')|string|replace('[', '')|replace(']', '')|replace("'", '')|replace('"', '')|replace(', ', '|') %}
    {% if cur == '' %}
        RESPOND MSG="Bricks queue: empty - pick parts in Tools > Bricks > Catalog"
    {% else %}
        RESPOND MSG="Bricks queue: {cur}"
    {% endif %}

[gcode_macro BRICK_INFO]
description: Bricks: queue + geometry + how the parts print
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    BRICK_SHOW
    RESPOND MSG="Info: Bricks: exact system geometry - pitch 8.0mm, brick 9.6, plate 3.2, stud O4.8x1.8 hollow, body n*8-0.2 (clamps!), wall 1.5, tube O6.31 |   layer {sv.bricks_layer_h|default(0.2)|float|round(2)}mm - layer 1 prints solid, brim {sv.brick_brim|default(2)|int} loop(s), the underside tubes open from layer 2 |   colors {sv.brick_colors|default(1)|int} x {sv.brick_mode|default('BY_LAYER')|string}: BY_LAYER = one plate per color / BY_OBJECT = one plate + M600 - the layout is always centered |   every part its own object (exclude + reprint a failed part) - max {bm.max_parts} parts per plate |   catalog: {bm.catalog|length} codes in 8 families - {bm.catalog|join(' ')}"

# -------------------------------------------------------------------------------------
# BRICK_CREATE - validate + bump the nonce (the watcher builds the file)
# -------------------------------------------------------------------------------------
[gcode_macro BRICK_CREATE]
description: Bricks: create the file from the queue (bumps bricks_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set cur = sv.brick_jobs|default('')|string|replace('[', '')|replace(']', '')|replace("'", '')|replace('"', '')|replace(', ', '|') %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'bricks' %}
        _GEN_ARM KEY=bricks WHAT='the bricks file'
    {% elif cur == '' %}
        NOTIFY TEXT="Queue is empty - pick parts in Tools > Bricks > Catalog first" LEVEL=warn SOUND=r2_notice
        M117 Bricks: empty
    {% else %}
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=bricks{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        _PACE
        SAVE_VARIABLE VARIABLE=bricks_nonce VALUE={sv.bricks_nonce|default(0)|int + 1}
        M117 Bricks creating..
        RESPOND MSG="Bricks: creating from the queue ({cur}) - layer {sv.bricks_layer_h|default(0.2)|float|round(2)}mm, brim {sv.brick_brim|default(2)|int}, {sv.brick_colors|default(1)|int} color(s) {sv.brick_mode|default('BY_LAYER')|string}"
        RESPOND MSG="  a full plate takes a minute (own background thread) - it beeps and appears in the file list"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_BRICKS - console/Mainsail entry point: sets the queue, then creates.
#   GEN_BRICKS CODES='B2x4:3|P2x2:2|T1x2:1'
# -------------------------------------------------------------------------------------
# R133c: drop every PENDING generator job (litho, ColorPic, bricks, kit,
# figures). The watcher queues them one at a time - a chaotic session can
# leave a pile that keeps writing files you already deleted. A job that is
# MID-FILE right now finishes (it is already writing); everything waiting
# is dropped. Print start is never affected either way.
[gcode_macro GEN_QUEUE_CANCEL]
description: Drop all queued generator jobs (a running job finishes)
gcode:
    {% set sv = printer['save_variables'].variables %}
    SAVE_VARIABLE VARIABLE=queue_cancel_nonce VALUE={sv.queue_cancel_nonce|default(0)|int + 1}
    RESPOND MSG="Job queue: cancelling - the watcher reports how many were dropped"

[gcode_macro GEN_BRICKS]
description: Bricks: GEN_BRICKS CODES=B2x4:3|P2x2:2 MODE=BY_LAYER COLORS=3 BRIM=2
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set bm = printer['gcode_macro _BRICKS'] %}
    {% set raw = params.CODES|default('')|string|upper|replace('X', 'x') %}
    {% set bmode = params.MODE|default(sv.brick_mode|default('BY_LAYER')|string)|string|upper|replace('-', '_') %}
    {% set bcol = params.COLORS|default(sv.brick_colors|default(1))|int %}
    {% set bbrim = params.BRIM|default(sv.brick_brim|default(2))|int %}
    {% if bmode not in ('BY_LAYER', 'BY_OBJECT') %}
        RESPOND MSG="GEN_BRICKS MODE: BY_LAYER or BY_OBJECT (got {bmode})"
        M117 Bad mode
    {% elif not (1 <= bcol <= 8) %}
        RESPOND MSG="GEN_BRICKS COLORS must be 1..8 (got {bcol})"
        M117 Bad colors
    {% elif not (0 <= bbrim <= 8) %}
        RESPOND MSG="GEN_BRICKS BRIM must be 0..8 loops (got {bbrim})"
        M117 Bad brim
    {% elif raw == '' or '"' in raw or '\\' in raw %}
        RESPOND MSG="GEN_BRICKS needs CODES: GEN_BRICKS CODES=\"B2x4:3|P2x2:2\" (code:count, | separated)"
        M117 GEN_BRICKS: no codes
    {% else %}
        {% set ns = namespace(ok=true, tot=0) %}
        {% for seg in raw.split('|') %}
            {% if ':' in seg %}
                {% set c = seg.rsplit(':', 1)[0] %}
                {% set n = seg.rsplit(':', 1)[1]|int %}
                {% if c not in bm.catalog or not (1 <= n <= 99) %}
                    {% set ns.ok = false %}
                {% endif %}
                {% if 1 <= n <= 99 %}
                    {% set ns.tot = ns.tot + n %}
                {% endif %}
            {% else %}
                {% set ns.ok = false %}
            {% endif %}
        {% endfor %}
        {% if not ns.ok %}
            RESPOND MSG="GEN_BRICKS: every segment must be CODE:COUNT (1..99) - catalog: {bm.catalog|join(' ')}"
            M117 Bad codes
        {% elif ns.tot > bm.max_parts %}
            RESPOND MSG="GEN_BRICKS: {ns.tot} parts is over the {bm.max_parts} per plate - split the job"
            M117 Too many
        {% else %}
            SAVE_VARIABLE VARIABLE=brick_jobs VALUE="\"{raw}\""
            _PACE
            SAVE_VARIABLE VARIABLE=brick_mode VALUE="\"{bmode}\""
            _PACE
            SAVE_VARIABLE VARIABLE=brick_colors VALUE={bcol}
            _PACE
            SAVE_VARIABLE VARIABLE=brick_brim VALUE={bbrim}
            {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
            BRICK_CREATE
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_BRICKKIT - console/Mainsail entry point: a sliced print file becomes a
#   stylized kit.   GEN_BRICKKIT SRC=box.gcode DETAIL=AUTO MODE=BY_LAYER COLORS=3
#   SRC=LAST (or empty) + INDEX=0..4 pick the newest sliced jobs; the LCD GO
#   button calls this without params (the saved variables win).
# -------------------------------------------------------------------------------------
# R133d: the kit source is the file SELECTED in the file list (the
# in-memory _PREVIEW card, like Texture) - never a guessed 'newest job'
# and never a stale save_variables fallback. INDEX stays for Mainsail.
[gcode_macro GEN_BRICKKIT]
description: Bricks: GEN_BRICKKIT SRC=box.gcode (sliced file -> building kit)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set sel = printer['gcode_macro _PREVIEW'].name|default('')|string %}
    {% set src = params.SRC|default('')|string %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% if src == 'LAST' %}
        {% set src = '' %}
    {% endif %}
    {% if not src and idx < 0 %}
        {% set src = sel %}
    {% endif %}
    {% set det = params.DETAIL|default(sv.brickkit_detail|default('AUTO')|string)|string|upper %}
    {% set mode = params.MODE|default(sv.brickkit_mode|default('BY_LAYER')|string)|string|upper %}
    {% set col = params.COLORS|default(sv.brickkit_colors|default(3)|int)|int %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'kit' %}
        _GEN_ARM KEY=kit WHAT='the brick kit'
    {% elif not src and idx < 0 %}
        RESPOND MSG="Kit: no file selected - pick one in the file list first (or Mainsail: SRC=box.gcode / INDEX=0..4)"
        M117 Pick a file
    {% elif src and ('"' in src or '\\' in src or '..' in src or '/' in src or ':' in src) %}
        RESPOND MSG="GEN_BRICKKIT SRC: plain file name in the gcodes folder (or LAST) - no paths"
        M117 Bad source
    {% elif not (-1 <= idx <= 4) %}
        RESPOND MSG="GEN_BRICKKIT INDEX must be 0..4 (0 = newest job, got {idx})"
        M117 Bad index
    {% elif det not in ('AUTO', 'MICRO', 'SMALL', 'BIG') %}
        RESPOND MSG="GEN_BRICKKIT DETAIL: AUTO, MICRO, SMALL or BIG (got {det})"
        M117 Bad detail
    {% elif mode not in ('BY_LAYER', 'BY_OBJECT') %}
        RESPOND MSG="GEN_BRICKKIT MODE: BY_LAYER or BY_OBJECT (got {mode})"
        M117 Bad mode
    {% elif not (1 <= col <= 8) %}
        RESPOND MSG="GEN_BRICKKIT COLORS must be 1..8 (got {col})"
        M117 Bad colors
    {% else %}
        {% set disp = src if src else 'recent job %d' % (idx + 1) %}
        SAVE_VARIABLE VARIABLE=brickkit_src VALUE="\"{src}\""
        SAVE_VARIABLE VARIABLE=brickkit_index VALUE={idx}
        SAVE_VARIABLE VARIABLE=brickkit_detail VALUE="\"{det}\""
        SAVE_VARIABLE VARIABLE=brickkit_mode VALUE="\"{mode}\""
        SAVE_VARIABLE VARIABLE=brickkit_colors VALUE={col}
        _PACE
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=kit{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=brickkit_nonce VALUE={sv.brickkit_nonce|default(0)|int + 1}
        M117 Kit creating..
        RESPOND MSG="Brick kit from {disp} - {det}, {mode}, {col} color(s)"
        RESPOND MSG="  support/brim/skirt stay out, closed bodies fill, hollow bodies become ring walls - built in a background thread, it beeps and appears in the file list (plates A, B, C...)"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_FIGURES - console/Mainsail entry point: stylized system figures.
#   GEN_FIGURES SCALE=100 COUNT=2   (100% = original size, mates with bricks)
# -------------------------------------------------------------------------------------
[gcode_macro GEN_FIGURES]
description: Bricks: GEN_FIGURES SCALE=100 COUNT=2 MODE=PARTS COLORS=4 BRIM=2
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set sc = params.SCALE|default(sv.figures_scale|default(100)|int)|int %}
    {% set ct = params.COUNT|default(sv.figures_count|default(1)|int)|int %}
    {% set fmode = params.MODE|default(sv.figures_mode|default('PARTS')|string)|string|upper %}
    {% set fcol = params.COLORS|default(sv.figures_colors|default(1))|int %}
    {% set fbrim = params.BRIM|default(sv.figures_brim|default(2))|int %}
    {% set fcmod = params.COLORMODE|default(sv.figures_colormode|default('BY_LAYER')|string)|string|upper|replace('-', '_') %}
    # R160: LCD rows pass CONFIRM=1 - first press arms, second starts
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'figures' %}
        _GEN_ARM KEY=figures WHAT='the figures'
    {% elif not (25 <= sc <= 300) %}
        RESPOND MSG="GEN_FIGURES SCALE must be 25..300 percent - 100 = original size, mates with the bricks (got {sc})"
        M117 Bad scale
    {% elif not (1 <= ct <= 24) %}
        RESPOND MSG="GEN_FIGURES COUNT must be 1..24 figures (got {ct})"
        M117 Bad count
    {% elif fmode not in ('PARTS', 'SINGLE') %}
        RESPOND MSG="GEN_FIGURES MODE: PARTS (5 parts, assembly without glue) or SINGLE (one fused piece - got {fmode})"
        M117 Bad mode
    {% elif fcmod not in ('BY_LAYER', 'BY_OBJECT') %}
        RESPOND MSG="GEN_FIGURES COLORMODE: BY_LAYER or BY_OBJECT (got {fcmod})"
        M117 Bad colormode
    {% elif not (1 <= fcol <= 4) %}
        RESPOND MSG="GEN_FIGURES COLORS must be 1..4 (legs, torso, arms, head - got {fcol})"
        M117 Bad colors
    {% elif not (0 <= fbrim <= 8) %}
        RESPOND MSG="GEN_FIGURES BRIM must be 0..8 loops (got {fbrim})"
        M117 Bad brim
    {% else %}
        SAVE_VARIABLE VARIABLE=figures_scale VALUE={sc}
        SAVE_VARIABLE VARIABLE=figures_count VALUE={ct}
        _PACE
        SAVE_VARIABLE VARIABLE=figures_mode VALUE="\"{fmode}\""
        SAVE_VARIABLE VARIABLE=figures_colormode VALUE="\"{fcmod}\""
        SAVE_VARIABLE VARIABLE=figures_colors VALUE={fcol}
        SAVE_VARIABLE VARIABLE=figures_brim VALUE={fbrim}
        _PACE
        {% if params.CONFIRM|default(0)|int == 1 %}_GEN_GO KEY=figures{% endif %}
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=figures_nonce VALUE={sv.figures_nonce|default(0)|int + 1}
        M117 Figures creating..
        {% if fmode == 'SINGLE' %}
            RESPOND MSG="Figures: {ct} figure(s) at {sc}% - SINGLE: one fused piece, no clutch elements, brim {fbrim}"
            RESPOND MSG="  feet still click onto studs, hats still fit at 100% - built in a background thread, it beeps and appears in the file list"
        {% else %}
            RESPOND MSG="Figures: {ct} figure(s) at {sc}% - 5 parts each (legs, torso, 2 arms, head), brim {fbrim}, {fcol} color(s) {fcmod}"
            RESPOND MSG="  the arm prints LYING (both holes real through-tubes) - arms swing, the head turns, only 100% grips studs and takes hats"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing/outdated copies
# -------------------------------------------------------------------------------------
[gcode_macro _V19_BRICKS]
description: Version sentinel of 19_bricks.cfg (internal)
gcode:
    RESPOND MSG="19_bricks.cfg V2 (R132: catalog 76 + colors/brim + figures single/lying arm)"
