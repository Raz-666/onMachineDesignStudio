# =====================================================================================
#  05_materials.cfg - Material presets: temps, pressure advance, retraction, mesh
#  -----------------------------------------------------------------------------------
#  Every material provides:
#    bed / bed_after      : bed temp first layer / from layer 2
#    hotend_first / after : hotend temp first layer / following layers (the "after"
#                           temp is the STEADY print temp -> used for PID decisions!)
#    pa                   : pressure advance start value (direct drive + BMG)
#    retract_len/speed    : retraction (BMG typical values)
#    fan_max              : max part cooling fan %
#    mesh_profile         : bed mesh profile belonging to this material
#
#  Tune these to your setup (PA/retract via the Maintenance menu).
# =====================================================================================
[gcode_macro _MATERIALS]
description: Internal material database (do not call directly)
variable_presets: {
    # temperatures: bed/hotend for LAYER 1 and from LAYER 2
    # pa / flow / retract: loaded into the pre-print overrides by SET_MATERIAL
    # (your saved values mat_<material>_<key> always win over these defaults)
    'PLA':  {'bed1':60,  'bed2':60,  'hot1':210, 'hot2':210, 'pa':0.05, 'pa_smooth':0.04, 'flow':100, 'ret_len':0.75, 'ret_spd':35, 'unret_spd':35, 'fan2':100},
    'PETG': {'bed1':75,  'bed2':75,  'hot1':240, 'hot2':240, 'pa':0.06, 'pa_smooth':0.04, 'flow':100, 'ret_len':0.9,  'ret_spd':35, 'unret_spd':30, 'fan2':60},
    'ABS':  {'bed1':100, 'bed2':100, 'hot1':250, 'hot2':250, 'pa':0.05, 'pa_smooth':0.04, 'flow':100, 'ret_len':0.75, 'ret_spd':35, 'unret_spd':30, 'fan2':30},
    'ASA':  {'bed1':100, 'bed2':100, 'hot1':255, 'hot2':255, 'pa':0.05, 'pa_smooth':0.04, 'flow':100, 'ret_len':0.75, 'ret_spd':35, 'unret_spd':30, 'fan2':30},
    'TPU':  {'bed1':35,  'bed2':35,  'hot1':215, 'hot2':215, 'pa':0.09, 'pa_smooth':0.04, 'flow':105, 'ret_len':1.2,  'ret_spd':20, 'unret_spd':20, 'fan2':70}
    }
gcode:
    M117 _MATERIALS

# -------------------------------------------------------------------------------------
# SET_MATERIAL - choose material (LCD, Mainsail, console)
#   SET_MATERIAL MATERIAL=PETG                -> just select it
#   SET_MATERIAL MATERIAL=PETG APPLY_PRESET=1 -> select AND write preset values into
#                                               the pre-print overrides (switches them ON)
# -------------------------------------------------------------------------------------
[gcode_macro SET_MATERIAL]
description: Select material + load its temperature preset (bed/hotend, 1st + 2nd layer)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    {% set mat = params.MATERIAL|default('')|string|upper %}
    {% set apply = params.APPLY_PRESET|default(1)|int == 1 %}
    {% if mat not in db %}
        NOTIFY TEXT="Unknown material '{mat}' (PLA/PETG/ABS/ASA/TPU)" LEVEL=error SOUND=r2_error
    {% else %}
        SAVE_VARIABLE VARIABLE=material VALUE='"{mat}"'
        _PACE
        {% if apply %}
            # saved values (SAVE_MATERIAL_TEMPS) win, then the file defaults
            {% set b1 = sv['mat_' ~ mat|lower ~ '_bed1']|default(db[mat].bed1)|float %}
            {% set b2 = sv['mat_' ~ mat|lower ~ '_bed2']|default(db[mat].bed2)|float %}
            {% set h1 = sv['mat_' ~ mat|lower ~ '_hot1']|default(db[mat].hot1)|float %}
            {% set h2 = sv['mat_' ~ mat|lower ~ '_hot2']|default(db[mat].hot2)|float %}
            SAVE_VARIABLE VARIABLE=ov_bed VALUE={b1}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_bed_after VALUE={b2}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_hotend_first VALUE={h1}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_hotend_after VALUE={h2}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_bed_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_bed_after_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_hotend_first_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_hotend_after_on VALUE=True
            _PACE
            # PA / flow / retraction ride along (saved values win, then file defaults)
            {% set pa = sv['mat_' ~ mat|lower ~ '_pa']|default(db[mat].pa)|float %}
            {% set fl = sv['mat_' ~ mat|lower ~ '_flow']|default(db[mat].flow)|float %}
            {% set rl = sv['mat_' ~ mat|lower ~ '_retlen']|default(db[mat].ret_len)|float %}
            {% set rs = sv['mat_' ~ mat|lower ~ '_retspd']|default(db[mat].ret_spd)|float %}
            {% set fn = sv['mat_' ~ mat|lower ~ '_fan']|default(db[mat].fan2)|float %}
            {% set psm = sv['mat_' ~ mat|lower ~ '_pasmooth']|default(db[mat].pa_smooth)|float %}
            {% set ru = sv['mat_' ~ mat|lower ~ '_unret']|default(db[mat].unret_spd)|float %}
            SAVE_VARIABLE VARIABLE=ov_fan VALUE={fn|round}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_fan_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_pa VALUE={pa|round(4)}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_pa_smooth VALUE={psm|round(3)}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_unretract_speed VALUE={ru|round}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_unretract_speed_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_flow VALUE={fl|round}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_flow_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_retract_len VALUE={rl}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_retract_speed VALUE={rs}
            _PACE
            SAVE_VARIABLE VARIABLE=ov_retract_len_on VALUE=True
            _PACE
            SAVE_VARIABLE VARIABLE=ov_retract_speed_on VALUE=True
            _SYNC_OV_FEAT
            NOTIFY TEXT="Material {mat}: bed {b1|round|int}/{b2|round|int}C hotend {h1|round|int}/{h2|round|int}C (L1/L2) | PA {pa|round(3)} flow {fl|round|int}% retract {rl}mm@{rs} fan {fn|round|int}% (L2) - ON" LEVEL=ok SOUND=r2_confirm
        {% else %}
            NOTIFY TEXT="Material {mat} selected (preset NOT loaded)" LEVEL=ok SOUND=r2_confirm
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SAVE_MATERIAL_TEMPS - save the CURRENT temperature overrides as this material's
# preset (so 'PLA' forever uses YOUR temps). LCD: Material > 'Save current as preset'
# -------------------------------------------------------------------------------------
[gcode_macro SAVE_MATERIAL_TEMPS]
description: Save current temp overwrites as the material's preset
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set mat = params.MATERIAL|default(sv.material|default(''))|string|upper %}
    {% if mat == '' %}
        NOTIFY TEXT="No material selected" LEVEL=warn SOUND=r2_notice
    {% else %}
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_bed1 VALUE={sv.ov_bed|default(60)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_bed2 VALUE={sv.ov_bed_after|default(60)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_hot1 VALUE={sv.ov_hotend_first|default(210)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_hot2 VALUE={sv.ov_hotend_after|default(210)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_pa VALUE={sv.ov_pa|default(0.05)|float|round(4)}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_flow VALUE={sv.ov_flow|default(100)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_retlen VALUE={sv.ov_retract_len|default(0.75)|float|round(2)}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_retspd VALUE={sv.ov_retract_speed|default(35)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_pasmooth VALUE={sv.ov_pa_smooth|default(0.04)|float|round(3)}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_unret VALUE={sv.ov_unretract_speed|default(35)|float|round}
        _PACE
        SAVE_VARIABLE VARIABLE=mat_{mat|lower}_fan VALUE={sv.ov_fan|default(100)|float|round}
        NOTIFY TEXT="Preset {mat} saved: bed {sv.ov_bed|default(60)|float|round}/{sv.ov_bed_after|default(60)|float|round}C hotend {sv.ov_hotend_first|default(210)|float|round}/{sv.ov_hotend_after|default(210)|float|round}C | PA {sv.ov_pa|default(0.05)} flow {sv.ov_flow|default(100)|round|int}% retract {sv.ov_retract_len|default(0.75)}@{sv.ov_retract_speed|default(35)} fan {sv.ov_fan|default(100)|round|int}%" LEVEL=ok SOUND=r2_confirm
    {% endif %}

# -------------------------------------------------------------------------------------
# SHOW_MATERIAL - show the preset of the currently selected material
# -------------------------------------------------------------------------------------
[gcode_macro SHOW_MATERIAL]
description: Show the current material's temperature preset
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set db = printer['gcode_macro _MATERIALS'].presets %}
    {% set mat = sv.material|default('PLA')|string|upper %}
    {% if mat in db %}
        {% set b1 = sv['mat_' ~ mat|lower ~ '_bed1']|default(db[mat].bed1)|float %}
        {% set b2 = sv['mat_' ~ mat|lower ~ '_bed2']|default(db[mat].bed2)|float %}
        {% set h1 = sv['mat_' ~ mat|lower ~ '_hot1']|default(db[mat].hot1)|float %}
        {% set h2 = sv['mat_' ~ mat|lower ~ '_hot2']|default(db[mat].hot2)|float %}
        RESPOND MSG="{mat} preset: bed {b1|round|int}C (1st) / {b2|round|int}C (2nd+)  hotend {h1|round|int}C (1st) / {h2|round|int}C (2nd+)"
    {% else %}
        RESPOND MSG="Unknown material {mat}"
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
# =====================================================================================
#  R62 DEFAULT PRESETS - "print again with exactly these settings".
#  After a print the LIVE values are synced back into the pre-print overrides
#  (_CAPTURE_PRINT_SETTINGS at PRINT_END). SAVE_DEFAULT_PRESET then stores the
#  WHOLE pre-print state (every override value + ON switch + per-feature
#  speed/accel/flow) into the next FREE slot 1..8:
#    - never overwrites an existing slot (lowest free number wins)
#    - material presets stay untouched (they are meant to be overwritten)
#  LCD: Pre-Print > Defaults. Console: SAVE_DEFAULT_PRESET / LOAD_DEFAULT_PRESET
#       N / DELETE_DEFAULT_PRESET N / DEFAULT_PRESETS_INFO
# =====================================================================================
[gcode_macro DEFAULT_PRESETS_INFO]
description: List the default preset slots (1-8): free or in use
gcode:
    {% set sv = printer['save_variables'].variables %}
    RESPOND MSG="Default presets (slots 1-8):"
    {% for n in range(1, 9) %}
        {% set d = sv['default_preset_' ~ n]|default(0) %}
        {% if d %}
            RESPOND MSG="  {n}: {d.material|default('?')} bed {d.bed|default(0)|round(0)}/{d.bed_after|default(0)|round(0)}C hotend {d.hotend_first|default(0)|round(0)}/{d.hotend_after|default(0)|round(0)}C PA {d.pa|default(0)|round(3)} flow {d.flow|default(100)|round(0)}% ({d.overrides|default(0)} on)"
        {% else %}
            RESPOND MSG="  {n}: free"
        {% endif %}
    {% endfor %}

[gcode_macro SAVE_DEFAULT_PRESET]
description: Store the current pre-print settings as a default preset (next free slot 1-8)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # namespace: a plain {% set %} inside {% for %} never escapes the loop (Jinja scoping)
    {% set ns = namespace(slot=0, cnt=0) %}
    {% for n in range(1, 9) %}
        {% if ns.slot == 0 and sv['default_preset_' ~ n]|default(0) == 0 %}
            {% set ns.slot = n %}
        {% endif %}
    {% endfor %}
    {% if ns.slot == 0 %}
        NOTIFY TEXT="All 8 default slots full - delete one first (DELETE_DEFAULT_PRESET N)" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% if sv.ov_bed_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_bed_after_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_hotend_first_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_hotend_after_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_pa_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_retract_len_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_accel_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_velocity_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_fan_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% if sv.ov_flow_on|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
            {% if sv['ovf_' ~ c ~ '_on']|default(False) %}{% set ns.cnt = ns.cnt + 1 %}{% endif %}
        {% endfor %}
        # R213: feats built by LOOP (c1..c9 custom slots included) - the old
        # explicit dict would need 9 more hand-written lines per snapshot
        {% set fpair = namespace(pairs=[]) %}
        {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
            {% set fpair.pairs = fpair.pairs + [(c, [sv['ovf_' ~ c ~ '_on']|default(False), sv['ovf_' ~ c ~ '_spd']|default(100)|float, sv['ovf_' ~ c ~ '_acc']|default(0)|float, sv['ovf_' ~ c ~ '_flw']|default(100)|float, sv['ovf_' ~ c ~ '_pa']|default(0)|float])] %}
        {% endfor %}
        {% set snap = {
            'material': sv.material|default('PLA')|string,
            'bed': sv.ov_bed|default(0)|float, 'bed_on': sv.ov_bed_on|default(False),
            'bed_after': sv.ov_bed_after|default(0)|float, 'bed_after_on': sv.ov_bed_after_on|default(False),
            'hotend_first': sv.ov_hotend_first|default(0)|float, 'hotend_first_on': sv.ov_hotend_first_on|default(False),
            'hotend_after': sv.ov_hotend_after|default(0)|float, 'hotend_after_on': sv.ov_hotend_after_on|default(False),
            'pa': sv.ov_pa|default(0)|float, 'pa_on': sv.ov_pa_on|default(False),
            'pa_smooth': sv.ov_pa_smooth|default(0.04)|float, 'pa_smooth_on': sv.ov_pa_smooth_on|default(False),
            'retract_len': sv.ov_retract_len|default(0)|float, 'retract_len_on': sv.ov_retract_len_on|default(False),
            'retract_speed': sv.ov_retract_speed|default(0)|float, 'retract_speed_on': sv.ov_retract_speed_on|default(False),
            'unretract_speed': sv.ov_unretract_speed|default(0)|float, 'unretract_speed_on': sv.ov_unretract_speed_on|default(False),
            'accel': sv.ov_accel|default(0)|float, 'accel_on': sv.ov_accel_on|default(False),
            'velocity': sv.ov_velocity|default(0)|float, 'velocity_on': sv.ov_velocity_on|default(False),
            'min_cruise': sv.ov_min_cruise|default(0)|float, 'min_cruise_on': sv.ov_min_cruise_on|default(False),
            'square_corner': sv.ov_square_corner|default(0)|float, 'square_corner_on': sv.ov_square_corner_on|default(False),
            'flow': sv.ov_flow|default(100)|float, 'flow_on': sv.ov_flow_on|default(False),
            'fan': sv.ov_fan|default(100)|float, 'fan_on': sv.ov_fan_on|default(False),
            'ironing_flow': sv.ov_ironing_flow|default(100)|float, 'ironing_flow_on': sv.ov_ironing_flow_on|default(False),
            'first_layer_speed': sv.first_layer_speed|default(75)|float,
            'fan_min': sv.ov_fan_min|default(0)|float, 'fan_max': sv.ov_fan_max|default(100)|float,
            'fan_bridge': sv.ov_fan_bridge|default(0)|float, 'fan_clamp_on': sv.ov_fan_clamp_on|default(False),
            'shaper_off_feat': sv.ovf_shaper_off_feat|default('')|string, 'shaper_off_on': sv.ovf_shaper_off_on|default(False),
            'overrides': ns.cnt,
            'feats': {
                'wallouter': [sv.ovf_wallouter_on|default(False), sv.ovf_wallouter_spd|default(100)|float, sv.ovf_wallouter_acc|default(0)|float, sv.ovf_wallouter_flw|default(100)|float, sv.ovf_wallouter_pa|default(0)|float],
                'wallinner': [sv.ovf_wallinner_on|default(False), sv.ovf_wallinner_spd|default(100)|float, sv.ovf_wallinner_acc|default(0)|float, sv.ovf_wallinner_flw|default(100)|float, sv.ovf_wallinner_pa|default(0)|float],
                'infillsparse': [sv.ovf_infillsparse_on|default(False), sv.ovf_infillsparse_spd|default(100)|float, sv.ovf_infillsparse_acc|default(0)|float, sv.ovf_infillsparse_flw|default(100)|float, sv.ovf_infillsparse_pa|default(0)|float],
                'infillsolid': [sv.ovf_infillsolid_on|default(False), sv.ovf_infillsolid_spd|default(100)|float, sv.ovf_infillsolid_acc|default(0)|float, sv.ovf_infillsolid_flw|default(100)|float, sv.ovf_infillsolid_pa|default(0)|float],
                'surfacetop': [sv.ovf_surfacetop_on|default(False), sv.ovf_surfacetop_spd|default(100)|float, sv.ovf_surfacetop_acc|default(0)|float, sv.ovf_surfacetop_flw|default(100)|float, sv.ovf_surfacetop_pa|default(0)|float],
                'surfacebottom': [sv.ovf_surfacebottom_on|default(False), sv.ovf_surfacebottom_spd|default(100)|float, sv.ovf_surfacebottom_acc|default(0)|float, sv.ovf_surfacebottom_flw|default(100)|float, sv.ovf_surfacebottom_pa|default(0)|float],
                'bridge': [sv.ovf_bridge_on|default(False), sv.ovf_bridge_spd|default(100)|float, sv.ovf_bridge_acc|default(0)|float, sv.ovf_bridge_flw|default(100)|float, sv.ovf_bridge_pa|default(0)|float],
                'gaps': [sv.ovf_gaps_on|default(False), sv.ovf_gaps_spd|default(100)|float, sv.ovf_gaps_acc|default(0)|float, sv.ovf_gaps_flw|default(100)|float, sv.ovf_gaps_pa|default(0)|float],
                'support': [sv.ovf_support_on|default(False), sv.ovf_support_spd|default(100)|float, sv.ovf_support_acc|default(0)|float, sv.ovf_support_flw|default(100)|float, sv.ovf_support_pa|default(0)|float],
                'ironing': [sv.ovf_ironing_on|default(False), sv.ovf_ironing_spd|default(100)|float, sv.ovf_ironing_acc|default(0)|float, sv.ovf_ironing_flw|default(100)|float, sv.ovf_ironing_pa|default(0)|float],
                'skirt': [sv.ovf_skirt_on|default(False), sv.ovf_skirt_spd|default(100)|float, sv.ovf_skirt_acc|default(0)|float, sv.ovf_skirt_flw|default(100)|float, sv.ovf_skirt_pa|default(0)|float],
                'brim': [sv.ovf_brim_on|default(False), sv.ovf_brim_spd|default(100)|float, sv.ovf_brim_acc|default(0)|float, sv.ovf_brim_flw|default(100)|float, sv.ovf_brim_pa|default(0)|float],
        'overhangperim': [sv.ovf_overhangperim_on|default(False), sv.ovf_overhangperim_spd|default(100)|float, sv.ovf_overhangperim_acc|default(0)|float, sv.ovf_overhangperim_flw|default(100)|float, sv.ovf_overhangperim_pa|default(0)|float],
        'internalbridge': [sv.ovf_internalbridge_on|default(False), sv.ovf_internalbridge_spd|default(100)|float, sv.ovf_internalbridge_acc|default(0)|float, sv.ovf_internalbridge_flw|default(100)|float, sv.ovf_internalbridge_pa|default(0)|float],
        'primetower': [sv.ovf_primetower_on|default(False), sv.ovf_primetower_spd|default(100)|float, sv.ovf_primetower_acc|default(0)|float, sv.ovf_primetower_flw|default(100)|float, sv.ovf_primetower_pa|default(0)|float],
        'custom': [sv.ovf_custom_on|default(False), sv.ovf_custom_spd|default(100)|float, sv.ovf_custom_acc|default(0)|float, sv.ovf_custom_flw|default(100)|float, sv.ovf_custom_pa|default(0)|float],
            },
        } %}
        # R70: a rendered dict contains spaces -> shlex splits it -> 'Malformed
        # command' (the preset was NEVER saved in the field, log .53 11:21/11:23).
        # A DICT goes in NAKED shlex quotes (VALUE="{...}"): shlex strips only
        # the outer quotes, literal_eval then parses the dict literal itself
        # (escaped inner quotes would make it a STRING - the load needs the real
        # dict). Safe because the content is a Python repr, sanitized of
        # quote/semicolon. STRING values (R69) keep the escaped form - NEVER
        # copy this naked pattern for free text!
        {% set snaps = snap|string|replace('"', '')|replace(';', '') %}
        SAVE_VARIABLE VARIABLE=default_preset_{ns.slot|lower} VALUE="{snaps}"
        RESPOND MSG="Default preset {ns.slot}/8 SAVED: {snap.material} | {ns.cnt} overrides on"
        RESPOND MSG="  (temps {snap.bed|round(0)}/{snap.bed_after|round(0)}C bed, {snap.hotend_first|round(0)}/{snap.hotend_after|round(0)}C hotend, PA {snap.pa|round(3)}, flow {snap.flow|round(0)}%)"
        M117 Saved: Default {ns.slot}
        _SOUND_LIB NAME=r2_confirm
    {% endif %}

[gcode_macro LOAD_DEFAULT_PRESET]
description: Load default preset N into the pre-print settings (1-8)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set n = params.N|default(0)|int %}
    {% set d = sv['default_preset_' ~ n]|default(0) if n >= 1 and n <= 8 else 0 %}
    {% if not d %}
        NOTIFY TEXT="Default slot {n} is empty" LEVEL=warn SOUND=r2_notice
    {% else %}
        # R109: the apply loop lives in _PROFILE_APPLY (ONE code path for
        # default presets AND file profiles). The old inline version had the
        # override switches behind a ';' - a G-code COMMENT: the values loaded
        # but the _on switches never came back (field bug, fixed here).
        _PROFILE_APPLY SRC=default N={n} FEEDBACK=1
        RESPOND MSG="Default preset {n} LOADED: {d.material} | {d.overrides} overrides on"
        M117 Loaded: Default {n}
        _SOUND_LIB NAME=r2_confirm
    {% endif %}

[gcode_macro DELETE_DEFAULT_PRESET]
description: Delete default preset N (frees the slot for the next save)
gcode:
    {% set n = params.N|default(0)|int %}
    {% if n < 1 or n > 8 %}
        RESPOND MSG="Delete default preset: N must be 1..8"
    {% else %}
        SAVE_VARIABLE VARIABLE=default_preset_{n|lower} VALUE=0
        RESPOND MSG="Default preset {n} deleted - slot is free again (materials untouched)"
        M117 Deleted: Default {n}
    {% endif %}


# =====================================================================================
#  R240 (.136aj): THE DEPOT PROFILE - one central main profile. The 8 default
#  slots, the material mini-presets and the feature fragments retire from the
#  LCD (console legacy stays: LOAD_DEFAULT_PRESET N, SET_MATERIAL). What the
#  Depot stores: EVERY Pre-Print value - temps (first/after), retraction
#  (length/retract/unretract speed), PA + smooth time, accel, velocity,
#  min-cruise + square-corner, global flow, fan (+min/max/bridge/clamp),
#  ironing flow, per-feature speed/accel/flow/PA (all 25 slots), shaper-off,
#  first-layer speed, Z-hop (on + height) and the extruder drive - VALUES AND
#  SWITCHES, no matter whether they are ON or OFF right now.
#  LCD (double press): Pre-Print > Profiles. Console: the macros below.
# =====================================================================================
[gcode_macro _PROF_ARM]
description: Profiles: arm the 2-press confirm for KEY (internal, R240)
gcode:
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='"{params.KEY|default('')}"'
    UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=10
    M117 Again = do it!
    RESPOND MSG="[Profile] Press AGAIN to {params.WHICH|default('confirm')} (window: 10s) - the row jumps back so the result shows on the display"
    _UI_SOUND NAME=r2_click

[gcode_macro SAVE_DEPOT_PRESET]
description: Save ALL current Pre-Print settings as the Depot profile (R240)
gcode:
    # R160 idiom: LCD rows pass CONFIRM=1 - first press arms, second saves.
    # A typed console command IS the confirmation (no CONFIRM = save now).
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'psd' %}
        _PROF_ARM KEY=psd WHICH="save the Depot profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        _PROFILE_SAVE WHICH=depot
    {% endif %}

[gcode_macro LOAD_DEPOT_PRESET]
description: Apply the Depot profile to the Pre-Print settings (R240)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'pld' %}
        _PROF_ARM KEY=pld WHICH="load the Depot profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        {% if sv.depot_preset|default(0) is mapping %}
            _PROFILE_APPLY SRC=depot FEEDBACK=1
        {% else %}
            NOTIFY TEXT="Depot profile is empty - save one first (Pre-Print > Profiles > Save > Depot)" LEVEL=warn SOUND=r2_notice
            M117 Depot: empty
        {% endif %}
    {% endif %}

[gcode_macro DELETE_DEPOT_PRESET]
description: Delete the Depot profile (R240, press twice from the LCD)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'pdd' %}
        _PROF_ARM KEY=pdd WHICH="DELETE the Depot profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        {% if sv.depot_preset|default(0) is mapping %}
            SAVE_VARIABLE VARIABLE=depot_preset VALUE=0
            RESPOND MSG="[OK] Depot profile deleted - the Pre-Print settings stay as they are"
            M117 Depot: deleted
            _SOUND_LIB NAME=r2_confirm
        {% else %}
            RESPOND MSG="Depot profile is already empty"
        {% endif %}
    {% endif %}

[gcode_macro DEPOT_INFO]
description: Show the Depot profile status (console)
gcode:
    {% set d = printer['save_variables'].variables.depot_preset|default(0) %}
    {% if d is mapping %}
        RESPOND MSG="Depot profile: {d.material|default('?')} | {d.overrides|default(0)} override(s) ON | Z-hop {d.zh_height|default(0.4)}mm {'on' if d.zh_on|default(False) else 'off'} | drive {d.drive|default('direct')} | {d.feats|default({})|length} feature slots stored - load: LOAD_DEPOT_PRESET"
    {% else %}
        RESPOND MSG="Depot profile: empty - save one with SAVE_DEPOT_PRESET (LCD: Pre-Print > Profiles > Save > Depot)"
    {% endif %}


# =====================================================================================
#  R109 FILE PROFILES - per-g-code-file settings memory.
#  Every file can carry TWO profiles (stored in ONE save-variables dict
#  'file_profiles', key = the file's relative path from the gcodes folder):
#    'pre'  : YOUR manual saves from Pre-Print > Profiles > This file.
#             Nothing ever overwrites it automatically.
#    'post' : LEGACY auto-saves from before .128. New prints write NO post
#             anymore (R169: the rate-print question + the optimized folder
#             replaced the silent takeover). Old posts stay loadable/deletable.
#  On file selection the watcher calls FILE_PROFILE_AUTO: your 'pre' applies
#  when auto-load is on (a 'post' needs the explicit Load button now).
#  Material + default presets are unaffected.
# =====================================================================================

# -------------------------------------------------------------------------------------
# _PROFILE_APPLY - ONE apply path for every profile source (internal).
#   _PROFILE_APPLY SRC=default N=2                 <- default preset slot
#   _PROFILE_APPLY SRC=file WHICH=pre|post FILE=x  <- file profile
# Writes every override value AND its _on switch (the old LOAD_DEFAULT_PRESET
# had the switches behind a ';' comment - values loaded, switches never did).
# -------------------------------------------------------------------------------------
[gcode_macro _PROFILE_APPLY]
description: Apply a stored profile to the pre-print settings (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R169: applying ANY profile ends an unanswered rate-print question (its
    # baseline would be clobbered by the values loading now) - timeout path.
    _OPT_PROMPT_RESOLVE MODE=timeout
    {% set d = 0 %}
    {% if params.SRC|default('') == 'default' %}
        {% set nn = params.N|default(0)|int %}
        {% set d = sv['default_preset_' ~ nn]|default(0) if nn >= 1 and nn <= 8 else 0 %}
    {% elif params.SRC|default('') == 'depot' %}
        # R240: THE Depot profile - one central store, every Pre-Print value.
        {% set d = sv.depot_preset|default(0) if sv.depot_preset|default(0) is mapping else 0 %}
    {% elif params.SRC|default('') == 'opt' %}
        # R169: the OPTIMIZED-file source - values baked into a copy's
        # _OPT_BAKED line (in-file replay) or pushed by the watcher (E2).
        {% set d = sv.opt_baked|default(0) if sv.opt_baked|default(0) is mapping else 0 %}
    {% else %}
        {% set fn = params.FILE|default(sv.preview_file|default(''))|string %}
        {% set fpall = sv.file_profiles|default({}) %}
        {% set e = fpall.get(fn, {}) if fn != '' else {} %}
        {% set d = e.get(params.WHICH|default('pre')|string, 0) %}
    {% endif %}
    {% if not d %}
        RESPOND MSG="_PROFILE_APPLY: no such profile (slot/file/which empty)"
    {% else %}
        # R236 (.136af field log): loading takes seconds (every value AND
        # its switch is a SAVE_VARIABLE) - the press needs feedback NOW:
        # FEEDBACK=1 (LCD/menu loads) beeps + shows 'Loading profile'
        # before the storm and confirms with a done-beep when the values
        # are in. The automatic paths (file selection auto-load, baked
        # optimized copies) stay quiet except for one console line.
        {% if params.FEEDBACK|default(0)|int == 1 %}
            M117 Loading profile
            _SOUND_LIB NAME=r2_confirm
        {% endif %}
        {% set keys = [('bed','ov_bed'),('bed_after','ov_bed_after'),('hotend_first','ov_hotend_first'),('hotend_after','ov_hotend_after'),('pa','ov_pa'),('pa_smooth','ov_pa_smooth'),('retract_len','ov_retract_len'),('retract_speed','ov_retract_speed'),('unretract_speed','ov_unretract_speed'),('accel','ov_accel'),('velocity','ov_velocity'),('min_cruise','ov_min_cruise'),('square_corner','ov_square_corner'),('flow','ov_flow'),('fan','ov_fan'),('ironing_flow','ov_ironing_flow')] %}
        {% for k, v in keys %}
            SAVE_VARIABLE VARIABLE={v|lower} VALUE={d[k]|default(0)|float}
            _PACE
            SAVE_VARIABLE VARIABLE={v|lower}_on VALUE={d[k ~ '_on']|default(False)}
            _PACE
        {% endfor %}
        SAVE_VARIABLE VARIABLE=first_layer_speed VALUE={d.first_layer_speed|default(75)|float}
        _PACE
        {% set feats = d.feats|default({}) %}
        {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
            {% set f = feats[c] if c in feats else [False, 100.0, 0.0, 100.0] %}
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_on VALUE={f[0]}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_spd VALUE={f[1]|float}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_acc VALUE={f[2]|float}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_flw VALUE={f[3]|float}
            _PACE
            # R111: 5th element pa - old 4-element profiles simply load 0 (off)
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_pa VALUE={f[4] if f|length > 4 else 0.0}
            _PACE
        {% endfor %}
        SAVE_VARIABLE VARIABLE=ov_fan_min VALUE={d.fan_min|default(0)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_max VALUE={d.fan_max|default(100)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_bridge VALUE={d.fan_bridge|default(0)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_clamp_on VALUE={d.fan_clamp_on|default(False)}
        _PACE
        SAVE_VARIABLE VARIABLE=ovf_shaper_off_feat VALUE='"{d.shaper_off_feat|default('')}"'
        _PACE
        SAVE_VARIABLE VARIABLE=ovf_shaper_off_on VALUE={d.shaper_off_on|default(False)}
        SAVE_VARIABLE VARIABLE=material VALUE='"{d.material|default('PLA')}"'
        # R240: Z-hop + extruder drive - new keys; an OLD profile simply
        # keeps the current values (no surprise reset from legacy saves)
        {% if 'zh_on' in d %}
            SAVE_VARIABLE VARIABLE=zh_on VALUE={d.zh_on|default(False)}
            SAVE_VARIABLE VARIABLE=zh_height VALUE={d.zh_height|default(0.4)|float}
        {% endif %}
        {% if 'drive' in d %}
            SAVE_VARIABLE VARIABLE=ov_drive VALUE='"{d.drive|default('direct')}"'
        {% endif %}
        RESPOND MSG="[OK] profile loaded: {d.overrides|default(0)} override(s) ON, material {d.material|default('?')} - Pre-Print shows the values"
        {% if params.FEEDBACK|default(0)|int == 1 %}
            M117 Loaded: {d.overrides|default(0)} on
            _SOUND_LIB NAME=r2_done
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# _PROFILE_SAVE + _PROFILE_WRITE - snapshot the CURRENT pre-print state (values,
# switches, per-feature speed/accel/flow, material) into a profile (internal).
# The save is CHAINED (render-before-execute): _PROFILE_SAVE renders the dict
# from the live values and hands it to _PROFILE_WRITE via 'pending_snap' -
# the writer only runs (and reads) after the snapshot really exists.
# -------------------------------------------------------------------------------------
[gcode_macro _PROFILE_SAVE]
description: Snapshot the current pre-print state for the profile writer (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set ns2 = namespace(cnt=0) %}
    {% if sv.ov_bed_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_bed_after_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_hotend_first_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_hotend_after_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_pa_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_retract_len_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_accel_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_velocity_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_fan_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% if sv.ov_flow_on|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% if sv['ovf_' ~ c ~ '_on']|default(False) %}{% set ns2.cnt = ns2.cnt + 1 %}{% endif %}
    {% endfor %}
    {% set fpair = namespace(pairs=[]) %}
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% set fpair.pairs = fpair.pairs + [(c, [sv['ovf_' ~ c ~ '_on']|default(False), sv['ovf_' ~ c ~ '_spd']|default(100)|float, sv['ovf_' ~ c ~ '_acc']|default(0)|float, sv['ovf_' ~ c ~ '_flw']|default(100)|float, sv['ovf_' ~ c ~ '_pa']|default(0)|float])] %}
    {% endfor %}
    {% set snap = {
        'material': sv.material|default('PLA')|string,
        'bed': sv.ov_bed|default(0)|float, 'bed_on': sv.ov_bed_on|default(False),
        'bed_after': sv.ov_bed_after|default(0)|float, 'bed_after_on': sv.ov_bed_after_on|default(False),
        'hotend_first': sv.ov_hotend_first|default(0)|float, 'hotend_first_on': sv.ov_hotend_first_on|default(False),
        'hotend_after': sv.ov_hotend_after|default(0)|float, 'hotend_after_on': sv.ov_hotend_after_on|default(False),
        'pa': sv.ov_pa|default(0)|float, 'pa_on': sv.ov_pa_on|default(False),
        'pa_smooth': sv.ov_pa_smooth|default(0.04)|float, 'pa_smooth_on': sv.ov_pa_smooth_on|default(False),
        'retract_len': sv.ov_retract_len|default(0)|float, 'retract_len_on': sv.ov_retract_len_on|default(False),
        'retract_speed': sv.ov_retract_speed|default(0)|float, 'retract_speed_on': sv.ov_retract_speed_on|default(False),
        'unretract_speed': sv.ov_unretract_speed|default(0)|float, 'unretract_speed_on': sv.ov_unretract_speed_on|default(False),
        'accel': sv.ov_accel|default(0)|float, 'accel_on': sv.ov_accel_on|default(False),
        'velocity': sv.ov_velocity|default(0)|float, 'velocity_on': sv.ov_velocity_on|default(False),
        'min_cruise': sv.ov_min_cruise|default(0)|float, 'min_cruise_on': sv.ov_min_cruise_on|default(False),
        'square_corner': sv.ov_square_corner|default(0)|float, 'square_corner_on': sv.ov_square_corner_on|default(False),
        'flow': sv.ov_flow|default(100)|float, 'flow_on': sv.ov_flow_on|default(False),
        'fan': sv.ov_fan|default(100)|float, 'fan_on': sv.ov_fan_on|default(False),
        'ironing_flow': sv.ov_ironing_flow|default(15)|float, 'ironing_flow_on': sv.ov_ironing_flow_on|default(False),
        # R240: the profile carries EVERY Pre-Print value - including
        # the ones without an _on switch: Z-hop + extruder drive.
        'zh_on': sv.zh_on|default(False), 'zh_height': sv.zh_height|default(0.4)|float,
        'drive': sv.ov_drive|default('direct')|string,
        'first_layer_speed': sv.first_layer_speed|default(75)|float,
        'fan_min': sv.ov_fan_min|default(0)|float, 'fan_max': sv.ov_fan_max|default(100)|float,
        'fan_bridge': sv.ov_fan_bridge|default(0)|float, 'fan_clamp_on': sv.ov_fan_clamp_on|default(False),
        'shaper_off_feat': sv.ovf_shaper_off_feat|default('')|string, 'shaper_off_on': sv.ovf_shaper_off_on|default(False),
        'overrides': ns2.cnt,
        'feats': dict(fpair.pairs),
    } %}
    {% set snaps = snap|string|replace('"', '')|replace(';', '') %}
    SAVE_VARIABLE VARIABLE=pending_snap VALUE="{snaps}"
    _PACE
    _PROFILE_WRITE WHICH={params.WHICH|default('pre')|string|lower} FILE="{params.FILE|default('')}"

[gcode_macro _PROFILE_WRITE]
description: Write the staged snapshot into its destination (internal, chained)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set d = sv.pending_snap|default(0) %}
    {% set which = params.WHICH|default('pre')|string|lower %}
    {% if not d %}
        RESPOND MSG="_PROFILE_WRITE: no snapshot staged"
    {% elif which == 'depot' %}
        # R240: THE one central Depot profile - every Pre-Print value lands
        # here (values AND switches, the ON and the OFF ones alike).
        SAVE_VARIABLE VARIABLE=depot_preset VALUE="{d}"
        RESPOND MSG="[OK] Depot profile saved: {d.material} | {d.overrides} override(s) ON + every stored value (Z-hop {d.zh_height|default(0.4)}mm {'on' if d.zh_on|default(False) else 'off'}, drive {d.drive|default('direct')}) - Load: Pre-Print > Profiles > Load Depot"
        M117 Depot: saved
        _SOUND_LIB NAME=r2_confirm
    {% elif which not in ('pre', 'post') %}
        RESPOND MSG="_PROFILE_WRITE: WHICH must be pre, post or depot"
    {% else %}
        {% set fn = params.FILE|default('')|string %}
        {% set fn = fn|replace('"', '')|replace(';', '')|replace("'", '')|trim %}
        {% if fn == '' %}
            RESPOND MSG="File profile: no file selected - pick one first (or pass FILE=)"
        {% else %}
            {% set ep = sv.fp_epoch|default(0)|int + 1 %}
            SAVE_VARIABLE VARIABLE=fp_epoch VALUE={ep}
            _PACE
            {% set fp = sv.file_profiles|default({}) %}
            {% set e = fp.get(fn, {}) if fn in fp else {} %}
            {% set epair = namespace(pairs=[]) %}
            {% for k, v in e.items() %}
                {% if k != which and k != which ~ '_ep' %}{% set epair.pairs = epair.pairs + [(k, v)] %}{% endif %}
            {% endfor %}
            {% set epair.pairs = epair.pairs + [(which, d), (which ~ '_ep', ep)] %}
            {% set fpair2 = namespace(pairs=[]) %}
            {% for k, v in fp.items() %}
                {% if k != fn %}{% set fpair2.pairs = fpair2.pairs + [(k, v)] %}{% endif %}
            {% endfor %}
            {% set fpair2.pairs = fpair2.pairs + [(fn, dict(epair.pairs))] %}
            {% set fps = dict(fpair2.pairs)|string|replace('"', '')|replace(';', '') %}
            SAVE_VARIABLE VARIABLE=file_profiles VALUE="{fps}"
            RESPOND MSG="[OK] File profile '{which}' saved for {fn}: {d.material} | {d.overrides} overrides on (save no. {ep})"
            {% if which == 'pre' %}
                RESPOND MSG="  ('pre' is YOUR manual profile - the automatic 'post' save after prints never touches it)"
            {% else %}
                RESPOND MSG="  (automatic post-print memory - 'pre' stays as you saved it)"
            {% endif %}
            M117 File {which}: saved
            _SOUND_LIB NAME=r2_confirm
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SAVE_FILE_PROFILE - manual save: the CURRENT pre-print settings become the
# selected file's 'pre' profile. LCD: Pre-Print > Profiles > This file.
# -------------------------------------------------------------------------------------
[gcode_macro SAVE_FILE_PROFILE]
description: Save the current pre-print settings as the selected file's 'pre' profile (press twice from the LCD)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R240: LCD rows pass CONFIRM=1 - first press arms, second saves.
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'psf' %}
        _PROF_ARM KEY=psf WHICH="save this file's pre-print profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        {% set fn = params.FILE|default(sv.preview_file|default(''))|string %}
        {% if fn == '' %}
            NOTIFY TEXT="File profile: no file selected - pick one in the file list first" LEVEL=warn SOUND=r2_notice
            M117 No file
        {% else %}
            _PROFILE_SAVE WHICH=pre FILE="{fn}"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# FILE_PROFILE_LOAD / FILE_PROFILE_DELETE - console/Mainsail (LCD has buttons)
#   FILE_PROFILE_LOAD WHICH=pre|post FILE=name.gcode
#   FILE_PROFILE_DELETE WHICH=pre|post|all FILE=name.gcode
# -------------------------------------------------------------------------------------
[gcode_macro FILE_PROFILE_LOAD]
description: Load a file profile into Pre-Print (WHICH=pre|post, FILE=; press twice from the LCD)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R240: LCD rows pass CONFIRM=1 - first press arms, second loads.
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'plf' %}
        _PROF_ARM KEY=plf WHICH="load this file's pre-print profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        {% set fn = params.FILE|default(sv.preview_file|default(''))|string %}
        {% set which = params.WHICH|default('pre')|string|lower %}
        {% set fpall = sv.file_profiles|default({}) %}
        {% set e = fpall.get(fn, {}) if fn != '' else {} %}
        {% if which not in ('pre', 'post') %}
            RESPOND MSG="FILE_PROFILE_LOAD: WHICH must be pre or post"
        {% elif not e.get(which, 0) %}
            NOTIFY TEXT="File profile '{which}' for {fn} does not exist yet" LEVEL=warn SOUND=r2_notice
        {% else %}
            _PROFILE_APPLY SRC=file WHICH={which} FILE="{fn}" FEEDBACK=1
            RESPOND MSG="[OK] File profile '{which}' of {fn} applied to Pre-Print"
        {% endif %}
    {% endif %}

[gcode_macro FILE_PROFILE_DELETE]
description: Delete a file profile (WHICH=pre|post|all, FILE=; press twice from the LCD)
gcode:
    {% set sv = printer['save_variables'].variables %}
    # R240: LCD rows pass CONFIRM=1 - first press arms, second deletes.
    {% if params.CONFIRM|default(0)|int == 1 and printer['gcode_macro _STATE'].gen_arm|default('') != 'pdf' %}
        _PROF_ARM KEY=pdf WHICH="delete this file's pre-print profile"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=gen_arm VALUE='""'
        UPDATE_DELAYED_GCODE ID=_GEN_ARM_CLEAR DURATION=0
        {% set fn = params.FILE|default(sv.preview_file|default(''))|string %}
        {% set which = params.WHICH|default('pre')|string|lower %}
    {% set fp = sv.file_profiles|default({}) %}
    {% set e = fp.get(fn, {}) if fn != '' and fn in fp else {} %}
    {% if which not in ('pre', 'post', 'all') %}
        RESPOND MSG="FILE_PROFILE_DELETE: WHICH must be pre, post or all"
    {% elif not e %}
        NOTIFY TEXT="No profiles for {fn} - nothing to delete" LEVEL=warn SOUND=r2_notice
    {% else %}
        {% set fpair3 = namespace(pairs=[]) %}
        {% for k, v in fp.items() %}
            {% if k != fn %}{% set fpair3.pairs = fpair3.pairs + [(k, v)] %}{% endif %}
        {% endfor %}
        {% if which != 'all' %}
            {% set epair4 = namespace(pairs=[]) %}
            {% for k, v in e.items() %}
                {% if k != which and k != which ~ '_ep' %}{% set epair4.pairs = epair4.pairs + [(k, v)] %}{% endif %}
            {% endfor %}
            {% if epair4.pairs %}
                {% set fpair3.pairs = fpair3.pairs + [(fn, dict(epair4.pairs))] %}
            {% endif %}
        {% endif %}
        {% set fps = dict(fpair3.pairs)|string|replace('"', '')|replace(';', '') %}
        SAVE_VARIABLE VARIABLE=file_profiles VALUE="{fps}"
        RESPOND MSG="[OK] File profile '{which}' deleted for {fn} (the other profiles stay)"
        M117 File {which}: deleted
        _SOUND_LIB NAME=r2_confirm
    {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# FILE_PROFILES_INFO - the selected file's profile status (console)
# -------------------------------------------------------------------------------------
[gcode_macro FILE_PROFILES_INFO]
description: Show the selected file's profiles (pre/post) + the auto switches
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set fn = sv.preview_file|default('')|string %}
    {% if fn == '' %}
        RESPOND MSG="File profiles: no file selected"
    {% else %}
        {% set fpall = sv.file_profiles|default({}) %}
        {% set e = fpall.get(fn, {}) if fn in fpall else {} %}
        RESPOND MSG="File profiles for {fn}:"
        {% if e.get('pre', 0) %}
            RESPOND MSG="  pre  : saved (no. {e.pre_ep|default(0)}) - {e.pre.material|default('?')} | {e.pre.overrides|default(0)} overrides on - load: FILE_PROFILE_LOAD WHICH=pre"
        {% else %}
            RESPOND MSG="  pre  : - (save it: Pre-Print > Profiles > This file > Save as 'pre')"
        {% endif %}
        {% if e.get('post', 0) %}
            RESPOND MSG="  post : saved (no. {e.post_ep|default(0)}) - {e.post.material|default('?')} | {e.post.overrides|default(0)} overrides on - LEGACY auto-save (pre-.128), load it explicitly: FILE_PROFILE_LOAD WHICH=post"
        {% else %}
            RESPOND MSG="  post : - (no automatic post anymore - .128+: successful prints offer an OPTIMIZED copy instead)"
        {% endif %}
        {% set pe = e.pre_ep|default(0) %}
        {% set po = e.post_ep|default(0) %}
        {% if pe or po %}
            RESPOND MSG="  auto-load applies YOUR 'pre' when present | auto-load {'ON' if sv.file_profiles_on|default(True) else 'OFF'} | optimized files: Pre-Print > Profiles > From optimized"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# FILE_PROFILE_AUTO - the watcher calls this on file selection (internal):
# applies the NEWER of pre/post when auto-load is on. Silent when no profile.
# -------------------------------------------------------------------------------------
[gcode_macro FILE_PROFILE_AUTO]
description: Auto-apply the selected file's profile (internal, watcher hook)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set fn = params.FILE|default('')|string %}
    {% set fpall = sv.file_profiles|default({}) %}
    {% set e = fpall.get(fn, {}) if fn in fpall else {} %}
    # existence flags for the LCD (Pre-Print > Profiles > This file) - ALWAYS
    # refreshed on selection, even with auto-load off (rule mm: menus show
    # only what exists). In-memory card - zero disk writes.
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fp_pre VALUE={1 if e.get('pre', 0) else 0}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fp_post VALUE={1 if e.get('post', 0) else 0}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fp_file VALUE='"{fn}"'
    {% if sv.file_profiles_on|default(True) and fn != '' %}
        {% if e %}
            {% set pe = e.pre_ep|default(0) %}
            {% set which = 'pre' if pe > 0 else '' %}
            {% if which != '' and e.get(which, 0) %}
                RESPOND MSG="[i] File profile '{which}' applied for {fn} (save no. {e[which ~ '_ep']|default(0)}) - Pre-Print is preset, adjust + decide in the start dialog"
                _PROFILE_APPLY SRC=file WHICH={which} FILE="{fn}"
                # R240 (.136aj field wish): the auto-load must be AUDIBLE +
                # visible - every value of the profile is in Pre-Print now.
                _SOUND_LIB NAME=r2_confirm
                M117 Profile: loaded
            {% endif %}
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
#  R169: _FILE_PROFILE_AUTOSAVE is GONE. The silent 'post' takeover at PRINT_END
#  is replaced by the rate-print question (_OPT_END_CAPTURE) + the optimized
#  folder. Old 'post' entries remain loadable (button) / deletable.
# -------------------------------------------------------------------------------------

# =====================================================================================
#  R169 OPTIMIZED FILES - "print good? save the tuning INTO the file"
#  -----------------------------------------------------------------------------------
#  FLOW (replaces the R62 capture + R109 auto-'post' - nothing is adopted
#  silently anymore):
#    print start : _OPT_SNAP_WRITE DEST=baseline - the pre-print override state
#                  lands in _STATE.opt_baseline (memory only - a restart simply
#                  means 'no restore possible', never a stale restore).
#    print end   : _OPT_END_CAPTURE (PRINT_END hook) - the FINAL state (incl.
#                  live tuning) lands in save_variables opt_snap; if it differs
#                  from the baseline, the LCD asks ONE question (menu 'Rate
#                  print?'):  YES = optimized copy + the values stay in Pre-Print
#                  (explicit), NO / 90 s timeout = baseline restored, discarded.
#    YES         : watcher job (opt_nonce) writes a NON-INVASIVE copy into
#                  gcodes/optimized/<name>: live values baked into _FILE_INFO
#                  (the file info then SHOWS them), a '; R2-OPT' tag and an
#                  _OPT_BAKED line that replays the exact override set when the
#                  copy prints. The ORIGINAL file is never touched.
#    E2          : Pre-Print > Profiles > From optimized - a tuned file's values
#                  become the Pre-Print STARTING POINT for the next print.
#  Percent values (flow, per-feature speed, global speed) are baked as ABSOLUTE
#  file values and NEUTRALIZED in the replay set - a reprint can never apply
#  them twice. Absolute values (PA, accel) are idempotent and stay in both.
# =====================================================================================

[gcode_macro _OPT_SNAP_WRITE]
description: Snapshot the current override state (R169, internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set ns169 = namespace(cnt=0) %}
    {% if sv.ov_bed_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_bed_after_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_hotend_first_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_hotend_after_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_pa_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_retract_len_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_accel_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_velocity_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_fan_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% if sv.ov_flow_on|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% if sv['ovf_' ~ c ~ '_on']|default(False) %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% endfor %}
    {% set fpair = namespace(pairs=[]) %}
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% set fpair.pairs = fpair.pairs + [(c, [sv['ovf_' ~ c ~ '_on']|default(False), sv['ovf_' ~ c ~ '_spd']|default(100)|float, sv['ovf_' ~ c ~ '_acc']|default(0)|float, sv['ovf_' ~ c ~ '_flw']|default(100)|float, sv['ovf_' ~ c ~ '_pa']|default(0)|float])] %}
    {% endfor %}
    # ---- R62 semantics, kept honest: a live value only counts as TUNED when it
    # differs from BOTH the pre-print override AND the file's own value (a file
    # PA that simply ran must not arm the question on every print).
    {% set pa_v = sv.ov_pa|default(0)|float %}
    {% set pa_on = sv.ov_pa_on|default(False) %}
    {% set pa_ref = pa_v if pa_on else s.file_pa|default(0)|float %}
    {% if params.DEST|default('') != 'baseline' and s.pa_value|default(0)|float > 0 and (s.pa_value|float - pa_ref)|abs > 0.001 %}
        {% set pa_v = s.pa_value|float %}{% set pa_on = True %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% set fl_v = sv.ov_flow|default(100)|float %}
    {% set fl_on = sv.ov_flow_on|default(False) %}
    {% if params.DEST|default('') != 'baseline' and (s.flow|default(100)|float - (fl_v if fl_on else 100))|abs > 0.5 %}
        {% set fl_v = s.flow|float %}{% set fl_on = True %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% set ac_v = sv.ov_accel|default(0)|float %}
    {% set ac_on = sv.ov_accel_on|default(False) %}
    {% set ac_ref = ac_v if ac_on else s.file_accel|default(0)|float %}
    {% if params.DEST|default('') != 'baseline' and s.a_global|default(0)|float > 0 and ac_ref > 0 and (s.a_global|float - ac_ref)|abs > 1 %}
        {% set ac_v = s.a_global|float %}{% set ac_on = True %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    # ---- global speed % (M220): 0 = not tuned (the regulator resets to 100 between prints)
    {% set sp169 = (printer.gcode_move.speed_factor|default(1)|float * 100)|round(1) %}
    {% if sp169 >= 99.5 and sp169 <= 100.5 %}{% set sp169 = 0 %}{% endif %}
    {% if sp169 %}{% set ns169.cnt = ns169.cnt + 1 %}{% endif %}
    {% set snap = {
        'material': sv.material|default('PLA')|string,
        'bed': sv.ov_bed|default(0)|float, 'bed_on': sv.ov_bed_on|default(False),
        'bed_after': sv.ov_bed_after|default(0)|float, 'bed_after_on': sv.ov_bed_after_on|default(False),
        'hotend_first': sv.ov_hotend_first|default(0)|float, 'hotend_first_on': sv.ov_hotend_first_on|default(False),
        'hotend_after': sv.ov_hotend_after|default(0)|float, 'hotend_after_on': sv.ov_hotend_after_on|default(False),
        'pa': pa_v, 'pa_on': pa_on,
        'pa_smooth': sv.ov_pa_smooth|default(0.04)|float, 'pa_smooth_on': sv.ov_pa_smooth_on|default(False),
        'retract_len': sv.ov_retract_len|default(0)|float, 'retract_len_on': sv.ov_retract_len_on|default(False),
        'retract_speed': sv.ov_retract_speed|default(0)|float, 'retract_speed_on': sv.ov_retract_speed_on|default(False),
        'unretract_speed': sv.ov_unretract_speed|default(0)|float, 'unretract_speed_on': sv.ov_unretract_speed_on|default(False),
        'accel': ac_v, 'accel_on': ac_on,
        'velocity': sv.ov_velocity|default(0)|float, 'velocity_on': sv.ov_velocity_on|default(False),
        'min_cruise': sv.ov_min_cruise|default(0)|float, 'min_cruise_on': sv.ov_min_cruise_on|default(False),
        'square_corner': sv.ov_square_corner|default(0)|float, 'square_corner_on': sv.ov_square_corner_on|default(False),
        'flow': fl_v, 'flow_on': fl_on,
        'fan': sv.ov_fan|default(100)|float, 'fan_on': sv.ov_fan_on|default(False),
        'ironing_flow': sv.ov_ironing_flow|default(15)|float, 'ironing_flow_on': sv.ov_ironing_flow_on|default(False),
        # R240: the profile carries EVERY Pre-Print value - including
        # the ones without an _on switch: Z-hop + extruder drive.
        'zh_on': sv.zh_on|default(False), 'zh_height': sv.zh_height|default(0.4)|float,
        'drive': sv.ov_drive|default('direct')|string,
        'first_layer_speed': sv.first_layer_speed|default(75)|float,
        'fan_min': sv.ov_fan_min|default(0)|float, 'fan_max': sv.ov_fan_max|default(100)|float,
        'fan_bridge': sv.ov_fan_bridge|default(0)|float, 'fan_clamp_on': sv.ov_fan_clamp_on|default(False),
        'shaper_off_feat': sv.ovf_shaper_off_feat|default('')|string, 'shaper_off_on': sv.ovf_shaper_off_on|default(False),
        'speed_pct': sp169,
        'overrides': ns169.cnt,
        'feats': dict(fpair.pairs),
    } %}
    {% set snaps = snap|string|replace('"', '')|replace(', ', ',')|replace(': ', ':') %}
    {% if params.DEST|default('') == 'baseline' %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=opt_baseline VALUE="{snaps}"
    {% else %}
        # safe charset: every value is a number/bool or one of the fixed-set
        # strings (material, feature codes) - no semicolon/hashtag can occur,
        # and Klipper cuts cfg template lines at those two (boot-blocker class)
        SAVE_VARIABLE VARIABLE=opt_snap VALUE="{snaps}"
        _PACE
        # R173 (.129 field report): the LCD counter - opt_snap is a STRING in
        # save_variables, the old menu read it as a dict and always showed 0
        SAVE_VARIABLE VARIABLE=opt_cnt VALUE={ns169.cnt}
        _PACE
        _OPT_END_ASK
    {% endif %}

[gcode_macro _OPT_END_ASK]
description: Compare the final snapshot vs the baseline, arm the question (R169, internal)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set b = s.opt_baseline|default(0) %}
    {% set changed = (not b) or (sv.opt_snap|default(0)|string|replace(' ', '') != b|string|replace(' ', '')) %}
    {% if changed %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=opt_pending VALUE=True
        UPDATE_DELAYED_GCODE ID=_OPT_PROMPT_HINT DURATION=12
        # R173 (.129 field report, user rule): NO auto-timeout anymore. The
        # question STAYS in the menu until answered - only picking a new file
        # (or starting a new print) answers it with NO (hooks in 08_*)
        RESPOND MSG="[opt] live tuning detected - rate the print on the LCD (menu 'Rate print?') - it stays until you answer. Picking a new file answers NO"
    {% else %}
        RESPOND MSG="[opt] nothing live-tuned - no question, nothing adopted"
    {% endif %}

[gcode_macro _OPT_RESTORE_BASELINE]
description: Restore the pre-print override state (R169, internal)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set b = s.opt_baseline|default(0) %}
    {% if not b %}
        RESPOND MSG="[opt] no baseline (restart during the print?) - the current values stay as they are"
    {% else %}
        {% for k, v in [('bed','ov_bed'),('bed_after','ov_bed_after'),('hotend_first','ov_hotend_first'),('hotend_after','ov_hotend_after'),('pa','ov_pa'),('pa_smooth','ov_pa_smooth'),('retract_len','ov_retract_len'),('retract_speed','ov_retract_speed'),('unretract_speed','ov_unretract_speed'),('accel','ov_accel'),('velocity','ov_velocity'),('min_cruise','ov_min_cruise'),('square_corner','ov_square_corner'),('flow','ov_flow'),('fan','ov_fan'),('ironing_flow','ov_ironing_flow')] %}
            SAVE_VARIABLE VARIABLE={v|lower} VALUE={b[k]|default(0)|float}
            _PACE
            SAVE_VARIABLE VARIABLE={v|lower}_on VALUE={b[k ~ '_on']|default(False)}
            _PACE
        {% endfor %}
        SAVE_VARIABLE VARIABLE=first_layer_speed VALUE={b.first_layer_speed|default(75)|float}
        _PACE
        {% set feats = b.feats|default({}) %}
        {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
            {% set f = feats[c] if c in feats else [False, 100.0, 0.0, 100.0, 0.0] %}
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_on VALUE={f[0]}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_spd VALUE={f[1]|float}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_acc VALUE={f[2]|float}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_flw VALUE={f[3]|float}
            _PACE
            SAVE_VARIABLE VARIABLE=ovf_{c|lower}_pa VALUE={f[4] if f|length > 4 else 0.0}
            _PACE
        {% endfor %}
        SAVE_VARIABLE VARIABLE=ov_fan_min VALUE={b.fan_min|default(0)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_max VALUE={b.fan_max|default(100)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_bridge VALUE={b.fan_bridge|default(0)|float}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_fan_clamp_on VALUE={b.fan_clamp_on|default(False)}
        _PACE
        SAVE_VARIABLE VARIABLE=ovf_shaper_off_feat VALUE='"{b.shaper_off_feat|default('')|string}"'
        _PACE
        SAVE_VARIABLE VARIABLE=ovf_shaper_off_on VALUE={b.shaper_off_on|default(False)}
        # 'material' is deliberately NOT restored - your material selection is
        # pre-print state, not tuning (unchanged rule since R46).
        {% if params.QUIET|default(0)|int != 1 %}
            RESPOND MSG="[opt] live tuning DISCARDED - pre-print state restored"
            M117 Tuning discarded
        {% else %}
            RESPOND MSG="[opt] question timed out - live tuning discarded, pre-print restored"
        {% endif %}
    {% endif %}

[gcode_macro _OPT_PROMPT_RESOLVE]
description: End an unanswered rate-print question (R169, internal)
gcode:
    {% if printer['gcode_macro _STATE'].opt_pending|default(False) %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=opt_pending VALUE=False
        UPDATE_DELAYED_GCODE ID=_OPT_PROMPT_HINT DURATION=0
        _OPT_RESTORE_BASELINE QUIET=1
    {% endif %}

[gcode_macro _OPT_PROMPT_YES]
description: Rate-print answer YES - write the optimized copy, keep the values (R169)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.opt_pending|default(False) %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=opt_pending VALUE=False
        UPDATE_DELAYED_GCODE ID=_OPT_PROMPT_HINT DURATION=0
        _OPT_QUEUE_JOB
        M117 Optimized: creating copy
    {% else %}
        NOTIFY TEXT="No rate-print question pending" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro _OPT_SAVE_LATER]
description: Save the LAST print's snapshot as an optimized copy (R169 - the question's second chance)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if sv.opt_snap|default('0')|string not in ('', '0', 'None', 'False') and sv.opt_file|default('') != '' and s.mode == 'idle' %}
        _OPT_QUEUE_JOB
        M117 Optimized: creating copy
    {% else %}
        NOTIFY TEXT="No print snapshot yet (or a print is running)" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro _OPT_QUEUE_JOB]
description: Ask the watcher for the optimized copy (R169, internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    SAVE_VARIABLE VARIABLE=opt_nonce VALUE={sv.opt_nonce|default(0)|int + 1}
    {% set osv = sv.opt_snap|default(0) %}
    {% set cnt = osv.overrides|default(0) if osv is mapping else 0 %}
    RESPOND MSG="[opt] YES - the live-tuned values stay AND an optimized copy of {sv.opt_file|default('?')} is created in optimized/ ({cnt} tuned values)"
    _SOUND_LIB NAME=r2_start

[gcode_macro _OPT_PROMPT_NO]
description: Rate-print answer NO - discard the live tuning (R169)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.opt_pending|default(False) %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=opt_pending VALUE=False
        UPDATE_DELAYED_GCODE ID=_OPT_PROMPT_HINT DURATION=0
        _OPT_RESTORE_BASELINE QUIET=0
    {% else %}
        NOTIFY TEXT="No rate-print question pending" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro _OPT_BAKED]
description: Optimized-file replay - the values baked into the copy apply (R169, in-file line)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if params.SNAP is defined %}
        # _opt_compact (watcher) guarantees the safe charset - no spaces, no
        # double quotes, no semicolons/hashtags (comment cut!), no backslashes.
        # shlex strips the shell-level quotes, so params.SNAP arrives as the
        # bare dict text with its single quotes intact - one double-quote layer
        # is added back here for literal_eval.
        {% set sn = params.SNAP|string %}
        SAVE_VARIABLE VARIABLE=opt_baked VALUE="{sn}"
        _PACE
        {% if s.ignore_overrides|default(False) %}
            # AS SLICED was chosen - the copy runs 1:1, the baked values only
            # rest in the background (the question at its end decides again)
            RESPOND MSG="[opt] optimized values NOT applied - this print runs AS SLICED"
        {% else %}
            _PROFILE_APPLY SRC=opt
            RESPOND MSG="[opt] optimized values applied (baked into this file)"
        {% endif %}
    {% endif %}

[gcode_macro _OPT_APPLY_PICKED]
description: Load an optimized file's values into Pre-Print (R169, E2 - picker button)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set lst = (sv.opt_list|default('')|string).split('|') if sv.opt_list|default('') != '' else [] %}
    {% set i = params.IDX|default(0)|int - 1 %}
    {% if lst and i >= 0 and i < lst|length %}
        SAVE_VARIABLE VARIABLE=opt_load_name VALUE='"{lst[i]}"'
        _PACE
        SAVE_VARIABLE VARIABLE=opt_load_nonce VALUE={sv.opt_load_nonce|default(0)|int + 1}
        RESPOND MSG="[opt] loading tuned values from optimized/{lst[i]} - they become the Pre-Print starting point"
        M117 Opt: {lst[i]|truncate(14, True, '')}
    {% else %}
        NOTIFY TEXT="No optimized file no. {params.IDX|default(0)|int} - check the list (Files item shows the count)" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro OPT_INFO]
description: Show the last print snapshot / pending question (console)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set d = sv.opt_snap|default(0) %}
    {% if d is mapping %}
        RESPOND MSG="Last print snapshot: {sv.opt_file|default('?')} | {d.overrides|default(0)} values tuned | PA {d.pa|default(0)} | flow {d.flow|default(100)}% | accel {d.accel|default(0)} | speed {d.speed_pct|default(0)|int if d.speed_pct|default(0) else 100}% | fan {d.fan|default(100)}%"
        {% set onl = [] %}
        {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
            {% set f = d.feats[c] if d.feats|default({}) and c in d.feats else None %}
            {% if f and f[0] %}{% if onl.append(c) %}{% endif %}{% endif %}
        {% endfor %}
        RESPOND MSG="  features on: {onl|join(', ') if onl else '-'}"
        RESPOND MSG="  question pending: {printer['gcode_macro _STATE'].opt_pending|default(False)} | save later: Pre-Print > Profiles > Save last print > optimized"
    {% else %}
        RESPOND MSG="No print snapshot yet - it appears at the end of the next printed file"
    {% endif %}

