# =====================================================================================
#  02_sounds.cfg - R2-D2 sound library for the LCD piezo beeper (M300)
#  -----------------------------------------------------------------------------------
#  Requirements (see printer.cfg.example / INSTALL.md):
#    [pwm_cycle_time beeper]   <- IMPORTANT: pwm_cycle_time, NOT output_pin!
#      pin: PB5                (beeper on EXP1/LCD)
#      value: 0 / shutdown_value: 0 / cycle_time: 0.001
#    Only this pin type supports SET_PIN ... CYCLE_TIME= (tone frequency at runtime).
#
#  NOTE: Klipper has NO built-in M300 (that is a Marlin command). The M300 macro
#  below is the official Klipper sample implementation (config/sample-macros.cfg),
#  adapted to our pin name "beeper".
#
#  A "tune" is a string "frequency:milliseconds,..."
#    - frequency in Hz (500-3000 Hz sound best on these piezos)
#    - special value 0 = silence -> "0:150" = 150ms pause between tones
# =====================================================================================

# -------------------------------------------------------------------------------------
# M300 - Play tone. Official Klipper sample implementation, pin name "beeper".
# Usage: M300 [S<Hz>] [P<ms>]  (defaults: 1000 Hz, 100 ms)
# -------------------------------------------------------------------------------------
[gcode_macro M300]
description: Play tone: M300 S<Hz> P<ms>
gcode:
    # defaults: 1000 Hz, 100 ms (as in the Klipper sample)
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    # tone: 50% duty (VALUE=0.5) at cycle time = 1/frequency -> requested pitch
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

# -------------------------------------------------------------------------------------
# _SOUND_LIB - internal sound database + player
# -------------------------------------------------------------------------------------
[gcode_macro _SOUND_LIB]
description: Internal sound database (do not call directly)
variable_tunes: {
    'r2_start':      '1568:40,1245:30,1661:40,2093:35,1568:30,2349:60,1865:30,2093:80',
    'r2_confirm':    '2093:25,2637:35',                                # short "boop!" (menu OK)
    'r2_click':      '1568:15',                                        # UI click
    'r2_question':   '784:70,0:30,988:60,1175:100,0:60,880:180',       # asking ("buu-huup?")
    'r2_happy':      '1760:35,2093:30,2637:40,1568:25,2093:55,2637:35,3136:70',   # excited chatter
    'r2_heating':    '1046:60,0:40,1318:60,0:40,1046:60',              # "I am heating"
    'r2_hot':        '1568:40,2093:40,2637:90',                        # temperature reached
    'r2_leveling':   '1244:50,0:20,1244:50,0:20,1568:70',              # meshing starts
    'r2_leveled':    '1318:50,1568:50,2093:40,1760:110',               # meshing done
    'r2_pid':        '988:80,0:30,1244:80,0:30,988:80',                # PID tuning running
    'r2_printing':   '1046:50,0:30,1318:50,0:30,1568:50,2093:120',     # print started
    'r2_pause':      '988:120,0:60,784:160',                           # "aww, pause"
    'r2_resume':     '784:80,1046:60,1318:80,1760:120',                # resuming
    'r2_filament':   '1397:40,1865:40,1397:40,1865:40,2349:90',        # filament change chatter
    'r2_alarm':      '1244:70,830:70,1244:70,830:70,1244:70,830:90',   # filament out / error!
    'r2_error':      '622:120,932:120,622:120,932:180',                # hard warning (siren)
    'r2_sad':        '988:150,0:40,830:180,0:40,740:220,0:40,659:320', # cancel / shutdown
    'r2_done':       '659:80,784:80,1046:80,1318:160,1046:50,1318:240',# fanfare
    'r2_notice':     '1174:70,0:50,1174:70',                           # double "hm?"
    'r2_gen':        '1568:25,0:30,2093:25,0:30,2637:60'               # R160: generation starts
    }
gcode:
    # ---------- playback logic: only used via PLAY_SOUND ----------
    {% set tune_str = params.TUNE|default('') %}
    {% set name = params.NAME|default('') %}
    {% if name != '' %}
        {% set tune_str = tunes[name]|default('1568:20') %}   # unknown name = short beep
    {% endif %}
    # R95 (field log .74, rule cc): a beep BLOCKS the firmware for its whole
    # duration - on an active print the standing filament oozes a purge blob
    # into the part (micro pause -> stutter). Confirmation and feedback beeps
    # stay SILENT while mode == 'printing'; the NeoPixel effects carry the
    # feedback instead. CRITICAL sounds (pause, filament change, dialogs/
    # questions, alarms, errors) ALWAYS play, and after the print everything
    # is back to normal.
    # R188 (.134): start/generation/done feedback joins the quiet list -
    # during a print the LED effects carry it (user rule: no feedback
    # sounds while printing; critical sounds always play)
    {% set quiet_print = ['r2_confirm', 'r2_click', 'r2_happy',
                          'r2_heating', 'r2_hot', 'r2_start', 'r2_gen',
                          'r2_done'] %}
    {% set is_printing = printer['gcode_macro _STATE'].mode|default('') == 'printing' %}
    {% if printer['save_variables'].variables.sound_on|default(True) and tune_str != ''
          and not (is_printing and name in quiet_print) %}
        {% for token in tune_str.split(',') %}                 # work through every tone
            {% set parts = token.split(':') %}
            {% set f = parts[0]|float %}
            {% set d = parts[1]|float %}
            {% if f > 0 %}
                M300 S{f|round|int} P{d|round|int}             # tone: frequency f for d ms
            {% else %}
                G4 P{d|round|int}                              # pause between tones
            {% endif %}
        {% endfor %}
    {% endif %}

# ---------------- public macros (visible in Mainsail) ---------------------------------
[gcode_macro PLAY_SOUND]
description: Play an R2-D2 sound (e.g. PLAY_SOUND NAME=r2_happy)
gcode:
    {% set allowed = ['r2_start','r2_confirm','r2_click','r2_question','r2_happy','r2_heating','r2_hot','r2_leveling','r2_leveled','r2_pid','r2_printing','r2_pause','r2_resume','r2_filament','r2_alarm','r2_error','r2_sad','r2_done','r2_notice','r2_gen'] %}
    {% set name = params.NAME|default('r2_click') %}
    _SOUND_LIB NAME={name}

[gcode_macro _UI_SOUND]
description: UI confirmation sound - SILENT while a print runs (R143): queue management and generator presses beep when idle, never into a running print. Errors and alarms (NOTIFY SOUND=...) keep their sound - always.
gcode:
    # R160b (.120 field): the gate reads the REAL printer state, not our
    # tracked mode - a mode stuck at 'printing' after a wedged end (the
    # .120 field log: no confirm sounds anymore) can no longer mute the
    # UI. A real print/pause (incl. filament runout - that pauses too)
    # still mutes exactly as before.
    {% if printer.print_stats.state not in ['printing','paused'] %}
        _SOUND_LIB NAME={params.NAME|default('r2_click')}
    {% endif %}

[gcode_macro _PLAY_JOB_START]
description: Watcher: a queued generation starts building now (internal, R160)
gcode:
    # jobs only run while the printer idles (the busy gate) - the chirp is
    # always welcome; _SOUND_LIB still honors the global sound_on switch
    _SOUND_LIB NAME=r2_gen

[gcode_macro TOGGLE_SOUNDS]
description: Sounds ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.sound_on|default(True) %}
    SAVE_VARIABLE VARIABLE=sound_on VALUE={on}
    {% if on %}PLAY_SOUND NAME=r2_confirm{% endif %}
    M117 Sounds: {'ON' if on else 'OFF'}

[gcode_macro TEST_SOUNDS]
description: Play the whole R2-D2 sound list one by one
gcode:
    M117 R2-D2 sound demo...
    RESPOND MSG="=== R2-D2 sound demo ==="
    {% for n in ['r2_start','r2_question','r2_happy','r2_heating','r2_hot','r2_leveling','r2_leveled','r2_printing','r2_pause','r2_resume','r2_filament','r2_alarm','r2_error','r2_sad','r2_done'] %}
        M117 Sound: {n}
        RESPOND MSG="-> {n}"
        _SOUND_LIB NAME={n}
        G4 P400
    {% endfor %}
    M117 Sound demo done

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V02_SOUNDS]
description: Version sentinel of 02_sounds.cfg (internal)
gcode:
