# =====================================================================================
#  07_start_confirm.cfg - "Print as sliced, with changes, or cancel?"
#  -----------------------------------------------------------------------------------
#  FLOW when you start a print (R50 - EVERY file is caught, whatever it is):
#   0) SDCARD_PRINT_FILE / M24 (print button, LCD file list) pause the file
#      BEFORE its first command -> the start dialog appears immediately.
#      Marked files then run PRINT_START, old mod files START_PRINT, foreign
#      files heat themselves, movement files get home+heat+purge from the
#      _START_NET_PROBE - the decision rides along as 'start_pending'.
#   1) The gcode file starts with PRINT_START ... (slicer start gcode)
#   2) PRINT_START stores the file values and PAUSES the file immediately
#      (nothing is hot yet - totally safe).
#   3) LCD shows the decision menu, R2 beeps questioning, LEDs blink.
#      Decide on the LCD (menu 'Start Print?') or in Mainsail (macro buttons
#      PRINT_AS_SLICED / PRINT_WITH_OVERRIDES / PRINT_AS_LEGACY / CANCEL_PENDING_PRINT).
#      Change settings meanwhile: LCD menu 'Pre-Print' or the SET_* macros.
#   4) The poller (_START_CONFIRM_WAITER, every 2s) then runs the real sequence
#      _RUN_PRINT_START (08_print_start_stop.cfg).
#
#  THE SAME DIALOG WORKS EVERYWHERE: LCD menu, Mainsail macro panel, console.
#  Pressing RESUME (Mainsail button / LCD) while waiting = "print as sliced".
# =====================================================================================

# ---- decision setters ---------------------------------------------------------------
[gcode_macro PRINT_AS_SLICED]
description: Start dialog: print the file EXACTLY as sliced (ignore all overwrites)
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'waiting' %}
        SAVE_VARIABLE VARIABLE=start_decision VALUE='"as_sliced"'
        M117 OK - print as sliced
    {% else %}
        NOTIFY TEXT="No start dialog active" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro PRINT_WITH_OVERRIDES]
description: R54 alias for AS LEGACY (merged mode: overwrites ON, takeover)
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'waiting' %}
        SAVE_VARIABLE VARIABLE=start_decision VALUE='"with_overrides"'
        M117 OK - as legacy
    {% else %}
        NOTIFY TEXT="No start dialog active" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro PRINT_AS_LEGACY]
description: Start the waiting sliced file in LEGACY mode (overwrites ON, markers ignored)
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'waiting' %}
        SAVE_VARIABLE VARIABLE=start_decision VALUE='"as_legacy"'
    {% else %}
        RESPOND MSG="PRINT_AS_LEGACY: no print is waiting for a decision"
    {% endif %}

[gcode_macro CANCEL_PENDING_PRINT]
description: Start dialog: do NOT start this print
gcode:
    {% if printer['gcode_macro _STATE'].mode == 'waiting' %}
        SAVE_VARIABLE VARIABLE=start_decision VALUE='"cancel"'
        M117 OK - cancel
    {% else %}
        NOTIFY TEXT="No start dialog active" LEVEL=warn SOUND=r2_notice
    {% endif %}

# ---- the poller: checks the decision every 2s and acts ------------------------------
[delayed_gcode _START_CONFIRM_WAITER]
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fn = printer.print_stats.filename|default('') %}
    {% if s.mode == 'waiting' %}
        {% set dec = sv.start_decision|default('') %}
        {% if dec == 'as_sliced' %}
            # ------------------> print 1:1, the file rules ------------------------------
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
            # 'as sliced' = truly 1:1 -> bypass the M104/M109 overrides for this print
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE=True
            # R72: a decision is per FILE - an error+resume must never re-ask
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='"{fn}"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='"as_sliced"'
            {% if s.file_type == 'unknown' %}
                # ---- R51: unidentified file (universal intercept). START it now -
                #      the decision rides along as start_pending; the file identifies
                #      itself within seconds: PRINT_START (marked) / START_PRINT (old
                #      mod) / heater commands (foreign). _START_NET_PROBE catches
                #      pure movement files (no heaters, no start macro at all).
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='"as_sliced"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=1
                M24
                CLEAR_PAUSE
                SET_LED_STATE STATE=printing
                UPDATE_DELAYED_GCODE ID=_START_NET_PROBE DURATION=3
                NOTIFY TEXT="AS SLICED: file starts - its own start rules" LEVEL=ok SOUND=r2_confirm
            {% elif s.file_type == 'legacy' %}
                # ---- LEGACY file, as sliced: home + the FILE'S OWN targets + purge
                #      ALWAYS (user rule) - then the file rules 1:1 (R48 field fix).
                _LEGACY_AS_SLICED
            {% else %}
                NOTIFY TEXT="Printing exactly as sliced" LEVEL=ok SOUND=r2_confirm
                _RUN_PRINT_START APPLY=0
            {% endif %}
        {% elif dec == 'with_overrides' %}
            # ------------------> apply overrides + material ------------------------------
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE=False
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='"{fn}"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='"as_legacy"'
            {% if s.file_type == 'unknown' %}
                # ---- R51: unidentified file - START it with the note; the heater
                #      interceptors take over (mesh + purge + overwrites) at the
                #      file's first heater command, _START_NET_PROBE catches
                #      movement files.
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='"overrides"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=1
                M24
                CLEAR_PAUSE
                SET_LED_STATE STATE=printing
                UPDATE_DELAYED_GCODE ID=_START_NET_PROBE DURATION=3
                NOTIFY TEXT="AS LEGACY: overwrites + mesh + purge on top" LEVEL=ok SOUND=r2_confirm
            {% elif s.file_type == 'legacy' %}
                # legacy file: 'with changes' == system takeover -> AS LEGACY.
                # R47 FIX: re-schedule ourselves - the waiter only re-schedules in
                # its 'still waiting' branch, so without this the redirected
                # decision was saved but NEVER executed (another dead end).
                SAVE_VARIABLE VARIABLE=start_decision VALUE='"as_legacy"'
                UPDATE_DELAYED_GCODE ID=_START_CONFIRM_WAITER DURATION=2
            {% else %}
                # R54: WITH CHANGES == AS LEGACY (merged - one clear takeover mode:
                # overwrites ON + Z layer tracking + sequential detection natural)
                NOTIFY TEXT="Printing LEGACY with your settings (see console)" LEVEL=ok SOUND=r2_confirm
                _RUN_PRINT_START APPLY=1 LEGACY=1
            {% endif %}
        {% elif dec == 'as_legacy' %}
            # ------------------> system takeover: overrides ON, file markers ignored ------
            # layer counting via Z (watcher), sequential detection natural, L1/L2 by Z -
            # exactly like an old file, but with your overrides active (R40)
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE=False
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='"{fn}"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='"as_legacy"'
            {% if s.file_type == 'unknown' %}
                # ---- R51: unidentified file - START it with the takeover note;
                #      identification routes it (START_PRINT/heaters -> prep,
                #      movement -> infra APPLY=1). Same as AS LEGACY.
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='"as_legacy"'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=1
                M24
                CLEAR_PAUSE
                SET_LED_STATE STATE=printing
                UPDATE_DELAYED_GCODE ID=_START_NET_PROBE DURATION=3
                NOTIFY TEXT="AS LEGACY: takeover - overwrites + mesh + purge" LEVEL=ok SOUND=r2_confirm
            {% elif s.file_type == 'legacy' %}
                # ---- LEGACY file (watcher fallback path), system takeover: prep once
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
                {% set svl = printer['save_variables'].variables %}
                {% if svl.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
                    NOTIFY TEXT="AS LEGACY: level + purge + overwrites ON" LEVEL=ok SOUND=r2_confirm
                    _LEGACY_PREP
                {% elif 'gcode_macro _LEGACY_HOME' in printer %}
                    NOTIFY TEXT="AS LEGACY: home + purge + overwrites ON" LEVEL=ok SOUND=r2_confirm
                    _LEGACY_HOME
                {% endif %}
            {% else %}
                NOTIFY TEXT="Printing AS LEGACY: overwrites on, Z is counting" LEVEL=ok SOUND=r2_confirm
                _RUN_PRINT_START APPLY=1 LEGACY=1
            {% endif %}
        {% elif dec == 'cancel' %}
            # ------------------> cancel cleanly (nothing was hot) -------------------------
            SAVE_VARIABLE VARIABLE=start_decision VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='""'
            CANCEL_PRINT_BASE                 # releases file + pause state
            TURN_OFF_HEATERS                 # safety (everything was cold anyway)
            SET_LED_STATE STATE=idle
            NOTIFY TEXT="Print canceled - nothing started" LEVEL=warn SOUND=r2_sad
        {% else %}
            # ------------------> still waiting: reminder beep ------------------------------
            {% set ticks = s.wait_ticks + 1 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE={ticks}
            {% if ticks % 8 == 1 %}
                _SOUND_LIB NAME=r2_question
                M117 Changes? -> menu Start?
                RESPOND MSG=">>> Waiting for decision: LCD menu 'Start Print?' OR Mainsail: PRINT_AS_SLICED / PRINT_WITH_OVERRIDES / CANCEL_PENDING_PRINT"
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_START_CONFIRM_WAITER DURATION=2
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# SET_OVERRIDE_VALUE - user-friendly setter for ONE pre-print override.
#   Setting a value also SWITCHES THE OVERRIDE ON (so it can never "do nothing").
#   SET_OVERRIDE_VALUE NAME=accel VALUE=4000
#   Names (GLOBAL only since .38): bed bed_after hotend_first hotend_after pa
#          pa_smooth retract_len retract_speed unretract_speed accel flow
#          velocity min_cruise square_corner fan
# -------------------------------------------------------------------------------------
[gcode_macro TOGGLE_FIRST_LAYER_RULES]
description: First-layer rules also in AS SLICED on/off (L1 temps + fan off - R79)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set neu = not sv.first_layer_rules|default(True) %}
    SAVE_VARIABLE VARIABLE=first_layer_rules VALUE={neu}
    RESPOND MSG="First-layer rules (L1/L2 temps + fan off on layer 1, also in AS SLICED): {'ON' if neu else 'OFF'}"
    M117 L1 rules {'ON' if neu else 'OFF'}

[gcode_macro SET_OVERRIDE_VALUE]
description: Set one pre-print overwrite + switch it ON (NAME= VALUE=)
gcode:
    {% set n = params.NAME|default('')|string|lower %}
    {% set v = params.VALUE|default(None) %}
    {% if v is not none %}
      # R59: legacy names map onto the generic per-feature keys
      {% if n == 'outer_wall' %}{% set n = 'feat_spd_wallouter' %}
      {% elif n == 'outer_wall_accel' %}{% set n = 'feat_acc_wallouter' %}
      {% elif n == 'support' %}{% set n = 'feat_spd_support' %}
      {% elif n == 'support_accel' %}{% set n = 'feat_acc_support' %}
      {% elif n == 'ironing_speed' %}{% set n = 'feat_spd_ironing' %}{% endif %}
    {% endif %}
    {% set v = params.VALUE|default(None) %}
    {% if v is none %}
        NOTIFY TEXT="SET_OVERRIDE_VALUE NAME=<name> VALUE=<n> missing" LEVEL=warn
    {% else %}
        {% set fparts = n.split('_') %}
        {% set fcodes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim'] %}
        {% if fparts|length == 3 and fparts[0] == 'feat' and fparts[2]|lower in fcodes %}
            # R59: generic per-feature overrides - NAME=feat_<spd|acc|on>_<feature>
            {% set fc = fparts[2]|lower %}
            {% if fparts[1] == 'flw' %}
                SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_flw VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_on VALUE=True
            {% elif fparts[1] == 'on' %}
                SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_on VALUE={v|default(0)|int == 1}
                {% if v|default(0)|int == 0 %}
                    # R60: OFF = back to the file's ORIGINAL values (speed 100% = 1:1,
                    # accel = the M204 the file itself uses, ironing flow = slicer value)
                    SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_spd VALUE=100.0
                    SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_flw VALUE=100.0
                    SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_acc VALUE={printer['gcode_macro _STATE']['file_feat_acc_' ~ fc]|default(0)|float}
                    {% if fc == 'ironing' %}
                        SAVE_VARIABLE VARIABLE=ov_ironing_flow VALUE={printer['gcode_macro _STATE'].file_ironing_flow|default(100)|float if printer['gcode_macro _STATE'].file_ironing_flow|default(0)|float > 0 else 100.0}
                    {% endif %}
                    RESPOND MSG="[Feature] {fc|upper} OFF - values reset to the file original (speed 100%, accel {printer['gcode_macro _STATE']['file_feat_acc_' ~ fc]|default(0)|float|round|int} mm/s2)"
                {% endif %}
            {% elif fparts[1] == 'spd' %}
                SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_spd VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_on VALUE=True
            {% elif fparts[1] == 'acc' %}
                SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_acc VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ovf_{fc|lower}_on VALUE=True
            {% endif %}
        {% elif n == 'bed' %}              SAVE_VARIABLE VARIABLE=ov_bed VALUE={v|float}            ; SAVE_VARIABLE VARIABLE=ov_bed_on VALUE=True
        {% elif n == 'bed_after' %}      SAVE_VARIABLE VARIABLE=ov_bed_after VALUE={v|float}      ; SAVE_VARIABLE VARIABLE=ov_bed_after_on VALUE=True
        {% elif n == 'hotend_first' %}   SAVE_VARIABLE VARIABLE=ov_hotend_first VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ov_hotend_first_on VALUE=True
        {% elif n == 'hotend_after' %}   SAVE_VARIABLE VARIABLE=ov_hotend_after VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ov_hotend_after_on VALUE=True
        {% elif n == 'pa' %}             SAVE_VARIABLE VARIABLE=ov_pa VALUE={v|float}             ; SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
        {% elif n == 'retract_len' %}    SAVE_VARIABLE VARIABLE=ov_retract_len VALUE={v|float}    ; SAVE_VARIABLE VARIABLE=ov_retract_len_on VALUE=True
        {% elif n == 'retract_speed' %}  SAVE_VARIABLE VARIABLE=ov_retract_speed VALUE={v|float}  ; SAVE_VARIABLE VARIABLE=ov_retract_speed_on VALUE=True
        {% elif n == 'unretract_speed' %}SAVE_VARIABLE VARIABLE=ov_unretract_speed VALUE={v|float}; SAVE_VARIABLE VARIABLE=ov_unretract_speed_on VALUE=True
        {% elif n == 'accel' %}          SAVE_VARIABLE VARIABLE=ov_accel VALUE={v|float}          ; SAVE_VARIABLE VARIABLE=ov_accel_on VALUE=True
        {% elif n == 'ironing_flow' %}   SAVE_VARIABLE VARIABLE=ov_ironing_flow VALUE={v|float}   ; SAVE_VARIABLE VARIABLE=ov_ironing_flow_on VALUE=True
        {% elif n == 'pa_smooth' %}      SAVE_VARIABLE VARIABLE=ov_pa_smooth VALUE={v|float}      ; SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=True
        {% elif n == 'flow' %}           SAVE_VARIABLE VARIABLE=ov_flow VALUE={v|float}           ; SAVE_VARIABLE VARIABLE=ov_flow_on VALUE=True
        {% elif n == 'velocity' %}       SAVE_VARIABLE VARIABLE=ov_velocity VALUE={v|float}       ; SAVE_VARIABLE VARIABLE=ov_velocity_on VALUE=True
        {% elif n == 'min_cruise' %}     SAVE_VARIABLE VARIABLE=ov_min_cruise VALUE={v|float}     ; SAVE_VARIABLE VARIABLE=ov_min_cruise_on VALUE=True
        {% elif n == 'square_corner' %}  SAVE_VARIABLE VARIABLE=ov_square_corner VALUE={v|float}  ; SAVE_VARIABLE VARIABLE=ov_square_corner_on VALUE=True
        {% elif n == 'fan' %}            SAVE_VARIABLE VARIABLE=ov_fan VALUE={v|float}            ; SAVE_VARIABLE VARIABLE=ov_fan_on VALUE=True
        {% else %}
            NOTIFY TEXT="Unknown overwrite name: {n}" LEVEL=warn SOUND=r2_notice
        {% endif %}
        {% if n in ['bed','bed_after','hotend_first','hotend_after','pa','pa_smooth','retract_len','retract_speed','unretract_speed','accel','flow','velocity','min_cruise','square_corner','fan','ironing_flow'] or (fparts|length == 3 and fparts[0] == 'feat') or n in ['outer_wall','outer_wall_accel','support','support_accel','ironing_speed'] %}
            M117 {n} = {v} (ON)
            RESPOND MSG="Overwrite '{n}' = {v} -> ON"
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# TOGGLE_OVERRIDE - switch a single pre-print override ON/OFF
#   TOGGLE_OVERRIDE NAME=bed   (value stays stored)
# -------------------------------------------------------------------------------------
[gcode_macro TOGGLE_OVERRIDE]
description: Switch one pre-print overwrite on/off (TOGGLE_OVERRIDE NAME=bed)
gcode:
    {% set n = params.NAME|default('')|string|lower %}
    # ON-key mapping: some values SHARE one switch (retract_len+speed -> ov_retract_on,
    # ironing_flow+speed+temp -> ov_ironing_on). Build the wrong key here and the
    # toggle says 'Unknown override' although the value itself exists!
    {% set key = 'ov_' ~ n ~ '_on' %}
    {% set sv = printer['save_variables'].variables %}
    {% if key in sv %}
        {% set neu = not sv[key] %}
        SAVE_VARIABLE VARIABLE={key|lower} VALUE={neu}
        M117 {n}: {'ON' if neu else 'OFF'}
        RESPOND MSG="Overwrite '{n}': {'ON' if neu else 'OFF'}"
        _SOUND_LIB NAME=r2_click
    {% else %}
        NOTIFY TEXT="Unknown overwrite: {n}" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# CLEAR_OVERRIDES - switch ALL pre-print overrides off (values stay stored)
# -------------------------------------------------------------------------------------
[gcode_macro CLEAR_OVERRIDES]
description: Turn ALL pre-print overwrites OFF (file prints 1:1)
gcode:
    SAVE_VARIABLE VARIABLE=ov_bed_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_bed_after_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_hotend_first_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_hotend_after_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_retract_len_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_retract_speed_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_unretract_speed_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_accel_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_velocity_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_min_cruise_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_square_corner_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_fan_on VALUE=False
    SAVE_VARIABLE VARIABLE=ov_flow_on VALUE=False
    # R59: per-feature overwrites off (generic keys)
    {% for c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim'] %}
        SAVE_VARIABLE VARIABLE=ovf_{c|lower}_on VALUE=False
        SAVE_VARIABLE VARIABLE=ovf_{c|lower}_flw VALUE=100.0
    {% endfor %}
    SAVE_VARIABLE VARIABLE=ov_ironing_flow_on VALUE=False
    NOTIFY TEXT="All overwrites OFF - file prints 1:1" LEVEL=ok SOUND=r2_confirm

# -------------------------------------------------------------------------------------
# TOGGLE_START_CONFIRMATION - enable/disable the pre-print question itself
# -------------------------------------------------------------------------------------
[gcode_macro TOGGLE_START_CONFIRMATION]
description: Pre-print confirmation dialog ON/OFF
gcode:
    {% set on = not printer['save_variables'].variables.start_confirm|default(True) %}
    SAVE_VARIABLE VARIABLE=start_confirm VALUE={on}
    NOTIFY TEXT="Start confirmation: {'ON' if on else 'OFF (prints start immediately)'}" LEVEL=ok
    {% if on %}PLAY_SOUND NAME=r2_confirm{% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V07_CONFIRM]
description: Version sentinel of 07_start_confirm.cfg (internal)
gcode:
