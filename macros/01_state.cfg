gcode:
    # This macro is only a data holder - calling it does nothing.
    M117 _STATE

# -------------------------------------------------------------------------------------
# _INIT_DEFAULTS - fills every PERSISTENT variable that does not exist yet with a
# factory default (your own values are NEVER overwritten). Runs 5s after boot.
# -------------------------------------------------------------------------------------
[gcode_macro _INIT_DEFAULTS]
gcode:
    # hydrate live PA smoothing from the saved value
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_smooth VALUE={printer['save_variables'].variables.ov_pa_smooth|default(0.04)|float}
    {% set sv = printer['save_variables'].variables %}
    # ---- feedback / UX ----------------------------------------------------------------
    {% if sv.start_confirm|default(None) is none %}SAVE_VARIABLE VARIABLE=start_confirm VALUE=True{% endif %}
    {% if sv.material|default(None) is none     %}SAVE_VARIABLE VARIABLE=material VALUE='"PLA"'{% endif %}
    {% if sv.sound_on|default(None) is none     %}SAVE_VARIABLE VARIABLE=sound_on VALUE=True{% endif %}
    {% if sv.leds_on|default(None) is none      %}SAVE_VARIABLE VARIABLE=leds_on VALUE=True{% endif %}
    # ---- bed mesh -----------------------------------------------------------------------
    {% if sv.mesh_always|default(None) is none  %}SAVE_VARIABLE VARIABLE=mesh_always VALUE=True{% endif %}    # re-mesh every print (KAMP-adaptive)
    {% if sv.mesh_adaptive|default(None) is none %}SAVE_VARIABLE VARIABLE=mesh_adaptive VALUE=True{% endif %} # probe object area only
    # R75: mesh travel cap (mm/s while meshing, 0 = off) - see _CALIBRATE_MESH_PROFILE
    {% if sv.mesh_travel|default(None) is none %}SAVE_VARIABLE VARIABLE=mesh_travel VALUE=120{% endif %}
    {% if sv.mesh_last_profile|default(None) is none %}SAVE_VARIABLE VARIABLE=mesh_last_profile VALUE='"r2"'{% endif %}
    # PA calibration (LCD Maintenance > PA Cal.)
    {% if sv.pa_cal_hotend|default(None) is none   %}SAVE_VARIABLE VARIABLE=pa_cal_hotend VALUE=210{% endif %}
    {% if sv.pa_cal_bed|default(None) is none      %}SAVE_VARIABLE VARIABLE=pa_cal_bed VALUE=60{% endif %}
    {% if sv.pa_cal_start|default(None) is none    %}SAVE_VARIABLE VARIABLE=pa_cal_start VALUE=0{% endif %}
    {% if sv.pa_cal_step|default(None) is none     %}SAVE_VARIABLE VARIABLE=pa_cal_step VALUE=0.005{% endif %}
    {% if sv.pa_cal_lines|default(None) is none   %}SAVE_VARIABLE VARIABLE=pa_cal_lines VALUE=10{% endif %}
    {% if sv.pa_cal_len|default(None) is none     %}SAVE_VARIABLE VARIABLE=pa_cal_len VALUE=100{% endif %}
    {% if sv.pa_cal_slow|default(None) is none    %}SAVE_VARIABLE VARIABLE=pa_cal_slow VALUE=20{% endif %}
    {% if sv.pa_cal_fast|default(None) is none    %}SAVE_VARIABLE VARIABLE=pa_cal_fast VALUE=100{% endif %}
    {% if sv.pa_cal_accel|default(None) is none   %}SAVE_VARIABLE VARIABLE=pa_cal_accel VALUE=3000{% endif %}
    {% if sv.pa_cal_spacing|default(None) is none %}SAVE_VARIABLE VARIABLE=pa_cal_spacing VALUE=0{% endif %}   # 0 = auto
    {% if sv.pa_cal_layer|default(None) is none    %}SAVE_VARIABLE VARIABLE=pa_cal_layer VALUE=0.3{% endif %}
    {% if sv.cold_pull_hot|default(None) is none   %}SAVE_VARIABLE VARIABLE=cold_pull_hot VALUE=230{% endif %}
    {% if sv.cold_pull_pull|default(None) is none  %}SAVE_VARIABLE VARIABLE=cold_pull_pull VALUE=100{% endif %}
    # R77: cold pull wizard parameters (Maintenance > Filament > Cold pull)
    {% if sv.cold_pull_mat|default(None) is none   %}SAVE_VARIABLE VARIABLE=cold_pull_mat VALUE='"PLA"'{% endif %}
    {% if sv.cold_pull_cycles|default(None) is none %}SAVE_VARIABLE VARIABLE=cold_pull_cycles VALUE=1{% endif %}
    {% if sv.cold_pull_rlen|default(None) is none  %}SAVE_VARIABLE VARIABLE=cold_pull_rlen VALUE=60{% endif %}
    {% if sv.cold_pull_rspd|default(None) is none  %}SAVE_VARIABLE VARIABLE=cold_pull_rspd VALUE=25{% endif %}
    {% if sv.cold_pull_beep|default(None) is none  %}SAVE_VARIABLE VARIABLE=cold_pull_beep VALUE=10{% endif %}
    {% if sv.mesh_auto_save|default(None) is none  %}SAVE_VARIABLE VARIABLE=mesh_auto_save VALUE=False{% endif %}   # persist mesh after print (SAVE_CONFIG)?
    {% if sv.first_layer_speed|default(None) is none %}SAVE_VARIABLE VARIABLE=first_layer_speed VALUE=75{% endif %}   # % on layer 1 (0=off)
    {% if sv.first_layer_rules|default(None) is none %}SAVE_VARIABLE VARIABLE=first_layer_rules VALUE=True{% endif %}   # R79: L1/L2 temp+fan rules also in AS SLICED (hotend/bed/fan always differ between layer 1 and 2)
    {% if sv.ov_pa_smooth|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_pa_smooth VALUE=0.04{% endif %}      # PA smoothing time (live adjustable)
    # per-key override switches (migrated from the old shared switches once)
    {% if sv.ov_retract_len_on|default(None) is none     %}SAVE_VARIABLE VARIABLE=ov_retract_len_on VALUE={sv.ov_retract_on|default(False)}{% endif %}
    {% if sv.ov_retract_speed_on|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_retract_speed_on VALUE={sv.ov_retract_on|default(False)}{% endif %}
    {% if sv.ov_unretract_speed_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_unretract_speed_on VALUE=False{% endif %}
    {% if sv.ov_unretract_speed|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_unretract_speed VALUE=35{% endif %}
    {% if sv.ov_drive|default(None) is none          %}SAVE_VARIABLE VARIABLE=ov_drive VALUE='"direct"'{% endif %}   # R146: retraction profile (SET_EXTRUDER_DRIVE swaps it)
    {% if sv.ov_pa_smooth_on|default(None) is none       %}SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=False{% endif %}
    {% if sv.ov_ironing_flow_on|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_ironing_flow_on VALUE={sv.ov_ironing_on|default(False)}{% endif %}
    {% if sv.ov_ironing_speed_on|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_ironing_speed_on VALUE={sv.ov_ironing_on|default(False)}{% endif %}
    {% if sv.ov_ironing_temp_on|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_ironing_temp_on VALUE={sv.ov_ironing_on|default(False)}{% endif %}
    {% if sv.ov_fan_on|default(None) is none             %}SAVE_VARIABLE VARIABLE=ov_fan_on VALUE=False{% endif %}
    {% if sv.ov_fan|default(None) is none                %}SAVE_VARIABLE VARIABLE=ov_fan VALUE=100{% endif %}      # part fan % from layer 2 (material)
    {% if sv.unload_length|default(None) is none         %}SAVE_VARIABLE VARIABLE=unload_length VALUE=90{% endif %}   # filament unload length
    {% if sv.load_length|default(None) is none           %}SAVE_VARIABLE VARIABLE=load_length VALUE=60{% endif %}     # filament load length (R55)
    {% if sv.pid_fan_percent|default(None) is none       %}SAVE_VARIABLE VARIABLE=pid_fan_percent VALUE=100{% endif %} # part fan % during hotend PID
    {% if sv.ishaper_freq_start|default(None) is none   %}SAVE_VARIABLE VARIABLE=ishaper_freq_start VALUE=0{% endif %}    # 0 = Klipper default
    {% if sv.ishaper_freq_end|default(None) is none     %}SAVE_VARIABLE VARIABLE=ishaper_freq_end VALUE=0{% endif %}      # 0 = Klipper default
    {% if sv.ishaper_max_smoothing|default(None) is none %}SAVE_VARIABLE VARIABLE=ishaper_max_smoothing VALUE=0{% endif %} # 0 = unlimited
    {% if sv.ishaper_auto_save|default(None) is none    %}SAVE_VARIABLE VARIABLE=ishaper_auto_save VALUE=True{% endif %}
    # ---- pre-print overrides (OFF = print file 1:1) ---------------------------------------
    {% if sv.ov_bed_on|default(None) is none          %}SAVE_VARIABLE VARIABLE=ov_bed_on VALUE=False{% endif %}
    {% if sv.ov_bed|default(None) is none             %}SAVE_VARIABLE VARIABLE=ov_bed VALUE=60{% endif %}
    {% if sv.ov_bed_after_on|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_bed_after_on VALUE=False{% endif %}
    {% if sv.ov_bed_after|default(None) is none       %}SAVE_VARIABLE VARIABLE=ov_bed_after VALUE=60{% endif %}
    {% if sv.ov_hotend_first_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_hotend_first_on VALUE=False{% endif %}
    {% if sv.ov_hotend_first|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_hotend_first VALUE=210{% endif %}
    {% if sv.ov_hotend_after_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_hotend_after_on VALUE=False{% endif %}
    {% if sv.ov_hotend_after|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_hotend_after VALUE=205{% endif %}
    {% if sv.ov_pa_on|default(None) is none           %}SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=False{% endif %}
    {% if sv.ov_pa|default(None) is none              %}SAVE_VARIABLE VARIABLE=ov_pa VALUE=0.045{% endif %}
    {% if sv.ov_retract_on|default(None) is none      %}SAVE_VARIABLE VARIABLE=ov_retract_on VALUE=False{% endif %}
    {% if sv.ov_retract_len|default(None) is none     %}SAVE_VARIABLE VARIABLE=ov_retract_len VALUE=0.8{% endif %}
    {% if sv.ov_retract_speed|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_retract_speed VALUE=35{% endif %}
    {% if sv.ov_accel_on|default(None) is none        %}SAVE_VARIABLE VARIABLE=ov_accel_on VALUE=False{% endif %}
    {% if sv.ov_accel|default(None) is none           %}SAVE_VARIABLE VARIABLE=ov_accel VALUE=4000{% endif %}
    {% if sv.ov_velocity_on|default(None) is none     %}SAVE_VARIABLE VARIABLE=ov_velocity_on VALUE=False{% endif %}
    {% if sv.ov_velocity|default(None) is none        %}SAVE_VARIABLE VARIABLE=ov_velocity VALUE=300{% endif %}
    {% if sv.ov_min_cruise_on|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_min_cruise_on VALUE=False{% endif %}
    {% if sv.ov_min_cruise|default(None) is none      %}SAVE_VARIABLE VARIABLE=ov_min_cruise VALUE=0.5{% endif %}
    {% if sv.ov_square_corner_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_square_corner_on VALUE=False{% endif %}
    {% if sv.ov_square_corner|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_square_corner VALUE=5{% endif %}
    {% if sv.ov_outer_wall_on|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_outer_wall_on VALUE=False{% endif %}
    {% if sv.ov_outer_wall|default(None) is none      %}SAVE_VARIABLE VARIABLE=ov_outer_wall VALUE=40{% endif %}
    {% if sv.ov_outer_wall_accel_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_outer_wall_accel_on VALUE=False{% endif %}
    {% if sv.ov_outer_wall_accel|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_outer_wall_accel VALUE=2000{% endif %}
    {% if sv.ov_support_on|default(None) is none      %}SAVE_VARIABLE VARIABLE=ov_support_on VALUE=False{% endif %}
    {% if sv.ov_support|default(None) is none         %}SAVE_VARIABLE VARIABLE=ov_support VALUE=50{% endif %}
    {% if sv.ov_support_accel_on|default(None) is none %}SAVE_VARIABLE VARIABLE=ov_support_accel_on VALUE=False{% endif %}
    {% if sv.ov_support_accel|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_support_accel VALUE=3000{% endif %}
    {% if sv.ov_ironing_on|default(None) is none      %}SAVE_VARIABLE VARIABLE=ov_ironing_on VALUE=False{% endif %}
    {% if sv.ov_ironing_flow|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_ironing_flow VALUE=15{% endif %}   # % typical for ironing
    {% if sv.ov_ironing_speed|default(None) is none   %}SAVE_VARIABLE VARIABLE=ov_ironing_speed VALUE=20{% endif %} # mm/s typical
    {% if sv.ov_ironing_temp|default(None) is none    %}SAVE_VARIABLE VARIABLE=ov_ironing_temp VALUE=0{% endif %}   # degC, 0 = unchanged
    {% if sv.ov_flow_on|default(None) is none         %}SAVE_VARIABLE VARIABLE=ov_flow_on VALUE=False{% endif %}
    {% if sv.ov_flow|default(None) is none            %}SAVE_VARIABLE VARIABLE=ov_flow VALUE=100{% endif %}
    # ---- gantry sync (dual Z) --------------------------------------------------------------
    {% if sv.gantry_sync_boot|default(None) is none  %}SAVE_VARIABLE VARIABLE=gantry_sync_boot VALUE=False{% endif %}
    {% if sv.gantry_sync_print|default(None) is none %}SAVE_VARIABLE VARIABLE=gantry_sync_print VALUE=False{% endif %}
    {% if sv.zt_boot|default(None) is none %}SAVE_VARIABLE VARIABLE=zt_boot VALUE=False{% endif %}
    {% if sv.gen_out|default(None) is none %}SAVE_VARIABLE VARIABLE=gen_out VALUE=1{% endif %}
    {% if sv.file_profiles_on|default(None) is none %}SAVE_VARIABLE VARIABLE=file_profiles_on VALUE=True{% endif %}
    {% if sv.zt_print|default(None) is none %}SAVE_VARIABLE VARIABLE=zt_print VALUE=False{% endif %}
    {% if sv.zt_retries|default(None) is none %}SAVE_VARIABLE VARIABLE=zt_retries VALUE=2{% endif %}
    {% if sv.zt_tolerance|default(None) is none %}SAVE_VARIABLE VARIABLE=zt_tolerance VALUE=0.05{% endif %}
    {% if sv.gantry_sync_current|default(None) is none %}SAVE_VARIABLE VARIABLE=gantry_sync_current VALUE=0.35{% endif %}
    # ---- misc -------------------------------------------------------------------------------
    {% if sv.pause_at_layer|default(None) is none %}SAVE_VARIABLE VARIABLE=pause_at_layer VALUE=0{% endif %}  # 0 = off
    {% if sv.pause_next_layer|default(None) is none %}SAVE_VARIABLE VARIABLE=pause_next_layer VALUE=False{% endif %}
    {% if sv.cooldown_fan_time|default(None) is none %}SAVE_VARIABLE VARIABLE=cooldown_fan_time VALUE=30{% endif %}    # s fan after print
    {% if sv.heaters_off_at_end|default(None) is none %}SAVE_VARIABLE VARIABLE=heaters_off_at_end VALUE=True{% endif %}
    {% if sv.motors_off_at_end|default(None) is none  %}SAVE_VARIABLE VARIABLE=motors_off_at_end VALUE=True{% endif %}
    # ---- KAMP ---------------------------------------------------------------------------------
    {% if sv.legacy_level|default(None) is none    %}SAVE_VARIABLE VARIABLE=legacy_level VALUE=True{% endif %}   # level+purge also for old files
    {% if sv.kamp_mesh|default(None) is none       %}SAVE_VARIABLE VARIABLE=kamp_mesh VALUE=True{% endif %}
    {% if sv.kamp_purge|default(None) is none      %}SAVE_VARIABLE VARIABLE=kamp_purge VALUE=True{% endif %}
    {% if sv.kamp_purge_type|default(None) is none %}SAVE_VARIABLE VARIABLE=kamp_purge_type VALUE='"LINE"'{% endif %}
    {% if sv.kamp_smart_park|default(None) is none      %}SAVE_VARIABLE VARIABLE=kamp_smart_park VALUE=False{% endif %}
    # ---- nozzle work light (R46) ------------------------------------------------------------
    {% if sv.nozzle_mode|default(None) is none   %}SAVE_VARIABLE VARIABLE=nozzle_mode VALUE='"auto"'{% endif %}
    {% if sv.nozzle_bright|default(None) is none %}SAVE_VARIABLE VARIABLE=nozzle_bright VALUE=1.0{% endif %}
    {% if sv.nozzle_r|default(None) is none      %}SAVE_VARIABLE VARIABLE=nozzle_r VALUE=0.9{% endif %}
    {% if sv.nozzle_g|default(None) is none      %}SAVE_VARIABLE VARIABLE=nozzle_g VALUE=0.9{% endif %}
    {% if sv.nozzle_b|default(None) is none      %}SAVE_VARIABLE VARIABLE=nozzle_b VALUE=0.85{% endif %}
    {% if sv.led_finish_time|default(None) is none %}SAVE_VARIABLE VARIABLE=led_finish_time VALUE=10{% endif %}  # s finished celebration

# -------------------------------------------------------------------------------------
# _R2_VERSION - build stamp of this package. Shown by SHOW_STATUS and _CHECK_INSTALL
# so you can ALWAYS verify which version is actually running on the Pi.
# -------------------------------------------------------------------------------------
[gcode_macro _R2_VERSION]
description: Version of the macro package (internal)
variable_version: 'R2-2026-10-24.132'
gcode:

# -------------------------------------------------------------------------------------
# _CHECK_INSTALL - module self-test: is every file loaded AND current?
#  Runs automatically 5s after boot, callable any time from the console.
#  Every module file carries a version sentinel macro (_V<nn>_<name>) - an OLD copy
#  under the same filename lacks it, so missing AND outdated files are reported.
#  Example catch: 'Unknown command "_CALIBRATE_MESH_PROFILE"' = stale 14_kamp.cfg,
#  'Unable to parse ... VALUE=' = stale 15_objects/09/01 copy.
# -------------------------------------------------------------------------------------
[gcode_macro _CHECK_INSTALL]
description: Verify all macro modules are loaded and current (runs at boot)
gcode:
    {% set modules = [
        ('01_state.cfg',           ['_V01_STATE']),
        ('02_sounds.cfg',          ['_V02_SOUNDS']),
        ('03_leds.cfg',            ['_V03_LEDS']),
        ('04_notify.cfg',          ['_V04_NOTIFY']),
        ('05_materials.cfg',       ['_V05_MATERIALS']),
        ('06_temp_controls.cfg',   ['_V06_TEMPS']),
        ('07_start_confirm.cfg',   ['_V07_CONFIRM']),
        ('08_print_start_stop.cfg',['_V08_STARTSTOP']),
        ('09_pause_filament.cfg',  ['_V09_PAUSE']),
        ('10_live_tuning.cfg',     ['_V10_LIVE']),
        ('11_gantry_sync.cfg',     ['_V11_GANTRY']),
        ('12_maintenance.cfg',     ['_V12_MAINT']),
        ('13_system.cfg',          ['_V13_SYSTEM']),
        ('14_kamp.cfg',            ['_V14_KAMP']),
        ('15_objects.cfg',         ['_V15_OBJECTS']),
        ('17_generator.cfg',       ['_V18_GEN']),
        ('18_colorpic.cfg',        ['_V18_COLORPIC']),
        ('19_bricks.cfg',          ['_V19_BRICKS']),
        ('menus/lcd_menues.cfg',   ['_V16_MENUS']),
    ] %}
    {% set missing = [] %}
    {% for fname, sentinels in modules %}
        {% for m in sentinels %}
            {% if 'gcode_macro ' ~ m not in printer %}
                {% if missing.append(fname) %}{% endif %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% set uniq = missing|unique|list %}
    {% if uniq|length > 0 %}
        RESPOND MSG="!! MODULES MISSING OR OUTDATED: {uniq|join(', ')}"
        RESPOND MSG=">>> Fix: upload the COMPLETE current klipper-e3-r2d2 folder - an old copy under the same filename is NOT enough (it lacks the version sentinel) - then RESTART"
        M117 Update macros!
        {% if 'gcode_macro PLAY_SOUND' in printer %}_SOUND_LIB NAME=r2_error{% endif %}
    {% else %}
        RESPOND MSG="Macro system OK: all {modules|length} modules loaded and current (build {printer['gcode_macro _R2_VERSION'].version if 'gcode_macro _R2_VERSION' in printer else '?'}) (_CHECK_INSTALL)"
    {% endif %}
    # R63: the label generator module is optional (its menus hide themselves) -
    # a missing include deserves a hint instead of silence
    {% if 'gcode_macro _LABELS' not in printer %}
        RESPOND MSG="[i] Labels menu inactive: add '[include klipper-e3-r2d2/macros/16_labels.cfg]' to printer.cfg (see INSTALL.md)"
    {% endif %}
    # R86: same hint for the part generators (cable ties + angle plates)
    {% if 'gcode_macro _GENERATORS' not in printer %}
        RESPOND MSG="[i] Generators inactive: add '[include klipper-e3-r2d2/macros/17_generator.cfg]' to printer.cfg (see INSTALL.md)"
    {% endif %}
    # R120: same hint for the color picture generator
    {% if 'gcode_macro _COLORPIC_SWAP' not in printer %}
        RESPOND MSG="[i] ColorPic inactive: add '[include klipper-e3-r2d2/macros/18_colorpic.cfg]' to printer.cfg (see INSTALL.md)"
    {% endif %}
    # R121: same hint for the building bricks generator
    {% if 'gcode_macro _BRICKS' not in printer %}
        RESPOND MSG="[i] Bricks inactive: add '[include klipper-e3-r2d2/macros/19_bricks.cfg]' to printer.cfg (see INSTALL.md)"
    {% endif %}

# 5s after boot: make sure defaults exist before any menu reads them
[delayed_gcode _INIT_AFTER_BOOT]
initial_duration: 5
gcode:
    _INIT_DEFAULTS
    _CHECK_INSTALL
    # R63: Klipper (re)starts leave the LCD dark for a while (config parse +
    # MCU reconnect) - this chirp says 'the restart WORKED'. Silence after a
    # SAVE_CONFIG = something really went wrong (check Mainsail / klippy.log).
    _SOUND_LIB NAME=r2_done
    M117 R2 ready
    # R64: input shaper override (SHAPER_RESULT / Vibration Cal > Apply) - the
    # chosen shaper survives every restart without touching printer.cfg
    {% if printer['save_variables'].variables.ishaper_ov_on_x|default(False) %}
        SET_INPUT_SHAPER SHAPER_TYPE_X={printer['save_variables'].variables.ishaper_ov_type_x|default('mzv')} SHAPER_FREQ_X={printer['save_variables'].variables.ishaper_ov_freq_x|default(50)|float}
    {% endif %}
    {% if printer['save_variables'].variables.ishaper_ov_on_y|default(False) %}
        SET_INPUT_SHAPER SHAPER_TYPE_Y={printer['save_variables'].variables.ishaper_ov_type_y|default('mzv')} SHAPER_FREQ_Y={printer['save_variables'].variables.ishaper_ov_freq_y|default(50)|float}
    {% endif %}
    # nozzle work light was left ON? light it again right after boot (R46)
    {% if printer['save_variables'].variables.nozzle_mode|default('auto') == 'on' %}
        _NOZZLE_SET ON=1
    {% endif %}

# -------------------------------------------------------------------------------------
# _WATCHDOG - self-healing for the _STATE_WATCHER (R48): a hard gcode error inside
# a watcher branch would kill its self-re-schedule chain (the UPDATE_DELAYED_GCODE
# re-arm is the LAST line and never runs). This watchdog re-arms BOTH timers every
# 5 s - an UPDATE on a live timer just shifts it, a dead one is REVIVED.
# -------------------------------------------------------------------------------------
[delayed_gcode _WATCHDOG]
initial_duration: 30
gcode:
    # re-arm OURSELF first (nothing above us can fail), then the watcher
    UPDATE_DELAYED_GCODE ID=_WATCHDOG DURATION=5
    UPDATE_DELAYED_GCODE ID=_STATE_WATCHER DURATION=0.5

# =====================================================================================
#  _STATE_WATCHER - THE robustness core for OLD gcode files:
#  Klipper itself always knows printer.print_stats.state. This watcher syncs our
#  internal mode to it every second:
#    - print started WITHOUT our PRINT_START (legacy file) -> mode='printing'
#      => temperature overrides + Live-Tuning menu + pause/filament macros activate
#    - print finished without PRINT_END (legacy)           -> finishing feedback
#    - error state                                         -> alarm LEDs + sound
# =====================================================================================
[delayed_gcode _STATE_WATCHER]
initial_duration: 8
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set st = printer.print_stats.state %}
    {% if st == 'printing' and s.mode in ['idle','finished']
          and printer.virtual_sdcard.progress|default(0)|float < 0.05 %}
        {% if s.decided_file == printer.print_stats.filename|default('') and s.decided_mode != '' %}
            # R72 FIELD FIX (log .55): after a mid-start gcode error the file was
            # resumed at its old position - and the start dialog came up AGAIN
            # although the decision had long been made. Never ask twice for the
            # same file: re-activate live tuning with the decided mode, done.
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE={True if s.decided_mode == 'as_sliced' else False}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=end_guard VALUE=False
            SET_LED_STATE STATE=printing
            RESPOND MSG="[OK] Print continues - start decision for this file stands ({s.decided_mode|upper}), live tuning active"
        {% else %}
        # legacy print detected (no PRINT_START in the file) - activate live control
        # R54 guard: progress < 5% - at the END of a print (PRINT_END cleanup sets
        # mode idle while the last bytes are still streaming) this branch must NOT
        # fire: it used to show the start dialog AGAIN after the print finished!
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE=False
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=end_guard VALUE=False
        # fresh print: clear layer state + Z high-water mark (a stale arming from the
        # previous print would false-fire the sequential detector at layer 2)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
        # a previous LAYER_MARK print must not disable the Z tracker for this file
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_marks VALUE=False
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        # stale slicer params of the PREVIOUS marked print must not show up as
        # 'file parameters' - a legacy file reveals its values LIVE (interceptors).
        # R56: EXCEPT when THIS file delivered its own parameters already - the
        # post-processor injects _FILE_INFO at the very top of the file (before
        # this 8s tick), those values are FRESH, not stale - keep them!
        {% if not s.file_info_seen|default(False) %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_material VALUE='"?"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_slicer VALUE='"?"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_firmware VALUE='"?"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_volumetric VALUE=False
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_layer_height VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_outer_wall_speed VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_support_speed VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_ironing_speed VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE=0
        {% endif %}
        {% set sv = printer['save_variables'].variables %}
        {% if sv.start_confirm|default(True) and 'gcode_macro _LEGACY_DIALOG' in printer %}
            # ---- R45: a LEGACY file now ASKS how to print (like marked files do):
            #      AS SLICED = file rules 1:1, no takeover | AS LEGACY = system takeover
            _LEGACY_DIALOG
        {% else %}
            RESPOND MSG="Print running (legacy file) - live tuning and overwrites ACTIVE"
            SET_LED_STATE STATE=printing
            # level + purge ONCE per file before it really starts (toggle: Pre-Print > Bed Mesh)
            {% if s.legacy_file != printer.print_stats.filename|default('') %}
                {% if sv.legacy_level|default(True) and 'gcode_macro _LEGACY_PREP' in printer %}
                    _LEGACY_PREP
                {% elif 'gcode_macro _LEGACY_HOME' in printer %}
                    # 'level old files' OFF: still home once (files without G28 would
                    # crash with 'Must home axis first') + apply the overrides
                    _LEGACY_HOME
                {% endif %}
            {% endif %}
        {% endif %}
        # R72: end of the decided-file wrapper
        {% endif %}
    {% elif s.cancel_armed
          and ((st == 'printing' and s.mode == 'printing') or (st == 'paused' and s.mode in ['paused','filament']))
          and (printer.print_stats.total_duration|float - s.cancel_time|float) > 60 %}
        # cancel confirmation older than 60s -> disarm (no accidental instant cancel
        # long after the first press). R46: also while PAUSED - a forgotten first
        # press can never turn into an instant cancel much later
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=False
        {% if st == 'paused' %}
            RESPOND MSG="Cancel expired (60s) - still paused: RESUME to continue or CANCEL again"
        {% else %}
            RESPOND MSG="Cancel confirmation expired (60s) - disarmed"
        {% endif %}
    {% elif st == 'printing' and s.mode == 'printing'
          and printer.gcode_move.gcode_position.z|float < s.layer_z_max|float
          and s.layer_z_max|float - printer.gcode_move.gcode_position.z|float <= 1.0 %}
        # ---- Z-HOP UN-RATCHET (R49, field log .32): a SMALL fall since the last
        #      tick is a slicer z-hop being undone (or a short travel dip) - NOT a
        #      move to the next object. The hop top had ratcheted the high-water
        #      mark up; give that height BACK here. Without this, printing with
        #      'z hop when retracted' faked a 'fell back to layer 1' as soon as
        #      print_z + hop_height crossed 1.6 mm -> pause + L1 temps + L1 speed
        #      in the MIDDLE of object 1. Falls > 1.0 mm are too big for a hop ->
        #      real object change, the sequential detector below handles those.
        #      This branch runs INSTEAD of the detector this tick - exactly right:
        #      a hop must never look like an object change.
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={printer.gcode_move.gcode_position.z|round(3)}
    {% elif st == 'printing' and s.mode == 'printing' and s.layer >= 2
          and printer.gcode_move.gcode_position.z|float < 0.75
          and s.layer_z_max|float >= 1.6 %}
        # ---- SEQUENTIAL print ('print by object'): the NEXT object begins ---------------
        # FALLING-EDGE detection, not a level check: Z was >= 1.6mm at some point
        # (layer_z_max = high-water mark, maintained for marked AND legacy files) and is
        # now back at first-layer height. A bare 'z < 1.5' level check FALSE-fires at thin
        # layers (0.2mm layers: layer 2 sits at z=0.4 - still below 1.5!) and re-armed the
        # L1 restart over and over. The edge can only mean a real travel down to the next
        # object's layer 1. PAUSE re-anchors layer_z_max to the print Z (before its park
        # lift) -> pausing/resuming inside low layers can never look like an object change.
        # Works for LAYER_MARK files, legacy files and vase mode (vase only rises WITHIN
        # an object). Limitation: the previous object must be >= 1.6mm tall to arm the edge.
        {% set objn = namespace(n='') %}
        {% if 'exclude_object' in printer %}
            {% set cur = printer['exclude_object'].current_object|default('') %}
            {% if cur and cur != 'None' %}
                {% set objn.n = cur %}
            {% else %}
                # R72: between objects (or right after a skip) current_object is
                # None - that printed 'next object (None)'. Name the next
                # non-excluded object instead.
                {% set _excl = printer['exclude_object'].excluded_objects|default([])|list %}
                {% for o in printer['exclude_object'].objects|default([]) %}
                    {% if not objn.n and o.name not in _excl %}
                        {% set objn.n = o.name %}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endif %}
        {% set obj = objn.n if objn.n else 'next' %}
        {% set bed1 = sv.ov_bed|default(0)|float if sv.ov_bed_on|default(False) else 0.0 %}
        {% set hot1 = sv.ov_hotend_first|default(0)|float if sv.ov_hotend_first_on|default(False) else 0.0 %}
        {% set need_bed = bed1 > 0 and (printer.heater_bed.target|float - bed1)|abs > 2 %}
        {% set need_hot = hot1 > 0 and (printer.extruder.target|float - hot1)|abs > 3 %}
        RESPOND MSG="Sequential print: next object ({obj}) - back to LAYER-1 temperatures"
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={printer.gcode_move.gcode_position.z|round(3)}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
        {% if bed1 > 0 %}SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed1|round}{% endif %}
        {% if hot1 > 0 %}SET_HEATER_TEMPERATURE HEATER=extruder TARGET={hot1|round}{% endif %}
        {% if sv.first_layer_speed|default(75)|float > 0 %}
            M220 S{sv.first_layer_speed|default(75)|float|round}
            RESPOND MSG="First layer speed again {sv.first_layer_speed|default(75)|float|round|int}%"
        {% endif %}
        {% if need_bed or need_hot %}
            # only pause+wait when a heater really has to move - otherwise the
            # park/return cycle would only cost time and blob the fresh object
            PAUSE REASON="next object: layer-1 temps"
            UPDATE_DELAYED_GCODE ID=_OBJECT_PREP DURATION=2
        {% else %}
            RESPOND MSG="Layer-1 temperatures already set - continuing without pause"
        {% endif %}
    {% elif st == 'printing' and s.mode == 'printing' and s.layer_marks
          and printer.gcode_move.gcode_position.z|float > s.layer_z_max|float %}
        # marked files skip the Z tracker below - keep the high-water mark here so the
        # sequential falling edge above works for LAYER_MARK files (and vase mode) too
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={printer.gcode_move.gcode_position.z|round(3)}
    {% elif st == 'printing' and s.mode == 'printing' and not s.layer_marks %}
        # ---- layer tracking via Z for OLD files (no LAYER_MARK markers) --------------------
        # Two mechanisms: (a) single Z jump of 0.05..0.35mm = layer boundary,
        # (b) SLOW CONTINUOUS rise (spiral/vase mode!) accumulates to a layer height.
        # Bigger single jumps are travel/z-hop and ignored.
        {% set zc = printer.gcode_move.gcode_position.z|float %}
        {% set dz = zc - s.layer_z_max|float %}
        {% set new_layer = false %}
        {% if s.layer|int == 0 and dz < 0 %}
            # COLD-START RE-ANCHOR (R42): at an object start (layer 0 after an object
            # change / skip) Z can sit BELOW a stale high-water mark (park lift or
            # z-hop travel ratcheted it up) - dz stays negative and the layer counter
            # would stay frozen at 0 (field log: L2 never applied after a skip).
            # Re-anchor DOWN here so counting can begin with the first real layer.
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={zc|round(3)}
            {% set dz = 0.0 %}
        {% endif %}
        {% if dz > 0.05 and dz < 0.35 %}
            {% set new_layer = true %}
        {% elif dz > 0 and dz <= 0.05 %}
            # slow continuous rise (vase mode): accumulates to a layer height
            {% set acc = s.layer_z_acc|float + dz %}
            {% if acc >= 0.18 %}
                {% set new_layer = true %}
                {% set acc = 0 %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE={acc|round(3)}
        {% endif %}
        {% if dz > 0 %}SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={zc|round(3)}{% endif %}
        {% if new_layer %}
            {% set n = s.layer + 1 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE={n}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
            M117 Layer {n} (Z-track)
            # ---- temperature tower (R41): band temp per layer, both file kinds ----------
            {% if sv.tt_active|default(False) %}
                {% set idx = ((n - 1) / sv.tt_band|default(10))|int %}
                {% set tt = [sv.tt_start + idx * sv.tt_step, sv.tt_end]|min %}
                SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tt|round}
                RESPOND MSG="Temp tower: layer {n} -> {tt|round|int}C"
            {% endif %}

            # R61: planned end at layer N (both layer counters feed this hook)
            {% if s.stop_at_layer|default(0)|int > 0 and n >= s.stop_at_layer|default(0)|int %}
                _END_AT_LAYER LAYER={n}
            {% endif %}

            {% if n == 2 and not s.ignore_overrides and sv.first_layer_speed|default(75)|float > 0 %}
                M220 S100
                RESPOND MSG="Layer 2: speed back to 100%"
            {% endif %}
            # ---- layer 2 for OLD files: 'after layer 1' temps + fan (mirror of LAYER_MARK,
            #      so legacy prints get the same L2 switch as marked files - R40)
            {% if n == 2 %}
                # R161 (.121): unified L2 rule (user override > file value >
                # material preset, BOTH modes) - the marked-file twin lives in
                # 06_temp LAYER_MARK. Old files switched nothing without an
                # armed override (field log: bed stayed at the L1 value).
                {% set db161 = printer['gcode_macro _MATERIALS'].presets %}
                {% set mat161 = s.file_material|default('?')|string|upper %}
                {% if mat161 not in db161 %}{% set mat161 = sv.material|default('PLA')|string|upper %}{% endif %}
                {% set h2 = sv.ov_hotend_after|default(0)|float if sv.ov_hotend_after_on|default(False)
                            else (s.file_hotend_after|float if s.file_hotend_after|float > 0
                                  else (db161[mat161].hot2|float
                                        if (mat161 in db161 and sv.first_layer_rules|default(True)) else 0)) %}
                {% set b2 = sv.ov_bed_after|default(0)|float if sv.ov_bed_after_on|default(False)
                            else (s.file_bed_after|float if s.file_bed_after|float > 0
                                  else (db161[mat161].bed2|float
                                        if (mat161 in db161 and sv.first_layer_rules|default(True)) else 0)) %}
                {% if h2 > 0 and (h2 - printer.extruder.target|float)|abs > 0.5 %}
                    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={h2|round}
                    RESPOND MSG="Layer 2: hotend -> {h2|round(0)}C (Z-track)"
                {% endif %}
                {% if b2 > 0 and (b2 - printer.heater_bed.target|float)|abs > 0.5 %}
                    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={b2|round}
                    RESPOND MSG="Layer 2: bed -> {b2|round(0)}C (Z-track)"
                {% endif %}
                {% if sv.ov_fan_on|default(False) %}
                    SET_FAN_SCALE PERCENT={sv.ov_fan|default(100)|float|round}
                    RESPOND MSG="Layer 2: fan scale {sv.ov_fan|default(100)|float|round|int}% (material)"
                {% endif %}
            {% endif %}
            {% if n == 2 and s.file_fan|default(0)|float > 0 and printer.fan.speed|default(0)|float <= 0 %}
                # R79: held layer-1 fan comes back at layer 2 (file value, scale via M106)
                M106 S{s.file_fan|float|round|int}
                RESPOND MSG="Layer 2: fan back on (file value S{s.file_fan|float|round|int})"
            {% endif %}
            {% if printer['save_variables'].variables.pause_next_layer|default(False) %}
                SAVE_VARIABLE VARIABLE=pause_next_layer VALUE=False
                PAUSE REASON="{s.pause_planned_reason|default('next layer')} (layer {n})"
            {% elif printer['save_variables'].variables.pause_at_layer|default(0)|int == n and n > 1 %}
                SAVE_VARIABLE VARIABLE=pause_at_layer VALUE=0
                PAUSE REASON="layer {n} (planned)"
            {% endif %}
        {% endif %}
    {% elif st == 'printing' and s.mode == 'paused' %}
        # self-heal: mode says paused but the file is already running again
        # (a resume path slipped) -> after 5s we follow along so PAUSE works again
        {% set d = s.pause_desync + 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE={d}
        {% if d >= 5 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
            RESPOND MSG="State re-synced: print is running again (mode was stuck in 'paused')"
        {% endif %}
    {% elif st == 'paused' and s.mode == 'printing' %}
        # paused through a path that bypassed our PAUSE macro - follow along
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"paused"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE=0
    {% elif st == 'complete' and s.mode == 'waiting' %}
        # start dialog was waiting, but the file ended externally (Mainsail stop)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        _PRINT_CLEANUP
        SET_LED_STATE STATE=idle
        RESPOND MSG="Start dialog: print ended externally - back to idle"
    {% elif st == 'complete' and s.mode in ['printing','paused','filament'] %}
        # legacy file ended without PRINT_END - still give proper feedback
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"finished"'
        SET_LED_STATE STATE=finished
        # celebration for led_finish_time seconds, then back to idle breathing (R46)
        UPDATE_DELAYED_GCODE ID=_LED_TO_IDLE DURATION={sv.led_finish_time|default(10)|float}
        PLAY_SOUND NAME=r2_done
        RESPOND MSG="Print finished: {printer.print_stats.filename|default('?')} ({printer.print_stats.print_duration/60|round(0)} min)"
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        # full per-print cleanup (R46): next print starts clean, settings/mesh stay
        _PRINT_CLEANUP
        # a mesh measured during the print: persist ONLY on request
        # ('Save after print' OFF = session only - YOU run SAVE_CONFIG yourself)
        {% if printer['gcode_macro _STATE'].mesh_saved_pending %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_saved_pending VALUE=False
            {% if sv.mesh_auto_save|default(False) %}
                RESPOND MSG="Mesh auto-save ON: persisting the mesh (Klipper restarts once)"
                SAVE_CONFIG
            {% else %}
                RESPOND MSG="Mesh stays SESSION-only (no restart). Permanent: 'Save after print' ON or System > Save config"
            {% endif %}
        {% endif %}
    {% elif st == 'error' and s.mode != 'idle' %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        SET_LED_STATE STATE=alarm
        PLAY_SOUND NAME=r2_alarm
        RESPOND MSG="Printer reported an ERROR - check the console! (your start decision stands: fix the cause, then RESUME - or CANCEL)"
    {% elif s.mode == 'starting' and st not in ('printing','paused') %}
        # R160b (.120 field log): PRINT_START died mid-flow (e.g. a homing
        # error) - the mode stayed 'starting' FOREVER: every generator job
        # silently requeued (the texture tool 'did nothing'), the LEDs kept
        # blinking in the start effect. Grace rules: a real start phase
        # (heat soak!) may run for minutes, so heal only when no heater is
        # actively chasing its target (3 min) or at the 20 min hard limit.

        {% set d = s.start_stuck|default(0)|int + 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_stuck VALUE={d}
        {% set heat_e = printer.extruder.target|default(0)|float > 0 and printer.extruder.temperature|default(0)|float < printer.extruder.target|default(0)|float - 1.5 %}
        {% set heat_b = printer.heater_bed.target|default(0)|float > 0 and printer.heater_bed.temperature|default(0)|float < printer.heater_bed.target|default(0)|float - 1.0 %}
        {% if ((not heat_e and not heat_b) and d > 180) or d > 1200 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_stuck VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_LED_STATE STATE=idle
            PLAY_SOUND NAME=r2_notice
            RESPOND MSG="[i] The last start never reached the print (check the console - e.g. a homing error). Back to idle: generators, sounds and LEDs work again"
        {% endif %}
    {% elif s.mode in ('printing','paused','filament') and st not in ('printing','paused','complete','error') %}
        # R160b: a live mode while the printer itself reports standby/cancel -
        # a wedged end path. 15 ticks of grace, then a clean reset (nothing
        # runs - heaters were already off in every such path).

        {% set d2 = s.state_stuck|default(0)|int + 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=state_stuck VALUE={d2}
        {% if d2 > 15 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=state_stuck VALUE=0
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_LED_STATE STATE=idle
            RESPOND MSG="[i] State healed: no print is running (mode was stuck in '{s.mode}') - back to idle"
        {% endif %}
    {% endif %}
    {% if s.mode != 'starting' and s.start_stuck|default(0)|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_stuck VALUE=0
    {% endif %}
    {% if (s.mode in ('printing','paused','filament') and st in ('printing','paused','complete','error')) or s.mode not in ('printing','paused','filament') %}
        {% if s.state_stuck|default(0)|int > 0 %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=state_stuck VALUE=0
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_STATE_WATCHER DURATION=1

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V01_STATE]
description: Version sentinel of 01_state.cfg (internal)
gcode:

# -------------------------------------------------------------------------------------
# _PACE - R85 micro-pause between disk writes. A click that fires many
# SAVE_VARIABLEs rewrites variables.cfg over and over - on the Pi Zero 2 W that
# burst competes with klippy (field logs: Timer-too-close class). _PACE inserts
# ~100ms of air between the writes - but ONLY while idle: a G4 during a print
# would be a real dwell in the move queue (stutter). Macros that may run mid-
# print call _PACE anyway; it no-ops there.
# -------------------------------------------------------------------------------------
[gcode_macro _PACE]
description: Micro-pause between disk writes (idle only - never dwells during a print)
gcode:
    {% if printer['gcode_macro _STATE'].mode not in ['printing','paused'] %}
        G4 P{params.P|default(100)|int}
    {% endif %}
