# ----- live tuning: SPEED FACTORS per feature (1.0 = 100% = as sliced) -------------------
variable_f_outer_wall: 1.0
variable_f_inner_wall: 1.0
variable_f_infill: 1.0
variable_f_solid: 1.0
variable_f_support: 1.0
variable_f_ironing: 1.0
variable_f_fan_scale: 1.0        # scales every M106 of the file
variable_f_fan_hold: 0           # R115: % that REPLACES every file M106 (0 = file values rule again)
variable_f_fan_live: 0            # R175c: your ABSOLUTE fan % - beats everything
variable_f_fan_live_on: False     # R175c: LIVE mode switch (off = file rules via hold>scale>clamp)
variable_pause_now_arm: 0        # R115: two-press guard for the LCD 'Pause NOW' entry (encoder double-clicks)
variable_zh_lifted: False        # R106 z-hop: currently lifted over a retract
variable_zh_base_z: 0.0          # R106 z-hop: z before the lift (lower target)
# ----- live tuning: ACCELERATION per feature (0 = use global accel) ----------------------
variable_a_global: 4000
variable_a_outer_wall: 0
variable_a_inner_wall: 0
variable_a_infill: 0
variable_a_solid: 0
variable_a_support: 0
variable_a_ironing: 0
# ----- live tuning: extrusion ------------------------------------------------------------
variable_flow: 100               # global flow % (M221)
variable_g_speed_clean: 100      # R59: THE global speed % (brake/SET_GLOBAL_SPEED/file M220) - feature scaling NEVER touches it (compound-bug fix)
variable_live_flow: 0            # R73: user's LIVE flow % (0 = off) - beats the pre-print flow override AND feature re-applies
variable_live_accel: 0           # R73: user's LIVE accel (0 = off) - beats feature/global accel re-applies
variable_m204_last: -1           # R167: last accel actually SENT to klippy - the M204 interceptor swallows repeats
variable_feat_acc_active: 0       # R167: current feature accel (0 = none) - M204 hotpath mirror, no save_variables read
variable_ovl_acc: 0               # R167: pre-print accel override mirror (hotpath)
variable_ovl_acc_on: False        # R167: pre-print accel override ON mirror
variable_l1_speed_user: False    # R73: user set speed live during layer 1 - the L1 speed brake steps back
variable_plot_extrude: False     # R73: the running plot job draws with FILAMENT (set by _PLOT_START)
variable_pa_value: 0.045         # current pressure advance
variable_pa_smooth: 0.04
variable_ironing_flow: 100       # ironing flow scaling %
variable_ironing_temp: 0         # ironing temperature override, 0 = off
variable_ironing_temp_active: False
variable_ironing_prev_temp: 0
# ----- misc -------------------------------------------------------------------------------
variable_last_led: ''            # last LED state (debug/display)
variable_pid_running: False      # PID tune in progress?
variable_fp_pre: False           # R109: the selected file has a 'pre' profile (FILE_PROFILE_AUTO sets it)
variable_fp_post: False          # R109: ... has a 'post' profile
variable_fp_file: ''             # R109: the file those flags belong to
variable_def_del_arm: 0          # R110: default slot armed for LCD 2-press delete (0 = none)
variable_fp_del_arm: ''          # R110: 'pre'/'post' armed for LCD 2-press delete ('' = none)
variable_pa_feat_active: False   # R111: a feature PA is currently applied (restore on leave)
variable_pa_last: -1.0           # R182: last PA actually SENT (the _SET_PA funnel swallows repeats)
# ---- R182 mirrors: the print-time hot paths (APPLY_TYPE per feature block,
# M106 per fan command) NEVER touch save_variables - the .131a field log:
# 51 labels fired dozens of full variable-set reads per layer -> 'Timer too
# close'. fov_<feature> = (on, spd%, accel, flow%, pa) tuple; fova_* = the
# scalar overrides; fecho_<feature> = last echo signature (silence repeats).
variable_fov_wallouter: (0, 100.0, 0.0, 100.0, 0.0)
