variable_file_feat_acc_internalbridge: 0.0
variable_file_feat_acc_primetower: 0.0
variable_file_feat_acc_custom: 0.0
variable_ret_len: 0.75          # LIVE retraction mirror (LCD shows runtime values, not stale config)
variable_ret_spd: 35.0
variable_ret_unret: 35.0
variable_ret_unretx: 0.0
variable_mesh_saved_pending: False  # mesh measured during print -> SAVE_CONFIG after
variable_skip_armed_time: 0      # timestamp of first skip press
variable_wait_ticks: 0           # counter for the pre-print reminder beep
# ----- layers / file info (filled by PRINT_START from slicer parameters) ----------------
variable_layer: 0                # current layer (0 = before first layer)
variable_stop_at_layer: 0        # R61: >0 = planned normal end when this layer begins
variable_total_layers: 0         # total layers if provided by the slicer (0 = unknown)
variable_current_type: ''        # current gcode feature type ('WALL-OUTER', 'SUPPORT' ...)
variable_file_material: 'PLA'    # material as sliced in the file
variable_file_slicer: '?'       # R84: slicer + version, from the file header
variable_file_firmware: '?'     # R84: firmware flavor the file was sliced for
variable_file_volumetric: False # R84: Marlin volumetric E (mm3) - Klipper counts mm!
variable_file_bed: 60            # bed temp from the file
