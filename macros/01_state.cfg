# =====================================================================================
#  01_state.cfg - Central state storage of the macro system
#  -----------------------------------------------------------------------------------
#  TWO kinds of variables:
#
#  1) [save_variables] -> PERSISTENT values stored in ~/printer_data/variables.cfg
#     Everything that should survive a restart: material, pre-print overrides,
#     mesh/PID bookkeeping, sound/LED switches ...
#
#  2) [gcode_macro _STATE] -> VOLATILE values (RAM only), the printer "mode":
#     mode, layer counter, live tuning factors, park position ...
#
#  Access from other macros / menus:
#     printer['save_variables'].variables.material          (persistent)
#     printer['gcode_macro _STATE'].mode                    (volatile)
#
#  NEW: _STATE_WATCHER (bottom of this file) watches printer.print_stats every
#  second. That is what makes OLD gcode files work: even if a file never calls
#  PRINT_START / LAYER_MARK / APPLY_TYPE (sliced before this system existed),
#  the watcher flips the mode to 'printing' -> temperature overrides, the
#  Live-Tuning menu and pause/filament macros all come alive automatically.
# =====================================================================================

[save_variables]
filename: ~/printer_data/variables.cfg

# -------------------------------------------------------------------------------------
# _STATE = volatile state store. Values below are global defaults, changed at runtime
# with SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=<name> VALUE=<python literal>
# -------------------------------------------------------------------------------------
[gcode_macro _STATE]
description: Internal state store (do not call directly)
# ----- flow control -------------------------------------------------------------------
variable_mode: 'idle'            # idle | waiting | starting | printing | paused | filament | finished
variable_pause_reason: ''        # e.g. 'Filament runout', 'User', 'layer 5'
variable_cancel_armed: False     # two-step cancel protection
variable_cancel_time: 0          # timestamp of first cancel press
variable_legacy_file: ''         # filename of the last legacy print we auto-leveled
variable_legacy_armed: False     # R72: a heater command armed the takeover - START_PRINT/probe executes it
variable_decided_file: ''        # R72: file a start decision was already made for (no second dialog!)
variable_decided_mode: ''        # R72: 'as_sliced' | 'as_legacy' - what was decided for decided_file
variable_file_type: 'unknown'   # R45: 'marked' (R2 markers) | 'legacy' (no PRINT_START) | 'unknown' | 'movement' (R50)
variable_start_pending: ''       # R50: universal-intercept decision, file not yet identified ('as_sliced'/'overrides')
variable_has_heaters: False      # R50: the file sets heater targets itself (M104/M109/M140/M190)
variable_probe_stage: 0          # R50: movement-file probe (1=first look done, 2=second)
variable_file_fan: 0             # part fan value the file asked for (M106 interceptor, R50)
variable_file_flow: 100.0        # flow factor the file asked for (M221 interceptor, R50)
variable_file_accel: 0.0          # acceleration the file asked for (M204 interceptor, R51)
variable_file_speed: 100.0        # speed factor the file asked for (M220 interceptor, R51)
variable_infra_done: False       # R50: movement-file infrastructure already ran
variable_skip_armed_name: ''     # two-step protection for SKIP_OBJECT (pending)
variable_mesh_delete_armed: ''   # two-step protection for DELETE_MESH (pending)
variable_fc_armed: False       # R93: two-step protection for FILE_CHECK RETAG
variable_fc2_armed: False      # R172: two-step protection for FILE_CHECK RETAG=2 (feature re-fix)
variable_layer_z_acc: 0.0        # accumulated Z rise (spiral/vase layer detection)
variable_pause_desync: 0         # seconds mode='paused' while print_stats='printing'
variable_pause_planned_reason: ''  # why the next planned pause fires (runout etc.)
variable_pause_next_armed_runout: False  # runout already armed a planned pause
variable_ishaper_autosave: False    # CALIBRATE_SHAPER should SAVE_CONFIG afterwards
variable_file_pa: 0.0             # PA the PRINT FILE asked for (interceptor captures)
variable_file_retract_len: 0.0    # retraction values the file asked for
variable_file_retract_style: ''     # R89: fw (G10/G11) / fixed / slicer (fix!) / '' = unknown
variable_file_retract_status: ''    # R112: fixed | fw | fix (SHOULD!) | can (optional) | '' unknown
variable_file_retract_max: 0.0      # R112: longest explicit slicer retract (mm)
variable_litho_del_arm: ''          # R89: armed image name for the 2-press delete
variable_gen_del_arm: ''            # R133f: armed generator file name (2-press delete)
variable_gen_arm: ''                # R160: armed generator key (2-press Create, 10s window)
variable_start_stuck: 0             # R160b: ticks with mode 'starting' + no real print
variable_state_stuck: 0             # R160b: ticks with a live mode but the printer is off
variable_file_retract_speed: 0.0
variable_layer_z_max: 0.0        # Z-layer detection for files WITHOUT LAYER_MARK
variable_layer_marks: False      # True = file sends LAYER_MARK (watcher keeps out)
variable_legacy_mode: False     # start of a file without markers -> Z tracker rules (R56: markers always count when present)
variable_file_line_width: 0.0        # R56: slicer line width (from _FILE_INFO / post-processor)
variable_file_line_width_first: 0.0  # R56: first-layer line width
variable_file_line_width_wall: 0.0   # R56: outer wall line width
variable_file_flow_ratio: 0.0        # R56: slicer flow ratio
variable_file_by_object: False       # R56: file is a by-object (sequential) print
variable_file_info_seen: False       # R56: THIS file delivered its parameters via _FILE_INFO
variable_file_speed_outer: 0.0       # R58: slicer speeds (mm/s) from _FILE_INFO
variable_file_speed_inner: 0.0
variable_file_speed_sparse: 0.0
variable_file_speed_top: 0.0
variable_file_speed_solid: 0.0    # R59: internal_solid_infill_speed
variable_file_speed_gaps: 0.0     # R59: gap_infill_speed
