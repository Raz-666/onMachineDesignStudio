variable_fov_infillsparse: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_infillsolid: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_surfacetop: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_surfacebottom: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_bridge: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_gaps: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_support: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_ironing: (0, 100.0, 0.0, 100.0, 0.0)
variable_fov_skirt: (0, 100.0, 0.0, 100.0, 0.0)
