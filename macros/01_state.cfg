variable_absent_features: []        # R79: feature overrides parked for THIS print (types not in the file)
variable_file_feat_spd_wallouter: 0.0   # R60: MEASURED original speed mm/s (most frequent F per segment)
variable_file_feat_spd_wallinner: 0.0
