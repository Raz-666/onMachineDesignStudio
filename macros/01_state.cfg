variable_file_feat_acc_wallouter: 0.0   # R60: MEASURED original accel mm/s2 (M204 in effect per segment)
variable_file_feat_acc_wallinner: 0.0
variable_file_feat_acc_infillsparse: 0.0
variable_file_feat_acc_infillsolid: 0.0
variable_file_feat_acc_surfacetop: 0.0
variable_file_feat_acc_surfacebottom: 0.0
