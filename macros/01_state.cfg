variable_file_derived: False       # R111: features DERIVED by the geometry classifier (no ;TYPE: tags)
variable_file_conf: 0.0            # R111: classifier confidence (0.7 = good guess)
variable_file_cover: 0             # R111: % of extrusion moves the classifier covered
variable_file_maxrate: 0.0         # R111: max volumetric flow mm3/s measured in the file
variable_file_travel: 0.0         # R121: dominant travel speed mm/s measured in the file
variable_file_seam: '-'            # R111: outer-wall seam start position 'x,y' mm
variable_file_seamn: 0             # R111: seam starts counted (5mm grid)
variable_file_lw_inner: 0.0        # R111: slicer line widths per feature (CFG replay)
variable_file_lw_sparse: 0.0
variable_file_lw_solid: 0.0
variable_file_lw_top: 0.0
variable_file_lw_small: 0.0
variable_file_accel_solid: 0.0     # R111: slicer accel values (CFG replay)
variable_file_accel_first: 0.0
variable_file_accel_travel: 0.0
variable_file_fil_dia: 0.0         # R111: filament diameter (usually 1.75)
variable_file_time_slow: 0.0       # R111: slowdown thresholds from the slicer profile
variable_file_slow_min: 0.0
variable_file_fan_min: 0.0         # R111: slicer fan curve min/max %
