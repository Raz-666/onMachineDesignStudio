# =====================================================================================
#  13_system.cfg - System control (restarts/shutdown) & info
#  -----------------------------------------------------------------------------------
#  Available on LCD AND in Mainsail:
#   - SYS_FIRMWARE_RESTART : restart MCU + host (after config changes)
#   - SYS_HOST_RESTART     : restart Klipper software only
#   - SYS_SHUTDOWN         : shut the printer down cleanly (heaters/motors off)
#  NOTE RASPBERRY PI RESTART/SHUTDOWN:
#  Klipper itself is not allowed to reboot the host (safety by design). In Mainsail:
#  Machine -> Restart / Shutdown (moonraker does it). The LCD shows an info screen.
#
#  Every restart is guarded by double-press (CONFIRM=1) - no accidental restart.
# =====================================================================================
[gcode_macro SYS_FIRMWARE_RESTART]
description: Firmware restart (press twice / CONFIRM=1)
gcode:
    {% if params.CONFIRM|default(0)|int == 1 %}
        NOTIFY TEXT="Firmware restart..." LEVEL=warn SOUND=r2_sad
        STOP_LED_EFFECTS
        G4 P800
        FIRMWARE_RESTART
    {% else %}
        NOTIFY TEXT="Press SYS_FIRMWARE_RESTART again to really restart!" LEVEL=warn SOUND=r2_alarm
    {% endif %}

[gcode_macro SYS_HOST_RESTART]
description: Klipper host restart (press twice / CONFIRM=1)
gcode:
    {% if params.CONFIRM|default(0)|int == 1 %}
        NOTIFY TEXT="Klipper restart..." LEVEL=warn SOUND=r2_sad
        STOP_LED_EFFECTS
        G4 P800
        RESTART
    {% else %}
        NOTIFY TEXT="Press SYS_HOST_RESTART again to really restart!" LEVEL=warn SOUND=r2_alarm
    {% endif %}

[gcode_macro SYS_SHUTDOWN]
description: Shut the Pi down (press twice / CONFIRM=1) - like Mainsail's button
gcode:
    {% if params.CONFIRM|default(0)|int == 1 %}
        # Make everything safe first
        TURN_OFF_HEATERS
        M107
        STOP_LED_EFFECTS
        G4 P800
        # Path 1: gcode-shell-command extension (if installed)
        {% if 'gcode_shell_command poweroff' in printer.configfile.settings %}
            NOTIFY TEXT="Shutting down Pi (shell) - you can switch power off" LEVEL=warn SOUND=r2_sad
            G4 P1500
            RUN_SHELL_COMMAND CMD=poweroff
        {% else %}
            # Path 2 (NO extension needed!): moonraker's machine endpoint - the exact
            # same call the Mainsail 'Shutdown' button uses. Works on every install
            # that runs moonraker (which you have, since you use Mainsail).
            NOTIFY TEXT="Shutting down Pi via moonraker - you can switch power off" LEVEL=warn SOUND=r2_sad
            G4 P1500
            {action_call_remote_method("shutdown_machine")}
        {% endif %}
    {% else %}
        NOTIFY TEXT="Press SYS_SHUTDOWN again to really shut down!" LEVEL=warn SOUND=r2_alarm
    {% endif %}

[gcode_macro HOST_RESTART_INFO]
description: Info: Raspberry Pi restart is done via Mainsail (Machine menu)
gcode:
    M117 Pi restart: see Mainsail
    RESPOND MSG="Raspberry Pi restart/shutdown: Mainsail top right -> Machine -> 'Restart host' / 'Shutdown host'. (Klipper itself may not trigger this - safety by design.)"
    _SOUND_LIB NAME=r2_notice

# -------------------------------------------------------------------------------------
#  R63 SYS_SAVE_CONFIG - guarded SAVE_CONFIG (System > Save config).
#  Field problem: SAVE_CONFIG restarts Klipper and the LCD keeps its last image
#  for up to ~2 minutes (config parse + MCU reconnect on a Pi Zero 2 class host).
#  That looked like a freeze - and power-cycling during it risks SD corruption.
#  This wrapper: refuses during a print, skips the restart when nothing is
#  pending, and TELLS you the display will go dark before it does.
#  If the restart really hangs (LCD dark AND Mainsail shows an error after 2+ min):
#  run FIRMWARE_RESTART from Mainsail or 'sudo service klipper restart' via SSH -
#  and send us ~/printer_data/logs/klippy.log (R2 can not fix that from config).
# -------------------------------------------------------------------------------------
[gcode_macro SYS_SAVE_CONFIG]
description: Save config + restart (press twice / CONFIRM=1) - LCD goes dark, do NOT power off!
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # R73: report WHAT is pending (and why nothing happens when nothing is) -
    # the .56 field log read 'save config does nothing anymore' while Klipper
    # simply had no pending calibration values. Settings/materials/labels save
    # IMMEDIATELY (save_variables) - only Klipper's own calibrations need this.
    {% set pend = printer.configfile.save_config_pending|default(False) %}
    {% set items = printer.configfile.save_config_pending_items|default({}) %}
    {% if params.CONFIRM|default(0)|int == 1 %}
        {% if printer.print_stats.state in ['printing','paused'] or s.mode not in ['idle','finished'] %}
            NOTIFY TEXT="SAVE_CONFIG is blocked during a print - end the print first (FORCE END PRINT)" LEVEL=warn SOUND=r2_alarm
            M117 Blocked: printing
        {% elif not pend %}
            NOTIFY TEXT="Nothing to save (R2 settings save instantly) - restarting Klipper anyway" LEVEL=info SOUND=r2_notice
            M117 Restarting...
            RESPOND MSG="[i] Nothing pending for SAVE_CONFIG (PID/mesh/probe/Z) - your R2 settings save instantly anyway."
            RESPOND MSG="    Restarting Klipper now (LCD goes dark ~1 min - do NOT power off)."
            STOP_LED_EFFECTS
            G4 P800
            FIRMWARE_RESTART
        {% else %}
            NOTIFY TEXT="Saving + restarting now: the LCD goes DARK for up to 2 min - DO NOT power off!" LEVEL=warn SOUND=r2_sad
            M117 Restart... DO NOT OFF!
            RESPOND MSG="[i] SAVE_CONFIG stores: {items.keys()|join(', ')}"
            STOP_LED_EFFECTS
            G4 P1500
            SAVE_CONFIG
        {% endif %}
    {% else %}
        {% if pend %}
            NOTIFY TEXT="Pending for SAVE_CONFIG: {items.keys()|join(', ')} - press SAVE+RESTART to store + restart (LCD dark up to 2 min)" LEVEL=warn SOUND=r2_question
            M117 Pending: {items.keys()|length}
        {% else %}
            NOTIFY TEXT="Nothing pending for SAVE_CONFIG (R2 settings save instantly) - press again to run it anyway" LEVEL=info SOUND=r2_notice
            M117 Nothing pending
        {% endif %}
    {% endif %}

[gcode_macro EMERGENCY_STOP]
description: Immediate stop (M112) - everything off
gcode:
    M112

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# HW_INFO - the hardware profile at a glance (console): build volume, probe
# offset, clean/present positions, LED layout + whether the LCD persister is
# available. Read-only. The values live in r2_hardware.cfg (the SECOND
# variables file) - resetting variables.cfg never loses them.
# -------------------------------------------------------------------------------------
[gcode_macro HW_INFO]
description: Report the hardware profile (build volume, probe, positions, LEDs)
gcode:
    {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
    {% if not rc %}
        RESPOND MSG="Hardware profile: no [gcode_macro _R2_CONFIG] - defaults in use (Ender-3 reference)"
        RESPOND MSG="Create it with the wizard: bash klipper-e3-r2d2/setup.sh (survives variables.cfg resets)"
    {% else %}
        RESPOND MSG="Hardware profile (r2_hardware.cfg):"
        RESPOND MSG="  bed X {rc.bed_min_x|default(0)|float} .. {rc.bed_max_x|default(220)|float} | Y {rc.bed_min_y|default(-3)|float} .. {rc.bed_max_y|default(217)|float} | Z 0 .. {rc.bed_max_z|default(250)|float}"
        RESPOND MSG="  probe offset X {rc.probe_x|default(0)|float} Y {rc.probe_y|default(0)|float} | wipe {rc.wipe_x|default(-1)|float},{rc.wipe_y|default(-1)|float} | present {rc.present_x|default(10)|float},{rc.present_y|default(228)|float}"
        {% set lsec = rc.led_section|default('printer_leds')|string %}
        {% set ltype = rc.led_type|default('neopixel')|string %}
        {% set lkey = ltype ~ ' ' ~ lsec %}
        {% if lkey in printer.configfile.settings %}
            {% set chain = printer.configfile.settings[lkey].chain_count|default('?')|string %}
            RESPOND MSG="  LEDs: [{ltype} {lsec}] {chain} LEDs | status 1-{rc.led_status_n|default(4)|int} | bed {rc.led_status_n|default(4)|int + 1}-{rc.led_status_n|default(4)|int + rc.led_bed_n|default(0)|int}"
        {% else %}
            RESPOND MSG="  LEDs: no [{ltype} {lsec}] section configured"
        {% endif %}
        {% if 'gcode_shell_command R2_PERSIST' in printer.configfile.settings %}
            RESPOND MSG="  LCD persistence: R2_PERSIST available (LED Setup edits survive restarts)"
        {% else %}
            RESPOND MSG="  LCD persistence: no [gcode_shell_command R2_PERSIST] - LED Setup edits apply to the session only"
        {% endif %}
    {% endif %}

[gcode_macro _V13_SYSTEM]
description: Version sentinel of 13_system.cfg (internal)
gcode:

# -------------------------------------------------------------------------------------
#  R62 FORCE_END_PRINT - the emergency brake that ALWAYS works.
#  Field problem: a wedged print state (print_stats says printing/paused, but
#  nothing moves, heaters cool down, no Cancel in the LCD, a new start refused)
#  could only be cleared by power-cycling the printer. This macro guarantees a
#  clean print end in EVERY situation - wedged, paused, live or idle:
#    1. stop the SD reader (M25) and cancel the file (CANCEL_PRINT_BASE)
#    2. heaters + fan off, sensors back on, pause states cleared
#    3. full per-print cleanup (_PRINT_CLEANUP) + mode reset to idle
#  When a REAL print is running/paused it asks for a second press (like the
#  SYS_* macros). When the state is WEDGED (mode printing-ish but print_stats
#  disagrees) it fires IMMEDIATELY - there is nothing left to lose.
#  LCD: System > FORCE END PRINT (the System menu is always visible since .46)
#       + Live Tuning > Pause & Control. Console/Mainsail: FORCE_END_PRINT [CONFIRM=1]
# -------------------------------------------------------------------------------------
[gcode_macro FORCE_END_PRINT]
description: Emergency: ALWAYS ends the print cleanly - even from a wedged state (CONFIRM=1)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set st  = printer.print_stats.state %}
    {% set live = st in ['printing','paused'] and s.mode in ['printing','paused','filament','waiting'] %}
    {% if params.CONFIRM|default(0)|int == 1 or not live %}
        RESPOND MSG="FORCE END PRINT: stopping everything and returning to idle"
        M117 Force end...
        _SOUND_LIB NAME=r2_sad
        {% if st in ['printing','paused'] %}
            # real (or wedged) file activity: stop the reader, then cancel cleanly
            M25
            CANCEL_PRINT_BASE
        {% endif %}
        TURN_OFF_HEATERS
        M107
        M99106 S0
        CLEAR_PAUSE
        {% if 'filament_sensor' in printer %}
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
        {% endif %}
        {% if 'filament_motion_sensor encoder_sensor' in printer %}
            SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
        {% endif %}
        # full per-print cleanup (settings/material/mesh are kept) + mode reset
        _PRINT_CLEANUP
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=False
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=stop_at_layer VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
        _RESTORE_IDLE_TIMEOUT
        SET_LED_STATE STATE=idle
        M117 Idle - ready
        RESPOND MSG="FORCE END done: heaters off, state clean - the printer is idle and ready"
    {% else %}
        NOTIFY TEXT="A print is live! Press FORCE_END_PRINT again (or CONFIRM=1) to end it NOW" LEVEL=warn SOUND=r2_alarm
    {% endif %}


# =====================================================================================
#  R93: FILE CHECK - version census over every g-code file (LCD System + console)
#  Scans tag versions (current / old / untouched / plotter); RETAG=1 additionally
#  upgrades old+untouched files: .r2bak backup first, never while printing.
#  SSH one-liner (no Klipper needed):
#    python3 tools/r2_postproc.py --file-check ~/printer_data/gcodes
# =====================================================================================
[gcode_macro FILE_CHECK]
description: Scan all g-code files for tag version + upgrade state (R93); RETAG=1 upgrades old files (2-press / CONFIRM=1)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set retag = params.RETAG|default(0)|int == 1 %}
    {% if not retag %}
        SAVE_VARIABLE VARIABLE=file_check_retag VALUE=0
        _PACE
        SAVE_VARIABLE VARIABLE=file_check_nonce VALUE={printer['save_variables'].variables.file_check_nonce|default(0) + 1}
        RESPOND MSG="File check: scanning every g-code file - the console lists each one (current / old / untouched / plotter)"
    {% elif (params.CONFIRM is defined and params.CONFIRM|int == 1) or s.fc_armed %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fc_armed VALUE=False
        SAVE_VARIABLE VARIABLE=file_check_retag VALUE=1
        _PACE
        SAVE_VARIABLE VARIABLE=file_check_nonce VALUE={printer['save_variables'].variables.file_check_nonce|default(0) + 1}
        RESPOND MSG="File check + RETAG: old and untouched files get a .r2bak backup, then the current markers - never while printing"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fc_armed VALUE=True
        NOTIFY TEXT="Retag: press again (or CONFIRM=1) - old files are rewritten, backup .r2bak first" LEVEL=warn SOUND=r2_notice
    {% endif %}

# =====================================================================================
#  SDNAV - SD Card browser navigation (.115 / R154)
#  The LCD 'SD Card' menu shows ONE page of 20 entries (sd_view - folders
#  marked 'D:', files 'F:'). These macros navigate (sd_path/sd_page) and
#  ALWAYS rebuild the view for the menu. NOTE: jinja {% %} blocks emit a
#  stray '}' line with Klipper's single-brace environment - harmless here,
#  an empty g-code line is ignored (and every R2 macro works that way).
# =====================================================================================
[gcode_macro SDNAV_GO]
description: SD Card browser: open folder / start file at INDEX (internal, .115)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set view = sv.sd_view|default([]) %}
    {% set ix = [params.INDEX|default(0)|int, 0]|max %}
    {% if ix >= view|length %}
        RESPOND MSG="SD browser: slot is empty - page {sv.sd_page|default(0)|int + 1} shows {view|length} entries"
    {% else %}
        {% set e = view[ix] %}
        {% if e[:2] == 'D:' %}
            {% set path = sv.sd_path|default('')|string %}
            {% set newpath = (path ~ '/' ~ e[2:]) if path else e[2:] %}
            {% set tree = sv.sd_tree|default(dict()) %}
            {% set en = tree[newpath]|default([]) %}
            {% set parts = [] %}
            {% for item in en[0:20] %}{% set _ = parts.append("'" ~ item ~ "'") %}{% endfor %}
            SAVE_VARIABLE VARIABLE=sd_path VALUE="\"{ newpath }\""
            SAVE_VARIABLE VARIABLE=sd_page VALUE=0
            SAVE_VARIABLE VARIABLE=sd_view VALUE="[{ parts|join(',') }]"
            RESPOND MSG="SD browser: { newpath }/ - { en|length } entries (folders first, then files alphabetically)"
        {% else %}
            {% set path = sv.sd_path|default('')|string %}
            {% set fn = (path ~ '/' if path else '') ~ e[2:] %}
            RESPOND MSG="SD browser: starting { fn }"
            SDCARD_PRINT_FILE FILENAME="{ fn }"
        {% endif %}
    {% endif %}

[gcode_macro SDNAV_UP]
description: SD Card browser: one folder up (internal, .115)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set path = sv.sd_path|default('')|string %}
    {% if path == '' %}
        RESPOND MSG="SD browser: already at the G-Codes root"
    {% else %}
        {% set up = path.rsplit('/', 1)[0] if '/' in path else '' %}
        {% set tree = sv.sd_tree|default(dict()) %}
        {% set en = tree[up]|default([]) %}
        {% set parts = [] %}
        {% for item in en[0:20] %}{% set _ = parts.append("'" ~ item ~ "'") %}{% endfor %}
        SAVE_VARIABLE VARIABLE=sd_path VALUE="\"{ up }\""
        SAVE_VARIABLE VARIABLE=sd_page VALUE=0
        SAVE_VARIABLE VARIABLE=sd_view VALUE="[{ parts|join(',') }]"
        RESPOND MSG="SD browser: up to /{ up if up else '' } (root)"
    {% endif %}

[gcode_macro SDNAV_PAGE]
description: SD Card browser: page +/- (DELTA=-1/1, internal, .115)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set tree = sv.sd_tree|default(dict()) %}
    {% set path = sv.sd_path|default('')|string %}
    {% set en = tree[path]|default([]) %}
    {% set page = sv.sd_page|default(0)|int %}
    {% set maxp = ((en|length - 1) // 20) if en|length else 0 %}
    {% set np = [page + params.DELTA|default(1)|int, 0]|max %}
    {% set np = [np, maxp]|min %}
    {% set parts = [] %}
    {% for item in en[np * 20:np * 20 + 20] %}{% set _ = parts.append("'" ~ item ~ "'") %}{% endfor %}
    SAVE_VARIABLE VARIABLE=sd_page VALUE={np}
    SAVE_VARIABLE VARIABLE=sd_view VALUE="[{ parts|join(',') }]"
    RESPOND MSG="SD browser: page {np + 1} of {maxp + 1} ({en|length} entries in /{path})"

[gcode_macro SDNAV_HOME]
description: SD Card browser: back to the G-Codes root (internal, .115)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set tree = sv.sd_tree|default(dict()) %}
    {% set en = tree['']|default([]) %}
    {% set parts = [] %}
    {% for item in en[0:20] %}{% set _ = parts.append("'" ~ item ~ "'") %}{% endfor %}
    SAVE_VARIABLE VARIABLE=sd_path VALUE="\"\""
    SAVE_VARIABLE VARIABLE=sd_page VALUE=0
    SAVE_VARIABLE VARIABLE=sd_view VALUE="[{ parts|join(',') }]"
    RESPOND MSG="SD browser: back at the G-Codes root"
