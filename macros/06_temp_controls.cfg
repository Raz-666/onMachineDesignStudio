# =====================================================================================
#  06_temp_controls.cfg - Temperature / fan / acceleration interception
#  -----------------------------------------------------------------------------------
#  WHY DO WE OVERRIDE M104/M109/M140/M190?
#  Old gcode files contain their own heating commands (e.g. "M104 S215" from layer 2).
#  To print them with DIFFERENT settings we intercept these commands:
#     - override ON  -> temperature is redirected to YOUR value
#     - override OFF -> command passes through 1:1 (the file rules)
#  You also get feedback for every heating phase (sound/LED/LCD/Mainsail).
#
#  This works even for LEGACY files that never call PRINT_START, because the
#  _STATE_WATCHER (01_state.cfg) flips the mode to 'printing' as soon as Klipper
#  reports an active print.
#
#  First layer vs. following layers:
#     - layers are counted via LAYER_MARK (slicer "layer change" gcode, see slicer/)
#     - very old files WITHOUT LAYER_MARK: we guess from the requested temperature
#       whether the file means the first-layer or the following-layers value.
# =====================================================================================

# -------------------------------------------------------------------------------------
# M104 - set hotend target (without waiting)
# -------------------------------------------------------------------------------------
[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set t  = params.S|default(-1)|float %}
    {% set neu = t %}                                  # default: unchanged
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and t >= 40 %}
        # which override side is meant?
        # STRICT layer mapping (no more 'which file temp is meant' guessing - that
        # misrouted mid-print M104s): layer 1 -> first value, layer >= 2 -> after.
        # R62: Orca lowers the temp at the END of layer 1 (M104 S215 BEFORE the
        # LAYER_MARK of layer 2!) - so 't below the file's own first-layer temp'
        # is ALSO 'later' even while the layer counter still says 1.
        # Only for legacy files WITHOUT any known file temps: a FALLING target
        # counts as 'later' (old fallback).
        {% set later = (s.layer >= 2) %}
        {% if s.layer < 2 %}
            {% if s.file_hotend_first > 0 %}
                {% set later = (t < s.file_hotend_first - 0.5) %}
            {% elif s.file_hotend_first == 0 and s.file_hotend_after == 0 %}
                {% set later = t < printer.extruder.target %}
            {% endif %}
        {% endif %}
        {% if later and sv.ov_hotend_after_on|default(False) %}
            {% set neu = sv.ov_hotend_after|default(0)|float %}
        {% elif not later and sv.ov_hotend_first_on|default(False) %}
            {% set neu = sv.ov_hotend_first|default(0)|float %}
        {% endif %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.ignore_overrides and t >= 40 %}
        # R79/R161: AS SLICED + first-layer rules ON -> the material preset
        # shapes LAYER 1 (first-layer rule). From layer 2 the file runs 1:1 -
        # its OWN M104 wins (the old code forced the material preset over
        # the file's explicit command). Exception: an armed user override
        # wins in 1:1 mode too (user rule: your L2 value always applies).
        {% set flr79 = false %}
        {% if s.layer >= 2 %}
            {% if sv.ov_hotend_after_on|default(False) and (sv.ov_hotend_after|float - t)|abs > 0.5 %}
                {% set neu = sv.ov_hotend_after|float %}
                {% set flr79 = true %}   # message already sent - no double OVERWRITE log
                RESPOND MSG="M104: {t|round|int}C -> YOUR L2 override -> {neu|round|int}C (AS SLICED, layer {s.layer})"
            {% endif %}
        {% elif sv.first_layer_rules|default(True) %}
            {% set db79 = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat79 = s.file_material|default('?')|string|upper %}
            {% if mat79 not in db79 %}{% set mat79 = sv.material|default('PLA')|string|upper %}{% endif %}
            {% if mat79 in db79 %}
                {% set later79 = (s.file_hotend_first > 0 and t < s.file_hotend_first - 0.5) %}
                {% set want79 = db79[mat79].hot2|float if later79 else db79[mat79].hot1|float %}
                {% if want79 > 0 and want79 != t %}
                    {% set neu = want79 %}
                    {% set flr79 = true %}
                    RESPOND MSG="M104: {t|round|int}C -> L1 rule {mat79}: {neu|round|int}C (AS SLICED, layer {s.layer})"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if neu != t and not flr79|default(false) %}
        RESPOND MSG="M104: {t|round|int}C -> OVERWRITE -> {neu|round|int}C (layer {s.layer})"
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # file's own hotend temp (R49; R50: RAW value - also during the identification
        # window after the universal intercept) - the AS LEGACY prep re-heats to it
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={t}
    {% endif %}
    # execute the original command with the (possibly replaced) temperature
    M99104 {% if 'T' in params %}T{params.T} {% endif %}{% if t >= 0 %}S{neu|round}{% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40 %}
        # R50: this file heats itself (whatever kind) - the movement-file probe
        # uses this to identify self-sufficient files
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=True
    {% endif %}
    {% if printer.print_stats.state == 'printing' and s.mode == 'printing' and s.start_pending in ['overrides','as_legacy'] and not s.legacy_armed %}
        # R72: M104 is NON-BLOCKING - a file may prime right after it. Only the
        # IMMEDIATE guard path (.54) when nothing armed the takeover yet; an armed
        # file (M190/M109/M140 came first) hands over at START_PRINT / the probe.
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        RESPOND MSG="[i] AS LEGACY: non-blocking heater + possible cold prime - takeover with guard"
        _LEGACY_PREP
    {% endif %}


# -------------------------------------------------------------------------------------
# M109 - heat hotend AND wait (with feedback before/after)
# -------------------------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set t  = params.S|default(-1)|float %}
    {% set neu = t %}
    # R48: NO background shortcut here (unlike M190). Files that rely on their
    # M109 to block would extrude COLD right after it otherwise (field log .31:
    # "Extrude below minimum temp"). The blocking wait is also the reliable
    # window in which the _STATE_WATCHER can land the start dialog.
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and t >= 40 %}
        {% set later = (s.layer >= 2) %}
        {% if s.layer < 2 %}
            {% if s.file_hotend_first > 0 %}
                {% set later = (t < s.file_hotend_first - 0.5) %}
            {% elif s.file_hotend_first == 0 and s.file_hotend_after == 0 %}
                {% set later = t < printer.extruder.target %}
            {% endif %}
        {% endif %}
        {% if later and sv.ov_hotend_after_on|default(False) %}
            {% set neu = sv.ov_hotend_after|default(0)|float %}
        {% elif not later and sv.ov_hotend_first_on|default(False) %}
            {% set neu = sv.ov_hotend_first|default(0)|float %}
        {% endif %}
        # R62: during the AS LEGACY takeover the prep pauses the file right after
        # this M109 anyway (mesh at anti-ooze standby, then re-heat to LAYER-1
        # temp for the purge) - waiting for the FULL target here only to cool
        # down right after was pure waiting time (field log .45). Cap the wait
        # at the preheat level; PREP2 brings the real layer-1 temp.
        {% set mint = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
        {% set cap = [sv.preheat_hotend|default(182)|float, mint + 5]|max %}
        {% if s.start_pending in ['overrides','as_legacy'] and neu > cap %}
            RESPOND MSG="M109: waiting only up to {cap|round|int}C preheat (takeover: mesh first, layer-1 temp at the purge - never below min_extrude_temp+5)"
            {% set neu = cap %}
        {% endif %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.ignore_overrides and t >= 40 %}
        # R79/R161: AS SLICED hotend (blocking) - same semantics as M104:
        # material preset shapes LAYER 1 only; from layer 2 the file runs 1:1,
        # an armed user override wins.
        {% if s.layer >= 2 %}
            {% if sv.ov_hotend_after_on|default(False) and (sv.ov_hotend_after|float - t)|abs > 0.5 %}
                {% set neu = sv.ov_hotend_after|float %}
                RESPOND MSG="M109: {t|round|int}C -> YOUR L2 override -> {neu|round|int}C (AS SLICED, layer {s.layer})"
            {% endif %}
        {% elif sv.first_layer_rules|default(True) %}
            {% set db79 = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat79 = s.file_material|default('?')|string|upper %}
            {% if mat79 not in db79 %}{% set mat79 = sv.material|default('PLA')|string|upper %}{% endif %}
            {% if mat79 in db79 %}
                {% set later79 = (s.file_hotend_first > 0 and t < s.file_hotend_first - 0.5) %}
                {% set want79 = db79[mat79].hot2|float if later79 else db79[mat79].hot1|float %}
                {% if want79 > 0 and want79 != t %}
                    {% set neu = want79 %}
                    RESPOND MSG="M109: {t|round|int}C -> L1 rule {mat79}: {neu|round|int}C (AS SLICED, layer {s.layer})"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if neu >= 40 %}
        {% if printer.print_stats.state == 'printing' and s.mode in ['idle','finished'] %}
            # legacy file before the start decision (R49): note the file's hotend
            # temp - the AS LEGACY prep re-heats to it after bed + mesh (anti-ooze)
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={neu}
        {% endif %}
        NOTIFY TEXT="Heating hotend to {neu|round|int}C..." LEVEL=info LED=heating SOUND=r2_heating
        M99109 {% if 'T' in params %}T{params.T} {% endif %}S{neu|round}
        NOTIFY TEXT="Hotend at temperature ({neu|round|int}C)" LEVEL=ok SOUND=r2_hot
    {% else %}
        M99109 {% if 'T' in params %}T{params.T} {% endif %}{% if t >= 0 %}S{neu|round}{% endif %}
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # file's own hotend temp (R49; R50: RAW value - also during the identification window)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_hotend_first VALUE={t}
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40 %}
        # R50: this file heats itself (whatever kind) - the movement-file probe
        # uses this to identify self-sufficient files
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=True
    {% endif %}
    {% if printer.print_stats.state == 'printing' and s.mode == 'printing' and s.start_pending in ['overrides','as_legacy'] %}
        # R72 FIELD FIX (log .55): taking over at the FIRST heater paused the file
        # BEFORE its own M109 could finish - everything afterwards ran at the 170C
        # standby (= min_extrude_temp!) -> 'Extrude below minimum temp' x5, error
        # state, re-armed start dialog. ARM instead: the file heats + primes ITSELF
        # (hot!), the takeover lands at its START_PRINT - or, if none comes, the
        # _START_NET_PROBE takes over (its PAUSE waits for the running M109 line
        # to finish -> the pause always lands HOT, never at the standby).
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=True
        RESPOND MSG="[i] AS LEGACY: file detected - it heats itself - takeover at its START_PRINT / via probe"
    {% endif %}


# -------------------------------------------------------------------------------------
# M140 - set bed target
# -------------------------------------------------------------------------------------
[gcode_macro M140]
rename_existing: M99140
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set t  = params.S|default(-1)|float %}
    {% set neu = t %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and t >= 40 %}
        {% set later = (s.layer >= 2) %}
        {% if s.layer < 2 and s.file_bed == 0 and s.file_bed_after == 0 %}
            {% set later = t < printer.heater_bed.target %}
        {% endif %}
        {% if later and sv.ov_bed_after_on|default(False) %}
            {% set neu = sv.ov_bed_after|default(0)|float %}
        {% elif not later and sv.ov_bed_on|default(False) %}
            {% set neu = sv.ov_bed|default(0)|float %}
        {% endif %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.ignore_overrides and t >= 40 %}
        # R79/R161: AS SLICED bed - see M104 (material shapes layer 1; from
        # layer 2 the file's own M140 runs 1:1, an armed user override wins)
        {% set flr79 = false %}
        {% if s.layer >= 2 %}
            {% if sv.ov_bed_after_on|default(False) and (sv.ov_bed_after|float - t)|abs > 0.5 %}
                {% set neu = sv.ov_bed_after|float %}
                {% set flr79 = true %}   # message already sent - no double OVERWRITE log
                RESPOND MSG="M140: {t|round|int}C -> YOUR L2 override -> {neu|round|int}C (AS SLICED, layer {s.layer})"
            {% endif %}
        {% elif sv.first_layer_rules|default(True) %}
            {% set db79 = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat79 = s.file_material|default('?')|string|upper %}
            {% if mat79 not in db79 %}{% set mat79 = sv.material|default('PLA')|string|upper %}{% endif %}
            {% if mat79 in db79 %}
                {% set later79 = (s.file_bed > 0 and t < s.file_bed - 0.5) %}
                {% set want79 = db79[mat79].bed2|float if later79 else db79[mat79].bed1|float %}
                {% if want79 > 0 and want79 != t %}
                    {% set neu = want79 %}
                    {% set flr79 = true %}
                    RESPOND MSG="M140: {t|round|int}C -> L1 rule {mat79}: {neu|round|int}C (AS SLICED, layer {s.layer})"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if neu != t and not flr79|default(false) %}
        RESPOND MSG="M140: {t|round|int}C -> OVERWRITE -> {neu|round|int}C"
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R50: the file's own bed target (RAW, for display + fallback)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={t}
    {% endif %}
    M99140 S{neu|round}
    {% if printer.print_stats.state == 'printing' and t >= 40 %}
        # R50: this file heats itself (whatever kind) - the movement-file probe
        # uses this to identify self-sufficient files
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=True
    {% endif %}
    {% if printer.print_stats.state == 'printing' and s.mode == 'printing' and s.start_pending in ['overrides','as_legacy'] %}
        # R72 FIELD FIX (log .55): taking over at the FIRST heater paused the file
        # BEFORE its own M109 could finish - everything afterwards ran at the 170C
        # standby (= min_extrude_temp!) -> 'Extrude below minimum temp' x5, error
        # state, re-armed start dialog. ARM instead: the file heats + primes ITSELF
        # (hot!), the takeover lands at its START_PRINT - or, if none comes, the
        # _START_NET_PROBE takes over (its PAUSE waits for the running M109 line
        # to finish -> the pause always lands HOT, never at the standby).
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=True
        RESPOND MSG="[i] AS LEGACY: file detected - it heats itself - takeover at its START_PRINT / via probe"
    {% endif %}


# -------------------------------------------------------------------------------------
# M190 - heat bed AND wait (with feedback)
# -------------------------------------------------------------------------------------
[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set t  = params.S|default(-1)|float %}
    {% set neu = t %}
    # R47: a print is RUNNING but our mode is still idle/finished -> this is a
    # LEGACY file whose dialog is about to appear (watcher, ~1-2s). Do NOT block
    # here for minutes: set the bed target in the background and let the pause
    # land right after this macro - the question appears within SECONDS instead
    # of after the bed has fully heated. (Harmless for marked files that heat
    # before PRINT_START: their own sequence heats + waits properly anyway.)
    {% set early_leg = printer.print_stats.state == 'printing' and s.mode in ['idle','finished'] %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and t >= 40 %}
        {% set later = (s.layer >= 2) %}
        {% if s.layer < 2 and s.file_bed == 0 and s.file_bed_after == 0 %}
            {% set later = t < printer.heater_bed.target %}
        {% endif %}
        {% if later and sv.ov_bed_after_on|default(False) %}
            {% set neu = sv.ov_bed_after|default(0)|float %}
        {% elif not later and sv.ov_bed_on|default(False) %}
            {% set neu = sv.ov_bed|default(0)|float %}
        {% endif %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.ignore_overrides and t >= 40 %}
        # R79/R161: AS SLICED bed (blocking) - same semantics as M140:
        # material preset shapes LAYER 1 only; from layer 2 the file runs 1:1,
        # an armed user override wins.
        {% if s.layer >= 2 %}
            {% if sv.ov_bed_after_on|default(False) and (sv.ov_bed_after|float - t)|abs > 0.5 %}
                {% set neu = sv.ov_bed_after|float %}
                RESPOND MSG="M190: {t|round|int}C -> YOUR L2 override -> {neu|round|int}C (AS SLICED, layer {s.layer})"
            {% endif %}
        {% elif sv.first_layer_rules|default(True) %}
            {% set db79 = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat79 = s.file_material|default('?')|string|upper %}
            {% if mat79 not in db79 %}{% set mat79 = sv.material|default('PLA')|string|upper %}{% endif %}
            {% if mat79 in db79 %}
                {% set later79 = (s.file_bed > 0 and t < s.file_bed - 0.5) %}
                {% set want79 = db79[mat79].bed2|float if later79 else db79[mat79].bed1|float %}
                {% if want79 > 0 and want79 != t %}
                    {% set neu = want79 %}
                    RESPOND MSG="M190: {t|round|int}C -> L1 rule {mat79}: {neu|round|int}C (AS SLICED, layer {s.layer})"
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R50: the file's own bed target (RAW - replaces the R49 early-leg capture,
        # which never fires now that the universal intercept holds the mode)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_bed VALUE={t}
    {% endif %}
    {% if neu >= 40 %}
        {% if early_leg %}
            M99140 S{neu|round}
            RESPOND MSG="[i] Bed preheats to {neu|round|int}C in the background - start decision pending"
        {% else %}
            NOTIFY TEXT="Heating bed to {neu|round|int}C..." LEVEL=info LED=heating SOUND=r2_heating
            M99190 S{neu|round}
            NOTIFY TEXT="Bed at temperature ({neu|round|int}C)" LEVEL=ok SOUND=r2_hot
        {% endif %}
    {% else %}
        M99190 S{neu|round}
    {% endif %}
    {% if printer.print_stats.state == 'printing' and t >= 40 %}
        # R50: this file heats itself (whatever kind) - the movement-file probe
        # uses this to identify self-sufficient files
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=True
    {% endif %}
    {% if printer.print_stats.state == 'printing' and s.mode == 'printing' and s.start_pending in ['overrides','as_legacy'] %}
        # R72 FIELD FIX (log .55): taking over at the FIRST heater paused the file
        # BEFORE its own M109 could finish - everything afterwards ran at the 170C
        # standby (= min_extrude_temp!) -> 'Extrude below minimum temp' x5, error
        # state, re-armed start dialog. ARM instead: the file heats + primes ITSELF
        # (hot!), the takeover lands at its START_PRINT - or, if none comes, the
        # _START_NET_PROBE takes over (its PAUSE waits for the running M109 line
        # to finish -> the pause always lands HOT, never at the standby).
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"legacy"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=True
        RESPOND MSG="[i] AS LEGACY: file detected - it heats itself - takeover at its START_PRINT / via probe"
    {% endif %}


# -------------------------------------------------------------------------------------
# M106 / part cooling fan - the R175c priority chain, one glance:
#   LIVE % (your absolute value, beats everything incl. layer 1)
#   > layer-1 hold (first layer = fan OFF, adhesion)
#   > HOLD % (replaces the file value)
#   > SCALE (x file value) > CLAMP (min/max, bridge boost)
# Every step that CHANGES something says so - the field log .130 complaint
# was 'full power needs hold 100 + clamp off + fan 150' - now one value does it.
# -------------------------------------------------------------------------------------
[gcode_macro M106]
rename_existing: M99106
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set spd = params.S|default(255)|int %}
    {% if printer.print_stats.state == 'printing' and spd > 0
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R50: the file's own fan value (display + 'file rules' reference)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_fan VALUE={spd}
    {% endif %}
    {% if spd > 0 %}
        {% set held = 0 %}
        # R62: Orca raises the fan at the END of layer 1 (M106 BEFORE the
        # LAYER_MARK of layer 2). With the layer counter still at 1 the fan
        # must stay OFF - first layer = no fan, exactly like a marked file.
        # (AS SLICED / no overrides active: untouched, true 1:1.)
        {% if s.mode in ['printing','paused'] and s.layer < 2
              and (not s.ignore_overrides or s.fova_flr|default(True)) %}
            {% set held = 1 %}
        {% endif %}
        {% if s.f_fan_live_on|default(False) and s.f_fan_live|default(0)|float > 0 %}
            # R175c (.130): LIVE - your absolute %. Replaces scale, hold,
            # clamp AND the layer-1 rule: you turned the dial, you get it.
            {% set live = (s.f_fan_live|float * 255 / 100)|round|int %}
            {% if live > 255 %}{% set live = 255 %}{% endif %}
            {% if live != spd %}
                RESPOND MSG="M106: S{spd} -> LIVE {s.f_fan_live|float|round|int}% -> S{live} (your absolute value - hold/scale/clamp skipped)"
            {% endif %}
            M99106 S{live}
        {% elif held %}
            RESPOND MSG="M106: S{spd} held at 0 - layer 1 = fan OFF (layer 2 gets S{spd} back)"
            M99106 S0
        {% else %}
            {% if s.f_fan_hold|default(0)|float > 0 %}
                # R115 (.87 field log): FAN HOLD - your % REPLACES the file's value.
                # Dynamic slicer fan curves kept coming through the scale factor
                # ('the file value always wins') - hold wins over scale AND clamp
                # (you command the fan), only the layer-1 rule above still beats it.
                {% set scaled = (s.f_fan_hold|float * 255 / 100)|round|int %}
                {% if scaled > 255 %}{% set scaled = 255 %}{% endif %}
                {% if scaled != spd %}
                    RESPOND MSG="M106: S{spd} -> hold {s.f_fan_hold|float|round|int}% -> S{scaled} (file value ignored, 0 = file rules again)"
                {% endif %}
            {% else %}
            {% set scaled = (spd * s.f_fan_scale)|round|int %}
            {% if scaled > 255 %}{% set scaled = 255 %}{% endif %}
            # R111: fan CLAMP (min/max %) + bridge boost - the honest cooling
            # curve override. min never fights the layer-1 hold above, max
            # caps even a file that wants S255, bridge lifts the fan over
            # everything while a bridge section prints.
            {% if s.fova_fan_clamp_on|default(False) %}
                {% set fmin = (s.fova_fan_min|default(0)|float * 255 / 100)|round|int %}
                {% set fmax = (s.fova_fan_max|default(100)|float * 255 / 100)|round|int %}
                {% if fmax > 255 %}{% set fmax = 255 %}{% endif %}
                {% if scaled < fmin %}{% set scaled = fmin %}{% endif %}
                {% if scaled > fmax %}{% set scaled = fmax %}{% endif %}
                {% if s.fova_fan_bridge|default(0)|float > 0 and s.current_type|default('')|upper == 'BRIDGE' %}
                    {% set fbr = (s.fova_fan_bridge|float * 255 / 100)|round|int %}
                    {% if scaled < fbr %}{% set scaled = fbr %}{% endif %}
                {% endif %}
                {% if scaled != (spd * s.f_fan_scale)|round|int %}
                    {% set brnote = (' bridge ' ~ s.fova_fan_bridge|float|round|int ~ '%') if (s.fova_fan_bridge|default(0)|float > 0 and s.current_type|default('')|upper == 'BRIDGE') else '' %}
                    RESPOND MSG="M106: S{spd} -> clamp {s.fova_fan_min|default(0)|float|round|int}-{s.fova_fan_max|default(100)|float|round|int}%{brnote} -> S{scaled}"
                {% endif %}
            {% endif %}
            {% if scaled != spd %}
                RESPOND MSG="M106: S{spd} -> scale {s.f_fan_scale*100|round|int}% -> S{scaled}"
            {% endif %}
            {% endif %}
            M99106 S{scaled}
        {% endif %}
    {% else %}
        M99106 S0
    {% endif %}

# -------------------------------------------------------------------------------------
# _ACCEL_SET - R167: the ONE place that sends a raw M204 + keeps the interceptor's
# value tracker honest (m204_last). The M204 interceptor swallows a file's M204
# when the value is already active - every direct M99204 sender MUST go through
# here or the tracker goes stale and the next file M204 gets swallowed wrongly.
#
# R240 (.136ai field log - THE START BLOCKER): this macro was born as _M204_SET
# and was UNPARSEABLE by klipper for its whole life. The dispatcher tokenizer
# (klippy/gcode.py) builds command names from [A-Z_] ONLY - digits END the name.
# '_M204_SET VALUE=8000' therefore arrives as cmd '_M204' with rawparams
# '_SET VALUE=8000'; shlex then meets the '='-less token '_SET' and raises
# 'Malformed command' - a FATAL error (gcode:command_error) that killed every
# print start right after the prime-line message, echoed once per macro
# nesting level (6x in the field log). Before R237 the line only produced a
# harmless 'Unknown command: _M204' (the macro name never matched); the R237
# _M204 alias finally DISPATCHED it - and turned the sleeping bug fatal.
# Fix: ziffernfreier Name (_ACCEL_SET), alias removed, postproc rewrites
# legacy '_M204_SET VALUE=x' lines to M204 while touching files anyway.
[gcode_macro _ACCEL_SET]
description: Set move accel + update the M204 tracker (internal, R167)
gcode:
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={params.VALUE|default(0)|float}
    M99204 S{params.VALUE|default(0)|float|round}

# -------------------------------------------------------------------------------------
# M204 - acceleration: if the CURRENT feature has its own acceleration set
# (e.g. outer wall), the file's value is IGNORED (ours wins).
# -------------------------------------------------------------------------------------
[gcode_macro M204]
rename_existing: M99204
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% if printer.print_stats.state == 'printing' and params.S|default(0)|float > 0
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R51: the file's own acceleration (display + 'file rules' reference)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_accel VALUE={params.S|float}
    {% endif %}
    # R58: per-feature accel is BACK (markers now come from the post-processor,
    # so they exist in every file): when the CURRENT feature has its own accel
    # override ON, the file's M204 value is replaced by YOURS. Global override
    # ON without a feature value -> your global accel. Otherwise 1:1.
    # R167 (.125 field log - the Timer-too-close chain): generated files send
    # thousands of M204s (print/travel image). Every one of them rendered this
    # template AND read printer['save_variables'].variables - a full deepcopy
    # of the whole variable set INCLUDING the huge sd_tree, several times per
    # second over hours = permanent GC pressure on the Pi Zero. New structure:
    #   1. only the small _STATE is read on the hot path; save_variables is
    #      read ONLY when an override could actually apply
    #   2. live_accel is a CAP now (min of file value and cap), not a
    #      replacement - it used to RAISE a file's S1500 print accel to the
    #      cap value (S1500 -> S6000 in the field log = wrong direction)
    #   3. a value that already IS active is not re-sent and not re-echoed
    #      (the file's M204 is simply swallowed) - the echo flood is gone
    {% set s204 = printer['gcode_macro _STATE'] %}
    {% set _cand204 = params.S|default(0)|float %}
    {% set _src204 = '' %}
    {% if s204.mode in ['printing','paused'] and not s204.ignore_overrides
          and params.S is defined and params.S|float > 0 %}
        {% if s204.feat_acc_active|default(0)|float > 0 %}
            {% set _cand204 = s204.feat_acc_active|float %}
            {% set _src204 = 'FEATURE' %}
        {% elif s204.ovl_acc_on|default(False) and s204.ovl_acc|default(0)|float > 0 %}
            {% set _cand204 = s204.ovl_acc|float %}
            {% set _src204 = 'GLOBAL' %}
        {% endif %}
        {% if s204.live_accel|default(0)|float > 0 and _cand204 > s204.live_accel|float %}
            {% set _cand204 = s204.live_accel|float %}
            {% set _src204 = 'cap' %}
        {% endif %}
    {% endif %}
    {% if params.S is defined and _cand204 != s204.m204_last|default(-1)|float %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={_cand204}
        M99204 S{_cand204|round}
        {% if _src204 != '' and _cand204 != params.S|float %}
            RESPOND MSG="M204: S{params.S|float|round} -> {_src204} -> S{_cand204|round}"
        {% endif %}
    {% endif %}
[gcode_macro LAYER_MARK]
description: Layer-change marker (called from slicer layer-change gcode)
gcode:
    # R182 safety net: refresh the override mirrors once per layer - any
    # writer the setters do not cover (raw console SAVE_VARIABLE) is at
    # most one layer stale. Cheap: ONE save_variables read per layer
    # instead of one per APPLY_TYPE/M106.
    _SYNC_OV_FEAT
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    # R56: markers ALWAYS count - marked files keep them in AS LEGACY too (.38
    # regression fix), and the post-processor injects them into legacy files.
    # Files without markers simply never call this - the Z tracker rules.
    {% if s.mode == 'printing' %}
        {% set n = s.layer + 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE={n}
        # this file HAS markers -> the watcher's Z-layer tracking stays out
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_marks VALUE=True
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={printer.gcode_move.gcode_position.z|round(3)}
        SET_PRINT_STATS_INFO CURRENT_LAYER={n}
        M117 Layer {n}{% if s.total_layers > 0 %}/{s.total_layers}{% endif %} | {printer['gcode_macro _STATE'].current_type}
        # ---- temperature tower (R41): band temp per layer, both file kinds ----------
        {% if sv.tt_active|default(False) %}
            {% set idx = ((n - 1) / sv.tt_band|default(10))|int %}
            {% set tt = [sv.tt_start + idx * sv.tt_step, sv.tt_end]|min %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tt|round}
            RESPOND MSG="Temp tower: layer {n} -> {tt|round|int}C"
        {% endif %}

        # ---- layer 2: switch to the 'after layer 1' overrides ---------------------------
        # (files do not always contain their own M104/M140 here - we do it ourselves)
        {% if n == 2 %}
            # first-layer speed limit ends here (independent of temp overrides).
            # R73: a live speed the user set during layer 1 KEEPS leading -
            # the reset to 100% only runs when nobody took over.
            {% if s.l1_speed_user|default(False) %}
                M220 S{s.g_speed_clean|default(100)|float|round}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=l1_speed_user VALUE=False
                RESPOND MSG="Layer 2: YOUR live speed {s.g_speed_clean|default(100)|float|round|int}% stays"
            {% elif sv.first_layer_speed|default(75)|float > 0 %}
                M220 S100
                RESPOND MSG="Layer 2: speed back to 100%"
            {% endif %}
            # material fan value applies from layer 2 (LCD: Material > Fan L2)
            {% if sv.ov_fan_on|default(False) %}
                SET_FAN_SCALE PERCENT={sv.ov_fan|default(100)|float|round}
                RESPOND MSG="Layer 2: fan scale {sv.ov_fan|default(100)|float|round|int}% (material)"
            {% endif %}
        {% endif %}
        {% if n == 2 %}
            # R161 (.121 field audit): ONE unified layer-2 rule, BOTH start
            # modes: user override > file value > material preset. The old
            # code only wrote temps with an ARMED override (AS LEGACY) or the
            # material preset (AS SLICED) - generated and range files carry
            # no M104/M140 of their own, so their layer 2 NEVER switched
            # (field log: bed/hotend stayed at the layer-1 value), and an
            # AS SLICED user override was silently ignored.
            {% set db161 = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat161 = s.file_material|default('?')|string|upper %}
            {% if mat161 not in db161 %}{% set mat161 = sv.material|default('PLA')|string|upper %}{% endif %}
            {% set h2use = 'your override' if sv.ov_hotend_after_on|default(False)
                           else 'file value' if s.file_hotend_after|float > 0
                           else 'material ' ~ mat161 %}
            {% set b2use = 'your override' if sv.ov_bed_after_on|default(False)
                           else 'file value' if s.file_bed_after|float > 0
                           else 'material ' ~ mat161 %}
            {% set h2 = sv.ov_hotend_after|default(0)|float if sv.ov_hotend_after_on|default(False)
                        else (s.file_hotend_after|float if s.file_hotend_after|float > 0
                              else (db161[mat161].hot2|float
                                    if (mat161 in db161 and sv.first_layer_rules|default(True)) else 0)) %}
            {% set b2 = sv.ov_bed_after|default(0)|float if sv.ov_bed_after_on|default(False)
                        else (s.file_bed_after|float if s.file_bed_after|float > 0
                              else (db161[mat161].bed2|float
                                    if (mat161 in db161 and sv.first_layer_rules|default(True)) else 0)) %}
            {% if h2 > 0 and (h2 - printer.extruder.target|float)|abs > 0.5 %}
                SET_HEATER_TEMPERATURE HEATER=extruder TARGET={h2|round}
                RESPOND MSG="Layer 2: hotend -> {h2|round(0)}C ({h2use})"
            {% endif %}
            {% if b2 > 0 and (b2 - printer.heater_bed.target|float)|abs > 0.5 %}
                SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={b2|round}
                RESPOND MSG="Layer 2: bed -> {b2|round(0)}C ({b2use})"
            {% endif %}
        {% endif %}
        {% if n == 2 and s.file_fan|default(0)|float > 0 and printer.fan.speed|default(0)|float <= 0 %}
            # R79: the file's layer-1 fan command was held at 0 - give it back at
            # layer 2 (the M106 interceptor applies the fan scale where active)
            M106 S{s.file_fan|float|round|int}
            RESPOND MSG="Layer 2: fan back on (file value S{s.file_fan|float|round|int})"
        {% endif %}
        # ---- requested pause at this layer boundary? ----------------------------------
        {% if sv.pause_next_layer|default(False) %}
            SAVE_VARIABLE VARIABLE=pause_next_layer VALUE=False
            PAUSE REASON="{s.pause_planned_reason|default('next layer')} (layer {n})"
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_planned_reason VALUE='""'
        {% elif sv.pause_at_layer|default(0)|int == n and n > 1 %}
            SAVE_VARIABLE VARIABLE=pause_at_layer VALUE=0
            PAUSE REASON="layer {n} (planned)"
        {% endif %}
        # R61: planned end at layer N (STOP, not pause - the print finishes normally)
        {% if s.stop_at_layer|default(0)|int > 0 and n >= s.stop_at_layer|default(0)|int %}
            _END_AT_LAYER LAYER={n}
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
#  R61 STOP AT LAYER - planned NORMAL end at layer N (not a pause): the print gets
#  CANCEL_PRINT_BASE'd at the layer boundary and then runs the full PRINT_END
#  choreography (stats, fanfare, LED, cooldown) as if the file had ended there.
#  LCD: Pre-Print > Range/Stop + Live > Pause & Control. 0 = off (default).
# -------------------------------------------------------------------------------------
[gcode_macro SET_STOP_AT_LAYER]
description: Stop the print NORMALLY when layer N begins (0 = off)
gcode:
    {% set n = params.LAYER|default(0)|int %}
    {% set s = printer['gcode_macro _STATE'] %}
    {% if n < 0 or n > 9999 %}
        RESPOND MSG="Stop at layer: LAYER must be 0..9999 (got {n})"
    {% elif n == 0 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=stop_at_layer VALUE=0
        RESPOND MSG="Stop at layer: OFF"
        M117 StopAt: off
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=stop_at_layer VALUE={n}
        RESPOND MSG="Stop at layer: print ends NORMALLY when layer {n} begins (0/set again = off)"
        M117 StopAt: layer {n}
    {% endif %}

[gcode_macro _END_AT_LAYER]
description: Planned end at layer N (internal): stop the file + normal end choreography
gcode:
    {% set n = params.LAYER|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=stop_at_layer VALUE=0
    RESPOND MSG="Stop at layer {n}: planned end - finishing like a completed print"
    M117 Done at layer {n}
    CANCEL_PRINT_BASE
    PRINT_END

# ---- M220 interceptor: keep the first-layer brake alive -----------------------------
# Many legacy files send their own 'M220 S100' in the start preamble - that used to
# kill the L1 speed limit right away (L1 speed only worked from the 2nd object on).
# While layer 1 is running we cap the file's speed factor at first_layer_speed%;
# from layer 2 (and for 'as sliced' starts) the file value passes 1:1.
[gcode_macro _SPEED_COMBINED]
description: apply the effective speed factor - clean global x the CURRENT feature override (R87.2, internal)
gcode:
    # R87.2 FIELD FIX (.71 log: feature at 200%, raising the global 100->150
    # made the print SLOWER): SET_GLOBAL_SPEED / file M220 used to write the
    # raw factor and thereby WIPED the active feature override - the speed
    # dropped instead of rising. The global is the BASE, a feature rides ON
    # TOP of it (same math as APPLY_TYPE) - and a global change now re-applies
    # the current feature immediately instead of waiting for the next ;TYPE:.
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set clean = s.g_speed_clean|default(100)|float %}
    {% set eff = clean %}
    {% set f = '' %}
    {% set spd = 100 %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides %}
        {% set c = s.current_type|default('')|string|replace('-','')|lower %}
        {% if c in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','c1','c2','c3','c4','c5','c6','c7','c8','c9']
              and sv['ovf_' ~ c ~ '_on']|default(False)
              and c|upper not in s.absent_features|default([]) %}
            {% set spd = sv['ovf_' ~ c ~ '_spd']|default(100)|float %}
            {% set eff = clean * spd / 100 %}
            {% set f = c %}
        {% endif %}
    {% endif %}
    M99220 S{eff|round}
    {% if f != '' %}
        RESPOND MSG="[live] {f}: {spd|round|int}% x global {clean|round|int}% = {eff|round|int}% (the feature stays on top of the global)"
    {% endif %}

[gcode_macro M220]
rename_existing: M99220
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set want = params.S|default(100)|float %}
    {% if printer.print_stats.state == 'printing' and want != 100
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R51: the file's own speed factor (display + 'file rules' reference)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_speed VALUE={want}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.layer < 2 and not s.ignore_overrides
          and not s.l1_speed_user|default(False)
          and sv.first_layer_speed|default(75)|float > 0
          and want > sv.first_layer_speed|default(75)|float %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=g_speed_clean VALUE={sv.first_layer_speed|default(75)|float|round}
        RESPOND MSG="M220 S{want|round|int}% capped to {sv.first_layer_speed|default(75)|float|round|int}% (layer 1)"
        _SPEED_COMBINED
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=g_speed_clean VALUE={want|round}
        _SPEED_COMBINED
    {% endif %}

# -------------------------------------------------------------------------------------
# M221 - flow factor from the file: captured (file value) and REDIRECTED to YOUR
# flow overwrite when it is ON (R50 - same pattern as M104/M140 temps).
# -------------------------------------------------------------------------------------
[gcode_macro M221]
rename_existing: M99221
description: Flow factor - captured from the file, redirected to YOUR flow when ON
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set f = params.S|default(100)|float %}
    {% if printer.print_stats.state == 'printing' and f != 100
          and (s.mode in ['idle','finished'] or s.start_pending != '') %}
        # R50: the file's own flow factor (display + 'file rules' reference)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_flow VALUE={f}
    {% endif %}
    {% set neu = f %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides
          and s.live_flow|default(0)|float > 0 %}
        # R73: the user set the flow LIVE - the pre-print override must not
        # redirect it away (field log .56: 'flow could not be changed')
        {% set neu = s.live_flow|float %}
    {% elif s.mode in ['printing','paused'] and not s.ignore_overrides and sv.ov_flow_on|default(False) %}
        {% set neu = sv.ov_flow|default(100)|float %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and s.layer|default(0)|int >= 2 and neu != f %}
        # R159 (.119) FIELD FIX: an M221 from layer 2 on is THE USER typing
        # (Klipper's stock Tune menu, console, Mainsail) - slicers state
        # their flow at the file top, never mid-print. It used to be pushed
        # back to the stored override ('flow could not be changed at all').
        # From layer 2 the user's value IS the live flow.
        {% set neu = f %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_flow VALUE={f|round}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE={f|round}
        RESPOND MSG="M221: S{f|round|int} - YOUR live flow (override paused for this print)"
    {% endif %}
    {% if neu != f %}
        RESPOND MSG="M221: S{f|round|int} -> OVERWRITE -> S{neu|round|int}"
    {% endif %}
    M99221 S{neu|round}

[gcode_macro PAUSE_NEXT_LAYER]
description: Gently pause at the NEXT layer boundary (REASON= optional, internal)
gcode:
    {% set reason = params.REASON|default('next layer')|string %}
    SAVE_VARIABLE VARIABLE=pause_next_layer VALUE=True
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_planned_reason VALUE='"{reason}"'
    NOTIFY TEXT="Will pause at next layer ({reason})" LEVEL=ok SOUND=r2_confirm

[gcode_macro PAUSE_AT_LAYER]
description: Gently pause at a given layer number (PAUSE_AT_LAYER LAYER=7)
gcode:
    {% set n = params.LAYER|default(0)|int %}
    {% if n > 1 %}
        SAVE_VARIABLE VARIABLE=pause_at_layer VALUE={n}
        NOTIFY TEXT="Will pause at layer {n}" LEVEL=ok SOUND=r2_confirm
    {% elif n == 1 %}
        NOTIFY TEXT="Layer 1 pause unsupported; previous setting unchanged; use layer 2 or later" LEVEL=warn SOUND=r2_notice
    {% else %}
        NOTIFY TEXT="PAUSE_AT_LAYER LAYER=<n> missing" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# Live temperature changes DURING a print (LCD/Mainsail):
# sets the new target immediately AND redirects later M104/M109 of the file to it.
# -------------------------------------------------------------------------------------
[gcode_macro SET_LIVE_HOTEND_TEMP]
description: Change hotend temp live (SET_LIVE_HOTEND_TEMP T=215)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set t = params.T|default(-1)|float %}
    {% if t < 100 %}
        # R72: T=0 arrived from an LCD quirk and printed 'Hotend stays 0C' -
        # anything below print temperatures is treated as a missing value
        NOTIFY TEXT="SET_LIVE_HOTEND_TEMP T=<temp> missing (100..300)" LEVEL=warn
    {% elif (t|round(0) - printer.extruder.target|float|round(0))|abs < 0.5 %}
        # SAME value as the current target: happens when an LCD input item is
        # opened (and confirmed unchanged) while browsing - do NOT touch the
        # overrides and do NOT log 'from now on' for it!
        RESPOND MSG="Hotend stays {t|round|int}C (unchanged)"
    {% else %}
        # from layer 2 on it changes the 'after' value; in layer 1 BOTH (the
        # print is at the first-layer value and continues with the after value)
        SAVE_VARIABLE VARIABLE=ov_hotend_first_on VALUE=True
        SAVE_VARIABLE VARIABLE=ov_hotend_first VALUE={t|round}
        {% if s.layer >= 2 %}
            SAVE_VARIABLE VARIABLE=ov_hotend_after VALUE={t|round}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t|round}
            NOTIFY TEXT="Hotend from now on: {t|round|int}C (from layer {s.layer})" LEVEL=ok SOUND=r2_confirm
        {% else %}
            SAVE_VARIABLE VARIABLE=ov_hotend_after_on VALUE=True
            SAVE_VARIABLE VARIABLE=ov_hotend_after VALUE={t|round}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t|round}
            NOTIFY TEXT="Hotend from now on: {t|round|int}C (layer 1 AND following)" LEVEL=ok SOUND=r2_confirm
        {% endif %}
    {% endif %}

[gcode_macro SET_LIVE_BED_TEMP]
description: Change bed temp live (SET_LIVE_BED_TEMP T=65)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set t = params.T|default(-1)|float %}
    {% if t < 0 %}
        NOTIFY TEXT="SET_LIVE_BED_TEMP T=<temp> missing" LEVEL=warn
    {% elif (t|round(0) - printer.heater_bed.target|float|round(0))|abs < 0.5 %}
        RESPOND MSG="Bed stays {t|round|int}C (unchanged)"
    {% else %}
        SAVE_VARIABLE VARIABLE=ov_bed_on VALUE=True
        SAVE_VARIABLE VARIABLE=ov_bed VALUE={t|round}
        {% if s.layer >= 2 %}
            SAVE_VARIABLE VARIABLE=ov_bed_after VALUE={t|round}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={t|round}
            NOTIFY TEXT="Bed from now on: {t|round|int}C (from layer {s.layer})" LEVEL=ok SOUND=r2_confirm
        {% else %}
            SAVE_VARIABLE VARIABLE=ov_bed_after_on VALUE=True
            SAVE_VARIABLE VARIABLE=ov_bed_after VALUE={t|round}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={t|round}
            NOTIFY TEXT="Bed from now on: {t|round|int}C (layer 1 AND following)" LEVEL=ok SOUND=r2_confirm
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V06_TEMPS]
description: Version sentinel of 06_temp_controls.cfg (internal)
gcode:
