# =====================================================================================
#  09_pause_filament.cfg - PAUSE / PARK / RESUME / CANCEL / filament change & runout
#  -----------------------------------------------------------------------------------
#  SAFETY FIRST - therefore:
#   - PAUSE lifts only as much Z as fits below Z-max (never rams into the frame)
#   - park corner is chosen AS FAR AWAY FROM THE PRINT OBJECTS as possible
#     (slicer object data - matters with multiple objects on the plate)
#   - small anti-ooze retract while parking -> no dripping onto the part
#   - filament sensor is DISABLED during pause (no false alarm while changing)
#     and re-enabled automatically on resume
#   - idle timeout is set to 'infinite' during pause (Klipper must NEVER turn off
#     heaters/motors on its own just because the printer waits!)
#   - RESUME returns safely: first XY at safe height, then Z slowly down
#   - CANCEL_PRINT needs TWO presses (nothing is destroyed by accident).
#     The FIRST press already pauses safely, the SECOND confirms the cancel.
#     RESUME disarms it again - so a mis-press can never abort a print.
# -------------------------------------------------------------------------------------
# _RESTORE_IDLE_TIMEOUT - internal helper: put the idle timeout back to its original
# value after pause / cancel / print end. Robust on every Klipper version:
#   1) the value PAUSE saved   2) live [idle_timeout] status   3) printer.cfg value
#   4) fallback 3600s
# -------------------------------------------------------------------------------------
[gcode_macro _RESTORE_IDLE_TIMEOUT]
description: Restore idle timeout after pause/cancel/print end (internal)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set ito = s.idle_timeout_saved|default(0)|float %}
    {% if ito <= 0 %}
        {% set live = printer.idle_timeout.idle_timeout|default(0)|float %}
        {% if live > 0 %}
            {% set ito = live %}
        {% else %}
            {% set cfgsec = printer.configfile.settings['idle_timeout']|default({}) %}
            {% set ito = cfgsec.timeout|default(3600)|float %}
        {% endif %}
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={ito|round|int}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=idle_timeout_saved VALUE={ito|round(1)}
# =====================================================================================

# -------------------------------------------------------------------------------------
# PAUSE - safe immediate pause with parking (this IS the "quick pause")
#   PAUSE REASON="..."   (REASON is display only)
# -------------------------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Safe pause: lift, park collision-free, sensor off, anti-ooze
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set reason = params.REASON|default('User') %}
    {% if s.mode == 'waiting' %}
        # start-dialog waiting state: just hold (nothing is hot, no parking needed)
        PAUSE_BASE
    {% elif s.mode in ['paused','filament'] %}
        # already paused - never park twice (that caused error spam + confusion)
        NOTIFY TEXT="Already paused ({s.pause_reason}) - RESUME to continue" LEVEL=warn SOUND=r2_notice
    {% elif s.mode in ['printing','starting'] or printer.print_stats.state == 'printing'
          or printer.virtual_sdcard.is_active %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"paused"'
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_reason VALUE='"{reason}"'
        # read the SD state BEFORE pausing (afterwards the file would already be stopped)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_was_sd VALUE={printer.virtual_sdcard.is_active}
        PAUSE_BASE                        # saves PAUSE_STATE + stops the file
        # memorize position before parking (return target)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_x VALUE={printer.gcode_move.gcode_position.x|round(3)}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_y VALUE={printer.gcode_move.gcode_position.y|round(3)}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_z VALUE={printer.gcode_move.gcode_position.z|round(3)}
        # re-anchor the Z high-water mark BEFORE the park lift: resuming inside low
        # layers must never register as a sequential 'next object' Z-fall
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE={printer.gcode_move.gcode_position.z|round(3)}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0
        _PARK_HEAD
        # filament sensor off (would alarm while changing), idle timeout 'infinite'
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
        {% if 'filament_motion_sensor encoder_sensor' in printer %}
            # SFS V2.0 encoder part (R52): off too - loading/purging with an open
            # filament path would false-alarm 'clog' (extruder moves, wheel doesn't)
            SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=sensor_was_on VALUE=True
        # save the current idle timeout - robust chain: live status value first,
        # then the printer.cfg value, then 3600s. NOTE: Klipper's status key is
        # 'idle_timeout' (NOT 'timeout' - reading .timeout crashes the macro!)
        {% set ito = printer.idle_timeout.idle_timeout|default(0)|float %}
        {% if ito <= 0 %}
            {% set cfgsec = printer.configfile.settings['idle_timeout']|default({}) %}
            {% set ito = cfgsec.timeout|default(3600)|float %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=idle_timeout_saved VALUE={ito|round(1)}
        # NOTE: Klipper REQUIRES timeout > 0 ("TIMEOUT must be above 0.0") -
        # 365 days is our 'infinite' (never times out during a pause)
        SET_IDLE_TIMEOUT TIMEOUT=31536000
        SET_LED_STATE STATE=paused
        _SOUND_LIB NAME=r2_pause
        NOTIFY TEXT="PAUSED: {reason} - RESUME to continue" LEVEL=warn
        # runout pause -> filament mode: RESUME then purges the old rest automatically
        {% if 'filament' in reason|default('')|string|lower %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"filament"'
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_next_armed_runout VALUE=False
            SET_LED_STATE STATE=filament
            _SOUND_LIB NAME=r2_filament
            M117 Filament out! Load -> RESUME
            RESPOND MSG=">>> Load new filament, then RESUME (purges automatically)"
        {% endif %}
    {% else %}
        NOTIFY TEXT="Nothing to pause (mode {s.mode})" LEVEL=warn SOUND=r2_notice
    {% endif %}

# quick pause = immediate safe pause (LCD "Pause NOW")
[gcode_macro QUICK_PAUSE]
description: Pause immediately (safe, with collision protection)
gcode:
    PAUSE REASON="quick pause"

# -------------------------------------------------------------------------------------
# _PARK_HEAD - lift + drive to a collision-free corner + anti-ooze retract
# -------------------------------------------------------------------------------------
[gcode_macro _PARK_HEAD]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set ha = printer.toolhead.homed_axes|lower %}
    # ---- 1) lift: only as much as fits below Z-max --------------------------------------
    {% set lift = 5.0 %}
    {% if pos.z + lift > zmax - 1 %}
        {% set lift = zmax - 1 - pos.z %}
        {% if lift < 0 %}{% set lift = 0 %}{% endif %}
        NOTIFY TEXT="Little Z headroom ({pos.z|round(0)}/{zmax}mm) - lifting only {lift|round(1)}mm" LEVEL=warn
    {% endif %}
    # ---- 2) choose park corner: maximum distance from the object area --------------------
    # R92: corners from the REAL bed ([r2_postproc] in printer.cfg, Ender-3
    # fallback 220x220) - the old hard-coded (222,225) lay beyond the plate
    {% set r2p = printer.configfile.settings.get('r2_postproc', {}) %}
    {% set bx0 = r2p.bed_min_x|default(0)|float %}{% set bx1 = r2p.bed_max_x|default(220)|float %}
    {% set by0 = r2p.bed_min_y|default(-3)|float %}{% set by1 = r2p.bed_max_y|default(217)|float %}
    {% set m = 10 %}   # clearance from the bed edge
    {% set px = bx0 + m %}{% set py = by1 - m %}   # default: back left
    {% if 'exclude_object' in printer and printer['exclude_object'].objects|length > 0 %}
        {% set ns = namespace(minx=9999, miny=9999, maxx=-9999, maxy=-9999) %}
        {% for o in printer['exclude_object'].objects %}
            {% for pt in o.polygon %}
                {% if pt[0] < ns.minx %}{% set ns.minx = pt[0] %}{% endif %}
                {% if pt[0] > ns.maxx %}{% set ns.maxx = pt[0] %}{% endif %}
                {% if pt[1] < ns.miny %}{% set ns.miny = pt[1] %}{% endif %}
                {% if pt[1] > ns.maxy %}{% set ns.maxy = pt[1] %}{% endif %}
            {% endfor %}
        {% endfor %}
        {% set cx = (ns.minx + ns.maxx) / 2 %}{% set cy = (ns.miny + ns.maxy) / 2 %}
        # rate four corners: largest Manhattan distance to the object center wins.
        # NOTE: {% set %} inside a for-loop is local to it -> namespace (Jinja scoping)
        {% set corners = [(bx0+m, by0+m), (bx1-m, by0+m), (bx0+m, by1-m), (bx1-m, by1-m)] %}
        {% set best = namespace(pos=(10,225), dist=-1) %}
        {% for c in corners %}
            {% set d = (c[0]-cx)|abs + (c[1]-cy)|abs %}
            {% if d > best.dist %}
                {% set best.dist = d %}
                {% set best.pos = c %}
            {% endif %}
        {% endfor %}
        {% set px = best.pos[0] %}{% set py = best.pos[1] %}
        RESPOND MSG="Park corner ({px},{py}) | objects X{ns.minx|round(0)}-{ns.maxx|round(0)} Y{ns.miny|round(0)}-{ns.maxy|round(0)}"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=park_x VALUE={px}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=park_y VALUE={py}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=park_lift VALUE={lift|round(2)}
    # ---- 3) move: first Z (if possible), then XY to the park corner -----------------------
    SAVE_GCODE_STATE NAME=PARK_MOVE
    G90
    {% if lift > 0.5 and 'z' in ha %}G1 Z{(pos.z + lift)|round(2)} F600{% endif %}
    {% if 'x' in ha and 'y' in ha %}
        G1 X{px} Y{py} F6000
    {% else %}
        RESPOND MSG="Park XY skipped - axes not homed yet (paused before the file homed)"
    {% endif %}
    # ---- 4) anti-ooze: small retract so nothing keeps oozing -------------------------------
    # ONLY when the hotend is hot! A cold extrude command is a HARD gcode error and
    # would abort the whole calling macro chain (that killed legacy prep once).
    # R72 FIELD FIX (log .55): 'hot' must be min_extrude_temp + 5, NOT >= 170 - the
    # 170C standby sat exactly ON the refusal line: the retract fired at 169.x and
    # killed the whole legacy-start chain ('Extrude below minimum temp' x5).
    {% set mintp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if printer.extruder.temperature >= mintp + 5 %}
        M83
        G1 E-3 F2100
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=park_retracted VALUE=True
    {% else %}
        RESPOND MSG="Park: hotend below {mintp + 5|round|int}C (min_extrude_temp+5) - skipping anti-ooze retract"
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=park_retracted VALUE=False
    {% endif %}
    RESTORE_GCODE_STATE NAME=PARK_MOVE

# -------------------------------------------------------------------------------------
# RESUME - continue (collision-free return) / in the start dialog = "print as sliced"
# -------------------------------------------------------------------------------------
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print: safe return, sensor on, disarm cancel
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # any armed cancel/skip is disarmed on resume (a mis-press can never abort)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_name VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_delete_armed VALUE='""'
    {% if s.mode == 'waiting' %}
        # Mainsail/LCD 'resume' while waiting means: print as sliced
        NOTIFY TEXT="Resume in dialog = print as sliced" LEVEL=info
        PRINT_AS_SLICED
    {% elif s.mode == 'filament' %}
        # during filament change: purge first, then continue
        CHANGE_FILAMENT_RESUME
    {% elif s.mode == 'paused' %}
        _RESUME_COMMON
    {% else %}
        RESUME_BASE
    {% endif %}

# -------------------------------------------------------------------------------------
# _RESUME_COMMON - return + continue the file (used by pause AND filament change)
# -------------------------------------------------------------------------------------
[gcode_macro _RESUME_COMMON]
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    # ---- 1) return: XY at safe height FIRST, refill the park retract ON THE WAY,
    #      THEN Z down slowly. Field log .73: the old E3+E0.8 fired AFTER the Z
    #      descent - seconds of slow extrusion straight INTO the resume position
    #      (a fat worm on the outer wall, vase mode ruin; after a filament change
    #      even worse: strip + manual purge had already settled the pressure).
    #      New rule: refill ONLY what the park retract took (tracked), while the
    #      nozzle is still high, ending net -0.5mm (dry arrival, the file's own
    #      first extrusion fills the rest). UNRETRACT=0 (filament change) pushes
    #      NOTHING at all - the purge strip already de-oozed.
    NOTIFY TEXT="Returning to print position..." LEVEL=info
    SAVE_GCODE_STATE NAME=RESUME_MOVE
    G90
    G1 X{s.pause_x} Y{s.pause_y} F6000
    {% set mintp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set unret = params.UNRETRACT|default(-1.0)|float %}
    {% if unret < 0 %}
        {% set unret = 3.0 if s.park_retracted|default(False) else 0.0 %}
    {% endif %}
    {% if unret > 0.01 and printer.extruder.temperature >= mintp + 5 %}
        M83
        G1 E{unret|round(2)} F2100
        G1 E-0.5 F300       # de-ooze: net -0.5 - no drip on the way down
        RESPOND MSG="Resume: {unret|round(1)}mm park retract refilled on the way, 0.5mm de-ooze held back"
    {% else %}
        RESPOND MSG="Resume: no extrusion at the print position (filament change settled / cold park)"
    {% endif %}
    G1 Z{s.pause_z} F300
    RESTORE_GCODE_STATE NAME=RESUME_MOVE
    # ---- 3) re-arm filament sensor + restore idle timeout ------------------------------------
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    {% if 'filament_motion_sensor encoder_sensor' in printer %}
        # SFS V2.0 encoder part (R52): back on - nothing re-enabled it before,
        # so the clog protection silently died after the first runout
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=sensor_was_on VALUE=True
    _RESTORE_IDLE_TIMEOUT
    # ---- 4) celebrate + status -----------------------------------------------------------------
    SET_LED_STATE STATE=printing
    _SOUND_LIB NAME=r2_resume
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"printing"'
    NOTIFY TEXT="Print continues ({s.pause_reason})" LEVEL=ok
    # ---- 5) continue the gcode file cleanly ------------------------------------------------------
    # M24 ONLY when a paused virtual-sdcard file is really waiting - otherwise
    # "SD busy" errors. R47: judge by the PAUSED STATE + a loaded filename, not by
    # pause_was_sd - in the legacy 'AS LEGACY' flow the file was ALREADY paused by
    # the start dialog when _LEGACY_PREP paused again, so pause_was_sd came out
    # False and the file would never have been continued.
    {% if printer.print_stats.state == 'paused' and printer.print_stats.filename|default('') != '' %}
        RESTORE_GCODE_STATE NAME=PAUSE_STATE   # modes/offsets, without moving
        M24                                      # continue processing the file
        CLEAR_PAUSE
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_was_sd VALUE=False
    {% elif printer.print_stats.state != 'paused' %}
        RESPOND MSG="Resume: file already running again - not touching the SD state"
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_was_sd VALUE=False
    {% endif %}
    # re-apply the current feature type (fresh speed/accel after the pause)
    {% if printer['gcode_macro _STATE'].current_type != '' %}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% endif %}
    # ---- L1 brake re-assert (R41): RESTORE_GCODE_STATE above also restores the
    #      SPEED FACTOR from pause time - a file's own 'M220 S100' preamble used to
    #      come back through the back door here. While layer 1 runs we re-apply the
    #      first-layer speed limit AFTER everything else. Last word wins.
    {% set svr = printer['save_variables'].variables %}
    {% if s.layer < 2 and not s.ignore_overrides and svr.first_layer_speed|default(75)|float > 0 %}
        M220 S{svr.first_layer_speed|default(75)|float|round}
        RESPOND MSG="Layer 1: speed brake re-applied ({svr.first_layer_speed|default(75)|float|round|int}% after resume)"
    {% endif %}

# -------------------------------------------------------------------------------------
# _PRINT_CLEANUP - the ONE place that resets every per-print state (R46).
# Called by PRINT_END, CANCEL_PRINT and the _STATE_WATCHER (legacy file ended
# without PRINT_END) - the next print ALWAYS starts clean, no matter how the
# last one ended. DELIBERATELY KEPT: your pre-print settings, the selected
# material and the currently loaded bed mesh.
# -------------------------------------------------------------------------------------
[gcode_macro _PRINT_CLEANUP]
description: Reset all per-print state so the next print starts clean (internal)
gcode:
    # two-step protections disarm (cancel / skip object / mesh delete)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_time VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_name VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=skip_armed_time VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_delete_armed VALUE='""'
    # per-print flags
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_mode VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_file VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ignore_overrides VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_held VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_type VALUE='"unknown"'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=start_pending VALUE='""'
    # R72: legacy-takeover arming + start decision are per print
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=legacy_armed VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_file VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=decided_mode VALUE='""'
    # R61: planned stop disarm + layer counter
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=stop_at_layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=has_heaters VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=probe_stage VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=infra_done VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_fan VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_flow VALUE=100.0
    # R74: file parameters are stale after the print too - reset ALL of them
    # (material/layer height/layers/temps included - the .57 menus kept showing
    # the finished print's values until the next file actually started)
    _FILE_INFO_RESET
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=g_speed_clean VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_accel VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_speed VALUE=100.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=wait_ticks VALUE=0
    # pause bookkeeping (a stale pause position must never lure the next resume)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_reason VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_was_sd VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_next_armed_runout VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_planned_reason VALUE='""'
    # live tuning + layer tracking -> neutral (incl. M220/M221 back to 100%)
    _LIVE_RESET
    # planned pauses off
    SAVE_VARIABLE VARIABLE=pause_next_layer VALUE=False
    SAVE_VARIABLE VARIABLE=pause_at_layer VALUE=0

# -------------------------------------------------------------------------------------
# CANCEL_PRINT - two-step protection:
#   1st press: pauses safely + arms ("press again to confirm")
#   2nd press: really cancels. RESUME disarms -> no accidental abort possible.
#   In the start-dialog waiting state (nothing hot) it cancels immediately.
# -------------------------------------------------------------------------------------
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel print (press TWICE: first pauses, second confirms)
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set now = printer.print_stats.total_duration|float %}
    {% if s.mode == 'waiting' %}
        # nothing happened yet -> immediate cancel is fine
        CANCEL_PRINT_BASE
        TURN_OFF_HEATERS
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
        _RESTORE_IDLE_TIMEOUT
        # the stored file values of this never-started print are per-print state
        _PRINT_CLEANUP
        SET_LED_STATE STATE=idle
        NOTIFY TEXT="Canceled before start" LEVEL=warn SOUND=r2_sad
    {% elif s.mode in ['printing','paused','filament'] or printer.print_stats.state in ['printing','paused'] %}
        {% if s.cancel_armed %}
            # ---------- second press: REALLY cancel ------------------------------------------------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=False
            CANCEL_PRINT_BASE
            TURN_OFF_HEATERS
            M99106 S0
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
            {% if 'filament_motion_sensor encoder_sensor' in printer %}
                # SFS V2.0 encoder part (R52): back on - nothing re-enabled it
                # before, so the clog protection silently died after the 1st runout
                SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
            {% endif %}
            _RESTORE_IDLE_TIMEOUT
            # full per-print cleanup (R46): the NEXT print starts clean
            # (settings, material and the loaded mesh are deliberately KEPT)
            _PRINT_CLEANUP
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_LED_STATE STATE=alarm
            G4 P1500
            SET_LED_STATE STATE=idle
            NOTIFY TEXT="PRINT CANCELED (layer {s.layer})" LEVEL=error SOUND=r2_sad
        {% else %}
            # ---------- first press: pause safely + arm ----------------------------------------------
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_armed VALUE=True
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=cancel_time VALUE={now|round(3)}
            {% if s.mode == 'printing' %}
                PAUSE REASON="cancel requested"
            {% endif %}
            NOTIFY TEXT="Press CANCEL again to CONFIRM (RESUME disarms)" LEVEL=warn SOUND=r2_alarm
            M117 Cancel? Press again!
        {% endif %}
    {% else %}
        NOTIFY TEXT="No print to cancel" LEVEL=warn SOUND=r2_notice
    {% endif %}

# =====================================================================================
#  FILAMENT CHANGE (M600) - ooze-safe and without abort risk.
#  Flow: safe park -> unload -> wait -> (you load new filament) ->
#        CHANGE_FILAMENT_RESUME (or RESUME) -> purge and continue printing.
# =====================================================================================
[gcode_macro M600]
description: Filament change: park, unload, wait for new filament
gcode:
    CHANGE_FILAMENT

[gcode_macro CHANGE_FILAMENT]
description: Filament change: park (during print), unload, wait for new filament
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.mode in ['printing','starting'] %}
        PAUSE REASON="filament change"
    {% endif %}
    {% if s.mode == 'paused' or s.mode in ['idle','finished'] %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"filament"'
        SET_LED_STATE STATE=filament
        _SOUND_LIB NAME=r2_filament
        # target temperature: DURING a print the current print temp is kept,
        # in idle at least 200C (or hotter if the material preset says so)
        {% set tgt = printer.extruder.target|float %}
        {% if tgt < 170 %}
            {% set db = printer['gcode_macro _MATERIALS'].presets %}
            {% set mat = sv.material|default('PLA')|string|upper %}
            {% set pre = db[mat].hot1|float if mat in db else 200.0 %}
            {% if sv.ov_hotend_first_on|default(False) %}{% set pre = [pre, sv.ov_hotend_first|float]|max %}{% endif %}
            {% set tgt = [200, pre]|max %}
            NOTIFY TEXT="Heating for filament change to {tgt|round|int}C..." LEVEL=info SOUND=r2_heating
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tgt|round}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tgt - 3}
        {% endif %}
        # unload length live adjustable (LCD: Maintenance > Filament > 'Unload len')
        {% set ulen = sv.unload_length|default(90)|float %}
        NOTIFY TEXT="Unloading filament ({ulen|round(0)|int}mm)..." LEVEL=info
        SAVE_GCODE_STATE NAME=FILA_UNLOAD
        M83
        G1 E-{ulen|round(0)|int} F1800
        RESTORE_GCODE_STATE NAME=FILA_UNLOAD
        _SOUND_LIB NAME=r2_question
        M117 New filament? -> RESUME
        RESPOND MSG=">>> Load new filament until the sensor clicks, then: CHANGE_FILAMENT_RESUME (LCD/Mainsail) or RESUME"
    {% else %}
        NOTIFY TEXT="Filament change already running - load filament and RESUME" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# _PURGE_STRIP - R92: color-change purge as a FAT SHORT LINE beside the objects.
# The old G1 E15 at the park corner grew a blob tower there - and the micro
# probe rides exactly over that corner while meshing. The strip lands flat
# (0.3mm) in a probe-safe window OUTSIDE the object bbox, far from the park
# corner; the head travels high above the objects and only descends in the
# free zone. Multi-line if the room is tight (up to 4 rows, +0.4mm each).
# -------------------------------------------------------------------------------------
[gcode_macro _PURGE_STRIP]
description: Purge as a fat line beside the objects (never the park corner)
gcode:
    {% set mm = params.MM|default(15)|float %}
    {% set wh = 0.3 %}                      # line height
    {% set ww = 3.0 %}                      # line width
    {% set fil = 2.405 %}                   # 1.75mm filament cross-section
    {% set mintp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if printer.extruder.temperature < mintp + 5 %}
        NOTIFY TEXT="Purge skipped - hotend below {(mintp + 5)|round|int}C" LEVEL=warn SOUND=r2_notice
    {% else %}
        # ---- real bed + probe-safe window (same rules as _PRIME_LINE) ----
        {% set r2p = printer.configfile.settings.get('r2_postproc', {}) %}
        {% set bx0 = r2p.bed_min_x|default(0)|float %}{% set bx1 = r2p.bed_max_x|default(220)|float %}
        {% set by0 = r2p.bed_min_y|default(-3)|float %}{% set by1 = r2p.bed_max_y|default(217)|float %}
        {% set probe_da = 'probe' in printer.configfile.settings %}
        {% set pox = printer.configfile.settings.probe.x_offset|default(0)|float if probe_da else 0.0 %}
        {% set poy = printer.configfile.settings.probe.y_offset|default(0)|float if probe_da else 0.0 %}
        {% set xmin = [bx0, bx0 - pox]|max|float + 5 %}
        {% set xmax = [bx1, bx1 - pox]|min|float - 5 %}
        {% set ymin = [by0, by0 - poy]|max|float + 5 %}
        {% set ymax = [by1, by1 - poy]|min|float - 5 %}
        # ---- object bbox ----
        {% set ns = namespace(minx=9999, miny=9999, maxx=-9999, maxy=-9999) %}
        {% if 'exclude_object' in printer and printer['exclude_object'].objects|length > 0 %}
            {% for o in printer['exclude_object'].objects %}
                {% for pt in o.polygon %}
                    {% if pt[0] < ns.minx %}{% set ns.minx = pt[0] %}{% endif %}
                    {% if pt[0] > ns.maxx %}{% set ns.maxx = pt[0] %}{% endif %}
                    {% if pt[1] < ns.miny %}{% set ns.miny = pt[1] %}{% endif %}
                    {% if pt[1] > ns.maxy %}{% set ns.maxy = pt[1] %}{% endif %}
                {% endfor %}
            {% endfor %}
        {% endif %}
        # ---- placement: front strip below the objects, else left, else right,
        #      else the front bed edge (far away from any park corner) ----
        {% set need = mm * fil / (ww * wh) %}
        {% set yline = ymin + 3 %}
        {% set xrs = xmin %}{% set xe = xmin %}
        {% if ns.minx < 9000 %}
            {% if ns.miny - 8 >= ymin + 1 and xmax - xmin >= 20 %}
                {% set yline = ns.miny - 8 %}
                {% set xrs = xmax - 2 %}{% set xe = [xmin + 2, xmax - 2 - [need, xmax - xmin - 8]|min]|max %}
                {% set place = 'front below objects' %}
            {% elif ns.minx - 10 - [need, 60]|min >= xmin + 2 %}
                {% set yline = [ns.miny, ymax - 1]|min %}
                {% set xrs = ns.minx - 10 %}{% set xe = [xmin + 2, ns.minx - 10 - [need, 60]|min]|max %}
                {% set place = 'left of objects' %}
            {% else %}
                {% set yline = [ns.miny, ymax - 1]|min %}
                {% set xe = [xmax - 2, ns.maxx + 10 + [need, 60]|min]|min %}
                {% set xrs = [xmin + 2, ns.maxx + 10]|min %}
                {% set place = 'right of objects' %}
            {% endif %}
        {% else %}
            {% set place = 'front bed edge' %}
            {% set xrs = xmax - 2 %}{% set xe = [xmin + 2, xmax - 2 - need]|max %}
        {% endif %}
        {% set room = (xrs - xe)|float %}
        {% if room < 10 %}
            # nowhere safe (objects fill the bed to the edges): purge high, in the air
            SAVE_GCODE_STATE NAME=PURGE_S
            M83
            G1 E{mm} F240
            RESTORE_GCODE_STATE NAME=PURGE_S
            RESPOND MSG="Purge {mm|round(0)}mm in the air - no free strip beside the objects"
        {% else %}
            {% set nlines = [[(need / room)|round(0, 'ceil')|int, 1]|max, 4]|min %}
            {% set L1 = (need / nlines)|float %}
            # travel HIGH above everything, descend only in the free zone
            {% set pos = printer.gcode_move.gcode_position %}
            {% set zmax = printer.toolhead.axis_maximum.z|default(250)|float %}
            {% set pz = [pos.z + 5, 60]|max|float if pos.z is defined else 60 %}
            {% set pz = [pz, zmax - 5]|min|float %}
            SAVE_GCODE_STATE NAME=PURGE_S
            G90
            M83
            G0 Z{pz|round(1)} F600
            G0 X{xrs|round(1)} Y{yline|round(1)} F6000
            G0 Z{wh|round(2)} F600
            G4 P150
            {% for i in range(nlines) %}
                {% set yl = yline + i * (wh + 0.1) %}
                G0 X{xrs|round(1)} Y{yl|round(2)} F6000
                G1 E1.0 F150
                G1 X{(xrs - L1)|round(1)} E{(L1 * ww * wh / fil)|round(3)} F900
                G1 E-2.0 F2400
            {% endfor %}
            G0 Z{pz|round(1)} F600
            RESTORE_GCODE_STATE NAME=PURGE_S
            RESPOND MSG="Purge strip {nlines}x{(L1)|round(0)}mm at Y{yline|round(0)} ({place}) - flat, probe-safe, never the park corner"
        {% endif %}
    {% endif %}

[gcode_macro CHANGE_FILAMENT_RESUME]
description: Finish filament change: purge, then continue (or finish in idle)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode == 'filament' %}
        # flush remains of the old filament (repeat PURGE_MORE until it is clean)
        # R92: as a flat strip beside the objects - NOT a blob at the park corner
        NOTIFY TEXT="Purging 15mm as a strip beside the objects..." LEVEL=info
        _PURGE_STRIP MM=15
        _SOUND_LIB NAME=r2_confirm
        {% if printer.print_stats.state == 'paused' %}
            RESPOND MSG="Filament change: pressure settled by the strip - NO purge at the object"
            _RESUME_COMMON UNRETRACT=0
        {% else %}
            # started in idle: nothing to resume - back to idle, heaters stay as they are
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mode VALUE='"idle"'
            SET_LED_STATE STATE=idle
            NOTIFY TEXT="Filament change done (idle)" LEVEL=ok SOUND=r2_done
            M117 Filament ready
        {% endif %}
    {% else %}
        NOTIFY TEXT="No filament change active" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro PURGE_MORE]
description: Purge another 15mm (until old color is gone)
gcode:
    _PURGE_STRIP MM=15
    _SOUND_LIB NAME=r2_click

# =====================================================================================
#  FILAMENT SENSOR (BTT) - runout & insert
#  Runout: instantly silence the sensor, R2 ALARM (red strobe + siren), safe pause.
#  The print is NOT canceled - it waits parked for new filament (M600).
# =====================================================================================
[gcode_macro _FILAMENT_RUNOUT]
description: (Runout) Filament empty - alarm + pause at the next layer boundary
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode in ['printing','starting'] and not s.pause_next_armed_runout|default(False) %}
        # arm ONE planned pause (repeat runout events while printing must not spam)
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_next_armed_runout VALUE=True
        SET_LED_STATE STATE=alarm
        _SOUND_LIB NAME=r2_alarm
        NOTIFY TEXT="FILAMENT OUT! Pausing at the next layer boundary" LEVEL=error
        {action_respond_info("R2: filament runout detected - planned pause armed")}
        M117 Filament out! Pausing..
        PAUSE_NEXT_LAYER REASON="filament out"
    {% elif s.mode == 'paused' and 'filament' in s.pause_reason|default('') %}
        _SOUND_LIB NAME=r2_notice
        M117 Filament out! Load -> RESUME
        RESPOND MSG=">>> Load filament, then RESUME (purges automatically)"
    {% elif s.mode in ['paused','filament','waiting'] %}
        _SOUND_LIB NAME=r2_click
    {% else %}
        _SOUND_LIB NAME=r2_click
    {% endif %}

[gcode_macro _FILAMENT_INSERTED]
description: (Insert) Filament detected - acknowledge (+LED)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.mode == 'filament' %}
        SET_LED_STATE STATE=filament
        _SOUND_LIB NAME=r2_confirm
        M117 Filament in -> RESUME
        RESPOND MSG="Filament detected - press RESUME (purges, then continues)"
    {% elif s.mode == 'paused' %}
        _SOUND_LIB NAME=r2_confirm
        M117 Filament in -> RESUME
    {% else %}
        SET_LED_STATE STATE=idle
        _SOUND_LIB NAME=r2_click
    {% endif %}

# -------------------------------------------------------------------------------------
# M0/M1 - "Pause at Height" (Cura/Orca post-processing) routed to our safe pause.
# (Klipper has no built-in M0/M1 - so we simply register them as macros.)
# -------------------------------------------------------------------------------------
[gcode_macro M0]
gcode:
    PAUSE REASON="slicer pause (M0)"
[gcode_macro M1]
gcode:
    PAUSE REASON="slicer pause (M1)"

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V09_PAUSE]
description: Version sentinel of 09_pause_filament.cfg (internal)
gcode:
