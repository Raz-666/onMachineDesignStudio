# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V10_LIVE]
description: Version sentinel of 10_live_tuning.cfg (internal)
gcode:

# -------------------------------------------------------------------------------------
# PARAM_SOURCES - R79: WHERE does every value come from? file | your pre-print
# override | LIVE in Klipper right now. The field log .62 read: 'never really
# clear where which parameter comes from - file info shows one thing, Pre-Print
# another, Live Tuning a third'. One command = the whole truth per parameter.
# LCD: Live Tuning > Sources. Rule of thumb: AS LEGACY applies your overrides
# at the start (Live then shows them as LIVE) - AS SLICED runs the file 1:1
# (Live shows the file/printer.cfg values).
# -------------------------------------------------------------------------------------
[gcode_macro PARAM_SOURCES]
description: Value provenance - file vs your override vs LIVE now, for every parameter
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fr = printer['firmware_retraction'] if 'firmware_retraction' in printer else None %}
    RESPOND MSG="== VALUE SOURCES: file | YOUR pre-print override | LIVE in Klipper now =="
    RESPOND MSG="Mode: {s.mode} | AS SLICED 1:1 (overrides off): {s.ignore_overrides} | first-layer rules (L1 temps + fan off, also 1:1): {'ON' if sv.first_layer_rules|default(True) else 'off'}"
    RESPOND MSG="Speed global: file M220 {s.file_speed|default(100)|float|round|int}% | LIVE {(printer.gcode_move.speed_factor|default(1)*100)|round|int}% - THE one global regulator - per-feature % rides on top of it"
    RESPOND MSG="Flow: file {s.file_flow|default(100)|float|round|int}% | override {sv.ov_flow|default(100)|float|round|int}% {'ON' if sv.ov_flow_on|default(False) else 'off'} | LIVE {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}%"
    RESPOND MSG="PA: file {s.file_pa|default(0)|float|round(4)} | override {sv.ov_pa|default(0)|float|round(4)} {'ON' if sv.ov_pa_on|default(False) else 'off'} | LIVE {printer.extruder.pressure_advance|default(0)|float|round(4)}"
    RESPOND MSG="PA smooth: override {sv.ov_pa_smooth|default(0.04)|float|round(3)} {'ON' if sv.ov_pa_smooth_on|default(False) else 'off'} | LIVE {printer.extruder.smooth_time|default(0.04)|float|round(3)}"
    RESPOND MSG="Accel: file M204 {s.file_accel|default(0)|float|round|int} | override {sv.ov_accel|default(0)|float|round|int} {'ON' if sv.ov_accel_on|default(False) else 'off'} | live set {s.live_accel|default(0)|float|round|int} | LIVE Klipper {printer.toolhead.max_accel|default(0)|float|round|int}"
    RESPOND MSG="Velocity: printer.cfg | override {sv.ov_velocity|default(0)|float|round|int} {'ON' if sv.ov_velocity_on|default(False) else 'off'} | LIVE {printer.toolhead.max_velocity|default(0)|float|round|int} (files never set this - it caps every move)"
    RESPOND MSG="Min cruise ratio: printer.cfg | override {sv.ov_min_cruise|default(0)} {'ON' if sv.ov_min_cruise_on|default(False) else 'off'} | LIVE {printer.toolhead.minimum_cruise_ratio|default(0.5)|float|round(3)}"
    RESPOND MSG="Corner velocity: printer.cfg | override {sv.ov_square_corner|default(0)|float|round(1)} {'ON' if sv.ov_square_corner_on|default(False) else 'off'} | LIVE {printer.toolhead.square_corner_velocity|default(5)|float|round(1)}"
    RESPOND MSG="Retraction: file {s.file_retract_len|default(0)|float|round(2)}mm@{s.file_retract_speed|default(0)|float|round|int}mm/s | LIVE {fr.retract_length|default(0)|float|round(2)}mm@{fr.retract_speed|default(0)|float|round|int}mm/s (live setters win over file SET_RETRACTION)"
    RESPOND MSG="Fan: file S{s.file_fan|default(0)|float|round|int} | scale {s.f_fan_scale|default(1)|float*100|round|int}% | LIVE {printer.fan.speed|default(0)|float*100|round|int}% | layer 1 = OFF ({'rule on' if sv.first_layer_rules|default(True) else 'off'})"
    RESPOND MSG="Temps L1/L2 material {s.file_material|default('?')}: file {s.file_hotend_first|default(0)|float|round|int}/{s.file_hotend_after|default(0)|float|round|int}C bed {s.file_bed|default(0)|float|round|int}/{s.file_bed_after|default(0)|float|round|int}C | LIVE hotend {printer.extruder.target|float|round|int}C bed {printer.heater_bed.target|float|round|int}C"
    {% if s.absent_features|default([]) %}
        RESPOND MSG="Features parked (not in this file, cannot apply): { s.absent_features|join(', ')|lower }"
    {% endif %}
    RESPOND MSG="Features: use Live > Features for every type (speed % / flow % / accel, ON/OFF per feature)"
    M117 Sources -> console


# =====================================================================================
#  R106 (user request): Z-HOP ON FIRMWARE RETRACTS + LIVE ACCEL CAP
#  G10/G11 are intercepted (rename_existing, same pattern as the M106
#  interceptor): retract -> lift Z by the configured hop -> travels run
#  clear of the part -> lower -> unretract. The lift/lower use ABSOLUTE
#  Z moves (mode-independent) and a lifted-state guard, so a layer-change
#  Z move between G10 and G11 is detected and the lower is SKIPPED
#  (the file already set the exact new Z). Works on every file that uses
#  firmware retraction (G10/G11): all R2-generated files, 'fixed' files
#  (postproc converts them) and slicer files after RetFix.
# =====================================================================================
[gcode_macro G10]
description: Firmware retract + optional Z-hop lift (R106)
rename_existing: G10.1
gcode:
    G10.1
    {% set sv = printer['save_variables'].variables %}
    {% set s = printer['gcode_macro _STATE'] %}
    {% if sv.zh_on|default(False) and printer.print_stats.state in ['printing', 'paused']
          and 'z' in printer.toolhead.homed_axes|default('')
          and s.zh_lifted|default(False) != true %}
        {% set h = sv.zh_height|default(0.4)|float %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        {% if h > 0.05 and z > 0.05
              and z + h < printer.toolhead.axis_maximum.z|default(250)|float %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=zh_lifted VALUE=True
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=zh_base_z VALUE={z|round(3)}
            G1 Z{(z + h)|round(3)} F6000
        {% endif %}
    {% endif %}

[gcode_macro G11]
description: Optional Z-hop lower + firmware unretract (R106)
rename_existing: G11.1
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.zh_lifted|default(False) == true %}
        {% set h = printer['save_variables'].variables.zh_height|default(0.4)|float %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        {% if (z - (s.zh_base_z|default(0)|float + h))|abs <= 0.06 %}
            G1 Z{s.zh_base_z|default(0)|float|round(3)} F6000
        {% else %}
            RESPOND MSG="Z-hop: file moved Z itself ({z|round(2)} vs {s.zh_base_z|round(2)}+{h|round(2)}) - lower skipped"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=zh_lifted VALUE=False
    {% endif %}
    G11.1

[gcode_macro SET_Z_HOP]
description: Z-hop on firmware retracts: SET_Z_HOP ENABLE=1 HEIGHT=0.4
gcode:
    {% set en = params.ENABLE|default(-1)|int %}
    {% set h = params.HEIGHT|default(0)|float %}
    {% if h != 0 and not (0.1 <= h <= 3.0) %}
        RESPOND MSG="Z-hop height must be 0.1..3mm"
    {% else %}
        {% if en >= 0 %}SAVE_VARIABLE VARIABLE=zh_on VALUE={en == 1}{% endif %}
        {% if h > 0 %}SAVE_VARIABLE VARIABLE=zh_height VALUE={h|round(2)}{% endif %}
        {% set on = (en >= 0) and (en == 1) or (en < 0 and printer['save_variables'].variables.zh_on|default(False)) %}
        # R132 field log .92: ONE quoted string. The old code closed the
        # quote after {'ON'...} - the rest rendered UNQUOTED -> 'Malformed
        # command' spam on every menu toggle.
        RESPOND MSG="Z-hop {'ON' if on else 'OFF'}{%- if h > 0 %} height {h|round(2)}mm{% endif %}{%- if on %} - lifts Z on every firmware retract (G10/G11), lowers before the unretract. Needs firmware retraction: R2 files always have it, slicer files need RetFix first{% endif %}"
        M117 Z-hop: {'ON' if on else 'OFF'}{% if h > 0 %} {h|round(2)}mm{% endif %}
    {% endif %}

# --------------------- extruder drive profile (R146) ------------------------------------
[gcode_macro SET_EXTRUDER_DRIVE]
description: Retraction starting-point profile: SET_EXTRUDER_DRIVE TYPE=DIRECT|BOWDEN - every value stays freely editable afterwards (both directions)
gcode:
    # R146 (.107): ONE switch between the two extruder worlds. It only sets a
    # STARTING POINT (direct: 0.6mm @ 40mm/s, z-hop off / bowden: 4.5mm @
    # 30mm/s) - length, speeds, unretract extra and z-hop stay FREE manuals
    # afterwards, in BOTH directions. Nothing here is tied to RetractFix
    # (that only repairs OLD Bowden-era files on disk). Persistent +
    # profileable like every ov_ override.
    {% set t = params.TYPE|default('')|string|upper %}
    {% if t not in ('DIRECT', 'BOWDEN') %}
        RESPOND MSG="SET_EXTRUDER_DRIVE TYPE=DIRECT or TYPE=BOWDEN - starting points: direct 0.6mm @ 40mm/s, bowden 4.5mm @ 30mm/s - everything stays freely editable"
    {% else %}
        {% set drv = 0.6 if t == 'DIRECT' else 4.5 %}
        {% set spd = 40 if t == 'DIRECT' else 30 %}
        SAVE_VARIABLE VARIABLE=ov_drive VALUE='"{t}"'
        _PACE
        SAVE_VARIABLE VARIABLE=ov_retract_len VALUE={drv}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_retract_len_on VALUE=True
        _PACE
        SAVE_VARIABLE VARIABLE=ov_retract_speed VALUE={spd}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_retract_speed_on VALUE=True
        _PACE
        SAVE_VARIABLE VARIABLE=ov_unretract_speed VALUE={spd}
        _PACE
        SAVE_VARIABLE VARIABLE=ov_unretract_speed_on VALUE=True
        {% if t == 'DIRECT' %}
            _PACE
            SAVE_VARIABLE VARIABLE=zh_on VALUE=False
        {% endif %}
        {% if 'firmware_retraction' in printer %}
            SET_RETRACTION_BASE RETRACT_LENGTH={drv} RETRACT_SPEED={spd} UNRETRACT_SPEED={spd}
        {% endif %}
        _UI_SOUND NAME=r2_confirm
        M117 Drive: {t}
        RESPOND MSG="Extruder drive: {t} - retraction starting point {drv}mm @ {spd}mm/s, unretract {spd}mm/s, {'z-hop OFF (a direct drive needs no hop)' if t == 'DIRECT' else 'z-hop untouched - 0.4-0.8mm helps against stringing if the long bowden tube oozes'}"
        RESPOND MSG="Everything stays free: Pre-Print > Velocity (length / speeds / z-hop) or Live Tuning > Extrusion mid-print - switch back and forth any time"
    {% endif %}

# =====================================================================================
#  R111 - the roadmap parameters (live + pre-print)
# =====================================================================================

[gcode_macro _FEAT_TUNING_RESTORE]
description: R111 safety net - restore global PA + input shaper after a feature tuning left them on
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if s.pa_feat_active|default(False) %}
        {% set rpa = sv.ov_pa|default(0)|float if sv.ov_pa_on|default(False) else printer.extruder.pressure_advance|default(0)|float %}
        {% if rpa > 0 %}SET_PRESSURE_ADVANCE_BASE ADVANCE={rpa|round(4)}{% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
    {% endif %}
    {% if s.shaper_off_active|default(False) and 'input_shaper' in printer %}
        SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
    {% endif %}

[gcode_macro SET_FAN_CLAMP]
description: Fan curve clamp - SET_FAN_CLAMP MIN=10 MAX=90 BRIDGE=100 ON=1 (percent of S255)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set on = params.ON|default(-1)|int %}
    {% set mn = params.MIN|default(-1)|float %}
    {% set mx = params.MAX|default(-1)|float %}
    {% set br = params.BRIDGE|default(-1)|float %}
    {% if mn != -1 and not (0 <= mn <= 100) %}
        RESPOND MSG="Fan clamp MIN must be 0..100%"
    {% elif mx != -1 and not (0 <= mx <= 100) %}
        RESPOND MSG="Fan clamp MAX must be 0..100%"
    {% elif br != -1 and not (0 <= br <= 100) %}
        RESPOND MSG="Fan clamp BRIDGE must be 0..100% (0 = off)"
    {% elif mn != -1 and mx != -1 and mn > mx %}
        RESPOND MSG="Fan clamp MIN must be <= MAX"
    {% else %}
        {% if mn >= 0 %}SAVE_VARIABLE VARIABLE=ov_fan_min VALUE={mn}{% endif %}
        {% if mx >= 0 %}SAVE_VARIABLE VARIABLE=ov_fan_max VALUE={mx}{% endif %}
        {% if br >= 0 %}SAVE_VARIABLE VARIABLE=ov_fan_bridge VALUE={br}{% endif %}
        {% if on >= 0 %}SAVE_VARIABLE VARIABLE=ov_fan_clamp_on VALUE={on == 1}{% endif %}
        {% set ison = (on == 1) if on >= 0 else sv.ov_fan_clamp_on|default(False) %}
        # R167 (.125 field log): clamp changes apply IMMEDIATELY, not 'from
        # the file's next M106' - generated files send ONE M106 per print,
        # slicer files one per layer: the user turned min/max/bridge and
        # NOTHING visibly happened. Same immediate math as the M106
        # interceptor itself (scale -> clamp -> bridge), layer-1 hold wins.
        {% set s = printer['gcode_macro _STATE'] %}
        {% set ff = s.file_fan|default(0)|int %}
        {% set held = s.mode in ['printing','paused'] and s.layer < 2
                       and (not s.ignore_overrides or sv.first_layer_rules|default(True)) %}
        {% if printer.print_stats.state == 'printing' and ff > 0 and not held %}
            {% set sc = (ff * s.f_fan_scale|default(1)|float)|round|int %}
            {% if s.f_fan_hold|default(0)|float > 0 %}
                {% set sc = (s.f_fan_hold|float * 255 / 100)|round|int %}
            {% endif %}
            {% if ison %}
                {% set fmin = (sv.ov_fan_min|default(0)|float * 255 / 100)|round|int %}
                {% set fmax = (sv.ov_fan_max|default(100)|float * 255 / 100)|round|int %}
                {% if fmax > 255 %}{% set fmax = 255 %}{% endif %}
                {% if sc < fmin %}{% set sc = fmin %}{% endif %}
                {% if sc > fmax %}{% set sc = fmax %}{% endif %}
                {% if sv.ov_fan_bridge|default(0)|float > 0 and s.current_type|default('')|upper == 'BRIDGE' %}
                    {% set fbr = (sv.ov_fan_bridge|float * 255 / 100)|round|int %}
                    {% if sc < fbr %}{% set sc = fbr %}{% endif %}
                {% endif %}
            {% endif %}
            M99106 S{[sc, 255]|min}
        {% endif %}
        RESPOND MSG="Fan clamp {'ON' if ison else 'OFF'}: min {sv.ov_fan_min|default(0)|float|round|int if mn < 0 else mn|round|int}% max {sv.ov_fan_max|default(100)|float|round|int if mx < 0 else mx|round|int}% bridge {sv.ov_fan_bridge|default(0)|float|round|int if br < 0 else br|round|int}% (0=off) - applied now + at every M106"
        M117 FanClamp: {'ON' if ison else 'OFF'}
    {% endif %}

[gcode_macro SET_FEAT_PA]
description: Pressure advance for ONE feature (SET_FEAT_PA FEATURE=wallouter PA=0.05; 0 = off)
gcode:
    {% set code = params.FEATURE|default('')|string|lower|replace('-','') %}
    {% set fcodes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
    {% set pa = params.PA|default(-1)|float %}
    {% if code not in fcodes %}
        RESPOND MSG="SET_FEAT_PA FEATURE=<feature> PA=<mm> - features: {fcodes|join(', ')}"
    {% elif pa != -1 and not (0 <= pa <= 0.3) %}
        RESPOND MSG="Feature PA must be 0 (off) .. 0.3 mm"
    {% elif pa < 0 %}
        RESPOND MSG="{code|upper}: feature PA {printer['save_variables'].variables['ovf_' ~ code ~ '_pa']|default(0)|float} mm (0 = off, global PA rules)"
    {% else %}
        SET_OVERRIDE_VALUE NAME=feat_pa_{code} VALUE={pa}
        {% if pa > 0 %}
            RESPOND MSG="{code|upper}: feature PA {pa} mm - applied at every {code|upper} boundary, global PA returns after it"
        {% else %}
            RESPOND MSG="{code|upper}: feature PA OFF - the global PA rules again"
        {% endif %}
        M117 {code|truncate(9,True,'')} PA {pa}
    {% endif %}

[gcode_macro SET_FEAT_SHAPER_OFF]
description: Input shaper OFF for one feature (SET_FEAT_SHAPER_OFF FEATURE=wallouter STATE=1) - corners sharpen, shaper returns after
gcode:
    {% set code = params.FEATURE|default('')|string|lower|replace('-','') %}
    {% set st = params.STATE|default(-1)|int %}
    {% set fcodes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if code != '' and code not in fcodes and code != 'off' %}
        RESPOND MSG="SET_FEAT_SHAPER_OFF FEATURE=<feature> STATE=0|1 - features: {fcodes|join(', ')}"
    {% elif 'input_shaper' not in printer %}
        # R116 (.88 field log): this refusal used to be console-only - on the LCD
        # the entry just did 'nothing'. Say it on the display too + what to do.
        NOTIFY TEXT="Shaper-off needs [input_shaper] in printer.cfg - your printer runs WITHOUT input shaping anyway (nothing to switch off). To use it: [input_shaper] section + calibrate (ADXL or the graph method)" LEVEL=warn SOUND=r2_notice
        M117 ShaperOff: n/a
    {% else %}
        {% if code in fcodes %}SAVE_VARIABLE VARIABLE=ovf_shaper_off_feat VALUE='{code}'{% endif %}
        {% if st == 1 %}SAVE_VARIABLE VARIABLE=ovf_shaper_off_on VALUE=True{% endif %}
        {% if st == 0 or code == 'off' %}SAVE_VARIABLE VARIABLE=ovf_shaper_off_on VALUE=False{% endif %}
        {% set feat = code if code in fcodes else sv.ovf_shaper_off_feat|default('wallouter') %}
        {% set on = (st == 1) if st >= 0 else (False if code == 'off' else sv.ovf_shaper_off_on|default(False)) %}
        RESPOND MSG="Input shaper {'OFF while ' ~ feat|upper ~ ' prints (sharp corners), ON elsewhere' if on else 'normal - no per-feature shaper switch'}"
        M117 ShaperOff: {'ON' if on else 'OFF'}
    {% endif %}

[gcode_macro SET_UNRETRACT_EXTRA]
description: Extra unretract length in mm (SET_UNRETRACT_EXTRA EXTRA=0.05; 0 = off) - firmware retraction only
gcode:
    {% set ex = params.EXTRA|default(-1)|float %}
    {% if ex != -1 and not (-1 <= ex <= 3) %}
        RESPOND MSG="Unretract extra must be -1..3 mm (0 = off)"
    {% elif ex < 0 %}
        RESPOND MSG="Unretract extra: {printer['save_variables'].variables.ov_unretract_extra|default(0)|float} mm (0 = off)"
    {% else %}
        SAVE_VARIABLE VARIABLE=ov_unretract_extra VALUE={ex}
        SET_RETRACTION_BASE UNDO_EXTRA_RETRACT_LENGTH={ex}
        RESPOND MSG="Unretract extra {ex} mm {'ON - every unretract adds ' ~ ex ~ ' mm (seals the dot after a travel)' if ex != 0 else 'OFF'}"
        M117 UnretExtra {ex}
    {% endif %}

[gcode_macro SET_LIVE_ACCEL]
description: Global acceleration cap in mm/s2 - every move, travels included (SET_LIVE_ACCEL ACCEL=4000)
gcode:
    {% set v = params.ACCEL|default(4000)|float %}
    # R159 (.119) FIELD FIX: this must ALSO take live_accel - the file sends
    # its own M204 at every feature boundary and the M204 interceptor only
    # protects a value it knows about. Without this, a live accel change was
    # overwritten within seconds ('velocity settings have no effect').
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_accel VALUE={v|round}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE=-1
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_global VALUE={v|round}
    SET_VELOCITY_LIMIT ACCEL={v|round|int}
    RESPOND MSG="[OK] accel {v|round|int} mm/s2 -> Klipper (SET_VELOCITY_LIMIT) - GLOBAL cap, every move incl. travels - the file's own M204 cannot push it back"
    M117 Accel: {v|round|int}
