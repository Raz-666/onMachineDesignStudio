# =====================================================================================
#  10_live_tuning.cfg - change EVERYTHING during a print (LCD + Mainsail)
#  -----------------------------------------------------------------------------------
#  HOW PER-FEATURE SPEED WORKS (outer wall, support, ironing ...):
#  The slicer writes comments like ";TYPE:Outer wall" into the file. Our post-
#  processing script (slicer/) converts them into "APPLY_TYPE TYPE=..." commands.
#  At every feature boundary APPLY_TYPE then sets:
#     - M220 (speed factor of this feature)
#     - SET_VELOCITY_LIMIT ACCEL (acceleration of this feature, if set)
#     - M221 (flow - only ironing gets its own flow)
#     - ironing temperature override (optional, restored afterwards)
#
#  IMPORTANT FOR OLD FILES (no APPLY_TYPE markers): the setters below apply the
#  new factor IMMEDIATELY via M220 when no feature type is known - you always
#  get instant feedback, even with legacy files.
# =====================================================================================

# -------------------------------------------------------------------------------------
# _LIVE_RESET - all live values to neutral (called by PRINT_START)
# -------------------------------------------------------------------------------------
[gcode_macro _LIVE_RESET]
description: Reset all live tuning values to default (100%/off)
gcode:
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_outer_wall VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_inner_wall VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_infill VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_solid VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_support VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_ironing VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_scale VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_outer_wall VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_inner_wall VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_infill VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_solid VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_support VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_ironing VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_flow VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_accel VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=l1_speed_user VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_flow VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_temp_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_prev_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=current_type VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=absent_features VALUE=[]
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_marks VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_next_armed_runout VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_pa VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_len VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_speed VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_planned_reason VALUE='""'
    M220 S100
    M221 S100

# -------------------------------------------------------------------------------------
# APPLY_TYPE - called at every feature boundary (by the PP script / LAYER marker)
# -------------------------------------------------------------------------------------
[gcode_macro APPLY_TYPE]
description: Feature switch - applies YOUR per-feature overrides on top of the CLEAN global factor (never touches it); markers injected by the post-processor into every file
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set ty = params.TYPE|default('')|string|upper %}
    {% set code = ty|replace('-','')|lower %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=current_type VALUE='"{ty}"'
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and code != '' %}
        # ---- R59: CLEAN global separation (field log .42: 75%% brake x 80%% wall
        #      compounded segment by segment down to 19%%!). g_speed_clean = the
        #      one global regulator (SET_GLOBAL_SPEED / L1 brake / file M220).
        #      A feature multiplies ON TOP of it for its own segments only - via
        #      the BASE command M99220 directly, so the global value itself is
        #      never touched. Global on, feature off -> file speed x global 1:1.
        {% set clean = s.g_speed_clean|default(100)|float %}
        {% set codes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom'] %}
        {% if code in codes and sv['ovf_' ~ code ~ '_on']|default(False)
              and code|upper not in s.absent_features|default([]) %}
            {% set spd = sv['ovf_' ~ code ~ '_spd']|default(100)|float %}
            M99220 S{(clean * spd / 100)|round}
            RESPOND MSG="[Feature] {code}: speed {spd|round|int}% x global {clean|round|int}% = {(clean * spd / 100)|round|int}% (segments print at file speed x this)"
            {% if sv['ovf_' ~ code ~ '_acc']|default(0)|float > 0 %}
                # R92.1: feature accel = hard limit; the global percent scaler
                # (SET_GLOBAL_ACCEL_PERCENT) scales ALL feature limits in the
                # same ratio - the global (no-feature) accel stays absolute
                {% set apct = sv.ovf_accel_pct|default(100)|float %}
                {% set afe = sv['ovf_' ~ code ~ '_acc']|float %}
                M99204 S{(afe * apct / 100)|round}
                RESPOND MSG="[Feature] {code}: accel {afe|round|int} mm/s2 x {apct|round|int}% = {(afe * apct / 100)|round|int} mm/s2 (feature limit, beats the global)"
            {% elif s.live_accel|default(0)|float > 0 %}
                M99204 S{s.live_accel|float|round}
            {% elif sv.ov_accel_on|default(False) and sv.ov_accel|default(0)|float > 0 %}
                M99204 S{sv.ov_accel|float|round}
            {% endif %}
            # ---- R62/R92.1: per-feature FLOW - the % ALWAYS refers to the
            #      GLOBAL flow (the one regulator): eff = global x feature,
            #      e.g. global 98% x feature 110% = 107.8%. Features never
            #      touch the global itself. R73: a LIVE flow set by the user
            #      IS the global here - the re-apply keeps it (never wiped).
            {% set liveflw = s.live_flow|default(0)|float %}
            {% set gflw = liveflw if liveflw > 0 else (sv.ov_flow|default(100)|float if sv.ov_flow_on|default(False) else 100.0) %}
            {% set fflw = sv['ovf_' ~ code ~ '_flw']|default(100)|float %}
            {% if code == 'ironing' and fflw == 100 and sv.ov_ironing_flow_on|default(False) %}
                {% set fflw = sv.ov_ironing_flow|default(100)|float %}
            {% endif %}
            M99221 S{(gflw * fflw / 100)|round}
            {% if fflw != 100 or gflw != 100 %}
                RESPOND MSG="[Feature] {code}: flow {fflw|round|int}% x global {gflw|round|int}% = {(gflw * fflw / 100)|round|int}%"
            {% endif %}
            # ---- R111: per-feature PRESSURE ADVANCE (0 = off). Applied at the
            #      feature start; when the feature ends the global PA returns
            #      (your override, else the file's own, else the extruder's).
            {% set fpa = sv['ovf_' ~ code ~ '_pa']|default(0)|float %}
            {% if fpa > 0 %}
                SET_PRESSURE_ADVANCE_BASE ADVANCE={fpa}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=True
                RESPOND MSG="[Feature] {code}: PA {fpa|round(3)} (feature PA - global returns when it ends)"
            {% elif s.pa_feat_active|default(False) %}
                {% set rpa = sv.ov_pa|default(0)|float if sv.ov_pa_on|default(False) else s.file_pa|default(0)|float if s.file_pa|default(0)|float > 0 else printer.extruder.pressure_advance|default(0)|float %}
                {% if rpa > 0 %}
                    SET_PRESSURE_ADVANCE_BASE ADVANCE={rpa|round(4)}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
                RESPOND MSG="[Feature] PA back to {rpa|round(3)} (global)"
            {% endif %}
            # ---- R111: input shaper OFF for one configurable feature (the
            #      classic surface trick: no shaper lag on slow outer walls).
            #      Frequencies are saved on the way out and restored when the
            #      feature ends (type stays untouched). Guarded for printers
            #      without [input_shaper].
            {% set shp111 = sv.ovf_shaper_off_on|default(False) and sv.ovf_shaper_off_feat|default('wallouter') == code %}
            {% if shp111 and not s.shaper_off_active|default(False) and 'input_shaper' in printer %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_saved_fx VALUE={printer.input_shaper.shaper_freq_x|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_saved_fy VALUE={printer.input_shaper.shaper_freq_y|default(0)|float}
                SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=True
                RESPOND MSG="[Feature] {code}: input shaper OFF (corners sharpen) - back on when it ends"
            {% elif s.shaper_off_active|default(False) and not shp111 %}
                SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
                RESPOND MSG="[Feature] input shaper back ON ({s.shaper_saved_fx|default(0)|float|round(1)}/{s.shaper_saved_fy|default(0)|float|round(1)} Hz)"
            {% endif %}
        {% else %}
            # feature without an override (or unknown type): pure global factor
            M99220 S{clean|round}
            M99221 S{s.live_flow|default(0)|float|round if s.live_flow|default(0)|float > 0 else (sv.ov_flow|default(100)|float|round if sv.ov_flow_on|default(False) else 100)}
            {% if s.live_accel|default(0)|float > 0 %}
                M99204 S{s.live_accel|float|round}
            {% elif sv.ov_accel_on|default(False) and sv.ov_accel|default(0)|float > 0 %}
                M99204 S{sv.ov_accel|float|round}
            {% endif %}
            # R111: leaving a feature that had PA / shaper-off -> restore
            {% if s.pa_feat_active|default(False) %}
                {% set rpa = sv.ov_pa|default(0)|float if sv.ov_pa_on|default(False) else s.file_pa|default(0)|float if s.file_pa|default(0)|float > 0 else printer.extruder.pressure_advance|default(0)|float %}
                {% if rpa > 0 %}
                    SET_PRESSURE_ADVANCE_BASE ADVANCE={rpa|round(4)}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
            {% endif %}
            {% if s.shaper_off_active|default(False) %}
                SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
            {% endif %}
        {% endif %}
    {% endif %}
[gcode_macro SET_OUTER_WALL_SPEED]
description: Outer wall speed in %% ON TOP of the global factor (R58; 100 = off/1:1) - only this feature
gcode:
    SET_OVERRIDE_VALUE NAME=outer_wall VALUE={params.PERCENT|default(100)|float}

[gcode_macro SET_OUTER_WALL_ACCEL]
description: Outer wall acceleration mm/s^2 (R58; 0 = global) - only this feature
gcode:
    SET_OVERRIDE_VALUE NAME=outer_wall_accel VALUE={params.ACCEL|default(0)|float}
[gcode_macro SET_INNER_WALL_SPEED]
description: (compat no-op) per-feature tuning removed in .38 - use the global setter
gcode:
    RESPOND MSG="SET_INNER_WALL_SPEED: per-feature values were removed in .38 - use SET_GLOBAL_SPEED / SET_GLOBAL_ACCEL / SET_FLOW_RATE"
[gcode_macro SET_INFILL_SPEED]
description: Infill speed in % (SET_INFILL_SPEED PERCENT=120)
gcode:
    {% set p = params.PERCENT|default(100)|float %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_infill VALUE={(p/100)|round(3)}
    {% if printer['gcode_macro _STATE'].current_type in ['SPARSE-INFILL',''] %}
        M220 S{p|round|int}
    {% endif %}
    M117 Infill: {p|round(0)}%

[gcode_macro SET_SUPPORT_SPEED]
description: Support speed in %% ON TOP of the global factor (R58; 100 = off/1:1) - only this feature
gcode:
    SET_OVERRIDE_VALUE NAME=support VALUE={params.PERCENT|default(100)|float}

[gcode_macro SET_SUPPORT_ACCEL]
description: Support acceleration mm/s^2 (R58; 0 = global) - only this feature
gcode:
    SET_OVERRIDE_VALUE NAME=support_accel VALUE={params.ACCEL|default(0)|float}
[gcode_macro SET_SOLID_INFILL_SPEED]
description: (compat no-op) per-feature tuning removed in .38 - use the global setter
gcode:
    RESPOND MSG="SET_SOLID_INFILL_SPEED: per-feature values were removed in .38 - use SET_GLOBAL_SPEED / SET_GLOBAL_ACCEL / SET_FLOW_RATE"
[gcode_macro SET_INNER_WALL_ACCEL]
description: (compat no-op) per-feature tuning removed in .38 - use the global setter
gcode:
    RESPOND MSG="SET_INNER_WALL_ACCEL: per-feature values were removed in .38 - use SET_GLOBAL_SPEED / SET_GLOBAL_ACCEL / SET_FLOW_RATE"
[gcode_macro SET_INFILL_ACCEL]
description: Infill accel mm/s2, 0=global (SET_INFILL_ACCEL ACCEL=5000)
gcode:
    {% set a = params.ACCEL|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_infill VALUE={a}
    {% if printer['gcode_macro _STATE'].current_type in ['SPARSE-INFILL',''] and a > 0 %}
        SET_VELOCITY_LIMIT ACCEL={a|round|int}
    {% endif %}
    M117 Infill acc: {a|round(0)}

[gcode_macro SET_SOLID_INFILL_ACCEL]
description: (compat no-op) per-feature tuning removed in .38 - use the global setter
gcode:
    RESPOND MSG="SET_SOLID_INFILL_ACCEL: per-feature values were removed in .38 - use SET_GLOBAL_SPEED / SET_GLOBAL_ACCEL / SET_FLOW_RATE"
[gcode_macro SET_IRONING_ACCEL]
description: (compat no-op) per-feature tuning removed in .38 - use the global setter
gcode:
    RESPOND MSG="SET_IRONING_ACCEL: per-feature values were removed in .38 - use SET_GLOBAL_SPEED / SET_GLOBAL_ACCEL / SET_FLOW_RATE"
[gcode_macro SET_GLOBAL_SPEED]
description: Global speed factor in % - everything (SET_GLOBAL_SPEED PERCENT=80) - on layer 1 this takes over from the L1 brake
gcode:
    {% set p = params.PERCENT|default(100)|float %}
    # R73: on layer 1 the M220 interceptor used to cap EVERY value back down to
    # the first-layer brake - a live change looked 'locked'. Setting the flag
    # first makes the user the boss for the rest of this print.
    {% if printer['gcode_macro _STATE'].mode in ['printing','paused'] and printer['gcode_macro _STATE'].layer < 2 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=l1_speed_user VALUE=True
        RESPOND MSG="[live] Your speed {p|round|int}% now leads on layer 1 (L1 brake off for this print)"
    {% endif %}
    M220 S{p|round|int}
    M117 Global speed: {p|round(0)}%

[gcode_macro SET_GLOBAL_ACCEL]
description: Global print acceleration (SET_GLOBAL_ACCEL ACCEL=4000) - rules everything WITHOUT its own feature accel; a feature accel keeps winning for its feature
gcode:
    {% set a = params.ACCEL|default(4000)|float %}
    # R73: files send their own M204 at every feature - the interceptor used to
    # push the user's live value right back. live_accel leads until print end.
    # R87.2 FIELD FIX (.71 log: setting the global accel silently killed the
    # feature accel): a feature that carries its OWN accel keeps it - the
    # global rules everything else. The message says which one is active.
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_accel VALUE={a|round}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_global VALUE={a|round}
    {% set sga = printer['gcode_macro _STATE'] %}
    {% set svga = printer['save_variables'].variables %}
    {% set cga = sga.current_type|default('')|string|replace('-','')|lower %}
    {% set fga = 0 %}
    {% if sga.mode in ['printing','paused'] and not sga.ignore_overrides
          and cga in ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom']
          and svga['ovf_' ~ cga ~ '_on']|default(False) %}
        {% set fga = svga['ovf_' ~ cga ~ '_acc']|default(0)|float %}
    {% endif %}
    {% if fga > 0 %}
        {% set pctga = svga.ovf_accel_pct|default(100)|float %}
        SET_VELOCITY_LIMIT ACCEL={(fga * pctga / 100)|round}
        RESPOND MSG="[live] Global accel {a|round|int} mm/s2 - the printing feature '{cga}' keeps its own {fga|round|int} mm/s2 x {pctga|round|int}% = {(fga * pctga / 100)|round|int} mm/s2 (feature beats the global)"
    {% else %}
        SET_VELOCITY_LIMIT ACCEL={a|round}
        RESPOND MSG="[OK] Global accel {a|round|int} mm/s2 -> Klipper (features without their own accel)"
    {% endif %}
    M117 Global accel: {a|round(0)}

[gcode_macro SET_GLOBAL_ACCEL_PERCENT]
description: Scale ALL per-feature accel limits by % (SET_GLOBAL_ACCEL_PERCENT PERCENT=150) - the global (no-feature) accel stays absolute
gcode:
    {% set p = params.PERCENT|default(100)|float %}
    {% if p >= 10 and p <= 300 %}
        # R92.1: one global regulator for the FEATURE accel limits - they keep
        # their ratio to each other, the global accel itself is NOT touched
        SAVE_VARIABLE VARIABLE=ovf_accel_pct VALUE={p|round(1)}
        {% set s = printer['gcode_macro _STATE'] %}
        {% set sv = printer['save_variables'].variables %}
        {% set c = s.current_type|default('')|string|replace('-','')|lower %}
        {% if s.mode in ['printing','paused'] and not s.ignore_overrides and c != ''
              and sv['ovf_' ~ c ~ '_on']|default(False)
              and sv['ovf_' ~ c ~ '_acc']|default(0)|float > 0 %}
            {% set fe = sv['ovf_' ~ c ~ '_acc']|float %}
            SET_VELOCITY_LIMIT ACCEL={(fe * p / 100)|round}
            RESPOND MSG="[live] Feature accels x{p|round|int}% - {c}: {fe|round|int} -> {(fe * p / 100)|round|int} mm/s2 now (global accel untouched)"
        {% else %}
            RESPOND MSG="[live] Feature accels x{p|round|int}% from the next feature on (global accel untouched)"
        {% endif %}
        M117 Feat accels x{p|round|int}%
    {% else %}
        NOTIFY TEXT="SET_GLOBAL_ACCEL_PERCENT PERCENT=<10..300>" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro SET_LIVE_VELOCITY]
description: Max velocity live (SET_LIVE_VELOCITY VELOCITY=300)
gcode:
    {% set v = params.VELOCITY|default(300)|float %}
    SET_VELOCITY_LIMIT VELOCITY={v|round}
    RESPOND MSG="[OK] max velocity {v|round|int} mm/s -> Klipper (SET_VELOCITY_LIMIT) - this is a CAP: it only slows moves that would go faster (travels). Print speeds live in the feature speeds / file"
    M117 Max vel: {v|round|int} mm/s

[gcode_macro SET_LIVE_MINIMUM_CRUISE_RATIO]
description: Minimum cruise ratio live, replaces accel_to_decel (SET_LIVE_MINIMUM_CRUISE_RATIO VALUE=0.5)
gcode:
    {% set v = params.VALUE|default(0.5)|float %}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={v}
    RESPOND MSG="[OK] minimum cruise ratio {v|round(3)} -> Klipper (SET_VELOCITY_LIMIT)"
    M117 Cruise ratio: {v|round(3)}

[gcode_macro SET_LIVE_SQUARE_CORNER]
description: Square corner velocity live (SET_LIVE_SQUARE_CORNER VALUE=5)
gcode:
    {% set v = params.VALUE|default(5)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={v}
    RESPOND MSG="[OK] square corner velocity {v|round(1)} mm/s -> Klipper (junction speed in corners - a subtle lever by design; the VISIBLE lever is minimum cruise ratio)"
    M117 Corner vel: {v|round(1)}

[gcode_macro SET_FLOW_RATE]
description: Global flow in % (SET_FLOW_RATE PERCENT=98) - live value wins over every override until the print ends
gcode:
    {% set p = params.PERCENT|default(100)|float %}
    # R73: remember it as the LIVE flow - the M221 interceptor redirects to the
    # pre-print override and APPLY_TYPE re-applies it at every feature boundary;
    # both now yield to THIS value (field log .56: 'flow could not be changed')
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE={p|round}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_flow VALUE={p|round}
    M221 S{p|round}
    RESPOND MSG="[live] Global flow {p|round|int}% - the ONE regulator: feature flows multiply on top (their % refers to this global)"
    M117 Flow: {p|round(0)}%

[gcode_macro SET_LIVE_PA_SMOOTH]
description: PA smoothing time live in 0.01 steps (SET_LIVE_PA_SMOOTH TIME=0.05)
gcode:
    {% set t = params.TIME|default(0)|float %}
    {% if t >= 0.005 and t <= 0.15 %}
        # save FIRST (the SET_PRESSURE_ADVANCE interceptor redirects file values
        # to OUR smooth time during prints - it sticks for the next prints too)
        SAVE_VARIABLE VARIABLE=ov_pa_smooth VALUE={t|round(3)}
        SAVE_VARIABLE VARIABLE=ov_pa_smooth_on VALUE=True
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_smooth VALUE={t|round(3)}
        SET_PRESSURE_ADVANCE_BASE SMOOTH_TIME={t|round(3)}
        NOTIFY TEXT="PA smoothing time from now on: {t|round(2)}s" LEVEL=ok SOUND=r2_confirm
        M117 PA smooth {t|round(2)}
    {% else %}
        NOTIFY TEXT="SET_LIVE_PA_SMOOTH TIME=<0.01..0.15>" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro SET_LIVE_PRESSURE_ADVANCE]
description: Pressure advance live (SET_LIVE_PRESSURE_ADVANCE VALUE=0.045)
gcode:
    {% set pa = params.VALUE|default(0.045)|float %}
    # save FIRST (the SET_PRESSURE_ADVANCE interceptor redirects to ov_pa
    # during prints - same value, but it sticks for the next prints too)
    SAVE_VARIABLE VARIABLE=ov_pa VALUE={pa}
    SAVE_VARIABLE VARIABLE=ov_pa_on VALUE=True
    SET_PRESSURE_ADVANCE ADVANCE={pa} SMOOTH_TIME={printer['gcode_macro _STATE'].pa_smooth}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_value VALUE={pa}
    M117 PA: {pa}

# -------------------------------------------------------------------------------------
# SET_PRESSURE_ADVANCE interceptor - files/slicers set their own PA via gcode.
# With the PA override ON it is redirected to YOUR value (like M104), so a
# sliced-in 'SET_PRESSURE_ADVANCE ADVANCE=0.08' cannot override your setting.
# -------------------------------------------------------------------------------------
# SET_RETRACTION interceptor - captures what the FILE wants (shown in the LCD as
# 'file:' hint) and redirects to your overrides when they are ON (per key).
[gcode_macro SET_RETRACTION]
rename_existing: SET_RETRACTION_BASE
description: Set retraction - captures file values, redirects to overwrites when ON
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if params.RETRACT_LENGTH is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_len VALUE={params.RETRACT_LENGTH|float}
    {% endif %}
    {% if params.RETRACT_SPEED is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_speed VALUE={params.RETRACT_SPEED|float}
    {% endif %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides
          and (sv.ov_retract_len_on|default(False) or sv.ov_retract_speed_on|default(False) or sv.ov_unretract_speed_on|default(False)) %}
        {% set wl = sv.ov_retract_len|default(0)|float     if sv.ov_retract_len_on|default(False)     else params.RETRACT_LENGTH|default(0.75)|float %}
        {% set ws = sv.ov_retract_speed|default(0)|float   if sv.ov_retract_speed_on|default(False)   else params.RETRACT_SPEED|default(35)|float %}
        {% set wu = sv.ov_unretract_speed|default(0)|float if sv.ov_unretract_speed_on|default(False) else ws %}
        RESPOND MSG="SET_RETRACTION from file -> YOUR: len {wl} / retract {ws} / unretract {wu}"
        SET_RETRACTION_BASE RETRACT_LENGTH={wl} RETRACT_SPEED={ws} UNRETRACT_SPEED={wu}
    {% else %}
        SET_RETRACTION_BASE{% if params.RETRACT_LENGTH is defined %} RETRACT_LENGTH={params.RETRACT_LENGTH}{% endif %}{% if params.RETRACT_SPEED is defined %} RETRACT_SPEED={params.RETRACT_SPEED}{% endif %}{% if params.UNRETRACT_SPEED is defined %} UNRETRACT_SPEED={params.UNRETRACT_SPEED}{% endif %}
    {% endif %}

[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: SET_PRESSURE_ADVANCE_BASE
description: Set PA - captures file values, redirects to your PA/smooth when ON
gcode:
    {% set s  = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% if params.ADVANCE is defined %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_pa VALUE={params.ADVANCE|float}
    {% endif %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and (sv.ov_pa_on|default(False) or sv.ov_pa_smooth_on|default(False)) %}
        # YOUR values win during a print: PA only with the override ON, but the
        # smoothing time ALWAYS (you set it live - a sliced-in value must not
        # silently override it)
        {% if sv.ov_pa_on|default(False) %}
            RESPOND MSG="SET_PRESSURE_ADVANCE from file: PA {params.ADVANCE|default('-')} smooth {params.SMOOTH_TIME|default('-')} -> YOUR: PA {sv.ov_pa|default(0)|float|round(3)}{% if sv.ov_pa_smooth_on|default(False) %} smooth {sv.ov_pa_smooth|default(0.04)|float|round(3)}{% endif %}"
            SET_PRESSURE_ADVANCE_BASE ADVANCE={sv.ov_pa|default(0)|float}{% if sv.ov_pa_smooth_on|default(False) %} SMOOTH_TIME={sv.ov_pa_smooth|default(0.04)|float}{% endif %}
        {% else %}
            # only the smoothing time is ours - PA stays as the file/you set it
            RESPOND MSG="SET_PRESSURE_ADVANCE smooth {params.SMOOTH_TIME|default('-')} from file -> YOUR smooth {sv.ov_pa_smooth|default(0.04)|float|round(3)}"
            SET_PRESSURE_ADVANCE_BASE SMOOTH_TIME={sv.ov_pa_smooth|default(0.04)|float}
        {% endif %}
    {% else %}
        SET_PRESSURE_ADVANCE_BASE{% if params.ADVANCE is defined %} ADVANCE={params.ADVANCE}{% endif %}{% if params.SMOOTH_TIME is defined %} SMOOTH_TIME={params.SMOOTH_TIME}{% endif %}
    {% endif %}

[gcode_macro SET_FAN_SCALE]
description: Part fan scaling in % (SET_FAN_SCALE PERCENT=80)
gcode:
    {% set p = params.PERCENT|default(100)|float %}
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_scale VALUE={(p/100)|round(3)}
    # R106 (field log .82): apply IMMEDIATELY from the file's fan value.
    # The old check (only when the fan was already spinning) left the fan
    # dead after a 0% phase - it never woke up until the file's own next
    # M106 (often a whole layer later). Rules that still win over this:
    #   - layer-1 hold (first layer = fan OFF, unchanged)
    #   - no print running / file fan unknown -> nothing to scale now,
    #     the factor applies from the file's next M106
    {% set ff = s.file_fan|default(0)|int %}
    {% set held = s.mode in ['printing','paused'] and s.layer < 2
                   and (not s.ignore_overrides or sv.first_layer_rules|default(True)) %}
    {% if printer.print_stats.state == 'printing' and ff > 0 and not held %}
        M99106 S{[ff * p / 100, 255]|min|round|int}
    {% elif printer.print_stats.state == 'printing' and ff > 0 and held %}
        RESPOND MSG="Fan scale {p|round(0)}% stored - layer 1 stays fan OFF, layer 2 gets S{[ff * p / 100, 255]|min|round|int}"
    {% elif printer.fan.speed > 0 %}
        M99106 S{(255 * p / 100)|round|int}
    {% endif %}
    M117 Fan scale: {p|round(0)}%

[gcode_macro SET_LIVE_RETRACTION]
description: Firmware retraction live (LENGTH= SPEED= UNRETRACT_SPEED= EXTRA= - omitted values stay unchanged)
gcode:
    # defaults = CURRENT values -> setting ONE parameter never clobbers the others;
    # BASE call bypasses the override interceptor (live tuning wins over overrides)
    {% set fr = printer['firmware_retraction'] if 'firmware_retraction' in printer else None %}
    {% set cl = fr.retract_length|default(0.75)|float if fr else 0.75 %}
    {% set cs = fr.retract_speed|default(35.0)|float if fr else 35.0 %}
    {% set cu = fr.unretract_speed|default(cs)|float if fr else cs %}
    {% set ce = fr.unretract_extra_length|default(0.0)|float if fr else 0.0 %}
    {% set l = params.LENGTH|default(cl)|float %}
    {% set sp = params.SPEED|default(cs)|float %}
    {% set us = params.UNRETRACT_SPEED|default(cu)|float %}
    {% set ex = params.EXTRA|default(ce)|float %}
    SET_RETRACTION_BASE RETRACT_LENGTH={l} RETRACT_SPEED={sp} UNRETRACT_SPEED={us} UNRETRACT_EXTRA_LENGTH={ex}
    # live mirror: the LCD reads THESE values - setting one parameter never shows
    # stale config values for the others (and never resets them on re-entry)
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_len VALUE={l}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_spd VALUE={sp}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_unret VALUE={us}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ret_unretx VALUE={ex}
    M117 Retract {l}mm @{sp} / deretr +{ex}

# ---------------------------- ironing live ----------------------------------------------
[gcode_macro SET_IRONING_FLOW]
description: Ironing flow %% while ironing runs (R58)
gcode:
