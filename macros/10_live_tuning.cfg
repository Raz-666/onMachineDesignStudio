# =====================================================================================
#  10_live_tuning.cfg - change EVERYTHING during a print (LCD + Mainsail)
#  -----------------------------------------------------------------------------------
#  HOW PER-FEATURE SPEED WORKS (outer wall, support, ironing ...):
#  The slicer writes comments like ";TYPE:Outer wall" into the file. Our post-
#  processing script (slicer/) converts them into "APPLY_TYPE TYPE=..." commands.
#  At every feature boundary APPLY_TYPE then sets:
#     - M220 (speed factor of this feature)
#     - SET_VELOCITY_LIMIT ACCEL (acceleration of this feature, if set)
#     - M221 (flow - only ironing gets its own flow)
#     - ironing temperature override (optional, restored afterwards)
#
#  IMPORTANT FOR OLD FILES (no APPLY_TYPE markers): the setters below apply the
#  new factor IMMEDIATELY via M220 when no feature type is known - you always
#  get instant feedback, even with legacy files.
# =====================================================================================

# -------------------------------------------------------------------------------------
# _LIVE_RESET - all live values to neutral (called by PRINT_START)
# -------------------------------------------------------------------------------------
[gcode_macro _LIVE_RESET]
description: Reset all live tuning values to default (100%/off)
gcode:
    # R159 (.119) FIELD FIX: give the MACHINE limits back too. Files set their
    # own M204 (a slow vase profile: S500) and M220/M221 - without this reset
    # the accel stuck at the file's value FOREVER after the print: the nozzle
    # wipe crawled, every idle motion ran in slow motion, and no live value
    # was set to push it back ('all movements way too slow'). Restore from the
    # printer's own config (fallback 3000); called at start (clean baseline),
    # end and cancel.
    {% set _acc0 = printer.configfile.settings.printer.max_accel|default(0)|float %}
    SET_VELOCITY_LIMIT ACCEL={_acc0 if _acc0 > 0 else 3000}
    M220 S100
    M221 S100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_outer_wall VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_inner_wall VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_infill VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_solid VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_support VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_ironing VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=f_fan_scale VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_outer_wall VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_inner_wall VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_infill VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_solid VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_support VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=a_ironing VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=flow VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_flow VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=live_accel VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE=-1
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=g_speed_clean VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=l1_speed_user VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_flow VALUE=100
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_temp_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=ironing_prev_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=total_layers VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=current_type VALUE='""'
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=absent_features VALUE=[]
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_marks VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_max VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=layer_z_acc VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_desync VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_next_armed_runout VALUE=False
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_pa VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_len VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=file_retract_speed VALUE=0
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_planned_reason VALUE='""'
    M220 S100
    M221 S100

# -------------------------------------------------------------------------------------
# APPLY_TYPE - called at every feature boundary (by the PP script / LAYER marker)
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# _SYNC_OV_FEAT - R182: mirror the feature/fan/PA overrides into _STATE.
#   The hot paths (APPLY_TYPE per feature block, M106 per fan command) NEVER
#   touch save_variables anymore - the .131a field log: a labels print with
#   51 objects fired dozens of full variable-set reads per layer (including
#   the huge sd_tree) and the Pi Zero 2 W walked into 'MCU shutdown: Timer
#   too close' six minutes in, on the second object skip. Same class as the
#   R167 M204 fix. Runs on every override change, at print start (_FILE_INFO)
#   and once per layer (LAYER_MARK safety net) - raw console SAVE_VARIABLE
#   users see their change one layer later, menu users immediately.
#   Values are TUPLES/scalars (no braces, no spaces - the '#' comment cut,
#   the gcode parameter splitter and literal_eval all stay safe).
# -------------------------------------------------------------------------------------
[gcode_macro _SYNC_OV_FEAT]
description: Refresh the _STATE override mirrors from save_variables (R182, internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set _fc182 = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
    {% for c in _fc182 %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fov_{c|lower} VALUE={(sv['ovf_' ~ c ~ '_on']|default(False))|int},{sv['ovf_' ~ c ~ '_spd']|default(100.0)|float},{sv['ovf_' ~ c ~ '_acc']|default(0.0)|float},{sv['ovf_' ~ c ~ '_flw']|default(100.0)|float},{sv['ovf_' ~ c ~ '_pa']|default(0.0)|float}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_acc_pct VALUE={sv.ovf_accel_pct|default(100.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_acc VALUE={sv.ov_accel|default(0.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_acc_on VALUE={sv.ov_accel_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_pa VALUE={sv.ov_pa|default(0.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_pa_on VALUE={sv.ov_pa_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_flow VALUE={sv.ov_flow|default(100.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_flow_on VALUE={sv.ov_flow_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_iron_flow VALUE={sv.ov_ironing_flow|default(100.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_iron_flow_on VALUE={sv.ov_ironing_flow_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_fan_clamp_on VALUE={sv.ov_fan_clamp_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_fan_bridge VALUE={sv.ov_fan_bridge|default(0.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_fan_min VALUE={sv.ov_fan_min|default(0.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_fan_max VALUE={sv.ov_fan_max|default(100.0)|float}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_flr VALUE={sv.first_layer_rules|default(True)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_shp_on VALUE={sv.ovf_shaper_off_on|default(False)}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fova_shp_feat VALUE='"{sv.ovf_shaper_off_feat|default('wallouter')}"'

# -------------------------------------------------------------------------------------
# _SET_PA - R182: the ONE funnel for pressure advance. A value that already IS
#   active is not re-sent - Klipper's '// pressure_advance' echo appeared 3-5
#   times per feature block in the .131a field log (the labels flood) - and
#   pa_last stays honest for the next comparison. SMOOTH_TIME rides along.
# -------------------------------------------------------------------------------------
[gcode_macro _SET_PA]
description: Set PA once - repeat values are swallowed (R182, internal)
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if params.ADVANCE is defined %}
        {% if params.ADVANCE|float != s.pa_last|default(-1)|float %}
            SET_PRESSURE_ADVANCE_BASE ADVANCE={params.ADVANCE}{% if params.SMOOTH_TIME is defined %} SMOOTH_TIME={params.SMOOTH_TIME}{% endif %}
            SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_last VALUE={params.ADVANCE|float}
        {% elif params.SMOOTH_TIME is defined %}
            SET_PRESSURE_ADVANCE_BASE SMOOTH_TIME={params.SMOOTH_TIME}
        {% endif %}
    {% elif params.SMOOTH_TIME is defined %}
        SET_PRESSURE_ADVANCE_BASE SMOOTH_TIME={params.SMOOTH_TIME}
    {% endif %}

[gcode_macro APPLY_TYPE]
description: Feature switch - applies YOUR per-feature overrides on top of the CLEAN global factor (never touches it); markers injected by the post-processor into every file
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set ty = params.TYPE|default('')|string|upper %}
    {% set code = ty|replace('-','')|lower %}
    {% set _prev_ty167 = s.current_type|default('')|string|upper %}
    # R182 (.131a field log - the labels MCU shutdown): this macro fires per
    # feature block - a labels file with 51 objects sends dozens per layer.
    # It NEVER touches save_variables anymore (a full read of the huge
    # variable set per marker was the Timer-too-close chain, see the R167
    # M204 note): everything comes from the small _STATE mirrors (fov_/fova_
    # tuples + scalars), refreshed by _SYNC_OV_FEAT on every override
    # change, at print start and once per layer (LAYER_MARK safety net).
    {% set _fv182 = s['fov_' ~ code]|default((0, 100.0, 0.0, 100.0, 0.0)) %}
    {% set _fon182 = _fv182[0]|int == 1 %}
    {% set _fspd182 = _fv182[1]|float %}
    {% set _facc182 = _fv182[2]|float %}
    {% set _fflw182 = _fv182[3]|float %}
    {% set _fpa182 = _fv182[4]|float %}
    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=current_type VALUE='"{ty}"'
    # R167 (.125 field log): the bridge fan boost used to sit in the M106
    # interceptor - but files send M106 at the LAYER START, never at the
    # bridge itself, so the boost never fired ('nothing changes at
    # bridges'). It now fires HERE, at the feature boundary: entering a
    # BRIDGE section lifts the fan, leaving it restores the file value
    # (scale/hold/clamp applied - the same math as the M106 interceptor).
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides
          and printer.print_stats.state == 'printing'
          and not (s.layer < 2 and s.fova_flr|default(True)) %}
        {% if ty == 'BRIDGE' and s.fova_fan_clamp_on|default(False)
              and s.fova_fan_bridge|default(0)|float > 0 %}
            {% set fbr167 = (s.fova_fan_bridge|float * 255 / 100)|round|int %}
            M99106 S{[fbr167, 255]|min}
            RESPOND MSG="[Fan] BRIDGE boost S{[fbr167,255]|min} - back to the file value when the bridge ends"
        {% elif _prev_ty167 == 'BRIDGE' and ty != 'BRIDGE' %}
            {% set ff167 = s.file_fan|default(0)|int %}
            {% set sc167 = (ff167 * s.f_fan_scale|default(1)|float)|round|int
                           if ff167 > 0 else 0 %}
            {% if ff167 > 0 and s.f_fan_hold|default(0)|float > 0 %}
                {% set sc167 = (s.f_fan_hold|float * 255 / 100)|round|int %}
            {% endif %}
            {% if ff167 > 0 and s.fova_fan_clamp_on|default(False) %}
                {% set fmin167 = (s.fova_fan_min|default(0)|float * 255 / 100)|round|int %}
                {% set fmax167 = (s.fova_fan_max|default(100)|float * 255 / 100)|round|int %}
                {% if fmax167 > 255 %}{% set fmax167 = 255 %}{% endif %}
                {% if sc167 < fmin167 %}{% set sc167 = fmin167 %}{% endif %}
                {% if sc167 > fmax167 %}{% set sc167 = fmax167 %}{% endif %}
            {% endif %}
            M99106 S{[sc167, 255]|min if ff167 > 0 else 0}
        {% endif %}
    {% endif %}
    {% if s.mode in ['printing','paused'] and not s.ignore_overrides and code != '' %}
        # ---- R59: CLEAN global separation (field log .42: 75%% brake x 80%% wall
        #      compounded segment by segment down to 19%%!). g_speed_clean = the
        #      one global regulator (SET_GLOBAL_SPEED / L1 brake / file M220).
        #      A feature multiplies ON TOP of it for its own segments only - via
        #      the BASE command M99220 directly, so the global value itself is
        #      never touched. Global on, feature off -> file speed x global 1:1.
        {% set clean = s.g_speed_clean|default(100)|float %}
        {% set codes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim','overhangperim','internalbridge','primetower','custom','travel','c1','c2','c3','c4','c5','c6','c7','c8','c9'] %}
        {% if code == 'travel' %}
            # R121: travel segments (markers come from the Pre-Print travel
            # fix). The percent rides on top of the file's - or the fixed -
            # travel speed; accel is absolute. NO respond here: travels fire
            # hundreds of times per layer, the console would drown.
            {% if _fon182 %}
                M99220 S{(clean * _fspd182 / 100)|round}
                {% if _facc182 > 0 %}
                    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={_facc182}
                    SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
                    M99204 S{_facc182|round}
                {% endif %}
            {% else %}
                M99220 S{clean|round}
            {% endif %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
        {% elif code in codes and _fon182
              and code|upper not in s.absent_features|default([]) %}
            {% set spd = _fspd182 %}
            {% set acc_out = 0.0 %}
            {% set pa_out = 0.0 %}
            {% set _parestro182 = False %}
            {% set apct = s.fova_acc_pct|default(100)|float %}
            {% set afe = _facc182 %}
            M99220 S{(clean * spd / 100)|round}
            {% if afe > 0 %}
                # R92.1: feature accel = hard limit; the global percent scaler
                # (SET_GLOBAL_ACCEL_PERCENT) scales ALL feature limits in the
                # same ratio - the global (no-feature) accel stays absolute
                {% set acc_out = (afe * apct / 100)|float %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={acc_out}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE={acc_out}
                M99204 S{acc_out|round}
            {% elif s.live_accel|default(0)|float > 0 %}
                {% set acc_out = s.live_accel|float %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={acc_out}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
                M99204 S{acc_out|round}
            {% elif s.fova_acc_on|default(False) and s.fova_acc|default(0)|float > 0 %}
                {% set acc_out = s.fova_acc|float %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={acc_out}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
                M99204 S{acc_out|round}
            {% endif %}
            # ---- R62/R92.1: per-feature FLOW - the %% ALWAYS refers to the
            #      GLOBAL flow (the one regulator): eff = global x feature,
            #      e.g. global 98%% x feature 110%% = 107.8%%. Features never
            #      touch the global itself. R73: a LIVE flow set by the user
            #      IS the global here - the re-apply keeps it (never wiped).
            {% set liveflw = s.live_flow|default(0)|float %}
            {% set gflw = liveflw if liveflw > 0 else (s.fova_flow|default(100)|float if s.fova_flow_on|default(False) else 100.0) %}
            {% set fflw = _fflw182 %}
            {% if code == 'ironing' and fflw == 100 and s.fova_iron_flow_on|default(False) %}
                {% set fflw = s.fova_iron_flow|default(100)|float %}
            {% endif %}
            M99221 S{(gflw * fflw / 100)|round}
            # ---- R111: per-feature PRESSURE ADVANCE (0 = off). Applied at the
            #      feature start; when the feature ends the global PA returns
            #      (your override, else the file's own, else the extruder's).
            #      R182: every send goes through the _SET_PA funnel - a value
            #      that is already active is not re-sent (the // pressure_
            #      advance echo flood dies at the source).
            {% set fpa = _fpa182 %}
            {% if fpa > 0 %}
                {% set pa_out = fpa %}
                _SET_PA ADVANCE={fpa}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=True
            {% elif s.fova_pa_on|default(False) and s.fova_pa|default(0)|float > 0 %}
                # R115 (.87 field log): no own value, but YOUR global PA is active -
                # apply it explicitly at the boundary so every feature SHOWS the
                # PA it runs at. Truth: the global rules - tune per feature in
                # Live/Pre-Print > Features, the PA input starts at the global.
                {% set pa_out = s.fova_pa|float %}
                _SET_PA ADVANCE={pa_out}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
            {% elif s.pa_feat_active|default(False) %}
                {% set rpa = s.fova_pa|default(0)|float if s.fova_pa_on|default(False) else s.file_pa|default(0)|float if s.file_pa|default(0)|float > 0 else printer.extruder.pressure_advance|default(0)|float %}
                {% set pa_out = rpa|round(4)|float %}
                {% set _parestro182 = True %}
                {% if rpa > 0 %}
                    _SET_PA ADVANCE={rpa|round(4)}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
            {% endif %}
            # ---- R111: input shaper OFF for one configurable feature (the
            #      classic surface trick: no shaper lag on slow outer walls).
            #      Frequencies are saved on the way out and restored when the
            #      feature ends (type stays untouched). Guarded for printers
            #      without [input_shaper].
            {% set shp111 = s.fova_shp_on|default(False) and s.fova_shp_feat|default('wallouter') == code %}
            {% if shp111 and not s.shaper_off_active|default(False) and 'input_shaper' in printer %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_saved_fx VALUE={printer.input_shaper.shaper_freq_x|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_saved_fy VALUE={printer.input_shaper.shaper_freq_y|default(0)|float}
                SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=True
                RESPOND MSG="[Feature] {code}: input shaper OFF (corners sharpen) - back on when it ends"
            {% elif s.shaper_off_active|default(False) and not shp111 %}
                SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
                RESPOND MSG="[Feature] input shaper back ON ({s.shaper_saved_fx|default(0)|float|round(1)}/{s.shaper_saved_fy|default(0)|float|round(1)} Hz)"
            {% endif %}
            # ---- R182: the echo gate. A labels file re-states the SAME feature
            #      values for every object on every layer - the console flood
            #      (3-5 RESPOND lines + the PA echo, dozens per layer for
            #      hours) was half of the Timer-too-close shutdown. The
            #      commands above ALWAYS run (they must - other features
            #      changed the factors in between); only the ECHOES wait for
            #      a real change, per feature. Reset per print in _FILE_INFO.
            {% set _sig182 = (clean|round(2)) ~ '|' ~ (spd|round(2)) ~ '|' ~ (acc_out|round(1)) ~ '|' ~ (gflw|round(2)) ~ '|' ~ (fflw|round(2)) ~ '|' ~ (pa_out|round(4)) %}
            {% if s['fecho_' ~ code]|default('') != _sig182 %}
                RESPOND MSG="[Feature] {code}: speed {spd|round|int}% x global {clean|round|int}% = {(clean * spd / 100)|round|int}% (segments print at file speed x this)"
                {% if afe > 0 %}
                    RESPOND MSG="[Feature] {code}: accel {afe|round|int} mm/s2 x {apct|round|int}% = {acc_out|round|int} mm/s2 (feature limit, beats the global)"
                {% endif %}
                {% if fflw != 100 or gflw != 100 %}
                    RESPOND MSG="[Feature] {code}: flow {fflw|round|int}% x global {gflw|round|int}% = {(gflw * fflw / 100)|round|int}%"
                {% endif %}
                {% if _parestro182 %}
                    RESPOND MSG="[Feature] PA back to {pa_out|round(3)} (global)"
                {% elif pa_out > 0 and fpa > 0 %}
                    RESPOND MSG="[Feature] {code}: PA {pa_out|round(3)} (feature PA - global returns when it ends)"
                {% elif pa_out > 0 %}
                    RESPOND MSG="[Feature] {code}: PA {pa_out|round(3)} (your global - every feature starts at it, its own value wins once you set one)"
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=fecho_{code|lower} VALUE='"{_sig182}"'
            {% endif %}
        {% else %}
            # feature without an override (or unknown type): pure global factor
            M99220 S{clean|round}
            M99221 S{s.live_flow|default(0)|float|round if s.live_flow|default(0)|float > 0 else (s.fova_flow|default(100)|float|round if s.fova_flow_on|default(False) else 100)}
            {% if s.live_accel|default(0)|float > 0 %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={s.live_accel|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
                M99204 S{s.live_accel|float|round}
            {% elif s.fova_acc_on|default(False) and s.fova_acc|default(0)|float > 0 %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=m204_last VALUE={s.fova_acc|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=feat_acc_active VALUE=0
                M99204 S{s.fova_acc|float|round}
            {% endif %}
            # R111: leaving a feature that had PA / shaper-off -> restore
            {% if s.pa_feat_active|default(False) %}
                {% set rpa = s.fova_pa|default(0)|float if s.fova_pa_on|default(False) else s.file_pa|default(0)|float if s.file_pa|default(0)|float > 0 else printer.extruder.pressure_advance|default(0)|float %}
                {% if rpa > 0 %}
                    _SET_PA ADVANCE={rpa|round(4)}
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pa_feat_active VALUE=False
            {% endif %}
            {% if s.shaper_off_active|default(False) %}
                SET_INPUT_SHAPER SHAPER_FREQ_X={s.shaper_saved_fx|default(0)|float} SHAPER_FREQ_Y={s.shaper_saved_fy|default(0)|float}
                SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=shaper_off_active VALUE=False
            {% endif %}
        {% endif %}
    {% endif %}

