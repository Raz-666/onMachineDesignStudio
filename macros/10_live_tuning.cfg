# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V10_LIVE]
description: Version sentinel of 10_live_tuning.cfg (internal)
gcode:

# -------------------------------------------------------------------------------------
# PARAM_SOURCES - R79: WHERE does every value come from? file | your pre-print
# override | LIVE in Klipper right now. The field log .62 read: 'never really
# clear where which parameter comes from - file info shows one thing, Pre-Print
# another, Live Tuning a third'. One command = the whole truth per parameter.
# LCD: Live Tuning > Sources. Rule of thumb: AS LEGACY applies your overrides
# at the start (Live then shows them as LIVE) - AS SLICED runs the file 1:1
# (Live shows the file/printer.cfg values).
# -------------------------------------------------------------------------------------
[gcode_macro PARAM_SOURCES]
description: Value provenance - file vs your override vs LIVE now, for every parameter
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fr = printer['firmware_retraction'] if 'firmware_retraction' in printer else None %}
    RESPOND MSG="== VALUE SOURCES: file | YOUR pre-print override | LIVE in Klipper now =="
    RESPOND MSG="Mode: {s.mode} | AS SLICED 1:1 (overrides off): {s.ignore_overrides} | first-layer rules (L1 temps + fan off, also 1:1): {'ON' if sv.first_layer_rules|default(True) else 'off'}"
    RESPOND MSG="Speed global: file M220 {s.file_speed|default(100)|float|round|int}% | LIVE {(printer.gcode_move.speed_factor|default(1)*100)|round|int}% - THE one global regulator; per-feature % rides on top of it"
    RESPOND MSG="Flow: file {s.file_flow|default(100)|float|round|int}% | override {sv.ov_flow|default(100)|float|round|int}% {'ON' if sv.ov_flow_on|default(False) else 'off'} | LIVE {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}%"
    RESPOND MSG="PA: file {s.file_pa|default(0)|float|round(4)} | override {sv.ov_pa|default(0)|float|round(4)} {'ON' if sv.ov_pa_on|default(False) else 'off'} | LIVE {printer.extruder.pressure_advance|default(0)|float|round(4)}"
    RESPOND MSG="PA smooth: override {sv.ov_pa_smooth|default(0.04)|float|round(3)} {'ON' if sv.ov_pa_smooth_on|default(False) else 'off'} | LIVE {printer.extruder.smooth_time|default(0.04)|float|round(3)}"
    RESPOND MSG="Accel: file M204 {s.file_accel|default(0)|float|round|int} | override {sv.ov_accel|default(0)|float|round|int} {'ON' if sv.ov_accel_on|default(False) else 'off'} | live set {s.live_accel|default(0)|float|round|int} | LIVE Klipper {printer.toolhead.max_accel|default(0)|float|round|int}"
    RESPOND MSG="Velocity: printer.cfg | override {sv.ov_velocity|default(0)|float|round|int} {'ON' if sv.ov_velocity_on|default(False) else 'off'} | LIVE {printer.toolhead.max_velocity|default(0)|float|round|int} (files never set this - it caps every move)"
    RESPOND MSG="Min cruise ratio: printer.cfg | override {sv.ov_min_cruise|default(0)} {'ON' if sv.ov_min_cruise_on|default(False) else 'off'} | LIVE {printer.toolhead.minimum_cruise_ratio|default(0.5)|float|round(3)}"
    RESPOND MSG="Corner velocity: printer.cfg | override {sv.ov_square_corner|default(0)|float|round(1)} {'ON' if sv.ov_square_corner_on|default(False) else 'off'} | LIVE {printer.toolhead.square_corner_velocity|default(5)|float|round(1)}"
    RESPOND MSG="Retraction: file {s.file_retract_len|default(0)|float|round(2)}mm@{s.file_retract_speed|default(0)|float|round|int}mm/s | LIVE {fr.retract_length|default(0)|float|round(2)}mm@{fr.retract_speed|default(0)|float|round|int}mm/s (live setters win over file SET_RETRACTION)"
    RESPOND MSG="Fan: file S{s.file_fan|default(0)|float|round|int} | scale {s.f_fan_scale|default(1)|float*100|round|int}% | LIVE {printer.fan.speed|default(0)|float*100|round|int}% | layer 1 = OFF ({'rule on' if sv.first_layer_rules|default(True) else 'off'})"
    RESPOND MSG="Temps L1/L2 material {s.file_material|default('?')}: file {s.file_hotend_first|default(0)|float|round|int}/{s.file_hotend_after|default(0)|float|round|int}C bed {s.file_bed|default(0)|float|round|int}/{s.file_bed_after|default(0)|float|round|int}C | LIVE hotend {printer.extruder.target|float|round|int}C bed {printer.heater_bed.target|float|round|int}C"
    {% if s.absent_features|default([]) %}
        RESPOND MSG="Features parked (not in this file, cannot apply): { s.absent_features|join(', ')|lower }"
    {% endif %}
    RESPOND MSG="Features: use Live > Features for every type (speed % / flow % / accel, ON/OFF per feature)"
    M117 Sources -> console
