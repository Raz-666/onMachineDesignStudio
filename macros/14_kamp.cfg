# =====================================================================================
#  14_kamp.cfg - KAMP compatibility (Klipper-Adaptive-Meshing-Purging)
#  -----------------------------------------------------------------------------------
#  WHAT IS KAMP? https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#  Current KAMP layout (folder "Configuration/"):
#    - Adaptive_Meshing.cfg : overrides BED_MESH_CALIBRATE (rename: _BED_MESH_CALIBRATE)
#                             and limits the mesh to the object area automatically
#    - LINE_PURGE           : adaptive purge line beside the print area
#    - VORON_PURGE          : adaptive Voron logo purge
#    - SMART_PARK           : parks the head near the print area for pre-heating
#
#  HOW IT PLAYS WITH THIS SYSTEM:
#    - Mesh: if KAMP is installed & enabled we let KAMP do the adaptive mesh
#      (it intercepts BED_MESH_CALIBRATE). Afterwards we STILL save it as the
#      ONE profile 'r2' -> KAMP-adaptive when the file has object data!
#      If you disable KAMP mesh we call _BED_MESH_CALIBRATE (bypassing the KAMP
#      override) with Klipper's native ADAPTIVE=1.
#    - Purge: instead of our simple _PRIME_LINE, KAMP's LINE_PURGE/VORON_PURGE runs
#      (only if object data exists - otherwise fallback to our own line).
#    - Park: optional SMART_PARK after homing (head waits near the print while
#      heating). PAUSE parking stays OURS (collision-aware + anti-ooze).
#
#  DETECTION (all automatic):
#    'gcode_macro _KAMP_Settings' in printer      -> KAMP installed
#    'gcode_macro BED_MESH_CALIBRATE' in printer  -> KAMP mesh override active
#    'gcode_macro LINE_PURGE'/'VORON_PURGE'/...   -> that feature is included
#  Without KAMP everything works exactly as before (native ADAPTIVE + own prime line).
# =====================================================================================

# =====================================================================================
#  _CALIBRATE_MESH_PROFILE - CENTRAL bed mesh with automatic dispatch
#  (KAMP > native adaptive > full bed). Used by print start (08_) and maintenance (12_).
#    _CALIBRATE_MESH_PROFILE PROFILE=mesh_pla
# =====================================================================================
[gcode_macro _CALIBRATE_MESH_PROFILE]
description: Calibrate bed mesh (KAMP/native/full) and save as profile 'r2'
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set profile = params.PROFILE|default('mesh_default') %}
    # ---- detect environment --------------------------------------------------------------
    {% set kamp_installed = 'gcode_macro _KAMP_Settings' in printer %}
    {% set kamp_override  = kamp_installed and 'gcode_macro BED_MESH_CALIBRATE' in printer %}
    {% set objects = 'exclude_object' in printer and printer['exclude_object'].objects|length > 0 %}
    {% set use_kamp = kamp_installed and sv.kamp_mesh|default(True) %}
    {% set use_adaptive = sv.mesh_adaptive|default(True) and objects %}
    # ---- determine kind (announcement only) ------------------------------------------------
    # R75: honest wording - 'KAMP adaptive' is only true WITH object data. A held
    # file at position 0 has not run its EXCLUDE_OBJECT_DEFINE lines yet - the
    # watcher replays them at selection (see r2_postproc.py) so KAMP CAN be
    # adaptive before the print. Without objects it is really a full-bed mesh.
    {% if use_kamp and objects %}   {% set kind = 'KAMP adaptive' %}
    {% elif use_kamp %}             {% set kind = 'full bed (file has no object data)' %}
    {% elif use_adaptive %}         {% set kind = 'native adaptive' %}
    {% else %}                      {% set kind = 'full bed' %}
    {% endif %}
    NOTIFY TEXT="Bed mesh {profile} ({kind})..." LEVEL=info LED=leveling SOUND=r2_leveling
    M117 Meshing: {profile}
    # ---- R75 MCU-shutdown hardening (field log .58, Pi Zero host) ---------------------------
    # [bed_mesh] speed: 300 here - the mesh travels are the FASTEST continuous
    # motion of the entire print (faster than any slicer travel) and exactly
    # where the host fell behind ('Timer too close'). Cap the travel speed
    # while meshing, restore right after. 'Pre-Print > Mesh travel' / console:
    # SET_MESH_TRAVEL SPEED=0 turns the cap off.
    {% set cap = sv.mesh_travel|default(120)|float %}
    {% set vmax = printer.toolhead.max_velocity|default(0)|float %}
    {% if cap > 0 and vmax > 0 and cap < vmax %}
        SET_VELOCITY_LIMIT VELOCITY={cap|round}
        RESPOND MSG="[i] Mesh moves capped at {cap|round|int}mm/s (host-friendly, was {vmax|round|int}) - restored after the mesh"
    {% endif %}
    # ---- 1) KAMP path -----------------------------------------------------------------------
    {% if use_kamp %}
        # KAMP intercepts BED_MESH_CALIBRATE and limits it to the object area
        # (margin/fuzz live in KAMP_Settings.cfg). KAMP does not forward PROFILE=,
        # so we save it ourselves as the r2 profile afterwards.
        BED_MESH_CALIBRATE PROFILE={profile}
    # ---- 2) native adaptive --------------------------------------------------------------------
    {% elif use_adaptive %}
        {% if kamp_override %}
            # KAMP override present but disabled -> bypass it via its renamed command:
            _BED_MESH_CALIBRATE PROFILE={profile} ADAPTIVE=1 ADAPTIVE_MARGIN=5
        {% else %}
            BED_MESH_CALIBRATE PROFILE={profile} ADAPTIVE=1 ADAPTIVE_MARGIN=5
        {% endif %}
    # ---- 3) full bed -----------------------------------------------------------------------------
    {% else %}
        {% if kamp_override %}
            _BED_MESH_CALIBRATE PROFILE={profile}
        {% else %}
            BED_MESH_CALIBRATE PROFILE={profile}
        {% endif %}
    {% endif %}
    {% if cap > 0 and vmax > 0 and cap < vmax %}
        # give the velocity limit back (the print itself keeps its own speeds)
        SET_VELOCITY_LIMIT VELOCITY={vmax|round}
    {% endif %}
    # ---- save + bookkeeping (our material logic) ---------------------------------------------------
    BED_MESH_PROFILE SAVE={profile}
    {% if sv.mesh_last_profile|default('') != profile %}
        # R75: only write when it actually changes - a SAVE_VARIABLE rewrites
        # the whole variables.cfg, never do that mid-start for nothing
        SAVE_VARIABLE VARIABLE=mesh_last_profile VALUE='"{profile}"'
    {% endif %}
    {% if printer['gcode_macro _STATE'].mode in ['idle','finished'] %}
        # idle: persist ONLY on request. Without SAVE_CONFIG a mesh profile is
        # SESSION-ONLY (gone after the next Klipper restart) - that is the new
        # default: no surprise restarts. Toggle 'Save after print' to automate.
        {% if printer['save_variables'].variables.mesh_auto_save|default(False) %}
            NOTIFY TEXT="Mesh {profile} saved ({kind}) - saving config (Klipper restarts once)" LEVEL=ok SOUND=r2_leveled
            SAVE_CONFIG
        {% else %}
            NOTIFY TEXT="Mesh {profile} saved ({kind}) - session only (no restart). Permanent: 'Save after print' ON or System > Save config" LEVEL=ok SOUND=r2_leveled
        {% endif %}
    {% else %}
        # during a print: NEVER restart - keep it for this session, persist after print end
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=mesh_saved_pending VALUE=True
        NOTIFY TEXT="Mesh {profile} saved ({kind}, session) - persisted after the print" LEVEL=ok SOUND=r2_leveled
    {% endif %}

# =====================================================================================
#  _PURGE_SMART - purge dispatch: KAMP purge if available, else our own prime line
#    _PURGE_SMART LAYER_HEIGHT=0.2
# =====================================================================================
[gcode_macro _PURGE_SMART]
description: Purge: KAMP LINE/VORON_PURGE if active, else own prime line
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set lh = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set kamp_installed = 'gcode_macro _KAMP_Settings' in printer %}
    # ---- R45 probe safety: KAMP's LINE purge is NOT probe-offset aware. With a
    #      side-mounted probe (|x_offset| > 10mm) it can leave the bed -> our line.
    {% set probe_da = 'probe' in printer.configfile.settings %}
    {% set px = printer.configfile.settings.probe.x_offset|default(0)|float if probe_da else 0.0 %}
    _PROBE_STOW
    {% set objects = 'exclude_object' in printer and printer['exclude_object'].objects|length > 0 %}
    {% set line_da  = 'gcode_macro LINE_PURGE' in printer %}
    {% set voron_da = 'gcode_macro VORON_PURGE' in printer %}
    {% if kamp_installed and objects and sv.kamp_purge|default(True) %}
        # ---- KAMP purge (amount/height/margin live in KAMP_Settings.cfg) ---------------------
        {% if sv.kamp_purge_type|default('LINE')|upper == 'VORON' and voron_da %}
            NOTIFY TEXT="Purge: KAMP Voron logo" LEVEL=info
            _NOZZLE_WIPE
            VORON_PURGE
        {% elif line_da and px|abs <= 10 %}
            NOTIFY TEXT="Purge: KAMP adaptive line" LEVEL=info
            _NOZZLE_WIPE
            LINE_PURGE
        {% elif line_da %}
            RESPOND MSG="[!] KAMP line purge skipped (probe x-offset {px|round(0)}mm not bed-aware) - probe-safe prime line instead"
            _PRIME_LINE LAYER_HEIGHT={lh}
        {% elif voron_da %}
            NOTIFY TEXT="Purge: KAMP Voron logo (line purge not included)" LEVEL=info
            _NOZZLE_WIPE
            VORON_PURGE
        {% else %}
            # KAMP settings exist but no purge macro included -> own line
            NOTIFY TEXT="KAMP purge not included -> using own prime line" LEVEL=warn
            _PRIME_LINE LAYER_HEIGHT={lh}
        {% endif %}
    {% else %}
        # ---- our own collision-free prime line (08_print_start_stop.cfg) ---------------------
        _PRIME_LINE LAYER_HEIGHT={lh}
    {% endif %}
    # R54: fan OFF after every purge - the print starts with a clean fan state
    # (field bug: PRINT_END's cool-down fan (100% for 30s) was still running when
    # the NEXT print started -> 'always starts with 100% fan')
    M99106 S0

# =====================================================================================
#  Switches (LCD 'Maintenance > KAMP' & Mainsail). Without KAMP installed they
#  just say so politely and change nothing.
# =====================================================================================
[gcode_macro TOGGLE_KAMP_MESH]
description: KAMP adaptive mesh ON/OFF (off = Klipper native adaptive)
gcode:
    {% if 'gcode_macro _KAMP_Settings' in printer %}
        {% set on = not printer['save_variables'].variables.kamp_mesh|default(True) %}
        SAVE_VARIABLE VARIABLE=kamp_mesh VALUE={on}
        NOTIFY TEXT="KAMP mesh: {'ON' if on else 'OFF (native adaptive)'}" LEVEL=ok SOUND=r2_click
    {% else %}
        NOTIFY TEXT="KAMP is not installed (see INSTALL.md)" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro TOGGLE_KAMP_PURGE]
description: KAMP purge ON/OFF (off = own prime line)
gcode:
    {% if 'gcode_macro _KAMP_Settings' in printer %}
        {% set on = not printer['save_variables'].variables.kamp_purge|default(True) %}
        SAVE_VARIABLE VARIABLE=kamp_purge VALUE={on}
        NOTIFY TEXT="KAMP purge: {'ON' if on else 'OFF (own prime line)'}" LEVEL=ok SOUND=r2_click
    {% else %}
        NOTIFY TEXT="KAMP is not installed (see INSTALL.md)" LEVEL=warn SOUND=r2_notice
    {% endif %}

[gcode_macro SET_KAMP_PURGE_TYPE]
description: Choose KAMP purge type: TYPE=LINE or TYPE=VORON
gcode:
    {% set typ = params.TYPE|default('LINE')|string|upper %}
    {% if typ in ['LINE','VORON'] %}
        SAVE_VARIABLE VARIABLE=kamp_purge_type VALUE='"{typ}"'
        NOTIFY TEXT="KAMP purge type: {typ}" LEVEL=ok SOUND=r2_click
    {% else %}
        NOTIFY TEXT="TYPE=LINE or TYPE=VORON" LEVEL=warn
    {% endif %}

[gcode_macro TOGGLE_KAMP_SMART_PARK]
description: KAMP Smart Park after homing ON/OFF
gcode:
    {% if 'gcode_macro _KAMP_Settings' in printer %}
        {% set on = not printer['save_variables'].variables.kamp_smart_park|default(False) %}
        SAVE_VARIABLE VARIABLE=kamp_smart_park VALUE={on}
        NOTIFY TEXT="KAMP Smart Park: {'ON' if on else 'OFF'}" LEVEL=ok SOUND=r2_click
    {% else %}
        NOTIFY TEXT="KAMP is not installed (see INSTALL.md)" LEVEL=warn SOUND=r2_notice
    {% endif %}

# -------------------------------------------------------------------------------------
# KAMP_STATUS - what is installed, what active, which values?
# -------------------------------------------------------------------------------------
[gcode_macro KAMP_STATUS]
description: Show KAMP installation status and settings
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set kamp_installed = 'gcode_macro _KAMP_Settings' in printer %}
    RESPOND MSG="================ KAMP STATUS ================"
    {% if kamp_installed %}
        {% set k = printer['gcode_macro _KAMP_Settings'] %}
        RESPOND MSG="KAMP: installed & loaded"
        RESPOND MSG="Features included: adaptive mesh={'yes' if 'gcode_macro BED_MESH_CALIBRATE' in printer else 'no'} | LINE_PURGE={'yes' if 'gcode_macro LINE_PURGE' in printer else 'no'} | VORON_PURGE={'yes' if 'gcode_macro VORON_PURGE' in printer else 'no'} | SMART_PARK={'yes' if 'gcode_macro SMART_PARK' in printer else 'no'}"
        RESPOND MSG="Our switches: KAMP mesh {sv.kamp_mesh|default(True)} | KAMP purge {sv.kamp_purge|default(True)} (type {sv.kamp_purge_type|default('LINE')}) | smart park {sv.kamp_smart_park|default(False)}"
        RESPOND MSG="KAMP values: mesh_margin {k.mesh_margin} | fuzz {k.fuzz_amount} | purge_amount {k.purge_amount}mm | purge_margin {k.purge_margin}mm | purge_height {k.purge_height} | smart_park_height {k.smart_park_height}"
        M117 KAMP active (console)
    {% else %}
        RESPOND MSG="KAMP: NOT installed -> system uses Klipper native ADAPTIVE + own prime line"
        M117 KAMP not installed
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing AND
# outdated copies (an old file under the same name does not have this marker)
# -------------------------------------------------------------------------------------
[gcode_macro _V14_KAMP]
description: Version sentinel of 14_kamp.cfg (internal)
gcode:
