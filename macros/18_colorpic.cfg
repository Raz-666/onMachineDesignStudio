# ======================================================================================
#  R120: COLOR PICTURE (ColorPic) - a photo as a multi-color print, NO backlight.
#  The generator (make_colorpic in r2_postproc.py) quantizes the image into
#  2..8 luminance bands; every band prints as flat plateaus of its own color,
#  lightest first (each band is a SUBSET of the one below - nothing prints
#  over air). At every band boundary the generated file calls:
#      _COLORPIC_SWAP ... ; M600 ; _COLORPIC_DONE ...
#  _COLORPIC_SWAP announces the next color (LCD + console + notify) and starts
#  the NOZZLE LED ANIMATION: while you swap the filament the nozzle LED
#  BLINKS from the CURRENT color to the NEXT one (unmissable - something is
#  pending). M600 parks/unloads and waits, _COLORPIC_DONE stops the blink.
#
#  LED ownership: during the wait the printer sits in 'filament' mode; normally
#  SET_LED_STATE STATE=filament would restart the static r2_nozzle_on work
#  light (24fps - it would eat the blink). 09_pause_filament.cfg therefore
#  SKIPS that call while a colorpic blink is active (guarded 3x) - the frame
#  keeps its paused/filament effect, the nozzle LED belongs to the animation.
# ======================================================================================

# -------------------------------------------------------------------------------------
# _COLORPIC_STATE - blink state (memory only - a 0.9s loop must never write disk)
# -------------------------------------------------------------------------------------
[gcode_macro _COLORPIC_STATE]
description: ColorPic blink state (internal)
variable_blink: 0
variable_phase: 0
variable_pr: 1.0
variable_pg: 1.0
variable_pb: 1.0
variable_nr: 1.0
variable_ng: 1.0
variable_nb: 1.0
variable_cidx: 0
variable_ctotal: 0
variable_cname: ''
gcode:

# -------------------------------------------------------------------------------------
# _COLORPIC_LED_APPLY - write the nozzle LED directly (mirrors _NOZZLE_SET's
# split/index logic and its brightness cap, but with EXPLICIT rgb - the
# user's stored nozzle color stays untouched; the animation owns the nozzle
# LED only while it runs). No SET_LED when the LEDs are off (leds_on).
# -------------------------------------------------------------------------------------
[gcode_macro _COLORPIC_LED_APPLY]
description: ColorPic: set the nozzle LED to an explicit color (internal)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if sv.leds_on|default(True) %}
        {% set rc = printer['gcode_macro _R2_CONFIG'] if 'gcode_macro _R2_CONFIG' in printer else None %}
        {% set lsec = rc.led_section|default('printer_leds')|string %}
        {% set ltype = rc.led_type|default('neopixel')|string %}
        {% set sn = rc.led_status_n|default(4)|int %}
        {% set bn = rc.led_bed_n|default(0)|int %}
        {% set split = (rc.led_nozzle_split|default(sv.nozzle_split|default(0))|int == 1)
                       and ((ltype ~ ' ' ~ (rc.led_nozzle_section|default('nozzle_led')|string)) in printer) %}
        {% set br = sv.nozzle_bright|default(1.0)|float %}
        {% set r = [[params.R|default(0)|float * br * 0.5, 0.5]|min, 0.0]|max %}
        {% set g = [[params.G|default(0)|float * br * 0.5, 0.5]|min, 0.0]|max %}
        {% set b = [[params.B|default(0)|float * br * 0.5, 0.5]|min, 0.0]|max %}
        {% if split %}
            SET_LED LED={rc.led_nozzle_section|default('nozzle_led')} RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% elif (ltype ~ ' ' ~ lsec) in printer %}
            SET_LED LED={lsec} INDEX={sn + bn + 1} RED={r|round(3)} GREEN={g|round(3)} BLUE={b|round(3)}
        {% endif %}
    {% endif %}

# -------------------------------------------------------------------------------------
# _COLORPIC_SWAP - the generated file calls this right before its M600:
# LCD + console announcement + the nozzle LED starts blinking old <-> new.
# -------------------------------------------------------------------------------------
[gcode_macro _COLORPIC_SWAP]
description: ColorPic: announce the next color + start the nozzle LED transition (internal)
gcode:
    {% set idx = params.IDX|default(0)|int %}
    {% set total = params.TOTAL|default(0)|int %}
    {% set name = params.NAME|default('?')|string %}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=pr VALUE={params.PREV_R|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=pg VALUE={params.PREV_G|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=pb VALUE={params.PREV_B|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=nr VALUE={params.R|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=ng VALUE={params.G|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=nb VALUE={params.B|default(1)|float}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=cidx VALUE={idx}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=ctotal VALUE={total}
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=cname VALUE='"{name}"'
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=blink VALUE=1
    M117 Color {idx}/{total}: {name}
    RESPOND MSG="COLORPIC: color change {idx}/{total} - load {name} now"
    RESPOND MSG="  the nozzle LED blinks old->new until you resume - the purge strip cleans the nozzle automatically"
    NOTIFY TEXT="Color change {idx}/{total}: load {name}" LEVEL=warn
    _COLORPIC_LED_APPLY R={params.R|default(1)|float} G={params.G|default(1)|float} B={params.B|default(1)|float}
    UPDATE_DELAYED_GCODE ID=_COLORPIC_BLINK DURATION=0.9

# -------------------------------------------------------------------------------------
# _COLORPIC_BLINK - the animation: alternate the nozzle LED between the previous
# and the next color every 0.9s while the filament change is pending; every
# second beat re-asserts the color name on the LCD. Stops on _COLORPIC_DONE -
# and by itself once the printer prints again (a cancel must never leave a
# blinking LED behind; the next SET_LED_STATE re-owns the chain anyway).
# -------------------------------------------------------------------------------------
[delayed_gcode _COLORPIC_BLINK]
gcode:
    {% set cs = printer['gcode_macro _COLORPIC_STATE'] %}
    {% set s = printer['gcode_macro _STATE'] %}
    {% if cs.blink|default(0)|int == 1 and s.mode in ['filament', 'paused'] %}
        {% if cs.phase|default(0)|int == 0 %}
            _COLORPIC_LED_APPLY R={cs.pr|float} G={cs.pg|float} B={cs.pb|float}
            SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=phase VALUE=1
        {% else %}
            _COLORPIC_LED_APPLY R={cs.nr|float} G={cs.ng|float} B={cs.nb|float}
            M117 Color {cs.cidx|default(0)|int}/{cs.ctotal|default(0)|int}: {cs.cname|default('')}
            SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=phase VALUE=0
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_COLORPIC_BLINK DURATION=0.9
    {% else %}
        # print running again (or DONE, or LEDs taken over) - stop the blink
        SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=blink VALUE=0
    {% endif %}

# -------------------------------------------------------------------------------------
# _COLORPIC_DONE - the generated file calls this right after its M600 returns:
# blink off, the new color stays on the nozzle LED until the print takes over.
# -------------------------------------------------------------------------------------
[gcode_macro _COLORPIC_DONE]
description: ColorPic: filament changed - steady new color (internal)
gcode:
    SET_GCODE_VARIABLE MACRO=_COLORPIC_STATE VARIABLE=blink VALUE=0
    _COLORPIC_LED_APPLY R={params.R|default(1)|float} G={params.G|default(1)|float} B={params.B|default(1)|float}

# -------------------------------------------------------------------------------------
# COLORPIC_SET_COLOR - LCD helper: set the color of ONE band (Band # + Color
# inputs) in the stored colors CSV (light -> dark). Unset bands in between
# are padded with GRY; entries beyond the set band are kept for later.
# NOTE: jinja2 has no while loops - the padding is done with list math.
# -------------------------------------------------------------------------------------
[gcode_macro COLORPIC_SET_COLOR]
description: ColorPic: store the color of one band (BAND=2 COLOR=RED)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set band = params.BAND|default(1)|int %}
    {% set col = params.COLOR|default('')|string|upper %}
    {% set pal = ['WHT','GRY','BLK','RED','ORG','YEL','GRN','BLU','PUR','BRN','PNK','CYA','GLD','SIL'] %}
    {% if col not in pal %}
        RESPOND MSG="COLORPIC: COLOR must be one of { pal|join(',') }"
        M117 Bad color
    {% elif not (1 <= band <= 8) %}
        RESPOND MSG="COLORPIC: BAND must be 1..8 (light -> dark)"
        M117 Bad band
    {% else %}
        {% set cur = sv.colorpic_colors|default('')|string %}
        {% set parts = [] if cur == '' else cur.split(',')|reject('in', [''])|list %}
        {% if parts|length >= band %}
            {% set parts = parts[:band - 1] + [col] %}
        {% else %}
            {% set parts = parts + ['GRY'] * (band - 1 - parts|length) + [col] %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=colorpic_colors VALUE="\"{ parts|join(',') }\""
        _PACE
        M117 Band {band}: {col}
        RESPOND MSG="ColorPic band {band}: {col} - colors now { parts|join(',') } (light -> dark)"
    {% endif %}

# -------------------------------------------------------------------------------------
# COLORPIC_CREATE - validate + bump the nonce (the watcher builds the file).
# Reuses the LITHOPHANE image list (same gcodes-folder images). INDEX=slot,
# SRC=explicit name (GEN_COLORPIC), or the last picked lithophane image.
# -------------------------------------------------------------------------------------
[gcode_macro COLORPIC_CREATE]
description: ColorPic: create from image slot INDEX (0-9, bumps colorpic_nonce)
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set idx = params.INDEX|default(-1)|int %}
    {% set files = sv.litho_files|default([]) %}
    {% set src = '' %}
    {% set _cpsrc = params.SRC|string|lower %}
    {% if params.SRC is defined and (_cpsrc[-4:] in ('.png', '.jpg') or _cpsrc[-5:] == '.jpeg') %}
        {% set src = params.SRC|string %}
    {% elif idx >= 0 and idx < files|length %}
        {% set src = files[idx]|string %}
    {% elif sv.litho_file|default('')|string != '' %}
        {% set src = sv.litho_file|default('')|string %}
    {% endif %}
    {% if src == '' or '"' in src or '\\' in src %}
        NOTIFY TEXT="Pick an image first (ColorPic > Images - same list as Lithophane)" LEVEL=warn SOUND=r2_notice
        M117 ColorPic: no image
    {% else %}
        SAVE_VARIABLE VARIABLE=litho_file VALUE='"{src}"'
        _PACE
        {% if params.OUT is defined %}_GEN_OUT_SET OUT={params.OUT|string|upper}{% endif %}
        SAVE_VARIABLE VARIABLE=colorpic_nonce VALUE={sv.colorpic_nonce|default(0)|int + 1}
        _SOUND_LIB NAME=r2_confirm
        M117 ColorPic creating..
        RESPOND MSG="ColorPic: creating from {src} - {sv.colorpic_bands|default(4)|int} color band(s), {sv.colorpic_width|default(120)|round(0)|int}mm wide, band height {sv.colorpic_bandh|default(0.8)|round(1)}mm"
        RESPOND MSG="  colors light->dark: {sv.colorpic_colors|default('auto by band count')} - M600 at every boundary, the nozzle LED blinks to the next color while you swap"
        RESPOND MSG="  big images take a minute (own background thread) - it beeps and appears in the file list"
    {% endif %}

# -------------------------------------------------------------------------------------
# GEN_COLORPIC - console/Mainsail entry point (sets the variables, then creates)
#   GEN_COLORPIC SRC=photo.png WIDTH=120 BANDS=4 BANDH=0.8 COLORS=WHT,GRY,BLK
#                LAYER_H=0.2 IRONING=1 BRIM=3 SWAP=1 CONTRAST=1
#   SWAP=0 prints every band WITHOUT filament changes (one color), CONTRAST=0
#   turns the extra contrast boost off
#   COLORS: palette codes light->dark (WHT GRY BLK RED ORG YEL GRN BLU PUR BRN
#   PNK CYA GLD SIL); fewer codes than bands = auto-filled.
# -------------------------------------------------------------------------------------
[gcode_macro GEN_COLORPIC]
description: Generate a color picture: GEN_COLORPIC SRC=photo.png WIDTH=120 BANDS=4 COLORS=WHT,GRY,BLK BANDH=0.8
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% set src = params.SRC|default('')|string %}
    {% if src == '' or '"' in src or '\\' in src %}
        RESPOND MSG="GEN_COLORPIC needs SRC: GEN_COLORPIC SRC=\"photo.png\" WIDTH=120 BANDS=4 (others optional)"
        M117 GEN_COLORPIC: no src
    {% else %}
        {% if params.WIDTH is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_width VALUE={params.WIDTH|float}
            _PACE
        {% endif %}
        {% if params.BANDS is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_bands VALUE={[params.BANDS|int, 2]|max}
            _PACE
        {% endif %}
        {% if params.BANDH is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_bandh VALUE={params.BANDH|float}
            _PACE
        {% endif %}
        {% if params.COLORS is defined %}
            {% set cs = params.COLORS|string|upper|replace(' ', '') %}
            {% if '"' in cs or '\\' in cs %}
                RESPOND MSG="GEN_COLORPIC: quotes and backslashes are not allowed in COLORS"
            {% else %}
                SAVE_VARIABLE VARIABLE=colorpic_colors VALUE="\"{cs}\""
                _PACE
            {% endif %}
        {% endif %}
        {% if params.LAYER_H is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_layer_h VALUE={params.LAYER_H|float}
            _PACE
        {% endif %}
        {% if params.SWAP is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_swap VALUE={params.SWAP|int == 1}
            _PACE
        {% endif %}
        {% if params.CONTRAST is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_contrast VALUE={params.CONTRAST|int == 1}
            _PACE
        {% endif %}
        {% if params.IRONING is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_ironing VALUE={params.IRONING|int == 1}
            _PACE
        {% endif %}
        {% if params.BRIM is defined %}
            SAVE_VARIABLE VARIABLE=colorpic_brim VALUE={params.BRIM|int}
            _PACE
        {% endif %}
        SAVE_VARIABLE VARIABLE=litho_file VALUE="\"{src}\""
        _PACE
        COLORPIC_CREATE
    {% endif %}

# -------------------------------------------------------------------------------------
# module version sentinel - _CHECK_INSTALL verifies this to detect missing/outdated copies
# -------------------------------------------------------------------------------------
[gcode_macro _V18_COLORPIC]
description: Version sentinel of 18_colorpic.cfg (internal)
gcode:
    RESPOND MSG="18_colorpic.cfg V1 (R120: color pictures)"
