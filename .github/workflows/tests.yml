name: tests

# R105: the whole quality net runs on every push and pull request - the exact
# same five checks a fresh clone can run locally (verified: a clean clone of
# this repository passes all of them with python3 + jinja2 + pillow).
# External dependencies: jinja2 (macro render suite) and pillow (the image
# generator tests - PNG fixtures are BUILT in the suite, no binary assets).
# Everything else is stdlib - by design, so the Pi never needs pip.

on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the external dependencies
        # R224 (.136v field review): pillow was missing - the render suite
        # died at its first image test (ModuleNotFoundError: PIL) although
        # it passed locally
        run: pip install jinja2 pillow

      - name: Shell syntax (setup.sh + update.sh)
        run: |
          bash -n setup.sh
          bash -n update.sh

      - name: Macro render suite (full Klipper-template simulation)
        run: python3 tools/macro_render_test.py

      - name: Golden byte-identity (generator regression net)
        run: python3 tools/r81_golden_check.py

      - name: Audit sweep (gcode invariant checker)
        run: python3 tools/audit_sweep.py

      - name: Unified analysis engine tests (Masterkonzept Pass 0-11)
        run: python3 tools/test_gcode_re.py

      - name: STL numeric geometry and extrusion regressions (offline)
        run: |
          R2_TEST_ENGINE=active python3 tools/test_stl_extrusion_state.py
          python3 tools/test_stl_mesh.py
          python3 tools/test_contour_mesh.py
          python3 tools/test_gcode_contours.py
          python3 tools/test_path_evidence.py
          python3 tools/test_seam_reconstruction.py
          python3 tools/test_contour_context.py
          python3 tools/test_physical_contours.py
          python3 tools/test_contour_preview.py
          python3 tools/test_concave_offsets.py
          python3 tools/test_multi_prism.py
          python3 tools/test_stacked_prism.py
          python3 tools/test_layer_evidence.py
          python3 tools/test_spiral_rings.py
          python3 tools/test_nonplanar_retention.py
          python3 tools/test_ring_wall.py
          python3 tools/test_path_continuation.py
          python3 tools/test_wall_surfaces.py
          python3 tools/test_wall_run.py
          python3 tools/test_vase_closure.py
          python3 tools/test_self_intersect.py
          python3 tools/test_bead_evidence.py

      - name: Streaming simulations (watcher RSS stays flat)
        run: python3 tools/r91_simulate.py

      - name: Megatest (101 generator runs at parameter extremes)
        run: python3 tools/megatest.py
