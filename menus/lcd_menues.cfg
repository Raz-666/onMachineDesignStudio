gcode:
    SAVE_VARIABLE VARIABLE=stringart_arc VALUE={menu.input|round(1)}
    RESPOND MSG="ArtisticStrings strand bow {menu.input|round(1)}mm in Z (0 = flat) - the nozzle never drags through the strands laid before"

[menu __main __gen __stringart __anc]
type: input
name: Anchors: {menu.input|round|int}
input_step: 12
input_min: 24
input_max: 720
