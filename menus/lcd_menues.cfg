[menu __main __preprint __rng]
type: list
name: Range/Stop

# R74: shows the selected file + its REAL layer count (from the preview push)
# and caps the From/To inputs - you can no longer dial in a layer that does
# not exist (the safety clamp in SET_LAYER_RANGE stays as the second net)
[menu __main __preprint __rng __file]
type: command
name: File: {(printer['gcode_macro _STATE'].total_layers|default(0)|int ~ ' L') if printer['gcode_macro _STATE'].total_layers|default(0)|int > 0 else 'select first'}
gcode:
    {% set tl = printer['gcode_macro _STATE'].total_layers|default(0)|int %}
    {% if tl > 0 %}
        RESPOND MSG="Range source: {printer.print_stats.filename|default('?')} - {tl} layers (From 2..{tl - 1}, To 3..{tl})"
    {% else %}
        RESPOND MSG="Range: select a file first - then its layer count caps From/To here"
    {% endif %}

[menu __main __preprint __rng __stop]
type: input
name: Stop@: {'%3d' % menu.input}
input: {printer['gcode_macro _STATE'].stop_at_layer|default(0)}
input_min: 0
input_max: 999
input_step: 1
gcode:
    SET_STOP_AT_LAYER LAYER={menu.input|round|int}

[menu __main __preprint __rng __from]
type: input
name: From: {'%3d' % menu.input}
input: {printer['save_variables'].variables.range_start|default(2)}
input_min: 2
input_max: {printer['gcode_macro _STATE'].total_layers|default(0)|int - 1 if printer['gcode_macro _STATE'].total_layers|default(0)|int > 3 else 999}
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_start VALUE={menu.input|round|int}

[menu __main __preprint __rng __to]
type: input
name: To: {'%3d' % menu.input}
input: {printer['save_variables'].variables.range_end|default(10)}
input_min: 3
input_max: {printer['gcode_macro _STATE'].total_layers|default(0)|int if printer['gcode_macro _STATE'].total_layers|default(0)|int > 3 else 999}
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_end VALUE={menu.input|round|int}

[menu __main __preprint __rng __floor]
type: input
name: Floor: {'%2d' % menu.input}
input: {printer['save_variables'].variables.range_floor|default(0)}
input_min: 0
input_max: 10
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_floor VALUE={menu.input|round|int}

# R74: FOOTPRINT (convex hull - bridges concavities, the classic raft) or
# OUTLINE (the TRUE outline of the first range layer - concavities and holes
# stay open); GRID (hatch lattice) or SOLID (dense lines) fill
[menu __main __preprint __rng __fsh]
type: input
name: F.Shp: {("FOOTPRINT","OUTLINE")[menu.input|int] if menu.input|int in (0,1) else "?"}
input: {printer['save_variables'].variables.range_floor_shape|default(0)}
input_min: 0
input_max: 1
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_floor_shape VALUE={menu.input|round|int}
    RESPOND MSG="Range floor shape: {('FOOTPRINT - convex hull of the layer (bridges concavities)' if menu.input|round|int == 0 else 'OUTLINE - follows the true outline of the layer, concavities stay open')}"

[menu __main __preprint __rng __ffl]
type: input
name: F.Fill: {("GRID","SOLID")[menu.input|int] if menu.input|int in (0,1) else "?"}
