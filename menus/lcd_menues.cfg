        RESPOND MSG="Features: DERIVED from geometry ({(s.file_conf|default(0.7)*100)|round(0)|int}% confidence, {s.file_cover|default(0)}% covered) - this file has no TYPE: tags, the classifier guessed. Tagged files always win."
