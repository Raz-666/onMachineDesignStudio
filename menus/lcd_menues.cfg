[menu __main __gen __bricks __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Bricks: pick parts in Catalog (Count x code per pick, same codes merge, max 120 parts) - 76 codes in 8 families: bricks, plates, tiles, slopes, inverted slopes, arches, technic, round | Exact geometry: body n*8-0.2mm (they clamp to each other AND to originals), hollow studs, underside tubes at every inner crossing - layer 1 solid, tubes open from layer 2 | Brim 0-8 loops per part (Settings), colors 1-8: BY_LAYER = one plate per color, BY_OBJECT = one plate + M600 at the boundaries - the layout is always CENTERED on the bed | Every part is its own object - a failed brick can be excluded mid-print and reprinted later | Mainsail: GEN_BRICKS CODES=\"B2x4:3|P2x2:2\" MODE=BY_LAYER COLORS=3 BRIM=2 (sets everything + creates)"

# ---- Kit from a sliced file (R125): the file SELECTED in the file list
# ---- (or SRC=/INDEX= via Mainsail) becomes a stylized kit. No guessing -
# ---- nothing selected = clear error. Support/brim/skirt never make it in;
# ---- closed bodies fill, hollow bodies become ring walls. BY_LAYER = 1 color/plate.
[menu __main __gen __bricks __kit]
type: list
name: Kit from file

[menu __main __gen __bricks __kit __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Brick kit: a sliced job becomes a stylized kit - support, brim, skirt and towers never make it in | Closed bodies become solid bricks, hollow bodies (vases, sparse infill) become ring walls - MICRO/SMALL = 9.6mm brick bands, BIG = 3.2mm plate bands | BY_LAYER: one color per plate, the plate change IS the color change (zero M600) - BY_OBJECT: parts print one after another, M600 only at color boundaries | Pick the file in the file list first - the kit is built from THAT file (Mainsail: SRC=box.gcode DETAIL=AUTO MODE=BY_LAYER COLORS=3, or INDEX=0..4 = recent jobs)"

