name: Angle: {'%3d' % menu.input}deg
enable: {not printer['save_variables'].variables.angle_flat|default(False)}
input: {printer['save_variables'].variables.angle_deg|default(90)}
input_min: 30
input_max: 170
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=angle_deg VALUE={menu.input|round|int}

# leg A/B = the two legs from the corner (angle) or the two halves (flat)
[menu __main __gen __angle __set __la]
type: input
name: {'Leg A: %3d' % menu.input|round(0)|int ~ 'mm' if not printer['save_variables'].variables.angle_flat|default(False) else 'Left: %3d' % menu.input|round(0)|int ~ 'mm'}
input: {printer['save_variables'].variables.angle_leg_a|default(60)}
input_min: 20
input_max: 150
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=angle_leg_a VALUE={menu.input|round|int}

[menu __main __gen __angle __set __lb]
type: input
name: {'Leg B: %3d' % menu.input|round(0)|int ~ 'mm' if not printer['save_variables'].variables.angle_flat|default(False) else 'Right: %3d' % menu.input|round(0)|int ~ 'mm'}
input: {printer['save_variables'].variables.angle_leg_b|default(60)}
input_min: 20
input_max: 150
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=angle_leg_b VALUE={menu.input|round|int}

[menu __main __gen __angle __set __wid]
type: input
name: Width: {'%2d' % menu.input}mm
input: {printer['save_variables'].variables.angle_width|default(25)}
input_min: 8
input_max: 60
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=angle_width VALUE={menu.input|round|int}

[menu __main __gen __angle __set __lay]
type: input
name: Layers: {'%2d' % menu.input}
input: {printer['save_variables'].variables.angle_layers|default(6)}
input_min: 4
input_max: 12
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=angle_layers VALUE={menu.input|round|int}

[menu __main __gen __angle __set __lh]
type: input
name: LH: {'%.2f' % menu.input}mm
input: {printer['save_variables'].variables.angle_layer_h|default(0.2)}
input_min: 0.12
input_max: 0.32
input_step: 0.04
gcode:
    SAVE_VARIABLE VARIABLE=angle_layer_h VALUE={menu.input|float|round(2)}

[menu __main __gen __angle __set __hol]
type: input
name: Holes: {'%2d' % menu.input}/leg
input: {printer['save_variables'].variables.angle_holes|default(2)}
input_min: 0
input_max: 6
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=angle_holes VALUE={menu.input|round|int}

