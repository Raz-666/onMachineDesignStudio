# =====================================================================================
#  R135: the pre-print OFFSET - click an axis, adjust the value, done.
#  Fine rows use HALF steps (0.05mm). Live babystepping + the offset
#  display stay at the top of Live Tuning (as ever).
# =====================================================================================
[menu __main __preprint __file]
type: list
name: File info

[menu __main __preprint __file __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: File info: plain rows SHOW values (press = details). Rows with > toggle a FEATURE on/off - the percents live in Live > Features. Fixes that rewrite the file: Pre-Print > Fixes | All values are MEASURED from the selected file (the watcher scans it). Generated files carry their own speeds/accels/features since .120"

# R220: the TYPES summary row (same compact codes as Start? > File info) -
# .136o field item 'Shape-TYPES-Anzeige': one glance at what this file
# really contains before tuning anything.
[menu __main __preprint __file __feat]
type: command
name: '{(("Feat: " ~ ((printer["gcode_macro _STATE"].file_types|default(""))|replace("INTERNAL-BRIDGE","IB")|replace("OVERHANG-PERIM","OH")|replace("WALL-OUTER","WO")|replace("WALL-INNER","WI")|replace("INFILL-SPARSE","IS")|replace("INFILL-SOLID","IL")|replace("SURFACE-TOP","ST")|replace("SURFACE-BOTTOM","SB")|replace("PRIME-TOWER","PT")|replace("BRIDGE","BR")|replace("GAPS","GP")|replace("SUPPORT","SU")|replace("IRONING","IR")|replace("SKIRT","SK")|replace("BRIM","BM")|replace("CUSTOM","CU")|replace(","," ")))|truncate(16, True, "")) if (printer["gcode_macro _STATE"].file_types|default("")) != "" else "Feat: ?"}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set t = s.file_types|default('') %}
    RESPOND MSG="File features (TYPES): {t if t != '' else '? - no R2 markers (LEGACY) or not measured yet'}"
    RESPOND MSG="The feature rows below (and Pre-Print > speeds) only offer what this list contains - absent features are parked as SKIP for this print"

# R220 dead-wiring fix: this enable read save_variables.variables.file_types
# - a variable NOTHING ever writes (no SAVE_VARIABLE file_types exists, the
# truth is the in-memory _STATE). The CUSTOM? row never showed. Now it
# reads the live _STATE.file_types like every other TYPES gate.
[menu __main __preprint __file __cust]
type: command
name: CUSTOM?
enable: {'CUSTOM' in printer['gcode_macro _STATE'].file_types|default('')}
gcode:
    RESPOND MSG="CUSTOM = a block whose TYPE spelling is unknown AND has no wall character (start/end scripts, purge macros - R181). It prints 1:1 (nothing to tune but PA). After an update: System > File check > RETAG - the new rules usually resolve it"

# R214 (.136m): object-only STL export of the selected file - the pure
# geometry without supports, skirt, brim, prime tower, custom helpers and
# ironing. The watcher builds stl/<name>_object.stl in the background.
[menu __main __preprint __file __stl]
type: command
name: STL: shell
gcode:
    STL_EXPORT

[menu __main __preprint __file __opt]
type: command
enable: {printer['gcode_macro _STATE'].file_optimized|default(False)}
name: 'OPTIMIZED - tuned values baked'
gcode:
    RESPOND MSG="OPTIMIZED copy (.128+): the values shown are the ones the successful print ended with - baked into this file. Header carries the R2-OPT tag (source + date) and the _OPT_BAKED replay line"

