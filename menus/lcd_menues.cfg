name: Fl.hole: {'%.1f' % menu.input}mm
input: {printer['save_variables'].variables.range_floor_hole|default(0)}
input_min: 0
input_max: 80
input_step: 0.5
gcode:
    SAVE_VARIABLE VARIABLE=range_floor_hole VALUE={menu.input|float|round(1)}
    RESPOND MSG="Range floor hole: {('OFF' if menu.input|float|round(1) == 0 else '%.1fmm centered + thick boss ring (auto-clamped to the raft)' % menu.input)}"

# R86.2: centered hole in the TOP cap - BRIDGE-FIRST (cap layer 1 anchors the
# hole edge with a ring, layers 2+ open it: no sagging, hole open from layer 1).
# A top hole auto-raises Top to 3 layers (bridge + 2 solid)
[menu __main __preprint __rng __tho]
