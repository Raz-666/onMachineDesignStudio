# print height of the picture (width follows the aspect ratio, auto-clamped
# to the bed)
[menu __main __gen __litho __set]
type: list
name: Settings

[menu __main __gen __litho __set __hgt]
type: input
name: Height: {'%3d' % menu.input}mm
input: {printer['save_variables'].variables.litho_height|default(100)}
input_min: 30
input_max: 200
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=litho_height VALUE={menu.input|round|int}

# 0.12 = default; 0.08 = maximum detail (double the print time)
[menu __main __gen __litho __set __lh]
type: input
name: Layer: {'%.2f' % menu.input}mm
input: {printer['save_variables'].variables.litho_layer_h|default(0.12)}
input_min: 0.08
input_max: 0.2
input_step: 0.04
gcode:
    SAVE_VARIABLE VARIABLE=litho_layer_h VALUE={menu.input|float|round(2)}

# 0 = continuous grey shades (photo), 2-12 = posterized brightness levels
[menu __main __gen __litho __set __lvl]
type: input
name: Levels: {('%2d' % menu.input) ~ (' (photo)' if menu.input == 0 else '')}
input: {printer['save_variables'].variables.litho_levels|default(0)}
input_min: 0
input_max: 12
input_step: 1
