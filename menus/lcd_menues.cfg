# =====================================================================================
#  LIVE > FILE (G-code) - R60: the FULL file info (like Pre-Print > File),
#  measured originals + click-to-activate, usable DURING the print
# =====================================================================================
[menu __main __live __pause]
type: list
name: Pause & Control

[menu __main __live __pause __next]
type: command
name: Pause next layer
gcode: PAUSE_NEXT_LAYER

[menu __main __live __pause __at]
type: input
name: Pause@: {'%3d' % menu.input}
input: {printer['save_variables'].variables.pause_at_layer|default(0)}
input_min: 0
input_max: 999
input_step: 1
gcode:
    {% if menu.input|round|int > 0 %}
        PAUSE_AT_LAYER LAYER={menu.input|round|int}
    {% else %}
        SAVE_VARIABLE VARIABLE=pause_at_layer VALUE=0
        M117 Layer pause off
    {% endif %}

# R115 (.87 field log): PAUSE NOW was the FIRST entry of this submenu - an
# encoder double-click (entering 'Pause & Control') fired it instantly, the
# printer 'constantly quick-pauses'. Now the harmless entries come first and
# PAUSE NOW is two-press confirmed (same pattern as the preset deletes).
[menu __main __live __pause __now]
type: command
name: 'Pause NOW{(printer["gcode_macro _STATE"].pause_now_arm|default(0) == 1) and " AGAIN!" or ""}'
gcode:
    {% if printer['gcode_macro _STATE'].pause_now_arm|default(0) == 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_now_arm VALUE=0
        QUICK_PAUSE
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=pause_now_arm VALUE=1
        UPDATE_DELAYED_GCODE ID=_PAUSE_NOW_ARM_OFF DURATION=5
        RESPOND MSG="Press Pause NOW again to pause (protects against accidental double-clicks)"
    {% endif %}

[menu __main __live __pause __stop]
type: input
name: Stop@: {'%3d' % menu.input}
input: {printer['gcode_macro _STATE'].stop_at_layer|default(0)}
input_min: 0
input_max: 999
input_step: 1
gcode:
    SET_STOP_AT_LAYER LAYER={menu.input|round|int}

