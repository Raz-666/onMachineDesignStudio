# =====================================================================================
#  GEN FILES (R133f) - every generator output, newest first (24 slots
#  since R187), pushed by the
#  watcher (gen_files). Select a file right here (the start dialog catches it),
#  or delete it in 'Delete file' (2-press: arm + again). Versions auto-bump -
#  regenerating NEVER overwrites an older file (field log .98).
#  R158/R160: file names are Vnn_Name.gcode - the running number leads
#  (the 00_ prefix is gone since .120: 3 more name characters), because the
#  LCD truncates names at
#  ~15 characters and the old tail version was invisible next to its
#  predecessor. The slots hide the .gcode tail, the number alone tells
#  files apart. One number per output FOLDER, never reused.
# =====================================================================================
[menu __main __gen __gfiles]
type: list
name: Gen files

[menu __main __gen __gfiles __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Gen files: every generator output, newest first - press a slot to SELECT that file (the start dialog catches it, nothing prints unasked) | Names are V-number-first - the display cuts long names, the number at the front always stays visible. One number per output folder, never reused. Create rows need TWO presses since .120 | Delete file: press TWICE (first arms, second deletes). Versions auto-bump - a regeneration never overwrites an older V-number"

