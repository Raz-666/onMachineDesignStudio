
[menu __main]
type: list
name: Ender-3 R2D2

# =====================================================================================
#  START PRINT?  (appears as soon as the pre-print dialog waits for your decision)
# =====================================================================================
[menu __main __start]
type: list
enable: {printer['gcode_macro _STATE'].mode == 'waiting'}
# R73: material + temps right in the title - the G-code values are the FIRST
# thing you want to see before the decision (values appear ~1-2s after the
# dialog: the file reports them via _FILE_INFO while it waits)
name: '> Start? {("MARKED" if printer['gcode_macro _STATE'].file_type|default("unknown") == "marked" else "LEGACY" if printer['gcode_macro _STATE'].file_type|default("unknown") == "legacy" else "?")} {printer['gcode_macro _STATE'].file_material|default("?")} {printer['gcode_macro _STATE'].file_hotend_first|default(0)|round(0)|int}/{printer['gcode_macro _STATE'].file_bed|default(0)|round(0)|int}C'

[menu __main __start __direct]
type: command
name: '> PRINT AS SLICED'
gcode:
    PRINT_AS_SLICED

# R54: 'PRINT W/ CHANGES' merged into 'AS LEGACY' (PRINT_WITH_OVERRIDES stays as console alias)
[menu __main __start __asleg]
type: command
name: '> AS LEGACY'
gcode:
    PRINT_AS_LEGACY

[menu __main __start __cancel]
type: command
name: '> CANCEL START'
gcode:
    CANCEL_PENDING_PRINT

[menu __main __start __info]
type: list
name: File info

# R73: the old 'File info' item only sent M117 + console lines - on the LCD
# 'nothing happened'. These lines SHOW the G-code parameters of the loaded
# file (the file reports them via _FILE_INFO right at its start).

[menu __main __start __info __type]
type: command
name: '{(printer["gcode_macro _STATE"].file_type|default("?")|upper if printer["gcode_macro _STATE"].file_type|default("?") != "unknown" else printer["gcode_macro _PREVIEW"].type|default("?")|upper)} | Ly {printer["gcode_macro _STATE"].file_layer_height|default(0)|round(2)}x{printer["gcode_macro _STATE"].total_layers|default(0)|int if printer["gcode_macro _STATE"].total_layers|default(0) > 0 else "?"}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File type: {s.file_type|default('unknown')|upper} - MARKED = R2 markers (all 3 modes), LEGACY = no PRINT_START (AS SLICED = 1:1, AS LEGACY = takeover + your overrides)"

[menu __main __start __info __mat]
type: command
name: 'Mat {printer["gcode_macro _STATE"].file_material|default("?")} | Noz {printer["gcode_macro _STATE"].file_nozzle|default(0)|round(1) if printer["gcode_macro _STATE"].file_nozzle|default(0) > 0 else "?"} W{printer["gcode_macro _STATE"].file_wall_loops|default(0)|int}'
gcode:
    RESPOND MSG="File: material {printer['gcode_macro _STATE'].file_material} | nozzle {printer['gcode_macro _STATE'].file_nozzle}mm | wall loops {printer['gcode_macro _STATE'].file_wall_loops} | your material: {printer['save_variables'].variables.material|default('PLA')}"

[menu __main __start __info __slicer]
type: command
name: 'By {(printer['gcode_macro _STATE'].file_slicer|default('?')).replace('_', ' ')|truncate(13, True, '')}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File: sliced by {s.file_slicer|default('?')|replace('_', ' ')} for {s.file_firmware|default('?')} firmware (foreign slicers print AS LEGACY)"
    {% if s.file_volumetric|default(False) %}
        RESPOND MSG="[!] VOLUMETRIC Marlin file: Klipper counts E in mm, not mm3 - under-extrusion! Re-slice or convert"
    {% endif %}

[menu __main __start __info __temps]
type: command
name: '{printer["gcode_macro _STATE"].file_hotend_first|default(0)|round(0)|int}/{printer["gcode_macro _STATE"].file_hotend_after|default(0)|round(0)|int}C  Bed {printer["gcode_macro _STATE"].file_bed|default(0)|round(0)|int}/{printer["gcode_macro _STATE"].file_bed_after|default(0)|round(0)|int}C'
gcode:
    RESPOND MSG="File temps: hotend {printer['gcode_macro _STATE'].file_hotend_first}/{printer['gcode_macro _STATE'].file_hotend_after}C | bed {printer['gcode_macro _STATE'].file_bed}/{printer['gcode_macro _STATE'].file_bed_after}C - YOUR overrides: Pre-Print > Temps"

[menu __main __start __info __speeds]
type: command
name: 'Spd {printer["gcode_macro _STATE"].file_feat_spd_wallouter|default(0)|round(0)|int if printer["gcode_macro _STATE"].file_feat_spd_wallouter|default(0) > 0 else "?"}mm/s PA {printer["gcode_macro _STATE"].file_pa|default(0)|round(3)}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File: outer wall {s.file_feat_spd_wallouter|default(0)|round(0)}mm/s | first layer {s.file_speed_first|default(0)|round(0)}mm/s | ironing {s.file_ironing_speed|default(0)|round(0)}mm/s | PA {s.file_pa} | retract {s.file_retract_len}@{s.file_retract_speed}"

[menu __main __start __info __width]
type: command
name: 'Width {printer["gcode_macro _STATE"].file_line_width|default(0)|round(2) if printer["gcode_macro _STATE"].file_line_width|default(0) > 0 else "?"}mm Flow {printer["gcode_macro _STATE"].file_flow_ratio|default(0)|round(2) if printer["gcode_macro _STATE"].file_flow_ratio|default(0) > 0 else "?"}'
gcode:
    RESPOND MSG="File: line width {printer['gcode_macro _STATE'].file_line_width}mm (first {printer['gcode_macro _STATE'].file_line_width_first}, wall {printer['gcode_macro _STATE'].file_line_width_wall}) | flow ratio {printer['gcode_macro _STATE'].file_flow_ratio} | by object {printer['gcode_macro _STATE'].file_by_object}"

# R220 (.136o field item 'Shape-TYPES-Anzeige'): the features REALLY present
# in this file, as one compact row (WO WI IS ST...). TYPES comes from the
# postproc v4 tag and is live BEFORE the print starts - the watcher pushes
# the file's own _FILE_INFO line at selection, so _STATE.file_types holds
# the SELECTED file's truth while the Start? dialog is open. Press = the
# full list + what SKIP/parked means (Pre-Print > Features only offers
# what this file has, R79).
[menu __main __start __info __feat]
type: command
name: '{(("Feat: " ~ ((printer["gcode_macro _STATE"].file_types|default(""))|replace("INTERNAL-BRIDGE","IB")|replace("OVERHANG-PERIM","OH")|replace("WALL-OUTER","WO")|replace("WALL-INNER","WI")|replace("INFILL-SPARSE","IS")|replace("INFILL-SOLID","IL")|replace("SURFACE-TOP","ST")|replace("SURFACE-BOTTOM","SB")|replace("PRIME-TOWER","PT")|replace("BRIDGE","BR")|replace("GAPS","GP")|replace("SUPPORT","SU")|replace("IRONING","IR")|replace("SKIRT","SK")|replace("BRIM","BM")|replace("CUSTOM","CU")|replace(","," ")))|truncate(16, True, "")) if (printer["gcode_macro _STATE"].file_types|default("")) != "" else "Feat: ?"}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set t = s.file_types|default('') %}
    RESPOND MSG="File features (TYPES): {t if t != '' else '? - no R2 markers (LEGACY) or not measured yet'}"
    RESPOND MSG="WO WI = walls | IS IL = sparse/solid infill | ST SB = top/bottom surface | BR IB = bridge/internal bridge | GP gaps | SU support | IR ironing | SK skirt | BM brim | OH overhang | PT prime tower | CU custom | C1..C9 = numbered custom blocks"
    RESPOND MSG="Pre-Print > Features only offers what THIS file really has - absent features are parked as SKIP for this print (your switches stay for the next file that has them)"

# =====================================================================================
#  RATE PRINT?  (R169 - appears after a SUCCESSFUL print that was live-tuned)
#  YES  = the tuned values stay AND a copy lands in gcodes/optimized/ (the
#         original is never touched - the values are baked into the copy)
#  NO   = discard: the pre-print state from before the print is restored
#  R173: NO auto-timeout - the question stays until YES/NO. Only picking a
#  new file (or starting a new print) answers it with NO (silent)
# =====================================================================================
[menu __main __endq]
type: list
enable: {printer['gcode_macro _STATE'].opt_pending|default(False)}
name: '> Rate print? {printer['save_variables'].variables.opt_cnt|default(0)} tuned'

[menu __main __endq __info]
type: command
name: '{printer.print_stats.filename|default('?')|truncate(14, True, '')} - save tuning?'
gcode:
    OPT_INFO

[menu __main __endq __yes]
type: command
name: '> YES - optimized copy'
gcode:
    _OPT_PROMPT_YES

[menu __main __endq __no]
type: command
name: '> NO - discard'
gcode:
    _OPT_PROMPT_NO

# =====================================================================================
#  OPTIMIZED  (R169 - the tuned library in gcodes/optimized/)
#  The stock LCD file list shows the gcodes ROOT only (Klipper's vsdlist never
#  reads subfolders) - so the folder gets its own print access here. Mainsail
#  shows the folder natively. The start dialog guards the start as always.
# =====================================================================================
[menu __main __optprint]
type: list
enable: {printer['gcode_macro _STATE'].mode in ['idle','waiting','finished']}
name: Optimized

[menu __main __optprint __info]
type: command
name: 'Files: {((printer['save_variables'].variables.opt_list|default('')|string).split('|')|length if printer['save_variables'].variables.opt_list|default('') != '' else 0)}'
gcode:
    RESPOND MSG="Optimized copies live in gcodes/optimized/ - press a slot to SELECT it, then START prints it (start dialog asks as always) or 'Values' takes its tuning into Pre-Print. The list refreshes LIVE - rows with '(empty)' are free slots"

#  R188 (.134): the picker showed ONE file at a time (field report:
#  'only one of the list is shown') - a real slot list now, always
#  enabled so the names refresh LIVE while the menu is open (Klipper
#  freezes the enable filter at menu entry - name-only refresh is the
#  only live path). Empty rows below the last file are free slots.
[menu __main __optprint __p0]
type: command
name: { '1 ' ~ (((printer['save_variables'].variables.opt_list|default('')|string).split('|'))[0:1]|first|default('(empty)'))|replace('.gcode', '')|truncate(13, True) }
gcode:
    SAVE_VARIABLE VARIABLE=opt_print_name VALUE='"{ (((printer['save_variables'].variables.opt_list|default('')|string).split('|'))[0:1]|first)|default('') }"'
    RESPOND MSG="[opt] { (((printer['save_variables'].variables.opt_list|default('')|string).split('|'))[0:1]|first)|default('?') } selected - START prints it, 'Values' loads its tuning into Pre-Print"

