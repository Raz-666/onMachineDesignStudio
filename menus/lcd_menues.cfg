[menu __main __gen __stringart __how]
type: command
name: How does it work?
gcode:
    RESPOND MSG="ArtisticStrings: an anchor ring prints first (2 walls every layer, 3 solid bottom + 3 solid top + 5% sparse between), then thin strands shoot from anchor to anchor in six Z bands - each strand as a bow in Z (default 2mm), pull direction alternating, consecutive starts 15 deg apart. ROUND ring or RECT frame (photo presets 9x13..18x24 - fits the Frames system). SPIRAL winds classically (no image), PHOTO weaves a picture: dark = dense threads. Print SLOW, fan as the file says, no ironing."

