[menu __main __preprint __motion __vel __spfe]
type: list
name: Spd per feat


[menu __main __preprint __motion __vel __spfe __g1st]
type: input
name: 1st layer: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.first_layer_speed|default(75)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=first_layer_speed VALUE={menu.input|round|int}
[menu __main __preprint __motion __vel __spfe __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - the entries below edit THIS feature live"
    {% else %}
        RESPOND MSG="[Now] no feature active (before the print or unmarked section) - pick one yourself: Pre-Print > Features"
    {% endif %}


[menu __main __preprint __motion __vel __spfe __ow]
type: input
enable: {printer['gcode_macro _STATE'].file_types|default('') == '' or 'WALL-OUTER' in printer['gcode_macro _STATE'].file_types}
name: OW: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ovf_wallouter_spd|default(100)}
input_min: 20
input_max: 400
input_step: 1
gcode:
    SET_OVERRIDE_VALUE NAME=feat_spd_wallouter VALUE={menu.input|round|int}
    {% if menu.input|round|int != 100 %}
        SET_OVERRIDE_VALUE NAME=feat_on_wallouter VALUE=1
    {% endif %}
    RESPOND MSG="OW speed {menu.input|round|int}% - applies from the next WALL-OUTER segment. Full set: Live > Features"
    {% if printer['gcode_macro _STATE'].current_type == 'WALL-OUTER' %}
        APPLY_TYPE TYPE=WALL-OUTER
    {% endif %}

