name: FLAT{ '*' if printer['save_variables'].variables.seal_profile|default('FLAT')|string|upper == 'FLAT' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=seal_profile VALUE="\"FLAT\""
    RESPOND MSG="FLAT: full contact face - the all-round gasket"

[menu __main __gen __seal __set __pro __nut]
type: command
name: NUT{ '*' if printer['save_variables'].variables.seal_profile|default('FLAT')|string|upper in ('NUT','GROOVE') else '' }
gcode:
    SAVE_VARIABLE VARIABLE=seal_profile VALUE="\"NUT\""
    RESPOND MSG="NUT: groove in the face = two raised sealing lips, higher pressure on uneven flanges"

[menu __main __gen __seal __set __iro]
type: command
name: Ironing: {'ON' if printer['save_variables'].variables.seal_ironing|default(False) else 'off'}
gcode:
    SAVE_VARIABLE VARIABLE=seal_ironing VALUE={not printer['save_variables'].variables.seal_ironing|default(False)}
    RESPOND MSG="Ironing (smooths the sealing face): {'ON' if not printer['save_variables'].variables.seal_ironing|default(False) else 'off'}"

[menu __main __gen __seal __set __lh]
