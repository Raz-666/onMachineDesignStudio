    RESPOND MSG="Hole sits 2mm from the edge, the text centers between the three free sides - they never collide"
    RESPOND MSG="Mainsail: GEN_LABELS TEXT=\"TOP~BOTTOM|A B\" W=60 H=30 SIZE=8 SPACING=1 HOLE=LEFT MODE=GROW"


