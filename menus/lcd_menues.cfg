# ---------------- R64 plotter live (pen jobs only) --------------------------------------------------------------
[menu __main __live __spfe]
type: list
name: Spd per feat

[menu __main __live __spfe __gs]
type: input
name: Glob: {'%3d' % menu.input} %
input: {printer['gcode_macro _STATE'].g_speed_clean|default(100)}
input_min: 10
input_max: 400
input_step: 1
gcode:
    SET_GLOBAL_SPEED PERCENT={menu.input|round|int}

# ---- per feature (R58): % ON TOP of the global factor - never touches it ----
[menu __main __live __spfe __src]
type: command
name: Src
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fcodes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim'] %}
    {% set clean = s.g_speed_clean|default(100)|float %}
    RESPOND MSG="Speed sources - file: {s.file_speed_outer|default(0)|int}mm/s outer | your overwrites: GLOBAL {clean|round|int}% (the one regulator){% for c in fcodes %}{% if sv['ovf_' ~ c ~ '_on']|default(False) %} - {c|upper} {sv['ovf_' ~ c ~ '_spd']|default(100)|round|int}% = {(clean * sv['ovf_' ~ c ~ '_spd']|default(100)|float / 100)|round|int}% eff{% endif %}{% endfor %} | LIVE: global {clean|round|int}%, current feature: {s.current_type} (no override = 1:1 with global)"

[menu __main __live __spfe __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - 'FeatSpd/FeatOn' below edit THIS feature, Live > Features edits any feature"
    {% else %}
        RESPOND MSG="[Now] no feature marked (raft/unknown section or before the print) - use Live > Features to pick a feature yourself"
    {% endif %}

[menu __main __live __spfe __cur]
type: input
name: FeatSpd: {'%3d' % menu.input} %
input: {printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_spd']|default(100)}
input_min: 20
input_max: 400
input_step: 1
gcode:
    {% set c = printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower %}
    {% if c != '' %}
        SET_OVERRIDE_VALUE NAME=feat_spd_{c} VALUE={menu.input|round|int}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% else %}
        RESPOND MSG="No feature printing right now (raft or unmarked section) - use Live > Features to pick one"
    {% endif %}

[menu __main __live __spfe __curon]
type: command
name: FeatOn: {printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_on']|default(False)|string|upper}
gcode:
    {% set c = printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower %}
    {% if c != '' %}
        SET_OVERRIDE_VALUE NAME=feat_on_{c} VALUE={1 if not printer['save_variables'].variables['ovf_' ~ c ~ '_on']|default(False) else 0}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% else %}
        RESPOND MSG="No feature printing right now"
    {% endif %}
[menu __main __live __spfe __ow]
type: input
enable: {printer['gcode_macro _STATE'].file_types|default('') == '' or 'WALL-OUTER' in printer['gcode_macro _STATE'].file_types}
name: OW: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ovf_wallouter_spd|default(100)}
input_min: 20
input_max: 400
input_step: 1
gcode:
    SET_OVERRIDE_VALUE NAME=feat_spd_wallouter VALUE={menu.input|round|int}
    {% if menu.input|round|int != 100 %}
        SET_OVERRIDE_VALUE NAME=feat_on_wallouter VALUE=1
    {% endif %}
    RESPOND MSG="OW speed {menu.input|round|int}% - applies from the next WALL-OUTER segment. Full set: Live > Features"
    {% if printer['gcode_macro _STATE'].current_type == 'WALL-OUTER' %}
        APPLY_TYPE TYPE=WALL-OUTER
    {% endif %}

