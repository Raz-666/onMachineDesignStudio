[menu __main __system __genq __how]
type: command
name: How it works?
gcode:
    RESPOND MSG="[Gen] Heavy builds (string art, litho, color picture) run one at a time in the background. Low RAM or a busy printer parks a job - the console says so every 2 min. R224: a stuck job holds Wait:generating until its thread ends (no print starts into the overload) - a Pi restart ends it instantly. Clear queue drops everything PENDING."

[menu __main __system __genq __state]
type: command
name: 'State: {"BUILDING" if printer["save_variables"].variables.gen_busy|default(0) else "idle"}'
gcode:
    RESPOND MSG="[Gen] State: {'building' if printer['save_variables'].variables.gen_busy|default(0) else 'idle'}. If a job never finishes: Clear queue drops the PENDING ones - the running build keeps Wait:generating up until it ends. Restart the Pi (System > Pi restart) to end a leftover worker NOW - a firmware restart does NOT free RAM."

[menu __main __system __genq __clear]
type: command
name: '> Clear queue?'
gcode: _GEN_QUEUE_CLEAR

[menu __main __system __genq __clear2]
type: command
name: '>> CLEAR NOW'
gcode: _GEN_QUEUE_CLEAR CONFIRM=1

[menu __main __system __fc]
type: list
name: File check

[menu __main __system __fc __scan]
type: command
name: '> Scan now'
gcode:
    FILE_CHECK

[menu __main __system __fc __fc3]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: File check lists every g-code with its tag version: current (all markers), old (upgradeable), untouched (never processed), plotter (fine as is). RETAG upgrades old+untouched files - backup .r2bak first, never while printing, max 20 per run"

[menu __main __system __fc __fc1]
type: command
name: Retag old? arm
gcode:
    FILE_CHECK RETAG=1

[menu __main __system __fc __fc2]
type: command
name: '>> RETAG OLD NOW'
enable: {printer['gcode_macro _STATE'].fc_armed}
gcode:
    {% if printer['gcode_macro _STATE'].fc_armed|default(False) %}{menu.exit()}{% endif %}
    FILE_CHECK RETAG=1 CONFIRM=1

# R172 (.129 field report): files tagged before .129 may carry wrong feature
# markers (';TYPE:Wall outer' became CUSTOM - per-feature tuning did nothing).
# RE-FIX heals them from the slicer's own ;TYPE: comments.
[menu __main __system __fc __fc4]
type: command
name: Re-fix types? arm
gcode:
    FILE_CHECK RETAG=2

[menu __main __system __fc __fc5]
type: command
name: '>> RE-FIX TYPES NOW'
enable: {printer['gcode_macro _STATE'].fc2_armed}
gcode:
    {% if printer['gcode_macro _STATE'].fc2_armed|default(False) %}{menu.exit()}{% endif %}
    FILE_CHECK RETAG=2 CONFIRM=1

[menu __main __system __leds]
type: command
name: LEDs: {('ON' if printer['save_variables'].variables.leds_on|default(True) else 'OFF')}
gcode: TOGGLE_LEDS

# R108: LED setup submenu - chain areas (status / bed light / nozzle), the
# hardware-profile way (r2_hardware.cfg survives deleting variables.cfg)
[menu __main __system __ledcfg]
type: list
name: LED Setup
enable: {'neopixel ' in (printer.configfile.settings|list|join(' ')) or 'dotstar ' in (printer.configfile.settings|list|join(' '))}

[menu __main __system __ledcfg __stat]
type: command
name: LED info (console)
gcode: LED_INFO

[menu __main __system __ledcfg __on]
type: command
name: All LEDs: {('ON' if printer['save_variables'].variables.leds_on|default(True) else 'OFF')}
gcode: TOGGLE_LEDS

[menu __main __system __ledcfg __stn]
type: input
name: Status LEDs: {'%2d' % menu.input}
input: {printer['gcode_macro _R2_CONFIG'].led_status_n|default(4)|int if 'gcode_macro _R2_CONFIG' in printer else 4}
input_min: 0
input_max: 16
input_step: 1
gcode:
    SET_LED_LAYOUT STATUS={menu.input}

[menu __main __system __ledcfg __bdn]
type: input
name: Bed LEDs: {'%2d' % menu.input}
input: {printer['gcode_macro _R2_CONFIG'].led_bed_n|default(0)|int if 'gcode_macro _R2_CONFIG' in printer else 0}
input_min: 0
input_max: 16
input_step: 1
gcode:
    SET_LED_LAYOUT BED={menu.input}

[menu __main __system __ledcfg __bedon]
type: command
name: Bed light: {('ON' if printer['gcode_macro _R2_CONFIG'].led_bed_on|default(1)|int == 1 else 'OFF') if 'gcode_macro _R2_CONFIG' in printer else '-'}
enable: {'gcode_macro _R2_CONFIG' in printer and printer['gcode_macro _R2_CONFIG'].led_bed_n|default(0)|int > 0}
gcode: SET_BED_LIGHT TOGGLE=1

[menu __main __system __ledcfg __bedbr]
type: input
name: Bed bright: {'%3d' % menu.input}%
input: {((printer['gcode_macro _R2_CONFIG'].led_bed_bright|default(0.4)|float) * 100)|round|int if 'gcode_macro _R2_CONFIG' in printer else 40}
input_min: 0
input_max: 50
input_step: 5
enable: {'gcode_macro _R2_CONFIG' in printer and printer['gcode_macro _R2_CONFIG'].led_bed_n|default(0)|int > 0}
gcode:
    SET_BED_LIGHT BRIGHT={(menu.input|float / 100)|round(2)}

[menu __main __system __ledcfg __split]
type: command
name: Nozzle: {'OWN CHAIN' if ((printer['gcode_macro _R2_CONFIG'].led_nozzle_split|default(printer['save_variables'].variables.nozzle_split|default(0))) if 'gcode_macro _R2_CONFIG' in printer else printer['save_variables'].variables.nozzle_split|default(0))|int == 1 else 'MAIN CHAIN'}
enable: {'neopixel nozzle_led' in printer or 'dotstar nozzle_led' in printer}
gcode:
    {% set cur = (printer['gcode_macro _R2_CONFIG'].led_nozzle_split|default(printer['save_variables'].variables.nozzle_split|default(0)))|int if 'gcode_macro _R2_CONFIG' in printer else printer['save_variables'].variables.nozzle_split|default(0)|int %}
    SET_NOZZLE_SPLIT STATE={0 if cur == 1 else 1}

# R224 (.136s field log): the nozzle LED lives HERE now (System >
# LED Setup) - mode, live brightness and live color together with the
# rest of the LED settings. AUTO = work light while printing | ON = always on, your color (tool light,
# works even with the frame LEDs OFF) | OFF = never. Brightness/color apply LIVE.
