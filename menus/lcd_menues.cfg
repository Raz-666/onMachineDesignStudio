    RESPOND MSG="MAP mode { nxt }: {% if nxt == 'ONCE' %}the picture wraps once around, aspect-true - place it with the Pos row below (the detected background hides the seam){% else %}endless mirrored wrap in both directions (seamless, repeats over the height){% endif %}"

