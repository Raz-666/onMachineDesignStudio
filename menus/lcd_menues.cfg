[menu __main __gen __litho __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Litho: upload a .png/.jpg into the gcodes folder (drag+drop in Mainsail) - the Images list refreshes on its own, plotter uploads included | Slot press = Create. The picture prints STANDING (layer lines run with the image), dark = thick, light = thin - white/natural PLA glows best | Settings: Height scales the picture, Levels posterizes (0 = photo), Frame keeps it straight, Ironing smooths the light side | The image is auto-optimized (contrast, smoothing, mirror). Deleting an image never touches its plotter .gcode | Mainsail: LITHO_CREATE INDEX=0 (first image) - settings live in the litho_* save variables"

# =====================================================================================
#  COLOR PICTURE / ColorPic (R120, in the Tools menu) - picture -> multi-color
#  print, NO backlight needed. Same image list as the lithophane (the watcher
#  pushes litho_files). The picture is quantized into 2..8 brightness bands,
#  lightest color first; M600 at every band boundary - the nozzle LED BLINKS
#  from the current to the next color while you swap the filament.
#  Needs [include klipper-e3-r2d2/macros/18_colorpic.cfg].
# =====================================================================================
[menu __main __gen __cpic]
type: list
name: ColorPicture
enable: {'gcode_macro _COLORPIC_SWAP' in printer}

[menu __main __gen __cpic __img]
type: list
name: Images
enable: {printer['save_variables'].variables.litho_files|default([])|length > 0}

[menu __main __gen __cpic __img __pgi]
type: command
name: {('Page ' ~ (printer['save_variables'].variables.litho_page|default(0)|int + 1) ~ '/' ~ ((((printer['save_variables'].variables.litho_total|default(0)|int - 1) // 10) + 1) if printer['save_variables'].variables.litho_total|default(0)|int > 0 else 1) ~ ' - ' ~ printer['save_variables'].variables.litho_total|default(0)|int ~ ' img')}
gcode:
