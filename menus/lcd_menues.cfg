[menu __main __optprint __start]
type: command
enable: {printer['save_variables'].variables.opt_print_name|default('') != ''}
name: 'START {printer['save_variables'].variables.opt_print_name|default('')|truncate(12, True, '')}'
gcode:
    {% set nm = printer['save_variables'].variables.opt_print_name|default('')|replace('"', '') %}
    {% if nm != '' %}
        SDCARD_PRINT_FILE FILENAME="optimized/{nm}"
    {% else %}
        RESPOND MSG="[opt] pick a file number first"
    {% endif %}

[menu __main __optprint __vals]
type: command
enable: {printer['save_variables'].variables.opt_print_name|default('') != ''}
name: 'Values > Pre-Print'
gcode:
    {% set nm = printer['save_variables'].variables.opt_print_name|default('')|replace('"', '') %}
    {% if nm != '' %}
        SAVE_VARIABLE VARIABLE=opt_load_name VALUE='"{nm}"'
        SAVE_VARIABLE VARIABLE=opt_load_nonce VALUE={printer['save_variables'].variables.opt_load_nonce|default(0)|int + 1}
        RESPOND MSG="[opt] loading tuned values from optimized/{nm} into Pre-Print"
        M117 Opt values: {nm|truncate(14, True, '')}
    {% else %}
        RESPOND MSG="[opt] pick a file number first"
    {% endif %}

# =====================================================================================
#  LIVE TUNING - everything changeable DURING the print
# =====================================================================================
[menu __main __live]
type: list
enable: {printer['gcode_macro _STATE'].mode in ['printing','paused','filament']}
name: Live Tuning

# ---- Babystepping right at the TOP (was buried one submenu deeper) - the "magic 4"
[menu __main __live __temp]
type: list
name: Temps & Fan

[menu __main __live __temp __hotend]
type: input
name: Hotend: {'%3d' % menu.input}C
input: {printer.extruder.target}
input_min: 0
input_max: 280
input_step: 5
gcode:
    SET_LIVE_HOTEND_TEMP T={menu.input|round|int}

[menu __main __live __temp __bed]
type: input
name: Bed: {'%3d' % menu.input}C
input: {printer.heater_bed.target}
input_min: 0
input_max: 120
input_step: 5
gcode:
    SET_LIVE_BED_TEMP T={menu.input|round|int}

# R175c (.130): the fan row is an ABSOLUTE speed dial now. The .129 field
# confusion ('full power only with hold 100% + clamp off + fan 150%') came
# from a scale factor posing as the fan value. Chain: LIVE > layer 1 >
# HOLD > SCALE > CLAMP - 'How?' shows the math.
[menu __main __live __temp __fan]
type: input
name: Fan: {'%3d' % menu.input}% (LIVE)
input: {printer['gcode_macro _STATE'].f_fan_live|default(0)}
input_min: 0
input_max: 100
input_step: 5
gcode:
    SET_FAN_LIVE PERCENT={menu.input|round|int}

[menu __main __live __temp __fon]
type: command
name: {('LIVE: ON' if printer['gcode_macro _STATE'].f_fan_live_on|default(False) else 'LIVE: off')}
gcode:
    SET_FAN_LIVE ON={0 if printer['gcode_macro _STATE'].f_fan_live_on|default(False) else 1}

[menu __main __live __temp __fnow]
type: command
name: How? (fan math)
gcode:
    _FAN_CHAIN_NOW

[menu __main __live __temp __fscale]
type: input
name: Scale: {'%d' % menu.input}% file
input: {printer['gcode_macro _STATE'].f_fan_scale|default(1)*100|round|int}
input_min: 25
input_max: 150
input_step: 5
gcode:
    SET_FAN_SCALE PERCENT={menu.input|round|int}

[menu __main __live __temp __fclamp]
type: command
name: Clamp: {('ON ' ~ printer['save_variables'].variables.ov_fan_min|default(0)|round(0)|int ~ '-' ~ printer['save_variables'].variables.ov_fan_max|default(100)|round(0)|int ~ '%') if printer['save_variables'].variables.ov_fan_clamp_on|default(False) else 'off'}
gcode:
    SET_FAN_CLAMP ON={1 if not printer['save_variables'].variables.ov_fan_clamp_on|default(False) else 0}

[menu __main __live __temp __fmin]
type: input
name: FMin: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ov_fan_min|default(10)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_FAN_CLAMP MIN={menu.input|round|int}

[menu __main __live __temp __fmax]
type: input
name: FMax: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ov_fan_max|default(90)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_FAN_CLAMP MAX={menu.input|round|int}

[menu __main __live __temp __fbr]
type: input
name: FBr: {'%3d' % menu.input}% 0=off
input: {printer['save_variables'].variables.ov_fan_bridge|default(0)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_FAN_CLAMP BRIDGE={menu.input|round|int}

# R115 (.87 field log): the fan entry above only SCALES the file's M106 values
# - dynamic slicer fan curves kept coming through ('the file value always
# wins'). HOLD replaces them: your % rules until you set 0 (= file again).
[menu __main __live __temp __fhold]
type: input
name: Hold: {'%3d' % menu.input}%
input: {printer['gcode_macro _STATE'].f_fan_hold|default(0)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_FAN_HOLD PERCENT={menu.input|round|int}


# R175b: Z-Hopping got its own submenu (was two loose rows)
[menu __main __live __zhop]
type: list
name: Z-Hopping

[menu __main __live __zhop __lzh]
