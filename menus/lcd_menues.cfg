[menu __main __gen __plot __txt __run]
type: command
name: {('> AGAIN = start' if printer['gcode_macro _STATE'].gen_arm|default('') == 'plottext' else '> Plot this file')}
gcode:
    {% if printer['gcode_macro _STATE'].gen_arm|default('') == 'plottext' %}{menu.exit()}{% endif %}
    {% set nm = printer['save_variables'].variables.plot_name_buf|default('')|string|trim %}
    {% if nm == '' %}
        RESPOND MSG="Plot text: type the file name first (e.g. notes -> notes.txt) - or PLOT_TEXT FILE=notes.txt in the console"
    {% else %}
        PLOT_TEXT FILE="{nm}.txt" CONFIRM=1
    {% endif %}

[menu __main __gen __plot __txt __h2]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Upload a text file to the gcodes folder (Mainsail), type its name here WITHOUT .txt, then Plot this file | Or in the console: PLOT_TEXT FILE=notes.txt - a name.txt.gcode upload converts itself | The text auto-wraps and auto-shrinks to fit ONE page - umlauts print (they are hinted on the LCD only)"

[menu __main __gen __plot __pst]
type: command
name: {('> AGAIN = start' if printer['gcode_macro _STATE'].gen_arm|default('') == 'plotstat' else '> Plot status')}
gcode:
    {% if printer['gcode_macro _STATE'].gen_arm|default('') == 'plotstat' %}{menu.exit()}{% endif %}
    PLOT_STATUS CONFIRM=1

[menu __main __gen __plot __st]
type: list
name: Start overrides

[menu __main __gen __plot __st __sp]
