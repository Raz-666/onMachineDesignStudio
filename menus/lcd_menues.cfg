# R74: text lines per label (1..3), font size (0 = auto), letter spacing
[menu __main __gen __labels __set __lines]
type: input
name: Lines: {'%d' % menu.input}
input: {printer['save_variables'].variables.label_lines|default(1)}
input_min: 1
input_max: 5
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_lines VALUE={menu.input|round|int}
    LABEL_FIT_CALC

[menu __main __gen __labels __set __size]
type: input
name: Size: {('auto' if menu.input == 0 else '%.1fmm' % (menu.input / 10.0))}
input: {(printer['save_variables'].variables.label_size|default(0) * 10)|round|int}
input_min: 0
input_max: 600
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=label_size VALUE={menu.input / 10.0}
    LABEL_FIT_CALC
    RESPOND MSG="Label font size: {menu.input / 10.0 if menu.input > 0 else 'AUTO - the font fills the label'}mm caps {'' if menu.input > 0 else ''}- letters never stretch - if the size does not fit, the LABEL grows (the text never gets shortened)"

[menu __main __gen __labels __set __spc]
type: input
name: Spc: {'+%.1f' % (menu.input / 10.0)}
input: {(printer['save_variables'].variables.label_spacing|default(0) * 10)|round|int}
input_min: 0
input_max: 30
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_spacing VALUE={menu.input / 10.0}
    LABEL_FIT_CALC

# R119: the label height is set in MILLIMETERS (0 = auto, the classic
# layer count from label_base_layers applies - GEN_LABELS BASE_LAYERS= too).
# Above 6 base layers the label prints 4 bottom + 4 top solid with sparse
# infill between (like the frames) - so 2cm tall labels stay fast + light.
[menu __main __gen __labels __set __ht]
type: input
name: Height: {('auto' if menu.input == 0 else '%.1fmm' % (menu.input / 10.0))}
input: {(printer['save_variables'].variables.label_height|default(0)|float * 10)|round|int}
input_min: 0
input_max: 200
input_step: 2
gcode:
    SAVE_VARIABLE VARIABLE=label_height VALUE={menu.input / 10.0}
    RESPOND MSG="Label height: {('auto - the layer count rules (GEN_LABELS BASE_LAYERS=)' if menu.input == 0 else '%.1fmm base plate - more than 6 layers prints 4 bottom + 4 top solid with sparse infill between' % (menu.input / 10.0))}"

# R119: label shape - RECT (classic), OVAL or ROUND with a corner radius.
[menu __main __gen __labels __set __shape]
type: input
name: Shape: {("RECT","OVAL","ROUND")[menu.input|int] if 0 <= menu.input|int <= 2 else "?"}
input: {printer['save_variables'].variables.label_shape|default(0)|int}
input_min: 0
input_max: 2
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_shape VALUE={menu.input|round|int}

# R119: corner radius for Shape: ROUND (RECT/OVAL ignore it).
[menu __main __gen __labels __set __corner]
type: input
name: Corner: {'%.1fmm' % (menu.input / 10.0)}
input: {(printer['save_variables'].variables.label_corner|default(2.0)|float * 10)|round|int}
input_min: 0
input_max: 80
input_step: 5
gcode:
