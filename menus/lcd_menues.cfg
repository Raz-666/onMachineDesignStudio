# =====================================================================================
#  R160 (.120): FIXES - everything that REWRITES the selected file, in ONE
#  self-explaining place (they used to sit between the info rows - field
#  report .115: nobody found them). Markers like File info: > = press RUNS
#  the fix, * = turn to edit the value, plain = information.
#  Every fix writes a .r2bak backup next to the file first.
# =====================================================================================
[menu __main __preprint __fixes]
type: list
name: Fixes

[menu __main __preprint __fixes __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Fixes REWRITE the selected file (a .r2bak backup stays next to it). > rows run on press, * rows are values you edit by turning. Nothing rewrites while a print runs | Retract fix: explicit slicer retracts become G10/G11 - YOUR retraction rules, live-tunable. Vol->mm: repairs Marlin volumetric files. Segment fix: merges micro moves (MCU 'Timer too close'). Flow cap: slows only moves above your cap. Travel: travel speed + accel | Every fix: press = start sound + the display shows the progress (you leave the menu automatically). A print start waits until the fix is done - the melody confirms. Fixes run ONE after another (segment, then travel - the second applies to the fixed file) | Quality fix: retract+hop only where a travel really CROSSES ink (golden rule). Speed fix: direct ways + ironing skipped"

# R175b (.130): 'why does the segment fix exist' explained right in
# the menu - the field report asked what it actually does.
[menu __main __preprint __fixes __seg]
type: command
name: Why segments?
gcode:
    RESPOND MSG="Segment fix: slicer files with thousands of tiny moves (>450/s) outrun the MCU - it cannot plan them fast enough and shuts down (Timer too close). The fix merges micro segments below ~0.1mm: smaller than the 0.4mm nozzle width, so the print result stays the same - only the controller keeps up again."
# R212 (.136k): File check moved back to System > File check (R93's
# home). R175b (.130) had tucked it into Fixes as a COMMAND with
# children - the retag arms were unreachable on the LCD ever since,
# and the console text kept pointing to System > File check.
# R214 (.136m, field wish): File check ALSO lives here again - as a
# proper LIST this time (children open on the LCD), so the retag round
# is reachable from the file you are about to print. Both places run
# the same macros; nothing is duplicated on disk.

[menu __main __preprint __fixes __fc]
type: list
name: File check

[menu __main __preprint __fixes __fc __scan]
type: command
name: '> Scan now'
gcode:
    FILE_CHECK

[menu __main __preprint __fixes __fc __fc3]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: File check lists every g-code with its tag version: current (all markers), old (upgradeable), untouched (never processed), plotter (fine as is). RETAG upgrades old+untouched files - backup .r2bak first, never while printing, max 20 per run (same functions as System > File check)"

[menu __main __preprint __fixes __fc __fc1]
type: command
name: Retag old? arm
gcode:
    FILE_CHECK RETAG=1

[menu __main __preprint __fixes __fc __fc2]
type: command
name: '>> RETAG OLD NOW'
enable: {printer['gcode_macro _STATE'].fc_armed}
gcode:
    {% if printer['gcode_macro _STATE'].fc_armed|default(False) %}{menu.exit()}{% endif %}
    FILE_CHECK RETAG=1 CONFIRM=1

[menu __main __preprint __fixes __fc __fc4]
type: command
name: Re-fix types? arm
gcode:
    FILE_CHECK RETAG=2

[menu __main __preprint __fixes __fc __fc5]
type: command
name: '>> RE-FIX TYPES NOW'
enable: {printer['gcode_macro _STATE'].fc2_armed}
gcode:
    {% if printer['gcode_macro _STATE'].fc2_armed|default(False) %}{menu.exit()}{% endif %}
    FILE_CHECK RETAG=2 CONFIRM=1

[menu __main __preprint __fixes __retst]
type: command
name: 'Ret: {'FIX!' if printer['gcode_macro _PREVIEW'].retract_status|default('') == 'fix' else ('can ' ~ printer['gcode_macro _PREVIEW'].retract_max|default(0)|round(1) ~ 'mm' if printer['gcode_macro _PREVIEW'].retract_status|default('') == 'can' else ('fixed' if printer['gcode_macro _PREVIEW'].retract_status|default('') == 'fixed' else ('fw' if printer['gcode_macro _PREVIEW'].retract_status|default('') == 'fw' else '--')))}'
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {% set pv = printer['gcode_macro _PREVIEW'] %}
    {% if pv.retract_status|default('') == 'fix' %}
        RESPOND MSG="File retraction: FIX! explicit slicer retracts up to {pv.retract_max|default(0)|round(1)} mm - they OVERRIDE your tuned direct-drive retraction and cannot be live-tuned. RetFix file below rewrites them to G10/G11 (YOUR retraction rules from then on)"
    {% elif pv.retract_status|default('') == 'can' %}
        RESPOND MSG="File retraction: optional - explicit slicer retracts up to {pv.retract_max|default(0)|round(1)} mm. RetFix file below rewrites them to G10/G11 - only if you WANT firmware retraction to rule them live"
    {% elif pv.retract_status|default('') == 'fixed' %}
        RESPOND MSG="File retraction: already FIXED (G10/G11 rewritten) - your retraction rules, nothing to do"
    {% elif pv.retract_status|default('') == 'fw' %}
        RESPOND MSG="File retraction: slicer-native G10/G11 - your retraction rules, nothing to do"
    {% else %}
        RESPOND MSG="File retraction: unknown (old v4-tagged file - RETAG via System > File check adds the verdict)"
    {% endif %}

[menu __main __preprint __fixes __fixr]
type: command
name: 'Fix: Retraction'
# R112: offered ONLY when the verdict says so - 'fix' (Bowden-era lengths
# that override your tuned retraction) or 'can' (moderate, optional).
# fw/fixed files never show it again
enable: {printer['gcode_macro _PREVIEW'].name|default('') != '' and printer['gcode_macro _PREVIEW'].retract_status|default('') in ['fix', 'can']}
gcode:
    {menu.exit()}
    FIX_FILE WHAT=RETRACT

[menu __main __preprint __fixes __rt]
type: command
name: {'> RetFix: ' ~ ('ON' if printer['save_variables'].variables.retract_rewrite|default(0)|int > 0 else 'OFF')}
gcode:
    RETRACT_FIX STATE={0 if printer['save_variables'].variables.retract_rewrite|default(0)|int > 0 else 1}

[menu __main __preprint __fixes __fixv]
type: command
name: 'Fix: Volume to mm'
enable: {printer['gcode_macro _PREVIEW'].volumetric|default(0)|int > 0 or printer['gcode_macro _STATE'].file_volumetric|default(False)}
gcode:
    {menu.exit()}
    FIX_FILE WHAT=VOL

[menu __main __preprint __fixes __fixs]
type: command
name: 'Fix: Segments (MCU)'
# R133 (field log .94, MCU 'Timer too close'): merge micro moves (<0.1mm
# hops) - the selection warning points here; MOVERATE lands in the info
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {menu.exit()}
    FIX_FILE WHAT=SEGMENTS

[menu __main __preprint __fixes __fixq]
type: command
name: 'Fix: Quality'
# R216 (.136n): the golden rule on a sliced file - only ink-crossing
# travels keep their retract + hop armor
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {menu.exit()}
    FIX_FILE WHAT=QUALITY

[menu __main __preprint __fixes __fixp]
type: command
name: 'Fix: Speed'
# R216 (.136n): consecutive travels merge into direct ways, the
# ironing pass is skipped (the slowest, cosmetic-only pass)
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {menu.exit()}
    FIX_FILE WHAT=SPEED

[menu __main __preprint __fixes __fixcv]
type: input
# R122: range opened to 0.5..50 - a HIGH-FLOW hotend does 20-35+ mm3/s,
# the old 4..25 cap hid exactly the values it is bought for (the fix only
# lowers moves ABOVE the cap, so a high limit never slows a stock hotend)
name: {'* Cap: ' ~ '%4.1f'|format(menu.input) ~ ' mm3/s'}
input: {printer['save_variables'].variables.flowcap_limit|default(12.0)}
input_min: 0.5
input_max: 50
input_step: 0.5
gcode:
    SAVE_VARIABLE VARIABLE=flowcap_limit VALUE={menu.input|round(1)}
    RESPOND MSG="Flow cap {menu.input|float|round(1)} mm3/s - stock hotend ~8-15, high-flow 20-35. The fix lowers ONLY the moves above it (travels untouched) - FIX_FILE WHAT=FLOWCAP CAP=x takes this as its default"

[menu __main __preprint __fixes __fixc]
type: command
name: 'Fix: Flow cap'
# R121: ALWAYS visible (user request) - useful whenever you print faster
# (live speed up => the flow rises with it, the cap protects the hotend)
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {menu.exit()}
    RESPOND MSG="File flow cap: peak {printer['gcode_macro _STATE'].file_maxrate|default(0)|float|round(1)} mm3/s, your cap {printer['save_variables'].variables.flowcap_limit|default(12.0)|float|round(1)} - the fix lowers F on the moves above the cap (travels/retracts untouched). Great when you speed up live: the flow rises with the speed"
    FIX_FILE WHAT=FLOWCAP

[menu __main __preprint __fixes __tvf]
type: command
name: {'Trav: ' ~ printer['gcode_macro _STATE'].file_travel|default(0)|round(0)|int ~ 'mm/s'}
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File travels: {s.file_travel|default(0)|float|round(0)|int} mm/s (measured). Set the speed below, 0 = keep the file's, then 'Fix travel' rewrites the file + adds the live markers (Live > Features > Travel)"

# R121: direct travel control - 0 = keep the file's speed

[menu __main __preprint __fixes __tvsp]
type: input
name: {'* Travel: ' ~ '%3d'|format(menu.input) ~ 'mm/s'}
input: {printer['save_variables'].variables.travel_speed|default(0)}
input_min: 0
input_max: 300
input_step: 10
