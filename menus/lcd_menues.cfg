# R109: what happens after a generator built its file - sticky for every
# generator (each generator's OUT= parameter overrides it per run)
[menu __main __gen __out]
type: command
name: After gen: {'QUEUE' if printer['save_variables'].variables.gen_out|default(1)|int == 1 else 'PREVIEW'}
gcode:
    {% set cur = printer['save_variables'].variables.gen_out|default(1)|int %}
    _GEN_OUT_SET OUT={0 if cur == 1 else 1}

[menu __main __gen __outi]
type: command
name: What does that mean?
gcode:
    RESPOND MSG="After gen QUEUE: finished files are selected right away - files made FROM a selected file (range excerpt, texture) replace that selection. The start dialog asks AS SLICED / AS LEGACY as usual"
    RESPOND MSG="After gen PREVIEW: files only appear in the file list - check them in the 3D viewer first, start by hand when you like them"

[menu __main __gen __cable]
type: list
name: Cable ties
enable: {'gcode_macro _GENERATORS' in printer}

[menu __main __gen __cable __info]
type: command
name: Info
gcode:
    CABLE_TIE_INFO

[menu __main __gen __cable __set]
type: list
name: Settings

# count first (what am I printing?), then the tie dimensions
[menu __main __gen __cable __set __cnt]
type: input
name: Count: {'%2d' % menu.input}
input: {printer['save_variables'].variables.tie_count|default(6)}
input_min: 1
input_max: 24
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=tie_count VALUE={menu.input|round|int}

[menu __main __gen __cable __set __len]
type: input
name: Len: {'%3d' % menu.input}mm
input: {printer['save_variables'].variables.tie_length|default(120)}
input_min: 50
