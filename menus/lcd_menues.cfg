name: 'Y: {'%.2f'|format(menu.input)}'
input: {printer.gcode_move.homing_origin.y|default(0)|float}
input_min: -5
input_max: 5
input_step: 0.05
realtime: True
gcode:
    SET_GCODE_OFFSET Y={'%.2f'|format(menu.input)} MOVE=1


