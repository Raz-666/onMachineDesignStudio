[menu __main __gen __labels __set]
type: list
name: Settings

# R170 (field report .128): the label size LIVE in the menu - updates ~2s
# after every text/font/size/hole change (no Fit press needed anymore)
[menu __main __gen __labels __set __now]
type: command
name: 'Now: {printer["save_variables"].variables.label_w_now|default(0)|int}x{printer["save_variables"].variables.label_h_now|default(0)|int}mm Caps {printer["save_variables"].variables.label_caps_now|default(0)}'
gcode:
    RESPOND MSG="Label NOW = the size the current text prints at (live: grow result incl. hole, fixed = W/H with the auto-fitted caps). The numbers refresh automatically while you type"

[menu __main __gen __labels __set __mode]
type: input
name: Mode: {("GROW","FIXED")[menu.input|int] if menu.input|int in (0,1) else "?"}
input: {printer["save_variables"].variables.label_mode|default(0)}
input_min: 0
input_max: 1
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_mode VALUE={menu.input|round|int}
    LABEL_FIT_CALC
    RESPOND MSG="Label mode: GROW = the label grows until the text fits (Size rules, W/H are minimums - the needed size becomes the W/H lower limit)"
    RESPOND MSG="Label mode: FIXED = the label stays at W/H exactly - the font scales into it (Size = upper bound, 0 = as large as possible)"

[menu __main __gen __labels __set __w]
type: input
name: W: {'%3dmm' % menu.input}
input: {printer["save_variables"].variables.label_w|default(50)}
input_min: {printer["save_variables"].variables.label_min_w|default(12)|int}
input_max: 220
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_w VALUE={menu.input|round|int}
    LABEL_FIT_CALC

[menu __main __gen __labels __set __h]
type: input
name: H: {'%3dmm' % menu.input}
input: {printer["save_variables"].variables.label_h|default(10)}
input_min: {printer["save_variables"].variables.label_min_h|default(10)|int}
input_max: 220
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_h VALUE={menu.input|round|int}
    LABEL_FIT_CALC

# R82: five fonts - SMOOTH (handwriting-like default), MONO (technical, even
# strokes), and three new SMALL-TEXT fonts: COND = Oswald (condensed, tall
# x-height - more characters per mm), NARROW = Roboto Condensed (clean,
# narrow), CAPS = Bebas Neue (everything prints as capitals - key fobs).
# A saved PIXEL selection maps to SMOOTH. The '*' marks the active font.
[menu __main __gen __labels __set __fnt]
type: list
name: Font

[menu __main __gen __labels __set __fnt __sm]
type: command
name: SMOOTH{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'SMOOTH' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"SMOOTH\""
    RESPOND MSG="Font SMOOTH: handwriting-like, the all-rounder"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __mo]
type: command
name: MONO{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'MONO' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"MONO\""
    RESPOND MSG="Font MONO: technical, even letter widths"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __co]
type: command
name: COND{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'COND' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"COND\""
    RESPOND MSG="Font COND (Oswald): condensed + tall - best for small labels"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __na]
type: command
name: NARROW{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'NARROW' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"NARROW\""
    RESPOND MSG="Font NARROW (Roboto Cond.): clean + narrow - small text"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __ca]
type: command
name: CAPS{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'CAPS' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"CAPS\""
    RESPOND MSG="Font CAPS (Bebas): prints everything as capitals - name plates"
    LABEL_FIT_CALC

