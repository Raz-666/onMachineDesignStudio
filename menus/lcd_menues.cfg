# =====================================================================================
#  TOOLS (R87: the four part generators share ONE top-level menu so the
#  root stays clear at 7 entries. Cable ties, Angles+Flat, Lithophane,
#  Gaskets, Frames, Labels, Plotter
#  each keep their own sub-menu below. The guards stay on the children:
#  cable/angle need 17_generator.cfg, Labels needs 16_labels.cfg,
#  Plotter is always available.)
# =====================================================================================
[menu __main __gen]
type: list
name: Tools

# =====================================================================================
#  CABLE TIES (R86, in the Tools menu) - printable cable-tie generator.
#  Settings live in save_variables, Create bumps cable_tie_nonce and the
#  r2-postproc watcher builds the file (beeps + selects).
#  Needs [include klipper-e3-r2d2/macros/17_generator.cfg].
# =====================================================================================
# R133c: the watcher queues generator jobs (one at a time, print first).
# This clears everything still waiting - the field log had a pile of
# jobs from a chaotic session silently recreating deleted files.
[menu __main __gen __qcancel]
type: command
name: Cancel job queue
