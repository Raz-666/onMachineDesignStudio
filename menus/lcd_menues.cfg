[menu __main __preprint __mods __rng __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Excerpt prints ONLY layers From..To - layer From becomes the first layer, From/To are capped to the file | Floor/Top: FOOTPRINT (hull) or OUTLINE (true outline of the layer), each as GRID or SOLID fill | The excerpt ends with a proper PRINT_END: park + cool down - the nozzle never stays on the print | Select the file first, then Create. The excerpt appears as <name>_L<from>-<to>.gcode - start AS LEGACY | Stop@ ends the print NORMALLY when that layer begins (0 = off, also in Live > Pause & Control)"

