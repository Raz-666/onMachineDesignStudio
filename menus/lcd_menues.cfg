input_min: 0.12
input_max: 0.32
input_step: 0.04
gcode:
    SAVE_VARIABLE VARIABLE=seal_layer_h VALUE={menu.input|float|round(2)}

[menu __main __gen __seal __set __vers]
type: input
name: Vers: V{'%02d' % menu.input}
input: {printer["save_variables"].variables.gen_version|default(1)}
input_min: 1
input_max: 9
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=gen_version VALUE={menu.input|round|int}

[menu __main __gen __seal __gen]
type: command
name: Create (beeps)
gcode:
    SEAL_GENERATE

[menu __main __gen __seal __how]
type: command
name: How it works
gcode:
    RESPOND MSG="Gaskets: OD/ID/Height, Create - one continuous spiral per band (no seam), prints at 15mm/s"
    RESPOND MSG="NUT = groove + two sealing lips for uneven flanges (needs 2mm+ height - falls back to FLAT if too thin)"
    RESPOND MSG="Measure the sealing surface, not the pipe: OD/ID = the flange faces. TPU seals best, PETG works"
    RESPOND MSG="Mainsail: GEN_SEAL OD=40 ID=20 HEIGHT=1.2 PROFILE=FLAT IRONING=0"

