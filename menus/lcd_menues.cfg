[menu __main __live __feat]
type: list
name: Features

[menu __main __live __feat __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - edits below apply from the next segment of that feature"
    {% else %}
        RESPOND MSG="[Now] no feature marked yet (raft/unknown) - every feature is still editable, it applies when the file reaches it"
    {% endif %}

[menu __main __live __feat __inf]
type: command
# R174b (.129 field log 2): the ONE line that ends the 'ironing does nothing'
# confusion - it shows WHICH features this file really has. Everything else
# is (parked): values stay stored and apply the moment a file has the feature.
name: In file: {printer['gcode_macro _STATE'].file_types|default('')|replace('WALL-OUTER','WO')|replace('WALL-INNER','WI')|replace('INFILL-SPARSE','SP')|replace('INFILL-SOLID','SO')|replace('SURFACE-TOP','TP')|replace('SURFACE-BOTTOM','BT')|replace('OVERHANG-PERIM','OH')|replace('INTERNAL-BRIDGE','IB')|replace('PRIME-TOWER','PT')|replace('WALL-OUTER','WO')|replace('BRIDGE','BR')|replace('GAPS','GP')|replace('SUPPORT','SU')|replace('IRONING','IR')|replace('SKIRT','SK')|replace('BRIM','BM')|replace('CUSTOM','CU')|replace('TRAVEL','TV')|replace(' ','')|truncate(11, True, '') if printer['gcode_macro _STATE'].file_types|default('') != '' else '?'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set ft = s.file_types|default('') %}
    {% if ft == '' %}
        RESPOND MSG="[In file] no file types known yet (file just selected / legacy without markers)"
    {% else %}
        RESPOND MSG="[In file] THIS file has: {ft} - every OTHER feature shows (parked): its values are stored and apply the moment a file actually contains that feature"
    {% endif %}

[menu __main __live __feat __shp]
type: command
# R116: 'n/a' when the printer has no [input_shaper] section (then Klipper runs
# unshaped anyway - the switch has nothing to do; the click explains it on LCD)
name: ShpOff: {('n/a (no shaper)' if 'input_shaper' not in printer else ('ON @ ' ~ (printer['save_variables'].variables.ovf_shaper_off_feat|default('wallouter'))[:7]) if printer['save_variables'].variables.ovf_shaper_off_on|default(False) else 'off')}
gcode:
    SET_FEAT_SHAPER_OFF STATE={1 if not printer['save_variables'].variables.ovf_shaper_off_on|default(False) else 0}

# R121: travel segments - markers come from the Pre-Print travel fix; the
# percent rides on top of the file's (or fixed) travel speed
[menu __main __live __feat __tv]
type: list
name: Travel

[menu __main __live __feat __tv __on]
type: command
name: On: {printer['save_variables'].variables.ovf_travel_on|default(False)|string|upper}
gcode:
    SET_OVERRIDE_VALUE NAME=feat_on_travel VALUE={1 if not printer['save_variables'].variables.ovf_travel_on|default(False) else 0}

[menu __main __live __feat __tv __fs]
type: command
name: File: {(printer['gcode_macro _STATE'].file_travel|default(0)|round(0)|int|string ~ 'mm/s') if printer['gcode_macro _STATE'].file_travel|default(0) > 0 else '--'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="[File] TRAVEL: {s.file_travel|default(0)|float|round(0)|int} mm/s original | YOUR override: {printer['save_variables'].variables.ovf_travel_spd|default(100)|round|int}% x global {s.g_speed_clean|default(100)|round|int}% (speed), {printer['save_variables'].variables.ovf_travel_acc|default(0)|round|int} mm/s2 (accel) - needs the travel markers (Pre-Print > File > Fix travel adds them)"

