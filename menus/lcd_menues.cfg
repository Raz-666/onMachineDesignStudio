# ---------------- R123: PA per feature - QUICK ACCESS (Pre-Print - applies at print start) --------
# every feature's pressure advance in ONE list (the full parameter
# set - speed/accel/flow/PA - stays in Live > Features > <feature>)
[menu __main __preprint __motion __ext]
type: list
name: Extrusion

[menu __main __preprint __motion __ext __pafe]
type: list
name: PA per feat

[menu __main __preprint __motion __ext __pafe __gon]
type: command
name: PA: {printer['save_variables'].variables.ov_pa|default(0.045)} ({'ON' if printer['save_variables'].variables.ov_pa_on|default(False) else 'off'})
gcode: TOGGLE_OVERRIDE NAME=pa

[menu __main __preprint __motion __ext __pafe __gval]
type: input
name: PA: {'%.3f' % menu.input}
input: {printer['save_variables'].variables.ov_pa|default(0.045)}
input_min: 0
input_max: 0.2
input_step: 0.005
gcode:
    SET_OVERRIDE_VALUE NAME=pa VALUE={menu.input|round(4)}

[menu __main __preprint __motion __ext __pafe __gsmon]
type: command
name: Smooth: {printer['save_variables'].variables.ov_pa_smooth|default(0.04)} ({'ON' if printer['save_variables'].variables.ov_pa_smooth_on|default(False) else 'off'})
gcode: TOGGLE_OVERRIDE NAME=pa_smooth

[menu __main __preprint __motion __ext __pafe __gsmv]
type: input
name: Smooth: {'%.2f'|format(menu.input)}
input: {printer['save_variables'].variables.ov_pa_smooth|default(0.04)}
input_min: 0.01
input_max: 0.1
input_step: 0.01
gcode:
    SET_OVERRIDE_VALUE NAME=pa_smooth VALUE={menu.input|round(2)}

[menu __main __preprint __motion __ext __pafe __gfile]
type: command
name: File PA: {printer['gcode_macro _STATE'].file_pa}
gcode:
    RESPOND MSG="The gcode file sets PA {printer['gcode_macro _STATE'].file_pa} - your override wins while ON"
[menu __main __preprint __motion __ext __pafe __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - the entries below edit THIS feature live"
    {% else %}
        RESPOND MSG="[Now] no feature active (before the print or unmarked section) - pick one yourself: Pre-Print > Features"
    {% endif %}


