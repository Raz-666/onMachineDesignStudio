gcode:
    SAVE_VARIABLE VARIABLE=litho_ironing VALUE={not printer['save_variables'].variables.litho_ironing|default(False)}
    RESPOND MSG="Ironing (smooth slow pass over the light side): {'ON' if not printer['save_variables'].variables.litho_ironing|default(False) else 'off'}"

