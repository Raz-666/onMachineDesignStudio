# delete 1-8 DIRECTLY at the display (R110: nothing profile-related needs
# the console) - two presses: the first arms (message), the second deletes
[menu __main __preprint __profs __def __d1]
type: command
name: 'Del 1{(printer["gcode_macro _STATE"].def_del_arm|default(0) == 1) and " AGAIN!" or ""}'
enable: {printer['save_variables'].variables.default_preset_1|default(0) != 0}
gcode:
    {% if printer['gcode_macro _STATE'].def_del_arm|default(0) == 1 %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=def_del_arm VALUE=0
        DELETE_DEFAULT_PRESET N=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STATE VARIABLE=def_del_arm VALUE=1
        RESPOND MSG="Press Del 1 again to DELETE default preset 1"
    {% endif %}

