[menu __main __gen __litho __how]
type: command
name: How it works
gcode:
    RESPOND MSG="Litho: upload a .png/.jpg into the gcodes folder (drag+drop in Mainsail) - the Images list refreshes on its own, plotter uploads included"
    RESPOND MSG="Slot press = Create. The picture prints STANDING (layer lines run with the image), dark = thick, light = thin - white/natural PLA glows best"
    RESPOND MSG="Settings: Height scales the picture, Levels posterizes (0 = photo), Frame keeps it straight, Ironing smooths the light side"
    RESPOND MSG="The image is auto-optimized (contrast, smoothing, mirror). Deleting an image never touches its plotter .gcode"
    RESPOND MSG="Mainsail: LITHO_CREATE INDEX=0 (first image) - settings live in the litho_* save variables"

# =====================================================================================
#  GASKETS / DICHTUNGEN (R89, in the Tools menu) - sealing ring generator.
#  OD/ID/height, flat face or groove with two sealing lips. Create bumps
#  seal_nonce, the r2-postproc watcher builds the file (beeps + selects).
#  Needs [include klipper-e3-r2d2/macros/17_generator.cfg].
# =====================================================================================
