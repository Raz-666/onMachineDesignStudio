name: PLATE{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'PLATE' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"PLATE\""
    RESPOND MSG="Font PLATE (DIN 1451): license-plate look - THE font for small, crisp labels"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __px]
