# =====================================================================================
#  R109 PROFILES - one menu, three profile types:
#    Material  : the 5 material presets (load / save current into / reset)
#    Defaults  : the 8 global default slots (save / load / delete)
#    This file : the SELECTED file's own profiles - 'pre' (your manual saves)
#                and legacy 'post' entries (pre-.128; load explicitly).
#                Auto-load applies YOUR 'pre' when present (toggle below).
#    From optimized (R169): pick one of gcodes/optimized/ - its tuned values
#                become the Pre-Print STARTING POINT for the next print.
# =====================================================================================
# R175b (.130 field wish list): the tools live together now - Offset,
# Texture, Range, Scale (R176) and the Plotter (only in plot mode).
# File info and Fixes stay on top; Profile moves to the very end.
[menu __main __preprint __mods]
type: list
name: Tools

[menu __main __preprint __mods __poff]
type: list
name: Offset X/Y/Z

# R151 (.112): ONE fine entry per axis. The old menu had a coarse (0.1mm)
# and a fine (0.05mm) row per axis - both showed and changed the SAME value
# (field report: 'why is everything doubled? they change together - that
# makes no sense'). Correct - it IS one offset per axis. Now: one row,
# 0.05mm steps, fast turn = 0.5mm.
[menu __main __preprint __mods __poff __what]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Offset shifts the NEXT print in X/Y/Z (and moves the axes right away): turn = 0.05mm, fast turn = 0.5mm - Z is the same offset as Live Tuning > Z babystepping | Typical use: first-layer too high/low -> Z here. Print sits wrong on the plate -> X/Y. Offsets apply on top of the mesh and reset with restart unless saved (Maintenance > Probe Z offset for the probe itself)"

[menu __main __preprint __mods __poff __z]
type: input
name: 'Z: {'%.2f'|format(menu.input)}'
input: {printer.gcode_move.homing_origin.z|default(0)|float}
input_min: -5
input_max: 5
input_step: 0.05
realtime: True
gcode:
    SET_GCODE_OFFSET Z={'%.2f'|format(menu.input)} MOVE=1

[menu __main __preprint __mods __poff __x]
type: input
name: 'X: {'%.2f'|format(menu.input)}'
input: {printer.gcode_move.homing_origin.x|default(0)|float}
input_min: -5
input_max: 5
input_step: 0.05
realtime: True
gcode:
    SET_GCODE_OFFSET X={'%.2f'|format(menu.input)} MOVE=1

[menu __main __preprint __mods __poff __y]
