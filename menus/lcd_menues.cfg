[menu __main __preprint __mods __rng]
type: list
name: Range/Stop

# R74: shows the selected file + its REAL layer count (from the preview push)
# and caps the From/To inputs - you can no longer dial in a layer that does
# not exist (the safety clamp in SET_LAYER_RANGE stays as the second net)
[menu __main __preprint __mods __rng __file]
type: command
name: File: {(printer['gcode_macro _STATE'].total_layers|default(0)|int ~ ' L') if printer['gcode_macro _STATE'].total_layers|default(0)|int > 0 else 'select first'}
gcode:
    {% set tl = printer['gcode_macro _STATE'].total_layers|default(0)|int %}
    {% if tl > 0 %}
        RESPOND MSG="Range source: {printer.print_stats.filename|default('?')} - {tl} layers (From 2..{tl - 1}, To 3..{tl})"
        RESPOND MSG="R224: Floor/Top count INSIDE the window - the excerpt stays (To-From+1) layers tall, windows stack seamlessly"
    {% else %}
        RESPOND MSG="Range: select a file first - then its layer count caps From/To here"
    {% endif %}

[menu __main __preprint __mods __rng __stop]
type: input
name: Stop@: {'%3d' % menu.input}
input: {printer['gcode_macro _STATE'].stop_at_layer|default(0)}
input_min: 0
input_max: 999
input_step: 1
gcode:
    SET_STOP_AT_LAYER LAYER={menu.input|round|int}

[menu __main __preprint __mods __rng __from]
type: input
name: From: {'%3d' % menu.input}
input: {printer['save_variables'].variables.range_start|default(2)}
input_min: 2
input_max: {printer['gcode_macro _STATE'].total_layers|default(0)|int - 1 if printer['gcode_macro _STATE'].total_layers|default(0)|int > 3 else 999}
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_start VALUE={menu.input|round|int}

[menu __main __preprint __mods __rng __to]
type: input
name: To: {'%3d' % menu.input}
input: {printer['save_variables'].variables.range_end|default(10)}
input_min: 3
input_max: {printer['gcode_macro _STATE'].total_layers|default(0)|int if printer['gcode_macro _STATE'].total_layers|default(0)|int > 3 else 999}
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=range_end VALUE={menu.input|round|int}

# R224 (.136v): floor/top count INSIDE the layer window - the excerpt stays
# exactly (end-start+1) layers tall, windows stack seamlessly (5-150 5/7
# then 151-650 4/5 = one continuous column, no doubled layers, no gaps)
