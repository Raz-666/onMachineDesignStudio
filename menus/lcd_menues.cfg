[menu __main __gen __cpic __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: ColorPicture: upload a .png/.jpg into the gcodes folder (drag+drop in Mainsail) - same image list as the lithophane, plotter uploads included | Slot press = Create. The picture prints FLAT as stacked color bands: lightest color first, every darker band prints only its region on top - no backlight needed | At every color change: M600 parks the head, M117 shows the color, the NOZZLE LED BLINKS from the old to the new color - load the filament, the purge strip cleans, resume | Settings: Colors = band count, BandH = band thickness, Band colors = per-band palette code (light -> dark) | Mainsail: GEN_COLORPIC SRC=photo.png WIDTH=120 BANDS=4 COLORS=WHT,GRY,BLK BANDH=0.8 - or COLORPIC_CREATE INDEX=0"

# =====================================================================================
#  BRICKS (R121, in the Tools menu) - stud-and-tube building blocks with the
#  EXACT system geometry (pitch 8.0, brick 9.6, plate 3.2, stud O4.8x1.8
#  hollow, body n*8-0.2 = they CLAMP, wall 1.5, tube O6.31). One file = one
#  color, every part its own EXCLUDE_OBJECT. Generic naming only - bricks,
#  plates, tiles; smooth studs, no logos, no brand names.
#  Queue like the labels: Catalog pick (adds Count x code) -> Create bumps
#  bricks_nonce, the watcher builds the file (beeps + selects).
#  Needs [include klipper-e3-r2d2/macros/19_bricks.cfg].
# =====================================================================================
