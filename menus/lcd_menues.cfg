[menu __main __preprint __mods __tex __map]
type: command
name: Img: {printer['save_variables'].variables.texture_map|default('')|string|truncate(10, True, '')}
enable: {printer['save_variables'].variables.texture_pattern|default('')|string == 'MAP'}
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if sv.texture_map|default('')|string != '' %}
        RESPOND MSG="MAP wraps {sv.texture_map} around the object (mirrored seam = always seamless). Pick another image: click it in the SD browser (copies to the main folder), then press here"
        SAVE_VARIABLE VARIABLE=texture_map VALUE="\"\""
    {% else %}
        {% set _picked = sv.img_pick_file|default('')|string %}
        {% if _picked != '' %}
            SAVE_VARIABLE VARIABLE=texture_map VALUE="\"{_picked}\""
            RESPOND MSG="MAP image: {_picked} (the one you picked in the SD browser)"
        {% else %}
            RESPOND MSG="MAP needs an image - click one in the SD browser first (it copies to the main folder), then come back"
        {% endif %}
    {% endif %}

[menu __main __preprint __mods __tex __mmode]
