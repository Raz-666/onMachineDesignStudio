[menu __main __gen __labels __set]
type: list
name: Settings

[menu __main __gen __labels __set __mode]
type: input
name: Mode: {("GROW","FIXED")[menu.input|int] if menu.input|int in (0,1) else "?"}
input: {printer["save_variables"].variables.label_mode|default(0)}
input_min: 0
input_max: 1
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=label_mode VALUE={menu.input|round|int}
    LABEL_FIT_CALC
    RESPOND MSG="Label mode: GROW = the label grows until the text fits (Size rules, W/H are minimums - the needed size becomes the W/H lower limit)"
    RESPOND MSG="Label mode: FIXED = the label stays at W/H exactly - the font scales into it (Size = upper bound, 0 = as large as possible)"

