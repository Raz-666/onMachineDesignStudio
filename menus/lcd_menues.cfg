[menu __main __gen __angle __set __cs __off]
type: command
name: Normal hole{ '*' if not printer['save_variables'].variables.angle_countersink|default(True) else '' }
gcode:
    SAVE_VARIABLE VARIABLE=angle_countersink VALUE=False
    RESPOND MSG="Countersink OFF: straight hole for normal screw heads + nut"

# R86.2: walls (concentric loops per layer - wall thickness = walls x line
