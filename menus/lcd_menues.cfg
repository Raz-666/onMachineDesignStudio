[menu __main __preprint __defs __del]
type: command
name: Delete: see console
gcode:
    DEFAULT_PRESETS_INFO
    RESPOND MSG="Delete a preset: DELETE_DEFAULT_PRESET N=1..8 (console / Mainsail) - materials are never touched"

[menu __main __preprint __file]
type: list
name: File (G-code)

[menu __main __preprint __file __pv1]
type: command
name: '{printer['gcode_macro _PREVIEW'].name|default("no file selected")|truncate(16, True, "")}'
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    RESPOND MSG="File preview: {printer['gcode_macro _PREVIEW'].name}"

[menu __main __preprint __file __pv2]
type: command
name: Ly {printer['gcode_macro _PREVIEW'].layer_height|default('?')} Noz {printer['gcode_macro _PREVIEW'].nozzle|default('?')}
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    RESPOND MSG="Preview: layer {printer['gcode_macro _PREVIEW'].layer_height}mm, nozzle {printer['gcode_macro _PREVIEW'].nozzle}mm, line width {printer['gcode_macro _PREVIEW'].line_width}mm (first {printer['gcode_macro _PREVIEW'].line_width_first}mm)"

[menu __main __preprint __file __pv3]
type: command
name: {printer['gcode_macro _PREVIEW'].hotend|default(0)|float|round(0)}/{printer['gcode_macro _PREVIEW'].bed|default(0)|float|round(0)}C F{printer['gcode_macro _PREVIEW'].fan|default(0)|float|round(0)}%
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    RESPOND MSG="Preview: hotend {printer['gcode_macro _PREVIEW'].hotend|float|round(0)}C, bed {printer['gcode_macro _PREVIEW'].bed|float|round(0)}C, fan {printer['gcode_macro _PREVIEW'].fan|float|round(0)}%, PA {printer['gcode_macro _PREVIEW'].pa|float}, {printer['gcode_macro _PREVIEW'].total_layers|default('?')} layers"

[menu __main __preprint __file __pv4]
type: command
name: 'By {(printer['gcode_macro _PREVIEW'].slicer|default('?')).replace('_', ' ')|truncate(13, True, '')}'
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    {% set pv = printer['gcode_macro _PREVIEW'] %}
    RESPOND MSG="Preview: sliced by {pv.slicer|default('?')|replace('_', ' ')} for {pv.firmware|default('?')} firmware"
    {% if pv.volumetric|default(0) %}
        RESPOND MSG="[!] VOLUMETRIC Marlin file: Klipper counts E in mm, not mm3 - under-extrusion! Re-slice or convert"
    {% endif %}

[menu __main __preprint __file __fixr]
type: command
name: RetFix file
# R89 (field log .72): only offered when the file REALLY carries slicer
# retracts (G1 E-moves) - firmware-retraction files (G10/G11, e.g. Orca with
# FW retraction ON) and already-fixed files never show it again
enable: {printer['gcode_macro _PREVIEW'].name|default('') != '' and printer['gcode_macro _PREVIEW'].retract_style|default('') == 'slicer'}
gcode:
    FIX_FILE WHAT=RETRACT

[menu __main __preprint __file __fixv]
type: command
name: Vol->mm fix
enable: {printer['gcode_macro _PREVIEW'].volumetric|default(0)|int > 0 or printer['gcode_macro _STATE'].file_volumetric|default(False)}
gcode:
    FIX_FILE WHAT=VOL

[menu __main __preprint __file __pvt]
type: command
name: File -> Pre-Print
enable: {printer['gcode_macro _PREVIEW'].name|default('') != ''}
gcode:
    FILE_AS_PRESET

[menu __main __preprint __file __pl0]
type: command
name: PEN FILE {printer['gcode_macro _PREVIEW'].pens|default(1)}x
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
gcode:
    RESPOND MSG="Plotter file: {printer['gcode_macro _PREVIEW'].pens|default(1)} pen(s) - settings below apply at plot start (speed %, pen Z, X/Y shift)"

[menu __main __preprint __file __pls]
type: input
name: Speed: {'%3d' % menu.input}%
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
input: {printer['save_variables'].variables.plot_ov_speed|default(100)}
input_min: 10
input_max: 200
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=plot_ov_speed VALUE={menu.input|round|int}

[menu __main __preprint __file __plz]
type: input
name: Pen Z: {'%+.2f'|format(menu.input)}
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
input: {printer['save_variables'].variables.plot_ov_z|default(0)}
input_min: -1
input_max: 1
input_step: 0.05
gcode:
    SAVE_VARIABLE VARIABLE=plot_ov_z VALUE={menu.input|round(2)}

[menu __main __preprint __file __plx]
type: input
name: Shift X: {'%+.1f'|format(menu.input)}
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
input: {printer['save_variables'].variables.plot_ov_x|default(0)}
input_min: -10
input_max: 10
input_step: 0.5
gcode:
    SAVE_VARIABLE VARIABLE=plot_ov_x VALUE={menu.input|round(1)}

[menu __main __preprint __file __ply]
type: input
name: Shift Y: {'%+.1f'|format(menu.input)}
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
input: {printer['save_variables'].variables.plot_ov_y|default(0)}
input_min: -10
input_max: 10
input_step: 0.5
gcode:
    SAVE_VARIABLE VARIABLE=plot_ov_y VALUE={menu.input|round(1)}

[menu __main __preprint __file __plr]
type: command
name: Reset overrides
enable: {printer['gcode_macro _PREVIEW'].plot|default(0)|int == 1}
gcode:
    PLOT_TUNE_RESET

[menu __main __preprint __file __t]
type: command
name: File: {("MARKED" if printer['gcode_macro _STATE'].file_type|default("unknown") == "marked" else "LEGACY" if printer['gcode_macro _STATE'].file_type|default("unknown") == "legacy" else printer['gcode_macro _PREVIEW'].type|default("?")|upper if printer['gcode_macro _PREVIEW'].name|default('') != '' else "?")}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File type: {s.file_type|default('unknown')|upper} - MARKED = R2 markers, LEGACY = no PRINT_START"

[menu __main __preprint __file __m]
type: command
name: Mat: {printer['gcode_macro _STATE'].file_material|default('?')}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File material: {s.file_material} | your material: {printer['save_variables'].variables.material|default('PLA')} (Pre-Print > Material)"

[menu __main __preprint __file __ly]
type: command
name: Ly: {printer['gcode_macro _STATE'].file_layer_height|round(2)}x{printer['gcode_macro _STATE'].total_layers|default(0)|int if printer['gcode_macro _STATE'].total_layers|default(0) > 0 else '?'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File: layer height {s.file_layer_height} | {s.total_layers} layers (from the slicer) | by object: {'YES - sequential (object change = layer 1 again)' if s.file_by_object|default(False) else 'no - by layer'}"

[menu __main __preprint __file __lw]
type: command
name: W: {printer['gcode_macro _STATE'].file_line_width|default(0)|round(2) if printer['gcode_macro _STATE'].file_line_width|default(0) > 0 else '?'}mm
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File line width: {s.file_line_width}mm | first layer {s.file_line_width_first}mm | outer wall {s.file_line_width_wall}mm | flow ratio {s.file_flow_ratio} - from the slicer (post-processor)"

[menu __main __preprint __file __fr]
type: command
name: FlowR: {printer['gcode_macro _STATE'].file_flow_ratio|round(2) if printer['gcode_macro _STATE'].file_flow_ratio|default(0) > 0 else '?'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File flow ratio: {s.file_flow_ratio} (slicer extrusion multiplier) | your global flow overwrite: Pre-Print > Flow | LIVE flow: {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}%"

[menu __main __preprint __file __spd]
type: command
name: Spd: {(printer['gcode_macro _STATE'].file_feat_spd_wallouter|default(0)|round|int|string ~ 'mm/s') if printer['gcode_macro _STATE'].file_feat_spd_wallouter|default(0) > 0 else '?'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File speeds mm/s (MEASURED from the g-code, feature by feature): outer wall {s.file_feat_spd_wallouter|default(0)|round|int} | inner wall {s.file_feat_spd_wallinner|default(0)|round|int} | sparse {s.file_feat_spd_infillsparse|default(0)|round|int} | solid {s.file_feat_spd_infillsolid|default(0)|round|int} | top {s.file_feat_spd_surfacetop|default(0)|round|int} | bottom {s.file_feat_spd_surfacebottom|default(0)|round|int} | bridge {s.file_feat_spd_bridge|default(0)|round|int} | gaps {s.file_feat_spd_gaps|default(0)|round|int} | support {s.file_feat_spd_support|default(0)|round|int} | ironing {s.file_feat_spd_ironing|default(0)|round|int} | skirt {s.file_feat_spd_skirt|default(0)|round|int} | brim {s.file_feat_spd_brim|default(0)|round|int} | first layer {s.file_speed_first} | travel {s.file_speed_travel} (config) - per-feature overrides: Features menu"

[menu __main __preprint __file __acc]
type: command
name: Acc: {printer['gcode_macro _STATE'].file_feat_acc_wallouter|default(0)|round|int if printer['gcode_macro _STATE'].file_feat_acc_wallouter|default(0) > 0 else '?'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File accels mm/s2 (M204 measured per feature): outer {s.file_feat_acc_wallouter|default(0)|round|int} | inner {s.file_feat_acc_wallinner|default(0)|round|int} | sparse {s.file_feat_acc_infillsparse|default(0)|round|int} | solid {s.file_feat_acc_infillsolid|default(0)|round|int} | top {s.file_feat_acc_surfacetop|default(0)|round|int} | bottom {s.file_feat_acc_surfacebottom|default(0)|round|int} | bridge {s.file_feat_acc_bridge|default(0)|round|int} | gaps {s.file_feat_acc_gaps|default(0)|round|int} | support {s.file_feat_acc_support|default(0)|round|int} | ironing {s.file_feat_acc_ironing|default(0)|round|int} | skirt {s.file_feat_acc_skirt|default(0)|round|int} | brim {s.file_feat_acc_brim|default(0)|round|int} (0 = the file sends no M204 there) - global: Pre-Print > Motion"

# ---- R60: click = activate (OFF resets to the file original) ----
[menu __main __preprint __file __acwall]
type: command
enable: {printer['gcode_macro _STATE'].file_types|default('') == '' or 'WALL-OUTER' in printer['gcode_macro _STATE'].file_types}
name: OW:{(printer['gcode_macro _STATE'].file_feat_spd_wallouter|default(0)|round|int|string ~ 'mm/s') if printer['gcode_macro _STATE'].file_feat_spd_wallouter|default(0) > 0 else ('n/a' if printer['gcode_macro _STATE'].file_types|default('') != '' and 'WALL-OUTER' not in printer['gcode_macro _STATE'].file_types else '--')} {'o:ON' if printer['save_variables'].variables.ovf_wallouter_on|default(False) else 'o:--'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.file_types|default('') == '' or 'WALL-OUTER' in s.file_types %}
        SET_OVERRIDE_VALUE NAME=feat_on_wallouter VALUE={1 if not printer['save_variables'].variables.ovf_wallouter_on|default(False) else 0}
        RESPOND MSG="[Feature] WALLOUTER {'ON - edit the percent in Features' if not printer['save_variables'].variables.ovf_wallouter_on|default(False) else 'OFF - back to the file original'}"
    {% else %}
        RESPOND MSG="WALL-OUTER is not in this file - nothing to override"
    {% endif %}

