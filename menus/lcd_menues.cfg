# -------------------------------------------------------------------------------------
# version sentinel of this menu file - _CHECK_INSTALL verifies it (stale copies lack it)
# -------------------------------------------------------------------------------------
[gcode_macro _V16_MENUS]
description: Version sentinel of menus/lcd_menues.cfg (internal)
gcode:


# =====================================================================================
#  R135: hide the STOCK Klipper menus we fully replace. OctoPrint: Mainsail
#  runs the printer + Live > Pause & Control covers pause/resume/abort.
#  Temperature: Live > Temps & Fan + Pre-Print > Preheat/Material cover it.
#  Setup: System (restarts) + Maintenance (PID, calibration) cover it.
#
#  R145 (.106 field report: PRINTER HALTED): the override mechanism works
#  DIFFERENTLY than R135 assumed. Klipper's menu.py loads its own menu.cfg
#  as a SEPARATE config and then reads every menu section of the main
#  config on its own - load_menuitems() calls cfg.get('type') with NO
#  default. Options are NOT merged into the stock section; a same-name
#  section REPLACES the whole stock item (menu.py logs 'hides previous
#  menuitem declaration'). An enable-only section therefore has no type
#  = boot error 'Option type must be specified' = Printer is halted.
#  Every override must carry its OWN type + name - enable {False} then
#  hides the replaced entry. Untouched on purpose: SD Card (the LCD file
#  browser) + Control + Tune.
# =====================================================================================
[menu __main __octoprint]
type: list
name: OctoPrint
enable: {False}

[menu __main __temp]
type: list
name: Temperature
enable: {False}

[menu __main __setup]
type: list
name: Setup
enable: {False}


