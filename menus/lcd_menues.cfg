# print height of the picture (width follows the aspect ratio, auto-clamped
# to the bed)
[menu __main __gen __litho __set]
type: list
name: Settings

[menu __main __gen __litho __set __ori]
type: command
name: Orient: {printer['save_variables'].variables.litho_orient|default('STANDING') == 'FLAT' and 'FLAT ' or 'STAND'}
gcode:
    {% set _new106 = 'FLAT' if printer['save_variables'].variables.litho_orient|default('STANDING') != 'FLAT' else 'STANDING' %}
    SAVE_VARIABLE VARIABLE=litho_orient VALUE='"{_new106}"'
    RESPOND MSG="Litho orient: { 'FLAT - back on the bed, gray STEPS on top (clean full layers, frame-disc friendly)' if _new106 == 'FLAT' else 'STANDING - on edge, the classic recipe (most detail)' }"

[menu __main __gen __litho __set __hgt]
type: input
name: {'%s: %3dmm' % ('Size' if printer['save_variables'].variables.litho_orient|default('STANDING') == 'FLAT' else 'Height', menu.input)}
input: {printer['save_variables'].variables.litho_height|default(100)}
input_min: 30
input_max: {[printer.toolhead.axis_maximum.z|default(250), printer.toolhead.axis_maximum.y|default(220)]|min - 20}
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=litho_height VALUE={menu.input|round|int}
    RESPOND MSG="{ 'Picture size in the bed plane (XY): ' ~ menu.input|round|int ~ 'mm on the Y side - X follows the image aspect ratio, both clamp to the bed - the height in Z is the relief (layer count x layer height), never set here' if printer['save_variables'].variables.litho_orient|default('STANDING') == 'FLAT' else 'Picture height = the print height in Z (one image row per layer) - the width follows the image aspect' }"

[menu __main __gen __litho __set __col]
type: input
name: Colors: {'%d' % menu.input}
input: {printer['save_variables'].variables.litho_colors|default(1)}
input_min: 1
input_max: 4
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=litho_colors VALUE={menu.input|round|int}
    RESPOND MSG="Litho colors {menu.input|round|int} (FLAT only): bands from the bed up, PAUSE + filament swap at every boundary"

# R128: FLAT prints in grayscale STEPS - layers per step + optional color
# change (all steps white, darkest = black contours) + frame + contrast
[menu __main __gen __litho __set __cll]
type: input
name: StepL: {'%2d' % menu.input}
input: {printer['save_variables'].variables.litho_col_layers|default(3)}
input_min: 1
input_max: 30
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=litho_col_layers VALUE={menu.input|round|int}
    RESPOND MSG="Litho FLAT: {menu.input|round|int} layer(s) = {(menu.input * printer['save_variables'].variables.litho_layer_h|default(0.12)|float)|round(2)}mm per gray step (step 0 = the whole light background, the darkest = the contours + {(menu.input * printer['save_variables'].variables.litho_levels|default(0)|float)|round(1)}mm above it if levels is set) - more layers per step = a DEEPER, more visible relief (R152 default 3)"

[menu __main __gen __litho __set __ccm]
type: list
name: Color swap

[menu __main __gen __litho __set __ccm __cur]
type: command
name: Now: {printer['save_variables'].variables.litho_colmode|default('OFF')|string}
gcode:
    RESPOND MSG="Litho FLAT color change: {printer['save_variables'].variables.litho_colmode|default('OFF')|string} - OFF = one filament, LAST = M600 before the darkest step (white + black contours), EACH = M600 at every step. A purge tower prints along whenever swaps are on"

[menu __main __gen __litho __set __ccm __off]
type: command
name: OFF (one color)
