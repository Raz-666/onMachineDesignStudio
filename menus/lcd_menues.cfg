# =====================================================================================
#  lcd_menues.cfg - Complete menu for the Creality 12864 LCD (English!)
#  -----------------------------------------------------------------------------------
#  Klipper's STANDARD menus (SD Card, Tune, Control, Temperature ...) stay intact -
#  this adds our own tree (and renames the root entry):
#
#   Ender-3 R2D2
#   +-- Start Print?       (visible while the pre-print dialog is waiting)
#   |   +-- > Print as sliced
#   |   +-- > Print w/ changes
#   |   +-- > Cancel start
#   |   +-- File info     (THIS file's values - pushed by the watcher on selection)
#   +-- Pre-Print           (visible when NOT printing)
#   |   +-- Material   (PLA/PETG/ABS/ASA/TPU -> loads TEMP preset bed/hotend x layer1/2)
#   |   +-- Temps      (Bed 1st/after, Hotend 1st/after - toggle + value each)
#   |   +-- Motion     (PA, accel, retract)
#   |   +-- Outer Wall (speed + accel override)
#   |   +-- Support    (speed + accel override)
#   |   +-- Ironing    (on/off, flow, speed, temp)
#   |   +-- Flow       (global override)
#   |   +-- Range/Stop (From/To capped to the file; Floor/Top shape+fill; Stop@)
#   |   +-- Filament   (R74: Load/Unload/Change/M600 before the print; cold pull moved to Maintenance, R77)
#   |   +-- Bed Mesh   (re-mesh always? adaptive? calibrate now)
#   |   +-- Confirm? on/off | All overrides OFF
#   +-- Live Tuning        (visible WHILE printing or paused)
#   |   +-- Speeds     (outer/inner wall, infill, support %)
#   |   +-- Accel      (global, outer wall, support)
#   |   +-- Extrusion  (flow, pressure advance, retract)
#   |   +-- Ironing    (flow, speed, temp)
#   |   +-- Fan % | Hotend | Bed | Z +/-0.01
#   |   +-- Pause     (Pause NOW / next layer / at layer N / Resume / Filament / Cancel 2x)
#   |   +-- File       (the RUNNING file's values - _FILE_INFO from the file itself)
#   +-- Macros             (direct macro access from the display)
#   +-- Tools        (R87: the four part generators in ONE menu so the
#   |   +-- Cable ties    (R86, renamed R89: was 'Kabelbinder')
#   |   +-- Angles+Flat    (angles + flat connectors, R86; was 'Winkel+Flach')
#   |   +-- Labels         (multi-line text, font + size + spacing, char limit)
#   |   +-- Plotter        (pen plotting, R74)
#   +-- Maintenance        (only when idle: PID, mesh, screws, offsets, calibration)
#   +-- System             (FW restart, host restart, shutdown, save config, info)
#   +-- ... (Klipper standard menus below)
#
#  USAGE on the 12864: turn = select, click = confirm. On value entries (type input)
#  click starts editing (asterisk *), turn changes, click applies.
#  Every entry shows its CURRENT value in the label.
#
#  VISIBILITY RULES (robust on purpose):
#   - 'Start Print?'  only while mode == waiting   (the start dialog)
#   - 'Pre-Print'     whenever no print is running (also during the dialog!)
#   - 'Live Tuning'   while printing/paused - works for OLD files too, because
#     the _STATE_WATCHER flips the mode as soon as Klipper reports a print.
# =====================================================================================

# ---- root menu title -------------------------------------------------------------------
[menu __main]
type: list
name: Ender-3 R2D2

# =====================================================================================
#  START PRINT?  (appears as soon as the pre-print dialog waits for your decision)
# =====================================================================================
[menu __main __start]
type: list
enable: {printer['gcode_macro _STATE'].mode == 'waiting'}
# R73: material + temps right in the title - the G-code values are the FIRST
# thing you want to see before the decision (values appear ~1-2s after the
# dialog: the file reports them via _FILE_INFO while it waits)
name: '> Start? {("MARKED" if printer['gcode_macro _STATE'].file_type|default("unknown") == "marked" else "LEGACY" if printer['gcode_macro _STATE'].file_type|default("unknown") == "legacy" else "?")} {printer['gcode_macro _STATE'].file_material|default("?")} {printer['gcode_macro _STATE'].file_hotend_first|default(0)|round(0)|int}/{printer['gcode_macro _STATE'].file_bed|default(0)|round(0)|int}C'

[menu __main __start __direct]
type: command
name: '> PRINT AS SLICED'
gcode:
    PRINT_AS_SLICED

# R54: 'PRINT W/ CHANGES' merged into 'AS LEGACY' (PRINT_WITH_OVERRIDES stays as console alias)
[menu __main __start __asleg]
type: command
name: '> AS LEGACY'
gcode:
    PRINT_AS_LEGACY

[menu __main __start __cancel]
type: command
name: '> CANCEL START'
gcode:
    CANCEL_PENDING_PRINT

[menu __main __start __info]
type: list
name: File info

# R73: the old 'File info' item only sent M117 + console lines - on the LCD
# 'nothing happened'. These lines SHOW the G-code parameters of the loaded
# file (the file reports them via _FILE_INFO right at its start).

[menu __main __start __info __type]
type: command
name: '{(printer["gcode_macro _STATE"].file_type|default("?")|upper if printer["gcode_macro _STATE"].file_type|default("?") != "unknown" else printer["gcode_macro _PREVIEW"].type|default("?")|upper)} | Ly {printer["gcode_macro _STATE"].file_layer_height|default(0)|round(2)}x{printer["gcode_macro _STATE"].total_layers|default(0)|int if printer["gcode_macro _STATE"].total_layers|default(0) > 0 else "?"}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File type: {s.file_type|default('unknown')|upper} - MARKED = R2 markers (all 3 modes), LEGACY = no PRINT_START (AS SLICED = 1:1, AS LEGACY = takeover + your overrides)"

[menu __main __start __info __mat]
type: command
name: 'Mat {printer["gcode_macro _STATE"].file_material|default("?")} | Noz {printer["gcode_macro _STATE"].file_nozzle|default(0)|round(1) if printer["gcode_macro _STATE"].file_nozzle|default(0) > 0 else "?"} W{printer["gcode_macro _STATE"].file_wall_loops|default(0)|int}'
gcode:
    RESPOND MSG="File: material {printer['gcode_macro _STATE'].file_material} | nozzle {printer['gcode_macro _STATE'].file_nozzle}mm | wall loops {printer['gcode_macro _STATE'].file_wall_loops} | your material: {printer['save_variables'].variables.material|default('PLA')}"

[menu __main __start __info __slicer]
type: command
name: 'By {(printer['gcode_macro _STATE'].file_slicer|default('?')).replace('_', ' ')|truncate(13, True, '')}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File: sliced by {s.file_slicer|default('?')|replace('_', ' ')} for {s.file_firmware|default('?')} firmware (foreign slicers print AS LEGACY)"
    {% if s.file_volumetric|default(False) %}
        RESPOND MSG="[!] VOLUMETRIC Marlin file: Klipper counts E in mm, not mm3 - under-extrusion! Re-slice or convert"
    {% endif %}

[menu __main __start __info __temps]
type: command
name: '{printer["gcode_macro _STATE"].file_hotend_first|default(0)|round(0)|int}/{printer["gcode_macro _STATE"].file_hotend_after|default(0)|round(0)|int}C  Bed {printer["gcode_macro _STATE"].file_bed|default(0)|round(0)|int}/{printer["gcode_macro _STATE"].file_bed_after|default(0)|round(0)|int}C'
gcode:
    RESPOND MSG="File temps: hotend {printer['gcode_macro _STATE'].file_hotend_first}/{printer['gcode_macro _STATE'].file_hotend_after}C | bed {printer['gcode_macro _STATE'].file_bed}/{printer['gcode_macro _STATE'].file_bed_after}C - YOUR overrides: Pre-Print > Temps"

[menu __main __start __info __speeds]
type: command
name: 'Spd {printer["gcode_macro _STATE"].file_feat_spd_wallouter|default(0)|round(0)|int if printer["gcode_macro _STATE"].file_feat_spd_wallouter|default(0) > 0 else "?"}mm/s PA {printer["gcode_macro _STATE"].file_pa|default(0)|round(3)}'
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    RESPOND MSG="File: outer wall {s.file_feat_spd_wallouter|default(0)|round(0)}mm/s | first layer {s.file_speed_first|default(0)|round(0)}mm/s | ironing {s.file_ironing_speed|default(0)|round(0)}mm/s | PA {s.file_pa} | retract {s.file_retract_len}@{s.file_retract_speed}"

[menu __main __start __info __width]
type: command
name: 'Width {printer["gcode_macro _STATE"].file_line_width|default(0)|round(2) if printer["gcode_macro _STATE"].file_line_width|default(0) > 0 else "?"}mm Flow {printer["gcode_macro _STATE"].file_flow_ratio|default(0)|round(2) if printer["gcode_macro _STATE"].file_flow_ratio|default(0) > 0 else "?"}'
gcode:
    RESPOND MSG="File: line width {printer['gcode_macro _STATE'].file_line_width}mm (first {printer['gcode_macro _STATE'].file_line_width_first}, wall {printer['gcode_macro _STATE'].file_line_width_wall}) | flow ratio {printer['gcode_macro _STATE'].file_flow_ratio} | by object {printer['gcode_macro _STATE'].file_by_object}"

# =====================================================================================
#  LIVE TUNING - everything changeable DURING the print
# =====================================================================================
[menu __main __live]
type: list
enable: {printer['gcode_macro _STATE'].mode in ['printing','paused','filament']}
name: Live Tuning

# ---- Babystepping right at the TOP (was buried one submenu deeper) - the "magic 4"
[menu __main __live __zup]
type: command
name: Z +0.04
gcode:
    BABYSTEP_UP

[menu __main __live __zupf]
type: command
name: Z +0.12
gcode:
    BABYSTEP_UP_FINE

[menu __main __live __zdown]
type: command
name: Z -0.04
gcode:
    BABYSTEP_DOWN

[menu __main __live __zdownf]
type: command
name: Z -0.12
gcode:
    BABYSTEP_DOWN_FINE

# ---------------- R64 plotter live (pen jobs only) --------------------------------------------------------------
[menu __main __live __zoff]
type: command
name: Zoff {printer.gcode_move.homing_origin.z|default(0)|float|round(2)}
gcode:
    M117 Z-Offset {printer.gcode_move.homing_origin.z|default(0)|float|round(2)}

[menu __main __live __speeds]
type: list
name: Speed (global)

[menu __main __live __speeds __gs]
type: input
name: Glob: {'%3d' % menu.input} %
input: {printer['gcode_macro _STATE'].g_speed_clean|default(100)}
input_min: 10
input_max: 300
input_step: 5
gcode:
    SET_GLOBAL_SPEED PERCENT={menu.input|round|int}

# ---- per feature (R58): % ON TOP of the global factor - never touches it ----
[menu __main __live __speeds __src]
type: command
name: Src
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set fcodes = ['wallouter','wallinner','infillsparse','infillsolid','surfacetop','surfacebottom','bridge','gaps','support','ironing','skirt','brim'] %}
    {% set clean = s.g_speed_clean|default(100)|float %}
    RESPOND MSG="Speed sources - file: {s.file_speed_outer|default(0)|int}mm/s outer | your overwrites: GLOBAL {clean|round|int}% (the one regulator){% for c in fcodes %}{% if sv['ovf_' ~ c ~ '_on']|default(False) %} - {c|upper} {sv['ovf_' ~ c ~ '_spd']|default(100)|round|int}% = {(clean * sv['ovf_' ~ c ~ '_spd']|default(100)|float / 100)|round|int}% eff{% endif %}{% endfor %} | LIVE: global {clean|round|int}%, current feature: {s.current_type} (no override = 1:1 with global)"

[menu __main __live __speeds __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - 'FeatSpd/FeatOn' below edit THIS feature, Live > Features edits any feature"
    {% else %}
        RESPOND MSG="[Now] no feature marked (raft/unknown section or before the print) - use Live > Features to pick a feature yourself"
    {% endif %}

[menu __main __live __speeds __cur]
type: input
name: FeatSpd: {'%3d' % menu.input} %
input: {printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_spd']|default(100)}
input_min: 20
input_max: 200
input_step: 5
gcode:
    {% set c = printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower %}
    {% if c != '' %}
        SET_OVERRIDE_VALUE NAME=feat_spd_{c} VALUE={menu.input|round|int}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% else %}
        RESPOND MSG="No feature printing right now (raft or unmarked section) - use Live > Features to pick one"
    {% endif %}

[menu __main __live __speeds __curon]
type: command
name: FeatOn: {printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_on']|default(False)|string|upper}
gcode:
    {% set c = printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower %}
    {% if c != '' %}
        SET_OVERRIDE_VALUE NAME=feat_on_{c} VALUE={1 if not printer['save_variables'].variables['ovf_' ~ c ~ '_on']|default(False) else 0}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% else %}
        RESPOND MSG="No feature printing right now"
    {% endif %}

[menu __main __live __accels]
type: list
name: Accel (global)

[menu __main __live __accels __ga]
type: input
name: Acc: {'%5d' % menu.input}
input: {printer.toolhead.max_accel|default(8000)|int}
input_min: 100
input_max: 20000
input_step: 100
gcode:
    SET_GLOBAL_ACCEL ACCEL={menu.input|round|int}

# R92.1: ONE percent regulator for ALL feature accel limits (they keep their
# ratio to each other); the global (no-feature) accel above stays absolute
[menu __main __live __accels __pct]
type: input
name: Feat x: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ovf_accel_pct|default(100)}
input_min: 10
input_max: 300
input_step: 10
gcode:
    SET_GLOBAL_ACCEL_PERCENT PERCENT={menu.input|round|int}

# current feature: limit x percent = what runs right now
[menu __main __live __accels __eff]
type: command
name: {'%4d' % ((printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_acc']|default(0)|float * printer['save_variables'].variables.ovf_accel_pct|default(100)|float / 100)|round|int) ~ 'mm/s2'}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set pct = sv.ovf_accel_pct|default(100)|float %}
    {% set c = s.current_type|default('')|replace('-','')|lower %}
    {% if c != '' and sv['ovf_' ~ c ~ '_on']|default(False) and sv['ovf_' ~ c ~ '_acc']|default(0)|float > 0 %}
        RESPOND MSG="[Now] {s.current_type}: {sv['ovf_' ~ c ~ '_acc']|float|round|int} mm/s2 x {pct|round|int}% = {(sv['ovf_' ~ c ~ '_acc']|float * pct / 100)|round|int} mm/s2 (feature limit)"
    {% elif c != '' %}
        RESPOND MSG="[Now] {s.current_type}: no own accel - the global {s.a_global|default(0)|round|int} mm/s2 rules"
    {% else %}
        RESPOND MSG="[Now] no feature printing - the global accel rules (travel + features without their own)"
    {% endif %}
    RESPOND MSG="Accel model: feature values = hard limits, 'Feat x' scales ALL of them in the same ratio, 'Acc' = the global for everything else"

# ---- per feature (R58): only this feature's acceleration ----
[menu __main __live __accels __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - 'FeatAcc' edits THIS feature's accel (0 = global)"
    {% else %}
        RESPOND MSG="[Now] no feature marked (raft or unmarked section) - use Live > Features"
    {% endif %}

[menu __main __live __accels __cur]
type: input
name: FeatAcc: {'%5d' % menu.input}
input: {printer['save_variables'].variables['ovf_' ~ printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower ~ '_acc']|default(0)}
input_min: 0
input_max: 20000
input_step: 100
gcode:
    {% set c = printer['gcode_macro _STATE'].current_type|default('')|replace('-','')|lower %}
    {% if c != '' %}
        SET_OVERRIDE_VALUE NAME=feat_acc_{c} VALUE={menu.input|round|int}
        APPLY_TYPE TYPE={printer['gcode_macro _STATE'].current_type}
    {% else %}
        RESPOND MSG="No feature printing right now - set it in Pre-Print > Features"
    {% endif %}

[menu __main __live __vel]
type: list
name: Velocity

[menu __main __live __vel __mv]
type: input
name: Vel: {'%4d' % menu.input}
input: {printer.toolhead.max_velocity|default(300)}
input_min: 50
input_max: 500
input_step: 10
gcode:
    SET_LIVE_VELOCITY VELOCITY={menu.input|round|int}

[menu __main __live __vel __mcr]
type: input
name: MCR: {'%4.2f' % menu.input}
input: {printer.toolhead.minimum_cruise_ratio|default(0.5)}
input_min: 0.05
input_max: 1
input_step: 0.05
gcode:
    SET_LIVE_MINIMUM_CRUISE_RATIO VALUE={menu.input|float}

[menu __main __live __vel __scv]
type: input
name: Corner: {'%4.1f' % menu.input}
input: {printer.toolhead.square_corner_velocity|default(5)}
input_min: 1
input_max: 15
input_step: 0.5
gcode:
    SET_LIVE_SQUARE_CORNER VALUE={menu.input|float}

# ---------------- Extrusion -------------------------------------------------------------------------------
# ---- R60: 12 features, only the ones the file really contains are editable ----
[menu __main __live __extr]
type: list
name: Extrusion

[menu __main __live __extr __flow]
type: input
name: Flow: {'%3d' % menu.input} %
input: {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}
input_min: 1
input_max: 300
input_step: 1
realtime: True
gcode:
    SET_FLOW_RATE PERCENT={menu.input|round|int}

# R92.1: the flow model on one screen - global = the ONE regulator, feature
# flows are % OF it (never absolute, never touching it)
[menu __main __live __extr __fsrc]
type: command
name: Src
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    {% set gflw = s.live_flow|default(0)|float if s.live_flow|default(0)|float > 0 else (sv.ov_flow|default(100)|float if sv.ov_flow_on|default(False) else 100.0) %}
    {% set c = s.current_type|default('')|replace('-','')|lower %}
    {% set fflw = sv['ovf_' ~ c ~ '_flw']|default(100)|float if c != '' else 100.0 %}
    RESPOND MSG="Flow sources - GLOBAL {gflw|round|int}% (the one regulator){% if s.live_flow|default(0)|float > 0 %} (your LIVE value){% endif %}"
    {% if c != '' and sv['ovf_' ~ c ~ '_on']|default(False) and (fflw != 100 or gflw != 100) %}
        RESPOND MSG="  current feature {s.current_type}: {fflw|round|int}% x global {gflw|round|int}% = {(gflw * fflw / 100)|round|int}% effective"
    {% else %}
        RESPOND MSG="  current feature: 1:1 with the global (no feature flow override)"
    {% endif %}

[menu __main __live __extr __pa]
type: input
name: PA: {'%.3f' % menu.input}
input: {printer.extruder.pressure_advance|default(0)}
input_min: 0
input_max: 0.2
input_step: 0.005
gcode:
    SET_LIVE_PRESSURE_ADVANCE VALUE={menu.input|round(4)}

[menu __main __live __extr __ret]
type: input
name: RetLen: {'%.2f' % menu.input}
input: {printer['firmware_retraction'].retract_length|default(0.75) if 'firmware_retraction' in printer else printer['gcode_macro _STATE'].ret_len|default(0.75)}
input_min: 0
input_max: 3
input_step: 0.05
gcode:
    SET_LIVE_RETRACTION LENGTH={menu.input|round(3)}

[menu __main __live __extr __retspd]
type: input
name: RetSpd: {'%2d' % menu.input}
input: {printer['firmware_retraction'].retract_speed|default(35) if 'firmware_retraction' in printer else printer['gcode_macro _STATE'].ret_spd|default(35)}
input_min: 5
input_max: 80
input_step: 5
gcode:
    SET_LIVE_RETRACTION SPEED={menu.input|round|int}

[menu __main __live __extr __unret]
type: input
name: Unret: {'%2d' % menu.input}
input: {printer['firmware_retraction'].unretract_speed|default(35) if 'firmware_retraction' in printer else printer['gcode_macro _STATE'].ret_unret|default(35)}
input_min: 5
input_max: 80
input_step: 5
gcode:
    SET_LIVE_RETRACTION UNRETRACT_SPEED={menu.input|round|int}

[menu __main __live __extr __unretx]
type: input
name: UnretExt: {'%.2f' % menu.input}
input: {printer['firmware_retraction'].unretract_extra_length|default(0) if 'firmware_retraction' in printer else printer['gcode_macro _STATE'].ret_unretx|default(0)}
input_min: 0
input_max: 1.5
input_step: 0.01
gcode:
    SET_LIVE_RETRACTION EXTRA={menu.input|round(3)}

# ---------------- Ironing live -------------------------------------------------------------------------------
[menu __main __live __extr __src]
type: command
name: Src
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% set sv = printer['save_variables'].variables %}
    RESPOND MSG="Extrusion sources - file: PA {s.file_pa} | flow ratio {s.file_flow_ratio} | your overwrites: PA {sv.ov_pa|default(0)|round(3)} {'ON' if sv.ov_pa_on|default(False) else 'off'}, smooth {sv.ov_pa_smooth|default(0.04)} {'ON' if sv.ov_pa_smooth_on|default(False) else 'off'}, flow {sv.ov_flow|default(100)|round|int}% {'ON' if sv.ov_flow_on|default(False) else 'off'} | LIVE: PA {printer.extruder.pressure_advance|default(0)|float|round(4)}, flow {(printer.gcode_move.extrude_factor|default(1)*100)|round|int}%"

[menu __main __live __extr __irfl]
type: input
name: IronFl: {'%3d' % menu.input} %
input: {printer['save_variables'].variables.ov_ironing_flow|default(100)}
input_min: 10
input_max: 150
input_step: 5
gcode:
    SET_OVERRIDE_VALUE NAME=ironing_flow VALUE={menu.input|round|int}
    {% if printer['gcode_macro _STATE'].current_type == 'IRONING' %}APPLY_TYPE TYPE=IRONING{% endif %}

[menu __main __live __extr __pasm]
type: input
name: PA smooth: {'%.2f'|format(menu.input)}
input: {printer.extruder.smooth_time|default(printer['gcode_macro _STATE'].pa_smooth|default(0.04))}
input_min: 0.01
input_max: 0.1
input_step: 0.01
gcode:
    SET_LIVE_PA_SMOOTH TIME={menu.input|round(2)}



[menu __main __live __feat]
type: list
name: Features

[menu __main __live __feat __now]
type: command
name: Now: {(printer['gcode_macro _STATE'].current_type|default('-'))[:11]}
gcode:
    {% set s = printer['gcode_macro _STATE'] %}
    {% if s.current_type|default('') != '' %}
        RESPOND MSG="[Now] printing feature: {s.current_type} - edits below apply from the next segment of that feature"
    {% else %}
        RESPOND MSG="[Now] no feature marked yet (raft/unknown) - every feature is still editable, it applies when the file reaches it"
    {% endif %}

[menu __main __live __feat __ow]
type: list
name: Outer Wall

[menu __main __live __feat __ow __on]
type: command
enable: {printer['gcode_macro _STATE'].file_types|default('') == '' or 'WALL-OUTER' in printer['gcode_macro _STATE'].file_types}
