input: {printer['save_variables'].variables.retract_rewrite|default(0)|int}
input_min: 0
input_max: 1
input_step: 1
gcode:
    RETRACT_FIX STATE={1 if menu.input > 0.5 else 0}

[menu __main __preprint __pre]
type: list
name: Preheat

[menu __main __preprint __pre __on]
type: input
name: {'Preheat ON' if menu.input > 0.5 else 'Preheat OFF'}
input: {printer['save_variables'].variables.preheat_on|default(1)}
input_min: 0
input_max: 1
input_step: 1
gcode:
    SAVE_VARIABLE VARIABLE=preheat_on VALUE={menu.input|round|int}
    RESPOND MSG="Preheat on file select: {'ON - nozzle/bed heat to the standby levels the moment you pick a file' if menu.input|round|int == 1 else 'OFF'}"

[menu __main __preprint __pre __hot]
