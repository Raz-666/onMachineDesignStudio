[menu __main __maint __level]
type: list
name: Leveling

# R216 (.136n): the Mainsail bed-screw flow on the LCD - Start measures all
# screws, then the list walks you through them: current screw + direction +
# clock (01:20 = 1 turn + 20 minutes), Next screw, New round (re-measure),
# Finish takes over when everything is nominal. The display state lives in
# the _BED_SCREWS_UI macro variables (RAM - button presses write NOTHING to
# the SD card); bs_state in save_variables is the persisted mirror (one
# small write per measured round).
