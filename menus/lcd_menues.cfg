[menu __main __gen __angle __mode __flt]
type: command
name: Flat splice{ '*' if printer['save_variables'].variables.angle_flat|default(False) else '' }
gcode:
    SAVE_VARIABLE VARIABLE=angle_flat VALUE=True
    RESPOND MSG="Flat mode: straight strip joining two boards - both halves share the SAME hole pattern"

[menu __main __gen __angle __set]
type: list
name: Settings

# only in ANGLE mode - a flat strip has no bend
[menu __main __gen __angle __set __deg]
