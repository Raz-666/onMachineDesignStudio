    RESPOND MSG="Frame (holds the thin plate straight): {'ON' if not printer['save_variables'].variables.litho_frame|default(True) else 'off'}"

[menu __main __gen __litho __set __brm]
type: input
name: Brim: {'%2d' % menu.input}x
input: {printer['save_variables'].variables.litho_brim|default(6)}
