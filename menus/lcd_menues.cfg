name: Fan L2: {('ON ' if printer['save_variables'].variables.ov_fan_on|default(False) else 'off')}
gcode: TOGGLE_OVERRIDE NAME=fan

[menu __main __preprint __temps __fanval]
type: input
name: Fan L2: {'%3d' % menu.input}%
input: {printer['save_variables'].variables.ov_fan|default(100)}
input_min: 0
input_max: 100
input_step: 1
gcode:
    SET_OVERRIDE_VALUE NAME=fan VALUE={menu.input|round|int}

[menu __main __preprint __fil]
type: list
name: Filament

[menu __main __preprint __fil __load]
type: command
name: Load
gcode:
    LOAD_FILAMENT

[menu __main __preprint __fil __loadlen]
type: input
name: Load: {'%3d' % menu.input}mm
input: {printer['save_variables'].variables.load_length|default(60)}
input_min: 20
input_max: 150
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=load_length VALUE={menu.input|round|int}

[menu __main __preprint __fil __unload]
type: command
name: Unload
gcode:
    UNLOAD_FILAMENT

[menu __main __preprint __fil __len]
type: input
name: Unload: {'%3d' % menu.input}mm
input: {printer['save_variables'].variables.unload_length|default(90)}
input_min: 40
input_max: 150
input_step: 5
gcode:
    SAVE_VARIABLE VARIABLE=unload_length VALUE={menu.input|round|int}

[menu __main __preprint __fil __chg]
type: command
name: Change (M600)
gcode:
    CHANGE_FILAMENT

[menu __main __preprint __motion]
