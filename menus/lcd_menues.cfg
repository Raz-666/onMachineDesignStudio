    SAVE_VARIABLE VARIABLE=range_top_fill VALUE={menu.input|round|int}

# R86.2: centered floor hole (cable feed / E14-E27 lampholder); 0 = OFF.
# A thick boss ring (3-6 wall loops) forms the hole wall, the hatch stops at
# its outer edge - the diameter auto-clamps to the raft size (note in console)
[menu __main __preprint __rng __fho]
