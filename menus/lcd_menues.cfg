name: {'Leg B: %3d' % menu.input|round(0)|int ~ 'mm' if not printer['save_variables'].variables.angle_flat|default(False) else 'Right: %3d' % menu.input|round(0)|int ~ 'mm'}
input: {printer['save_variables'].variables.angle_leg_b|default(60)}
input_min: 20
input_max: 150
input_step: 5
gcode:
