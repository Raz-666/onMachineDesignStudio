    LABEL_FIT_CALC

# R82: five fonts - SMOOTH (handwriting-like default), MONO (technical, even
# strokes), and three new SMALL-TEXT fonts: COND = Oswald (condensed, tall
# x-height - more characters per mm), NARROW = Roboto Condensed (clean,
# narrow), CAPS = Bebas Neue (everything prints as capitals - key fobs).
# A saved PIXEL selection maps to SMOOTH. The '*' marks the active font.
[menu __main __gen __labels __set __fnt]
type: list
name: Font

[menu __main __gen __labels __set __fnt __sm]
type: command
name: SMOOTH{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'SMOOTH' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"SMOOTH\""
    RESPOND MSG="Font SMOOTH: handwriting-like, the all-rounder"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __mo]
type: command
name: MONO{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'MONO' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"MONO\""
    RESPOND MSG="Font MONO: technical, even letter widths"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __co]
type: command
name: COND{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'COND' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"COND\""
    RESPOND MSG="Font COND (Oswald): condensed + tall - best for small labels"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __na]
type: command
name: NARROW{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'NARROW' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"NARROW\""
    RESPOND MSG="Font NARROW (Roboto Cond.): clean + narrow - small text"
    LABEL_FIT_CALC

[menu __main __gen __labels __set __fnt __ca]
type: command
name: CAPS{ '*' if printer['save_variables'].variables.label_font|default('SMOOTH') == 'CAPS' else '' }
gcode:
    SAVE_VARIABLE VARIABLE=label_font VALUE="\"CAPS\""
    RESPOND MSG="Font CAPS (Bebas): prints everything as capitals - name plates"
    LABEL_FIT_CALC

