[menu __main __gen __plot __st __h3]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: These apply at every PLOT START (speed %, pen Z, X/Y shift) - the live versions are in Live Tuning > Plotter while a plot runs"

[menu __main __gen __plot __inv]
type: command
name: Invert: {('AUTO' if printer['save_variables'].variables.plot_invert|default(-1)|int == -1 else 'ON' if printer['save_variables'].variables.plot_invert|default(-1)|int == 1 else 'OFF')}
gcode:
    {% set cur = printer['save_variables'].variables.plot_invert|default(-1)|int %}
    {% set nxt = 1 if cur == -1 else 0 if cur == 1 else -1 %}
    SAVE_VARIABLE VARIABLE=plot_invert VALUE={nxt}
    RESPOND MSG="Image invert: {'AUTO (dark board -> ink = bright pixels)' if nxt == -1 else 'ALWAYS invert' if nxt == 1 else 'NEVER invert'} (applies at conversion time)"

# =====================================================================================
#  STRING ART (R178, R171's engine goes live) - anchor ring + strands on top.
#  SPIRAL needs nothing, PHOTO weaves a root image (the lithophane list).
# =====================================================================================
[menu __main __gen __stringart]
type: list
name: ArtisticStrings
enable: {'gcode_macro _GENERATORS' in printer}

[menu __main __gen __stringart __pat]
type: input
name: {'Pattern: PHOTO' if menu.input|round|int == 1 else 'Pattern: SPIRAL'}
input_step: 1
input_min: 0
input_max: 1
input: {printer['save_variables'].variables.stringart_pattern|default(0)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_pattern VALUE={menu.input|round|int}
    RESPOND MSG="ArtisticStrings pattern: {'PHOTO - a root image becomes the weave (dark = dense)' if menu.input|round|int == 1 else 'SPIRAL - the classic winding, no image needed'}"

[menu __main __gen __stringart __dia]
type: input
name: Ring: {menu.input|round|int}mm
input_step: 10
input_min: 60
input_max: 400
input: {printer['save_variables'].variables.stringart_diameter|default(180)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_diameter VALUE={menu.input|round|int}
    RESPOND MSG="ArtisticStrings ring diameter {menu.input|round|int}mm (clamped to the bed if bigger)"

[menu __main __gen __stringart __shp]
type: input
name: {'Shape: RECT ' ~ (printer['save_variables'].variables.stringart_w|default(102)|round(0)|string ~ 'x' ~ printer['save_variables'].variables.stringart_h|default(152)|round(0)|string ~ 'mm') if menu.input|round|int == 1 else 'Shape: ROUND'}
input_step: 1
input_min: 0
input_max: 1
input: {printer['save_variables'].variables.stringart_shape|default(0)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_shape VALUE={menu.input|round|int}
    RESPOND MSG="ArtisticStrings shape: {'RECT frame ring (photo presets below - fits the Frames system)' if menu.input|round|int == 1 else 'ROUND ring (the classic circle)'}"

[menu __main __gen __stringart __pre]
type: list
name: {'Preset: ' ~ printer['save_variables'].variables.stringart_preset|default('')|string if printer['save_variables'].variables.stringart_preset|default('')|string != '' else 'Preset: --'}

