[menu __main __gen __labels __job __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Labels: type up to 3 lines (Text > Line 1..3), add the label (Job > Add), repeat - Create builds the file | Mode GROW: the label grows until the text fits (Size rules, W/H are minimums + Calc fit sets the lower limits) - Mode FIXED: label stays W/H, the font scales | Fit (Job) = last result / re-calc. Calc fit (Settings) = dry run with the real numbers, no file written | Print: bases in color 1, M600 pause (swap filament), text on top in color 2 + purge tower | Hole sits 2mm from the edge, the text centers between the three free sides - they never collide | Mainsail: GEN_LABELS TEXT=\"TOP~BOTTOM|A B\" W=60 H=30 SIZE=8 SPACING=1 HOLE=LEFT MODE=GROW"


