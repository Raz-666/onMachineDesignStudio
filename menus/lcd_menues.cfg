gcode:
    SAVE_VARIABLE VARIABLE=litho_stands VALUE={0 if printer['save_variables'].variables.litho_stands|default(1)|int else 1}
    RESPOND MSG="Side stands (upright print): {'ON - 2 perforated fins left+right at the frame back, break-off seam 1.2mm' if not printer['save_variables'].variables.litho_stands|default(1)|int else 'off - the plate prints bare (thin plate, brim holds it)'}"

