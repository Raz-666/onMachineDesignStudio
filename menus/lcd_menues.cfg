[menu __main __preprint __feat __cu]
type: list
name: Custom Code

# R213 (.136l): NUMBERED CUSTOM SLOTS C1..C9 - the field rethink of the
# custom-feature fallback. Unknown ;TYPE: blocks are never forced to
# WALL-OUTER anymore (a bridge mis-read as a wall would print too fast);
# each DISTINCT unknown block gets its own number and its own overrides.
# Blocks that repeat across layers share their number; blocks without
# extrusion get NO slot (nothing to tune). A slot only appears while the
# selected file carries that group (CUSTOMGROUPS in _FILE_INFO).
[menu __main __preprint __feat __cu __how]
type: command
name: How C1..C9 works
gcode:
    RESPOND MSG="Custom slots: unknown TYPE-comment blocks stay CUSTOM but get numbered (C1, C2, ...) - each distinct block separately tunable, repeats across layers share a number, empty blocks get no slot. If a real feature hides in one (an unrecognized wall), tune THAT slot instead of the file global"

