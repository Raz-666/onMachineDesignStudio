    FILE_CHECK RETAG=1 CONFIRM=1

[menu __main __system __fc3]
type: command
name: How it works
gcode:
    RESPOND MSG="File check lists every g-code with its tag version: current (all markers), old (upgradeable), untouched (never processed), plotter (fine as is). RETAG upgrades old+untouched files - backup .r2bak first, never while printing, max 20 per run"

[menu __main __system __fend1]
type: command
name: Force end? arm
gcode: FORCE_END_PRINT

[menu __main __system __fend2]
type: command
name: >> FORCE END NOW
enable: {printer.print_stats.state in ['printing','paused'] or printer['gcode_macro _STATE'].mode not in ['idle','finished']}
gcode: FORCE_END_PRINT CONFIRM=1

[menu __main __system __fw1]
type: command
name: FW restart? arm
gcode: SYS_FIRMWARE_RESTART

[menu __main __system __fw2]
type: command
name: >> FW RESTART NOW
gcode: SYS_FIRMWARE_RESTART CONFIRM=1

[menu __main __system __ho1]
type: command
name: Host restart? arm
gcode: SYS_HOST_RESTART

[menu __main __system __ho2]
type: command
name: >> HOST RESTART NOW
gcode: SYS_HOST_RESTART CONFIRM=1

[menu __main __system __sd1]
type: command
name: Pi shutdown? arm
gcode: SYS_SHUTDOWN

[menu __main __system __sd2]
type: command
name: >> PI SHUTDOWN NOW
gcode: SYS_SHUTDOWN CONFIRM=1

[menu __main __system __save]
type: command
name: Save config? arm
gcode:
    SYS_SAVE_CONFIG

[menu __main __system __save2]
type: command
name: '>> SAVE+RESTART'
gcode:
    SYS_SAVE_CONFIG CONFIRM=1

[menu __main __system __pi]
type: command
name: Pi restart info
gcode: HOST_RESTART_INFO

[menu __main __system __status]
type: command
name: Show status
gcode: SHOW_STATUS

[menu __main __system __host]
type: command
name: Host check
gcode: HOST_CHECK

[menu __main __system __leds]
type: command
name: LEDs: {('ON' if printer['save_variables'].variables.leds_on|default(True) else 'OFF')}
gcode: TOGGLE_LEDS

[menu __main __system __sounds]
type: command
name: Sounds: {('ON' if printer['save_variables'].variables.sound_on|default(True) else 'OFF')}
gcode: TOGGLE_SOUNDS

