type: command
name: Custom (W/H below)
gcode:
    SAVE_VARIABLE VARIABLE=stringart_preset VALUE='""'
    RESPOND MSG="Custom size - set W and H below (60..400mm, clamped to the bed)"

[menu __main __gen __stringart __w]
type: input
name: 'W: {menu.input|round(0)|int}mm'
input_step: 2
input_min: 60
input_max: 400
input: {printer['save_variables'].variables.stringart_w|default(102)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_w VALUE={menu.input|round|int}
    SAVE_VARIABLE VARIABLE=stringart_preset VALUE='""'
    {% set ar = printer['save_variables'].variables.stringart_ar|default(0)|float %}
    {% if printer['save_variables'].variables.stringart_arl|default(1)|int == 1 and ar > 0 %}
        {% set nh = ((menu.input|round|int) / ar)|round(0)|int %}
        {% if nh < 60 %}{% set nh = 60 %}{% endif %}
        {% if nh > 400 %}{% set nh = 400 %}{% endif %}
        SAVE_VARIABLE VARIABLE=stringart_h VALUE={nh}
        RESPOND MSG="ArtisticStrings W {menu.input|round|int}mm -> H {nh}mm (photo aspect locked - the AR Lock row frees it)"
    {% else %}
        RESPOND MSG="ArtisticStrings frame width {menu.input|round|int}mm (RECT only)"
    {% endif %}

[menu __main __gen __stringart __h]
type: input
name: 'H: {menu.input|round(0)|int}mm'
input_step: 2
input_min: 60
input_max: 400
input: {printer['save_variables'].variables.stringart_h|default(152)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_h VALUE={menu.input|round|int}
    SAVE_VARIABLE VARIABLE=stringart_preset VALUE='""'
    {% set ar = printer['save_variables'].variables.stringart_ar|default(0)|float %}
    {% if printer['save_variables'].variables.stringart_arl|default(1)|int == 1 and ar > 0 %}
        {% set nw = ((menu.input|round|int) * ar)|round(0)|int %}
        {% if nw < 60 %}{% set nw = 60 %}{% endif %}
        {% if nw > 400 %}{% set nw = 400 %}{% endif %}
        SAVE_VARIABLE VARIABLE=stringart_w VALUE={nw}
        RESPOND MSG="ArtisticStrings H {menu.input|round|int}mm -> W {nw}mm (photo aspect locked - the AR Lock row frees it)"
    {% else %}
        RESPOND MSG="ArtisticStrings frame height {menu.input|round|int}mm (RECT only)"
    {% endif %}

[menu __main __gen __stringart __arl]
type: input
name: {'AR lock ON ' ~ (printer['save_variables'].variables.stringart_imgwh|default('')|string if printer['save_variables'].variables.stringart_imgwh|default('')|string != '' else '(no img)') if menu.input|round|int == 1 else 'AR lock off'}
input_step: 1
input_min: 0
input_max: 1
input: {printer['save_variables'].variables.stringart_arl|default(1)|int}
gcode:
    SAVE_VARIABLE VARIABLE=stringart_arl VALUE={menu.input|round|int}
    RESPOND MSG="ArtisticStrings aspect lock {'ON - W and H follow the picked photo (the H row updates when you change W, and back)' if menu.input|round|int == 1 else 'OFF - W and H are free (photo presets and custom frames)'}"

[menu __main __gen __stringart __rh]
