# =====================================================================================
#  SD CARD BROWSER (R154, .115) - REAL folder navigation. The stock 'SD Card'
#  menu lists the gcodes ROOT only (Klipper's vsdlist never reads subfolders)
#  and the .113 flat-20 list showed the newest files instead of the folder
#  structure (field report .114: 'I want ALL my files and ALL folders - what
#  is the folder structure worth if the display never shows it'). The watcher
#  pushes the whole tree + the current view (sd_tree / sd_view - 40 entries,
#  folders first marked '>', then files A-Z in the ROOT - in
#  SUBFOLDERS the newest file sits on top (mtime desc, R187). '.. up'
#  leaves a
#  folder, page +/- flips long folders (SDNAV_* macros rebuild the view).
#  A file press runs SDCARD_PRINT_FILE = the same start dialog as the
#  Mainsail print button. R173: the stock Start/Resume/Pause/Cancel items
#  are killed (same-name overrides) - they dead-clicked after a print.
#  R158 (.118): the slots HIDE the .gcode tail before truncating to 15
#  characters - 6 more characters of real name per line, and generated
#  files (Vnn_Name.gcode) keep their running number in the
#  visible zone: two files never look alike again.
# TEMPLATE RULES (learned the hard way): Klipper's jinja uses single-brace
# expressions - and percent-blocks emit a stray closing brace into menu
# names, so every name/enable below is ONE pure expression without blocks,
# and empty dicts are built with the dict() call, never as a brace literal.
# =====================================================================================
# =====================================================================================
#  GEN QUEUE (R236 - .136af field log): the waiting line, live in the MAIN
#  menu. The watcher keeps gen_queue_cnt current (every enqueue / dispatch /
#  finish / clear) - the number DROPS with every finished job, so you always
#  know when your file's turn comes. Only visible while anything waits or
#  builds. Cancel drops everything still PENDING (a running build finishes).
# =====================================================================================
[menu __main __queue]
type: list
enable: {printer['save_variables'].variables.gen_queue_cnt|default(0)|int > 0 or printer['save_variables'].variables.gen_busy|default(0)|int > 0}
name: {'Gen queue: ' ~ (printer['save_variables'].variables.gen_queue_cnt|default(0)|int) ~ (' + building' if printer['save_variables'].variables.gen_busy|default(0)|int else ' waiting')}

[menu __main __queue __show]
type: command
name: 'Now: {printer['save_variables'].variables.gen_queue_cnt|default(0)|int} waiting{(" + 1 building" if printer['save_variables'].variables.gen_busy|default(0)|int else "")}'
gcode:
    RESPOND MSG="[Gen] State: {'building' if printer['save_variables'].variables.gen_busy|default(0)|int else 'idle'} - {printer['save_variables'].variables.gen_queue_cnt|default(0)|int} job(s) waiting. Skip ends the RUNNING job (next one starts), Stop ends it AND clears the queue, Clear drops only the PENDING ones. The count drops with every finished job - the beep you hear per job is its done-sound"

[menu __main __queue __skip]
type: command
enable: {printer['save_variables'].variables.gen_busy|default(0)|int > 0}
name: '> Skip job -> next'
gcode:
    _GEN_QUEUE_SKIP

[menu __main __queue __stop]
type: command
enable: {printer['save_variables'].variables.gen_busy|default(0)|int > 0 or printer['save_variables'].variables.gen_queue_cnt|default(0)|int > 0}
name: '> Stop: job + queue?'
gcode:
    _GEN_QUEUE_STOP

[menu __main __queue __cancel]
type: command
enable: {printer['gcode_macro _STATE'].mode|default('idle')|string not in ('printing', 'paused', 'starting')}
name: '> Clear waiting queue?'
gcode:
    GEN_QUEUE_CANCEL

[menu __main __sdcard]
type: list
enable: {('virtual_sdcard' in printer)}
name: { 'SD: /' ~ printer['save_variables'].variables.sd_path|default('')|string if printer['save_variables'].variables.sd_path|default('')|string else 'SD: root' }

# R173 (.129 field report): Klipper's stock menu.cfg items under __sdcard
# (Start printing / Resume / Pause / Cancel) merge into this list - after a
# print they appeared as dead top entries until reboot. Killed for good:
# same-name overrides with enable off (the documented override mechanism).
[menu __main __sdcard __start]
type: command
name: .
enable: {False}
gcode:
[menu __main __sdcard __resume]
type: command
name: .
enable: {False}
gcode:
[menu __main __sdcard __pause]
type: command
name: .
enable: {False}
gcode:
[menu __main __sdcard __cancel]
type: command
name: .
enable: {False}
gcode:

[menu __main __sdcard __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: SD Card: the G-Codes root + every folder at EVERY depth - root: folders first (marked >), then files A-Z. Inside a folder the NEWEST file is on top. 40 per page, '.. up' leaves a folder, page +/- flips long folders | The list refreshes LIVE - page and folder changes show up immediately. Rows showing a single dot are free slots (the folder has fewer files than the page) | The .gcode tail is hidden to give the name 6 more characters. Generated files show their running number first (V-number) - two files never look alike | A file press = the usual start dialog (AS SLICED / AS LEGACY). Images and text pick the PLOTTER flow. The list builds right after boot (takes a minute, retries automatically) - Mainsail shows the same folders anytime"

# visible fallback while the tree has not arrived yet (push failed during
# an update restart - must never look like a dead menu again)
[menu __main __sdcard __none]
type: command
name: List empty - info
enable: { printer['save_variables'].variables.sd_view|default([])|length == 0 }
gcode:
    RESPOND MSG="The folder tree is pushed by the r2-postproc watcher - right after a boot/update it can take a minute (it retries automatically). If it stays empty: System > Restart host, then come back"
    RESPOND MSG="Mainsail always shows every file and folder of the G-Codes root directly"

# R175d (.130): delete mode - clean up right in the browser (generators
# folder, optimized/, anything on the card). Two presses per entry,
# folders take everything inside, only under the G-Codes root.
[menu __main __sdcard __del]
type: command
name: {('DEL ON: 2x press' if printer['save_variables'].variables.browser_del_on|default(False) else 'Del mode: off')}
gcode:
    {% set sv = printer['save_variables'].variables %}
    {% if sv.browser_del_on|default(False) %}
        SAVE_VARIABLE VARIABLE=browser_del_on VALUE=False
        SAVE_VARIABLE VARIABLE=del_arm VALUE="\"\""
        RESPOND MSG="Delete mode OFF - pressing entries navigates and prints again"
        M117 Del mode OFF
    {% else %}
        SAVE_VARIABLE VARIABLE=browser_del_on VALUE=True
        RESPOND MSG="Delete mode ON: press an entry TWICE to delete it (a folder takes everything inside). '.. up' still navigates - press here to leave this mode"
        M117 Del mode ON
    {% endif %}

[menu __main __sdcard __up]
type: command
name: .. up one folder
gcode:
    SDNAV_UP

[menu __main __sdcard __home]
type: command
name: .. to the root
gcode:
    SDNAV_HOME

[menu __main __sdcard __pgd]
type: command
name: { '<< page ' ~ printer['save_variables'].variables.sd_page|default(0)|int }
gcode:
    SDNAV_PAGE DELTA=-1

[menu __main __sdcard __pgu]
type: command
name: { 'page ' ~ (printer['save_variables'].variables.sd_page|default(0)|int + 1) ~ ' >>' }
gcode:
    SDNAV_PAGE DELTA=1

