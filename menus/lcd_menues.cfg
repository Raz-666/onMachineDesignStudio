[menu __main __gen __angle __how]
type: command
name: How it works
gcode:
    RESPOND MSG="How it works: Angles: Mode, then Settings (angle 30..170, legs, width, holes) - Create builds the file and selects it | Flat splice: straight strip for two boards side by side - Left/Right = the two halves, SAME hole pattern on both | Holes auto-arrange along the leg, the diameter clamps to the width and the count drops if the leg is too short (see result message) | Countersink = flush flat-head screws. Rib = corner gusset for stiff angles. Every plate is an exclude object | Mainsail: GEN_ANGLES ANGLE=90 LEG_A=60 LEG_B=60 WIDTH=25 HOLES=2 HOLE_D=4 CS=1 STIFFENER=1 FLAT=0"

