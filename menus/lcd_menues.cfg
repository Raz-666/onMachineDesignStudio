# =====================================================================================
#  ANGLES + FLAT CONNECTORS (R86, in the Tools menu)
#  Angle plates (any angle, unequal legs, gusset rib) and flat board splices.
#  Create bumps angle_nonce, the r2-postproc watcher builds the file (beeps +
#  selects). Holes auto-arrange and auto-clamp - never wider than the leg.
#  Needs [include klipper-e3-r2d2/macros/17_generator.cfg].
# =====================================================================================
[menu __main __gen __angle]
type: list
name: Angles+Flat
enable: {'gcode_macro _GENERATORS' in printer}

[menu __main __gen __angle __info]
type: command
name: Info
gcode:
    ANGLE_INFO

# mode: angle bracket (L-shape, any angle) or flat connector (two boards
# side by side, both halves share the SAME hole pattern)
[menu __main __gen __angle __mode]
type: list
name: {'Mode: ' ~ ('Flat' if printer['save_variables'].variables.angle_flat|default(False) else 'Angle')}

[menu __main __gen __angle __mode __ang]
type: command
name: Angle (L){ '*' if not printer['save_variables'].variables.angle_flat|default(False) else '' }
gcode:
    SAVE_VARIABLE VARIABLE=angle_flat VALUE=False
