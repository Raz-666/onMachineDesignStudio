[menu __main __preprint __defs __save]
type: command
name: Save as Default
gcode:
    SAVE_DEFAULT_PRESET

[menu __main __preprint __defs __info]
type: command
name: List (console)
gcode:
    DEFAULT_PRESETS_INFO

[menu __main __preprint __defs __l1]
type: command
name: Load 1
enable: {printer['save_variables'].variables.default_preset_1|default(0) != 0}
